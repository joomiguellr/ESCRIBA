<style>

*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px;white-space:nowrap}.brand svg{width:30px;height:30px}.brand small{display:block;font-weight:400;color:var(--mut);font-size:11px;line-height:1}

.bar{height:8px;background:#e9eff3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.opt{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font:inherit;cursor:pointer;font-size:15px}.opt.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}.opt.good{background:var(--okb);border-color:#9ccfb2;color:var(--ok)}.opt.bad{background:var(--erb);border-color:#e3aaa9;color:var(--er)}.opt.miss{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.mut{color:var(--mut);font-size:13.5px}.pz{margin-top:30px}.pz summary{cursor:pointer;color:var(--ac);font-weight:600;padding:8px 0}
.lnk{color:var(--ac);cursor:pointer;font-size:13px;border:0;background:none;padding:0;font-family:inherit}

290","Alto (art. 271 e quórum de 2/3)"]]}]},{"id":"s1","title":"0 · A. Recorte cobrado: o que estudar primeiro","tag":"","b":[{"k":"p","t":"DE ONDE VEM ESTE RECORTE Os slides da NEAF “Regimento Interno do Tribunal de Justiça” (versão de 04/05/2026, Aulas 1 a 10 · trabalham apenas os dispositivos abaixo, que formam o recorte de Legislação Interna preparado para o concurso de Escrevente. Confira no edital do seu concurso (prova de 14/03/2027 · se o recorte é exatamente este. Se o edital trouxer o Regimento inteiro, as seções marcadas “fora do recorte” voltam a ser obrigatórias.","box":1},{"k":"tbl","rows":[["Bloco","Artigos no recorte","Fica de fora","Seções deste material"],["Disposição inicial e composição","1º a 3º","—","1"]]},{"k":"tbl","rows":[["Tribunal Pleno","4º a 7º","—","2"],["Órgão Especial","8º a 12 e 14","Art. 13 (lista de competências do OE","3"],["CSM","15 e 16","Art. 43 (quórum, só leitura complementar)","4"],["Direção e cúpula","17 a 25","—","5"],["Presidente, Vice, Corregedor e Decano","28, §§1º e 2º · 29","Arts. 26 e 27 e incisos do art. 28","6"],["Ouvidoria","29 · A a 29 · F","—","6 · A"],["Seções, Câmaras, Comissões, Desembargadores","—","Arts. 30 a 72","7, 8, 9"],["Juízes","73 e 74 · 98 a 102","Arts. 75 a 97","10"],["Competência e impedimento","103 e 104 · 111 a 115","Arts. 105 a 110 (prevenção, juiz certo)","11"],["Sessões e atas","116 a 122","Arts. 123 a 151 (pauta, ordem dos trabalhos, sustentação oral)","12, 13"],["Votação","152 a 154","Arts. 155 a 249","14 a 17"],["Recursos","250 a 256","Arts. 257 a 270","18, 19"],["Atos administrativos e reforma","271 a 279","Arts. 280 a 290","20"]]},{"k":"p","t":"Como usar as marcas Prioridade de estudo dentro do recorte ★ NO RECORTE a seção inteira está no recorte. 1. Composição e competências: Pleno, OE, CSM (arts. PARCIAL só parte dos artigos está no recorte (veja 2º a 16 · . ◐ a tabela acima). 2. Eleições e substituições · 17 a 25 · e Ouvidoria · 29 · A ○ FORA leitura complementar; estude se sobrar a 29 · F · . tempo ou se o edital trouxer o Regimento inteiro. 3. Vitaliciamento · 74 · e disciplina dos juízes · 98 a Nas questões, o símbolo ★ no tema indica que o assunto está 102 · . no recorte. 4. Impedimento e suspeição · 111 a 115 · e sessões e atas · 116 a 122 · . 5. Votação · 152 a 154 · , agravo regimental · 250 a 256 · e atos e reforma · 271 a 279 · ."},{"k":"p","t":"CUIDADO COM RESUMOS DESATUALIZADOS Alguns quadros-resumo em circulação ainda trazem redações anteriores às mudanças de 2026","box":1},{"k":"p","t":"• Ouvidoria: “o 1º mais votado é Ouvidor e o 2º, Substituto” é a regra antiga. Desde o Assento 595/2026, a eleição é por chapa de 2 desembargadores, e a chapa mais votada leva os dois cargos (art. 29 · A, §4º). O texto fala em uma reeleição, e não em “recondução”."},{"k":"p","t":"• Vitaliciamento: “o CSM avalia o juiz não vitalício e dá parecer ao OE nos últimos 90 dias de estágio” é a lógica antiga. Pelo Assento 593/2026, quem conduz o processo é a Corregedoria Geral, que emite o parecer conclusivo; o CSM aprecia esse parecer e se manifesta; e o OE decide até 90 dias após os 2 anos (art. 74, §§1º, 5º e 6º)."},{"k":"p","t":"• Remoção de desembargador (art. 60, Assento 594/2026 · e remoção antes de promoção (art. 82, Assento 596/2026 · são posteriores à apostila da NEAF, mas estão fora do recorte.)"}]},{"id":"s2","title":"0 · B. Novidade: Assento Regimental nº 597/2026","tag":"","b":[{"k":"p","t":"DJE 22/10/2026 · vigência imediata ✚ O QUE MUDOU E POR QUÊ A Resolução OE nº 1.027/2026 extinguiu as Subseções de Direito Privado 1, 2 e 3, unificou a Seção de Direito Privado, criou 4 Câmaras Especializadas de Família e Sucessões e manteve as Câmaras Reservadas de Direito Empresarial. Com isso, o Grupo Especial de Direito Privado deixou de existir e o RI foi ajustado pelo Assento 597/2026 (assinado em 21/10/2026 pelo Presidente Francisco Eduardo Loureiro). Todos os artigos alterados estão fora do recorte NEAF (seção 0 · A · , mas a banca pode usar a novidade em questão de “texto atualizado”."},{"k":"tbl","rows":[["Artigo","Como era","Como ficou"],["31","Turma Especial = os 2 mais antigos de cada Câmara ordinária da Seção ou Subseção; podia reduzir para 1 por Câmara.","Público e Criminal: o mais antigo · 1 suplente de cada Câmara ordinária (no Público, também de cada Câmara Reservada ao Meio Ambiente). Privado · I · · o mais antigo · 1 suplente de cada Grupo de Câmaras de competência geral, do Grupo de Câmaras Reservadas de Direito Empresarial e de cada Grupo de Família e Sucessões. §1º recusa → os seguintes na antiguidade, vedada a recusa que comprometa a representação · §2º antiguidade dentro da Câmara ou Grupo · §3º Família e Sucessões: antiguidade no cargo de desembargador (cadeiras providas ao mesmo tempo)."],["32","Competências da Turma; §1º Grupo Especial · 9 membros) julgava conflitos entre Subseções.","Turmas Especiais de Privado, Público e Criminal: I uniformização (pacificação ou IRDR) em matéria exclusiva da Seção · II IAC (art. 947 CPC · · III dúvidas e conflitos entre suas Câmaras e Grupos e com/entre as Turmas do Núcleo de Justiça 4.0 em 2º Grau · Res. OE 927/2024 · · IV reclamações contra seus acórdãos. §1º I e II são exclusivos de 5 Grupos especializados (quadro abaixo) · §2º os membros vindos dessas Câmaras não participam da Turma Especial em I, II e reclamações correlatas nas matérias exclusivas de suas Câmaras."],["42","Convocação de outro órgão da mesma Seção, Subseção ou Grupo.","“outro órgão da mesma Seção ou Grupo” (sai “Subseção”)."],["46, §4º","Membros não natos indicados pelo Presidente, aprovados pelo OE, com produção compatível com a média.","Igual, mas a média agora é a “dos julgadores de igual competência”."],["190","Enunciados: Turmas Especiais, Grupos (art. 32, §4º) ou OE.","Enunciados: Turmas Especiais e Grupos especializados/reservados do art. 32, §1º, ou OE (matéria constitucional, sua competência, Juizados, Câmara Especial, não exclusiva ou divergência). Súmula continua exclusiva do OE. §3º relator: se possível, o do acórdão de origem; senão, livre distribuição (no OE entre seus membros; nas Turmas e Grupos entre integrantes de Câmaras de competência correlata)."],["191","Maioria simples e voto de qualidade.","Mantém maioria simples e voto de qualidade; §2º Turmas Especiais de Privado, Público e Criminal: maioria simples também em IRDR/IAC · §3º relator nas Turmas e Grupos do 32 §1º: membro de Câmara de competência correlata · §4º IAC segue as regras do IRDR."]]},{"k":"tbl","rows":[["192","Propõem súmula: desembargadores do OE, Turmas Especiais e Comissão de Jurisprudência.","§1º súmula ao OE · desembargadores do OE, Turmas Especiais, Grupos do 32 §1º ou Comissão de Jurisprudência · §2º enunciado: ao OE, à Turma Especial ou aos Grupos do 32 §1º · §3º IRDR no OE, nas Turmas ou nesses Grupos · §4º revogado."],["200","OE, ou Turmas Especiais se restrito a uma Seção ou Subseção.","OE se o conflito envolver órgãos vinculados a mais de uma Seção; dentro da Seção, a Turma Especial (art. 32, III · . Suscitam: Presidentes de Seção, órgãos fracionários, MP, parte, terceiro prejudicado.)"],["285","Disposição transitória das Subseções I, II e III de Direito Privado.","Revogado."]]},{"k":"p","t":"Os 5 Grupos do art. 32, §1º (uniformização e IAC Regra de transição (art. 10, p. ú.) exclusivos) · Vigência: na data da publicação. 1. Grupo Especial de Câmaras de Direito Ambiental · IRDR, IAC, dúvidas, conflitos e reclamações já 2. 7º Grupo de Direito Público — Tributos Municipais distribuídos ficam com os mesmos relatores — 3. 8º Grupo de Direito Público — Acidentes do vedada a redistribuição. Trabalho · Os relatores concluem os casos ainda que não 4. Grupo de Câmaras Reservadas de Direito integrem a nova composição (são convocados para Empresarial isso). 5. Grupo de Câmaras Reunidas de Família e Sucessões · 1º · 2º Grupos)"},{"k":"p","t":"MACETE — “ANTES DOIS, AGORA UM + SUPLENTE” Turma Especial: antes eram os 2 mais antigos de cada Câmara; agora é 1 (o mais antigo) · 1 suplente. No Privado, a unidade de representação passou a ser o Grupo, não a Câmara. Os 5 Grupos do 32 §1º: “AMbiente, MUnicípio, ACidente, EMpresa e FAmília” — o 7º Grupo é o dos tributos Municipais · 7 · M de Município, “sete Municípios”) e o 8º o dos Acidentes do trabalho (“oito horas de trabalho”).","box":1},{"k":"p","t":"PEGADINHAS DA NOVIDADE","box":1},{"k":"p","t":"• “O Grupo Especial de Direito Privado dirime conflitos entre as Subseções” → ERRADO · Grupo Especial e Subseções foram extintos; art. 285 revogado."},{"k":"p","t":"• “A Turma Especial edita súmulas” → ERRADO: súmula continua exclusiva do OE; a Turma aprova enunciados e julga IRDR/IAC."},{"k":"p","t":"• “Com a nova composição, os processos já distribuídos serão redistribuídos” → ERRADO: vedada a redistribuição. · Não confunda o Grupo Especial de Câmaras de Direito Ambiental (existe, art. 32 §1º) com o extinto Grupo Especial de Direito Privado."}]},{"id":"s3","title":"1. Composição do Tribunal","tag":"★","b":[{"k":"p","t":"TRIBUNAL PLENO todos os desembargadores ▼ elege Órgão Especial Conselho Superior da Magistratura Presidente · Vice · Corregedor Ouvidoria 25 desembargadores 7 membros direção incluída em 2024 ▼ Seções Presidentes das Seções Turmas Especiais Grupos de Câmaras Criminal · Privado · Público cúpula de cada Seção 2 Câmaras Câmara Especial Câmara Especial de Presidentes Câmaras fora das Seções fora das Seções ordinárias, especializadas, reservadas Comissões Desembargadores permanentes e temporárias"},{"k":"tbl","rows":[["Ponto","Regra"],["Subseções (§1º)","O Órgão Especial pode criar Subseções no âmbito das Seções apenas para divisão de competência e formação das Turmas Especiais. ✚ 2026 As Subseções de Direito Privado 1, 2 e 3 foram extintas pela Res. OE 1.027/2026 (o poder do §1º continua no texto)."],["Sessões × reuniões (§2º)","Funcionam por sessões ordinárias e extraordinárias · Órgão Especial, CSM, Turmas Especiais, Grupos, Câmara Especial e Câmara Especial de Presidentes. As Comissões funcionam por reuniões."],["Assentos (art. 3º)","O Presidente do Tribunal tem assento especial. Nos colegiados, o mais antigo da lista geral senta na 1ª cadeira à direita do presidente, o seguinte na 1ª à esquerda, e assim sucessivamente. Os eleitos para o OE sentam após a classe da antiguidade, a partir do mais votado. Os reeleitos mantêm as cadeiras."]]},{"k":"p","t":"MACETE — SESSÃO × REUNIÃO “Comissão se reúne, colegiado se senta.” Só as Comissões funcionam por reuniões; os órgãos julgadores e o CSM funcionam por sessões.","box":1}]},{"id":"s4","title":"2. Tribunal Pleno","tag":"★","b":[{"k":"tbl","rows":[["O Pleno (todos os desembargadores) ELEGE"],["I · o Presidente, o Vice-Presidente e o Corregedor Geral;"],["II · 12 desembargadores do Órgão Especial e seus suplentes;"],["III · o Diretor, o Vice-Diretor e o Conselho Consultivo e de Programas da EPM;"],["IV · os desembargadores substitutos do TRE (classe dos magistrados)."]]},{"k":"tbl","rows":[["Funcionamento do Pleno",""],["Convocação","Pelo Presidente, com edital no órgão oficial; se ele se omitir, pelo Vice-Presidente."],["Mesa","Presidente · Vice · Corregedor + 1 ou 2 dos mais modernos presentes, que secretariam a sessão."],["Substituição na Mesa","Vice · Corregedor → desembargador mais antigo presente."]]},{"k":"tbl","rows":[["Questões de ordem","Resolvidas de imediato pelo Presidente, ouvidos o Vice e o Corregedor. Qualquer desembargador pode pedir que conste em ata protesto contra ato da Mesa."]]},{"k":"p","t":"MACETE — O PLENO É A “URNA” No Regimento, o Pleno só elege: os 3 dirigentes, os 12 do OE, a EPM e o TRE. Grave “3 · 12 · EPM · TRE”. Se a alternativa disser que o Pleno julga alguma coisa, desconfie. Quem secretaria a Mesa são os mais modernos; quem assume a presidência na falta dos dirigentes é o mais antigo.","box":1},{"k":"p","t":"PEGADINHA Os juízes do TRE da classe dos magistrados: o Pleno elege os desembargadores substitutos (art. 4º, IV · ; o Órgão Especial elege os juízes substitutos, aprecia reconduções e indica os da classe dos advogados (art. 13, II, “d”).","box":1}]},{"id":"s5","title":"3. Órgão Especial","tag":"◐","b":[{"k":"p","t":"Composição Quórum e vagas Regras dos eleitos 25 desembargadores: · Instala-se com no mínimo 13 · Qualquer desembargador pode"},{"k":"p","t":"• membros natos: Presidente, Vice desembargadores (art. 11 · , que é a se candidatar, mediante inscrição e Corregedor (cada um na sua maioria absoluta de 25. prévia. classe); · Abriu vaga: o Presidente · O suplente é obrigado a"},{"k":"p","t":"• classe da antiguidade; convoca eleição em 15 dias, com substituir, salvo impedimento ou"},{"k":"p","t":"• classe dos eleitos (12, eleitos edital publicado com 20 dias de justificativa; a recusa implica pelo Pleno). antecedência. perda da suplência. A 5ª cadeira (quinto · O eleito assume no dia imediato · A suplência não conta como constitucional) é ocupada ao da eleição. exercício efetivo de mandato para alternadamente por oriundos do · Empate na ordem das cadeiras: fins de elegibilidade. MP e da Advocacia. antiguidade no cargo e, depois, · Na classe da antiguidade, o idade. desembargador não pode recusar a convocação para substituir (art. 9º). Art. 12. O OE pode examinar proposta administrativa arquivada pelo Presidente se, por maioria simples, acolher representação de qualquer integrante. Também cabe quando o Presidente não incluir em pauta em 15 dias a proposta pronta, ou para preservar a competência do OE ou reexaminar matéria administrativa relevante. Art. 14. O OE pode reduzir, suspender ou interromper a distribuição a seus integrantes dos processos das Câmaras, por prazo determinado ou indeterminado."},{"k":"h","t":"Competência jurisdicional originária do Órgão Especial (art. 13, I)"},{"k":"tbl","rows":[["al.","Processa e julga originariamente…"],["a","autoridades e matérias atribuídas ao TJ pela CF, pela CE/SP e pela lei, ressalvada a competência de órgão fracionário"],["b","MS e HD contra ato do próprio OE, do CSM e de seus integrantes, das Turmas Especiais, da Câmara Especial e de seus relatores, dos Presidentes das Comissões de Concurso da Magistratura e de Outorga de Delegações e do Coordenador da DEPRE"],["c","MI · CE/SP · quando a omissão for do Governador, da Mesa e do Presidente da ALESP, do CSM, do PGJ, do Prefeito da Capital, da Mesa e do Presidente da Câmara Municipal da Capital"]]},{"k":"tbl","rows":[["d","incidentes de inconstitucionalidade"],["e","conflitos de competência entre órgãos do Tribunal de Seções diversas"],["f","conflitos de atribuição entre autoridades judiciárias e administrativas quando interessados Governador, Secretário de Estado, Mesa ou Presidente da ALESP, Prefeito da Capital, Presidente do TCE ou PGJ"],["g","arguições de impedimento ou suspeição de desembargador"],["h","ED contra seus acórdãos; rescisórias de seus acórdãos e dos acórdãos das Turmas Especiais"],["i / j","agravos internos e regimentais em seus processos; reclamações para garantir seus julgados e preservar sua competência"],["k","ações civis do PGJ para perda do cargo e cassação de aposentadoria ou disponibilidade de membro do TJ, do TJM, de demais magistrados e de membros vitalícios do MP"],["l / m","dissídios coletivos de greve (arts. 239 e ss.); súmulas, IAC e IRDR em matéria de sua competência ou não exclusiva de uma Turma Especial"]]},{"k":"h","t":"Competência administrativa do Órgão Especial"},{"k":"h","t":"(art. 13, II · · as mais cobráveis)"},{"k":"tbl","rows":[["Compete ao OE…","Detalhe que cai"],["pedir intervenção da União no Estado ou do Estado nos Municípios","quem formaliza o pedido ao STF é o Presidente, após resolução do OE (art. 259)"],["estabelecer regras das eleições de direção e cúpula e do concurso da Magistratura","—"],["aprovar projetos de lei do Judiciário; propor aumento ou redução do número de desembargadores","—"],["instaurar e decidir processo disciplinar contra magistrado e afastamento preventivo","a sindicância contra juiz é do Corregedor; contra (art. 16)","Compete ao CSM (continuação)"],["I · oferecer ao OE as listas de promoção dos juízes e opinar sobre remoção e permuta","X · aprovar, com referendo do OE, os juízes assessores (convocação por 2 anos, prorrogável; vedado parente até o 3º grau)"],["II · apresentar ao OE as listas do quinto · MP e advogados)","XII · instaurar a verificação de invalidez de magistrado"],["III · apreciar suspeição por foro íntimo de juiz de 1º grau","XIII · julgar recursos de candidatos a concursos de servidores"],["IV · julgar dúvidas de serventuários dos Registros Públicos","XIV · autorizar retratos, quadros e placas e nomear salas internas (vedada pessoa viva), ouvida a Comissão de Honraria"],["VIII · julgar recursos sobre inscrição no concurso da Magistratura","XV · aprovar a suspensão do expediente nos feriados municipais do interior"],["IX · aprovar o quadro geral de antiguidade dos juízes e decidir as reclamações","XVI · propor a instalação de juizados especiais e turmas recursais"]]},{"k":"p","t":"SUBSTITUIÇÃO OCASIONAL NO CSM (ART. 15, §1º) — ORDEM DO CAPUT Presidente (preside) → Vice-Presidente → Corregedor → Decano · Presidentes das Seções, pela antiguidade entre eles. No impedimento não ocasional, o Presidente é substituído pelo substituto regimental do art. 24 (Vice e, na falta, Decano)."},{"k":"p","t":"MACETE — “CSM = OS 3 + O DECANO + OS 3” 3 dirigentes · Decano · 3 Presidentes de Seção = 7. Quórum “2 · 2” · 2 de direção e mais 2 membros. O CSM prepara e opina (listas, pareceres) e o OE decide (promoção, remoção, vitaliciamento).","box":1},{"k":"p","t":"PEGADINHA — PRÉDIO × SALA Nome de fórum ou prédio, estátua ou busto: Órgão Especial, ouvidos a Comissão de Honraria e o CSM. Nome de sala ou dependência interna, retratos e placas: CSM, ouvida a Comissão de Honraria. Nos dois casos é vedada referência a pessoa viva.","box":1}]},{"id":"s7","title":"5. Cargos de direção e de cúpula — eleições e substituições","tag":"★","b":[{"k":"tbl","rows":[["Classificação","Cargos","Quem elege"],["DIREÇÃO","Presidente, Vice-Presidente, Corregedor Geral","Tribunal Pleno"]]},{"k":"tbl","rows":[["CÚPULA","Presidentes das Seções · Criminal, Privado, Público)","A própria Seção, no mesmo dia"]]},{"k":"h","t":"Linha do tempo da eleição"},{"k":"tbl","rows":[["Momento","Regra"],["Data","2ª quarta-feira de novembro do ano em que terminam os mandatos, sob a presidência do Presidente do Tribunal (art. 17 · .)"],["25 dias antes","Abre-se o prazo de 10 dias para renúncia expressa dos elegíveis. Para a Seção, é o mesmo prazo para inscrição (art. 20 · .)"],["Convocação","Por ofício ou meio eletrônico, informando candidatos e renunciantes."],["Votação","Secreta e, preferencialmente, eletrônica (art. 22 · .)"],["1º escrutínio","Exige maioria absoluta dos integrantes efetivos do Tribunal."],["2º escrutínio","Concorrem os 2 mais votados; vence quem obtiver a maioria dos votantes, computados brancos e nulos. Nas Seções basta maioria simples."],["Ninguém eleito","Nova eleição em no máximo 5 dias, sem os dois; convidam-se os seguintes na ordem de antiguidade. Vale também para candidato único."],["Empate","Vence o mais antigo."],["Vacância no curso","Eleição para o período restante, na forma do art. 10, §1º (15 dias e edital de 20 dias). Não há eleição se restarem menos de 6 meses: aplica-se a substituição regimental."],["Posse","O Presidente comunica a posse às cortes superiores, aos tribunais e aos demais Poderes."]]},{"k":"h","t":"Substituições (art. 24)"},{"k":"tbl","rows":[["Titular ausente ou impedido","Substituto"],["Presidente","Vice-Presidente → na falta, o Decano"],["Vice-Presidente / Corregedor","Decano → o seguinte na antiguidade (admitida recusa)"],["Mais de uma substituição","O Decano assume a Presidência ou a Vice, nessa ordem; para a substituição seguinte convoca-se o integrante eleito do OE (pela precedência de votação)"],["Presidente de Seção","O mais antigo da Seção → o seguinte (admitida recusa)"],["Vedação","O desembargador eleito para o TRE (efetivo ou convocado) não pode substituir em cargo de direção ou cúpula."]]},{"k":"p","t":"O substituto que assume cargo de direção ou cúpula fica afastado das funções jurisdicionais regulares, ressalvados os processos vinculados, a jurisdição no OE e as funções administrativas. Os titulares de direção e cúpula e o Decano exercem apenas a jurisdição própria do cargo, salvo os votos no OE e as vinculações anteriores (art. 25 · .)"},{"k":"p","t":"MACETE — ELEIÇÃO “2-25-10-5” 2ª quarta de novembro · 25 dias antes abre prazo de 10 dias para renúncia · nova eleição em até 5 dias. Vaga no meio do mandato: “15 para convocar, 20 de edital, nada abaixo de 6 meses”.","box":1},{"k":"p","t":"PEGADINHA — MAIORIAS 1º escrutínio: maioria absoluta dos integrantes efetivos (não dos presentes). 2º escrutínio (direção): maioria dos votantes, contando brancos e nulos. 2º escrutínio · Seção): maioria simples.","box":1}]},{"id":"s8","title":"6. Presidente, Vice-Presidente, Corregedor Geral e Decano","tag":"◐","b":[{"k":"tbl","rows":[["Tema","Presidente (art. 26)","Vice-Presidente (art. 27)","Corregedor Geral (art. 28)"],["Foco","Administração do Tribunal e do Judiciário; 2º grau e desembargadores","Substituir o Presidente; distribuição no OE; dissídio de greve","1ª instância, juízes, serventias, cartórios e delegações notariais"],["Sindicância","contra desembargadores (instrutor e relator até arquivamento ou PAD","—","contra juízes; e contra titulares e servidores de notas e registros"],["Antes da distribuição","No OE decide: assistência judiciária, suspeição de servidor ou perito, deserções e desistências, incidentes urgentes","Preside a distribuição do OE; na urgência despacha MS, HC e HD contra ato do Presidente e do Corregedor","Superintende a distribuição na 1ª instância"],["Execução dos julgados do OE","quando houver interesse das Fazendas Públicas e autarquias","demais causas (exceto as da Fazenda)","—"],["Relator","suspeição e impedimento de desembargador; com voto nos agravos de suas decisões; reclamações sobre antiguidade; excesso de prazo de desembargador; proposta orçamentária","com voto, nos agravos contra suas decisões","—"],["Prazos e datas","Relatório anual ao OE até a última sessão ordinária de fevereiro (ainda que tenha deixado o cargo)","—","Relatório das correições ao OE no fim do 1º ano e do mandato; publica os corregedores permanentes na 2ª quinzena de janeiro"],["Outros destaques","Suspensão de segurança ou liminar; admissibilidade de RE e REsp em processo do OE; lista de antiguidade em 5 partes por entrância; licitações e contratos; poder de polícia; sequestro de rendas","Secretaria o CSM; integra e preside comissão permanente","Correições gerais, ordinárias e extraordinárias (pode dispensar editais); interdição de cadeias; audiências públicas; pode delegar função correcional a desembargador"]]},{"k":"p","t":"Decano (art. 29 · Exerce as substituições; desempenha atribuições delegadas pelos cargos de direção (com aprovação do CSM e referendo do OE · , exceto as intrínsecas ao cargo; integra comissão permanente. Preside a Comissão de Jurisprudência e integra o CSM e a Câmara Especial.)"},{"k":"p","t":"MACETE — DE QUEM É O MS? Contra ato do Presidente ou do Corregedor, até a distribuição e na urgência, despacha o Vice (art. 27, I, “c”). Execução de julgado do OE · “Fazenda é com o Presidente; o resto é com o Vice”.","box":1}]},{"id":"s9","title":"6 · A. Ouvidoria","tag":"★","b":[{"k":"p","t":"A a 29 · F · Assentos 589/2024 e 595/2026 NOVIDADE LEGISLATIVA — FORTE CANDIDATA A CAIR"},{"k":"tbl","rows":[["Quem elege","O Órgão Especial elege o Ouvidor e seu Substituto, garantida a participação de todos os desembargadores nos pleitos."],["Mandato","2 anos, coincidente com o do Presidente do TJ; uma reeleição."],["Quando","Na última sessão antes das eleições de direção e cúpula, precedida de edital de 10 dias para inscrições."],["Chapa","2 desembargadores · Ouvidor · Substituto); vence a mais votada. Empate: antiguidade do candidato a Ouvidor e, persistindo, a do candidato a Substituto."],["Vedações","Não pode acumular com cargos diretivos nem com a função de juiz assessor. Não pode exercer a função por mais de 4 anos consecutivos; nova eleição só depois do intervalo de um mandato."],["Sem interessados","Excepcionalmente, o Presidente do Tribunal indica o Ouvidor e o Substituto."],["Natureza","Órgão autônomo, da alta administração, com independência funcional, atuando em regime de cooperação. Missão e competência: arts. 4º e 5º da Resolução CNJ 432/21."],["Acesso","A todas as áreas do TJ e das Comarcas; magistrados e servidores devem prestar informações em caráter prioritário e emergencial."],["Dirige ainda","O SIC · Serviço de Informação ao Cidadão) e a Ouvidoria da Mulher · Portaria 10.567/2025 · ; o Substituto pode auxiliar."]]},{"k":"p","t":"○ FORA DO RECORTE 30 a 45"}]},{"id":"s10","title":"7. Seções e órgãos fracionários","tag":"","b":[{"k":"p","t":"arts."},{"k":"tbl","rows":[["Órgão","Composição","Competência principal"],["Seções · 3","Criminal, Privado e Público, representadas por seus Presidentes e formadas por Turmas Especiais, Grupos, Câmaras e desembargadores","O OE fixa por resolução a competência de cada Seção"],["Turmas Especiais ✚ Assento 597","Público/Criminal: o mais antigo · 1 suplente de cada Câmara ordinária · Público: também de cada Câmara Reservada ao Meio Ambiente). Privado: o mais antigo · 1 suplente de cada Grupo (competência geral, Empresarial, Família e Sucessões). Recusa → seguintes na antiguidade, vedada a que comprometa a representação. Antiguidade contada na Câmara ou Grupo.","· I · Uniformização (pacificação e IRDR) e · II · IAC em matéria exclusiva da Seção; · III · dúvidas e conflitos entre suas Câmaras e Grupos e com/entre as Turmas do Núcleo de Justiça 4.0; · IV · reclamações contra seus acórdãos. I e II nas matérias dos 5 Grupos do §1º: exclusivos desses Grupos"],["Grupos especializados (art. 32, §1º) ✚ Assento 597","Grupo Especial de Câmaras de Direito Ambiental · 7º Grupo de Público · Tributos Municipais) · 8º Grupo de Público · Acidentes do Trabalho) · Grupo de Câmaras Reservadas de Direito Empresarial · Grupo de Câmaras Reunidas de Família e Sucessões · 1º + 2º)","Uniformização e IAC exclusivos em suas matérias. O antigo Grupo Especial de Direito Privado · 9 membros, conflitos entre Subseções) foi extinto."],["Câmara Especial","Presidida pelo Vice-Presidente, com os Presidentes das Seções e o Decano","Suspeição e impedimento de juiz de 1º grau; conflitos de competência entre juízes e de atribuição; agravo de instrumento em exceção de incompetência; Infância e Juventude; recursos contra decisões originárias do Corregedor em processos disciplinares de serventias, delegados e oficiais de justiça"]]},{"k":"tbl","rows":[["Câmara Especial de Presidentes","Presidida pelo Presidente do TJ, com o Vice e os Presidentes das Seções","Agravos internos contra decisões das Presidências que negam seguimento a RE e REsp ou os sobrestam; agravos regimentais contra decisões dos Presidentes de Seção; reclamação por descumprimento de tutela de urgência em RE e REsp. Relator: o prolator da decisão impugnada"],["Câmaras","Designação ordinal, 5 desembargadores cada; julgam em turma de 3 (ou 5","Recursos contra decisões de 1º grau, ED, embargos infringentes criminais, rescisórias, reclamações, agravos internos, HC, MS e demais originários"],["Grupos de Câmaras","Reunião de 2 Câmaras em ordem crescente; se o número for ímpar, o 1º ou o último grupo terá 3","O que exceder a competência das Câmaras: MS contra atos das Câmaras, rescisórias, revisões criminais, reclamações e ED"],["Câmaras temporárias","Criadas pelo OE; titulares e 3 suplentes designados pelo Presidente após eleição pelo OE","Matérias reservadas (ex. · Falência e Recuperação, Meio Ambiente, art. 284"]]},{"k":"p","t":"MACETE — AS DUAS “CÂMARAS ESPECIAIS” Câmara Especial = Vice + Presidentes de Seção + Câmara Especial de Presidentes = só presidentes: o do Decano. Ambas ficam desvinculadas das Seções (art. 30 · .)","box":1},{"k":"h","t":"Suspeição e impedimento: quem julga?"},{"k":"p","t":"→ “VPD”, presidida pelo Vice. do TJ (que preside), o Vice e os das Seções. Não tem"},{"k":"tbl","rows":[["Situação","Órgão"],["Impedimento ou suspeição de desembargador","Órgão Especial (art. 13, I, “g”); relator: Presidente do TJ"],["Impedimento ou suspeição de juiz de 1º grau","Câmara Especial (art. 33, p.ú., I)"],["Suspeição de juiz de 1º grau por foro íntimo","CSM (art. 16, III)"],["Suspeição de servidor ou perito em processo do OE, antes da distribuição","Presidente do TJ (art. 26, I, “a”, 2)"],["Arguição contra MP, servidores e auxiliares no Tribunal","Aplicam-se, no que couber, as mesmas regras (art. 115)"]]},{"k":"h","t":"Quóruns de julgamento e de instalação (arts. 39 a 44)"},{"k":"tbl","rows":[["Situação","Quórum"]]},{"k":"tbl","rows":[["Câmara (regra)","3 desembargadores"],["Câmara em embargos infringentes criminais ou na técnica do art. 942 do CPC","5 (a Câmara inteira)"],["Grupo: rescisória de acórdão da Câmara; demais feitos contra ato ou acórdão da Câmara","7 juízes"],["Grupo: feitos contra ato ou acórdão do próprio Grupo","9 juízes"],["Instalação das sessões do OE, das Turmas Especiais, dos Grupos e das Câmaras","maioria absoluta"],["Órgão Especial (instalação)","13"],["CSM","2 de direção · 2 membros"],["Quórum qualificado não alcançado","Adia-se o julgamento e convocam-se os desembargadores em exercício ausentes (art. 44)"]]},{"k":"p","t":"Empate no OE, tendo votado todos: convoca-se o desembargador mais antigo que não o integre (art. 39, §2º). Composição da turma ou desempate (arts. 39, 40 e 41 · · convoca-se o mais antigo que ainda não votou no órgão; na impossibilidade, o de maior antiguidade de outro órgão da mesma Seção ou Grupo (art. 42, redação do Assento 597/2026 · . Nos embargos infringentes na Câmara, o relator será um dos 2 desembargadores restantes, que não participaram do acórdão. Presidentes de Turmas Especiais, Grupos e Câmaras: eleitos pelos integrantes, por 6 meses a 1 ano, com alternância no Grupo. Na substituição, assume o mais antigo. Julgamento virtual: a turma inicialmente formada prevalece até o fim, salvo afastamento de quem ainda não votou (art. 41 · A · .)"},{"k":"h","t":"Presidentes das Seções (art. 45)"},{"k":"p","t":"Presidem a Seção; dirigem a distribuição; decidem incidentes e questões urgentes antes da distribuição; processam RE e REsp dos feitos da Seção; executam acórdãos originários das Turmas Especiais, dos Grupos e das Câmaras; representam ao Presidente contra irregularidades; organizam os setores das Presidências. Se não integrarem o OE, podem manifestar-se antes da votação sobre matéria de interesse da Seção (art. 8º, §2º)."}]},{"id":"s11","title":"8. Comissões permanentes","tag":"○","b":[{"k":"p","t":"Regras gerais (art. 46 · Lista das 10 · “O HoJe ReRe AsOr SaGeCe” · São 10 comissões permanentes. Organização Judiciária · Honraria e Mérito · · Emitem parecer antes da deliberação do OE na Jurisprudência · Regimento Interno · Redação · matéria administrativa de sua alçada. Assuntos Administrativos · Orçamento, Planejamento · Prazo do parecer: 60 dias, salvo outro prazo ou e Finanças · Salarial · Gestora de Arquivo, Memória e prorrogação pelo OE. Gestão Documental · CEJAI · Adoção Internacional) · Composição padrão: 3 desembargadores, salvo disposição específica. · Membros não natos: indicados pelo Presidente e aprovados pelo OE, desde que tenham produção de votos compatível com a média dos julgadores de igual competência (§4º, Assento 597/2026 · . · Disciplinam seus próprios trabalhos e a distribuição interna."},{"k":"tbl","rows":[["Comissão","Composição","Atribuição-chave"],["Organização Judiciária","Membros do CSM + 4 desembargadores · 2 do OE · · 2 suplentes","Estudos e anteprojetos de lei de organização e divisão judiciárias"]]},{"k":"tbl","rows":[["Honraria e Mérito","Presidente do TJ + os 4 mais antigos","Colar do Mérito Judiciário, Medalha “Manoel da Costa Manso”, Diploma “Ramos de Azevedo”, nomes, bustos e estátuas"],["Jurisprudência","Decano (preside) + 6 desembargadores · 2 por Seção); um deles, escolhido pelo Presidente, é o Supervisor da Biblioteca","Divulgar acórdãos e súmulas (com paridade entre relatores); acervo bibliográfico; pode propor súmulas"],["Regimento Interno","Padrão · 3","Zelar pelo Regimento, propor emendas, dar parecer (em até 30 dias, art. 273 · ; ouvida nos casos omissos"],["Redação","Padrão · 3","Rever anteprojetos, resoluções, assentos e provimentos; nas reformas de vulto pode atuar com a de Regimento"],["Assuntos Administrativos","Vice-Presidente (preside) + 5 desembargadores + 3 juízes de entrância final (indicados pelo CSM e aprovados pelo OE","Assuntos administrativos em geral; plano plurianual de gestão"],["Orçamento, Planejamento e Finanças","Padrão · 3","Parecer sobre a proposta orçamentária e sua execução"],["Salarial","5 desembargadores: 2 escolhidos pelo Presidente + 3 aprovados pelo OE","Parecer em tudo que envolva remuneração de magistrados e servidores, ativos e inativos"],["Gestora de Arquivo e Memória","Padrão · 3","Guarda de processos findos; parecer sobre incineração de autos; patrimônio histórico. Pedidos de consulta e certidão: ao Presidente, motivadamente"],["CEJAI","Corregedor Geral (preside) + 5 desembargadores · 2 em atividade); secretário: juiz de Vara da Infância","Autoridade central estadual; certificado de habilitação para adoção internacional; cadastros, inclusive de pessoas inidôneas; habilita organismos intermediários"]]},{"k":"p","t":"MACETE — QUEM PRESIDE QUAL Presidente → Honraria (“o Presidente entrega as medalhas”). Vice · Assuntos Administrativos (“o Vice administra”). Corregedor → CEJAI · “C com C”). Decano · Jurisprudência (“o mais velho é o mais prudente”).","box":1}]},{"id":"s12","title":"9. Desembargadores","tag":"○","b":[{"k":"tbl","rows":[["Tema","Regra"],["Posse · 57","Compromisso perante o Presidente, no gabinete, em sala nobre ou em sessão plenária, à escolha do empossando. Discursos de no máximo 10 minutos cada. Termo em livro especial, com declaração pública de bens."],["Lista tríplice do quinto · 58","3 escrutínios, votação secreta, maioria absoluta em todos; se algum candidato não atingir o quórum, a lista não é aceita. Empate: maior prática forense (advocacia contada da inscrição na OAB; MP contado da posse) e, depois, maior idade. Assento 590/2024"]]},{"k":"tbl","rows":[["Aposentado · 59","Conserva título e honras, mas deve se abster de usá-los se exercer a advocacia ou outra atividade incompatível."],["Remoção e permuta · 60/61","Entre Câmaras da mesma ou de outra Seção, com aprovação do OE. Quem pedir remoção ou permuta quando afastado da cadeira (por direção, cúpula, decanato, câmara especializada, Tribunal Superior ou associação de classe) só pode pedir outra depois de 1 ano, contado da primeira remoção ou permuta. Assento 594/2026 Vários pedidos para a mesma vaga: prefere o mais antigo no Tribunal, se requerer antes de iniciada a sessão. O removido assume o acervo e as prevenções da nova cadeira e continua vinculado aos feitos em que lançou visto."],["Antiguidade · 62","No OE · data de acesso definitivo à classe da antiguidade; entre os eleitos, votação e precedência. Nos demais órgãos: antiguidade no Tribunal, contada da posse. Empate: antiguidade na entrância anterior → na carreira → maior idade."],["Incompatibilidade · 63","Não podem integrar o mesmo Grupo ou Câmara: cônjuges, conviventes e parentes consanguíneos ou afins na linha reta e, na colateral, até o 3º grau inclusive. Antes da posse, resolve-se contra o último nomeado (mesma data: contra o menos idoso). Depois da posse, contra quem deu causa (se ambos: contra o mais moderno). No OE, o primeiro a votar exclui o outro, inclusive em matéria administrativa."],["Licenças · 64","Concedidas pelo OE, mediante pedido escrito. Saúde: até 30 dias com atestado; prorrogação ou prazo maior dependem de perícia designada pelo Presidente. O licenciado pode participar de julgamentos em que já tenha lançado visto, e os dias lhe são restituídos."],["Licença por doença em pessoa da família · 64, §3º)","Para cônjuge ou parente até o 2º grau. Até 1 mês: efetivo exercício e remuneração integral · de 1 a 3 meses: desconto de 1/3 · de 3 a 6 meses: desconto de 2/3 · do 7º ao 20º mês: sem remuneração. Somam-se as licenças concedidas em 20 meses contados da primeira."],["Afastamentos · 64/65/67","Para cursos: com acompanhamento e possível interrupção pelo OE. Para missão de relevância: até 90 dias, por deliberação do OE. Integrante do OE afastado · Justiça Eleitoral, concurso, comissão) pode votar matéria administrativa, comunicando ao Presidente com 72 horas de antecedência."],["Interrupções · 66","Salvo férias, todas são comunicadas por ofício ao Presidente, para registro no prontuário."],["Compensação · 69","Há compensação de processos nos casos de prevenção, impedimento, suspeição, nova distribuição após conversão em diligência, afastamento do relator sem redigir o acórdão e não participação de quem apôs visto ou pediu adiamento."],["Acervo · 70 a 72","O afastado, licenciado ou em férias continua vinculado ao acervo; casos urgentes ficam com o revisor ou 2º juiz. Afastamento por mais de 15 dias: designa-se juiz substituto em 2º grau ou juiz de entrância final. Não há distribuição nos 30 dias anteriores à aposentadoria."]]},{"k":"p","t":"PEGADINHA — GRAUS DE PARENTESCO Incompatibilidade (art. 63 · · colateral até o 3º grau. Vedação de juiz assessor (art. 16, X · · parente até o 3º grau. Licença por doença em pessoa da família (art. 64, §3º): parente até o 2º grau.","box":1}]},{"id":"s13","title":"10. Juízes de 1º grau","tag":"◐","b":[{"k":"h","t":"Vitaliciamento (art. 74 · Assento 593/2026)"},{"k":"p","t":"REDAÇÃO NOVA (2026)"},{"k":"tbl","rows":[["Início e condução","Começa na data da posse; é conduzido pela Corregedoria Geral, com a EPM e os Magistrados Preceptores · Res. CNJ 654/2025 · ."],["Prazo","Concluído em até 90 dias, contados do término dos 2 anos de exercício. Se não terminar, a CGJ informa à Corregedoria Nacional e indica novo prazo de no máximo 90 dias."],["Efeitos","Em qualquer caso, retroagem à data em que se completaram os 2 anos."],["Trâmite","A CGJ emite parecer conclusivo → o CSM aprecia e se manifesta fundamentadamente → o OE delibera."],["Parecer contrário","O juiz tem 15 dias para defesa e provas."],["Sessão do OE","Pública, com votação nominal, aberta e fundamentada."],["Prorrogação","Afastamento por mais de 90 dias, ainda que não contínuo, prorroga o processo por igual período, exceto licenças maternidade, paternidade e adotante. Afastamento entre 30 e 90 dias: a CGJ pode prorrogar. Licença-saúde não prorroga, se não prejudicar substancialmente a jurisdição."]]},{"k":"h","t":"Antiguidade, promoção, remoção e permuta"},{"k":"tbl","rows":[["Tema","Regra"],["Quadro de antiguidade · 76","Organizado na 1ª quinzena de janeiro, com dados até 31/12. Conta só o tempo efetivo, salvo: trânsito do removido, suspensão em processo criminal com absolvição e afastamento no vitaliciamento. Juízes em disponibilidade não disciplinar e sem exercício por remoção compulsória têm o tempo contado. Empate: mais tempo na entrância anterior → na carreira → mais idoso. Entre os substitutos, vêm primeiro os vitalícios."],["Reclamação · 77","Em 30 dias da publicação, ao CSM, que pode rejeitá-la de plano se manifestamente infundada. Da decisão cabe recurso ao OE em 10 dias."],["Juiz substituto · 78 a 80","Atua na sua circunscrição; a remoção entre circunscrições é a pedido, por deliberação do OE, ouvido o CSM. Os do mesmo concurso são indicados ao merecimento segundo a classificação no concurso."],["Edital de vaga · 81","Prazo de 5 dias. Na inscrição, o juiz declara endereço, que não tem autos conclusos fora do prazo e que não deu causa a adiamento injustificado de audiência. A exigência de residência não se aplica a substitutos."],["Ordem · 82 · Assento 596/2026","O concurso de remoção precede o de promoção. No merecimento, lista tríplice com mais de 2 anos na entrância. A vaga aberta por remoção vai obrigatoriamente para promoção."],["Reclamação contra inscritos · 83","3 dias. Depois, o CSM forma as listas e as submete ao OE; o voto vencido no CSM vai ao OE como emenda, com outro nome."],["Recusa do mais antigo · 84","Iniciativa do CSM ou de 3 membros do OE, com manifestação fundamentada."],["Comarca elevada · 87","O juiz promovido pode pedir, em 5 dias, que a promoção se efetive na comarca de que era titular."],["Permuta · 88","Só com mais de 1 ano na entrância e sem inscrição em concurso de promoção. Depois de remoção ou permuta, novo estágio de 1 ano. Na entrância final, é vedada se algum dos permutantes puder ser promovido ao 2º grau. Pedidos publicados no DJE com 10 dias de antecedência."]]},{"k":"tbl","rows":[["Reaproveitamento · 89","Apreciado pelo OE após parecer do CSM; iniciativa do interessado ou do Presidente. Se do Presidente, o magistrado é ouvido em 15 dias."]]},{"k":"h","t":"Incapacidade, aposentadoria, prisão e disciplina"},{"k":"tbl","rows":[["Tema","Regra"],["Verificação de incapacidade · 90","O Presidente é o preparador até as razões finais. Instauração: pelo Presidente, pelo OE ou por provocação da CGJ. Manifestação do magistrado em 15 dias; junta de 3 médicos; razões finais em 10 dias; depois, o MP. O relator tem 15 dias para o relatório e o processo vai à revisão. O Presidente vota e formaliza a aposentadoria. O OE pode afastar o magistrado em qualquer fase."],["Aposentadoria · 91/92","Compulsória: perde a jurisdição no dia imediato ao do implemento da idade, independentemente de declaração. Voluntária: produz efeitos a partir da publicação do ato."],["Prisão · 93 a 97","Só nas hipóteses da LOMAN (art. 33, II · . Comunica-se imediatamente o Presidente (ou o Vice), e o preso é levado à presença dele ou de desembargador do OE designado para lavrar o flagrante. Recolhimento em cela especial do estado-maior da PM. O OE é convocado em até 48 horas e delibera sobre a prisão. O magistrado não vai à repartição policial. Havendo indício de crime em investigação, os autos vão de imediato ao TJ; a quebra de sigilo depende de autorização do OE. Prisão civil: o mandado vai ao Presidente."],["Representações · 98 a 100","O CSM mantém livro especial. O Presidente ou o Corregedor podem arquivar de plano a representação manifestamente infundada ou exclusivamente jurisdicional. O magistrado tem ciência dos registros de sua vida funcional."],["Revisão de penalidade · 101","A qualquer tempo, com prova nova (mera reiteração não é admitida), ao OE. O CSM se manifesta em 15 dias. O relator não pode ter atuado antes nem integrar o CSM. O OE pode anular, absolver ou abrandar a pena."]]}]},{"id":"s14","title":"11. Competência, prevenção, juiz certo, impedimento","tag":"◐","b":[{"k":"p","t":"Normas gerais Prevenção (arts. 105 a 107 · · A competência firma-se pelos termos do pedido · A Câmara ou o Grupo que primeiro conhecer da inicial, ainda que haja reconvenção ou ação contrária, causa, ainda que sem apreciar o mérito, fica prevento ou que o réu alegue fatos que possam modificá-la para conexos, recursos e execução. (art. 103 · . · O afastamento dos juízes não rompe a prevenção. · A competência em razão da matéria, do objeto ou · O relator do 1º recurso fica prevento para os do título jurídico estende-se a qualquer espécie de seguintes enquanto compuser a Câmara ou o Grupo. processo ou procedimento (art. 104 · . · O agravo em execução penal só gera prevenção para incidentes do mesmo processo. · Em MS, HC e revisão criminal reiterados, a Secretaria junta cópia dos acórdãos anteriores antes da distribuição.)"},{"k":"tbl","rows":[["É juiz certo (art. 108)","Deixa de ser / exceções (arts. 109 e 110)"]]},{"k":"tbl","rows":[["• quem tem visto nos autos ou pediu adiamento, inclusive na conversão de julgamento virtual em presencial; • quem participou de julgamento convertido em diligência, nos embargos infringentes e, sempre que possível, nos ED; • o relator do acórdão suscitante (súmula, IRDR, IAC · e do reexame do art. 1.040, II, do CPC; • o juiz substituto do Tribunal, mesmo depois de promovido; • o Presidente que adiou para desempatar, ainda que com mandato findo.","· Deixa de ser juiz certo quem se afastar por mais de 60 dias depois do visto ou do pedido de adiamento. Ele, seu substituto ou sucessor continuam juízes certos dos feitos distribuídos por prevenção. · Câmara temporária ou extinta não firma prevenção nem torna seus juízes certos, salvo em ED, embargos infringentes criminais e conversão em diligência."]]},{"k":"tbl","rows":[["Impedimento e suspeição (arts. 111 a 115)",""],["Juiz (incidente no órgão fracionário)","Sem fundamento, o relator propõe o arquivamento; caso contrário, cita as partes e, se preciso, faz audiência. Acolhido o incidente, o juiz é comunicado incontinenti, independentemente do acórdão, e, havendo erro inescusável, é condenado nas custas."],["Despacho de impulso","O simples despacho de impulso em 1ª instância não impede o desembargador que o proferiu."],["Ação rescisória","Quem participou do julgamento rescindendo não está impedido, salvo para ser relator."],["Revisão criminal","Não pode funcionar quem proferiu decisão no processo original."],["Desembargador","O Presidente arquiva a petição manifestamente inconsistente, e cabe agravo interno ao OE. Se o arguido aceitar, remete ao substituto ou à redistribuição; se recusar, apresenta suas razões e continua oficiando. Produzidas as provas, prazo de 48 horas para manifestação sucessiva, e o julgamento é do OE. Acolhida a arguição, os atos decisórios do arguido são inválidos se não forem ratificados pelo substituto."]]},{"k":"p","t":"PEGADINHA — RESCISÓRIA × REVISÃO CRIMINAL Na rescisória, quem participou do julgado pode votar, mas não pode ser relator (art. 112, §2º). No OE, também não pode ser relator quem foi relator do acórdão rescindendo (art. 236 · . Na revisão criminal, quem decidiu no processo original não pode funcionar de jeito nenhum (art. 112, §3º), e a revisão vai a Grupo cujas Câmaras não tenham decidido (art. 37, §2º).","box":1}]},{"id":"s15","title":"12. Sessões, pauta e ordem dos trabalhos","tag":"◐","b":[{"k":"tbl","rows":[["Tema","Regra"],["Horário · 116","Das 9 às 17 horas dos dias úteis, com prorrogação se o serviço exigir. O OE e as Câmaras ordinárias fazem sessões presenciais semanais, podendo adotar periodicidade maior, até 1 mês."],["Recesso · 116, §2º a §5º)","De 20 de dezembro a 20 de janeiro, inclusive: prazos suspensos, sem audiências nem sessões, sem publicação de acórdãos, sentenças e decisões e sem intimações (salvo urgência). Plantão até 6 de janeiro; de 6 a 20 de janeiro, expediente regular nas unidades."],["Audiências · 117/118","Lugar, dia e hora designados pelo desembargador que preside. Se o magistrado não comparecer em 30 minutos, os presentes podem se retirar, com registro em livro."],["Ata · 119 a 122","Lavrada pelo secretário, de forma sucinta; o presidente rubrica, depois os procuradores e o secretário. A publicidade pode ser restringida por motivo relevante. A ata é aprovada na sessão subsequente. Reclamação contra erro em ata: 48 horas da publicação ou da aprovação; não suspende o prazo de recurso (se acolhida, devolvem-se os dias que faltarem)."],["Conteúdo da ata · 121","Data e hora de início e encerramento; quem presidiu; os presentes por ordem de antiguidade e o MP; os processos julgados, os nomes do relator e demais juízes, das partes, se houve sustentação, o resultado, os vencidos e a designação de relator diverso do sorteado."]]},{"k":"h","t":"Pauta (arts. 123 a 131)"},{"k":"tbl","rows":[["INDEPENDEM DE PAUTA"],["• Habeas corpus • Desaforamento • Conflitos de jurisdição, de competência ou de atribuição • ED em matéria criminal · ED nas demais matérias, se julgados na sessão subsequente (senão, entram em pauta automaticamente) · Feito que o relator leva à Mesa por incompetência, prevenção de outro órgão ou prejudicialidade (art. 170 · • Agravo regimental mantido pelo prolator (art. 255 · · HC após parecer do MP (art. 248)"]]},{"k":"tbl","rows":[["Pauta: números",""],["Publicação","pelo menos 5 dias antes da sessão"],["Afixação","na porta da sala, com 15 minutos de antecedência, e entregue a cada desembargador"],["Feriado","julga-se na sessão ordinária seguinte, sem nova publicação"],["Extraordinária","dispensa nova pauta se for só para os remanescentes da anterior"],["Ordem","por classes; na mesma classe, pela ordem de apresentação; no mesmo dia, pela ordem numérica ascendente"],["OE administrativo","pauta autônoma, por extrato, só com o número dos feitos e o nome dos advogados"]]},{"k":"p","t":"Preferências (art. 128 · · o IRDR prefere a todos, exceto réu preso e HC; falência e recuperação judicial preferem aos demais da mesma classe. O relator pode indicar preferência (art. 129 · . Também têm preferência (art. 144 · os julgamentos com magistrados convocados, os adiados ou que ficaram como sobra, os com intervenção do MP, do Procurador do Estado ou de advogado inscrito para sustentar, e os com pedido de preferência feito até o início da sessão, presente advogado ou estagiário. Ordem do dia no OE (art. 126, I · · começa por intervenção federal → inconstitucionalidade → ações interventivas · HC · MS… e termina em “processos de outra natureza”. Nos feitos criminais, HC vem primeiro e os réus presos têm prioridade sobre os soltos.)"},{"k":"h","t":"Ordem dos trabalhos (arts. 132 a 145)"},{"k":"tbl","rows":[["Regra","Conteúdo"],["Pregão · 133","O presidente declina natureza, registro, partes, turma julgadora e número dos votos. Causas da mesma matéria podem ser julgadas em bloco se não houver preferência nem sustentação oral."],["Ausência do relator · 134","Nenhum feito é julgado sem o relator, ainda que ele já tenha votado, salvo se ele se afastar depois de iniciado o julgamento. A ausência do revisor que ainda não votou adia, salvo afastamento por mais de 40 dias. A ausência ocasional de vogal não adia, se houver substituto."],["Relatório · 135","O relator expõe a causa sem manifestar o voto. Depois votam o relator, o revisor (no crime) e os demais."],["Uso da palavra · 135, §4º e §5º)","Cada desembargador fala duas vezes sobre a matéria e mais uma para justificar mudança de voto. O relator pode falar sempre que necessário. Todos os desembargadores do órgão podem discutir, ainda que sem voto."],["Ordem lógica · 135, §6º / 136","Questões de ordem, preliminares e prejudiciais vêm antes do mérito. O vencido na preliminar continua obrigado a votar no restante."],["Divergência · 137 a 140","Questões decomponíveis são votadas separadamente. Sem maioria, prevalece a média ou o voto intermediário. Se todos divergirem, o presidente cinde e submete a matéria a nova votação. Valor ou quantidade: quociente (soma dividida pelo número de votantes)."],["Pena · 139, §2º)","Os votos pela pena mais grave somam-se aos da imediatamente inferior até formar maioria. Persistindo o empate, o presidente vota se ainda não votou; se já votou, prevalece a decisão mais favorável ao réu."],["Empate no cível · 139, §3º)","Rescisória: convoca-se juiz de outro grupo, por rodízio. Uniformização: desempata o Presidente da Seção. Agravo: fica mantida a decisão agravada."],["Outras · 141 a 145","O voto pode ser modificado até a proclamação. O resultado é consignado em súmula. Quem não ouviu o relatório pode votar se se declarar habilitado. Causas conexas são julgadas em conjunto."]]},{"k":"p","t":"MACETE — EMPATES “Agravo empatado, agravante frustrado”: mantém-se a decisão. “Réu no empate ganha”: prevalece a mais favorável, se o presidente já votou. “OE empatado chama o mais antigo de fora” (art. 39, §2º). “CSM empatado: o Presidente desempata” (art. 15, §2º). “Súmula empatada: voto de qualidade do presidente da sessão” (art. 191, §1º).","box":1}]},{"id":"s16","title":"13. Sustentação oral","tag":"○","b":[{"k":"tbl","rows":[["Tema","Regra"],["Como pedir","· I · por inscrição prévia por e-mail institucional, a critério de cada órgão, ou no próprio dia da sessão; · II · se houver inscrição prévia, o e-mail vai ao cartório com 24 horas de antecedência do início da sessão, com os dados do processo e a ordem de inscrição como preferência; a admissão por e-mail tem de constar da publicação da pauta; o recebimento é confirmado por mensagem padrão com número de ordem e alerta; a inscrição fica sem efeito se o advogado não a ratificar até o início da sessão; · III · mesmo depois das 24 h, até o início da sessão, comunicando ao oficial de Câmara."],["Adiamento","Por decisão do Relator, por uma sessão, com justificativa comprovada apresentada até o início da sessão; havendo inscrição virtual, o impedimento tem de ser superveniente. Adiamentos por excesso de pedidos seguem para a próxima sessão, preservada a ordem cronológica."]]},{"k":"tbl","rows":[["Conduta","Sem interrupções nem apartes. O presidente pode advertir o orador e cassar a palavra se houver reiteração. Encerrada a sustentação, o advogado não pode intervir, salvo nas hipóteses legais. Advogados e MP usam vestes talares."],["NÃO cabe","ED, incidente de suspeição, conflito de competência, arquivamento de inquérito ou representação criminal e agravo, exceto: agravo de instrumento contra tutela provisória de urgência ou da evidência e agravo interno contra a extinção de feito originário (art. 937, VI, do CPC · .)"],["Tempo especial","Agravo em execução penal: no máximo 5 minutos. Exceção da verdade: 15 minutos improrrogáveis para cada um. Intervenção em Município: 15 minutos."],["Videoconferência","Requerida até o dia anterior à sessão (art. 937, §4º, do CPC · .)"],["Ordem de fala · 147","Originários: autor ou impetrante primeiro. Recursos: recorrente primeiro. O MP fala por último, quando não for autor ou recorrente. Recurso adesivo: fala antes o recorrente principal. Recorrentes recíprocos: fala antes o autor. O interveniente fala por último; na ação penal, o assistente fala depois do MP."],["Divisão do tempo","Litisconsortes ou terceiros com procuradores diferentes (processo civil): prazo em dobro, dividido igualmente. Vários advogados da mesma parte dividem o tempo, salvo ajuste diverso."],["Renovação · 150","Permitida quando o feito volta à Mesa após diligência, quando oficiar novo juiz em julgamento adiado, ou no prosseguimento do art. 942 do CPC."]]},{"k":"p","t":"MACETE — ONDE NÃO HÁ SUSTENTAÇÃO: “E-S-C-A-A” Embargos de declaração · Suspeição · Conflito de competência · Arquivamento de inquérito · Agravo (salvo AI de tutela de urgência ou evidência e agravo interno de extinção de originário). Prazos: “24 h por e-mail; vídeo até a véspera; execução penal em 5 minutos”.","box":1}]},{"id":"s17","title":"14. Votação, acórdão e publicidade","tag":"◐","b":[{"k":"p","t":"Ordem da votação Presidente do Tribunal só vota (art. 153 · · Relator → revisor (se houver) → demais, em ordem I · em matéria constitucional; de antiguidade. II · para desempate, em qualquer matéria; · Na uniformização e quando houve julgamento III · quando for relator nato. anterior, votam logo após o relator os que Exceção: nas questões administrativas e disciplinares do OE participaram do anterior. ele vota (art. 26, II, “n”), assim como na verificação de · Regra geral: maioria simples (art. 154 · . incapacidade (art. 90, §5º)."},{"k":"tbl","rows":[["Acórdão","Regra"],["Relator vencido · 155","Se o relator for vencido no mérito ou na questão principal, ainda que em parte, redige o designado, de preferência quem primeiro expôs a tese vencedora. Publicado o acórdão, cessa a vinculação do designado, salvo para ED, embargos infringentes criminais e reexame do art. 1.040, II, do CPC. Assento 591/2025"],["Declaração de voto · 156","No CPC, o vencido faz declaração de voto, ainda que só quanto aos fundamentos. No CPP, é obrigatória se couberem embargos infringentes. Os vencedores também podem declarar voto, registrando a intenção na tira."],["Outro redator · 157","Excepcionalmente, ainda que o julgamento seja unânime, a turma pode decidir que outro juiz redija o acórdão."],["Conteúdo · 158","Data e órgão; presidente, relator e turma; súmula do decidido; número e partes; vencidos; relatório sucinto; fundamentos (o relator pode só ratificar a decisão recorrida, art. 252 · ; dispositivo."],["Assinatura · 159/160","Pelo relator e, facultativamente, pelo presidente da sessão. Se o redator falecer, aposentar-se ou afastar-se por mais de 60 dias sem assinar, assina quem, com voto vencedor, o seguia imediatamente na ordem de votação."]]},{"k":"tbl","rows":[["Correções · 161","Antes da assinatura, a Secretaria confere minuta e tira; divergência vai à turma na primeira sessão seguinte. Inexatidões e erros de escrita ou cálculo: despacho do relator, de ofício ou a requerimento."],["Publicação · 162/163","O acórdão assinado é registrado (em livro ou meio eletrônico); as conclusões são publicadas para intimação nos 5 dias seguintes ao registro. Decisões penais são comunicadas ao serviço de identificação criminal."],["Publicidade · 165/166","A notícia dos trabalhos sai no dia imediato, sempre que possível. A publicação por extenso de discursos depende de autorização do Presidente. O site informa a composição dos colegiados, os dias das sessões e os dias de distribuição."]]},{"k":"p","t":"○ FORA DO RECORTE 167 a 189"}]},{"id":"s18","title":"15. Feitos, relator e distribuição","tag":"","b":[{"k":"p","t":"arts."},{"k":"tbl","rows":[["Tema","Regra"],["Relator · 167/168","Cada feito tem um relator, escolhido por sorteio. Ele é o juiz preparador: decide urgências, liminares e incidentes, instrui (pode delegar diligências a juiz de 1º grau) e pode levar a liminar diretamente ao colegiado se a questão for relevante. Pode negar seguimento a pleitos manifestamente improcedentes ou remeter os autos ao órgão competente."],["Fluxo · 169","Relator (voto e relatório) → revisor, se houver (lança visto) → Mesa."],["Prazos do julgador","Relator e revisor: 30 dias (art. 172 · . Vista: devolução em até 10 dias, prorrogáveis por mais 10 (pedido ao presidente do órgão ou, no OE, ao Presidente do TJ · . Devolvido, o feito entra automaticamente na pauta da sessão seguinte. Não devolvido, os autos são requisitados; se quem pediu vista não se sentir habilitado, é substituído (art. 42 · .)"],["Saída de autos · 174","Só por disposição legal ou regulamentar ou ordem judicial, com registro de carga, sob responsabilidade do servidor."],["Remessa ao Tribunal · 175","48 horas se urgente; 5 dias nos demais casos, contados da publicação da última decisão ou do despacho de remessa. Pelo correio, vale a data da postagem."],["Registro e autuação · 176/177","No recurso, anota-se o nome do magistrado prolator. Processo com prioridade legal tem cor especial ou indicação destacada. No crime, anotam-se as datas do fato e do recebimento da denúncia, o dispositivo, se o réu está preso ou solto e a idade se for menor de 21 ou maior de 70."],["Irregularidade · 179","Conclusão ao Presidente da Seção ou ao Vice-Presidente, conforme o caso."],["Distribuição · 181","Em audiência pública, em dias certos da semana, por cadeira, mediante sorteio, de forma ininterrupta e paritária, respeitadas prevenções e impedimentos. Na vacância, a distribuição continua para a cadeira. Evita-se distribuir a órgão com desembargador impedido. No OE, não há distribuição ao Presidente, ao Vice e ao Corregedor (art. 181 · A · .)"],["Reclamação contra distribuição · 182","Decidida pelo Vice-Presidente ou pelos Presidentes de Seção. A redistribuição cancela a anterior, com compensação."],["MP · 186","Vista à PGJ independentemente de despacho; manifestação em 10 dias, ou 5 se urgente."],["Controle · 187 a 189","A relação de remessa vale como recibo se não for reclamada em 10 dias. A estatística mensal sai até o dia 15. O Presidente da Seção comunica atrasos ao Presidente do TJ em 3 dias; o prazo de justificativa é suspenso em férias, licença- prêmio, licença-saúde, nojo, gala e faltas compensadas."]]}]},{"id":"s19","title":"16. Incidentes","tag":"○","b":[{"k":"tbl","rows":[["Incidente","Pontos que caem"],["Uniformização · 190 a 192","Formas: súmulas, enunciado de jurisprudência pacificada, tese de IRDR e de IAC. Súmulas: exclusividade do OE. Enunciados: Turmas Especiais, Grupos especializados do art. 32, §1º ou OE (matéria constitucional, de sua competência, dos Juizados, da Câmara Especial, não exclusiva ou com divergência). Relator: se possível, o do acórdão de origem; senão, livre distribuição entre membros de Câmaras de competência correlata. Aprovação por maioria simples, com voto de qualidade do presidente da sessão. Revisão pelo mesmo órgão e forma. Divergência entre a Turma de Uniformização dos Juizados e as Seções: decide o OE, provocado pelo Presidente, pelo Vice ou pelos Presidentes de Seção. Propõem súmulas os desembargadores do OE, as Turmas Especiais, os Grupos do art. 32, §1º, e a Comissão de Jurisprudência (art. 192, §4º revogado). O IRDR é protocolado perante o Presidente do Tribunal; admitido, considera-se instaurado."],["Inconstitucionalidade · 193/194","Suscitada pelo órgão fracionário, de ofício ou a requerimento, para o OE. Proclamada a constitucionalidade ou não alcançada a maioria do art. 97 da CF, a arguição é improcedente. Depois, os autos voltam ao órgão suscitante. Só se renova o incidente por motivo relevante."],["Reclamação · 195 a 199","Serve para preservar a competência, garantir a autoridade das decisões e a observância de súmulas e precedentes. Relator, de preferência, o mesmo do pronunciamento violado. Pode negar seguimento (cabe agravo interno) ou suspender liminarmente o ato. Havendo interesse disciplinar, remetem-se peças ao Corregedor."],["Conflito de competência · 200 a 204","Dirimido pelo OE se envolver órgãos vinculados a mais de uma Seção; dentro da Seção, pela Turma Especial (art. 32, III · redação do Assento 597/2026 · . Suscitam: Presidentes de Seção, órgãos fracionários, MP, parte e terceiro prejudicado. O processo fica suspenso por no máximo 90 dias. O relator pode decidir liminarmente se houver súmula do STF, do STJ ou do TJ, ou tese de repetitivos ou IAC; cabe agravo interno.)"],["Desaforamento · 205 a 208","Distribuído a uma Câmara Criminal. Informações do juiz em 10 dias (se a iniciativa não for dele); razões do réu em 10 dias (se a representação for do juiz ou do MP · ; parecer do PGJ em 10 dias. Vai à Mesa sem pauta."],["Fiança · 209/210","Na ação penal originária, no recurso criminal e no HC, aprecia o relator. Há livro especial na Secretaria."]]},{"k":"tbl","rows":[["Correição parcial · 211 a 215","No processo penal, para corrigir erro ou abuso que importe inversão tumultuária dos atos, quando não houver recurso específico. Segue o rito do agravo de instrumento do CPC, ouvido o PGJ. O relator pode suspender liminarmente a decisão. Se couber pena disciplinar, remetem-se peças ao Corregedor."],["Exceção da verdade · 216 a 221","Em queixa por calúnia contra excepto com foro no TJ. O juiz de 1º grau decide a admissibilidade e processa tudo; ao TJ sobe só para julgar a exceção. Parecer da PGJ em 5 dias; relator sorteado no OE. Se o excepto não atender ao pregão, recebe defensor. Falam excipiente, excepto e MP, 15 minutos cada. Rejeitada a exceção, os autos voltam para o julgamento da queixa; acolhida, a queixa é arquivada."],["Conflitos de jurisdição, competência e atribuição · 222 a 228","Entre autoridades judiciárias da Justiça Comum estadual, e de atribuição entre autoridades administrativas de Poderes diferentes ou de Municípios: Câmara Especial, ressalvado o OE. Na ação penal, o réu só suscita no interrogatório ou no prazo da defesa prévia. Manifestação dos interessados em 10 dias, depois o MP. No conflito positivo, a decisão pode ser cumprida de imediato. Não cabe recurso da decisão em conflito de atribuição."]]}]},{"id":"s20","title":"17. Ações originárias","tag":"○","b":[{"k":"tbl","rows":[["Ação","Pontos que caem"],["ADI · 229 a 231","Segue a CE/SP e a Lei 9.868/99. O relator aprecia a cautelar (ou a leva ao colegiado, art. 168, §2º). Julgamento com a presença de 2/3 do OE; a declaração de inconstitucionalidade exige maioria absoluta dos membros, convocando-se os ausentes se não for atingida."],["Cautelares · 232","Medidas assecuratórias do CPP e tutelas de urgência do CPC · processadas pelo relator da ação ou do recurso pendente."],["MS, MI e HD · 233/234","As Câmaras julgam MS contra atos de juízes de 1ª instância, membros do MP e outras autoridades, ressalvado o OE. MI e HD seguem a competência do MS."],["Rescisória · 235 a 238","A Secretaria comunica ao distribuidor de 1ª instância (rescisória de decisão), anota nos assentamentos (rescisória de acórdão) e distribui ao mesmo Grupo do acórdão rescindendo. No OE, não é relator quem foi relator do rescindendo. Cumulado novo julgamento, faz-o o mesmo órgão, se competente. Rescisória contra decisão de 1º grau acolhida por maioria: técnica do art. 942, com 5 juízes."],["Dissídio coletivo de greve · 239 a 246","Servidores não celetistas. O Vice-Presidente designa audiência de conciliação em 10 dias (ou manda emendar em 10 dias, sob pena de indeferimento). O protesto judicial preserva a data-base; deferido, a representação deve ser ajuizada em 30 dias. Acordo homologado tem força de decisão irrecorrível. Sem acordo, sorteia-se relator no OE, que ouve o suscitado em 5 dias; o MP fala em 5 dias; o relator leva à Mesa em 10 dias. O julgamento tem preferência e os votos são dados cláusula a cláusula. As partes podem transigir até o trânsito em julgado. O acórdão é lavrado em 10 dias. Enquanto durar a greve, os prazos caem pela metade."]]},{"k":"tbl","rows":[["HC · 247 a 249","Câmaras Civis e Criminais, conforme a matéria, contra atos de juízes de 1ª instância, MP e outras autoridades, ressalvado o OE. O relator pode mandar emendar, remeter ao juízo competente ou propor o indeferimento; aprecia a liminar. Ouvido o MP (se não for impetrante), o HC vai a julgamento sem pauta. Concedida a ordem, a autoridade é comunicada com urgência."]]}]},{"id":"s21","title":"18. Recursos","tag":"◐","b":[{"k":"tbl","rows":[["Tema","Regra"],["Agravo de instrumento · 250","Impedimento ocasional do relator: o pedido de efeito suspensivo ou de tutela recursal é apreciado por outro integrante, pela ordem de antiguidade."],["Agravo em execução penal · 251","Processado na forma do RESE e julgado por Câmara Criminal. É vedado ao juiz negar-lhe seguimento. A decisão é comunicada ao juiz em 5 dias, independentemente da intimação do acórdão."],["Fundamentação per relationem · 252","O relator pode limitar-se a ratificar os fundamentos da decisão recorrida, se suficientemente motivada, apreciando os demais argumentos capazes de infirmá-la."],["Agravo regimental ou interno · 253 a 255","Cabe contra decisão monocrática que possa causar prejuízo, sem efeito suspensivo, em 15 dias. Cabe também em matéria administrativa prevista em lei e em questões disciplinares de magistrado. Sem as razões de reforma, a petição é indeferida liminarmente. Falta de peça ou vício: 5 dias para sanar. No processo eletrônico, dispensam-se as peças obrigatórias. O prolator pode reconsiderar; se mantiver, leva à Mesa sem pauta e vota."],["RE e REsp · 256","Processamento e admissibilidade: Presidente do TJ (acórdão do OE · ou Presidente da Seção. Não cabe agravo regimental da decisão que concede ou nega efeito suspensivo a RE ou REsp (art. 1.029, §5º, III, do CPC · .)"],["Repetitivos · 257/258","Comunicada a repercussão geral ou o repetitivo, o Presidente do TJ ou da Seção suspende os RE e REsp correspondentes. O despacho indica o paradigma, a ementa, a tese e a corte. O acompanhamento é semanal. Julgado o paradigma, aplicam-se os arts. 1.040 e 1.041 do CPC."]]},{"k":"p","t":"PEGADINHA — ONDE NÃO CABE AGRAVO · Decisão sobre efeito suspensivo em RE ou REsp (art. 256, p.ú.). · Decisões do Presidente em pedidos de sequestro de precatórios (art. 269 · . · Decisão em conflito de atribuição: não cabe recurso algum (art. 228 · . Atenção: o indeferimento de pedido de intervenção federal infundado admite agravo regimental, em 5 dias, ao OE (art. 262 · , um prazo diferente dos 15 dias da regra geral.)","box":1},{"k":"p","t":"○ FORA DO RECORTE a 270 Intervenção em Município · 263 a 265 · · Fundamento: art. 35, IV, da CF e art. 149 da CE/SP. · O relator requisita informações em 15 dias ou arquiva de plano, se infundado. · Ouvido o MP, o processo entra em pauta. Falam o requerente, o procurador do Município e o MP, 15 minutos cada. · Deferida, o Presidente comunica ao Governador."}]},{"id":"s22","title":"19. Intervenção e precatórios","tag":"","b":[{"k":"p","t":"Intervenção federal no Estado · 259 a 262 · · Coação contra o Judiciário (art. 34, IV, CF · ou execução de ordem judicial: o Presidente do TJ pede ao STF, após resolução do OE. · O Presidente instaura por portaria circunstanciada: de ofício em qualquer caso, ou a pedido do interessado (no caso de ordem judicial). · Sessão pública; o Presidente faz exposição oral e colhe os votos. · Aprovada, o processo vai ao STF em 5 dias; recusada, é arquivado. · O indeferimento de plano de pedido infundado admite agravo regimental em 5 dias."},{"k":"tbl","rows":[["Precatórios · 266 a 270",""],["Ofício requisitório","Enviado pelo juízo da execução ao Presidente do TJ, em duas vias, com número do processo, natureza da obrigação e do crédito (comum ou alimentar), valor, partes, datas de trânsito, data-base, relação de credores etc."],["Trâmite","Autuado pela DEPRE, que confere a regularidade → expede-se o precatório em ordem cronológica → o período anual se encerra em 1º de julho → os valores são atualizados a partir de 2 de julho → paga-se na ordem, observadas as preferências constitucionais."],["Pagamento","Encaminhado o pagamento, aguarda-se comunicação de insuficiência por 180 dias; sem ela, o precatório é considerado pago definitivamente. Havendo diferença, requisita-se o depósito em 90 dias."],["Presidente do TJ","Expede instruções; corrige inexatidões materiais; publica até 15 de janeiro a relação dos precatórios não pagos; pode delegar a desembargador (de preferência do OE · , exceto o sequestro de rendas. Das suas decisões em pedido de sequestro não cabe agravo interno."]]}]},{"id":"s23","title":"20. Atos administrativos e reforma do Regimento","tag":"◐","b":[{"k":"tbl","rows":[["Órgão","Expede…"],["Órgão Especial","Resoluções e Assentos"],["CSM","Provimentos e Pareceres"],["Presidente, Vice, Corregedor e Presidentes de Seção","Decisões, despachos, provimentos, instruções, portarias e comunicados"],["Comissões","Pareceres"],["Juízes corregedores","Despachos e pareceres"]]},{"k":"tbl","rows":[["Ato","Conceito"],["Resolução","Do OE, sobre propostas de lei de sua iniciativa e providências normativas relevantes"],["Assento","Do OE, para a inteligência, compreensão e alteração de normas regimentais"],["Provimento","Instrução ou determinação regulamentar para a boa ordem e uniformização dos serviços"],["Parecer","Ato consultivo que orienta decisão administrativa"],["Despacho","Pronunciamento decisório ou de impulso"],["Instrução","Ordenamento interno do modo de execução dos serviços da Secretaria"]]},{"k":"tbl","rows":[["Portaria","Ato interno para convocar ou designar magistrado, nomeação ou admissão coletiva de servidor, reestruturação de serviços e instauração de procedimento disciplinar"],["Comunicado","Aviso oficial sobre matéria relevante"]]},{"k":"p","t":"Todos os atos são numerados cronologicamente, por classe e pela ordem de expedição no ano (art. 271, §9º)."},{"k":"h","t":"Leitura inversa: dado o ato, quem pode expedi-lo? (art. 271)"},{"k":"tbl","rows":[["Ato","Quem expede","Dica"],["Resolução · Assento","Só o Órgão Especial","Exclusivos do OE"],["Parecer","CSM, Comissões e juízes corregedores","As Comissões só expedem pareceres"],["Provimento","CSM e Presidente, Vice, Corregedor e Presidentes de Seção","O OE não expede provimento"],["Despacho","Presidente, Vice, Corregedor, Presidentes de Seção e juízes corregedores","O CSM não expede despacho"],["Decisão · Instrução · Portaria · Comunicado","Só Presidente, Vice, Corregedor e Presidentes de Seção","Nem o OE, nem o CSM, nem as Comissões"]]},{"k":"p","t":"MACETE DO ART. 271 — “CADA UM COM O SEU” OE · Resolução + Assento (“o OE é RA”). CSM · Provimento + Parecer (“o CSM é PP”). Comissões: só Parecer. Juízes corregedores: Despacho + Parecer (“DP”). Dirigentes · P, VP, CG, Presidentes de Seção): 6 atos (decisão, despacho, provimento, instrução, portaria e comunicado), ou seja, tudo menos resolução, assento e parecer.","box":1},{"k":"p","t":"MACETE — “ASSENTO MEXE NO REGIMENTO” ASSento → Sentido e alteração do Regimento. Resolução → Respeita a lei (propostas de lei). Provimento → Providência regulamentar dos serviços (típico do CSM e da Corregedoria). Portaria → “abre a porta”: designa, nomeia, instaura.","box":1},{"k":"tbl","rows":[["Reforma do Regimento","Regra"],["Quem propõe · 272","CSM, órgãos judicantes, Comissão de Regimento Interno e qualquer desembargador, sempre por escrito e com exposição de motivos."],["Parecer · 273","Se a proposta não for dela, a CRI se manifesta em até 30 dias. O relator é o mesmo da CRI e não vota se não integrar o OE."],["Emendas · 274","Podem ser apresentadas até a instalação da sessão, e a discussão pode ser adiada para ouvir a CRI."],["Numeração · 275","Assentos em designação ordinal; artigo acrescido recebe letras (ex. · 29 · A, 33 · A · ."],["Quórum · 277","2/3 dos integrantes do OE. Na urgência, com o mesmo quórum, pode-se dispensar o procedimento (art. 278 · .)"],["Divulgação · 279","Fica disponível no site e é publicado a cada 2 anos no órgão oficial."]]},{"k":"tbl","rows":[["Disposições finais (arts. 280 a 290)",""],["Secretarias","Estrutura e nomenclatura definidas por ato do Presidente."]]},{"k":"tbl","rows":[["Coordenadorias","Da Infância e Juventude e Criminal e de Execuções Criminais, cada uma com 2 desembargadores · Coordenador e Vice) e juízes de entrância final, todos designados pelo Presidente. Aplicam-se as regras das Comissões. Há também uma Ouvidoria Geral com titular e substituto."],["Juiz substituto em 2º grau","Não tem cadeira definida nas Câmaras; substitui ou auxilia por designação dos Presidentes de Seção. Há também quadro permanente de juízes de entrância final em rodízio. É vedado designar juiz que não seja titular de entrância final para auxiliar ou substituir no Tribunal (art. 282 · .)"],["Câmaras","O OE pode extinguir as câmaras mais modernas com menos de 4 desembargadores; os destas têm preferência na remoção. Câmaras Reservadas à Falência e Recuperação e ao Meio Ambiente mantêm caráter temporário."],["Art. 285 ✚ 2026","Revogado pelo Assento 597/2026 · era a regra transitória das Subseções I, II e III de Direito Privado, extintas pela Res. OE 1.027/2026."],["Casos omissos · 287","Resolvidos pelo OE, ouvida a Comissão de Regimento Interno."],["Vigência · 290","30 dias após a publicação. Os atos anteriores compatíveis são recepcionados."]]}]},{"id":"s24","title":"21. Tabela-mestra de PRAZOS","tag":"","b":[{"k":"tbl","rows":[["Prazo","Hipótese","Art."],["15 min","Antecedência mínima da afixação da pauta na porta da sala","127"],["5 min","Sustentação oral no agravo em execução penal (máximo)","146 §4º- A"],["10 min","Discursos na posse de desembargador (cada um)","57 §1º"],["15 min","Fala na exceção da verdade (improrrogável) e na intervenção em Município","220 / 264"],["30 min","Tolerância para o magistrado na audiência","118"],["24 h","Antecedência da inscrição prévia por e-mail para sustentação oral","146 II"],["48 h","Reclamação contra erro em ata · remessa de feito urgente ao Tribunal · convocação do OE após prisão de magistrado · manifestação sucessiva na suspeição de desembargador","122 / 175 / 95 / 114"],["72 h","Comunicação do integrante afastado do OE que quer votar matéria administrativa","67"],["Véspera","Pedido de sustentação por videoconferência","146 §5º"],["3 dias","Reclamação contra o edital de inscritos para promoção ou remoção · comunicação de atrasos pelo Presidente da Seção","83 / 189"],["5 dias","Publicação da pauta (mínimo) · remessa de feito não urgente · edital de vaga de juiz · publicação do acórdão após o registro · parecer da PGJ na exceção da verdade · nova eleição de direção · envio ao STF da intervenção · agravo regimental contra indeferimento de intervenção · sanar vício do agravo · comunicação do agravo em execução penal · MP em urgência · pedido do juiz de comarca elevada · suscitado e MP no dissídio de greve","127 / 175 / 81 / 163 / 218 / 19 / 261 / 262 / 254 / 251 / 186 / 87 / 241"],["10 dias","Prazo de renúncia na eleição · devolução de vista · · 10 · · MP (regra) · recurso contra decisão do CSM sobre antiguidade · razões finais na incapacidade · edital da Ouvidoria · informações, razões e parecer no desaforamento · manifestação no conflito · audiência e emenda no dissídio de greve · acórdão do dissídio · recibo de relação de autos · publicação de pedido de permuta","18 / 173 / 186 / 77 / 90 / 29 · A / 205 · 207 / 225 / 239 / 245 / 187 / 88"],["15 dias","Convocação de eleição em vaga do OE · Presidente incluir proposta em pauta · agravo regimental ou interno · manifestação do magistrado na incapacidade · relatório na incapacidade · defesa no vitaliciamento · reaproveitamento · parecer do CSM na revisão de pena · informações na intervenção em Município","10 / 12 / 253 / 90 / 74 / 89 / 101 / 263"],["20 dias","Antecedência do edital de eleição em vaga do OE","10 §1º"],["25 dias","Antes da eleição, abre-se o prazo de renúncia","18"],["30 dias","Licença-saúde com atestado · relator e revisor · reclamação contra o quadro de antiguidade · ajuizamento após protesto (greve) · parecer da CRI · sem distribuição antes da aposentadoria · vigência do Regimento","64 / 172 / 77 / 239 / 273 / 71 / 290"],["40 dias","Afastamento do revisor acima do qual ele é substituído (não adia)","134 §1º"]]},{"k":"tbl","rows":[["60 dias","Parecer d
