"k":"p","t":"IV - resposta conclusiva a todos os quesitos apresentados pelo juiz, pelas partes e pelo órgão do Ministério Público."},{"k":"p","t":"§ 1º No laudo, o perito deve apresentar sua fundamentação em linguagem simples e com coerência lógica, indicando como alcançou suas conclusões."},{"k":"p","t":"§ 2º É vedado ao perito ultrapassar os limites de sua designação, bem como emitir opiniões pessoais que excedam o exame técnico ou científico do objeto da perícia."},{"k":"p","t":"§ 3º Para o desempenho de sua função, o perito e os assistentes técnicos podem valer-se de todos os meios necessários, ouvindo testemunhas, obtendo informações, solicitando documentos que estejam em poder da parte, de terceiros ou em repartições públicas, bem como instruir o laudo com planilhas, mapas, plantas, desenhos, fotografias ou outros elementos necessários ao esclarecimento do objeto da perícia."},{"k":"p","t":"Art. 474. As partes terão ciência da data e do local designados pelo juiz ou indicados pelo perito para ter início a produção da prova."},{"k":"p","t":"Art. 475. Tratando-se de perícia complexa que abranja mais de uma área de conhecimento especializado, o juiz poderá nomear mais de um perito, e a parte, indicar mais de um assistente técnico."},{"k":"p","t":"Art. 476. Se o perito, por motivo justificado, não puder apresentar o laudo dentro do prazo, o juiz poderá conceder-lhe, por uma vez, prorrogação pela metade do prazo originalmente fixado."},{"k":"p","t":"Art. 477. O perito protocolará o laudo em juízo, no prazo fixado pelo juiz, pelo menos 20 (vinte) dias antes da audiência de instrução e julgamento."},{"k":"p","t":"§ 1º As partes serão intimadas para, querendo, manifestar-se sobre o laudo do perito do juízo no prazo comum de 15 (quinze) dias, podendo o assistente técnico de cada uma das partes, em igual prazo, apresentar seu respectivo parecer."},{"k":"p","t":"§ 2º O perito do juízo tem o dever de, no prazo de 15 (quinze) dias, esclarecer ponto:"},{"k":"p","t":"I - sobre o qual exista divergência ou dúvida de qualquer das partes, do juiz ou do órgão do Ministério Público;"},{"k":"p","t":"II - divergente apresentado no parecer do assistente técnico da parte."},{"k":"p","t":"§ 3º Se ainda houver necessidade de esclarecimentos, a parte requererá ao juiz que mande intimar o perito ou o assistente técnico a comparecer à audiência de instrução e julgamento, formulando, desde logo, as perguntas, sob forma de quesitos."},{"k":"p","t":"§ 4º O perito ou o assistente técnico será intimado por meio eletrônico, com pelo menos 10 (dez) dias de antecedência da audiência."},{"k":"p","t":"Art. 478. Quando o exame tiver por objeto a autenticidade ou a falsidade de documento ou for de natureza médico-legal, o perito será escolhido, de preferência, entre os técnicos dos estabelecimentos oficiais especializados, a cujos diretores o juiz autorizará a remessa dos autos, bem como do material sujeito a exame."},{"k":"p","t":"§ 1º Nas hipóteses de gratuidade de justiça, os órgãos e as repartições oficiais deverão cumprir a determinação judicial com preferência, no prazo estabelecido."},{"k":"p","t":"§ 2º A prorrogação do prazo referido no § 1º pode ser requerida motivadamente."},{"k":"p","t":"§ 3º Quando o exame tiver por objeto a autenticidade da letra e da firma, o perito poderá requisitar, para efeito de comparação, documentos existentes em repartições públicas e, na falta destes, poderá requerer ao juiz que a pessoa a quem se atribuir a autoria do documento lance em folha de papel, por cópia ou sob ditado, dizeres diferentes, para fins de comparação."},{"k":"p","t":"Art. 479. O juiz apreciará a prova pericial de acordo com o disposto no art. 371 , indicando na sentença os motivos que o levaram a considerar ou a deixar de considerar as conclusões do laudo, levando em conta o método utilizado pelo perito."},{"k":"p","t":"Art. 480. O juiz determinará, de ofício ou a requerimento da parte, a realização de nova perícia quando a matéria não estiver suficientemente esclarecida."},{"k":"p","t":"§ 1º A segunda perícia tem por objeto os mesmos fatos sobre os quais recaiu a primeira e destina-se a corrigir eventual omissão ou inexatidão dos resultados a que esta conduziu."},{"k":"p","t":"§ 2º A segunda perícia rege-se pelas disposições estabelecidas para a primeira."},{"k":"p","t":"§ 3º A segunda perícia não substitui a primeira, cabendo ao juiz apreciar o valor de uma e de outra."}]},{"id":"s15","title":"SEÇÃO XI — DA INSPEÇÃO JUDICIAL · arts. 481 a 495","tag":"","b":[{"k":"h","t":"SEÇÃO XI — DA INSPEÇÃO JUDICIAL"},{"k":"p","t":"Art. 481. O juiz, de ofício ou a requerimento da parte, pode, em qualquer fase do processo, inspecionar pessoas ou coisas, a fim de se esclarecer sobre fato que interesse à decisão da causa."},{"k":"p","t":"Art. 482. Ao realizar a inspeção, o juiz poderá ser assistido por um ou mais peritos."},{"k":"p","t":"Art. 483. O juiz irá ao local onde se encontre a pessoa ou a coisa quando:"},{"k":"p","t":"I - julgar necessário para a melhor verificação ou interpretação dos fatos que deva observar;"},{"k":"p","t":"II - a coisa não puder ser apresentada em juízo sem consideráveis despesas ou graves dificuldades;"},{"k":"p","t":"III - determinar a reconstituição dos fatos."},{"k":"p","t":"Parágrafo único. As partes têm sempre direito a assistir à inspeção, prestando esclarecimentos e fazendo observações que considerem de interesse para a causa."},{"k":"p","t":"Art. 484. Concluída a diligência, o juiz mandará lavrar auto circunstanciado, mencionando nele tudo quanto for útil ao julgamento da causa."},{"k":"p","t":"Parágrafo único. O auto poderá ser instruído com desenho, gráfico ou fotografia."},{"k":"h","t":"CAPÍTULO XIII — DA SENTENÇA E DA COISA JULGADA"},{"k":"h","t":"SEÇÃO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 485. O juiz não resolverá o mérito quando:"},{"k":"p","t":"I - indeferir a petição inicial;"},{"k":"p","t":"II - o processo ficar parado durante mais de 1 (um) ano por negligência das partes;"},{"k":"p","t":"III - por não promover os atos e as diligências que lhe incumbir, o autor abandonar a causa por mais de 30 (trinta) dias;"},{"k":"p","t":"IV - verificar a ausência de pressupostos de constituição e de desenvolvimento válido e regular do processo;"},{"k":"p","t":"V - reconhecer a existência de perempção, de litispendência ou de coisa julgada;"},{"k":"p","t":"VI - verificar ausência de legitimidade ou de interesse processual;"},{"k":"p","t":"VII - acolher a alegação de existência de convenção de arbitragem ou quando o juízo arbitral reconhecer sua competência;"},{"k":"p","t":"VIII - homologar a desistência da ação;"},{"k":"p","t":"IX - em caso de morte da parte, a ação for considerada intransmissível por disposição legal; e"},{"k":"p","t":"X - nos demais casos prescritos neste Código."},{"k":"p","t":"§ 1º Nas hipóteses descritas nos incisos II e III, a parte será intimada pessoalmente para suprir a falta no prazo de 5 (cinco) dias."},{"k":"p","t":"§ 2º No caso do § 1º, quanto ao inciso II, as partes pagarão proporcionalmente as custas, e, quanto ao inciso III, o autor será condenado ao pagamento das despesas e dos honorários de advogado."},{"k":"p","t":"§ 3º O juiz conhecerá de ofício da matéria constante dos incisos IV, V, VI e IX, em qualquer tempo e grau de jurisdição, enquanto não ocorrer o trânsito em julgado."},{"k":"p","t":"§ 4º Oferecida a contestação, o autor não poderá, sem o consentimento do réu, desistir da ação."},{"k":"p","t":"§ 5º A desistência da ação pode ser apresentada até a sentença."},{"k":"p","t":"§ 6º Oferecida a contestação, a extinção do processo por abandono da causa pelo autor depende de requerimento do réu."},{"k":"p","t":"§ 7º Interposta a apelação em qualquer dos casos de que tratam os incisos deste artigo, o juiz terá 5 (cinco) dias para retratar-se."},{"k":"p","t":"Art. 486. O pronunciamento judicial que não resolve o mérito não obsta a que a parte proponha de novo a ação."},{"k":"p","t":"§ 1º No caso de extinção em razão de litispendência e nos casos dos incisos I, IV, VI e VII do art. 485 , a propositura da nova ação depende da correção do vício que levou à sentença sem resolução do mérito."},{"k":"p","t":"§ 2º A petição inicial, todavia, não será despachada sem a prova do pagamento ou do depósito das custas e dos honorários de advogado."},{"k":"p","t":"§ 3º Se o autor der causa, por 3 (três) vezes, a sentença fundada em abandono da causa, não poderá propor nova ação contra o réu com o mesmo objeto, ficandolhe ressalvada, entretanto, a possibilidade de alegar em defesa o seu direito."},{"k":"p","t":"Art. 487. Haverá resolução de mérito quando o juiz:"},{"k":"p","t":"I - acolher ou rejeitar o pedido formulado na ação ou na reconvenção;"},{"k":"p","t":"II - decidir, de ofício ou a requerimento, sobre a ocorrência de decadência ou prescrição;"},{"k":"p","t":"III - homologar:"},{"k":"p","t":"a) o reconhecimento da procedência do pedido formulado na ação ou na reconvenção;"},{"k":"p","t":"b) a transação;"},{"k":"p","t":"c) a renúncia à pretensão formulada na ação ou na reconvenção."},{"k":"p","t":"Parágrafo único. Ressalvada a hipótese do § 1º do art. 332 , a prescrição e a decadência não serão reconhecidas sem que antes seja dada às partes oportunidade de manifestar-se."},{"k":"p","t":"Art. 488. Desde que possível, o juiz resolverá o mérito sempre que a decisão for favorável à parte a quem aproveitaria eventual pronunciamento nos termos do art. 485 ."},{"k":"h","t":"SEÇÃO II — DOS ELEMENTOS E DOS EFEITOS DA SENTENÇA"},{"k":"p","t":"Art. 489. São elementos essenciais da sentença:"},{"k":"p","t":"I - o relatório, que conterá os nomes das partes, a identificação do caso, com a suma do pedido e da contestação, e o registro das principais ocorrências havidas no andamento do processo;"},{"k":"p","t":"II - os fundamentos, em que o juiz analisará as questões de fato e de direito;"},{"k":"p","t":"III - o dispositivo, em que o juiz resolverá as questões principais que as partes lhe submeterem."},{"k":"p","t":"§ 1º Não se considera fundamentada qualquer decisão judicial, seja ela interlocutória, sentença ou acórdão, que:"},{"k":"p","t":"I - se limitar à indicação, à reprodução ou à paráfrase de ato normativo, sem explicar sua relação com a causa ou a questão decidida;"},{"k":"p","t":"II - empregar conceitos jurídicos indeterminados, sem explicar o motivo concreto de sua incidência no caso;"},{"k":"p","t":"III - invocar motivos que se prestariam a justificar qualquer outra decisão;"},{"k":"p","t":"IV - não enfrentar todos os argumentos deduzidos no processo capazes de, em tese, infirmar a conclusão adotada pelo julgador;"},{"k":"p","t":"V - se limitar a invocar precedente ou enunciado de súmula, sem identificar seus fundamentos determinantes nem demonstrar que o caso sob julgamento se ajusta àqueles fundamentos;"},{"k":"p","t":"VI - deixar de seguir enunciado de súmula, jurisprudência ou precedente invocado pela parte, sem demonstrar a existência de distinção no caso em julgamento ou a superação do entendimento."},{"k":"p","t":"§ 2º No caso de colisão entre normas, o juiz deve justificar o objeto e os critérios gerais da ponderação efetuada, enunciando as razões que autorizam a interferência na norma afastada e as premissas fáticas que fundamentam a conclusão."},{"k":"p","t":"§ 3º A decisão judicial deve ser interpretada a partir da conjugação de todos os seus elementos e em conformidade com o princípio da boa-fé."},{"k":"p","t":"Art. 490. O juiz resolverá o mérito acolhendo ou rejeitando, no todo ou em parte, os pedidos formulados pelas partes."},{"k":"p","t":"Art. 491. Na ação relativa à obrigação de pagar quantia, ainda que formulado pedido genérico, a decisão definirá desde logo a extensão da obrigação, o índice de correção monetária, a taxa de juros, o termo inicial de ambos e a periodicidade da capitalização dos juros, se for o caso, salvo quando:"},{"k":"p","t":"I - não for possível determinar, de modo definitivo, o montante devido;"},{"k":"p","t":"II - a apuração do valor devido depender da produção de prova de realização demorada ou excessivamente dispendiosa, assim reconhecida na sentença."},{"k":"p","t":"§ 1º Nos casos previstos neste artigo, seguir-se-á a apuração do valor devido por liquidação."},{"k":"p","t":"§ 2º O disposto no caput também se aplica quando o acórdão alterar a sentença."},{"k":"p","t":"Art. 492. É vedado ao juiz proferir decisão de natureza diversa da pedida, bem como condenar a parte em quantidade superior ou em objeto diverso do que lhe foi demandado."},{"k":"p","t":"Parágrafo único. A decisão deve ser certa, ainda que resolva relação jurídica condicional."},{"k":"p","t":"Art. 493. Se, depois da propositura da ação, algum fato constitutivo, modificativo ou extintivo do direito influir no julgamento do mérito, caberá ao juiz tomá-lo em consideração, de ofício ou a requerimento da parte, no momento de proferir a decisão."},{"k":"p","t":"Parágrafo único. Se constatar de ofício o fato novo, o juiz ouvirá as partes sobre ele antes de decidir."},{"k":"p","t":"Art. 494. Publicada a sentença, o juiz só poderá alterála:"},{"k":"p","t":"I - para corrigir-lhe, de ofício ou a requerimento da parte, inexatidões materiais ou erros de cálculo;"},{"k":"p","t":"II - por meio de embargos de declaração."},{"k":"p","t":"Art. 495. A decisão que condenar o réu ao pagamento de prestação consistente em dinheiro e a que determinar a conversão de prestação de fazer, de não fazer ou de dar coisa em prestação pecuniária valerão como título constitutivo de hipoteca judiciária."},{"k":"p","t":"§ 1º A decisão produz a hipoteca judiciária:"},{"k":"p","t":"I - embora a condenação seja genérica;"},{"k":"p","t":"II - ainda que o credor possa promover o cumprimento provisório da sentença ou esteja pendente arresto sobre bem do devedor;"},{"k":"p","t":"III - mesmo que impugnada por recurso dotado de efeito suspensivo."},{"k":"p","t":"§ 2º A hipoteca judiciária poderá ser realizada mediante apresentação de cópia da sentença perante o cartório de registro imobiliário, independentemente de ordem judicial, de declaração expressa do juiz ou de demonstração de urgência."},{"k":"p","t":"§ 3º No prazo de até 15 (quinze) dias da data de realização da hipoteca, a parte informá-la-á ao juízo da causa, que determinará a intimação da outra parte para que tome ciência do ato."},{"k":"p","t":"§ 4º A hipoteca judiciária, uma vez constituída, implicará, para o credor hipotecário, o direito de preferência, quanto ao pagamento, em relação a outros credores, observada a prioridade no registro."},{"k":"p","t":"§ 5º Sobrevindo a reforma ou a invalidação da decisão que impôs o pagamento de quantia, a parte responderá, independentemente de culpa, pelos danos que a outra parte tiver sofrido em razão da constituição da garantia, devendo o valor da indenização ser liquidado e executado nos próprios autos."}]},{"id":"s16","title":"SEÇÃO III — DA REMESSA NECESSÁRIA · arts. 496 a 512","tag":"","b":[{"k":"h","t":"SEÇÃO III — DA REMESSA NECESSÁRIA"},{"k":"p","t":"Art. 496. Está sujeita ao duplo grau de jurisdição, não produzindo efeito senão depois de confirmada pelo tribunal, a sentença:"},{"k":"p","t":"I - proferida contra a União, os Estados, o Distrito Federal, os Municípios e suas respectivas autarquias e fundações de direito público;"},{"k":"p","t":"II - que julgar procedentes, no todo ou em parte, os embargos à execução fiscal."},{"k":"p","t":"§ 1º Nos casos previstos neste artigo, não interposta a apelação no prazo legal, o juiz ordenará a remessa dos autos ao tribunal, e, se não o fizer, o presidente do respectivo tribunal avocá-los-á."},{"k":"p","t":"§ 2º Em qualquer dos casos referidos no § 1º, o tribunal julgará a remessa necessária."},{"k":"p","t":"§ 3º Não se aplica o disposto neste artigo quando a condenação ou o proveito econômico obtido na causa for de valor certo e líquido inferior a:"},{"k":"p","t":"I - 1.000 (mil) salários-mínimos para a União e as respectivas autarquias e fundações de direito público;"},{"k":"p","t":"II - 500 (quinhentos) salários-mínimos para os Estados, o Distrito Federal, as respectivas autarquias e fundações de direito público e os Municípios que constituam capitais dos Estados;"},{"k":"p","t":"III - 100 (cem) salários-mínimos para todos os demais Municípios e respectivas autarquias e fundações de direito público."},{"k":"p","t":"§ 4º Também não se aplica o disposto neste artigo quando a sentença estiver fundada em:"},{"k":"p","t":"I - súmula de tribunal superior;"},{"k":"p","t":"II - acórdão proferido pelo Supremo Tribunal Federal ou pelo Superior Tribunal de Justiça em julgamento de recursos repetitivos;"},{"k":"p","t":"III - entendimento firmado em incidente de resolução de demandas repetitivas ou de assunção de competência;"},{"k":"p","t":"IV - entendimento coincidente com orientação vinculante firmada no âmbito administrativo do próprio ente público, consolidada em manifestação, parecer ou súmula administrativa."},{"k":"h","t":"SEÇÃO IV — DO JULGAMENTO DAS AÇÕES RELATIVAS ÀS PRESTAÇÕES DE FAZER, DE NÃO FAZER E DE ENTREGAR COISA"},{"k":"p","t":"Art. 497. Na ação que tenha por objeto a prestação de fazer ou de não fazer, o juiz, se procedente o pedido, concederá a tutela específica ou determinará providências que assegurem a obtenção de tutela pelo resultado prático equivalente."},{"k":"p","t":"Parágrafo único. Para a concessão da tutela específica destinada a inibir a prática, a reiteração ou a continuação de um ilícito, ou a sua remoção, é irrelevante a demonstração da ocorrência de dano ou da existência de culpa ou dolo."},{"k":"p","t":"Art. 498. Na ação que tenha por objeto a entrega de coisa, o juiz, ao conceder a tutela específica, fixará o prazo para o cumprimento da obrigação."},{"k":"p","t":"Parágrafo único. Tratando-se de entrega de coisa determinada pelo gênero e pela quantidade, o autor individualizá-la-á na petição inicial, se lhe couber a escolha, ou, se a escolha couber ao réu, este a entregará individualizada, no prazo fixado pelo juiz."},{"k":"p","t":"Art. 499. A obrigação somente será convertida em perdas e danos se o autor o requerer ou se impossível a tutela específica ou a obtenção de tutela pelo resultado prático equivalente."},{"k":"p","t":"Art. 500. A indenização por perdas e danos dar-se-á sem prejuízo da multa fixada periodicamente para compelir o réu ao cumprimento específico da obrigação."},{"k":"p","t":"Art. 501. Na ação que tenha por objeto a emissão de declaração de vontade, a sentença que julgar procedente o pedido, uma vez transitada em julgado, produzirá todos os efeitos da declaração não emitida."},{"k":"h","t":"SEÇÃO V — DA COISA JULGADA"},{"k":"p","t":"Art. 502. Denomina-se coisa julgada material a autoridade que torna imutável e indiscutível a decisão de mérito não mais sujeita a recurso."},{"k":"p","t":"Art. 503. A decisão que julgar total ou parcialmente o mérito tem força de lei nos limites da questão principal expressamente decidida."},{"k":"p","t":"§ 1º O disposto no caput aplica-se à resolução de questão prejudicial, decidida expressa e incidentemente no processo, se:"},{"k":"p","t":"I - dessa resolução depender o julgamento do mérito;"},{"k":"p","t":"II - a seu respeito tiver havido contraditório prévio e efetivo, não se aplicando no caso de revelia;"},{"k":"p","t":"III - o juízo tiver competência em razão da matéria e da pessoa para resolvê-la como questão principal."},{"k":"p","t":"§ 2º A hipótese do § 1º não se aplica se no processo houver restrições probatórias ou limitações à cognição que impeçam o aprofundamento da análise da questão prejudicial."},{"k":"p","t":"Art. 504. Não fazem coisa julgada:"},{"k":"p","t":"I - os motivos, ainda que importantes para determinar o alcance da parte dispositiva da sentença;"},{"k":"p","t":"II - a verdade dos fatos, estabelecida como fundamento da sentença."},{"k":"p","t":"Art. 505. Nenhum juiz decidirá novamente as questões já decididas relativas à mesma lide, salvo:"},{"k":"p","t":"I - se, tratando-se de relação jurídica de trato continuado, sobreveio modificação no estado de fato ou de direito, caso em que poderá a parte pedir a revisão do que foi estatuído na sentença;"},{"k":"p","t":"II - nos demais casos prescritos em lei."},{"k":"p","t":"Art. 506. A sentença faz coisa julgada às partes entre as quais é dada, não prejudicando terceiros."},{"k":"p","t":"Art. 507. É vedado à parte discutir no curso do processo as questões já decididas a cujo respeito se operou a preclusão."},{"k":"p","t":"Art. 508. Transitada em julgado a decisão de mérito, considerar-se-ão deduzidas e repelidas todas as alegações e as defesas que a parte poderia opor tanto ao acolhimento quanto à rejeição do pedido."},{"k":"h","t":"CAPÍTULO XIV — DA LIQUIDAÇÃO DE SENTENÇA"},{"k":"p","t":"Art. 509. Quando a sentença condenar ao pagamento de quantia ilíquida, proceder-se-á à sua liquidação, a requerimento do credor ou do devedor:"},{"k":"p","t":"I - por arbitramento, quando determinado pela sentença, convencionado pelas partes ou exigido pela natureza do objeto da liquidação;"},{"k":"p","t":"II - pelo procedimento comum, quando houver necessidade de alegar e provar fato novo."},{"k":"p","t":"§ 1º Quando na sentença houver uma parte líquida e outra ilíquida, ao credor é lícito promover simultaneamente a execução daquela e, em autos apartados, a liquidação desta."},{"k":"p","t":"§ 2º Quando a apuração do valor depender apenas de cálculo aritmético, o credor poderá promover, desde logo, o cumprimento da sentença."},{"k":"p","t":"§ 3º O Conselho Nacional de Justiça desenvolverá e colocará à disposição dos interessados programa de atualização financeira."},{"k":"p","t":"§ 4º Na liquidação é vedado discutir de novo a lide ou modificar a sentença que a julgou."},{"k":"p","t":"Art. 510. Na liquidação por arbitramento, o juiz intimará as partes para a apresentação de pareceres ou documentos elucidativos, no prazo que fixar, e, caso não possa decidir de plano, nomeará perito, observando-se, no que couber, o procedimento da prova pericial."},{"k":"p","t":"Art. 511. Na liquidação pelo procedimento comum, o juiz determinará a intimação do requerido, na pessoa de seu advogado ou da sociedade de advogados a que estiver vinculado, para, querendo, apresentar contestação no prazo de 15 (quinze) dias, observandose, a seguir, no que couber, o disposto no Livro I da Parte Especial deste Código ."},{"k":"p","t":"Art. 512. A liquidação poderá ser realizada na pendência de recurso, processando-se em autos apartados no juízo de origem, cumprindo ao liquidante instruir o pedido com cópias das peças processuais pertinentes."}]},{"id":"s17","title":"TÍTULO II — DO CUMPRIMENTO DA SENTENÇA · arts. 513 a 527","tag":"","b":[{"k":"h","t":"TÍTULO II — DO CUMPRIMENTO DA SENTENÇA"},{"k":"h","t":"CAPÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 513. O cumprimento da sentença será feito segundo as regras deste Título, observando-se, no que couber e conforme a natureza da obrigação, o disposto no Livro II da Parte Especial deste Código."},{"k":"p","t":"§ 1º O cumprimento da sentença que reconhece o dever de pagar quantia, provisório ou definitivo, far-seá a requerimento do exequente."},{"k":"p","t":"§ 2º O devedor será intimado para cumprir a sentença:"},{"k":"p","t":"I - pelo Diário da Justiça, na pessoa de seu advogado constituído nos autos;"},{"k":"p","t":"II - por carta com aviso de recebimento, quando representado pela Defensoria Pública ou quando não tiver procurador constituído nos autos, ressalvada a hipótese do inciso IV;"},{"k":"p","t":"III - por meio eletrônico, quando, no caso do § 1º do art. 246 , não tiver procurador constituído nos autos"},{"k":"p","t":"IV - por edital, quando, citado na forma do art. 256 , tiver sido revel na fase de conhecimento."},{"k":"p","t":"§ 3º Na hipótese do § 2º, incisos II e III, considera-se realizada a intimação quando o devedor houver mudado de endereço sem prévia comunicação ao juízo, observado o disposto no parágrafo único do art. 274."},{"k":"p","t":"§ 4º Se o requerimento a que alude o § 1º for formulado após 1 (um) ano do trânsito em julgado da sentença, a intimação será feita na pessoa do devedor, por meio de carta com aviso de recebimento encaminhada ao endereço constante dos autos, observado o disposto no parágrafo único do art. 274 e no § 3º deste artigo."},{"k":"p","t":"§ 5º O cumprimento da sentença não poderá ser promovido em face do fiador, do coobrigado ou do corresponsável que não tiver participado da fase de conhecimento."},{"k":"p","t":"Art. 514. Quando o juiz decidir relação jurídica sujeita a condição ou termo, o cumprimento da sentença dependerá de demonstração de que se realizou a condição ou de que ocorreu o termo."},{"k":"p","t":"Art. 515. São títulos executivos judiciais, cujo cumprimento dar-se-á de acordo com os artigos previstos neste Título:"},{"k":"p","t":"I - as decisões proferidas no processo civil que reconheçam a exigibilidade de obrigação de pagar quantia, de fazer, de não fazer ou de entregar coisa;"},{"k":"p","t":"II - a decisão homologatória de autocomposição judicial;"},{"k":"p","t":"III - a decisão homologatória de autocomposição extrajudicial de qualquer natureza;"},{"k":"p","t":"IV - o formal e a certidão de partilha, exclusivamente em relação ao inventariante, aos herdeiros e aos sucessores a título singular ou universal;"},{"k":"p","t":"V - o crédito de auxiliar da justiça, quando as custas, emolumentos ou honorários tiverem sido aprovados por decisão judicial;"},{"k":"p","t":"VI - a sentença penal condenatória transitada em julgado;"},{"k":"p","t":"VII - a sentença arbitral;"},{"k":"p","t":"VIII - a sentença estrangeira homologada pelo Superior Tribunal de Justiça;"},{"k":"p","t":"IX - a decisão interlocutória estrangeira, após a concessão do exequatur à carta rogatória pelo Superior Tribunal de Justiça;"},{"k":"p","t":"X - (VETADO)."},{"k":"p","t":"§ 1º Nos casos dos incisos VI a IX, o devedor será citado no juízo cível para o cumprimento da sentença ou para a liquidação no prazo de 15 (quinze) dias."},{"k":"p","t":"§ 2º A autocomposição judicial pode envolver sujeito estranho ao processo e versar sobre relação jurídica que não tenha sido deduzida em juízo."},{"k":"p","t":"Art. 516. O cumprimento da sentença efetuar-se-á perante:"},{"k":"p","t":"I - os tribunais, nas causas de sua competência originária;"},{"k":"p","t":"II - o juízo que decidiu a causa no primeiro grau de jurisdição;"},{"k":"p","t":"III - o juízo cível competente, quando se tratar de sentença penal condenatória, de sentença arbitral, de sentença estrangeira ou de acórdão proferido pelo Tribunal Marítimo."},{"k":"p","t":"Parágrafo único. Nas hipóteses dos incisos II e III, o exequente poderá optar pelo juízo do atual domicílio do executado, pelo juízo do local onde se encontrem os bens sujeitos à execução ou pelo juízo do local onde deva ser executada a obrigação de fazer ou de não fazer, casos em que a remessa dos autos do processo será solicitada ao juízo de origem."},{"k":"p","t":"Art. 517. A decisão judicial transitada em julgado poderá ser levada a protesto, nos termos da lei, depois de transcorrido o prazo para pagamento voluntário previsto no art. 523."},{"k":"p","t":"§ 1º Para efetivar o protesto, incumbe ao exequente apresentar certidão de teor da decisão."},{"k":"p","t":"§ 2º A certidão de teor da decisão deverá ser fornecida no prazo de 3 (três) dias e indicará o nome e a qualificação do exequente e do executado, o número do processo, o valor da dívida e a data de decurso do prazo para pagamento voluntário."},{"k":"p","t":"§ 3º O executado que tiver proposto ação rescisória para impugnar a decisão exequenda pode requerer, a suas expensas e sob sua responsabilidade, a anotação da propositura da ação à margem do título protestado."},{"k":"p","t":"§ 4º A requerimento do executado, o protesto será cancelado por determinação do juiz, mediante ofício a ser expedido ao cartório, no prazo de 3 (três) dias, contado da data de protocolo do requerimento, desde que comprovada a satisfação integral da obrigação."},{"k":"p","t":"Art. 518. Todas as questões relativas à validade do procedimento de cumprimento da sentença e dos atos executivos subsequentes poderão ser arguidas pelo executado nos próprios autos e nestes serão decididas pelo juiz."},{"k":"p","t":"Art. 519. Aplicam-se as disposições relativas ao cumprimento da sentença, provisório ou definitivo, e à liquidação, no que couber, às decisões que concederem tutela provisória."},{"k":"h","t":"CAPÍTULO II — DO CUMPRIMENTO PROVISÓRIO DA SENTENÇA QUE RECONHECE A EXIGIBILIDADE DE OBRIGAÇÃO DE PAGAR QUANTIA CERTA"},{"k":"p","t":"Art. 520. O cumprimento provisório da sentença impugnada por recurso desprovido de efeito suspensivo será realizado da mesma forma que o cumprimento definitivo, sujeitando-se ao seguinte regime:"},{"k":"p","t":"I - corre por iniciativa e responsabilidade do exequente, que se obriga, se a sentença for reformada, a reparar os danos que o executado haja sofrido;"},{"k":"p","t":"II - fica sem efeito, sobrevindo decisão que modifique ou anule a sentença objeto da execução, restituindose as partes ao estado anterior e liquidando-se eventuais prejuízos nos mesmos autos;"},{"k":"p","t":"III - se a sentença objeto de cumprimento provisório for modificada ou anulada apenas em parte, somente nesta ficará sem efeito a execução;"},{"k":"p","t":"IV - o levantamento de depósito em dinheiro e a prática de atos que importem transferência de posse ou alienação de propriedade ou de outro direito real, ou dos quais possa resultar grave dano ao executado, dependem de caução suficiente e idônea, arbitrada de plano pelo juiz e prestada nos próprios autos."},{"k":"p","t":"§ 1º No cumprimento provisório da sentença, o executado poderá apresentar impugnação, se quiser, nos termos do art. 525 ."},{"k":"p","t":"§ 2º A multa e os honorários a que se refere o § 1º do art. 523 são devidos no cumprimento provisório de sentença condenatória ao pagamento de quantia certa."},{"k":"p","t":"§ 3º Se o executado comparecer tempestivamente e depositar o valor, com a finalidade de isentar-se da multa, o ato não será havido como incompatível com o recurso por ele interposto."},{"k":"p","t":"§ 4º A restituição ao estado anterior a que se refere o inciso II não implica o desfazimento da transferência de posse ou da alienação de propriedade ou de outro direito real eventualmente já realizada, ressalvado, sempre, o direito à reparação dos prejuízos causados ao executado."},{"k":"p","t":"§ 5º Ao cumprimento provisório de sentença que reconheça obrigação de fazer, de não fazer ou de dar coisa aplica-se, no que couber, o disposto neste Capítulo."},{"k":"p","t":"Art. 521. A caução prevista no inciso IV do art. 520 poderá ser dispensada nos casos em que:"},{"k":"p","t":"I - o crédito for de natureza alimentar, independentemente de sua origem;"},{"k":"p","t":"II - o credor demonstrar situação de necessidade;"},{"k":"p","t":"III – pender o agravo do art. 1.042; (Redação dada pela Lei nº 13.256, de 2016) (Vigência)"},{"k":"p","t":"IV - a sentença a ser provisoriamente cumprida estiver em consonância com súmula da jurisprudência do Supremo Tribunal Federal ou do Superior Tribunal de Justiça ou em conformidade com acórdão proferido no julgamento de casos repetitivos."},{"k":"p","t":"Parágrafo único. A exigência de caução será mantida quando da dispensa possa resultar manifesto risco de grave dano de difícil ou incerta reparação."},{"k":"p","t":"Art. 522. O cumprimento provisório da sentença será requerido por petição dirigida ao juízo competente."},{"k":"p","t":"Parágrafo único. Não sendo eletrônicos os autos, a petição será acompanhada de cópias das seguintes peças do processo, cuja autenticidade poderá ser certificada pelo próprio advogado, sob sua responsabilidade pessoal:"},{"k":"p","t":"I - decisão exequenda;"},{"k":"p","t":"II - certidão de interposição do recurso não dotado de efeito suspensivo;"},{"k":"p","t":"III - procurações outorgadas pelas partes;"},{"k":"p","t":"IV - decisão de habilitação, se for o caso;"},{"k":"p","t":"V - facultativamente, outras peças processuais consideradas necessárias para demonstrar a existência do crédito."},{"k":"h","t":"CAPÍTULO III — DO CUMPRIMENTO DEFINITIVO DA SENTENÇA QUE RECONHECE A EXIGIBILIDADE DE OBRIGAÇÃO DE PAGAR QUANTIA CERTA"},{"k":"p","t":"Art. 523. No caso de condenação em quantia certa, ou já fixada em liquidação, e no caso de decisão sobre parcela incontroversa, o cumprimento definitivo da sentença far-se-á a requerimento do exequente, sendo o executado intimado para pagar o débito, no prazo de 15 (quinze) dias, acrescido de custas, se houver."},{"k":"p","t":"§ 1º Não ocorrendo pagamento voluntário no prazo do caput , o débito será acrescido de multa de dez por cento e, também, de honorários de advogado de dez por cento."},{"k":"p","t":"§ 2º Efetuado o pagamento parcial no prazo previsto no caput , a multa e os honorários previstos no § 1º incidirão sobre o restante."},{"k":"p","t":"§ 3º Não efetuado tempestivamente o pagamento voluntário, será expedido, desde logo, mandado de penhora e avaliação, seguindo-se os atos de expropriação."},{"k":"p","t":"Art. 524. O requerimento previsto no art. 523 será instruído com demonstrativo discriminado e atualizado do crédito, devendo a petição conter:"},{"k":"p","t":"I - o nome completo, o número de inscrição no Cadastro de Pessoas Físicas ou no Cadastro Nacional da Pessoa Jurídica do exequente e do executado, observado o disposto no art. 319, §§ 1º a 3º ;"},{"k":"p","t":"II - o índice de correção monetária adotado;"},{"k":"p","t":"III - os juros aplicados e as respectivas taxas;"},{"k":"p","t":"IV - o termo inicial e o termo final dos juros e da correção monetária utilizados;"},{"k":"p","t":"V - a periodicidade da capitalização dos juros, se for o caso;"},{"k":"p","t":"VI - especificação dos eventuais descontos obrigatórios realizados;"},{"k":"p","t":"VII - indicação dos bens passíveis de penhora, sempre que possível."},{"k":"p","t":"§ 1º Quando o valor apontado no demonstrativo aparentemente exceder os limites da condenação, a execução será iniciada pelo valor pretendido, mas a penhora terá por base a importância que o juiz entender adequada."},{"k":"p","t":"§ 2º Para a verificação dos cálculos, o juiz poderá valerse de contabilista do juízo, que terá o prazo máximo de 30 (trinta) dias para efetuá-la, exceto se outro lhe for determinado."},{"k":"p","t":"§ 3º Quando a elaboração do demonstrativo depender de dados em poder de terceiros ou do executado, o juiz poderá requisitá-los, sob cominação do crime de desobediência."},{"k":"p","t":"§ 4º Quando a complementação do demonstrativo depender de dados adicionais em poder do executado, o juiz poderá, a requerimento do exequente, requisitá-los, fixando prazo de até 30 (trinta) dias para o cumprimento da diligência."},{"k":"p","t":"§ 5º Se os dados adicionais a que se refere o § 4º não forem apresentados pelo executado, sem justificativa, no prazo designado, reputar-se-ão corretos os cálculos apresentados pelo exequente apenas com base nos dados de que dispõe."},{"k":"p","t":"Art. 525. Transcorrido o prazo previsto no art. 523 sem o pagamento voluntário, inicia-se o prazo de 15 (quinze) dias para que o executado, independentemente de penhora ou nova intimação, apresente, nos próprios autos, sua impugnação."},{"k":"p","t":"§ 1º Na impugnação, o executado poderá alegar:"},{"k":"p","t":"I - falta ou nulidade da citação se, na fase de conhecimento, o processo correu à revelia;"},{"k":"p","t":"II - ilegitimidade de parte;"},{"k":"p","t":"III - inexequibilidade do título ou inexigibilidade da obrigação;"},{"k":"p","t":"IV - penhora incorreta ou avaliação errônea;"},{"k":"p","t":"V - excesso de execução ou cumulação indevida de execuções;"},{"k":"p","t":"VI - incompetência absoluta ou relativa do juízo da execução;"},{"k":"p","t":"VII - qualquer causa modificativa ou extintiva da obrigação, como pagamento, novação, compensação, transação ou prescrição, desde que supervenientes à sentença."},{"k":"p","t":"§ 2º A alegação de impedimento ou suspeição observará o disposto nos arts. 146 e 148 ."},{"k":"p","t":"§ 3º Aplica-se à impugnação o disposto no art. 229."},{"k":"p","t":"§ 4º Quando o executado alegar que o exequente, em excesso de execução, pleiteia quantia superior à resultante da sentença, cumprir-lhe-á declarar de imediato o valor que entende correto, apresentando demonstrativo discriminado e atualizado de seu cálculo."},{"k":"p","t":"§ 5º Na hipótese do § 4º, não apontado o valor correto ou não apresentado o demonstrativo, a impugnação será liminarmente rejeitada, se o excesso de execução for o seu único fundamento, ou, se houver outro, a impugnação será processada, mas o juiz não examinará a alegação de excesso de execução."},{"k":"p","t":"§ 6º A apresentação de impugnação não impede a prática dos atos executivos, inclusive os de expropriação, podendo o juiz, a requerimento do executado e desde que garantido o juízo com penhora, caução ou depósito suficientes, atribuir-lhe efeito suspensivo, se seus fundamentos forem relevantes e se o prosseguimento da execução for manifestamente suscetível de causar ao executado grave dano de difícil ou incerta reparação."},{"k":"p","t":"§ 7º A concessão de efeito suspensivo a que se refere o § 6º não impedirá a efetivação dos atos de substituição, de reforço ou de redução da penhora e de avaliação dos bens"},{"k":"p","t":"§ 8º Quando o efeito suspensivo atribuído à impugnação disser respeito apenas a parte do objeto da execução, esta prosseguirá quanto à parte restante."},{"k":"p","t":"§ 9º A concessão de efeito suspensivo à impugnação deduzida por um dos executados não suspenderá a execução contra os que não impugnaram, quando o respectivo fundamento disser respeito exclusivamente ao impugnante."},{"k":"p","t":"§ 10. Ainda que atribuído efeito suspensivo à impugnação, é lícito ao exequente requerer o prosseguimento da execução, oferecendo e prestando, nos próprios autos, caução suficiente e idônea a ser arbitrada pelo juiz."},{"k":"p","t":"§ 11. As questões relativas a fato superveniente ao término do prazo para apresentação da impugnação, assim como aquelas relativas à validade e à adequação da penhora, da avaliação e dos atos executivos subsequentes, podem ser arguidas por simples petição, tendo o executado, em qualquer dos casos, o prazo de 15 (quinze) dias para formular esta arguição, contado da comprovada ciência do fato ou da intimação do ato."},{"k":"p","t":"§ 12. Para efeito do disposto no inciso III do § 1º deste artigo, considera-se também inexigível a obrigação reconhecida em título executivo judicial fundado em lei ou ato normativo considerado inconstitucional pelo Supremo Tribunal Federal, ou fundado em aplicação ou interpretação da lei ou do ato normativo tido pelo Supremo Tribunal Federal como incompatível com a Constituição Federal , em controle de constitucionalidade concentrado ou difuso."},{"k":"p","t":"§ 13. No caso do § 12, os efeitos da decisão do Supremo Tribunal Federal poderão ser modulados no tempo, em atenção à segurança jurídica."},{"k":"p","t":"§ 14. A decisão do Supremo Tribunal Federal referida no § 12 deve ser anterior ao trânsito em julgado da decisão exequenda."},{"k":"p","t":"§ 15. Se a decisão referida no § 12 for proferida após o trânsito em julgado da decisão exequenda, caberá ação rescisória, cujo prazo será contado do trânsito em julgado da decisão proferida pelo Supremo Tribunal Federal."},{"k":"p","t":"Art. 526. É lícito ao réu, antes de ser intimado para o cumprimento da sentença, comparecer em juízo e oferecer em pagamento o valor que entender devido, apresentando memória discriminada do cálculo."},{"k":"p","t":"§ 1º O autor será ouvido no prazo de 5 (cinco) dias, podendo impugnar o valor depositado, sem prejuízo do levantamento do depósito a título de parcela incontroversa."},{"k":"p","t":"§ 2º Concluindo o juiz pela insuficiência do depósito, sobre a diferença incidirão multa de dez por cento e honorários advocatícios, também fixados em dez por cento, seguindo-se a execução com penhora e atos subsequentes."},{"k":"p","t":"§ 3º Se o autor não se opuser, o juiz declarará satisfeita a obrigação e extinguirá o processo."},{"k":"p","t":"Art. 527. Aplicam-se as disposições deste Capítulo ao cumprimento provisório da sentença, no que couber."}]},{"id":"s18","title":"CAPÍTULO IV — DO CUMPRIMENTO DE SENTENÇA QUE RECONHEÇA A EXIGIBILIDADE DE OBRIGA · arts. 528 a 538","tag":"","b":[{"k":"h","t":"CAPÍTULO IV — DO CUMPRIMENTO DE SENTENÇA QUE RECONHEÇA A EXIGIBILIDADE DE OBRIGAÇÃO DE PRESTAR ALIMENTOS"},{"k":"p","t":"Art. 528. No cumprimento de sentença que condene ao pagamento de prestação alimentícia ou de decisão interlocutória que fixe alimentos, o juiz, a requerimento do exequente, mandará intimar o executado pessoalmente para, em 3 (três) dias, pagar o débito, provar que o fez ou justificar a impossibilidade de efetuá-lo."},{"k":"p","t":"§ 1º Caso o executado, no prazo referido no caput , não efetue o pagamento, não prove que o efetuou ou não apresente justificativa da impossibilidade de efetuá-lo, o juiz mandará protestar o pronunciamento judicial, aplicando-se, no que couber, o disposto no art. 517 ."},{"k":"p","t":"§ 2º Somente a comprovação de fato que gere a impossibilidade absoluta de pagar justificará o inadimplemento."},{"k":"p","t":"§ 3º Se o executado não pagar ou se a justificativa apresentada não for aceita, o juiz, além de mandar protestar o pronunciamento judicial na forma do § 1º, decretar-lhe-á a prisão pelo prazo de 1 (um) a 3 (três) meses."},{"k":"p","t":"§ 4º A prisão será cumprida em regime fechado, devendo o preso ficar separado dos presos comuns."},{"k":"p","t":"§ 5º O cumprimento da pena não exime o executado do pagamento das prestações vencidas e vincendas."},{"k":"p","t":"§ 6º Paga a prestação alimentícia, o juiz suspenderá o cumprimento da ordem de prisão."},{"k":"p","t":"§ 7º O débito alimentar que autoriza a prisão civil do alimentante é o que compreende até as 3 (três) prestações anteriores ao ajuizamento da execução e as que se vencerem no curso do processo."},{"k":"p","t":"§ 8º O exequente pode optar por promover o cumprimento da sentença ou decisão desde logo, nos termos do disposto neste Livro, Título II, Capítulo III, caso em que não será admissível a prisão do executado, e, recaindo a penhora em dinheiro, a concessão de efeito suspensivo à impugnação não obsta a que o exequente levante mensalmente a importância da prestação."},{"k":"p","t":"§ 9º Além das opções previstas no art. 516 , parágrafo único, o exequente pode promover o cumprimento da sentença ou decisão que condena ao pagamento de prestação alimentícia no juízo de seu domicílio."},{"k":"p","t":"Art. 529. Quando o executado for funcionário público, militar, diretor ou gerente de empresa ou empregado sujeito à legislação do trabalho, o exequente poderá requerer o desconto em folha de pagamento da importância da prestação alimentícia."},{"k":"p","t":"§ 1º Ao proferir a decisão, o juiz oficiará à autoridade, à empresa ou ao empregador, determinando, sob pena de crime de desobediência, o desconto a partir da primeira remuneração posterior do executado, a contar do protocolo do ofício."},{"k":"p","t":"§ 2º O ofício conterá o nome e o número de inscrição no Cadastro de Pessoas Físicas do exequente e do executado, a importância a ser descontada mensalmente, o tempo de sua duração e a conta na qual deve ser feito o depósito."},{"k":"p","t":"§ 3º Sem prejuízo do pagamento dos alimentos vincendos, o débito objeto de execução pode ser descontado dos rendimentos ou rendas do executado, de forma parcelada, nos termos do caput deste artigo, contanto que, somado à parcela devida, não ultrapasse cinquenta por cento de seus ganhos líquidos."},{"k":"p","t":"Art. 530. Não cumprida a obrigação, observar-se-á o disposto nos arts. 831 e seguintes ."},{"k":"p","t":"Art. 531. O disposto neste Capítulo aplica-se aos alimentos definitivos ou provisórios."},{"k":"p","t":"§ 1º A execução dos alimentos provisórios, bem como a dos alimentos fixados em sentença ainda não transitada em julgado, se processa em autos apartados."},{"k":"p","t":"§ 2º O cumprimento definitivo da obrigação de prestar alimentos será processado nos mesmos autos em que tenha sido proferida a sentença."},{"k":"p","t":"Art. 532. Verificada a conduta procrastinatória do executado, o juiz deverá, se for o caso, dar ciência ao Ministério Público dos indícios da prática do crime de abandono material."},{"k":"p","t":"Art. 533. Quando a indenização por ato ilícito incluir prestação de alimentos, caberá ao executado, a requerimento do exequente, constituir capital cuja renda assegure o pagamento do valor mensal da pensão."},{"k":"p","t":"§ 1º O capital a que se refere o caput , representado por imóveis ou por direitos reais sobre imóveis suscetíveis de alienação, títulos da dívida pública ou aplicações financeiras em banco oficial, será inalienável e impenhorável enquanto durar a obrigação do executado, além de constituir-se em patrimônio de afetação."},{"k":"p","t":"§ 2º O juiz poderá substituir a constituição do capital pela inclusão do exequente em folha de pagamento de pessoa jurídica de notória capacidade econômica ou, a requerimento do executado, por fiança bancária ou garantia real, em valor a ser arbitrado de imediato pelo juiz."},{"k":"p","t":"§ 3º Se sobrevier modificação nas condições econômicas, poderá a parte requerer, conforme as circunstâncias, redução ou aumento da prestação."},{"k":"p","t":"§ 4º A prestação alimentícia poderá ser fixada tomando por base o salário-mínimo."},{"k":"p","t":"§ 5º Finda a obrigação de prestar alimentos, o juiz mandará liberar o capital, cessar o desconto em folha ou cancelar as garantias prestadas."},{"k":"h","t":"CAPÍTULO V — DO CUMPRIMENTO DE SENTENÇA QUE RECONHEÇA A EXIGIBILIDADE DE OBRIGAÇÃO DE PAGAR QUANTIA CERTA PELA FAZENDA PÚBLICA"},{"k":"p","t":"Art. 534. No cumprimento de sentença que impuser à Fazenda Pública o dever de pagar quantia certa, o exequente apresentará demonstrativo discriminado e atualizado do crédito contendo:"},{"k":"p","t":"I - o nome completo e o número de inscrição no Cadastro de Pessoas Físicas ou no Cadastro Nacional da Pessoa Jurídica do exequente;"},{"k":"p","t":"II - o índice de correção monetária adotado;"},{"k":"p","t":"III - os juros aplicados e as respectivas taxas;"},{"k":"p","t":"IV - o termo inicial e o termo final dos juros e da correção monetária utilizados;"},{"k":"p","t":"V - a periodicidade da capitalização dos juros, se for o caso;"},{"k":"p","t":"VI - a especificação dos eventuais descontos obrigatórios realizados."},{"k":"p","t":"§ 1º Havendo pluralidade de exequentes, cada um deverá apresentar o seu próprio demonstrativo, aplicando-se à hipótese, se for o caso, o disposto nos §§ 1º e 2º do art. 113 ."},{"k":"p","t":"§ 2º A multa prevista no § 1º do art. 523 não se aplica à Fazenda Pública."},{"k":"p","t":"Art. 535. A Fazenda Pública será intimada na pessoa de seu representante judicial, por carga, remessa ou meio eletrônico, para, querendo, no prazo de 30 (trinta) dias e nos próprios autos, impugnar a execução, podendo arguir:"},{"k":"p","t":"I - falta ou nulidade da citação se, na fase de conhecimento, o processo correu à revelia;"},{"k":"p","t":"II - ilegitimidade de parte;"},{"k":"p","t":"III - inexequibilidade do título ou inexigibilidade da obrigação;"},{"k":"p","t":"IV - excesso de execução ou cumulação indevida de execuções;"},{"k":"p","t":"V - incompetência absoluta ou relativa do juízo da execução;"},{"k":"p","t":"VI - qualquer causa modificativa ou extintiva da obrigação, como pagamento, novação, compensação, transação ou prescrição, desde que supervenientes ao trânsito em julgado da sentença."},{"k":"p","t":"§ 1º A alegação de impedimento ou suspeição observará o disposto nos arts. 146 e 148 ."},{"k":"p","t":"§ 2º Quando se alegar que o exequente, em excesso de execução, pleiteia quantia superior à resultante do título, cumprirá à executada declarar de imediato o valor que entende correto, sob pena de não conhecimento da arguição."},{"k":"p","t":"§ 3º Não impugnada a execução ou rejeitadas as arguições da executada:"},{"k":"p","t":"I - expedir-se-á, por intermédio do presidente do tribunal competente, precatório em favor do exequente, observando-se o disposto na Constituição Federal ;"},{"k":"p","t":"II - por ordem do juiz, dirigida à autoridade na pessoa de quem o ente público foi citado para o processo, o pagamento de obrigação de pequeno valor será realizado no prazo de 2 (dois) meses contado da entrega da requisição, mediante depósito na agência de banco oficial mais próxima da residência do exequente."},{"k":"p","t":"§ 4º Tratando-se de impugnação parcial, a parte não questionada pela executada será, desde logo, objeto de cumprimento."},{"k":"p","t":"§ 5º Para efeito do disposto no inciso III do caput deste artigo, considera-se também inexigível a obrigação reconhecida em título executivo judicial fundado em lei ou ato normativo considerado inconstitucional pelo Supremo Tribunal Federal, ou fundado em aplicação ou interpretação da lei ou do ato normativo tido pelo Supremo Tribunal Federal como incompatível com a Constituição Federal , em controle de constitucionalidade concentrado ou difuso."},{"k":"p","t":"§ 6º No caso do § 5º, os efeitos da decisão do Supremo Tribunal Federal poderão ser modulados no tempo, de modo a favorecer a segurança jurídica."},{"k":"p","t":"§ 7º A decisão do Supremo Tribunal Federal referida no § 5º deve ter sido proferida antes do trânsito em julgado da decisão exequenda."},{"k":"p","t":"§ 8º Se a decisão referida no § 5º for proferida após o trânsito em julgado da decisão exequenda, caberá ação rescisória, cujo prazo será contado do trânsito em julgado da decisão proferida pelo Supremo Tribunal Federal."},{"k":"h","t":"CAPÍTULO VI — DO CUMPRIMENTO DE SENTENÇA QUE RECONHEÇA A EXIGIBILIDADE DE OBRIGAÇÃO DE FAZER, DE NÃO FAZER OU DE ENTREGAR COISA"},{"k":"h","t":"SEÇÃO I — DO CUMPRIMENTO DE SENTENÇA QUE RECONHEÇA A EXIGIBILIDADE DE OBRIGAÇÃO DE FAZER OU DE NÃO FAZER"},{"k":"p","t":"Art. 536. No cumprimento de sentença que reconheça a exigibilidade de obrigação de fazer ou de não fazer, o juiz poderá, de ofício ou a requerimento, para a efetivação da tutela específica ou a obtenção de tutela pelo resultado prático equivalente, determinar as medidas necessárias à satisfação do exequente."},{"k":"p","t":"§ 1º Para atender ao disposto no caput , o juiz poderá determinar, entre outras medidas, a imposição de multa, a busca e apreensão, a remoção de pessoas e coisas, o desfazimento de obras e o impedimento de atividade nociva, podendo, caso necessário, requisitar o auxílio de força policial."},{"k":"p","t":"§ 2º O mandado de busca e apreensão de pessoas e coisas será cumprido por 2 (dois) oficiais de justiça, observando-se o disposto no art. 846, §§ 1º a 4º , se houver necessidade de arrombamento."},{"k":"p","t":"§ 3º O executado incidirá nas penas de litigância de má-fé quando injustificadamente descumprir a ordem judicial, sem prejuízo de sua responsabilização por crime de desobediência."},{"k":"p","t":"§ 4º No cumprimento de sentença que reconheça a exigibilidade de obrigação de fazer ou de não fazer, aplica-se o art. 525 , no que couber."},{"k":"p","t":"§ 5º O disposto neste artigo aplica-se, no que couber, ao cumprimento de sentença que reconheça deveres de fazer e de não fazer de natureza não obrigacional."},{"k":"p","t":"Art. 537. A multa independe de requerimento da parte e poderá ser aplicada na fase de conhecimento, em tutela provisória ou na sentença, ou na fase de execução, desde que seja suficiente e compatível com a obrigação e que se determine prazo razoável para cumprimento do preceito."},{"k":"p","t":"§ 1º O juiz poderá, de ofício ou a requerimento, modificar o valor ou a periodicidade da multa vincenda ou excluí-la, caso verifique que:"},{"k":"p","t":"I - se tornou insuficiente ou excessiva;"},{"k":"p","t":"II - o obrigado demonstrou cumprimento parcial superveniente da obrigação ou justa causa para o descumprimento."},{"k":"p","t":"§ 2º O valor da multa será devido ao exequente."},{"k":"p","t":"§ 3º A decisão que fixa a multa é passível de cumprimento provisório, devendo ser depositada em juízo, permitido o levantamento do valor após o trânsito em julgado da sentença favorável à parte. (Redação dada pela Lei nº 13.256, de 2016) (Vigência)"},{"k":"p","t":"§ 4º A multa será devida desde o dia em que se configurar o descumprimento da decisão e incidirá enquanto não for cumprida a decisão que a tiver cominado."},{"k":"p","t":"§ 5º O disposto neste artigo aplica-se, no que couber, ao cumprimento de sentença que reconheça deveres de fazer e de não fazer de natureza não obrigacional."},{"k":"h","t":"SEÇÃO II — DO CUMPRIMENTO DE SENTENÇA QUE RECONHEÇA A EXIGIBILIDADE DE OBRIGAÇÃO DE ENTREGAR COISA"},{"k":"p","t":"Art. 538. Não cumprida a obrigação de entregar coisa no prazo estabelecido na sentença, será expedido mandado de busca e apreensão ou de imissão na posse em favor do credor, conforme se tratar de coisa móvel ou imóvel."},{"k":"p","t":"§ 1º A existência de benfeitorias deve ser alegada na fase de conhecimento, em contestação, de forma discriminada e com atribuição, sempre que possível e justificadamente, do respectivo valor."},{"k":"p","t":"§ 2º O direito de retenção por benfeitorias deve ser exercido na contestação, na fase de conhecimento."},{"k":"p","t":"§ 3º Aplicam-se ao procedimento previsto neste artigo, no que couber, as disposições sobre o cumprimento de obrigação de fazer ou de não fazer."}]},{"id":"s19","title":"TÍTULO II — DOS RECURSOS · arts. 994 a 1.014","tag":"","b":[{"k":"h","t":"TÍTULO II — DOS RECURSOS"},{"k":"h","t":"CAPÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 994. São cabíveis os seguintes recursos:"},{"k":"p","t":"I - apelação;"},{"k":"p","t":"II - agravo de instrumento;"},{"k":"p","t":"III - agravo interno;"},{"k":"p","t":"IV - embargos de declaração;"},{"k":"p","t":"V - recurso ordinário;"},{"k":"p","t":"VI - recurso especial;"},{"k":"p","t":"VII - recurso extraordinário;"},{"k":"p","t":"VIII - agravo em recurso especial ou extraordinário;"},{"k":"p","t":"IX - embargos de divergência."},{"k":"p","t":"Art. 995. Os recursos não impedem a eficácia da decisão, salvo disposição legal ou decisão judicial em sentido diverso."},{"k":"p","t":"Parágrafo único. A eficácia da decisão recorrida poderá ser suspensa por decisão do relator, se da imediata produção de seus efeitos houver risco de dano grave, de difícil ou impossível reparação, e ficar demonstrada a probabilidade de provimento do recurso."},{"k":"p","t":"Art. 996. O recurso pode ser interposto pela parte vencida, pelo terceiro prejudicado e pelo Ministério Público, como parte ou como fiscal da ordem jurídica."},{"k":"p","t":"Parágrafo único. Cumpre ao terceiro demonstrar a possibilidade de a decisão sobre a relação jurídica submetida à apreciação judicial atingir direito de que se afirme titular ou que possa discutir em juízo como substituto processual."},{"k":"p","t":"Art. 997. Cada parte interporá o recurso independentemente, no prazo e com observância das exigências legais."},{"k":"p","t":"§ 1º Sendo vencidos autor e réu, ao recurso interposto por qualquer deles poderá aderir o outro."},{"k":"p","t":"§ 2º O recurso adesivo fica subordinado ao recurso independente, sendo-lhe aplicáveis as mesmas regras deste quanto aos requisitos de admissibilidade e julgamento no tribunal, salvo disposição legal diversa, observado, ainda, o seguinte:"},{"k":"p","t":"I - será dirigido ao órgão perante o qual o recurso independente fora interposto, no prazo de que a parte dispõe para responder;"},{"k":"p","t":"II - será admissível na apelação, no recurso extraordinário e no recurso especial;"},{"k":"p","t":"III - não será conhecido, se houver desistência do recurso principal ou se for ele considerado inadmissível."},{"k":"p","t":"Art. 998. O recorrente poderá, a qualquer tempo, sem a anuência do recorrido ou dos litisconsortes, desistir do recurso."},{"k":"p","t":"Parágrafo único. A desistência do recurso não impede a análise de questão cuja repercussão geral já tenha sido reconhecida e daquela objeto de julgamento de recursos extraordinários ou especiais repetitivos."},{"k":"p","t":"Art. 999. A renúncia ao direito de recorrer independe da aceitação da outra parte."},{"k":"p","t":"Art. 1.000. A parte que aceitar expressa ou tacitamente a decisão não poderá recorrer."},{"k":"p","t":"Parágrafo único. Considera-se aceitação tácita a prática, sem nenhuma reserva, de ato incompatível com a vontade de recorrer."},{"k":"p","t":"Art. 1.001. Dos despachos não cabe recurso."},{"k":"p","t":"Art. 1.002. A decisão pode ser impugnada no todo ou em parte."},{"k":"p","t":"Art. 1.003. O prazo para interposição de recurso contase da data em que os advogados, a sociedade de advogados, a Advocacia Pública, a Defensoria Pública ou o Ministério Público são intimados da decisão."},{"k":"p","t":"§ 1º Os sujeitos previstos no caput considerar-se-ão intimados em audiência quando nesta for proferida a decisão."},{"k":"p","t":"§ 2º Aplica-se o disposto no art. 231 , incisos I a VI, ao prazo de interposição de recurso pelo réu contra decisão proferida anteriormente à citação."},{"k":"p","t":"§ 3º No prazo para interposição de recurso, a petição será protocolada em cartório ou conforme as normas de organização judiciária, ressalvado o disposto em regra especial."},{"k":"p","t":"§ 4º Para aferição da tempestividade do recurso remetido pelo correio, será considerada como data de interposição a data de postagem."},{"k":"p","t":"§ 5º Excetuados os embargos de declaração, o prazo para interpor os recursos e para responder-lhes é de 15 (quinze) dias."},{"k":"p","t":"§ 6º O recorrente comprovará a ocorrência de feriado local no ato de interposição do recurso."},{"k":"p","t":"Art. 1.004. Se, durante o prazo para a interposição do recurso, sobrevier o falecimento da parte ou de seu advogado ou ocorrer motivo de força maior que suspenda o curso do processo, será tal prazo restituído em proveito da parte, do herdeiro ou do sucessor, contra quem começará a correr novamente depois da intimação."},{"k":"p","t":"Art. 1.005. O recurso interposto por um dos litisconsortes a todos aproveita, salvo se distintos ou opostos os seus interesses."},{"k":"p","t":"Parágrafo único. Havendo solidariedade passiva, o recurso interposto por um devedor aproveitará aos outros quando as defesas opostas ao credor lhes forem comuns."},{"k":"p","t":"Art. 1.006. Certificado o trânsito em julgado, com menção expressa da data de sua ocorrência, o escrivão ou o chefe de secretaria, independentemente de despacho, providenciará a baixa dos autos ao juízo de origem, no prazo de 5 (cinco) dias."},{"k":"p","t":"Art. 1.007. No ato de interposição do recurso, o recorrente comprovará, quando exigido pela legislação pertinente, o respectivo preparo, inclusive porte de remessa e de retorno, sob pena de deserção."},{"k":"p","t":"§ 1º São dispensados de preparo, inclusive porte de remessa e de retorno, os recursos interpostos pelo Ministério Público, pela União, pelo Distrito Federal, pelos Estados, pelos Municípios, e respectivas autarquias, e pelos que gozam de isenção legal."},{"k":"p","t":"§ 2º A insuficiência no valor do preparo, inclusive porte de remessa e de retorno, implicará deserção se o recorrente, intimado na pessoa de seu advogado, não vier a supri-lo no prazo de 5 (cinco) dias."},{"k":"p","t":"§ 3º É dispensado o recolhimento do porte de remessa e de retorno no processo em autos eletrônicos."},{"k":"p","t":"§ 4º O recorrente que não comprovar, no ato de interposição do recurso, o recolhimento do preparo, inclusive porte de remessa e de retorno, será intimado, na pessoa de seu advogado, para realizar o recolhimento em dobro, sob pena de deserção."},{"k":"p","t":"§ 5º É vedada a complementação se houver insuficiência parcial do preparo, inclusive porte de remessa e de retorno, no recolhimento realizado na forma do § 4º."},{"k":"p","t":"§ 6º Provando o recorrente justo impedimento, o relator relevará a pena de deserção, por decisão irrecorrível, fixando-lhe prazo de 5 (cinco) dias para efetuar o preparo."},{"k":"p","t":"§ 7º O equívoco no preenchimento da guia de custas não implicará a aplicação da pena de deserção, cabendo ao relator, na hipótese de dúvida quanto ao recolhimento, intimar o recorrente para sanar o vício no prazo de 5 (cinco) dias."},{"k":"p","t":"Art. 1.008. O julgamento proferido pelo tribunal substituirá a decisão impugnada no que tiver sido objeto de recurso."},{"k":"h","t":"CAPÍTULO II — DA APELAÇÃO"},{"k":"p","t":"Art. 1.009. Da sentença cabe apelação."},{"k":"p","t":"§ 1º As questões resolvidas na fase de conhecimento, se a decisão a seu respeito não comportar agravo de instrumento, não são cobertas pela preclusão e devem ser suscitadas em preliminar de apelação, eventualmente interposta contra a decisão final, ou nas contrarrazões."},{"k":"p","t":"§ 2º Se as questões referidas no § 1º forem suscitadas em contrarrazões, o recorrente será intimado para, em 15 (quinze) dias, manifestar-se a respeito delas."},{"k":"p","t":"§ 3º O disposto no caput deste artigo aplica-se mesmo quando as questões mencionadas no art. 1.015 integrarem capítulo da sentença."},{"k":"p","t":"Art. 1.010. A apelação, interposta por petição dirigida ao juízo de primeiro grau, conterá:"},{"k":"p","t":"I - os nomes e a qualificação das partes;"},{"k":"p","t":"II - a exposição do fato e do direito;"},{"k":"p","t":"III - as razões do pedido de reforma ou de decretação de nulidade;"},{"k":"p","t":"IV - o pedido de nova decisão."},{"k":"p","t":"§ 1º O apelado será intimado para apresentar contrarrazões no prazo de 15 (quinze) dias."},{"k":"p","t":"§ 2º Se o apelado interpuser apelação adesiva, o juiz intimará o apelante para apresentar contrarrazões."},{"k":"p","t":"§ 3º Após as formalidades previstas nos §§ 1º e 2º, os autos serão remetidos ao tribunal pelo juiz, independentemente de juízo de admissibilidade."},{"k":"p","t":"Art. 1.011. Recebido o recurso de apelação no tribunal e distribuído imediatamente, o relator:"},{"k":"p","t":"I - decidi-lo-á monocraticamente apenas nas hipóteses do art. 932, incisos III a V ;"},{"k":"p","t":"II - se não for o caso de decisão monocrática, elaborará seu voto para julgamento do recurso pelo órgão colegiado."},{"k":"p","t":"Art. 1.012. A apelação terá efeito suspensivo."},{"k":"p","t":"§ 1º Além de outras hipóteses previstas em lei, começa a produzir efeitos imediatamente após a sua publicação a sentença que:"},{"k":"p","t":"I - homologa divisão ou demarcação de terras;"},{"k":"p","t":"II - condena a pagar alimentos;"},{"k":"p","t":"III - extingue sem resolução do mérito ou julga improcedentes os embargos do executado;"},{"k":"p","t":"IV - julga procedente o pedido de instituição de arbitragem;"},{"k":"p","t":"V - confirma, concede ou revoga tutela provisória;"},{"k":"p","t":"VI - decreta a interdição."},{"k":"p","t":"§ 2º Nos casos do § 1º, o apelado poderá promover o pedido de cumprimento provisório depois de publicada a sentença."},{"k":"p","t":"§ 3º O pedido de concessão de efeito suspensivo nas hipóteses do § 1º poderá ser formulado por requerimento dirigido ao:"},{"k":"p","t":"I - tribunal, no período compreendido entre a interposição da apelação e sua distribuição, ficando o relator designado para seu exame prevento para julgála;"},{"k":"p","t":"II - relator, se já distribuída a apelação."},{"k":"p","t":"§ 4º Nas hipóteses do § 1º, a eficácia da sentença poderá ser suspensa pelo relator se o apelante demonstrar a probabilidade de provimento do recurso ou se, sendo relevante a fundamentação, houver risco de dano grave ou de difícil reparação."},{"k":"p","t":"Art. 1.013. A apelação devolverá ao tribunal o conhecimento da matéria impugnada."},{"k":"p","t":"§ 1º Serão, porém, objeto de apreciação e julgamento pelo tribunal todas as questões suscitadas e discutidas no processo, ainda que não tenham sido solucionadas, desde que relativas ao capítulo impugnado."},{"k":"p","t":"§ 2º Quando o pedido ou a defesa tiver mais de um fundamento e o juiz acolher apenas um deles, a apelação devolverá ao tribunal o conhecimento dos demais."},{"k":"p","t":"§ 3º Se o processo estiver em condições de imediato julgamento, o tribunal deve decidir desde logo o mérito quando:"},{"k":"p","t":"I - reformar sentença fundada no art. 485 ;"},{"k":"p","t":"II - decretar a nulidade da sentença por não ser ela congruente com os limites do pedido ou da causa de pedir;"},{"k":"p","t":"III - constatar a omissão no exame de um dos pedidos, hipótese em que poderá julgá-lo;"},{"k":"p","t":"IV - decretar a nulidade de sentença por falta de fundamentação."},{"k":"p","t":"§ 4º Quando reformar sentença que reconheça a decadência ou a prescrição, o tribunal, se possível, julgará o mérito, examinando as demais questões, sem determinar o retorno do processo ao juízo de primeiro grau."},{"k":"p","t":"§ 5º O capítulo da sentença que confirma, concede ou revoga a tutela provisória é impugnável na apelação."},{"k":"p","t":"Art. 1.014. As questões de fato não propostas no juízo inferior poderão ser suscitadas na apelação, se a parte provar que deixou de fazê-lo por motivo de força maior."}]},{"id":"s20","title":"CAPÍTULO III — DO AGRAVO DE INSTRUMENTO · arts. 1.015 a 1.026","tag":"","b":[{"k":"h","t":"CAPÍTULO III — DO AGRAVO DE INSTRUMENTO"},{"k":"p","t":"Art. 1.015. Cabe agravo de instrumento contra as decisões interlocutórias que versarem sobre:"},{"k":"p","t":"I - tutelas provisórias;"},{"k":"p","t":"II - mérito do processo;"},{"k":"p","t":"III - rejeição da alegação de convenção de arbitragem;"},{"k":"p","t":"IV - incidente de desconsideração da personalidade jurídica;"},{"k":"p","t":"V - rejeição do pedido de gratuidade da justiça ou acolhimento do pedido de sua revogação;"},{"k":"p","t":"VI - exibição ou posse de documento ou coisa;"},{"k":"p","t":"VII - exclusão de litisconsorte;"},{"k":"p","t":"VIII - rejeição do pedido de limitação do litisconsórcio;"},{"k":"p","t":"IX - admissão ou inadmissão de intervenção de terceiros;"},{"k":"p","t":"X - concessão, modificação ou revogação do efeito suspensivo aos embargos à execução;"},{"k":"p","t":"XI - redistribuição do ônus da prova nos termos do art. 373, § 1º ;"},{"k":"p","t":"XII - (VETADO);"},{"k":"p","t":"XIII - outros casos expressamente referidos em lei."},{"k":"p","t":"Parágrafo único. Também caberá agravo de instrumento contra decisões interlocutórias proferidas na fase de liquidação de sentença ou de cumprimento de sentença, no processo de execução e no processo de inventário."},{"k":"p","t":"Art. 1.016. O agravo de instrumento será dirigido diretamente ao tribunal competente, por meio de petição com os seguintes requisitos:"},{"k":"p","t":"I - os nomes das partes;"},{"k":"p","t":"II - a exposição do fato e do direito;"},{"k":"p","t":"III - as razões do pedido de reforma ou de invalidação da decisão e o próprio pedido;"},{"k":"p","t":"IV - o nome e o endereço completo dos advogados constantes do processo."},{"k":"p","t":"Art. 1.017. A petição de agravo de instrumento será instruída:"},{"k":"p","t":"I - obrigatoriamente, com cópias da petição inicial, da contestação, da petição que ensejou a decisão agravada, da própria decisão agravada, da certidão da respectiva intimação ou outro documento oficial que comprove a tempestividade e das procurações outorgadas aos advogados do agravante e do agravado;"},{"k":"p","t":"II - com declaração de inexistência de qualquer dos documentos referidos no inciso I, feita pelo advogado do agravante, sob pena de sua responsabilidade pessoal;"},{"k":"p","t":"III - facultativamente, com outras peças que o agravante reputar úteis."},{"k":"p","t":"§ 1º Acompanhará a petição o comprovante do pagamento das respectivas custas e do porte de retorno, quando devidos, conforme tabela publicada pelos tribunais."},{"k":"p","t":"§ 2º No prazo do recurso, o agravo será interposto por:"},{"k":"p","t":"I - protocolo realizado diretamente no tribunal competente para julgá-lo;"},{"k":"p","t":"II - protocolo realizado na própria comarca, seção ou subseção judiciárias;"},{"k":"p","t":"III - postagem, sob registro, com aviso de recebimento;"},{"k":"p","t":"IV - transmissão de dados tipo fac-símile, nos termos da lei;"},{"k":"p","t":"V - outra forma prevista em lei."},{"k":"p","t":"§ 3º Na falta da cópia de qualquer peça ou no caso de algum outro vício que comprometa a admissibilidade do agravo de instrumento, deve o relator aplicar o disposto no art. 932, parágrafo único ."},{"k":"p","t":"§ 4º Se o recurso for interposto por sistema de transmissão de dados tipo fac-símile ou similar, as peças devem ser juntadas no momento de protocolo da petição original."},{"k":"p","t":"§ 5º Sendo eletrônicos os autos do processo, dispensam-se as peças referidas nos incisos I e II do caput , facultando-se ao agravante anexar outros documentos que entender úteis para a compreensão da controvérsia."},{"k":"p","t":"Art. 1.018. O agravante poderá requerer a juntada, aos autos do processo, de cópia da petição do agravo de instrumento, do comprovante de sua interposição e da relação dos documentos que instruíram o recurso."},{"k":"p","t":"§ 1º Se o juiz comunicar que reformou inteiramente a decisão, o relator considerará prejudicado o agravo de instrumento."},{"k":"p","t":"§ 2º Não sendo eletrônicos os autos, o agravante tomará a providência prevista no caput , no prazo de 3 (três) dias a contar da interposição do agravo de instrumento."},{"k":"p","t":"§ 3º O descumprimento da exigência de que trata o § 2º, desde que arguido e provado pelo agravado, importa inadmissibilidade do agravo de instrumento."},{"k":"p","t":"Art. 1.019. Recebido o agravo de instrumento no tribunal e distribuído imediatamente, se não for o caso de aplicação do art. 932, incisos III e IV , o relator, no prazo de 5 (cinco) dias:"},{"k":"p","t":"I - poderá atribuir efeito suspensivo ao recurso ou deferir, em antecipação de tutela, total ou parcialmente, a pretensão recursal, comunicando ao juiz sua decisão;"},{"k":"p","t":"II - ordenará a intimação do agravado pessoalmente, por carta com aviso de recebimento, quando não tiver procurador constituído, ou pelo Diário da Justiça ou por carta com aviso de recebimento dirigida ao seu advogado, para que responda no prazo de 15 (quinze) dias, facultando-lhe juntar a documentação que entender necessária ao julgamento do recurso;"},{"k":"p","t":"III - determinará a intimação do Ministério Público, preferencialmente por meio eletrônico, quando for o caso de sua intervenção, para que se manifeste no prazo de 15 (quinze) dias."},{"k":"p","t":"Art. 1.020. O relator solicitará dia para julgamento em prazo não superior a 1 (um) mês da intimação do agravado."},{"k":"h","t":"CAPÍTULO IV — DO AGRAVO INTERNO"},{"k":"p","t":"Art. 1.021. Contra decisão proferida pelo relator caberá agravo interno para o respectivo órgão colegiado, observadas, quanto ao processamento, as regras do regimento interno do tribunal."},{"k":"p","t":"§ 1º Na petição de agravo interno, o recorrente impugnará especificadamente os fundamentos da decisão agravada."},{"k":"p","t":"§ 2º O agravo será dirigido ao relator, que intimará o agravado para manifestar-se sobre o recurso no prazo de 15 (quinze) dias, ao final do qual, não havendo retratação, o relator levá-lo-á a julgamento pelo órgão colegiado, com inclusão em pauta."},{"k":"p","t":"§ 3º É vedado ao relator limitar-se à reprodução dos fundamentos da decisão agravada para julgar improcedente o agravo interno."},{"k":"p","t":"§ 4º Quando o agravo interno for declarado manifestamente inadmissível ou improcedente em votação unânime, o órgão colegiado, em decisão fundamentada, condenará o agravante a pagar ao agravado multa fixada entre um e cinco por cento do valor atualizado da causa."},{"k":"p","t":"§ 5º A interposição de qualquer outro recurso está condicionada ao depósito prévio do valor da multa prevista no § 4º, à exceção da Fazenda Pública e do beneficiário de gratuidade da justiça, que farão o pagamento ao final."},{"k":"h","t":"CAPÍTULO V — DOS EMBARGOS DE DECLARAÇÃO"},{"k":"p","t":"Art. 1.022. Cabem embargos de declaração contra qualquer decisão judicial para:"},{"k":"p","t":"I - esclarecer obscuridade ou eliminar contradição;"},{"k":"p","t":"II - suprir omissão de ponto ou questão sobre o qual devia se pronunciar o juiz de ofício ou a requerimento;"},{"k":"p","t":"III - corrigir erro material."},{"k":"p","t":"Parágrafo único. Considera-se omissa a decisão que:"},{"k":"p","t":"I - deixe de se manifestar sobre tese firmada em julgamento de casos repetitivos ou em incidente de assunção de competência aplicável ao caso sob julgamento;"},{"k":"p","t":"II - incorra em qualquer das condutas descritas no art. 489, § 1º ."},{"k":"p","t":"Art. 1.023. Os embargos serão opostos, no prazo de 5 (cinco) dias, em petição dirigida ao juiz, com indicação do erro, obscuridade, contradição ou omissão, e não se sujeitam a preparo."},{"k":"p","t":"§ 1º Aplica-se aos embargos de declaração o art. 229 ."},{"k":"p","t":"§ 2º O juiz intimará o embargado para, querendo, manifestar-se, no prazo de 5 (cinco) dias, sobre os embargos opostos, caso seu eventual acolhimento implique a modificação da decisão embargada."},{"k":"p","t":"Art. 1.024. O juiz julgará os embargos em 5 (cinco) dias."},{"k":"p","t":"§ 1º Nos tribunais, o relator apresentará os embargos em mesa na sessão subsequente, proferindo voto, e, não havendo julgamento nessa sessão, será o recurso incluído em pauta automaticamente."},{"k":"p","t":"§ 2º Quando os embargos de declaração forem opostos contra decisão de relator ou outra decisão unipessoal proferida em tribunal, o órgão prolator da decisão embargada decidi-los-á monocraticamente."},{"k":"p","t":"§ 3º O órgão julgador conhecerá dos embargos de declaração como agravo interno se entender ser este o recurso cabível, desde que determine previamente a intimação do recorrente para, no prazo de 5 (cinco) dias, complementar as razões recursais, de modo a ajustá-las às exigências do art. 1.021, § 1º ."},{"k":"p","t":"§ 4º Caso o acolhimento dos embargos de declaração implique modificação da decisão embargada, o embargado que já tiver interposto outro recurso contra a decisão originária tem o direito de complementar ou alterar suas razões, nos exatos limites da modificação, no prazo de 15 (quinze) dias, contado da intimação da decisão dos embargos de declaração."},{"k":"p","t":"§ 5º Se os embargos de declaração forem rejeitados ou não alterarem a conclusão do julgamento anterior, o recurso interposto pela outra parte antes da publicação do julgamento dos embargos de declaração será processado e julgado independentemente de ratificação."},{"k":"p","t":"Art. 1.025. Consideram-se incluídos no acórdão os elementos que o embargante suscitou, para fins de pré-questionamento, ainda que os embargos de declaração sejam inadmitidos ou rejeitados, caso o tribunal superior considere existentes erro, omissão, contradição ou obscuridade."},{"k":"p","t":"Art. 1.026. Os embargos de declaração não possuem efeito suspensivo e interrompem o prazo para a interposição de recurso."},{"k":"p","t":"§ 1º A eficácia da decisão monocrática ou colegiada poderá ser suspensa pelo respectivo juiz ou relator se demonstrada a probabilidade de provimento do recurso ou, sendo relevante a fundamentação, se houver risco de dano grave ou de difícil reparação."},{"k":"p","t":"§ 2º Quando manifestamente protelatórios os embargos de declaração, o juiz ou o tribunal, em decisão fundamentada, condenará o embargante a pagar ao embargado multa não excedente a dois por cento sobre o valor atualizado da causa."},{"k":"p","t":"§ 3º Na reiteração de embargos de declaração manifestamente protelatórios, a multa será elevada a até dez por cento sobre o valor atualizado da causa, e a interposição de qualquer recurso ficará condicionada ao depósito prévio do valor da multa, à exceção da Fazenda Pública e do beneficiário de gratuidade da justiça, que a recolherão ao final."},{"k":"p","t":"§ 4º Não serão admitidos novos embargos de declaração se os 2 (dois) anteriores houverem sido considerados protelatórios."}]}],"jcv":[{"id":"s0","title":"Disposições iniciais · arts. 3 a 19","tag":"","b":[{"k":"p","t":"Lei nº 9.099/1995 Dispõe sobre os Juizados Especiais Cíveis e Criminais e dá outras providências."},{"k":"h","t":"CAPÍTULO II — DOS JUIZADOS ESPECIAIS CÍVEIS"},{"k":"h","t":"SEÇÃO I — DA COMPETÊNCIA"},{"k":"p","t":"Art. 3º O Juizado Especial Cível tem competência para conciliação, processo e julgamento das causas cíveis de menor complexidade, assim consideradas:"},{"k":"p","t":"I - as causas cujo valor não exceda a quarenta vezes o salário mínimo;"},{"k":"p","t":"II - as enumeradas no art. 275, inciso II, do Código de Processo Civil;"},{"k":"p","t":"III - a ação de despejo para uso próprio;"},{"k":"p","t":"IV - as ações possessórias sobre bens imóveis de valor não excedente ao fixado no inciso I deste artigo."},{"k":"p","t":"§ 1º Compete ao Juizado Especial promover a execução:"},{"k":"p","t":"I - dos seus julgados;"},{"k":"p","t":"II - dos títulos executivos extrajudiciais, no valor de até quarenta vezes o salário mínimo, observado o disposto no § 1º do art. 8º desta Lei."},{"k":"p","t":"§ 2º Ficam excluídas da competência do Juizado Especial as causas de natureza alimentar, falimentar, fiscal e de interesse da Fazenda Pública, e também as relativas a acidentes de trabalho, a resíduos e ao estado e capacidade das pessoas, ainda que de cunho patrimonial."},{"k":"p","t":"§ 3º A opção pelo procedimento previsto nesta Lei importará em renúncia ao crédito excedente ao limite estabelecido neste artigo, excetuada a hipótese de conciliação."},{"k":"p","t":"Art. 4º É competente, para as causas previstas nesta Lei, o Juizado do foro:"},{"k":"p","t":"I - do domicílio do réu ou, a critério do autor, do local onde aquele exerça atividades profissionais ou econômicas ou mantenha estabelecimento, filial, agência, sucursal ou escritório;"},{"k":"p","t":"II - do lugar onde a obrigação deva ser satisfeita;"},{"k":"p","t":"III - do domicílio do autor ou do local do ato ou fato, nas ações para reparação de dano de qualquer natureza."},{"k":"p","t":"Parágrafo único. Em qualquer hipótese, poderá a ação ser proposta no foro previsto no inciso I deste artigo."},{"k":"h","t":"SEÇÃO II — DO JUIZ, DOS CONCILIADORES E DOS JUÍZES LEIGOS"},{"k":"p","t":"Art. 5º O Juiz dirigirá o processo com liberdade para determinar as provas a serem produzidas, para apreciálas e para dar especial valor às regras de experiência comum ou técnica."},{"k":"p","t":"Art. 6º O Juiz adotará em cada caso a decisão que reputar mais justa e equânime, atendendo aos fins sociais da lei e às exigências do bem comum."},{"k":"p","t":"Art. 7º Os conciliadores e Juízes leigos são auxiliares da Justiça, recrutados, os primeiros, preferentemente, entre os bacharéis em Direito, e os segundos, entre advogados com mais de cinco anos de experiência."},{"k":"p","t":"Parágrafo único. Os Juízes leigos ficarão impedidos de exercer a advocacia perante os Juizados Especiais, enquanto no desempenho de suas funções."},{"k":"h","t":"SEÇÃO III — DAS PARTES"},{"k":"p","t":"Art. 8º Não poderão ser partes, no processo instituído por esta Lei, o incapaz, o preso, as pessoas jurídicas de direito público, as empresas públicas da União, a massa falida e o insolvente civil."},{"k":"p","t":"§ 1o Somente serão admitidas a propor ação perante o Juizado Especial: (Redação dada pela Lei nº 12.126, de 2009)"},{"k":"p","t":"I - as pessoas físicas capazes, excluídos os cessionários de direito de pessoas jurídicas; (Incluído pela Lei nº 12.126, de 2009)"},{"k":"p","t":"II - as pessoas enquadradas como microempreendedores individuais, microempresas e empresas de pequeno porte na forma da Lei Complementar no 123, de 14 de dezembro de 2006; (Redaç
