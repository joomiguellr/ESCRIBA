fim de obter proveito ou benefício indevido para si ou para outra pessoa ou entidade. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º Aplica-se o disposto no § 1º deste artigo a quaisquer atos de improbidade administrativa tipificados nesta Lei e em leis especiais e a quaisquer outros tipos especiais de improbidade administrativa instituídos por lei. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º O enquadramento de conduta funcional na categoria de que trata este artigo pressupõe a demonstração objetiva da prática de ilegalidade no exercício da função pública, com a indicação das normas constitucionais, legais ou infralegais violadas. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º Os atos de improbidade de que trata este artigo exigem lesividade relevante ao bem jurídico tutelado para serem passíveis de sancionamento e independem do reconhecimento da produção de danos ao erário e de enriquecimento ilícito dos agentes públicos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º Não se configurará improbidade a mera nomeação ou indicação política por parte dos detentores de mandatos eletivos, sendo necessária a aferição de dolo com finalidade ilícita por parte do agente. (Incluído pela Lei nº 14.230, de 2021)"}]},{"id":"s1","title":"CAPÍTULO III — DAS PENAS · arts. 12 a 18-A","tag":"","b":[{"k":"h","t":"CAPÍTULO III — DAS PENAS"},{"k":"p","t":"Art. 12. Independentemente do ressarcimento integral do dano patrimonial, se efetivo, e das sanções penais comuns e de responsabilidade, civis e administrativas previstas na legislação específica, está o responsável pelo ato de improbidade sujeito às seguintes cominações, que podem ser aplicadas isolada ou cumulativamente, de acordo com a gravidade do fato: (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - na hipótese do art. 9º desta Lei, perda dos bens ou valores acrescidos ilicitamente ao patrimônio, perda da função pública, suspensão dos direitos políticos até 14 (catorze) anos, pagamento de multa civil equivalente ao valor do acréscimo patrimonial e proibição de contratar com o poder público ou de receber benefícios ou incentivos fiscais ou creditícios, direta ou indiretamente, ainda que por intermédio de pessoa jurídica da qual seja sócio majoritário, pelo prazo não superior a 14 (catorze) anos; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - na hipótese do art. 10 desta Lei, perda dos bens ou valores acrescidos ilicitamente ao patrimônio, se concorrer esta circunstância, perda da função pública, suspensão dos direitos políticos até 12 (doze) anos, pagamento de multa civil equivalente ao valor do dano e proibição de contratar com o poder público ou de receber benefícios ou incentivos fiscais ou creditícios, direta ou indiretamente, ainda que por intermédio de pessoa jurídica da qual seja sócio majoritário, pelo prazo não superior a 12 (doze) anos; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"III - na hipótese do art. 11 desta Lei, pagamento de multa civil de até 24 (vinte e quatro) vezes o valor da remuneração percebida pelo agente e proibição de contratar com o poder público ou de receber benefícios ou incentivos fiscais ou creditícios, direta ou indiretamente, ainda que por intermédio de pessoa jurídica da qual seja sócio majoritário, pelo prazo não superior a 4 (quatro) anos; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"IV - (revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º A sanção de perda da função pública, nas hipóteses dos incisos I e II do caput deste artigo, atinge apenas o vínculo de mesma qualidade e natureza que o agente público ou político detinha com o poder público na época do cometimento da infração, podendo o magistrado, na hipótese do inciso I do caput deste artigo, e em caráter excepcional, estendê-la aos demais vínculos, consideradas as circunstâncias do caso e a gravidade da infração. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º A multa pode ser aumentada até o dobro, se o juiz considerar que, em virtude da situação econômica do réu, o valor calculado na forma dos incisos I, II e III do caput deste artigo é ineficaz para reprovação e prevenção do ato de improbidade. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º Na responsabilização da pessoa jurídica, deverão ser considerados os efeitos econômicos e sociais das sanções, de modo a viabilizar a manutenção de suas atividades. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º Em caráter excepcional e por motivos relevantes devidamente justificados, a sanção de proibição de contratação com o poder público pode extrapolar o ente público lesado pelo ato de improbidade, observados os impactos econômicos e sociais das sanções, de forma a preservar a função social da pessoa jurídica, conforme disposto no § 3º deste artigo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º No caso de atos de menor ofensa aos bens jurídicos tutelados por esta Lei, a sanção limitar-se-á à aplicação de multa, sem prejuízo do ressarcimento do dano e da perda dos valores obtidos, quando for o caso, nos termos do caput deste artigo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º Se ocorrer lesão ao patrimônio público, a reparação do dano a que se refere esta Lei deverá deduzir o ressarcimento ocorrido nas instâncias criminal, civil e administrativa que tiver por objeto os mesmos fatos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 7º As sanções aplicadas a pessoas jurídicas com base nesta Lei e na Lei nº 12.846, de 1º de agosto de 2013, deverão observar o princípio constitucional do non bis in idem. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 8º A sanção de proibição de contratação com o poder público deverá constar do Cadastro Nacional de Empresas Inidôneas e Suspensas (CEIS) de que trata a Lei nº 12.846, de 1º de agosto de 2013, observadas as limitações territoriais contidas em decisão judicial, conforme disposto no § 4º deste artigo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 9º As sanções previstas neste artigo somente poderão ser executadas após o trânsito em julgado da sentença condenatória. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10. Para efeitos de contagem do prazo da sanção de suspensão dos direitos políticos, computar-se-á retroativamente o intervalo de tempo entre a decisão colegiada e o trânsito em julgado da sentença condenatória. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"h","t":"CAPÍTULO IV — DA DECLARAÇÃO DE BENS"},{"k":"p","t":"Art. 13. A posse e o exercício de agente público ficam condicionados à apresentação de declaração de imposto de renda e proventos de qualquer natureza, que tenha sido apresentada à Secretaria Especial da Receita Federal do Brasil, a fim de ser arquivada no serviço de pessoal competente. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º A declaração de bens a que se refere o caput deste artigo será atualizada anualmente e na data em que o agente público deixar o exercício do mandato, do cargo, do emprego ou da função. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º Será apenado com a pena de demissão, sem prejuízo de outras sanções cabíveis, o agente público que se recusar a prestar a declaração dos bens a que se refere o caput deste artigo dentro do prazo determinado ou que prestar declaração falsa. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"h","t":"CAPÍTULO V — DO PROCEDIMENTO ADMINISTRATIVO E DO PROCESSO JUDICIAL"},{"k":"p","t":"Art. 14. Qualquer pessoa poderá representar à autoridade administrativa competente para que seja instaurada investigação destinada a apurar a prática de ato de improbidade."},{"k":"p","t":"§ 1º A representação, que será escrita ou reduzida a termo e assinada, conterá a qualificação do representante, as informações sobre o fato e sua autoria e a indicação das provas de que tenha conhecimento."},{"k":"p","t":"§ 2º A autoridade administrativa rejeitará a representação, em despacho fundamentado, se esta não contiver as formalidades estabelecidas no § 1º deste artigo. A rejeição não impede a representação ao Ministério Público, nos termos do art. 22 desta lei."},{"k":"p","t":"§ 3º Atendidos os requisitos da representação, a autoridade determinará a imediata apuração dos fatos, observada a legislação que regula o processo administrativo disciplinar aplicável ao agente. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 15. A comissão processante dará conhecimento ao Ministério Público e ao Tribunal ou Conselho de Contas da existência de procedimento administrativo para apurar a prática de ato de improbidade."},{"k":"p","t":"Parágrafo único. O Ministério Público ou Tribunal ou Conselho de Contas poderá, a requerimento, designar representante para acompanhar o procedimento administrativo."},{"k":"p","t":"Art. 16. Na ação por improbidade administrativa poderá ser formulado, em caráter antecedente ou incidente, pedido de indisponibilidade de bens dos réus, a fim de garantir a integral recomposição do erário ou do acréscimo patrimonial resultante de enriquecimento ilícito. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º-A O pedido de indisponibilidade de bens a que se refere o caput deste artigo poderá ser formulado independentemente da representação de que trata o art. 7º desta Lei. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º Quando for o caso, o pedido de indisponibilidade de bens a que se refere o caput deste artigo incluirá a investigação, o exame e o bloqueio de bens, contas bancárias e aplicações financeiras mantidas pelo indiciado no exterior, nos termos da lei e dos tratados internacionais. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º O pedido de indisponibilidade de bens a que se refere o caput deste artigo apenas será deferido mediante a demonstração no caso concreto de perigo de dano irreparável ou de risco ao resultado útil do processo, desde que o juiz se convença da probabilidade da ocorrência dos atos descritos na petição inicial com fundamento nos respectivos elementos de instrução, após a oitiva do réu em 5 (cinco) dias. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º A indisponibilidade de bens poderá ser decretada sem a oitiva prévia do réu, sempre que o contraditório prévio puder comprovadamente frustrar a efetividade da medida ou houver outras circunstâncias que recomendem a proteção liminar, não podendo a urgência ser presumida. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º Se houver mais de um réu na ação, a somatória dos valores declarados indisponíveis não poderá superar o montante indicado na petição inicial como dano ao erário ou como enriquecimento ilícito. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º O valor da indisponibilidade considerará a estimativa de dano indicada na petição inicial, permitida a sua substituição por caução idônea, por fiança bancária ou por seguro-garantia judicial, a requerimento do réu, bem como a sua readequação durante a instrução do processo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 7º A indisponibilidade de bens de terceiro dependerá da demonstração da sua efetiva concorrência para os atos ilícitos apurados ou, quando se tratar de pessoa jurídica, da instauração de incidente de desconsideração da personalidade jurídica, a ser processado na forma da lei processual. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 8º Aplica-se à indisponibilidade de bens regida por esta Lei, no que for cabível, o regime da tutela provisória de urgência da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil). (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 9º Da decisão que deferir ou indeferir a medida relativa à indisponibilidade de bens caberá agravo de instrumento, nos termos da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil). (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10. A indisponibilidade recairá sobre bens que assegurem exclusivamente o integral ressarcimento do dano ao erário, sem incidir sobre os valores a serem eventualmente aplicados a título de multa civil ou sobre acréscimo patrimonial decorrente de atividade lícita. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 11. A ordem de indisponibilidade de bens deverá priorizar veículos de via terrestre, bens imóveis, bens móveis em geral, semoventes, navios e aeronaves, ações e quotas de sociedades simples e empresárias, pedras e metais preciosos e, apenas na inexistência desses, o bloqueio de contas bancárias, de forma a garantir a subsistência do acusado e a manutenção da atividade empresária ao longo do processo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 12. O juiz, ao apreciar o pedido de indisponibilidade de bens do réu a que se refere o caput deste artigo, observará os efeitos práticos da decisão, vedada a adoção de medida capaz de acarretar prejuízo à prestação de serviços públicos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 13. É vedada a decretação de indisponibilidade da quantia de até 40 (quarenta) salários mínimos depositados em caderneta de poupança, em outras aplicações financeiras ou em contacorrente. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 14. É vedada a decretação de indisponibilidade do bem de família do réu, salvo se comprovado que o imóvel seja fruto de vantagem patrimonial indevida, conforme descrito no art. 9º desta Lei. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 17. A ação para a aplicação das sanções de que trata esta Lei será proposta pelo Ministério Público e seguirá o procedimento comum previsto na Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil), salvo o disposto nesta Lei. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º-A A ação a que se refere o caput deste artigo deverá ser proposta perante o foro do local onde ocorrer o dano ou da pessoa jurídica prejudicada. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º A propositura da ação a que se refere o caput deste artigo prevenirá a competência do juízo para todas as ações posteriormente intentadas que possuam a mesma causa de pedir ou o mesmo objeto. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º A petição inicial observará o seguinte: (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - deverá individualizar a conduta do réu e apontar os elementos probatórios mínimos que demonstrem a ocorrência das hipóteses dos arts. 9º, 10 e 11 desta Lei e de sua autoria, salvo impossibilidade devidamente fundamentada; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - será instruída com documentos ou justificação que contenham indícios suficientes da veracidade dos fatos e do dolo imputado ou com razões fundamentadas da impossibilidade de apresentação de qualquer dessas provas, observada a legislação vigente, inclusive as disposições constantes dos arts. 77 e 80 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil). (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º-A O Ministério Público poderá requerer as tutelas provisórias adequadas e necessárias, nos termos dos arts. 294 a 310 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º-B A petição inicial será rejeitada nos casos do art. 330 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil), bem como quando não preenchidos os requisitos a que se referem os incisos I e II do § 6º deste artigo, ou ainda quando manifestamente inexistente o ato de improbidade imputado. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 7º Se a petição inicial estiver em devida forma, o juiz mandará autuá-la e ordenará a citação dos requeridos para que a contestem no prazo comum de 30 (trinta) dias, iniciado o prazo na forma do art. 231 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 8º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 9º (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 9º-A Da decisão que rejeitar questões preliminares suscitadas pelo réu em sua contestação caberá agravo de instrumento. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10. (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10-A. Havendo a possibilidade de solução consensual, poderão as partes requerer ao juiz a interrupção do prazo para a contestação, por prazo não superior a 90 (noventa) dias. (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"§ 10-B. Oferecida a contestação e, se for o caso, ouvido o autor, o juiz: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - procederá ao julgamento conforme o estado do processo, observada a eventual inexistência manifesta do ato de improbidade; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - poderá desmembrar o litisconsórcio, com vistas a otimizar a instrução processual. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10-C. Após a réplica do Ministério Público, o juiz proferirá decisão na qual indicará com precisão a tipificação do ato de improbidade administrativa imputável ao réu, sendo-lhe vedado modificar o fato principal e a capitulação legal apresentada pelo autor. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10-D. Para cada ato de improbidade administrativa, deverá necessariamente ser indicado apenas um tipo dentre aqueles previstos nos arts. 9º, 10 e 11 desta Lei. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10-E. Proferida a decisão referida no § 10-C deste artigo, as partes serão intimadas a especificar as provas que pretendem produzir. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 10-F. Será nula a decisão de mérito total ou parcial da ação de improbidade administrativa que: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - condenar o requerido por tipo diverso daquele definido na petição inicial; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - condenar o requerido sem a produção das provas por ele tempestivamente especificadas. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 11. Em qualquer momento do processo, verificada a inexistência do ato de improbidade, o juiz julgará a demanda improcedente. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 12. (Revogado)."},{"k":"p","t":"§ 13. (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 14. Sem prejuízo da citação dos réus, a pessoa jurídica interessada será intimada para, caso queira, intervir no processo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 15. Se a imputação envolver a desconsideração de pessoa jurídica, serão observadas as regras previstas nos arts. 133, 134, 135, 136 e 137 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil). (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 16. A qualquer momento, se o magistrado identificar a existência de ilegalidades ou de irregularidades administrativas a serem sanadas sem que estejam presentes todos os requisitos para a imposição das sanções aos agentes incluídos no polo passivo da demanda, poderá, em decisão motivada, converter a ação de improbidade administrativa em ação civil pública, regulada pela Lei nº 7.347, de 24 de julho de 1985. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 17. Da decisão que converter a ação de improbidade em ação civil pública caberá agravo de instrumento. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 18. Ao réu será assegurado o direito de ser interrogado sobre os fatos de que trata a ação, e a sua recusa ou o seu silêncio não implicarão confissão. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 19. Não se aplicam na ação de improbidade administrativa: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - a presunção de veracidade dos fatos alegados pelo autor em caso de revelia; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - a imposição de ônus da prova ao réu, na forma dos §§ 1º e 2º do art. 373 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil); (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"III - o ajuizamento de mais de uma ação de improbidade administrativa pelo mesmo fato, competindo ao Conselho Nacional do Ministério Público dirimir conflitos de atribuições entre membros de Ministérios Públicos distintos; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"IV - o reexame obrigatório da sentença de improcedência ou de extinção sem resolução de mérito. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 20. A assessoria jurídica que emitiu o parecer atestando a legalidade prévia dos atos administrativos praticados pelo administrador público ficará obrigada a defendê-lo judicialmente, caso este venha a responder ação por improbidade administrativa, até que a decisão transite em julgado. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 21. Das decisões interlocutórias caberá agravo de instrumento, inclusive da decisão que rejeitar questões preliminares suscitadas pelo réu em sua contestação. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 17-A. (VETADO): (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"I - (VETADO); (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"II - (VETADO); (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"III - (VETADO). (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"§ 1º (VETADO). (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"§ 2º (VETADO). (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"§ 3º (VETADO). (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"§ 4º (VETADO). (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"§ 5º (VETADO). (Incluído pela Lei nº 13.964, de 2019)"},{"k":"p","t":"Art. 17-B. O Ministério Público poderá, conforme as circunstâncias do caso concreto, celebrar acordo de não persecução civil, desde que dele advenham, ao menos, os seguintes resultados: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - o integral ressarcimento do dano; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - a reversão à pessoa jurídica lesada da vantagem indevida obtida, ainda que oriunda de agentes privados. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º A celebração do acordo a que se refere o caput deste artigo dependerá, cumulativamente: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - da oitiva do ente federativo lesado, em momento anterior ou posterior à propositura da ação; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - de aprovação, no prazo de até 60 (sessenta) dias, pelo órgão do Ministério Público competente para apreciar as promoções de arquivamento de inquéritos civis, se anterior ao ajuizamento da ação; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"III - de homologação judicial, independentemente de o acordo ocorrer antes ou depois do ajuizamento da ação de improbidade administrativa. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º Em qualquer caso, a celebração do acordo a que se refere o caput deste artigo considerará a personalidade do agente, a natureza, as circunstâncias, a gravidade e a repercussão social do ato de improbidade, bem como as vantagens, para o interesse público, da rápida solução do caso. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º Para fins de apuração do valor do dano a ser ressarcido, deverá ser realizada a oitiva do Tribunal de Contas competente, que se manifestará, com indicação dos parâmetros utilizados, no prazo de 90 (noventa) dias. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º O acordo a que se refere o caput deste artigo poderá ser celebrado no curso da investigação de apuração do ilícito, no curso da ação de improbidade ou no momento da execução da sentença condenatória. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º As negociações para a celebração do acordo a que se refere o caput deste artigo ocorrerão entre o Ministério Público, de um lado, e, de outro, o investigado ou demandado e o seu defensor. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º O acordo a que se refere o caput deste artigo poderá contemplar a adoção de mecanismos e procedimentos internos de integridade, de auditoria e de incentivo à denúncia de irregularidades e a aplicação efetiva de códigos de ética e de conduta no âmbito da pessoa jurídica, se for o caso, bem como de outras medidas em favor do interesse público e de boas práticas administrativas. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 7º Em caso de descumprimento do acordo a que se refere o caput deste artigo, o investigado ou o demandado ficará impedido de celebrar novo acordo pelo prazo de 5 (cinco) anos, contado do conhecimento pelo Ministério Público do efetivo descumprimento. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 17-C. A sentença proferida nos processos a que se refere esta Lei deverá, além de observar o disposto no art. 489 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil): (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - indicar de modo preciso os fundamentos que demonstram os elementos a que se referem os arts. 9º, 10 e 11 desta Lei, que não podem ser presumidos; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - considerar as consequências práticas da decisão, sempre que decidir com base em valores jurídicos abstratos; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"III - considerar os obstáculos e as dificuldades reais do gestor e as exigências das políticas públicas a seu cargo, sem prejuízo dos direitos dos administrados e das circunstâncias práticas que houverem imposto, limitado ou condicionado a ação do agente; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"IV - considerar, para a aplicação das sanções, de forma isolada ou cumulativa: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"a) os princípios da proporcionalidade e da razoabilidade; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"b) a natureza, a gravidade e o impacto da infração cometida; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"c) a extensão do dano causado; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"d) o proveito patrimonial obtido pelo agente; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"e) as circunstâncias agravantes ou atenuantes; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"f) a atuação do agente em minorar os prejuízos e as consequências advindas de sua conduta omissiva ou comissiva; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"g) os antecedentes do agente; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"V - considerar na aplicação das sanções a dosimetria das sanções relativas ao mesmo fato já aplicadas ao agente; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"VI - considerar, na fixação das penas relativamente ao terceiro, quando for o caso, a sua atuação específica, não admitida a sua responsabilização por ações ou omissões para as quais não tiver concorrido ou das quais não tiver obtido vantagens patrimoniais indevidas; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"VII - indicar, na apuração da ofensa a princípios, critérios objetivos que justifiquem a imposição da sanção. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º A ilegalidade sem a presença de dolo que a qualifique não configura ato de improbidade. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º Na hipótese de litisconsórcio passivo, a condenação ocorrerá no limite da participação e dos benefícios diretos, vedada qualquer solidariedade. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º Não haverá remessa necessária nas sentenças de que trata esta Lei. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 17-D. A ação por improbidade administrativa é repressiva, de caráter sancionatório, destinada à aplicação de sanções de caráter pessoal previstas nesta Lei, e não constitui ação civil, vedado seu ajuizamento para o controle de legalidade de políticas públicas e para a proteção do patrimônio público e social, do meio ambiente e de outros interesses difusos, coletivos e individuais homogêneos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. Ressalvado o disposto nesta Lei, o controle de legalidade de políticas públicas e a responsabilidade de agentes públicos, inclusive políticos, entes públicos e governamentais, por danos ao meio ambiente, ao consumidor, a bens e direitos de valor artístico, estético, histórico, turístico e paisagístico, a qualquer outro interesse difuso ou coletivo, à ordem econômica, à ordem urbanística, à honra e à dignidade de grupos raciais, étnicos ou religiosos e ao patrimônio público e social submetemse aos termos da Lei nº 7.347, de 24 de julho de 1985. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 18. A sentença que julgar procedente a ação fundada nos arts. 9º e 10 desta Lei condenará ao ressarcimento dos danos e à perda ou à reversão dos bens e valores ilicitamente adquiridos, conforme o caso, em favor da pessoa jurídica prejudicada pelo ilícito. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º Se houver necessidade de liquidação do dano, a pessoa jurídica prejudicada procederá a essa determinação e ao ulterior procedimento para cumprimento da sentença referente ao ressarcimento do patrimônio público ou à perda ou à reversão dos bens. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º Caso a pessoa jurídica prejudicada não adote as providências a que se refere o § 1º deste artigo no prazo de 6 (seis) meses, contado do trânsito em julgado da sentença de procedência da ação, caberá ao Ministério Público proceder à respectiva liquidação do dano e ao cumprimento da sentença referente ao ressarcimento do patrimônio público ou à perda ou à reversão dos bens, sem prejuízo de eventual responsabilização pela omissão verificada. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º Para fins de apuração do valor do ressarcimento, deverão ser descontados os serviços efetivamente prestados. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º O juiz poderá autorizar o parcelamento, em até 48 (quarenta e oito) parcelas mensais corrigidas monetariamente, do débito resultante de condenação pela prática de improbidade administrativa se o réu demonstrar incapacidade financeira de saldá-lo de imediato. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 18-A. A requerimento do réu, na fase de cumprimento da sentença, o juiz unificará eventuais sanções aplicadas com outras já impostas em outros processos, tendo em vista a eventual continuidade de ilícito ou a prática de diversas ilicitudes, observado o seguinte: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - no caso de continuidade de ilícito, o juiz promoverá a maior sanção aplicada, aumentada de 1/3 (um terço), ou a soma das penas, o que for mais benéfico ao réu; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - no caso de prática de novos atos ilícitos pelo mesmo sujeito, o juiz somará as sanções. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. As sanções de suspensão de direitos políticos e de proibição de contratar ou de receber incentivos fiscais ou creditícios do poder público observarão o limite máximo de 20 (vinte) anos. (Incluído pela Lei nº 14.230, de 2021)"}]},{"id":"s2","title":"CAPÍTULO VI — DAS DISPOSIÇÕES PENAIS · arts. 19 a 25","tag":"","b":[{"k":"h","t":"CAPÍTULO VI — DAS DISPOSIÇÕES PENAIS"},{"k":"p","t":"Art. 19. Constitui crime a representação por ato de improbidade contra agente público ou terceiro beneficiário, quando o autor da denúncia o sabe inocente."},{"k":"p","t":"Pena: detenção de seis a dez meses e multa."},{"k":"p","t":"Parágrafo único. Além da sanção penal, o denunciante está sujeito a indenizar o denunciado pelos danos materiais, morais ou à imagem que houver provocado."},{"k":"p","t":"Art. 20. A perda da função pública e a suspensão dos direitos políticos só se efetivam com o trânsito em julgado da sentença condenatória."},{"k":"p","t":"§ 1º A autoridade judicial competente poderá determinar o afastamento do agente público do exercício do cargo, do emprego ou da função, sem prejuízo da remuneração, quando a medida for necessária à instrução processual ou para evitar a iminente prática de novos ilícitos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º O afastamento previsto no § 1º deste artigo será de até 90 (noventa) dias, prorrogáveis uma única vez por igual prazo, mediante decisão motivada. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 21. A aplicação das sanções previstas nesta lei independe:"},{"k":"p","t":"I - da efetiva ocorrência de dano ao patrimônio público, salvo quanto à pena de ressarcimento e às condutas previstas no art. 10 desta Lei; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - da aprovação ou rejeição das contas pelo órgão de controle interno ou pelo Tribunal ou Conselho de Contas."},{"k":"p","t":"§ 1º Os atos do órgão de controle interno ou externo serão considerados pelo juiz quando tiverem servido de fundamento para a conduta do agente público. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º As provas produzidas perante os órgãos de controle e as correspondentes decisões deverão ser consideradas na formação da convicção do juiz, sem prejuízo da análise acerca do dolo na conduta do agente. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º As sentenças civis e penais produzirão efeitos em relação à ação de improbidade quando concluírem pela inexistência da conduta ou pela negativa da autoria. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º A absolvição criminal em ação que discuta os mesmos fatos, confirmada por decisão colegiada, impede o trâmite da ação da qual trata esta Lei, havendo comunicação com todos os fundamentos de absolvição previstos no art. 386 do Decreto-Lei nº 3.689, de 3 de outubro de 1941 (Código de Processo Penal). (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º Sanções eventualmente aplicadas em outras esferas deverão ser compensadas com as sanções aplicadas nos termos desta Lei. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 22. Para apurar qualquer ilícito previsto nesta Lei, o Ministério Público, de ofício, a requerimento de autoridade administrativa ou mediante representação formulada de acordo com o disposto no art. 14 desta Lei, poderá instaurar inquérito civil ou procedimento investigativo assemelhado e requisitar a instauração de inquérito policial. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. Na apuração dos ilícitos previstos nesta Lei, será garantido ao investigado a oportunidade de manifestação por escrito e de juntada de documentos que comprovem suas alegações e auxiliem na elucidação dos fatos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"h","t":"CAPÍTULO VII — DA PRESCRIÇÃO"},{"k":"p","t":"Art. 23. A ação para a aplicação das sanções previstas nesta Lei prescreve em 8 (oito) anos, contados a partir da ocorrência do fato ou, no caso de infrações permanentes, do dia em que cessou a permanência. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - (revogado); (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - (revogado); (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"III - (revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º A instauração de inquérito civil ou de processo administrativo para apuração dos ilícitos referidos nesta Lei suspende o curso do prazo prescricional por, no máximo, 180 (cento e oitenta) dias corridos, recomeçando a correr após a sua conclusão ou, caso não concluído o processo, esgotado o prazo de suspensão. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º O inquérito civil para apuração do ato de improbidade será concluído no prazo de 365 (trezentos e sessenta e cinco) dias corridos, prorrogável uma única vez por igual período, mediante ato fundamentado submetido à revisão da instância competente do órgão ministerial, conforme dispuser a respectiva lei orgânica. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º Encerrado o prazo previsto no § 2º deste artigo, a ação deverá ser proposta no prazo de 30 (trinta) dias, se não for caso de arquivamento do inquérito civil. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º O prazo da prescrição referido no caput deste artigo interrompe-se: (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - pelo ajuizamento da ação de improbidade administrativa; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - pela publicação da sentença condenatória; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"III - pela publicação de decisão ou acórdão de Tribunal de Justiça ou Tribunal Regional Federal que confirma sentença condenatória ou que reforma sentença de improcedência; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"IV - pela publicação de decisão ou acórdão do Superior Tribunal de Justiça que confirma acórdão condenatório ou que reforma acórdão de improcedência; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"V - pela publicação de decisão ou acórdão do Supremo Tribunal Federal que confirma acórdão condenatório ou que reforma acórdão de improcedência. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º Interrompida a prescrição, o prazo recomeça a correr do dia da interrupção, pela metade do prazo previsto no caput deste artigo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º A suspensão e a interrupção da prescrição produzem efeitos relativamente a todos os que concorreram para a prática do ato de improbidade. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 7º Nos atos de improbidade conexos que sejam objeto do mesmo processo, a suspensão e a interrupção relativas a qualquer deles estendem-se aos demais. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 8º O juiz ou o tribunal, depois de ouvido o Ministério Público, deverá, de ofício ou a requerimento da parte interessada, reconhecer a prescrição intercorrente da pretensão sancionadora e decretá-la de imediato, caso, entre os marcos interruptivos referidos no § 4º, transcorra o prazo previsto no § 5º deste artigo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 23-A. É dever do poder público oferecer contínua capacitação aos agentes públicos e políticos que atuem com prevenção ou repressão de atos de improbidade administrativa. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 23-B. Nas ações e nos acordos regidos por esta Lei, não haverá adiantamento de custas, de preparo, de emolumentos, de honorários periciais e de quaisquer outras despesas. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º No caso de procedência da ação, as custas e as demais despesas processuais serão pagas ao final. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º Haverá condenação em honorários sucumbenciais em caso de improcedência da ação de improbidade se comprovada má-fé. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 23-C. Atos que ensejem enriquecimento ilícito, perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação de recursos públicos dos partidos políticos, ou de suas fundações, serão responsabilizados nos termos da Lei nº 9.096, de 19 de setembro de 1995. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"h","t":"CAPÍTULO VIII — DAS DISPOSIÇÕES FINAIS"},{"k":"p","t":"Art. 24. Esta lei entra em vigor na data de sua publicação."},{"k":"p","t":"Art. 25. Ficam revogadas as Leis n°s 3.164, de 1° de junho de 1957, e 3.502, de 21 de dezembro de 1958 e demais disposições em contrário. Rio de Janeiro, 2 de junho de 1992; 171° da Independência e 104° da República."},{"k":"h","t":"FERNANDO COLLOR"},{"k":"p","t":"Célio Borja Este texto não substitui o publicado no DOU de 3.6.1992."}]}],"pcd":[{"id":"s0","title":"Disposições iniciais · arts. 1 a 9","tag":"","b":[{"k":"p","t":"Lei nº 13.146/2015 Institui a Lei Brasileira de Inclusão da Pessoa com Deficiência (Estatuto da Pessoa com Deficiência). A PRESIDENTA DA REPÚBLICA Faço saber que o Congresso Nacional decreta e eu sanciono a seguinte Lei:"},{"k":"h","t":"LIVRO I"},{"k":"h","t":"PARTE GERAL"},{"k":"h","t":"TÍTULO I — DISPOSIÇÕES PRELIMINARES"},{"k":"h","t":"CAPÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 1º É instituída a Lei Brasileira de Inclusão da Pessoa com Deficiência (Estatuto da Pessoa com Deficiência), destinada a assegurar e a promover, em condições de igualdade, o exercício dos direitos e das liberdades fundamentais por pessoa com deficiência, visando à sua inclusão social e cidadania."},{"k":"p","t":"Parágrafo único. Esta Lei tem como base a Convenção sobre os Direitos das Pessoas com Deficiência e seu Protocolo Facultativo, ratificados pelo Congresso Nacional por meio do Decreto Legislativo nº 186, de 9 de julho de 2008 , em conformidade com o procedimento previsto no § 3º do art. 5º da Constituição da República Federativa do Brasil , em vigor para o Brasil, no plano jurídico externo, desde 31 de agosto de 2008, e promulgados pelo Decreto nº 6.949, de 25 de agosto de 2009 , data de início de sua vigência no plano interno."},{"k":"p","t":"Art. 2º Considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas."},{"k":"p","t":"§ 1º A avaliação da deficiência, quando necessária, será biopsicossocial, realizada por equipe multiprofissional e interdisciplinar e considerará: (Vigência)"},{"k":"p","t":"I - os impedimentos nas funções e nas estruturas do corpo;"},{"k":"p","t":"II - os fatores socioambientais, psicológicos e pessoais;"},{"k":"p","t":"III - a limitação no desempenho de atividades; e"},{"k":"p","t":"IV - a restrição de participação."},{"k":"p","t":"§ 2º O Poder Executivo criará instrumentos para avaliação da deficiência. (Vide Lei nº 13.846, de 2019)"},{"k":"p","t":"Art. 3º Para fins de aplicação desta Lei, consideram-se:"},{"k":"p","t":"I - acessibilidade: possibilidade e condição de alcance para utilização, com segurança e autonomia, de espaços, mobiliários, equipamentos urbanos, edificações, transportes, informação e comunicação, inclusive seus sistemas e tecnologias, bem como de outros serviços e instalações abertos ao público, de uso público ou privados de uso coletivo, tanto na zona urbana como na rural, por pessoa com deficiência ou com mobilidade reduzida;"},{"k":"p","t":"II - desenho universal: concepção de produtos, ambientes, programas e serviços a serem usados por todas as pessoas, sem necessidade de adaptação ou de projeto específico, incluindo os recursos de tecnologia assistiva;"},{"k":"p","t":"III - tecnologia assistiva ou ajuda técnica: produtos, equipamentos, dispositivos, recursos, metodologias, estratégias, práticas e serviços que objetivem promover a funcionalidade, relacionada à atividade e à participação da pessoa com deficiência ou com mobilidade reduzida, visando à sua autonomia, independência, qualidade de vida e inclusão social;"},{"k":"p","t":"IV - barreiras: qualquer entrave, obstáculo, atitude ou comportamento que limite ou impeça a participação social da pessoa, bem como o gozo, a fruição e o exercício de seus direitos à acessibilidade, à liberdade de movimento e de expressão, à comunicação, ao acesso à informação, à compreensão, à circulação com segurança, entre outros, classificadas em:"},{"k":"p","t":"a) barreiras urbanísticas: as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo;"},{"k":"p","t":"b) barreiras arquitetônicas: as existentes nos edifícios públicos e privados;"},{"k":"p","t":"c) barreiras nos transportes: as existentes nos sistemas e meios de transportes;"},{"k":"p","t":"d) barreiras nas comunicações e na informação: qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações por intermédio de sistemas de comunicação e de tecnologia da informação;"},{"k":"p","t":"e) barreiras atitudinais: atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas;"},{"k":"p","t":"f) barreiras tecnológicas: as que dificultam ou impedem o acesso da pessoa com deficiência às tecnologias;"},{"k":"p","t":"V - comunicação: forma de interação dos cidadãos que abrange, entre outras opções, as línguas, inclusive a Língua Brasileira de Sinais (Libras), a visualização de textos, o Braille, o sistema de sinalização ou de comunicação tátil, os caracteres ampliados, os dispositivos multimídia, assim como a linguagem simples, escrita e oral, os sistemas auditivos e os meios de voz digitalizados e os modos, meios e formatos aumentativos e alternativos de comunicação, incluindo as tecnologias da informação e das comunicações;"},{"k":"p","t":"VI - adaptações razoáveis: adaptações, modificações e ajustes necessários e adequados que não acarretem ônus desproporcional e indevido, quando requeridos em cada caso, a fim de assegurar que a pessoa com deficiência possa gozar ou exercer, em igualdade de condições e oportunidades com as demais pessoas, todos os direitos e liberdades fundamentais;"},{"k":"p","t":"VII - elemento de urbanização: quaisquer componentes de obras de urbanização, tais como os referentes a pavimentação, saneamento, encanamento para esgotos, distribuição de energia elétrica e de gás, iluminação pública, serviços de comunicação, abastecimento e distribuição de água, paisagismo e os que materializam as indicações do planejamento urbanístico;"},{"k":"p","t":"VIII - mobiliário urbano: conjunto de objetos existentes nas vias e nos espaços públicos, superpostos ou adicionados aos elementos de urbanização ou de edificação, de forma que sua modificação ou seu traslado não provoque alterações substanciais nesses elementos, tais como semáforos, postes de sinalização e similares, terminais e pontos de acesso coletivo às telecomunicações, fontes de água, lixeiras, toldos, marquises, bancos, quiosques e quaisquer outros de natureza análoga;"},{"k":"p","t":"IX - pessoa com mobilidade reduzida: aquela que tenha, por qualquer motivo, dificuldade de movimentação, permanente ou temporária, gerando redução efetiva da mobilidade, da flexibilidade, da coordenação motora ou da percepção, incluindo idoso, gestante, lactante, pessoa com criança de colo e obeso;"},{"k":"p","t":"X - residências inclusivas: unidades de oferta do Serviço de Acolhimento do Sistema Único de Assistência Social (Suas) localizadas em áreas residenciais da comunidade, com estruturas adequadas, que possam contar com apoio psicossocial para o atendimento das necessidades da pessoa acolhida, destinadas a jovens e adultos com deficiência, em situação de dependência, que não dispõem de condições de autossustentabilidade e com vínculos familiares fragilizados ou rompidos;"},{"k":"p","t":"XI - moradia para a vida independente da pessoa com deficiência: moradia com estruturas adequadas capazes de proporcionar serviços de apoio coletivos e individualizados que respeitem e ampliem o grau de autonomia de jovens e adultos com deficiência;"},{"k":"p","t":"XII - atendente pessoal: pessoa, membro ou não da família, que, com ou sem remuneração, assiste ou presta cuidados básicos e essenciais à pessoa com deficiência no exercício de suas atividades diárias, excluídas as técnicas ou os procedimentos identificados com profissões legalmente estabelecidas;"},{"k":"p","t":"XIII - profissional de apoio escolar: pessoa que exerce atividades de alimentação, higiene e locomoção do estudante com deficiência e atua em todas as atividades escolares nas quais se fizer necessária, em todos os níveis e modalidades de ensino, em instituições públicas e privadas, excluídas as técnicas ou os procedimentos identificados com profissões legalmente estabelecidas;"},{"k":"p","t":"XIV - acompanhante: aquele que acompanha a pessoa com deficiência, podendo ou não desempenhar as funções de atendente pessoal."},{"k":"h","t":"CAPÍTULO II — DA IGUALDADE E DA NÃO DISCRIMINAÇÃO"},{"k":"p","t":"Art. 4º Toda pessoa com deficiência tem direito à igualdade de oportunidades com as demais pessoas e não sofrerá nenhuma espécie de discriminação."},{"k":"p","t":"§ 1º Considera-se discriminação em razão da deficiência toda forma de distinção, restrição ou exclusão, por ação ou omissão, que tenha o propósito ou o efeito de prejudicar, impedir ou anular o reconhecimento ou o exercício dos direitos e das liberdades fundamentais de pessoa com deficiência, incluindo a recusa de adaptações razoáveis e de fornecimento de tecnologias assistivas."},{"k":"p","t":"§ 2º A pessoa com deficiência não está obrigada à fruição de benefícios decorrentes de ação afirmativa."},{"k":"p","t":"Art. 5º A pessoa com deficiência será protegida de toda forma de negligência, discriminação, exploração, violência, tortura, crueldade, opressão e tratamento desumano ou degradante."},{"k":"p","t":"Parágrafo único. Para os fins da proteção mencionada no caput deste artigo, são considerados especialmente vulneráveis a criança, o adolescente, a mulher e o idoso, com deficiência."},{"k":"p","t":"Art. 6º A deficiência não afeta a plena capacidade civil da pessoa, inclusive para:"},{"k":"p","t":"I - casar-se e constituir união estável;"},{"k":"p","t":"II - exercer direitos sexuais e reprodutivos;"},{"k":"p","t":"III - exercer o direito de decidir sobre o número de filhos e de ter acesso a informações adequadas sobre reprodução e planejamento familiar;"},{"k":"p","t":"IV - conservar sua fertilidade, sendo vedada a esterilização compulsória;"},{"k":"p","t":"V - exercer o direito à família e à convivência familiar e comunitária; e"},{"k":"p","t":"VI - exercer o direito à guarda, à tutela, à curatela e à adoção, como adotante ou adotando, em igualdade de oportunidades com as demais pessoas."},{"k":"p","t":"Art. 7º É dever de todos comunicar à autoridade competente qualquer forma de ameaça ou de violação aos direitos da pessoa com deficiência."},{"k":"p","t":"Parágrafo único. Se, no exercício de suas funções, os juízes e os tribunais tiverem conhecimento de fatos que caracterizem as violações previstas nesta Lei, devem remeter peças ao Ministério Público para as providências cabíveis."},{"k":"p","t":"Art. 8º É dever do Estado, da sociedade e da família assegurar à pessoa com deficiência, com prioridade, a efetivação dos direitos referentes à vida, à saúde, à sexualidade, à paternidade e à maternidade, à alimentação, à habitação, à educação, à profissionalização, ao trabalho, à previdência social, à habilitação e à reabilitação, ao transporte, à acessibilidade, à cultura, ao desporto, ao turismo, ao lazer, à informação, à comunicação, aos avanços científicos e tecnológicos, à dignidade, ao respeito, à liberdade, à convivência familiar e comunitária, entre outros decorrentes da Constituição Federal, da Convenção sobre os Direitos das Pessoas com Deficiência e seu Protocolo Facultativo e das leis e de outras normas que garantam seu bem-estar pessoal, social e econômico."},{"k":"h","t":"SEÇÃO ÚNICA — DO ATENDIMENTO PRIORITÁRIO"},{"k":"p","t":"Art. 9º A pessoa com deficiência tem direito a receber atendimento prioritário, sobretudo com a finalidade de:"},{"k":"p","t":"I - proteção e socorro em quaisquer circunstâncias;"},{"k":"p","t":"II - atendimento em todas as instituições e serviços de atendimento ao público;"},{"k":"p","t":"III - disponibilização de recursos, tanto humanos quanto tecnológicos, que garantam atendimento em igualdade de condições com as demais pessoas;"},{"k":"p","t":"IV - disponibilização de pontos de parada, estações e terminais acessíveis de transporte coletivo de passageiros e garantia de segurança no embarque e no desembarque;"},{"k":"p","t":"V - acesso a informações e disponibilização de recursos de comunicação acessíveis;"},{"k":"p","t":"VI - recebimento de restituição de imposto de renda;"},{"k":"p","t":"VII - tramitação processual e procedimentos judiciais e administrativos em que for parte ou interessada, em todos os atos e diligências."},{"k":"p","t":"§ 1º Os direitos previstos neste artigo são extensivos ao acompanhante da pessoa com deficiência ou ao seu atendente pessoal, exceto quanto ao disposto nos incisos VI e VII deste artigo."},{"k":"p","t":"§ 2º Nos serviços de emergência públicos e privados, a prioridade conferida por esta Lei é condicionada aos protocolos de atendimento médico."}]},{"id":"s1","title":"TÍTULO II — DOS DIREITOS FUNDAMENTAIS · arts. 10 a 36","tag":"","b":[{"k":"h","t":"TÍTULO II — DOS DIREITOS FUNDAMENTAIS"},{"k":"h","t":"CAPÍTULO I — DO DIREITO À VIDA"},{"k":"p","t":"Art. 10. Compete ao poder público garantir a dignidade da pessoa com deficiência ao longo de toda a vida."},{"k":"p","t":"Parágrafo único. Em situações de risco, emergência ou estado de calamidade pública, a pessoa com deficiência será considerada vulnerável, devendo o poder público adotar medidas para sua proteção e segurança."},{"k":"p","t":"Art. 11. A pessoa com deficiência não poderá ser obrigada a se submeter a intervenção clínica ou cirúrgica, a tratamento ou a institucionalização forçada."},{"k":"p","t":"Parágrafo único. O consentimento da pessoa com deficiência em situação de curatela poderá ser suprido, na forma da lei."},{"k":"p","t":"Art. 12. O consentimento prévio, livre e esclarecido da pessoa com deficiência é indispensável para a realização de tratamento, procedimento, hospitalização e pesquisa científica."},{"k":"p","t":"§ 1º Em caso de pessoa com deficiência em situação de curatela, deve ser assegurada sua participação, no maior grau possível, para a obtenção de consentimento."},{"k":"p","t":"§ 2º A pesquisa científica envolvendo pessoa com deficiência em situação de tutela ou de curatela deve ser realizada, em caráter excepcional, apenas quando houver indícios de benefício direto para sua saúde ou para a saúde de outras pessoas com deficiência e desde que não haja outra opção de pesquisa de eficácia comparável com participantes não tutelados ou curatelados."},{"k":"p","t":"Art. 13. A pessoa com deficiência somente será atendida sem seu consentimento prévio, livre e esclarecido em casos de risco de morte e de emergência em saúde, resguardado seu superior interesse e adotadas as salvaguardas legais cabíveis."},{"k":"h","t":"CAPÍTULO VI — DO DIREITO AO TRABALHO"},{"k":"h","t":"SEÇÃO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 34. A pessoa com deficiência tem direito ao trabalho de sua livre escolha e aceitação, em ambiente acessível e inclusivo, em igualdade de oportunidades com as demais pessoas."},{"k":"p","t":"§ 1º As pessoas jurídicas de direito público, privado ou de qualquer natureza são obrigadas a garantir ambientes de trabalho acessíveis e inclusivos."},{"k":"p","t":"§ 2º A pessoa com deficiência tem direito, em igualdade de oportunidades com as demais pessoas, a condições justas e favoráveis de trabalho, incluindo igual remuneração por trabalho de igual valor."},{"k":"p","t":"§ 3º É vedada restrição ao trabalho da pessoa com deficiência e qualquer discriminação em razão de sua condição, inclusive nas etapas de recrutamento, seleção, contratação, admissão, exames admissional e periódico, permanência no emprego, ascensão profissional e reabilitação profissional, bem como exigência de aptidão plena."},{"k":"p","t":"§ 4º A pessoa com deficiência tem direito à participação e ao acesso a cursos, treinamentos, educação continuada, planos de carreira, promoções, bonificações e incentivos profissionais oferecidos pelo empregador, em igualdade de oportunidades com os demais empregados."},{"k":"p","t":"§ 5º É garantida aos trabalhadores com deficiência acessibilidade em cursos de formação e de capacitação."},{"k":"p","t":"Art. 35. É finalidade primordial das políticas públicas de trabalho e emprego promover e garantir condições de acesso e de permanência da pessoa com deficiência no campo de trabalho."},{"k":"p","t":"Parágrafo único. Os programas de estímulo ao empreendedorismo e ao trabalho autônomo, incluídos o cooperativismo e o associativismo, devem prever a participação da pessoa com deficiência e a disponibilização de linhas de crédito, quando necessárias."},{"k":"h","t":"SEÇÃO II — DA HABILITAÇÃO PROFISSIONAL E REABILITAÇÃO PROFISSIONAL"},{"k":"p","t":"Art. 36. O poder público deve implementar serviços e programas completos de habilitação profissional e de reabilitação profissional para que a pessoa com deficiência possa ingressar, continuar ou retornar ao campo do trabalho, respeitados sua livre escolha, sua vocação e seu interesse."},{"k":"p","t":"§ 1º Equipe multidisciplinar indicará, com base em critérios previstos no § 1º do art. 2º desta Lei, programa de habilitação ou de reabilitação que possibilite à pessoa com deficiência restaurar sua capacidade e habilidade profissional ou adquirir novas capacidades e habilidades de trabalho."},{"k":"p","t":"§ 2º A habilitação profissional corresponde ao processo destinado a propiciar à pessoa com deficiência aquisição de conhecimentos, habilidades e aptidões para exercício de profissão ou de ocupação, permitindo nível suficiente de desenvolvimento profissional para ingresso no campo de trabalho."},{"k":"p","t":"§ 3º Os serviços de habilitação profissional, de reabilitação profissional e de educação profissional devem ser dotados de recursos necessários para atender a toda pessoa com deficiência, independentemente de sua característica específica, a fim de que ela possa ser capacitada para trabalho que lhe seja adequado e ter perspectivas de obtê-lo, de conservá-lo e de nele progredir."},{"k":"p","t":"§ 4º Os serviços de habilitação profissional, de reabilitação profissional e de educação profissional deverão ser oferecidos em ambientes acessíveis e inclusivos."},{"k":"p","t":"§ 5º A habilitação profissional e a reabilitação profissional devem ocorrer articuladas com as redes públicas e privadas, especialmente de saúde, de ensino e de assistência social, em todos os níveis e modalidades, em entidades de formação profissional ou diretamente com o empregador."},{"k":"p","t":"§ 6º A habilitação profissional pode ocorrer em empresas por meio de prévia formalização do contrato de emprego da pessoa com deficiência, que será considerada para o cumprimento da reserva de vagas prevista em lei, desde que por tempo determinado e"}]}]},"cards":[{"id":"c293-v","deck":"crime","t":"Art. 293 — Falsificação de papéis públicos","q":"Quais os verbos nucleares do crime de Falsificação de papéis públicos (art. 293)?","a":"falsificar"},{"id":"c293-p","deck":"crime","t":"Art. 293 — Falsificação de papéis públicos","q":"Qual a pena do crime de Falsificação de papéis públicos (art. 293)?","a":"Reclusão, 2 a 8 anos, e multa"},{"id":"c294-v","deck":"crime","t":"Art. 294 — Petrechos de falsificação","q":"Quais os verbos nucleares do crime de Petrechos de falsificação (art. 294)?","a":"fabricar, adquirir, fornecer, possuir, guardar"},{"id":"c294-p","deck":"crime","t":"Art. 294 — Petrechos de falsificação","q":"Qual a pena do crime de Petrechos de falsificação (art. 294)?","a":"Reclusão, 1 a 3 anos, e multa"},{"id":"c296-v","deck":"crime","t":"Art. 296 — Falsificação do selo ou sinal público","q":"Quais os verbos nucleares do crime de Falsificação do selo ou sinal público (art. 296)?","a":"falsificar"},{"id":"c296-p","deck":"crime","t":"Art. 296 — Falsificação do selo ou sinal público","q":"Qual a pena do crime de Falsificação do selo ou sinal público (art. 296)?","a":"Reclusão, 2 a 6 anos, e multa"},{"id":"c297-v","deck":"crime","t":"Art. 297 — Falsificação de documento público","q":"Quais os verbos nucleares do crime de Falsificação de documento público (art. 297)?","a":"falsificar, alterar"},{"id":"c297-p","deck":"crime","t":"Art. 297 — Falsificação de documento público","q":"Qual a pena do crime de Falsificação de documento público (art. 297)?","a":"Reclusão, 2 a 6 anos, e multa"},{"id":"c297-x0","deck":"crime","t":"Art. 297 — Falsificação de documento público","q":"Qual a majorante do funcionário público no art. 297 (§1º)?","a":"Aumenta-se a pena de 1/6 (sexta parte) se o agente é funcionário público e comete o crime prevalecendo-se do cargo."},{"id":"c297-x1","deck":"crime","t":"Art. 297 — Falsificação de documento público","q":"Quais documentos se equiparam a documento público (art. 297, §2º)?","a":"O emanado de entidade paraestatal, título ao portador ou transmissível por endosso, ações de sociedade comercial, livros mercantis e testamento particular."},{"id":"c298-v","deck":"crime","t":"Art. 298 — Falsificação de documento particular","q":"Quais os verbos nucleares do crime de Falsificação de documento particular (art. 298)?","a":"falsificar, alterar"},{"id":"c298-p","deck":"crime","t":"Art. 298 — Falsificação de documento particular","q":"Qual a pena do crime de Falsificação de documento particular (art. 298)?","a":"Reclusão, 1 a 5 anos, e multa"},{"id":"c299-v","deck":"crime","t":"Art. 299 — Falsidade ideológica","q":"Quais os verbos nucleares do crime de Falsidade ideológica (art. 299)?","a":"omitir, inserir, fazer inserir"},{"id":"c299-p","deck":"crime","t":"Art. 299 — Falsidade ideológica","q":"Qual a pena do crime de Falsidade ideológica (art. 299)?","a":"Reclusão, 1 a 5 anos, e multa (público); reclusão, 1 a 3 anos, e multa (particular)"},{"id":"c299-x0","deck":"crime","t":"Art. 299 — Falsidade ideológica","q":"Falsidade ideológica: quais são as três condutas e qual o fim especial?","a":"Omitir declaração que devia constar; inserir; fazer inserir declaração falsa ou diversa. Fim: prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante."},{"id":"c299-x1","deck":"crime","t":"Art. 299 — Falsidade ideológica","q":"Como a pena da falsidade ideológica varia conforme o documento?","a":"Público: reclusão de 1 a 5 anos e multa. Particular: reclusão de 1 a 3 anos e multa."},{"id":"c299-x2","deck":"crime","t":"Art. 299 — Falsidade ideológica","q":"Qual o aumento do parágrafo único do art. 299?","a":"1/6 (sexta parte) se funcionário público prevalecendo-se do cargo, ou se a falsificação é de assentamento de registro civil."},{"id":"c300-v","deck":"crime","t":"Art. 300 — Falso reconhecimento de firma ou letra","q":"Quais os verbos nucleares do crime de Falso reconhecimento de firma ou letra (art. 300)?","a":"reconhecer"},{"id":"c300-p","deck":"crime","t":"Art. 300 — Falso reconhecimento de firma ou letra","q":"Qual a pena do crime de Falso reconhecimento de firma ou letra (art. 300)?","a":"Reclusão, 1 a 5 anos, e multa (público); 1 a 3 anos, e multa (particular)"},{"id":"c301-v","deck":"crime","t":"Art. 301 — Certidão ou atestado ideologicamente falso","q":"Quais os verbos nucleares do crime de Certidão ou atestado ideologicamente falso (art. 301)?","a":"atestar, certificar"},{"id":"c301-p","deck":"crime","t":"Art. 301 — Certidão ou atestado ideologicamente falso","q":"Qual a pena do crime de Certidão ou atestado ideologicamente falso (art. 301)?","a":"Detenção, 2 meses a 1 ano"},{"id":"c302-1","deck":"crime","t":"Art. 302 — Falsidade de atestado médico","q":"Falsidade de atestado médico (art. 302): qual o verbo nuclear e qual a pena?","a":"Verbo(s): dar. Pena: Detenção, 1 mês a 1 ano."},{"id":"c303-1","deck":"crime","t":"Art. 303 — Reprodução ou adulteração de selo ou peça filatélica","q":"Reprodução ou adulteração de selo ou peça filatélica (art. 303): qual o verbo nuclear e qual a pena?","a":"Verbo(s): reproduzir, alterar. Pena: Detenção, 1 a 3 anos, e multa."},{"id":"c304-v","deck":"crime","t":"Art. 304 — Uso de documento falso","q":"Quais os verbos nucleares do crime de Uso de documento falso (art. 304)?","a":"fazer uso"},{"id":"c304-p","deck":"crime","t":"Art. 304 — Uso de documento falso","q":"Qual a pena do crime de Uso de documento falso (art. 304)?","a":"Pena do crime de falsificação ou alteração (arts. 297 a 302)"},{"id":"c305-v","deck":"crime","t":"Art. 305 — Supressão de documento","q":"Quais os verbos nucleares do crime de Supressão de documento (art. 305)?","a":"destruir, suprimir, ocultar"},{"id":"c305-p","deck":"crime","t":"Art. 305 — Supressão de documento","q":"Qual a pena do crime de Supressão de documento (art. 305)?","a":"Reclusão, 2 a 6 anos, e multa (público); 1 a 5 anos, e multa (particular)"},{"id":"c307-v","deck":"crime","t":"Art. 307 — Falsa identidade","q":"Quais os verbos nucleares do crime de Falsa identidade (art. 307)?","a":"atribuir-se, atribuir"},{"id":"c307-p","deck":"crime","t":"Art. 307 — Falsa identidade","q":"Qual a pena do crime de Falsa identidade (art. 307)?","a":"Detenção, 3 meses a 1 ano, ou multa"},{"id":"c308-1","deck":"crime","t":"Art. 308 — Uso de documento de identidade alheia","q":"Uso de documento de identidade alheia (art. 308): qual o verbo nuclear e qual a pena?","a":"Verbo(s): usar, ceder. Pena: Detenção, 4 meses a 2 anos, e multa."},{"id":"c311-A-v","deck":"crime","t":"Art. 311-A — Fraudes em certames de interesse público","q":"Quais os verbos nucleares do crime de Fraudes em certames de interesse público (art. 311-A)?","a":"utilizar, divulgar"},{"id":"c311-A-p","deck":"crime","t":"Art. 311-A — Fraudes em certames de interesse público","q":"Qual a pena do crime de Fraudes em certames de interesse público (art. 311-A)?","a":"Reclusão, 1 a 4 anos, e multa"},{"id":"c311-A-x0","deck":"crime","t":"Art. 311-A — Fraudes em certames de interesse público","q":"Qual a qualificadora do art. 311-A (§2º) e o aumento do §3º?","a":"Se resulta dano à administração pública: reclusão, 2 a 6 anos, e multa. Aumenta-se 1/3 se o fato é cometido por funcionário público."},{"id":"c312-v","deck":"crime","t":"Art. 312 — Peculato","q":"Quais os verbos nucleares do crime de Peculato (art. 312)?","a":"apropriar-se, desviar"},{"id":"c312-p","deck":"crime","t":"Art. 312 — Peculato","q":"Qual a pena do crime de Peculato (art. 312)?","a":"Reclusão, 2 a 12 anos, e multa"},{"id":"c312-x0","deck":"crime","t":"Art. 312 — Peculato","q":"O que é o peculato-furto (art. 312, §1º)?","a":"Funcionário que, sem ter a posse, subtrai ou concorre para que seja subtraído o bem, valendo-se da facilidade do cargo. Mesma pena do caput."},{"id":"c312-x1","deck":"crime","t":"Art. 312 — Peculato","q":"Peculato culposo: pena e efeito da reparação do dano (§§2º e 3º)?","a":"Detenção, 3 meses a 1 ano. Reparação antes da sentença irrecorrível extingue a punibilidade; depois, reduz a pena pela metade."},{"id":"c313-v","deck":"crime","t":"Art. 313 — Peculato mediante erro de outrem","q":"Quais os verbos nucleares do crime de Peculato mediante erro de outrem (art. 313)?","a":"apropriar-se"},{"id":"c313-p","deck":"crime","t":"Art. 313 — Peculato mediante erro de outrem","q":"Qual a pena do crime de Peculato mediante erro de outrem (art. 313)?","a":"Reclusão, 1 a 4 anos, e multa"},{"id":"c313-A-v","deck":"crime","t":"Art. 313-A — Inserção de dados falsos em sistema de informações","q":"Quais os verbos nucleares do crime de Inserção de dados falsos em sistema de informações (art. 313-A)?","a":"inserir, facilitar, alterar, excluir"},{"id":"c313-A-p","deck":"crime","t":"Art. 313-A — Inserção de dados falsos em sistema de informações","q":"Qual a pena do crime de Inserção de dados falsos em sistema de informações (art. 313-A)?","a":"Reclusão, 2 a 12 anos, e multa"},{"id":"c313-A-x0","deck":"crime","t":"Art. 313-A — Inserção de dados falsos em sistema de informações","q":"Quem pode praticar o crime do art. 313-A?","a":"Somente o funcionário autorizado a operar o sistema (crime próprio)."},{"id":"c313-B-v","deck":"crime","t":"Art. 313-B — Modificação ou alteração não autorizada de sistema de informações","q":"Quais os verbos nucleares do crime de Modificação ou alteração não autorizada de sistema de informações (art. 313-B)?","a":"modificar, alterar"},{"id":"c313-B-p","deck":"crime","t":"Art. 313-B — Modificação ou alteração não autorizada de sistema de informações","q":"Qual a pena do crime de Modificação ou alteração não autorizada de sistema de informações (art. 313-B)?","a":"Detenção, 3 meses a 2 anos, e multa"},{"id":"c314-v","deck":"crime","t":"Art. 314 — Extravio, sonegação ou inutilização de livro ou documento","q":"Quais os verbos nucleares do crime de Extravio, sonegação ou inutilização de livro ou documento (art. 314)?","a":"extraviar, sonegar, inutilizar"},{"id":"c314-p","deck":"crime","t":"Art. 314 — Extravio, sonegação ou inutilização de livro ou documento","q":"Qual a pena do crime de Extravio, sonegação ou inutilização de livro ou documento (art. 314)?","a":"Reclusão, 1 a 4 anos, se o fato não constitui crime mais grave"},{"id":"c315-1","deck":"crime","t":"Art. 315 — Emprego irregular de verbas ou rendas públicas","q":"Emprego irregular de verbas ou rendas públicas (art. 3 ar"},{"id":"c319-p","deck":"crime","t":"Art. 319 — Prevaricação","q":"Qual a pena do crime de Prevaricação (art. 319)?","a":"Detenção, 3 meses a 1 ano, e multa"},{"id":"c319-A-v","deck":"crime","t":"Art. 319-A — Prevaricação imprópria (aparelho de comunicação em presídio)","q":"Quais os verbos nucleares do crime de Prevaricação imprópria (aparelho de comunicação em presídio) (art. 319-A)?","a":"deixar"},{"id":"c319-A-p","deck":"crime","t":"Art. 319-A — Prevaricação imprópria (aparelho de comunicação em presídio)","q":"Qual a pena do crime de Prevaricação imprópria (aparelho de comunicação em presídio) (art. 319-A)?","a":"Detenção, 3 meses a 1 ano"},{"id":"c320-1","deck":"crime","t":"Art. 320 — Condescendência criminosa","q":"Condescendência criminosa (art. 320): qual o verbo nuclear e qual a pena?","a":"Verbo(s): deixar. Pena: Detenção, 15 dias a 1 mês, ou multa."},{"id":"c321-1","deck":"crime","t":"Art. 321 — Advocacia administrativa","q":"Advocacia administrativa (art. 321): qual o verbo nuclear e qual a pena?","a":"Verbo(s): patrocinar. Pena: Detenção, 1 a 3 meses, ou multa."},{"id":"c322-v","deck":"crime","t":"Art. 322 — Violência arbitrária","q":"Quais os verbos nucleares do crime de Violência arbitrária (art. 322)?","a":"praticar"},{"id":"c322-p","deck":"crime","t":"Art. 322 — Violência arbitrária","q":"Qual a pena do crime de Violência arbitrária (art. 322)?","a":"Detenção, 6 meses a 3 anos, além da pena da violência"},{"id":"c323-1","deck":"crime","t":"Art. 323 — Abandono de função","q":"Abandono de função (art. 323): qual o verbo nuclear e qual a pena?","a":"Verbo(s): abandonar. Pena: Detenção, 15 dias a 1 mês, ou multa."},{"id":"c324-1","deck":"crime","t":"Art. 324 — Exercício funcional ilegalmente antecipado ou prolongado","q":"Exercício funcional ilegalmente antecipado ou prolongado (art. 324): qual o verbo nuclear e qual a pena?","a":"Verbo(s): entrar, continuar. Pena: Detenção, 15 dias a 1 mês, ou multa."},{"id":"c325-v","deck":"crime","t":"Art. 325 —
