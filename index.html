as comissões · afastamento que faz perder a condição de juiz certo · afastamento do redator do acórdão","46 / 109 / 160"],["90 dias","Missão de relevância · suspensão no conflito de competência · conclusão do vitaliciamento (e novo prazo máximo) · complementação de precatório","65 / 201 / 74 / 267"],["180 dias","Espera de comunicação de insuficiência no pagamento de precatório","267"],["6 meses","Restando menos, não há eleição para cargo vago","21"],["6 m a 1 ano","Mandato dos presidentes de Câmaras, Grupos e Turmas Especiais","38 / 32"],["1 ano","Estágio para permuta e após remoção (juiz) · intervalo de nova remoção (desembargador afastado)","88 / 60"],["2 anos","Mandato do Ouvidor · convocação de juiz assessor · periodicidade de publicação do RI · tempo na entrância para lista de merecimento · exercício para vitaliciamento","29 · A / 16 / 279 / 82 / 74"],["4 anos","Limite de exercício consecutivo como Ouvidor","29 · A §5º"],["5 anos","Prazo do plano plurianual de gestão","13 II x"]]}]},{"id":"s25","title":"22. Tabela-mestra de NÚMEROS e QUÓRUNS","tag":"","b":[{"k":"tbl","rows":[["Número","O quê"],["25","membros do Órgão Especial"],["13","quórum de instalação do OE"],["12","desembargadores do OE eleitos pelo Pleno"],["10","comissões permanentes"],["9","quórum do Grupo contra ato do próprio Grupo (o Grupo Especial de 9 membros foi extinto em 2026"],["7","membros do CSM · quórum do Grupo contra ato da Câmara · membros da Comissão de Jurisprudência · Decano · 6"],["5","desembargadores por Câmara · Comissão Salarial · turma ampliada (art. 942 e infringentes) · Honraria · Presidente · 4"],["3","turma julgadora da Câmara · comissão padrão · médicos da junta · suplentes de câmara temporária · escrutínios da lista tríplice · membros do OE que iniciam a recusa de promoção"],["1 · 1","Turma Especial: o mais antigo · 1 suplente de cada Câmara · Público/Criminal) ou de cada Grupo · Privado) · Assento 597/2026"],["2","Câmaras por Grupo · desembargadores por Coordenadoria · chapa da Ouvidoria"]]},{"k":"tbl","rows":[["Quórum","Para quê"],["2/3 do OE","alteração do Regimento (e dispensa do rito na urgência) · presença para julgar ADI"],["Maioria absoluta","declarar inconstitucionalidade · instalar sessões · lista tríplice (nos 3 escrutínios) · 1º escrutínio de direção (dos efetivos)"],["Maioria dos votantes","2º escrutínio de direção, computados brancos e nulos"],["Maioria simples","regra geral das deliberações · 2º escrutínio de cúpula · súmulas e enunciados · IRDR e IAC nas Turmas · acolher representação do art. 12"],["Voto de qualidade","presidente da sessão na aprovação de súmula e enunciado · presidente do CSM"]]}]},{"id":"s26","title":"23. Quem julga o quê — tabela comparativa","tag":"","b":[{"k":"tbl","rows":[["Matéria","Órgão competente","Base"]]},{"k":"tbl","rows":[["MS contra ato do OE, do CSM, das Turmas Especiais ou da Câmara Especial","Órgão Especial","13, I, b"],["MS contra ato de Câmara ou de seus relatores","Grupo de Câmaras","37, §1º"],["MS e HC contra juiz de 1ª instância ou membro do MP","Câmaras","233 / 247"],["Urgência: MS, HC e HD contra ato do Presidente ou do Corregedor, antes da distribuição","Vice-Presidente (despacha)","27, I, c"],["Incidente de inconstitucionalidade","Órgão Especial","13, I, d / 193"],["Conflito entre órgãos de Seções diversas","Órgão Especial","13, I, e"],["Conflito entre Câmaras e Grupos da mesma Seção (e com o Núcleo 4.0","Turma Especial","32, III / 200"],["Conflito entre órgãos de Seções diferentes","Órgão Especial","200"],["Enunciado / IRDR / IAC em matéria ambiental, tributos municipais, acidentes do trabalho, empresarial, família","Grupo especializado","32, §1º"],["Conflito de competência entre juízes e de atribuição","Câmara Especial","33 / 222"],["Infância e Juventude","Câmara Especial","33, IV"],["Recurso contra decisão originária do Corregedor em disciplinar de servidor, delegado ou oficial de justiça","Câmara Especial","33, V"],["Recurso contra decisão de juiz corregedor permanente (disciplinar de serventias)","Corregedor Geral","28, XIII e XXVI"],["Agravo interno contra negativa de seguimento ou sobrestamento de RE e REsp","Câmara Especial de Presidentes","33 · A"],["Revisão criminal","Grupo (cujas Câmaras não decidiram)","37"],["Rescisória de acórdão de Câmara","Grupo (o mesmo do acórdão)","37 / 235"],["Rescisória de acórdão do OE ou de Turma Especial","Órgão Especial","13, I, h"],["Desaforamento","Câmara Criminal","205"],["Exceção da verdade (excepto com foro no TJ","Órgão Especial","218"],["Dissídio coletivo de greve (julgamento)","Órgão Especial (conciliação: Vice)","13, I, l / 239 · 241"],["Dúvida de registro público","CSM","16, IV"],["Excesso de prazo: juiz / desembargador","CSM / Órgão Especial","184, II / 13, II, w"],["Súmulas","Órgão Especial (exclusivo)","190, §1º"],["Casos omissos do Regimento","Órgão Especial, ouvida a CRI","287"]]}]},{"id":"s27","title":"24. As 25 pegadinhas mais prováveis","tag":"","b":[{"k":"tbl","rows":[["#","A banca escreve · ERRADO","O Regimento diz · CERTO"],["1","O OE tem 25 membros, todos eleitos pelo Pleno","O Pleno elege 12; os demais vêm da antiguidade e há membros natos"],["2","O OE instala-se com 2/3 de seus membros","Com no mínimo 13 (maioria absoluta); 2/3 é a presença para julgar ADI"],["3","O CSM é presidido pelo Corregedor","Pelo Presidente do TJ; o Vice secretaria"]]},{"k":"tbl","rows":[["4","A Câmara Especial é presidida pelo Presidente do TJ","Pelo Vice-Presidente; a Câmara Especial de Presidentes é presidida pelo Presidente"],["5","A eleição é na 1ª quarta-feira de dezembro","2ª quarta-feira de novembro"],["6","Restando menos de 1 ano de mandato, não há eleição","Menos de 6 meses"],["7","Na falta do Presidente, assume o Corregedor","O Vice e, na falta, o Decano"],["8","A suspeição de juiz de 1º grau é julgada pelo OE","Pela Câmara Especial; a de desembargador vai ao OE; a de foro íntimo de juiz, ao CSM"],["9","A pauta é publicada com 48 h de antecedência","Pelo menos 5 dias antes; afixação com 15 minutos"],["10","O HC depende de inclusão em pauta","Independe de pauta (assim como desaforamento, conflitos e ED criminais)"],["11","Cabe sustentação oral em embargos de declaração","Não cabe (nem em suspeição, conflito, arquivamento de inquérito e agravo, salvo exceções)"],["12","Na sustentação, o MP sempre fala primeiro","O MP fala por último, se não for autor ou recorrente"],["13","O Presidente do TJ vota em todas as sessões que preside","Só em matéria constitucional, para desempate ou como relator nato"],["14","Empatado o agravo, prevalece a tese do agravante","Mantém-se a decisão agravada"],["15","A vista é de 30 dias","10 dias + até 10; 30 dias é o prazo do relator e do revisor"],["16","O agravo regimental tem efeito suspensivo e prazo de 5 dias","Sem efeito suspensivo, 15 dias"],["17","As súmulas podem ser editadas pelas Turmas Especiais","Exclusividade do OE; as Turmas aprovam enunciados"],["18","Alterar o Regimento exige maioria absoluta","2/3 dos integrantes do OE"],["19","Assento é ato do CSM","Do OE; o CSM expede provimentos e pareceres"],["20","O recesso vai de 20/12 a 6/01","De 20/12 a 20/01; até 6/01 é o plantão"],["21","A reclamação contra erro em ata suspende o prazo recursal","Não suspende; se acolhida, restituem-se os dias"],["22","Na rescisória, quem participou do julgado está impedido","Não está impedido, salvo para relator"],["23","A permuta entre juízes exige 2 anos na entrância","Mais de 1 ano"],["24","O Ouvidor é eleito pelo Pleno para 4 anos","Pelo OE, para 2 anos, com uma reeleição (limite de 4 consecutivos)"],["25","No OE, a distribuição alcança o Presidente","Exclui Presidente, Vice e Corregedor"]]}]}],"ns":[{"id":"s0","title":"0. Mapa do conteúdo e perfil da cobrança","tag":"","b":[{"k":"tbl","rows":[["Bloco","Artigos","Assuntos","Peso provável"],["Cap. II","5º a 18","Função correcional, corregedoria permanente, correições, visitas, estabelecimentos prisionais, procedimentos disciplinares","Alto"],["Cap. III · I a V","26 a 29 · 46 a 62","Atendimento prioritário, atribuições dos ofícios, sistema informatizado, cadastro e qualificação das partes","Médio"],["Cap. III · VI e VII","63 a 86","Livros, classificadores, escrituração e assinaturas","Altíssimo"],["Cap. III · VIII a XV","87 a 142","Autuação, juntada, movimentação, certidões, ofícios, e- mail, precatórias, intimações","Altíssimo"],["Cap. III · XVI a XIX","143 a 189 · G","Audiências, consulta e carga de autos, desentranhamento, arquivamento","Alto"],["Cap. XI","1.189 a 1.301","Processo eletrônico: peticionamento, indisponibilidade, consulta, tarjas, prazos, digitalização, cumprimento de sentença, precatórios","Alto"]]},{"k":"p","t":"COMO A VUNESP COBRA AS NSCGJ A banca copia o artigo e troca um elemento: o prazo · 5 · 10 · 15 · 30 · 45 dias), o responsável (escrivão × juiz corregedor permanente · Corregedor Geral), a modalidade (“é vedado” × “é facultado” × “será evitado”) ou a exceção (“salvo”, “ressalvado”). Estude as tabelas de prazos (seção 18 · e o quadro “vedado × evitado × facultado” (seção 6 · .","box":1}]},{"id":"s1","title":"1. Função correcional","tag":"","b":[{"k":"p","t":"Art. 5º A função correcional consiste na orientação, reorganização e fiscalização dos órgãos e serviços judiciários de primeira instância, bem como na fiscalização dos estabelecimentos prisionais e dos demais estabelecimentos atribuídos por lei ao Judiciário. É exercida, no Estado, pelo Corregedor Geral da Justiça e, nos limites de suas atribuições, pelos Juízes de Primeiro Grau."},{"k":"tbl","rows":[["Dispositivo","Regra"],["Art. 5º, §1º","Podem ser editadas ordens de serviço e atos de orientação e disciplina, corrigidos os erros e sancionadas as infrações APÓS regular procedimento administrativo disciplinar, sem prejuízo das apurações civis e criminais."],["Art. 5º, §2º","Os atos do Juiz Corregedor Permanente são encaminhados à CGJ para revisão hierárquica."],["Art. 5º, §3º","Consultas sobre a aplicação das NSCGJ são apreciadas pelo Juiz Corregedor Permanente, que submete suas decisões à CGJ (a requerimento, ou de ofício se houver dúvida fundada e justificada)."]]},{"k":"h","t":"As três formas de fiscalização (art. 6º)"},{"k":"tbl","rows":[["","Correição ORDINÁRIA","Correição EXTRAORDINÁRIA","VISITA correcional"],["Conceito","Fiscalização prevista e efetivada segundo as normas e as leis de organização judiciária","Fiscalização excepcional, a qualquer momento e sem prévio anúncio; pode ser geral ou parcial","Fiscalização direcionada: regularidade do funcionamento, saneamento de irregularidades de correições ou exame de algum aspecto dos serviços"]]},{"k":"tbl","rows":[["Periodicidade","1 vez por ano, de preferência em dezembro (art. 8º)","Quando necessário","Em até 30 dias após assumir em caráter definitivo (art. 9º)"],["Publicidade","Edital no átrio do fórum e no DJE com pelo menos 15 dias de antecedência, e comunicação à OAB da subseção","Sem prévio anúncio","Independe de edital ou de qualquer outra providência"],["Ata à CGJ","Até 60 dias após realizada","Até 15 dias após realizada",""]]},{"k":"p","t":"A CGJ implementará gradativamente a correição virtual,"},{"k":"h","t":"Corregedoria permanente (arts. 7º a 12)"},{"k":"p","t":"para o controle permanente das atividades (art. 6º, §5º)."},{"k":"tbl","rows":[["Tema","Regra"],["Quem exerce · 7º)","O juiz a quem a normatividade correcional atribuir. O Corregedor Geral, com aprovação do CSM, pode alterar a designação por interesse público ou conveniência da administração. Se não houver alteração no início do ano judiciário, prevalecem as designações do ano anterior."],["Correição ordinária · 8º)","Em todas as serventias, repartições e estabelecimentos sujeitos à fiscalização, com termo em livro próprio e uso do termo padrão da CGJ. É dispensada para os distritos policiais, mas prevalecem as inspeções mensais nos estabelecimentos penais · Res. CNJ 47/2007 · ."],["Visita ao assumir · 9º)","Em até 30 dias após assumir em caráter definitivo, com termo sucinto no livro de Visitas e Correições, onde constam também as determinações do juiz. Se assumir a partir de novembro, a correição geral ordinária prescinde da visita."],["Auxílio · 10/11","O escrivão auxilia o juiz, facultada a nomeação de escrivão ad hoc entre os servidores da unidade. Todos os funcionários ficam à disposição do Corregedor Geral, dos Juízes Assessores da CGJ ou do Juiz Corregedor Permanente, sem prejuízo de requisitar auxílio externo ou força policial."],["Visto em livros · 12","Os livros e classificadores obrigatórios recebem visto do juiz nas correições e sempre que requisitados. Nos registros eletrônicos, o juiz visa os relatórios de pendências."]]},{"k":"h","t":"Estabelecimentos prisionais (arts. 13 e 14)"},{"k":"tbl","rows":[["Regra","Conteúdo"],["Frequência","1 vez por mês (art. 66, VII, da LEP)"],["Quem visita","O Juiz Corregedor Permanente ou o juiz a quem o Corregedor Geral delegar"],["Registro","Termo sucinto no Livro de Visitas e Correições, que pode conter só o registro da presença, sem prejuízo do cadastro eletrônico no CNJ. Cópia vai à autoridade da unidade prisional, para arquivamento em livro de folhas soltas."],["Pessoalidade","O Juiz Corregedor Permanente faz as visitas pessoalmente, ressalvados o afastamento por prazo igual ou superior a 30 dias ou motivo relevante comunicado à CGJ. É vedado atribuí- las a juiz que responda pela vara por período inferior a 30 dias."],["Cadeias públicas · 14","Essa sistemática não desobriga a visita mensal às Cadeias Públicas, a cargo dos juízes de Varas Privativas de Execuções Criminais e dos que acumulam serviços anexos."]]},{"k":"p","t":"MACETE — “60 ORDENA, 15 EXTRAORDINA” A ata da correição ordinária vai à CGJ em até 60 dias; a da extraordinária e a da visita, em até 15. “15 antes, 30 depois”: o edital da correição ordinária sai com 15 dias de antecedência; a visita ao assumir ocorre em até 30 dias depois. Prisão: “uma vez por mês, pessoalmente”.","box":1},{"k":"p","t":"PEGADINHAS DO CAP. II · A correição ordinária é de preferência em dezembro, e não obrigatoriamente. · Quem altera a designação do corregedor permanente é o Corregedor Geral, com aprovação do CSM (não o Presidente do TJ nem o Órgão Especial). · A visita correcional independe de edital; a correição ordinária exige edital e comunicação à OAB. · Os distritos policiais estão dispensados da correição ordinária anual; os estabelecimentos penais continuam com a inspeção mensal.","box":1}]},{"id":"s2","title":"2. Procedimentos disciplinares","tag":"","b":[{"k":"tbl","rows":[["Procedimento","Quando","Resultado ou penas"],["Apuração preliminar","A infração não está suficientemente caracterizada ou a autoria não está definida","Arquivamento, ou instauração de sindicância ou processo administrativo"],["Sindicância","A falta pode levar a penas mais leves","Repreensão, suspensão ou multa"],["Processo administrativo","A falta pode levar a penas graves","Demissão ou dispensa, demissão ou dispensa a bem do serviço público, cassação de aposentadoria"]]},{"k":"tbl","rows":[["Regra","Conteúdo"],["Formato e competência","Tramitam em formato digital, instaurados e processados pelo Juiz Corregedor Permanente a que o servidor estiver subordinado na atualidade do procedimento."],["Instauração (§1º)","Por PORTARIA, dispensado o registro em livro, com a descrição dos fatos e a identificação do servidor (nome, matrícula, cargo e posto), exceto na apuração preliminar sem autoria definida."],["Distribuição (§§2º e 3º)","O juiz envia ofício de comunicação ao distribuidor, por e-mail institucional em PDF, com os dados do servidor e a classe processual. O distribuidor cadastra com distribuição por direcionamento. O segredo de justiça é gerado automaticamente."],["Reclamação física (§4º)","As peças são digitalizadas e o reclamante tem 45 dias para retirá-las, sob pena de inutilização; é vedado o peticionamento eletrônico inicial."],["Avocação (§5º)","O Corregedor Geral pode avocar em qualquer fase ou instaurar originariamente, designar Juiz Corregedor Processante e atribuir serviços auxiliares a outra unidade."],["Prazos (§6º)","Contados em dias corridos e suspensos de 20 de dezembro a 20 de janeiro."],["Comunicação à CGJ · 16","Por mensagem eletrônica, o juiz comunica a instauração, a decisão final e as medidas cautelares impostas ou revogadas, para acompanhamento pela DICOGE. O que afetar a folha funcional (afastamentos e punições) é informado ao RH."],["Mudança de posto · 16 · A","O procedimento é redistribuído ao novo juiz corregedor: por fila própria, mantido o número, se o destino for unidade dos incisos I, II e VI do Prov. CSM 2.460/2017; ou materializado e impresso, com carga ao distribuidor, se for Diretoria de Fórum ou DARAJ (incisos III, IV e V · ."],["Recursos · 17","Interpostos eletronicamente; mantida ou reformada parcialmente a decisão, sobem à CGJ. Proposta de demissão, dispensa ou cassação: os autos sempre vão à CGJ, haja ou não recurso."],["Poder da CGJ · 18","O Corregedor Geral pode aplicar originariamente as sanções e, enquanto não prescrita a infração, reexaminar, de ofício ou por provocação, decisões absolutórias ou de arquivamento."]]},{"k":"p","t":"MACETE — “SINDICÂNCIA É SUSPENSÃO; PAD É Sindicância → repreensão, Suspensão, multa. Processo dúvida sobre os fatos ou a autoria, apuração preliminar.","box":1},{"k":"p","t":"DEMISSÃO” Administrativo → Demissão, dispensa, cassação. Na Todos começam por portaria."}]},{"id":"s3","title":"3. Ofícios de justiça: disposições iniciais e atribuições","tag":"","b":[{"k":"p","t":"Atendimento prioritário (art. 27 · Atribuições (arts. 26, 28 e 29 · Para quem: pessoas com deficiência · idosos · · As regras do capítulo têm caráter geral e valem gestantes · lactantes · pessoas com crianças de para todos os ofícios, salvo disposição específica. colo. · Os ofícios recebem os serviços da competência das Como: lugar privilegiado em filas · senhas com varas e da corregedoria permanente. numeração própria · espaço exclusivo no balcão · ou · Comarca com mais de 1 vara: há ofício ou seção de qualquer outro sistema que assegure a prioridade. distribuição, que cuida da distribuição, da partidoria e do arquivo geral. Art. 27 · A · a prioridade alcança advogadas públicas e · Comarca com 1 vara e 1 ofício: este acumula privadas, promotoras e procuradoras do MP distribuição e partidoria. gestantes ou lactantes e qualquer pessoa com · Onde houver mais de 1, os ofícios recebem criança de colo, inclusive na preferência em numeração ordinal e a denominação da vara. audiências de 1º grau e em sessões dos Colégios Recursais, desde que haja requerimento prévio, pela ordem dos requerimentos · Lei 10.048/2000 · .)"}]},{"id":"s4","title":"4. Sistema informatizado oficial","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Finalidade · 46","O registro destina-se à preservação da memória dos dados e ao controle dos processos: segurança, pronta localização física, andamento, estatísticas e aprimoramento."],["Adaptação · 47","Os servidores devem adaptar-se continuamente às evoluções do sistema. Para a divisão do trabalho, cada processo recebe um número de controle interno, sem prejuízo do número do processo (série única)."],["SAJ/PG · 48","Uso obrigatório; iniciada a operação, excluem-se os demais programas."],["Segurança · 49 a 51","Níveis de acesso e senhas fixados em expediente interno pela CGJ, com a STI. É vedado ceder a senha. O escrivão comunica prontamente à STI as alterações no quadro. Os dados alterados ou excluídos são conservados e vinculados ao usuário. O escrivão faz auditoria semanal e comunica irregularidades à CGJ."],["Cadastro · 52/53","Distribuidores e ofícios cadastram os feitos, anotam a movimentação e os serviços administrativos. A inserção deve ser a mais completa possível e formar memória permanente; as anotações devem ser fidedignas, claras e atualizadas. Antes de arquivar, confere-se o cadastro para permitir certidão."],["Partes · 54, §§1º e 2º)","Cadastram-se todos os litisconsortes, intervenientes e terceiros, com seus representantes. Não se exclui parte: faz-se a baixa."]]},{"k":"h","t":"Qualificação das partes (art. 55)"},{"k":"tbl","rows":[["Cíveis e autores de ação penal privada (pessoa natural)","Acusados em ação penal pública ou privada (pessoa natural)"],["Nome completo · CPF · nacionalidade · estado civil · profissão · endereço completo com CEP","Nome completo · filiação · data de nascimento · nacionalidade · naturalidade · sexo · cor · estado civil · profissão · endereço da residência e do trabalho com CEP · CPF (se houver) · RG · RGC · Registro Geral Criminal) · outros nomes e alcunhas"],["Pessoa jurídica (ambos): firma ou denominação · CNPJ · endereço da sede com CEP. Outros dados úteis · RG, título de eleitor, nome da mãe) também são lançados. O cadastro dos dados da petição inicial cabe aos distribuidores e ofícios.",""]]},{"k":"tbl","rows":[["Art. 56","Regra"],["Quem informa","O requerente, na petição inicial; o requerido, na primeira oportunidade em que postular (contestação, procuração, vista, defesa preliminar, pedido de revogação de preventiva etc.)."],["Dispensa","· I · quando as exigências comprometerem o acesso à Justiça, a critério do juiz; · II · quando a parte não tiver CPF ou CNPJ, com declaração expressa. Mesmo assim, deve fornecer outros dados de individualização."],["Vítimas e testemunhas","Também são qualificadas, salvo quando, alegando coação ou grave ameaça e com deferimento do juiz, pedirem para não ser identificadas."]]},{"k":"tbl","rows":[["Tema","Regra"],["Fichas · 57","O controle é exclusivamente pelo sistema; são vedados o fichário por nome de autor e as fichas individuais. As fichas antigas podem ser inutilizadas se todos os dados estiverem no sistema; o procedimento corre sob a responsabilidade do Juiz Corregedor Permanente."],["Precatórias · 58","Cadastro com a indicação completa do juízo deprecante, e não apenas a comarca, as partes, a natureza e a diligência."],["Extinção · 59","É cadastrada pelo ofício assim que transitar em julgado quando houver: improcedência total, acolhimento da impugnação do devedor, estabilização da tutela (art. 304 do CPC · ou procedência dos embargos do devedor. No mais, só quando nada restar a deliberar ou cumprir.)"],["Entrega definitiva · 60","Na notificação, interpelação, protesto e produção antecipada de prova (físicos). Na produção antecipada, os autos ficam 1 mês em cartório para cópias e certidões."],["Compete ao ofício · 61","Cadastrar dados novos ou retificados após a distribuição; na certidão de homonímia, inserir os dados faltantes e certificar; cadastrar segredo de justiça, justiça gratuita, tramitação prioritária e outros benefícios; ajustar o rito por determinação judicial. O segredo também pode ser gerado automaticamente."],["Retificação · 62","A retificação dos dados da parte não se aplica aos feitos de outro juízo."]]}]},{"id":"s5","title":"5. Livros e classificadores obrigatórios","tag":"","b":[{"k":"tbl","rows":[["Os ofícios POSSUIRÃO (art. 63)"],["I · Visitas e Correições"],["II · Protocolo de Autos e Papéis em Geral"],["III · revogado"],["IV · Registro de Feitos Administrativos (sindicâncias, procedimentos disciplinares, representações)"],["V · Registro das decisões terminativas em feitos administrativos"],["VI · os pertinentes à Corregedoria Permanente (art. 23 · , quando for o caso)"]]},{"k":"tbl","rows":[["MANTERÃO TAMBÉM, se for o caso (art. 64)"],["I · Cargas de Mandados, salvo se a vara for atendida pela Seção de Distribuição de Mandados"],["II · Controle de remessa e recebimento aos Tribunais (folhas soltas), até haver controle eletrônico"],["III · Ponto (livro ou relógio), caso haja servidor fora do ponto biométrico"],["IV · Registro Geral de Feitos, se não integrados ao sistema"],["V · Registro de Sentença, salvo se cadastrada no sistema com assinatura digital"]]},{"k":"p","t":"PEGADINHA — LIVRO TOMBO O Livro Tombo (bens do Estado no fórum) e o de Registro de Portarias e Ordens de Serviço são da Administração Geral do Fórum (art. 23 · , não dos ofícios de justiça em geral. O antigo livro de Cargas de Autos do ofício foi revogado (art. 63, III · .)","box":1},{"k":"tbl","rows":[["Livro","Regras"],["Regra geral · 65/66","Nos ofícios integrados, a remessa e o recebimento de feitos e petições são registrados só eletronicamente. Os livros são abertos, numerados, autenticados e encerrados pelo ESCRIVÃO, na mesma oportunidade; admite-se autenticação mecânica aprovada pelo juiz. É vedada a substituição de folhas. As folhas soltas completas vão imediatamente para encadernação."],["Visitas e Correições · 67","Livro eletrônico, formado pelo expediente administrativo digital, com as atas no padrão da CGJ, assinadas pelo Juiz Corregedor Permanente, pelo Escrivão e pelos demais servidores · Prov. CG 31/2025 · . O livro físico é encerrado por certidão do escrivão e mantido para consulta. Faculta-se digitalizar o físico; feito isso, o suporte físico fica 2 anos na unidade e pode ser inutilizado com descarte seguro. Trocado o corregedor, o expediente é redistribuído por direcionamento."],["Protocolo · 68/69","Registra entrega ou remessa que não implique devolução; excepcionalmente, as cargas na indisponibilidade do sistema. As cargas internas são eletrônicas. Para usuários externos · MP, Defensoria, Procuradorias), a carga tem recebimento automático e o relatório é impresso em 2 vias. O juiz pode indicar servidor para receber as cargas de autos conclusos."],["Carga de Mandados · 70/71","Pode ser desdobrado em um livro por oficial de justiça. Registram-se também as petições que, por despacho, sirvam de mandado. As baixas são feitas na restituição, na presença do interessado sempre que possível ou se ele exigir."],["Registro de Sentenças · 72","Formado por vias numeradas em série anual renovável · 1/80, 2/80…), autenticadas pelo escrivão. Registro em até 5 dias após a baixa dos autos pelo juiz. A decisão de ED e a que liquida sentença condenatória cível são averbadas; a que liquida outros títulos (ex.: sentença penal) é registrada. O registro é certificado na última folha da sentença. Sentença com assinatura digital dispensa registro, livro e certidão. Registra-se como sentença a extinção por estabilização da tutela (art. 304 do CPC · .)"],["Conservação · 73/74","O juiz corregedor coíbe abusos. Desaparecimento ou dano de livro é comunicado imediatamente ao juiz, com restauração sob sua supervisão. Os livros de cargas de autos e de mandados podem ser inutilizados após 2 anos do último registro, com prévia autorização do juiz arquivada em classificador próprio."]]},{"k":"h","t":"Classificadores (arts. 75 a 79)"},{"k":"tbl","rows":[["Inc.","Classificador","Regra especial"],["I","Atos normativos e decisões da Corregedoria Permanente, com índice por assunto","Atos do CSM e da CGJ · arquivados e indexados no sistema, facultados classificadores próprios · 76"],["II","Cópias de ofícios expedidos","Só os que não se referem a feito do ofício, em ordem cronológica, com numeração sequencial renovável anualmente; conservação de 1 ano"],["III","Ofícios recebidos","Conservação de 1 ano"],["IV","GRD (guias de recolhimento de diligências do oficial de justiça)","Conservação mínima de 2 anos do arquivamento"],["VII","Relatórios de cargas eletrônicas","—"],["VIII","Petições e documentos desentranhados e petições não passíveis de juntada","Ver art. 175 (edital após 11 meses)"],["IX","Autorizações e certidões de inutilização de livros e classificadores","—"]]},{"k":"p","t":"Os incisos V e VI do art. 75 foram revogados. Decorrido o prazo de conservação, os papéis sem utilidade são inutilizados com autorização do Juiz Corregedor Permanente (art. 78, p.ú., e art. 74, §2º)."},{"k":"p","t":"MACETE — “OFÍCIO VIVE 1 ANO; GRD E CARGA VIVEM 2” Ofícios expedidos e recebidos: 1 ano. GRD do oficial e livros de carga de autos e de mandados: 2 anos. Livro físico de Visitas e Correições digitalizado: 2 anos.","box":1}]},{"id":"s6","title":"6. Escrituração","tag":"","b":[{"k":"tbl","rows":[["REQUISITOS (art. 80)","SERÃO EVITADAS (art. 81)","É VEDADO (art. 82)"],["• papel de fundo inteiramente branco ou reciclado • em vernáculo, preferencialmente por meio eletrônico, tinta preta ou azul, indelével • numerais em algarismos e por extenso • espaços em branco inutilizados • assinaturas colhidas logo após o ato, com o nome por extenso","• entrelinhas, erros de digitação, omissões, emendas, rasuras, borrões → ressalva antes da subscrição, legível e autenticada • “sem efeito” → quando necessário, datado e assinado • anotações a lápis, mesmo provisórias","• borracha, raspagem, corretivo, detergente ou outro meio químico • assinar atos em branco, total ou parcialmente • abreviaturas, siglas, símbolos (salvo as consagradas pelo VOLP/ABL, as oficiais e as de uma área do conhecimento) • chancela ou reprodução mecânica da assinatura do juiz"]]},{"k":"p","t":"PEGADINHA — EVITAR × VEDAR Rasura, entrelinha, “sem efeito” e lápis são práticas a evitar (art. 81 · . Borracha, corretivo, assinatura em branco, abreviatura e chancela são vedadas (art. 82 · . A VUNESP costuma trocar um verbo pelo outro. Também é vedado (art. 96 · lançar cotas marginais ou interlineares, sublinhar a tinta ou a lápis e usar expressões injuriosas; o servidor que notar comunica imediatamente ao juiz.)","box":1},{"k":"tbl","rows":[["Tema","Regra"],["Critérios · 83","Clareza, objetividade e síntese. Pessoa física: nome e CPF, ou RG, ou, faltando o RG, a filiação. Pessoa jurídica: firma, CNPJ e sede. Ofícios e precatórias expedidas: comarca, vara, endereço completo do fórum com CEP, telefone e e- mail institucional."],["Identificação · 84","Ordens, requisições, precatórias, ofícios, autorizações, sentenças, decisões e despachos trazem de forma legível o nome completo e o cargo da autoridade e dos servidores."]]},{"k":"tbl","rows":[["Certificação de firma · 84, §1º)","O escrivão certifica a autenticidade da firma do juiz em alvarás de soltura, mandados e contramandados de prisão, requisições de preso e demais casos legais, ou se houver dúvida. Com assinatura digital, a certificação é dispensada."],["Assinatura do escrivão · 85","Mandados, cartas postais e ofícios gerais de comunicação são assinados pelo escrivão, “por ordem do juiz”, salvo determinação em contrário. As cartas postais, inclusive eletrônicas, dispensam a assinatura do escrivão se trouxerem nome e cargo do emitente, não houver ordem contrária e não for caso do §1º."],["Assinatura obrigatória do juiz · 85, §1º)","· I · quando a lei ou as Normas exigirem: busca e apreensão cautelar, prisão, contramandado, alvará de soltura, alvarás em geral, levantamento de depósito, ordem de arrombamento; · II · desconto de pensão alimentícia; · III · papéis dirigidos a autoridades: membros do Judiciário, do MP e do Legislativo, Chefe do Executivo, Delegados, Comandantes da PM e das Forças Armadas."],["Meio eletrônico · 86","As regras valem, no que couber, para cadastro, movimentação e expedição de documentos no sistema."]]}]},{"id":"s7","title":"7. Autuação, juntada e movimentação dos autos","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Autuação · 87","Em 24 horas do recebimento da inicial ou da denúncia, com a etiqueta do distribuidor. É dispensada a certidão de autuação e registro."],["Tarjas · 88","Coloridas, na posição horizontal, para situações especiais."],["Volumes · 89","No máximo 200 folhas por volume, salvo ordem judicial ou para manter uma peça com seus anexos. Encerramento e abertura certificados; a numeração continua no volume seguinte."],["Peça inaugural · 90","Quando há procedimento preparatório (inquérito, IC etc.), a inicial ou denúncia tem numeração própria com a letra “i” · 1-i, 2-i…), aproveitando a numeração anterior."],["Numeração · 91","Erro: certifica-se, vedada a renumeração. Numeração repetida: acrescenta-se uma letra · 188-a, 188-b), certificando-se."],["Recebimento de petições · 92","É vedado receber e juntar petições não vindas do protocolo, salvo: · I · juntada de procuração ou substabelecimento entregue diretamente (o termo menciona isso); (II · decisão fundamentada do juiz no caso concreto."],["Termo de juntada · 93","Um único termo para várias peças juntadas na mesma oportunidade. É vedado lançar o termo na própria petição. Fax ou e-mail recebido diretamente: lança-se número de protocolo no documento (originais em até 5 dias, Lei 9.800/99 · . Objetos impossíveis de juntar: o escrivão confere, arrola e quantifica, certifica e guarda até o fim da demanda."],["Certificação · 94","Todos os atos são certificados e anotados no sistema, dispensada a certificação de documento que já passa a integrar os autos (ofício expedido, mandado), rubricado pelo emitente."],["Verso · 95","É vedado lançar termos no verso de petições, documentos e guias, ressalvada a certidão de publicação no DJE quando não houver espaço ao pé (art. 140 · .)"]]},{"k":"tbl","rows":[["Movimentação · 97 a 99","Regra"],["Prazos","Conclusão em 1 dia e execução dos atos em 5 dias."],["Ordem cronológica","Os juízes seguem, preferencialmente, a ordem cronológica de conclusão para sentença ou acórdão. O escrivão segue, preferencialmente, a ordem de recebimento para publicação e efetivação. Processos físicos “Conclusos para Sentença” contam para o art. 12 do CPC."],["Termos","Trazem a data do efetivo encaminhamento e os nomes por extenso. São vedados termos de conclusão ou vista sem data e a permanência dos autos em cartório depois de assinados os termos. Nenhum processo vai com vista a promotor ou advogado sem assinatura no relatório de carga. A conclusão é feita diariamente, sem limitação de número; a carga só é lançada para os autos não despachados até o fim do expediente. Se o juiz recusar-se a assinar, consigna-se no assentamento."],["Paralisação · 99","Nenhum processo fica parado além dos prazos ou sem andamento por mais de 30 dias à espera de diligência. Passado esse prazo, o ofício reitera uma única vez; sem atendimento, abre conclusão ao juiz."]]},{"k":"p","t":"MACETE — “1 CONCLUI, 5 EXECUTA, 30 REITERA” Conclusão em 1 dia · cumprimento em 5 dias · diligência parada há 30 dias → reitera uma vez → conclusão. Autuação: “24 horas”. Volume: “200 folhas”.","box":1}]},{"id":"s8","title":"8. Papéis, certidões, ofícios e comunicações eletrônicas","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"]]},{"k":"tbl","rows":[["Papéis · 103","Bem conservados; o descarte segue o art. 74, §2º · 2 anos e autorização do juiz)."],["Certidões · 104","Competem exclusivamente aos ofícios de justiça, de preferência com base no sistema, com a fé pública do escrivão. Prazo de 5 dias do recebimento do pedido, com protocolo ao interessado. Pedido de certidão de objeto e pé por e-mail entre ofícios: 5 dias úteis. Se for preciso requisitar autos do Arquivo Geral, o prazo conta do recebimento do feito. Em segredo de justiça, depende de despacho do juiz, salvo se pedida pela parte ou procurador habilitado · Prov. CG 41/2024 · ."],["Certidão para protesto · 104 · A","A requerimento escrito do credor, sobre decisão transitada em julgado de pagar quantia ou alimentos. Contém os dados de credor e devedor, o processo, o valor e a data em que decorreu o prazo de pagamento voluntário. Expedida em 3 dias; o protesto corre sob responsabilidade do credor. Comprovada a satisfação, o executado pede o cancelamento e o juiz expede ofício em 3 dias. Monitória convertida: conteúdo do mandado, trânsito e prazo do art. 523 do CPC."],["Mandados · 105","Seguem o Capítulo VII (oficiais de justiça). Mandados de prisão e alvarás de soltura seguem a Seção XII do Capítulo IV. Arts. 106 a 110 revogados."],["Ofícios · 111","Os de processo levam data, número dos autos e partes, sem numeração cronológica, com cópia só nos autos. Os que não se referem a feito do ofício são numerados em série renovável anualmente, com cópia no classificador."],["Meio eletrônico · 112 a 114","Comunicações entre ofícios são eletrônicas, salvo indisponibilidade. Transmitem-se assim: informações à 2ª instância, ofícios, comunicações, solicitações, certidões de objeto e pé, criminais e de distribuição, e precatórias urgentes. Podem transmitir: dirigente, escrivão, chefe de seção e escrevente."]]},{"k":"tbl","rows":[["Quem ENVIA deve (art. 115)"],["• usar o e-mail institucional próprio, não o da unidade • “para”: unidade destinatária; “assunto”: número do processo e a hipótese do art. 113 • no corpo: dados do processo e e-mail da sua unidade • juntar cópia da mensagem (dispensados anexos que já são peças) • anexos em PDF sem restrição • marcar confirmação de entrega e de leitura • assinar com certificado digital • imprimir e juntar os comprovantes • lançar o envio no sistema"]]},{"k":"tbl","rows":[["Quem RECEBE deve (arts. 116 a 121)"],["• expedir as confirmações, que valem como protocolo • imprimir mensagem e anexos para juntada ou classificador • lançar o recebimento no sistema • fazer a conclusão no prazo legal, se couber ao juiz • encaminhar ao e-mail do juiz ou do servidor que responde • a resposta também é eletrônica, para a unidade remetente • sem confirmação, presume-se recebida e lida no 1º dia útil seguinte • urgência sem confirmação até o dia seguinte: telefonar, reenviar e certificar • sem certificado digital: materializa, colhe assinatura, digitaliza e envia • cumpridas as providências, as mensagens são deletadas"]]},{"k":"p","t":"Infojud · 121 · A a 121 · C · · as informações da Receita sobre pelo Infojud, por magistrados ou servidores indicados, com processo físico, vão ao andamento digital com “sigilo do defensores, promotores e conveniados habilitados. As que de segredo."}]},{"id":"s9","title":"9. Cartas precatórias, rogatórias e arbitrais","tag":"","b":[{"k":"p","t":"endereço ou situação econômico-financeira são obtidas certificado digital ICP · Brasil A3. As sigilosas, em documento”, acessível aos advogados das partes, tratam só de endereço são juntadas sem necessidade"},{"k":"tbl","rows":[["Tema","Regra"],["Forma · 122","3 vias, uma servindo de contrafé. A taxa judiciária do cumprimento é comprovada até a distribuição, com a 1ª via do comprovante. Para citação, vão tantas cópias da inicial quantas forem as pessoas a citar."]]},{"k":"tbl","rows":[["Cumprimento remoto · 122, §3º)","Se a ordem puder ser cumprida remotamente, não se depreca, salvo, com fundamentação: (a) sem data na Estação Passiva em 30 dias (réu preso ou menor internado) ou 90 dias (demais casos); (b) hipótese do art. 1.029, III; (c) ato presencial necessário para viabilizar ato remoto (ex.: intimar presencialmente testemunha que será ouvida por vídeo), salvo onde houver compartilhamento de mandados; (d) pessoas com dados protegidos · Prov. CG 32/2000 · ."],["Depoimento especial · 122, §4º)","Vítima fora da comarca: em regra, depreca-se a tomada pela equipe técnica do local de residência, com o ato presidido pelo Juízo Deprecante. É vedado deprecar só a entrevista prévia (violência institucional). Excepcionalmente, com fundamentação, o depoimento pode ser no juízo do processo."],["Juízo deprecado · 123/124","Se o ato couber a outra jurisdição, deve encaminhar ao juízo competente e comunicar o deprecante. Devolve a carta sem cumprimento se ela não estiver instruída e não for regularizada no prazo."],["Processamento · 125 a 129","As precatórias não são autuadas; os encartes do deprecante servem de capa, com a etiqueta do distribuidor. Sempre que possível, servem como mandado. Sem resposta, o deprecante reitera e telefona; persistindo a inércia, faz conclusão. É permitido retirar a carta cumprida se nela constar o nome e a OAB do advogado interessado. Na devolução, juntam-se só as peças essenciais."],["Urgência · 130","Fax, telegrama, telefone, radiograma ou e-mail, com as cautelas dos arts. 264 e 265 do CPC e 354 e 356 do CPP. A via original não vai ao deprecado: é encartada aos autos com a certidão de transmissão."],["Rogatórias · 131","Seguem os modelos e formulários da CGJ no site do TJ. Em processo eletrônico, são assinadas eletronicamente e depois impressas para carimbo e assinatura física do juiz (art. 1.194, p.ú.)."]]}]},{"id":"s10","title":"10. Intimações","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Meio · 132","Sempre que possível, por meio eletrônico e publicação no DJE. É vedado ao servidor dar informações por telefone sobre atos do processo a advogados, MP, partes e público."],["Prazo · 133","Despachos, decisões e sentenças vão à publicação em no máximo 3 dias da devolução dos autos; o mesmo prazo vale para a intimação eletrônica."],["Conteúdo · 134","Número dos autos, objeto (tabela vigente) e nome das partes; resumo ou transcrição suficiente; nome dos advogados com o número na OAB."],["Imprensa · 135","Com vários advogados, consta qualquer subscritor da inicial, da contestação ou da 1ª intervenção, salvo se a parte indicar outro, no máximo 2 nomes, ou a sociedade de advogados. Decisões interlocutórias e sentenças: só a parte dispositiva. Atos ordinatórios e despachos: transcritos ou resumidos. Em procedimento disciplinar ou processo de dúvida, só o dispositivo; o Corregedor Geral pode mandar publicar a íntegra após o trânsito."],["Nulidade e erro · 136/137","A publicação omissa que cause efetivo prejuízo é nula. Erro ou omissão: retifica-se e republica-se imediatamente, independentemente de despacho ou reclamação."],["Segredo · 138","É vedado o nome completo das partes: nas decisões, sentenças e publicações no DJEN constam apenas as iniciais · Prov. CG 46/2025 · ."],["Valores · 139","Publicam-se com as intimações o valor da taxa judiciária e das importâncias a depositar; intimações sobre cálculos trazem os valores em resumo."],["Comprovação · 140","Pela certidão automática do sistema; na impossibilidade, certidão ao pé da folha ou no verso. As publicações do DJE se provam por certidão, sem juntar o exemplar."],["Edital · 141","Folhas autenticadas com a chancela do ofício e rubricadas pelo escrivão. Publicação no DJE, na internet, no site do TJ ou na plataforma do CNJ · prova por certidão. Em jornal local, providenciada pela parte e provada pelo exemplar original. A minuta pode ser entregue, mediante recibo, a estagiário ou advogado com procuração. Em segredo: nome completo do réu e só o indispensável, com os nomes das demais partes abreviados."],["Controle · 142","O escrivão confere diariamente as publicações e intimações por carta, sem prejuízo da fiscalização do juiz corregedor."]]},{"k":"p","t":"PEGADINHA — SEGREDO DE JUSTIÇA E EDITAL Na publicação, em processo sigiloso, usam-se só as iniciais das partes (art. 138 · . No edital de citação em segredo, porém, vai o nome completo do réu; os nomes das demais partes é que são abreviados (art. 141, p.ú.).","box":1}]},{"id":"s11","title":"11. Audiências","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Designação · 143","Atribuição exclusiva e indelegável do juiz, salvo nos juizados especiais."],["Adiamento · 144","A nova data é marcada no próprio termo, com ciência imediata dos presentes. Acordos, desistências e pedidos de suspensão podem ser resolvidos sem esperar a audiência, aproveitando-se a data para outro ato."],["Termos · 145/146","Lavrados sob ditado do juiz; rubricados em todas as folhas pelo juiz; subscritos pelo juiz, advogados, MP e escrevente; juntados no original. Contêm, em resumo, tudo o que ocorreu e, por extenso, os despachos e a sentença proferida no ato."],["Depoentes · 147","Nome, filiação, nacionalidade, data e local de nascimento, estado civil, profissão, endereços residencial e profissional, RG ou outro documento."]]},{"k":"tbl","rows":[["Conferência prévia · 148","O servidor examina os processos 10 dias antes da audiência; se houver falha, comunica imediatamente o responsável."],["Gravação · 149/149 · A","Faculta-se gravação magnética, estenotipia, digital ou audiovisual; anota-se no termo e as qualificações são lançadas por escrito e repetidas na gravação. A parte que for gravar (art. 367, §6º, do CPC · comunica o juiz antes; para usar a gravação, ela mesma faz a transcrição integral, e a outra parte tem 5 dias para se manifestar.)"],["Sistema oficial · 150 a 156","As audiências são gravadas no sistema oficial e armazenadas em nuvem · Prov. CG 18/2025 · . Depoimentos audiovisuais não são transcritos, salvo se houver recurso e for impossível enviar a mídia. O registro fica armazenado até o fim do prazo da ação rescisória (cível) ou a extinção da pena (penal). A parte pode receber cópia do termo e da gravação. A STI mantém as orientações técnicas."],["Estações passivas · 156 · A","É vedado deprecar oitivas presenciais ou remotas para outras comarcas do Estado (salvo as exceções do art. 122, §3º). O domicílio do depoente define a Estação Passiva; a unidade agenda direto na agenda dela e intima por ato ordinatório. Nas hipóteses do art. 455, §4º, do CPC, depreca-se apenas a intimação."]]}]},{"id":"s12","title":"12. Consulta e carga dos autos","tag":"","b":[{"k":"tbl","rows":[["Situação","Regra"],["Consulta no balcão · 157","Autos sem segredo: qualquer pessoa (advogado, estagiário, público), mesmo sem procuração, pode examinar, anotar, pedir cópias e usar escâner ou câmera, vedado desencartar peças. O escrivão mantém rigorosa vigilância."],["Retirada para cópia sem procuração · 158","Advogado ou estagiário inscrito na OAB, não constituído: 1 hora, com consulta ao site da OAB e impressão dos dados. Vale também para pessoa credenciada (art. 272, §7º, do CPC · , com documento de identidade.)"],["Casos complexos · 159","Pode-se tirar cópia integral do feito, que fica à disposição dos interessados."],["Segredo de justiça · 160","Exame só pelas partes e procuradores constituídos. Entidades de assistência judiciária, por advogado com procuração, podem autorizar a consulta por acadêmicos não inscritos na OAB (autorização com nome, RG e processo). É vedado o acesso de estagiário não inscrito ou com inscrição vencida."],["Carga · 161","Reservada a advogados e estagiários inscritos e constituídos, ressalvada a carga por advogado sem procuração em processo findo e sem segredo, por 10 dias. A carga por credenciado, Advocacia Pública, Defensoria ou MP implica intimação de qualquer decisão no processo, ainda que não publicada."],["Registro · 162","Pelo sistema e pelo relatório de carga, que o retirante assina; na devolução, dá-se baixa e junta-se o relatório. Sem sistema, usa-se o Livro Protocolo. Consta o número da OAB ou do RG do credenciado. A baixa é imediata, à vista do interessado, que pode pedir recibo (um por processo, sem atestar a regularidade interna)."],["Prepostos · 163","Advogados, sociedades, Fazenda, MP e Defensoria indicam prepostos por petição ao Juiz Corregedor Permanente, com nomes, RG, CPF e funcional. A carga sai em nome de quem autorizou. Alterações são comunicadas imediatamente."],["Prazo correndo · 164","Sem prazo em curso: carga só por requerimento. Com prazo correndo: os autos não saem, salvo previsão legal (cópias urgentes com autorização judicial). Prazo comum: retirada em conjunto ou por ajuste em petição, salvo para cópias, de 2 a 6 horas, independentemente de ajuste."]]},{"k":"tbl","rows":[["Carga rápida · 165","1 hora, concedida pelo escrivão ou escrevente, com formulário. Pedidos aceitos até 1 hora antes do fim do expediente. O formulário é juntado na devolução. Se os autos não voltarem, o escrivão representa ao juiz em 24 horas, inclusive para providências na OAB."],["Documento · 166","É VEDADA a retenção do documento de identificação do advogado ou estagiário, em qualquer caso."],["Não devolução · 167","Intimado pessoalmente, o advogado que não devolver em 3 dias perde o direito de vista fora do cartório e paga multa de meio salário mínimo; o juiz comunica a OAB. O expediente de cobrança tem autuação singela, sem registro, e instrui eventual restauração de autos."],["Controle · 168","Até o 10º dia útil do mês seguinte, o escrivão relaciona em 2 vias os autos fora do prazo: a 1ª vai como representação ao juiz e a 2ª fica arquivada."]]},{"k":"p","t":"MACETE — AS HORAS DA CARGA 1 hora: carga rápida e retirada para cópia sem procuração · pedido até 1 hora antes do fim do expediente · 2 a 6 horas no prazo comum · 24 horas para representar · 3 dias após intimação pessoal → multa de ½ salário mínimo · 10 dias de carga do processo findo sem procuração.","box":1}]},{"id":"s13","title":"13. Desentranhamento","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Regra · 170","Pode ser requerido pelo interessado ou determinado de ofício pelo juiz, facultada a substituição por cópia simples."],["Sem substituição · 171","A critério do juiz, não há cópia quando se tratar de manifestação intempestiva, documento evidentemente estranho aos autos ou documento que não serviu de base a decisão nem à manifestação contrária. Coloca-se folha em branco no lugar, vedada a renumeração. Peças juntadas por equívoco vão aos autos corretos ou voltam ao protocolo."],["Providências · 172","Desentranhar e certificar (indicando as folhas); guardar em local adequado; intimar o interessado a retirar em 5 dias, se o juiz não fixar outro prazo. É vedado grampear as peças na contracapa; ficam em classificador. A devolução é feita por termo, com nome e documento de quem recebe."],["Número · 173","Dispensada a certificação do número do processo nas peças desentranhadas, salvo ordem motivada e os títulos de crédito."],["Objetos · 174","Após o trânsito, são devolvidos às partes, que têm 30 dias para retirá-los, sob pena de destruição."],["Petições não retiradas · 175","O escrivão verifica periodicamente o classificador e intima os interessados. Depois de 11 meses da intimação, publica edital com prazo de 30 dias, sob pena de inutilização. Cópia do edital vai à OAB local, que pode pedir as petições e assumir sua custódia. Faz-se ao menos uma vez por ano, com registro na ata da correição anual."]]}]},{"id":"s14","title":"14. Arquivamento, desarquivamento e pesquisa histórica","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Pressuposto · 176","Nenhum processo é arquivado sem sentença definitiva ou decisão terminativa (inclusive a extinção por estabilização da tutela), salvo suspensão legal por prazo indeterminado, caso em que não se comunica a extinção."],["Permanência · 177","Publicada a decisão de arquivamento, os autos ficam 30 dias no ofício e depois são arquivados, com anotações no sistema e no SGDAU (sistema da empresa terceirizada)."],["Execução em outro juízo · 178","Quem arquiva é o juízo da execução."]]},{"k":"tbl","rows":[["Arquivo provisório · 179","Execução de título judicial há mais de 1 ano sem bens localizados; mantém-se o nome das partes no Distribuidor, e os processos saem das estatísticas mensais."],["Arquivo terceirizado · 180/181","É vedado às partes e advogados consultar ou retirar processos nos depósitos. A consulta é feita no ofício onde o processo tramitou, que requisita pelo SGDAU após o recolhimento da taxa de desarquivamento (salvo gratuidade ou isenção). O interessado tem 30 dias para se manifestar; depois, os autos voltam ao arquivo."],["Segredo · 182","É expressamente vedado o manuseio, exceto pelas partes, seus advogados ou por ordem judicial. Cópia, certidão e desentranhamento dependem de despacho."],["1º arquivamento · 184/185","Individual, sem caixas: indexar cada processo e volume no SGDAU, indicar o volume, etiquetar no canto superior esquerdo da capa, informar apensos e indexar apensos autônomos. A remessa segue a escala publicada no DJE."],["Rearquivamento · 186/187","Informam-se no SGDAU os dados do processo (vara, números, classe, partes e advogados sem abreviação, objeto, decisão final, resultado, trânsito, baixa). Sem caixas, mas separados dos novos arquivamentos."],["Desarquivamento · 188/189","Com comprovante da taxa; sem ele, o advogado é intimado a recolher em 5 dias. Antes de requisitar, verifica-se se o processo foi mesmo para o arquivo e se não está no ofício. Apenso: informa-se o principal. Não se reitera a requisição antes de 10 dias úteis."],["Pesquisa científica · 189 · A a 189 · G","Permitida nos processos arquivados, com credenciamento na Coordenadoria de Gestão Documental · SPI 2.4 · e termo de sigilo, autorizada pelo Presidente da CPAD. Prazo de 30, 60 ou no máximo 90 dias, renováveis com justificativa. Não há taxa de desarquivamento; ressarcem-se só os custos de cópias e materiais (art. 12 da LAI · .)"]]}]},{"id":"s15","title":"15. Processo eletrônico: sistema e peticionamento","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Conceito · 1.189/1.190","Processo cujas peças e atos são arquivos digitais que tramitam, são comunicados, armazenados e consultados eletronicamente · Lei 11.419/2006 · . O sistema serve para tramitação, comunicação de atos e transmissão de peças."],["Acesso · 1.191","Pelo site, por credenciado com certificação digital ICP · Brasil padrão A3; pelos conveniados, por integração; nos sistemas internos, por magistrados, servidores, funcionários e terceiros autorizados. O uso inadequado que cause prejuízo leva ao bloqueio do cadastro."],["Documentos · 1.192","Os eletrônicos são assinados digitalmente pelo autor. Os digitalizados são assinados na digitalização ou na transmissão. As reproduções juntadas por órgãos da Justiça, MP, procuradorias, polícia, repartições e advogados fazem a mesma prova que os originais, salvo alegação motivada de adulteração antes ou durante a digitalização. Os originais são preservados pelo detentor até o fim do prazo da ação rescisória."],["Chave privada · 1.193","O sigilo é de exclusiva responsabilidade do titular; a alegação de uso indevido não é oponível em nenhuma hipótese."],["Assinatura e original · 1.194/1.195","Todos os atos são assinados por certificação digital. É original a versão armazenada no servidor do TJSP, em tramitação ou arquivada."],["Peticionamento · 1.196/1.197","As petições são eletrônicas, salvo os casos previstos. A formação correta do processo é responsabilidade do advogado, na ordem: petição → procuração → documentos pessoais ou atos constitutivos → documentos da causa → comprovante de despesas. O juiz pode exigir nova apresentação se houver prejuízo ao contraditório."],["Polícia · 1.197 · A/B","A autoridade policial cadastra e classifica corretamente os documentos e assina digitalmente os termos de oitiva (os físicos ficam na delegacia). Cautelares criminais e infracionais tramitam com numeração própria, vedado pedi-las em petição intermediária ou no relatório final; chegando o principal, são apensadas."],["Tempestividade · 1.198","Vale o dia e a hora do recebimento no sistema; é tempestiva a petição enviada até as 24h do último dia (horário de Brasília). Vencido o prazo em dia sem expediente, prorroga-se até as 24h do 1º dia útil seguinte. Petições enviadas em dia sem expediente contam como protocoladas no 1º dia útil seguinte."],["Outros · 1.199 a 1.201","O sistema emite recibo eletrônico (data, hora e processo) e fica disponível ininterruptamente, salvo manutenção. A suspensão dos prazos não impede o envio de petições; os pedidos são apreciados depois, salvo urgência."]]}]},{"id":"s16","title":"16. Indisponibilidade do sistema","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["O que caracteriza · 1.202","A falta de oferta ao público externo de: · I · consulta aos autos; · II · transmissão de peças, inclusive peticionamento; · III · acesso a citações, intimações e notificações. Falhas de conexão ou de equipamentos e programas dos usuários não caracterizam indisponibilidade."],["Aferição · 1.203/1.204","Auditoria da STI, com verificação em intervalos de no máximo 5 minutos. O relatório público traz início e fim (data, hora, minuto), o período total entre 6h e 23h e os serviços afetados. O reconhecimento é publicado no site do TJSP."],["Prorrogação automática · 1.205, I","O prazo que vence no dia passa para o 1º dia útil seguinte à solução, desde que a indisponibilidade seja (a) superior a 60 minutos, contínuos ou não, entre 6h e 23h; ou (b) ocorra entre 23h e 24h."]]},{"k":"tbl","rows":[["Sem efeito (§1º)","Indisponibilidade entre 0h e 6h de dias úteis e em feriados e fins de semana, a qualquer hora."],["Prazo em horas (§2º)","Prorroga-se até as 24h do dia útil seguinte se houver indisponibilidade de mais de 60 minutos nas últimas 24 horas do prazo, ou indisponibilidade nos 60 minutos anteriores ao término. A prorrogação é feita pelo próprio sistema."],["Papel urgente · 1.205, II e §4º)","Só com risco de perecimento de direito: no horário do fórum, no dia da indisponibilidade; previamente admitida pelo Juiz Corregedor Permanente do Distribuidor ou pelo juiz do feito; com cópias legíveis, vedados os originais."],["Indisponibilidade severa · 1.205 · A a D","Indisponibilidade, lentidão ou intermitência superior a 3 horas, contínuas ou não, entre 9h e 19h de dias úteis. Divulgada logo na internet. Se durar 2 ou mais dias consecutivos, os prazos ficam automaticamente suspensos a partir do 2º dia e voltam a correr no 1º dia útil sem a falha. A suspensão não impede audiências, é publicada diariamente no DJE · Prov. CSM 2.537/2019 · e não alcança o período de graça de 10 dias do Portal e-SAJ."]]},{"k":"p","t":"MACETE — “6-23-60” E “9-19-3” Indisponibilidade comum: conta entre 6h e 23h, por mais de 60 minutos (ou qualquer tempo entre 23h e 24h) → prorroga para o 1º dia útil. Indisponibilidade severa: entre 9h e 19h, por mais de 3 horas → com 2 dias seguidos, suspende a partir do 2º. Madrugada · 0h–6h), feriado e fim de semana: não prorroga.","box":1}]},{"id":"s17","title":"17. Processo eletrônico: exceções, distribuição, consulta e tramitação","tag":"","b":[{"k":"tbl","rows":[["Tema","Regra"],["Exceções · 1.206/1.206 · A","Aceitam-se pedidos em meio físico quando a lei dispensa advogado e a parte não o tem, com cópias legíveis. Autoridades e auxiliares que não atuam por advogado mandam documentos em PDF ao e-mail institucional do ofício, com o número do processo no assunto."],["Alimentos de balcão · 1.207","Pedido de alimentos sem advogado na Família: reduzido a termo, vai ao distribuidor para cadastro e digitalização. Os papéis ficam 45 dias à disposição do autor, que é cientificado do prazo; depois, são inutilizados."],["Distribuição · 1.209 a 1.219","Inicial para vara digital ou híbrida: pelo Portal e-SAJ. Expedientes da polícia recebem a numeração única · Res. CNJ 65 · e são distribuídos automaticamente. Onde não há distribuição automática, o Distribuidor cancela o protocolo (e intima pelo DJE · quando: a vara não é digital, o juízo é diverso do indicado, há documentos sem inicial ou petição intermediária enviada como inicial. O Distribuidor não altera competência, classe e assunto, salvo manifesta divergência, levando as dúvidas ao Juiz Corregedor. Urgentes têm prioridade. Inicial em papel (indisponibilidade): só com os requisitos do art. 1.205, §4º; o requerente retira o papel em 45 dias; em nenhuma hipótese se recebe a inicial em papel se a distribuição for indeferida. Sistema parado no Distribuidor: sorteio presidido pelo Juiz Corregedor Permanente."],["Sempre digitais · 1.214","Embargos à execução e de terceiro, cumprimento de sentença e restauração de autos, mesmo com o principal físico (anota-se na capa do físico). A reconvenção em ação física segue física · 1.215 · . Duplicidade no BNMP · mantém-se o expediente em que foram emitidos os documentos (mandado de prisão, alvará) e cancela-se o outro."]]},{"k":"tbl","rows":[["Intermediárias · 1.220 a 1.222","Pelo peticionamento eletrônico. Materializado o processo, admite-se papel; ao voltar ao eletrônico, não mais. Os protocolos não recebem papel para processos eletrônicos, salvo exceções; recebida por engano, cancela-se e intima-se pelo DJE. Nos Foros Digitais há protocolo integrado de papel para processos físicos de outras comarcas. Papel na indisponibilidade: requisitos do art. 1.205, §4º, e 45 dias para retirar."],["Consulta · 1.224 a 1.227","Livre no site: movimentações, decisões, sentenças, votos, acórdãos e mandados do BNMP. Advogados, defensores, partes e MP habilitados veem tudo; os não vinculados, identificados, também, salvo sigilo ou segredo. Processo em segredo: só partes e procuradores habilitados. A marcação de segredo é feita pelo advogado, procurador ou autoridade policial no ajuizamento, pelo órgão de origem no recurso, pelo juiz ou relator, ou automaticamente por lei; presume-se válida até decisão, e a feita pelo advogado é analisada de imediato pelo juiz."],["Senhas · 1.226/1.226 · A","Advogado cadastrado no e-SAJ (certificado ou login): íntegra dos públicos e dos em segredo se tiver procuração. Parte: senha com a citação ou quando pedir. Peritos e auxiliares, e terceiros em autos sigilosos: com autorização do juiz. Vítima na execução criminal: senha pelo tempo da pena. Pedido virtual: identidade confirmada por videoconferência. Terceiro interessado em processo sem segredo: senha pessoal válida por 24 horas, com declaração de responsabilidade; os papéis do pedido presencial podem ser inutilizados após 45 dias."],["Tramitação · 1.228 a 1.236","Aplicam-se subsidiariamente os demais capítulos. O ofício identifica os casos urgentes e corrige o cadastro; a correção de expedientes da Polícia Civil na investigação é feita pela autoridade policial. O que ia na capa vira alerta de pendência, excluído só após resolvida. Tarjas obrigatórias · 29 situações, ex.: justiça gratuita, réu preso, idoso, segredo, Maria da Penha, réu menor de 21 ou maior de 70, Juízo 100% Digital, PROVITA/SP · ; sem tarja disponível, usa-se alerta. Botões de atividade são obrigatórios. As filas são verificadas ao menos 1 vez por mês, inclusive “Previsão da Prescrição” e “Processos Prescritos” no crime."],["Expedientes · 1.237 a 1.239","Usam-se modelos institucionais aprovados pela CGJ. Modelos de grupo ou usuário são permitidos só nas 18 categorias listadas (despachos, decisões, sentenças, ofícios, editais, termos etc.). O juiz usa só assinatura eletrônica, mesmo para atos em outro Estado."],["Conclusão e vista · 1.240 a 1.242","Termos dispensados; a movimentação marca a data da remessa. Juiz desvinculado da vara: conclusão comunicada por e-mail institucional. Na ausência momentânea do juiz, a tela indica quem assinará."],["Publicidade · 1.243/1.244","Onde há fluxo por atos, o cumprimento segue os subfluxos de documentos. A liberação dos expedientes é obrigatória; se a visibilidade puder frustrar o ato, usa-se movimentação com restrição até o cumprimento."],["Comunicações · 1.245 a 1.249","Cartas e mandados de citação levam senha de acesso aos autos. Pelo correio, usa-se Carta AR Digital Unipaginada. É vedado enviar a inicial em papel, salvo ordem judicial. No crime e no infracional, o mandado leva cópia da denúncia ou da representação. Para unidade prisional ou de internação, o juiz pode dispensar o mandado e deixar o ofício cumprir. Intimações pelo DJE. Instituições com intimação pessoal: portal; vale a data da consulta (em dia não útil, o 1º dia útil seguinte); sem consulta em 10 dias corridos, a intimação se considera feita no fim do prazo, com certidão de “não leitura”."],["Prazos · 1.250 a 1.255","AR físico: conta a data da digitalização e liberação; AR digital: a da disponibilização pelos Correios. Mandado positivo: a liberação da certidão do oficial. Carta cumprida: a digitalização e liberação (ou a comunicação do art. 232 do CPC · . É vedado controlar prazos pela fila “aguardando decurso de prazo – publicação”; usa-se a fila “aguardando decurso de prazo”, verificada diariamente."]]},{"k":"tbl","rows":[["Juntada e digitalização · 1.256 a 1.260","Intermediárias são juntadas sem termo. Petição intermediária sujeita a distribuição: intima-se o advogado para peticionar como inicial. Papéis digitalizados ficam 45 dias no ofício e depois vão à reciclagem (ofícios, laudos, depósitos, MLJ, ARs etc.). Originais com nota de ciente sem manifestação da parte ficam em pasta até o prazo da rescisória. Mandado com recusa de ciente é inutilizado de imediato pelo oficial. O escrivão supervisiona a qualidade. Documento ilegível fica em pasta e vai ao juiz. Documento inviável de digitalizar (mídia, planta, raio-X, grande volume) é entregue em 10 dias do aviso por petição, com cópias para cada parte, e devolvido após o trânsito."],["Peritos e sistemas · 1.261 a 1.266","Peritos são intimados por e-mail, com senha; aceitam ou recusam por e-mail. Laudos em PDF pelo e-SAJ, com certificado. Informações do Infojud vão aos autos; as sigilosas, como “documento sigiloso”. Respostas do Bacenjud e Renajud são importadas e liberadas. Mandado de levantamento: fila “ag. análise de cartório urgente”. As regras do fax não se aplicam ao processo eletrônico."],["Audiências · 1.267 a 1.271","Cadastradas na pauta eletrônica. A contestação vai por peticionamento prévio se o advogado não puder no ato; a critério do juiz, aceita-se pen drive em PDF ou papel. O termo é assinado eletronicamente pelo juiz; as cópias são assinadas fisicamente pelos presentes. Contradições na transcrição devem ser apontadas oralmente no ato, sob pena de preclusão."],["Formais e recursos · 1.273 a 1.277","As peças de formal de partilha e cartas são impressas após o pagamento da taxa de reprodução e rubricadas pelo escrivão, sem autenticação. A pedido, podem ser enviadas eletronicamente aos cartórios extrajudiciais, com termos de abertura e encerramento assinados por escrivão e juiz. Recurso: remessa eletrônica sem pendências e sem porte de remessa e retorno; mídias por malote pagam porte de um volume por objeto. Agravos e conflitos digitais: junta-se só a mensagem, o acórdão ou decisão e o trânsito."],["Outros · 1.278 a 1.284","Ação eletrônica dependente de processo físico continua eletrônica. Redistribuição para foro só digital: o distribuidor digitaliza; para foro híbrido: segue física. Para outros Tribunais: materializa ou envia por mídia. Desentranhamento: funcionalidade “TORNAR SEM EFEITO”. Impressão paga no balcão: por certidão, com custo de cópia. Desarquivamento “com” ou “sem reabertura”."],["Cumprimento de sentença · 1.285 a 1.289","A execução de sentença de processo físico, em unidade híbrida, tramita no eletrônico, como incidente apartado com numeração própria, instruído com sentença ou acórdão, trânsito, cálculo, citação e procurações. Os autos físicos ficam 30 dias para consulta. Sem pedido de execução em 30 dias, arquivam-se. Fica vedada a conversão dos cumprimentos que já tramitam fisicamente, até autorização da CGJ. O cumprimento provisório de interlocutória segue o formato do processo."],["Precatórios e RPV · 1.290 a 1.301","Tramitam só nos incidentes individualizados, vinculados ao cumprimento de sentença (não ao processo principal). Os pedidos são apreciados no incidente. É vedado precatório complementar, salvo a Res. CNJ 303. O cumprimento autônomo só cabe nas hipóteses do art. 1.292. Na Capital, a remessa à UPEFAZ ocorre só após o número de ordem da DEPRE, sem questões pendentes. São comunicados à DEPRE: cessão de crédito, sucessão, penhora (só pela funcionalidade do sistema), preferência por doença grave ou deficiência, revisão de cálculo e outras informações relevantes."]]},{"k":"p","t":"PEGADINHAS DO CAP. XI · O original é a versão do servidor do TJSP; o papel digitalizado é preservado pelo detentor até o prazo da rescisória. · Indisponibilidade na madrugada ou no fim de semana não prorroga prazo. · Embargos, cumprimento de sentença e restauração de autos são sempre digitais; a reconvenção em ação física é física. · O Distribuidor não altera competência, classe ou assunto, salvo manifesta divergência. · A senha do terceiro interessado vale 24 horas e só para processo sem segredo. · No processo digital, termos de conclusão e vista são dispensados. · Na remessa eletrônica de recurso não há porte de remessa e retorno.","box":1}]},{"id":"s18","title":"18. Tabela-mestra de PRAZOS e NÚMEROS","tag":"","b":[{"k":"tbl","rows":[["Prazo","Hipótese","Art."],["5 min","Intervalo máximo da auditoria de disponibilidade do sistema","1.203"],["60 min","Indisponibilidade (entre 6h e 23h) acima da qual o prazo é prorrogado · indisponibilidade nos 60 minutos finais de prazo em horas","1.205"],["1 hora","Carga rápida · retirada para cópia por advogado não constituído · pedido de carga rápida até 1 hora antes do fim do expediente","158 / 165"],["2 a 6 h","Retirada para cópia no prazo comum, sem ajuste","164 §2º"],["3 horas","Indisponibilidade severa · 9h–19h, dias úteis)","1.205 · A"],["24 horas","Autuação da inicial ou denúncia · representação por autos de carga rápida não devolvidos · validade da senha do terceiro interessado","87 / 165 / 1.226 · A"],["1 dia","Conclusão dos autos · presunção de leitura do e-mail · 1º dia útil seguinte)","97 / 118"],["3 dias","Envio à publicação no DJE · certidão para protesto · ofício de cancelamento do protesto · devolução dos autos após intimação pessoal do advogado","133 / 104 · A / 167"],["5 dias","Execução dos atos · certidões · registro da sentença · originais de fax · Lei 9.800 · · manifestação sobre transcrição de gravação da parte · retirada de peça desentranhada · recolhimento da taxa de desarquivamento","97 / 104 / 72 / 93 / 149 · A / 172 / 188"],["5 dias úteis","Certidão de objeto e pé pedida por e-mail entre ofícios","104 §3º"],["10 dias","Conferência prévia da audiência · carga de processo findo sem procuração · consulta ao portal de intimação (corridos) · período de graça do e-SAJ · entrega de documento inviável de digitalizar","148 / 161 / 1.248 · A / 1.205 · D / 1.259"],["10 dias úteis","Mínimo para reiterar a requisição ao arquivo terceirizado","189 §4º"],["10º dia útil","Relação mensal de autos fora do prazo · 2 vias)","168"],["15 dias","Antecedência do edital da correição ordinária · envio da ata da correição extraordinária ou da visita","8 §1º / 6 §4º"],["30 dias","Visita ao assumir a corregedoria · afastamento que dispensa a visita prisional pessoal · processo sem andamento · objetos após o trânsito · edital de petições · permanência após a decisão de arquivamento · manifestação após desarquivamento · autos físicos após o cumprimento de sentença · arquivamento se não executada a sentença · pesquisa (mínimo) · Estação Passiva sem data (réu preso)","9 / 13 / 99 / 174 / 175 / 177 / 181 / 1.286 / 189 · F / 122"],["1 mês","Permanência da produção antecipada de prova em cartório · visita aos estabelecimentos prisionais","60 / 13"],["45 dias","Retirada de reclamação disciplinar física · alimentos de balcão · inicial ou intermediária em papel · guarda de papéis digitalizados · inutilização dos papéis do pedido de senha de terceiro","15 §4º / 1.207 / 1.212 / 1.222 / 1.258 / 1.226 · A"],["60 dias","Envio da ata da correição ordinária · credenciamento de pesquisa","6 §4º / 189 · F"],["90 dias","Estação Passiva sem data (demais casos) · credenciamento de pesquisa (máximo)","122 / 189 · F"],["11 meses","Da intimação para retirada até o edital de petições não retiradas","175"],["1 ano","Correição ordinária (anual) · conservação de ofícios expedidos e recebidos · execução sem bens para arquivo provisório","8 / 78 / 179"],["2 anos","GRD · inutilização dos livros de carga · guarda do livro físico de Visitas e Correições digitalizado","79 / 74 / 67"]]},{"k":"tbl","rows":[["Rescisória","Guarda dos originais digitalizados pelo detentor · armazenamento da gravação de audiência cível · originais com nota de ciente sem manifestação","1.192 / 153 / 1.258"]]},{"k":"tbl","rows":[["Número","O quê"],["200","folhas por volume"],["3 vias","carta precatória (uma é contrafé)"],["2 vias","relatório de carga externa · relação mensal de autos retidos"],["2 nomes","máximo de advogados indicados para a publicação"],["½ SM","multa ao advogado que não devolve os autos"],["29","tarjas obrigatórias no processo eletrônico"],["18","categorias de modelos de grupo ou usuário"]]},{"k":"tbl","rows":[["Datas e horários","O quê"],["Dezembro","mês preferencial da correição ordinária"],["Novembro","assumiu a partir dele: dispensa a visita inicial"],["20/12 a 20/01","suspensão dos prazos disciplinares"],["24h · Brasília)","limite para a petição eletrônica tempestiva"],["6h–23h","janela da indisponibilidade comum"],["9h–19h","janela da indisponibilidade severa"]]}]},{"id":"s19","title":"19. Quem faz o quê — responsáveis","tag":"","b":[{"k":"tbl","rows":[["Ato","Responsável"],["Alterar a designação do corregedor permanente","Corregedor Geral, com aprovação do CSM"],["Revisar ordens de serviço do juiz corregedor","CGJ (revisão hierárquica)"],["Responder consultas sobre as NSCGJ","Juiz Corregedor Permanente (submete à CGJ"],["Instaurar sindicância e PAD contra servidor de serventia","Juiz Corregedor Permanente (por portaria)"],["Avocar procedimento, instaurar originariamente, reexaminar absolvição","Corregedor Geral"],["Abrir, numerar, autenticar e encerrar livros · autenticar vias do registro de sentença · auditoria semanal","Escrivão judicial"],["Autorizar inutilização de livros, fichas e papéis","Juiz Corregedor Permanente"],["Fixar níveis de acesso e senhas do sistema","CGJ, com a STI"],["Expedir certidões","Exclusivamente os ofícios de justiça"],["Designar audiências","Juiz (indelegável), salvo nos juizados especiais"],["Receber a petição de indicação de prepostos para carga","Juiz Corregedor Permanente"],["Conceder carga rápida","Escrivão ou escrevente do atendimento"],["Orientações técnicas de gravação · auditoria de indisponibilidade","STI"],["Formação correta do processo eletrônico","Advogado ou procurador"],["Cadastro e classificação de expedientes policiais","Autoridade policial"],["Admitir petição urgente em papel na indisponibilidade","Juiz Corregedor Permanente do Distribuidor ou juiz do feito"],["Autorizar pesquisa científica no arquivo","Presidente da CPAD"],["Supervisionar a digitalização","Escrivão"]]}]},{"id":"s20","title":"20. As 25 pegadinhas mais prováveis","tag":"","b":[{"k":"tbl","rows":[["#","A banca escreve · ERRADO","As NSCGJ dizem · CERTO"],["1","A ata da correição ordinária vai à CGJ em até 15 dias","Em até 60 dias; a de correição extraordinária ou de visita, em até 15"],["2","A correição ordinária é obrigatoriamente em dezembro","De preferência em dezembro"],["3","A visita correcional exige edital com 15 dias","Independe de edital"],["4","Distritos policiais têm correição ordinária anual","São dispensados"],["5","A sindicância apura penas de demissão","Repreensão, suspensão ou multa; demissão é no processo administrativo"],["6","O procedimento disciplinar é instaurado por despacho, com registro em livro","Por portaria, dispensado o registro"],["7","Os prazos disciplinares contam em dias úteis","Dias corridos, suspensos de 20/12 a 20/01"],["8","Livro Tombo é livro obrigatório do ofício de justiça","É da Administração Geral do Fórum"],["9","Os livros são abertos e encerrados pelo juiz corregedor","Pelo escrivão, na mesma oportunidade"],["10","A decisão que liquida sentença penal é averbada","É registrada; averbam-se ED e liquidação de sentença cível"],["11","Ofícios recebidos são conservados por 2 anos","1 ano; GRD é que fica 2 anos"],["12","É vedado usar anotação de “sem efeito”","Deve ser evitada; se necessária, datada e assinada"],["13","É permitido o uso de corretivo desde que ressalvado","Vedado qualquer meio químico ou mecânico"],["14","O escrivão assina alvará de levantamento por ordem do juiz","Alvarás exigem assinatura do juiz"],["15","Volume com até 300 folhas","200 folhas"],["16","Em erro de numeração, renumeram-se as folhas","Vedada a renumeração; certifica-se"],["17","Conclusão em 5 dias e cumprimento em 1 dia","Conclusão em 1; cumprimento em 5"],["18","Certidão em segredo de justiça sempre depende de despacho","Salvo se pedida pela parte ou procurador habilitado"],["19","O remetente usa o e-mail da unidade","Usa o seu e-mail institucional, não o da unidade"],["20","O servidor pode informar andamento por telefone ao advogado","Vedado"],["21","O escrivão pode designar audiência","Exclusiva e indelegável do juiz (salvo JEC"],["22","Na carga, o servidor retém a carteira da OAB","Vedada a retenção"],["23","Estagiário sem inscrição pode ver autos em segredo","Vedado; só o acadêmico autorizado por entidade de assistência judiciária pode consultar"],["24","Indisponibilidade no domingo prorroga o prazo","Não produz efeito (feriados e fins de semana)"],["25","O original no processo eletrônico é o papel apresentado","É a versão armazenada no servidor do TJSP"]]}]}],"cp":[{"id":"s0","title":"Disposições iniciais · arts. 293 a 311-A","tag":"","b":[{"k":"p","t":"Decreto-Lei nº 2.848/1940 Código Penal."},{"k":"h","t":"TÍTULO X — DOS CRIMES CONTRA A FÉ PÚBLICA"},{"k":"h","t":"CAPÍTULO II — DA FALSIDADE DE TÍTULOS E OUTROS PAPÉIS PÚBLICOS"},{"k":"h","t":"Falsificação de papéis públicos"},{"k":"p","t":"Art. 293 - Falsificar, fabricando-os ou alterando-os:","v":["falsificar"]},{"k":"p","t":"I – selo destinado a controle tributário, papel selado ou qualquer papel de emissão legal destinado à arrecadação de tributo; (Redação dada pela Lei nº 11.035, de 2004)"},{"k":"p","t":"II - papel de crédito público que não seja moeda de curso legal;"},{"k":"p","t":"III - vale postal;"},{"k":"p","t":"IV - cautela de penhor, caderneta de depósito de caixa econômica ou de outro estabelecimento mantido por entidade de direito público;"},{"k":"p","t":"V - talão, recibo, guia, alvará ou qualquer outro documento relativo a arrecadação de rendas públicas ou a depósito ou caução por que o poder público seja responsável;"},{"k":"p","t":"VI - bilhete, passe ou conhecimento de empresa de transporte administrada pela União, por Estado ou por Município:"},{"k":"p","t":"Pena - reclusão, de dois a oito anos, e multa."},{"k":"p","t":"§ 1o Incorre na mesma pena quem: (Redação dada pela Lei nº 11.035, de 2004)"},{"k":"p","t":"I – usa, guarda, possui ou detém qualquer dos papéis falsificados a que se refere este artigo; (Incluído pela Lei nº 11.035, de 2004)"},{"k":"p","t":"II – importa, exporta, adquire, vende, troca, cede, empresta, guarda, fornece ou restitui à circulação selo falsificado destinado a controle tributário; (Incluído pela Lei nº 11.035, de 2004)"},{"k":"p","t":"III – importa, exporta, adquire, vende, expõe à venda, mantém em depósito, guarda, troca, cede, empresta, fornece, porta ou, de qualquer forma, utiliza em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, produto ou mercadoria: (Incluído pela Lei nº 11.035, de 2004)"},{"k":"p","t":"a) em que tenha sido aplicado selo que se destine a controle tributário, falsificado; (Incluído pela Lei nº 11.035, de 2004)"},{"k":"p","t":"b) sem selo oficial, nos casos em que a legislação tributária determina a obrigatoriedade de sua aplicação. (Incluído pela Lei nº 11.035, de 2004)"},{"k":"p","t":"§ 2º - Suprimir, em qualquer desses papéis, quando legítimos, com o fim de torná-los novamente utilizáveis, carimbo ou sinal indicativo de sua inutilização:"},{"k":"p","t":"Pena - reclusão, de um a quatro anos, e multa."},{"k":"p","t":"§ 3º - Incorre na mesma pena quem usa, depois de alterado, qualquer dos papéis a que se refere o parágrafo anterior."},{"k":"p","t":"§ 4º - Quem usa ou restitui à circulação, embora recibo de boa-fé, qualquer dos papéis falsificados ou alterados, a que se referem este artigo e o seu § 2º, depois de conhecer a falsidade ou alteração, incorre na pena de detenção, de seis meses a dois anos, ou multa."},{"k":"p","t":"§ 5o Equipara-se a atividade comercial, para os fins do inciso III do § 1o, qualquer forma de comércio irregular ou clandestino, inclusive o exercido em vias, praças ou outros logradouros públicos e em residências. (Incluído pela Lei nº 11.035, de 2004)"},{"k":"h","t":"Petrechos de falsificação"},{"k":"p","t":"Art. 294 - Fabricar, adquirir, fornecer, possuir ou guardar objeto especialmente destinado à falsificação de qualquer dos papéis referidos no artigo anterior:","v":["fabricar","adquirir","fornecer","possuir","guardar"]},{"k":"p","t":"Pena - reclusão, de um a três anos, e multa."},{"k":"p","t":"Art. 295 - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta p
