nto será adiado somente uma vez, devendo o acusado ser julgado quando chamado novamente. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Na hipótese do § 1o deste artigo, o juiz intimará a Defensoria Pública para o novo julgamento, que será adiado para o primeiro dia desimpedido, observado o prazo mínimo de 10 (dez) dias. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 457. O julgamento não será adiado pelo não comparecimento do acusado solto, do assistente ou do advogado do querelante, que tiver sido regularmente intimado. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Os pedidos de adiamento e as justificações de não comparecimento deverão ser, salvo comprovado motivo de força maior, previamente submetidos à apreciação do juiz presidente do Tribunal do Júri. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Se o acusado preso não for conduzido, o julgamento será adiado para o primeiro dia desimpedido da mesma reunião, salvo se houver pedido de dispensa de comparecimento subscrito por ele e seu defensor. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 458. Se a testemunha, sem justa causa, deixar de comparecer, o juiz presidente, sem prejuízo da ação penal pela desobediência, aplicar-lhe-á a multa prevista no § 2o do art. 436 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 459. Aplicar-se-á às testemunhas a serviço do Tribunal do Júri o disposto no art. 441 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 460. Antes de constituído o Conselho de Sentença, as testemunhas serão recolhidas a lugar onde umas não possam ouvir os depoimentos das outras. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 461. O julgamento não será adiado se a testemunha deixar de comparecer, salvo se uma das partes tiver requerido a sua intimação por mandado, na oportunidade de que trata o art. 422 deste Código, declarando não prescindir do depoimento e indicando a sua localização. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Se, intimada, a testemunha não comparecer, o juiz presidente suspenderá os trabalhos e mandará conduzi-la ou adiará o julgamento para o primeiro dia desimpedido, ordenando a sua condução. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o O julgamento será realizado mesmo na hipótese de a testemunha não ser encontrada no local indicado, se assim for certificado por oficial de justiça. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 462. Realizadas as diligências referidas nos arts. 454 a 461 deste Código, o juiz presidente verificará se a urna contém as cédulas dos 25 (vinte e cinco) jurados sorteados, mandando que o escrivão proceda à chamada deles. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 463. Comparecendo, pelo menos, 15 (quinze) jurados, o juiz presidente declarará instalados os trabalhos, anunciando o processo que será submetido a julgamento. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O oficial de justiça fará o pregão, certificando a diligência nos autos. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Os jurados excluídos por impedimento ou suspeição serão computados para a constituição do número legal. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 464. Não havendo o número referido no art. 463 deste Código, proceder-se-á ao sorteio de tantos suplentes quantos necessários, e designar-se-á nova data para a sessão do júri. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 465. Os nomes dos suplentes serão consignados em ata, remetendo-se o expediente de convocação, com observância do disposto nos arts. 434 e 435 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 466. Antes do sorteio dos membros do Conselho de Sentença, o juiz presidente esclarecerá sobre os impedimentos, a suspeição e as incompatibilidades constantes dos arts. 448 e 449 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O juiz presidente também advertirá os jurados de que, uma vez sorteados, não poderão comunicar-se entre si e com outrem, nem manifestar sua opinião sobre o processo, sob pena de exclusão do Conselho e multa, na forma do § 2o do art. 436 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o A incomunicabilidade será certificada nos autos pelo oficial de justiça. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 467. Verificando que se encontram na urna as cédulas relativas aos jurados presentes, o juiz presidente sorteará 7 (sete) dentre eles para a formação do Conselho de Sentença. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 468. À medida que as cédulas forem sendo retiradas da urna, o juiz presidente as lerá, e a defesa e, depois dela, o Ministério Público poderão recusar os jurados sorteados, até 3 (três) cada parte, sem motivar a recusa.(Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. O jurado recusado imotivadamente por qualquer das partes será excluído daquela sessão de instrução e julgamento, prosseguindo-se o sorteio para a composição do Conselho de Sentença com os jurados remanescentes. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 469. Se forem 2 (dois) ou mais os acusados, as recusas poderão ser feitas por um só defensor. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o A separação dos julgamentos somente ocorrerá se, em razão das recusas, não for obtido o número mínimo de 7 (sete) jurados para compor o Conselho de Sentença. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Determinada a separação dos julgamentos, será julgado em primeiro lugar o acusado a quem foi atribuída a autoria do fato ou, em caso de co-autoria, aplicar-se-á o critério de preferência disposto no art. 429 deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 470. Desacolhida a argüição de impedimento, de suspeição ou de incompatibilidade contra o juiz presidente do Tribunal do Júri, órgão do Ministério Público, jurado ou qualquer funcionário, o julgamento não será suspenso, devendo, entretanto, constar da ata o seu fundamento e a decisão. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 471. Se, em conseqüência do impedimento, suspeição, incompatibilidade, dispensa ou recusa, não houver número para a formação do Conselho, o julgamento será adiado para o primeiro dia desimpedido, após sorteados os suplentes, com observância do disposto no art. 464 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 472. Formado o Conselho de Sentença, o presidente, levantando-se, e, com ele, todos os presentes, fará aos jurados a seguinte exortação: (Redação dada pela Lei nº 11.689, de 2008) Em nome da lei, concito-vos a examinar esta causa com imparcialidade e a proferir a vossa decisão de acordo com a vossa consciência e os ditames da justiça. Os jurados, nominalmente chamados pelo presidente, responderão: Assim o prometo."},{"k":"p","t":"Parágrafo único. O jurado, em seguida, receberá cópias da pronúncia ou, se for o caso, das decisões posteriores que julgaram admissível a acusação e do relatório do processo. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO XI — DA INSTRUÇÃO EM PLENÁRIO"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 473. Prestado o compromisso pelos jurados, será iniciada a instrução plenária quando o juiz presidente, o Ministério Público, o assistente, o querelante e o defensor do acusado tomarão, sucessiva e diretamente, as declarações do ofendido, se possível, e inquirirão as testemunhas arroladas pela acusação. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Para a inquirição das testemunhas arroladas pela defesa, o defensor do acusado formulará as perguntas antes do Ministério Público e do assistente, mantidos no mais a ordem e os critérios estabelecidos neste artigo.(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Os jurados poderão formular perguntas ao ofendido e às testemunhas, por intermédio do juiz presidente. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o As partes e os jurados poderão requerer acareações, reconhecimento de pessoas e coisas e esclarecimento dos peritos, bem como a leitura de peças que se refiram, exclusivamente, às provas colhidas por carta precatória e às provas cautelares, antecipadas ou não repetíveis. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 474. A seguir será o acusado interrogado, se estiver presente, na forma estabelecida no Capítulo III do Título VII do Livro I deste Código, com as alterações introduzidas nesta Seção. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O Ministério Público, o assistente, o querelante e o defensor, nessa ordem, poderão formular, diretamente, perguntas ao acusado. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Os jurados formularão perguntas por intermédio do juiz presidente. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o Não se permitirá o uso de algemas no acusado durante o período em que permanecer no plenário do júri, salvo se absolutamente necessário à ordem dos trabalhos, à segurança das testemunhas ou à garantia da integridade física dos presentes. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 474-A. Durante a instrução em plenário, todas as partes e demais sujeitos processuais presentes no ato deverão respeitar a dignidade da vítima, sob pena de responsabilização civil, penal e administrativa, cabendo ao juiz presidente garantir o cumprimento do disposto neste artigo, vedadas: (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"I - a manifestação sobre circunstâncias ou elementos alheios aos fatos objeto de apuração nos autos; (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"II - a utilização de linguagem, de informações ou de material que ofendam a dignidade da vítima ou de testemunhas. (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"Art. 475. O registro dos depoimentos e do interrogatório será feito pelos meios ou recursos de gravação magnética, eletrônica, estenotipia ou técnica similar, destinada a obter maior fidelidade e celeridade na colheita da prova.(Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. A transcrição do registro, após feita a degravação, constará dos autos. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO XII — DOS DEBATES"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 476. Encerrada a instrução, será concedida a palavra ao Ministério Público, que fará a acusação, nos limites da pronúncia ou das decisões posteriores que julgaram admissível a acusação, sustentando, se for o caso, a existência de circunstância agravante. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O assistente falará depois do Ministério Público. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Tratando-se de ação penal de iniciativa privada, falará em primeiro lugar o querelante e, em seguida, o Ministério Público, salvo se este houver retomado a titularidade da ação, na forma do art. 29 deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o Finda a acusação, terá a palavra a defesa. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 4o A acusação poderá replicar e a defesa treplicar, sendo admitida a reinquirição de testemunha já ouvida em plenário. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 477. O tempo destinado à acusação e à defesa será de uma hora e meia para cada, e de uma hora para a réplica e outro tanto para a tréplica. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Havendo mais de um acusador ou mais de um defensor, combinarão entre si a distribuição do tempo, que, na falta de acordo, será dividido pelo juiz presidente, de forma a não exceder o determinado neste artigo. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Havendo mais de 1 (um) acusado, o tempo para a acusação e a defesa será acrescido de 1 (uma) hora e elevado ao dobro o da réplica e da tréplica, observado o disposto no § 1o deste artigo. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 478. Durante os debates as partes não poderão, sob pena de nulidade, fazer referências: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – à decisão de pronúncia, às decisões posteriores que julgaram admissível a acusação ou à determinação do uso de algemas como argumento de autoridade que beneficiem ou prejudiquem o acusado; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – ao silêncio do acusado ou à ausência de interrogatório por falta de requerimento, em seu prejuízo. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 479. Durante o julgamento não será permitida a leitura de documento ou a exibição de objeto que não tiver sido juntado aos autos com a antecedência mínima de 3 (três) dias úteis, dando-se ciência à outra parte. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Compreende-se na proibição deste artigo a leitura de jornais ou qualquer outro escrito, bem como a exibição de vídeos, gravações, fotografias, laudos, quadros, croqui ou qualquer outro meio assemelhado, cujo conteúdo versar sobre a matéria de fato submetida à apreciação e julgamento dos jurados. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 480. A acusação, a defesa e os jurados poderão, a qualquer momento e por intermédio do juiz presidente, pedir ao orador que indique a folha dos autos onde se encontra a peça por ele lida ou citada, facultando-se, ainda, aos jurados solicitar-lhe, pelo mesmo meio, o esclarecimento de fato por ele alegado. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Concluídos os debates, o presidente indagará dos jurados se estão habilitados a julgar ou se necessitam de outros esclarecimentos. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Se houver dúvida sobre questão de fato, o presidente prestará esclarecimentos à vista dos autos. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o Os jurados, nesta fase do procedimento, terão acesso aos autos e aos instrumentos do crime se solicitarem ao juiz presidente. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 481. Se a verificação de qualquer fato, reconhecida como essencial para o julgamento da causa, não puder ser realizada imediatamente, o juiz presidente dissolverá o Conselho, ordenando a realização das diligências entendidas necessárias. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Se a diligência consistir na produção de prova pericial, o juiz presidente, desde logo, nomeará perito e formulará quesitos, facultando às partes também formulá-los e indicar assistentes técnicos, no prazo de 5 (cinco) dias. (Redação dada pela Lei nº 11.689, de 2008)"}]},{"id":"s5","title":"SEÇÃO XIII — DO QUESTIONÁRIO E SUA VOTAÇÃO · arts. 482 a 496","tag":"","b":[{"k":"h","t":"SEÇÃO XIII — DO QUESTIONÁRIO E SUA VOTAÇÃO"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 482. O Conselho de Sentença será questionado sobre matéria de fato e se o acusado deve ser absolvido. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Os quesitos serão redigidos em proposições afirmativas, simples e distintas, de modo que cada um deles possa ser respondido com suficiente clareza e necessária precisão. Na sua elaboração, o presidente levará em conta os termos da pronúncia ou das decisões posteriores que julgaram admissível a acusação, do interrogatório e das alegações das partes. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 483. Os quesitos serão formulados na seguinte ordem, indagando sobre: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – a materialidade do fato; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – a autoria ou participação; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – se o acusado deve ser absolvido; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IV – se existe causa de diminuição de pena alegada pela defesa; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"V – se existe circunstância qualificadora ou causa de aumento de pena reconhecidas na pronúncia ou em decisões posteriores que julgaram admissível a acusação. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o A resposta negativa, de mais de 3 (três) jurados, a qualquer dos quesitos referidos nos incisos I e II do caput deste artigo encerra a votação e implica a absolvição do acusado. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Respondidos afirmativamente por mais de 3 (três) jurados os quesitos relativos aos incisos I e II do caput deste artigo será formulado quesito com a seguinte redação: (Incluído pela Lei nº 11.689, de 2008) O jurado absolve o acusado?"},{"k":"p","t":"§ 3o Decidindo os jurados pela condenação, o julgamento prossegue, devendo ser formulados quesitos sobre: (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – causa de diminuição de pena alegada pela defesa; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – circunstância qualificadora ou causa de aumento de pena, reconhecidas na pronúncia ou em decisões posteriores que julgaram admissível a acusação. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 4o Sustentada a desclassificação da infração para outra de competência do juiz singular, será formulado quesito a respeito, para ser respondido após o 2o (segundo) ou 3o (terceiro) quesito, conforme o caso. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 5o Sustentada a tese de ocorrência do crime na sua forma tentada ou havendo divergência sobre a tipificação do delito, sendo este da competência do Tribunal do Júri, o juiz formulará quesito acerca destas questões, para ser respondido após o segundo quesito. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 6o Havendo mais de um crime ou mais de um acusado, os quesitos serão formulados em séries distintas. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 484. A seguir, o presidente lerá os quesitos e indagará das partes se têm requerimento ou reclamação a fazer, devendo qualquer deles, bem como a decisão, constar da ata. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Ainda em plenário, o juiz presidente explicará aos jurados o significado de cada quesito. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 485. Não havendo dúvida a ser esclarecida, o juiz presidente, os jurados, o Ministério Público, o assistente, o querelante, o defensor do acusado, o escrivão e o oficial de justiça dirigir-se-ão à sala especial a fim de ser procedida a votação. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Na falta de sala especial, o juiz presidente determinará que o público se retire, permanecendo somente as pessoas mencionadas no caput deste artigo. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o O juiz presidente advertirá as partes de que não será permitida qualquer intervenção que possa perturbar a livre manifestação do Conselho e fará retirar da sala quem se portar inconvenientemente. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 486. Antes de proceder-se à votação de cada quesito, o juiz presidente mandará distribuir aos jurados pequenas cédulas, feitas de papel opaco e facilmente dobráveis, contendo 7 (sete) delas a palavra sim, 7 (sete) a palavra não. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 487. Para assegurar o sigilo do voto, o oficial de justiça recolherá em urnas separadas as cédulas correspondentes aos votos e as não utilizadas. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 488. Após a resposta, verificados os votos e as cédulas não utilizadas, o presidente determinará que o escrivão registre no termo a votação de cada quesito, bem como o resultado do julgamento. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Do termo também constará a conferência das cédulas não utilizadas. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 489. As decisões do Tribunal do Júri serão tomadas por maioria de votos. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 490. Se a resposta a qualquer dos quesitos estiver em contradição com outra ou outras já dadas, o presidente, explicando aos jurados em que consiste a contradição, submeterá novamente à votação os quesitos a que se referirem tais respostas. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Se, pela resposta dada a um dos quesitos, o presidente verificar que ficam prejudicados os seguintes, assim o declarará, dando por finda a votação. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 491. Encerrada a votação, será o termo a que se refere o art. 488 deste Código assinado pelo presidente, pelos jurados e pelas partes. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO XIV — DA SENTENÇA"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 492. Em seguida, o presidente proferirá sentença que: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – no caso de condenação: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"a) fixará a pena-base; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"b) considerará as circunstâncias agravantes ou atenuantes alegadas nos debates; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"c) imporá os aumentos ou diminuições da pena, em atenção às causas admitidas pelo júri; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"d) observará as demais disposições do art. 387 deste Código; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"e) mandará o acusado recolher-se ou recomendá-lo-á à prisão em que se encontra, se presentes os requisitos da prisão preventiva, ou, no caso de condenação a uma pena igual ou superior a 15 (quinze) anos de reclusão, determinará a execução provisória das penas, com expedição do mandado de prisão, se for o caso, sem prejuízo do conhecimento de recursos que vierem a ser interpostos; (Redação dada pela Lei nº 13.964, de 2019) (Vigência)"},{"k":"p","t":"f) estabelecerá os efeitos genéricos e específicos da condenação; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – no caso de absolvição: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"a) mandará colocar em liberdade o acusado se por outro motivo não estiver preso; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"b) revogará as medidas restritivas provisoriamente decretadas; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"c) imporá, se for o caso, a medida de segurança cabível. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Se houver desclassificação da infração para outra, de competência do juiz singular, ao presidente do Tribunal do Júri caberá proferir sentença em seguida, aplicando-se, quando o delito resultante da nova tipificação for considerado pela lei como infração penal de menor potencial ofensivo, o disposto nos arts. 69 e seguintes da Lei no 9.099, de 26 de setembro de 1995. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Em caso de desclassificação, o crime conexo que não seja doloso contra a vida será julgado pelo juiz presidente do Tribunal do Júri, aplicando-se, no que couber, o disposto no § 1o deste artigo. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3º O presidente poderá, excepcionalmente, deixar de autorizar a execução provisória das penas de que trata a alínea e do inciso I do caput deste artigo, se houver questão substancial cuja resolução pelo tribunal ao qual competir o julgamento possa plausivelmente levar à revisão da condenação. (Incluído pela Lei nº 13.964, de 2019) (Vigência)"},{"k":"p","t":"§ 4º A apelação interposta contra decisão condenatória do Tribunal do Júri a uma pena igual ou superior a 15 (quinze) anos de reclusão não terá efeito suspensivo. (Incluído pela Lei nº 13.964, de 2019) (Vigência)"},{"k":"p","t":"§ 5º Excepcionalmente, poderá o tribunal atribuir efeito suspensivo à apelação de que trata o § 4º deste artigo, quando verificado cumulativamente que o recurso: (Incluído pela Lei nº 13.964, de 2019) (Vigência)"},{"k":"p","t":"I - não tem propósito meramente protelatório; e (Incluído pela Lei nº 13.964, de 2019) (Vigência)"},{"k":"p","t":"II - levanta questão substancial e que pode resultar em absolvição, anulação da sentença, novo julgamento ou redução da pena para patamar inferior a 15 (quinze) anos de reclusão."},{"k":"p","t":"§ 6º O pedido de concessão de efeito suspensivo poderá ser feito incidentemente na apelação ou por meio de petição em separado dirigida diretamente ao relator, instruída com cópias da sentença condenatória, das razões da apelação e de prova da tempestividade, das contrarrazões e das demais peças necessárias à compreensão da controvérsia. (Incluído pela Lei nº 13.964, de 2019) (Vigência)"},{"k":"p","t":"Art. 493. A sentença será lida em plenário pelo presidente antes de encerrada a sessão de instrução e julgamento. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO XV — DA ATA DOS TRABALHOS"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 494. De cada sessão de julgamento o escrivão lavrará ata, assinada pelo presidente e pelas partes. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 495. A ata descreverá fielmente todas as ocorrências, mencionando obrigatoriamente: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – a data e a hora da instalação dos trabalhos; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – o magistrado que presidiu a sessão e os jurados presentes; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – os jurados que deixaram de comparecer, com escusa ou sem ela, e as sanções aplicadas; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IV – o ofício ou requerimento de isenção ou dispensa ; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"V – o sorteio dos jurados suplentes; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VI – o adiamento da sessão, se houver ocorrido, com a indicação do motivo; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VII – a abertura da sessão e a presença do Ministério Público, do querelante e do assistente, se houver, e a do defensor do acusado; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VIII – o pregão e a sanção imposta, no caso de não comparecimento; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IX – as testemunhas dispensadas de depor; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"X – o recolhimento das testemunhas a lugar de onde umas não pudessem ouvir o depoimento das outras; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XI – a verificação das cédulas pelo juiz presidente; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XII – a formação do Conselho de Sentença, com o registro dos nomes dos jurados sorteados e recusas; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XIII – o compromisso e o interrogatório, com simples referência ao termo; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XIV – os debates e as alegações das partes com os respectivos fundamentos; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XV – os incidentes; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XVI – o julgamento da causa; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XVII – a publicidade dos atos da instrução plenária, das diligências e da sentença. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 496. A falta da ata sujeitará o responsável a sanções administrativa e penal. (Redação dada pela Lei nº 11.689, de 2008)"}]},{"id":"s6","title":"SEÇÃO XVI — DAS ATRIBUIÇÕES DO PRESIDENTE DO TRIBUNAL DO JÚRI · arts. 497 a 548","tag":"","b":[{"k":"h","t":"SEÇÃO XVI — DAS ATRIBUIÇÕES DO PRESIDENTE DO TRIBUNAL DO JÚRI"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 497. São atribuições do juiz presidente do Tribunal do Júri, além de outras expressamente referidas neste Código: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – regular a polícia das sessões e prender os desobedientes; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – requisitar o auxílio da força pública, que ficará sob sua exclusiva autoridade; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – dirigir os debates, intervindo em caso de abuso, excesso de linguagem ou mediante requerimento de uma das partes; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IV – resolver as questões incidentes que não dependam de pronunciamento do júri; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"V – nomear defensor ao acusado, quando considerá-lo indefeso, podendo, neste caso, dissolver o Conselho e designar novo dia para o julgamento, com a nomeação ou a constituição de novo defensor; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VI – mandar retirar da sala o acusado que dificultar a realização do julgamento, o qual prosseguirá sem a sua presença; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VII – suspender a sessão pelo tempo indispensável à realização das diligências requeridas ou entendidas necessárias, mantida a incomunicabilidade dos jurados; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VIII – interromper a sessão por tempo razoável, para proferir sentença e para repouso ou refeição dos jurados; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IX – decidir, de ofício, ouvidos o Ministério Público e a defesa, ou a requerimento de qualquer destes, a argüição de extinção de punibilidade; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"X – resolver as questões de direito suscitadas no curso do julgamento; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XI – determinar, de ofício ou a requerimento das partes ou de qualquer jurado, as diligências destinadas a sanar nulidade ou a suprir falta que prejudique o esclarecimento da verdade; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"XII – regulamentar, durante os debates, a intervenção de uma das partes, quando a outra estiver com a palavra, podendo conceder até 3 (três) minutos para cada aparte requerido, que serão acrescidos ao tempo desta última.(Incluído pela Lei nº 11.689, de 2008)"},{"k":"h","t":"CAPÍTULO V — DO PROCESSO SUMÁRIO"},{"k":"p","t":"Art. 531. Na audiência de instrução e julgamento, a ser realizada no prazo máximo de 30 (trinta) dias, proceder-se-á à tomada de declarações do ofendido, se possível, à inquirição das testemunhas arroladas pela acusação e pela defesa, nesta ordem, ressalvado o disposto no art. 222 deste Código, bem como aos esclarecimentos dos peritos, às acareações e ao reconhecimento de pessoas e coisas, interrogando-se, em seguida, o acusado e procedendo-se, finalmente, ao debate. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 532. Na instrução, poderão ser inquiridas até 5 (cinco) testemunhas arroladas pela acusação e 5 (cinco) pela defesa. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 533. Aplica-se ao procedimento sumário o disposto nos parágrafos do art. 400 deste Código. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 3o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 4o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 534. As alegações finais serão orais, concedendose a palavra, respectivamente, à acusação e à defesa, pelo prazo de 20 (vinte) minutos, prorrogáveis por mais 10 (dez), proferindo o juiz, a seguir, sentença. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o Havendo mais de um acusado, o tempo previsto para a defesa de cada um será individual. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o Ao assistente do Ministério Público, após a manifestação deste, serão concedidos 10 (dez) minutos, prorrogando-se por igual período o tempo de manifestação da defesa. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 535. Nenhum ato será adiado, salvo quando imprescindível a prova faltante, determinando o juiz a condução coercitiva de quem deva comparecer. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 536. A testemunha que comparecer será inquirida, independentemente da suspensão da audiência, observada em qualquer caso a ordem estabelecida no art. 531 deste Código. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 537. (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 538. Nas infrações penais de menor potencial ofensivo, quando o juizado especial criminal encaminhar ao juízo comum as peças existentes para a adoção de outro procedimento, observar-se-á o procedimento sumário previsto neste Capítulo. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 3o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 4o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"h","t":"CAPÍTULO VI — DO PROCESSO DE RESTAURAÇÃO DE AUTOS EXTRAVIADOS OU DESTRUÍDOS"},{"k":"p","t":"Art. 541. Os autos originais de processo penal extraviados ou destruídos, em primeira ou segunda instância, serão restaurados."},{"k":"p","t":"§ 1o Se existir e for exibida cópia autêntica ou certidão do processo, será uma ou outra considerada como original."},{"k":"p","t":"§ 2o Na falta de cópia autêntica ou certidão do processo, o juiz mandará, de ofício, ou a requerimento de qualquer das partes, que:"},{"k":"p","t":"a) o escrivão certifique o estado do processo, segundo a sua lembrança, e reproduza o que houver a respeito em seus protocolos e registros;"},{"k":"p","t":"b) sejam requisitadas cópias do que constar a respeito no Instituto Médico-Legal, no Instituto de Identificação e Estatística ou em estabelecimentos congêneres, repartições públicas, penitenciárias ou cadeias;"},{"k":"p","t":"c) as partes sejam citadas pessoalmente, ou, se não forem encontradas, por edital, com o prazo de dez dias, para o processo de restauração dos autos."},{"k":"p","t":"§ 3o Proceder-se-á à restauração na primeira instância, ainda que os autos se tenham extraviado na segunda."},{"k":"p","t":"Art. 542. No dia designado, as partes serão ouvidas, mencionando-se em termo circunstanciado os pontos em que estiverem acordes e a exibição e a conferência das certidões e mais reproduções do processo apresentadas e conferidas."},{"k":"p","t":"Art. 543. O juiz determinará as diligências necessárias para a restauração, observando-se o seguinte:"},{"k":"p","t":"I - caso ainda não tenha sido proferida a sentença, reinquirir-se-ão as testemunhas podendo ser substituídas as que tiverem falecido ou se encontrarem em lugar não sabido;"},{"k":"p","t":"II - os exames periciais, quando possível, serão repetidos, e de preferência pelos mesmos peritos;"},{"k":"p","t":"III - a prova documental será reproduzida por meio de cópia autêntica ou, quando impossível, por meio de testemunhas;"},{"k":"p","t":"IV - poderão também ser inquiridas sobre os atos do processo, que deverá ser restaurado, as autoridades, os serventuários, os peritos e mais pessoas que tenham nele funcionado;"},{"k":"p","t":"V - o Ministério Público e as partes poderão oferecer testemunhas e produzir documentos, para provar o teor do processo extraviado ou destruído."},{"k":"p","t":"Art. 544. Realizadas as diligências que, salvo motivo de força maior, deverão concluir-se dentro de vinte dias, serão os autos conclusos para julgamento."},{"k":"p","t":"Parágrafo único. No curso do processo, e depois de subirem os autos conclusos para sentença, o juiz poderá, dentro em cinco dias, requisitar de autoridades ou de repartições todos os esclarecimentos para a restauração."},{"k":"p","t":"Art. 545. Os selos e as taxas judiciárias, já pagos nos autos originais, não serão novamente cobrados."},{"k":"p","t":"Art. 546. Os causadores de extravio de autos responderão pelas custas, em dobro, sem prejuízo da responsabilidade criminal."},{"k":"p","t":"Art. 547. Julgada a restauração, os autos respectivos valerão pelos originais."},{"k":"p","t":"Parágrafo único. Se no curso da restauração aparecerem os autos originais, nestes continuará o processo, apensos a eles os autos da restauração."},{"k":"p","t":"Art. 548. Até à decisão que julgue restaurados os autos, a sentença condenatória em execução continuará a produzir efeito, desde que conste da respectiva guia arquivada na cadeia ou na penitenciária, onde o réu estiver cumprindo a pena, ou de registro que torne a sua existência inequívoca."}]},{"id":"s7","title":"TÍTULO II — DOS RECURSOS EM GERAL · arts. 574 a 606","tag":"","b":[{"k":"h","t":"TÍTULO II — DOS RECURSOS EM GERAL"},{"k":"h","t":"CAPÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 574. Os recursos serão voluntários, excetuandose os seguintes casos, em que deverão ser interpostos, de ofício, pelo juiz:"},{"k":"p","t":"I - da sentença que conceder habeas corpus;"},{"k":"p","t":"II - da que absolver desde logo o réu com fundamento na existência de circunstância que exclua o crime ou isente o réu de pena, nos termos do art. 411."},{"k":"p","t":"Art. 575. Não serão prejudicados os recursos que, por erro, falta ou omissão dos funcionários, não tiverem seguimento ou não forem apresentados dentro do prazo."},{"k":"p","t":"Art. 576. O Ministério Público não poderá desistir de recurso que haja interposto."},{"k":"p","t":"Art. 577. O recurso poderá ser interposto pelo Ministério Público, ou pelo querelante, ou pelo réu, seu procurador ou seu defensor."},{"k":"p","t":"Parágrafo único. Não se admitirá, entretanto, recurso da parte que não tiver interesse na reforma ou modificação da decisão."},{"k":"p","t":"Art. 578. O recurso será interposto por petição ou por termo nos autos, assinado pelo recorrente ou por seu representante."},{"k":"p","t":"§ 1o Não sabendo ou não podendo o réu assinar o nome, o termo será assinado por alguém, a seu rogo, na presença de duas testemunhas."},{"k":"p","t":"§ 2o A petição de interposição de recurso, com o despacho do juiz, será, até o dia seguinte ao último do prazo, entregue ao escrivão, que certificará no termo da juntada a data da entrega."},{"k":"p","t":"§ 3o Interposto por termo o recurso, o escrivão, sob pena de suspensão por dez a trinta dias, fará conclusos os autos ao juiz, até o dia seguinte ao último do prazo."},{"k":"p","t":"Art. 579. Salvo a hipótese de má-fé, a parte não será prejudicada pela interposição de um recurso por outro."},{"k":"p","t":"Parágrafo único. Se o juiz, desde logo, reconhecer a impropriedade do recurso interposto pela parte, mandará processá-lo de acordo com o rito do recurso cabível."},{"k":"p","t":"Art. 580. No caso de concurso de agentes (Código Penal, art. 25), a decisão do recurso interposto por um dos réus, se fundado em motivos que não sejam de caráter exclusivamente pessoal, aproveitará aos outros."},{"k":"h","t":"CAPÍTULO II — DO RECURSO EM SENTIDO ESTRITO"},{"k":"p","t":"Art. 581. Caberá recurso, no sentido estrito, da decisão, despacho ou sentença:"},{"k":"p","t":"I - que não receber a denúncia ou a queixa;"},{"k":"p","t":"II - que concluir pela incompetência do juízo;"},{"k":"p","t":"III - que julgar procedentes as exceções, salvo a de suspeição;"},{"k":"p","t":"IV – que pronunciar o réu; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"V - que conceder, negar, arbitrar, cassar ou julgar inidônea a fiança, indeferir requerimento de prisão preventiva ou revogá-la, conceder liberdade provisória ou relaxar a prisão em flagrante; (Redação dada pela Lei nº 7.780, de 22.6.1989)"},{"k":"p","t":"VI - (Revogado pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VII - que julgar quebrada a fiança ou perdido o seu valor;"},{"k":"p","t":"VIII - que decretar a prescrição ou julgar, por outro modo, extinta a punibilidade;"},{"k":"p","t":"IX - que indeferir o pedido de reconhecimento da prescrição ou de outra causa extintiva da punibilidade;"},{"k":"p","t":"X - que conceder ou negar a ordem de habeas corpus;"},{"k":"p","t":"XI - que conceder, negar ou revogar a suspensão condicional da pena;"},{"k":"p","t":"XII - que conceder, negar ou revogar livramento condicional;"},{"k":"p","t":"XIII - que anular o processo da instrução criminal, no todo ou em parte;"},{"k":"p","t":"XIV - que incluir jurado na lista geral ou desta o excluir;"},{"k":"p","t":"XV - que denegar a apelação ou a julgar deserta;"},{"k":"p","t":"XVI - que ordenar a suspensão do processo, em virtude de questão prejudicial;"},{"k":"p","t":"XVII - que decidir sobre a unificação de penas;"},{"k":"p","t":"XVIII - que decidir o incidente de falsidade;"},{"k":"p","t":"XIX - que decretar medida de segurança, depois de transitar a sentença em julgado;"},{"k":"p","t":"XX - que impuser medida de segurança por transgressão de outra;"},{"k":"p","t":"XXI - que mantiver ou substituir a medida de segurança, nos casos do art. 774;"},{"k":"p","t":"XXII - que revogar a medida de segurança;"},{"k":"p","t":"XXIII - que deixar de revogar a medida de segurança, nos casos em que a lei admita a revogação;"},{"k":"p","t":"XXIV - que converter a multa em detenção ou em prisão simples."},{"k":"p","t":"XXV - que recusar homologação à proposta de acordo de não persecução penal, previsto no art. 28-A desta Lei. (Incluído pela Lei nº 13.964, de 2019) (Vigência)"},{"k":"p","t":"Art. 582 - Os recursos serão sempre para o Tribunal de Apelação, salvo nos casos dos ns. V, X e XIV."},{"k":"p","t":"Parágrafo único. O recurso, no caso do no XIV, será para o presidente do Tribunal de Apelação."},{"k":"p","t":"Art. 583. Subirão nos próprios autos os recursos:"},{"k":"p","t":"I - quando interpostos de oficio;"},{"k":"p","t":"II - nos casos do art. 581, I, III, IV, VI, VIII e X;"},{"k":"p","t":"III - quando o recurso não prejudicar o andamento do processo."},{"k":"p","t":"Parágrafo único. O recurso da pronúncia subirá em traslado, quando, havendo dois ou mais réus, qualquer deles se conformar com a decisão ou todos não tiverem sido ainda intimados da pronúncia."},{"k":"p","t":"Art. 584. Os recursos terão efeito suspensivo nos casos de perda da fiança, de concessão de livramento condicional e dos ns. XV, XVII e XXIV do art. 581."},{"k":"p","t":"§ 1o Ao recurso interposto de sentença de impronúncia ou no caso do no VIII do art. 581, aplicarse-á o disposto nos arts. 596 e 598."},{"k":"p","t":"§ 2o O recurso da pronúncia suspenderá tão-somente o julgamento."},{"k":"p","t":"§ 3o O recurso do despacho que julgar quebrada a fiança suspenderá unicamente o efeito de perda da metade do seu valor."},{"k":"p","t":"Art. 585. O réu não poderá recorrer da pronúncia senão depois de preso, salvo se prestar fiança, nos casos em que a lei a admitir."},{"k":"p","t":"Art. 586. O recurso voluntário poderá ser interposto no prazo de cinco dias."},{"k":"p","t":"Parágrafo único. No caso do art. 581, XIV, o prazo será de vinte dias, contado da data da publicação definitiva da lista de jurados."},{"k":"p","t":"Art. 587. Quando o recurso houver de subir por instrumento, a parte indicará, no respectivo termo, ou em requerimento avulso, as peças dos autos de que pretenda traslado."},{"k":"p","t":"Parágrafo único. O traslado será extraído, conferido e concertado no prazo de cinco dias, e dele constarão sempre a decisão recorrida, a certidão de sua intimação, se por outra forma não for possível verificarse a oportunidade do recurso, e o termo de interposição."},{"k":"p","t":"Art. 588. Dentro de dois dias, contados da interposição do recurso, ou do dia em que o escrivão, extraído o traslado, o fizer com vista ao recorrente, este oferecerá as razões e, em seguida, será aberta vista ao recorrido por igual prazo."},{"k":"p","t":"Parágrafo único. Se o recorrido for o réu, será intimado do prazo na pessoa do defensor."},{"k":"p","t":"Art. 589. Com a resposta do recorrido ou sem ela, será o recurso concluso ao juiz, que, dentro de dois dias, reformará ou sustentará o seu despacho, mandando instruir o recurso com os traslados que Ihe parecerem necessários."},{"k":"p","t":"Parágrafo único. Se o juiz reformar o despacho recorrido, a parte contrária, por simples petição, poderá recorrer da nova decisão, se couber recurso, não sendo mais lícito ao juiz modificá-la. Neste caso, independentemente de novos arrazoados, subirá o recurso nos próprios autos ou em traslado."},{"k":"p","t":"Art. 590. Quando for impossível ao escrivão extrair o traslado no prazo da lei, poderá o juiz prorrogá-lo até o dobro."},{"k":"p","t":"Art. 591. Os recursos serão apresentados ao juiz ou tribunal ad quem, dentro de cinco dias da publicação da resposta do juiz a quo, ou entregues ao Correio dentro do mesmo prazo."},{"k":"p","t":"Art. 592. Publicada a decisão do juiz ou do tribunal ad quem, deverão os autos ser devolvidos, dentro de cinco dias, ao juiz a quo."},{"k":"h","t":"CAPÍTULO III — DA APELAÇÃO"},{"k":"p","t":"Art. 593. Caberá apelação no prazo de 5 (cinco) dias: (Redação dada pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"I - das sentenças definitivas de condenação ou absolvição proferidas por juiz singular; (Redação dada pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"II - das decisões definitivas, ou com força de definitivas, proferidas por juiz singular nos casos não previstos no Capítulo anterior; (Redação dada pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"III - das decisões do Tribunal do Júri, quando: (Redação dada pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"a) ocorrer nulidade posterior à pronúncia; (Redação dada pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"b) for a sentença do juiz-presidente contrária à lei expressa ou à decisão dos jurados; (Redação dada pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"c) houver erro ou injustiça no tocante à aplicação da pena ou da medida de segurança; (Redação dada pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"d) for a decisão dos jurados manifestamente contrária à prova dos autos. (Incluído pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"§ 1o Se a sentença do juiz-presidente for contrária à lei expressa ou divergir das respostas dos jurados aos quesitos, o tribunal ad quem fará a devida retificação. (Incluído pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"§ 2o Interposta a apelação com fundamento no no III, c, deste artigo, o tribunal ad quem, se Ihe der provimento, retificará a aplicação da pena ou da medida de segurança. (Incluído pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"§ 3o Se a apelação se fundar no no III, d, deste artigo, e o tribunal ad quem se convencer de que a decisão dos jurados é manifestamente contrária à prova dos autos, dar-lhe-á provimento para sujeitar o réu a novo julgamento; não se admite, porém, pelo mesmo motivo, segunda apelação. (Incluído pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"§ 4o Quando cabível a apelação, não poderá ser usado o recurso em sentido estrito, ainda que somente de parte da decisão se recorra. (Parágrafo único renumerado pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"Art. 594. (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 595. (Revogado pela Lei nº 12.403, de 2011)."},{"k":"p","t":"Art. 596. A apelação da sentença absolutória não impedirá que o réu seja posto imediatamente em liberdade. (Redação dada pela Lei nº 5.941, de 22.11.1973)"},{"k":"p","t":"Parágrafo único. A apelação não suspenderá a execução da medida de segurança aplicada provisoriamente. (Redação dada pela Lei nº 5.941, de 22.11.1973)"},{"k":"p","t":"Art. 597. A apelação de sentença condenatória terá efeito suspensivo, salvo o disposto no art. 393, a aplicação provisória de interdições de direitos e de medidas de segurança (arts. 374 e 378), e o caso de suspensão condicional de pena."},{"k":"p","t":"Art. 598. Nos crimes de competência do Tribunal do Júri, ou do juiz singular, se da sentença não for interposta apelação pelo Ministério Público no prazo legal, o ofendido ou qualquer das pessoas enumeradas no art. 31, ainda que não se tenha habilitado como assistente, poderá interpor apelação, que não terá, porém, efeito suspensivo."},{"k":"p","t":"Parágrafo único. O prazo para interposição desse recurso será de quinze dias e correrá do dia em que terminar o do Ministério Público."},{"k":"p","t":"Art. 599. As apelações poderão ser interpostas quer em relação a todo o julgado, quer em relação a parte dele."},{"k":"p","t":"Art. 600. Assinado o termo de apelação, o apelante e, depois dele, o apelado terão o prazo de oito dias cada um para oferecer razões, salvo nos processos de contravenção, em que o prazo será de três dias."},{"k":"p","t":"§ 1o Se houver assistente, este arrazoará, no prazo de três dias, após o Ministério Público."},{"k":"p","t":"§ 2o Se a ação penal for movida pela parte ofendida, o Ministério Público terá vista dos autos, no prazo do parágrafo anterior."},{"k":"p","t":"§ 3o Quando forem dois ou mais os apelantes ou apelados, os prazos serão comuns."},{"k":"p","t":"§ 4o Se o apelante declarar, na petição ou no termo, ao interpor a apelação, que deseja arrazoar na superior instância serão os autos remetidos ao tribunal ad quem onde será aberta vista às partes, observados os prazos legais, notificadas as partes pela publicação oficial. (Incluído pela Lei nº 4.336, de 1º.6.1964)"},{"k":"p","t":"Art. 601. Findos os prazos para razões, os autos serão remetidos à instância superior, com as razões ou sem elas, no prazo de 5 (cinco) dias, salvo no caso do art. 603, segunda parte, em que o prazo será de trinta dias."},{"k":"p","t":"§ 1o Se houver mais de um réu, e não houverem todos sido julgados, ou não tiverem todos apelado, caberá ao apelante promover extração do traslado dos autos, o qual deverá ser remetido à instância superior no prazo de trinta dias, contado da data da entrega das últimas razões de apelação, ou do vencimento do prazo para a apresentação das do apelado."},{"k":"p","t":"§ 2o As despesas do traslado correrão por conta de quem o solicitar, salvo se o pedido for de réu pobre ou do Ministério Público."},{"k":"p","t":"Art. 602. Os autos serão, dentro dos prazos do artigo anterior, apresentados ao tribunal ad quem ou entregues ao Correio, sob registro."},{"k":"p","t":"Art. 603. A apelação subirá nos autos originais e, a não ser no Distrito Federal e nas comarcas que forem sede de Tribunal de Apelação, ficará em cartório traslado dos termos essenciais do processo referidos no art. 564, n. III."},{"k":"p","t":"Art. 604. (Revogado pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"Art. 605. (Revogado pela Lei nº 263, de 23.2.1948)"},{"k":"p","t":"Art. 606. (Revogado pela Lei nº 263, de 23.2.1948)"}]},{"id":"s8","title":"CAPÍTULO IV — DO PROTESTO POR NOVO JÚRI · arts. 607 a 646","tag":"","b":[{"k":"h","t":"CAPÍTULO IV — DO PROTESTO POR NOVO JÚRI"},{"k":"p","t":"(Revogado pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 607. (Revogado pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 608. (Revogado pela Lei nº 11.689, de 2008)"},{"k":"h","t":"CAPÍTULO V — DO PROCESSO E DO JULGAMENTO DOS RECURSOS EM SENTIDO ESTRITO E DAS APELAÇÕES, NOS TRIBUNAIS DE APELAÇÃO"},{"k":"p","t":"Art. 609. Os recursos, apelações e embargos serão julgados pelos Tribunais de Justiça, câmaras ou turmas criminais, de acordo com a competência estabelecida nas leis de organização judiciária. (Redação dada pela Lei nº 1.720-B, de 3.11.1952)"},{"k":"p","t":"Parágrafo único. Quando não for unânime a decisão de segunda instância, desfavorável ao réu, admitem-se embargos infringentes e de nulidade, que poderão ser opostos dentro de 10 (dez) dias, a contar da publicação de acórdão, na forma do art. 613. Se o desacordo for parcial, os embargos serão restritos à matéria objeto de divergência. (Incluído pela Lei nº 1.720-B, de 3.11.1952)"},{"k":"p","t":"Art. 610. Nos recursos em sentido estrito, com exceção do de habeas corpus, e nas apelações interpostas das sentenças em processo de contravenção ou de crime a que a lei comine pena de detenção, os autos irão imediatamente com vista ao procurador-geral pelo prazo de cinco dias, e, em seguida, passarão, por igual prazo, ao relator, que pedirá designação de dia para o julgamento."},{"k":"p","t":"Parágrafo único. Anunciado o julgamento pelo presidente, e apregoadas as partes, com a presença destas ou à sua revelia, o relator fará a exposição do feito e, em seguida, o presidente concederá, pelo prazo de 10 (dez) minutos, a palavra aos advogados ou às partes que a solicitarem e ao procurador-geral, quando o requerer, por igual prazo."},{"k":"p","t":"Art. 612. Os recursos de habeas corpus, designado o relator, serão julgados na primeira sessão."},{"k":"p","t":"Art. 613. As apelações interpostas das sentenças proferidas em processos por crime a que a lei comine pena de reclusão, deverão ser processadas e julgadas pela forma estabelecida no Art. 610, com as seguintes modificações:"},{"k":"p","t":"I - exarado o relatório nos autos, passarão estes ao revisor, que terá igual prazo para o exame do processo e pedirá designação de dia para o julgamento;"},{"k":"p","t":"II - os prazos serão ampliados ao dobro;"},{"k":"p","t":"III - o tempo para os debates será de um quarto de hora."},{"k":"p","t":"Art. 614. No caso de impossibilidade de observância de qualquer dos prazos marcados nos arts. 610 e 613, os motivos da demora serão declarados nos autos."},{"k":"p","t":"Art. 615. O tribunal decidirá por maioria de votos."},{"k":"p","t":"§ 1o Havendo empate de votos no julgamento de recursos, se o presidente do tribunal, câmara ou turma, não tiver tomado parte na votação, proferirá o voto de desempate; no caso contrário, prevalecerá a decisão mais favorável ao réu."},{"k":"p","t":"§ 2o O acórdão será apresentado à conferência na primeira sessão seguinte à do julgamento, ou no prazo de duas sessões, pelo juiz incumbido de lavrá-lo."},{"k":"p","t":"Art. 616. No julgamento das apelações poderá o tribunal, câmara ou turma proceder a novo interrogatório do acusado, reinquirir testemunhas ou determinar outras diligências."},{"k":"p","t":"Art. 617. O tribunal, câmara ou turma atenderá nas suas decisões ao disposto nos arts. 383, 386 e 387, no que for aplicável, não podendo, porém, ser agravada a pena, quando somente o réu houver apelado da sentença."},{"k":"p","t":"Art. 618. Os regimentos dos Tribunais de Apelação estabelecerão as normas complementares para o processo e julgamento dos recursos e apelações."},{"k":"h","t":"CAPÍTULO VI — DOS EMBARGOS"},{"k":"p","t":"Art. 619. Aos acórdãos proferidos pelos Tribunais de Apelação, câmaras ou turmas, poderão ser opostos embargos de declaração, no prazo de dois dias contados da sua publicação, quando houver na sentença ambiguidade, obscuridade, contradição ou omissão."},{"k":"p","t":"Art. 620. Os embargos de declaração serão deduzidos em requerimento de que constem os pontos em que o acórdão é ambíguo, obscuro, contraditório ou omisso."},{"k":"p","t":"§ 1o O requerimento será apresentado pelo relator e julgado, independentemente de revisão, na primeira sessão."},{"k":"p","t":"§ 2o Se não preenchidas as condições enumeradas neste artigo, o relator indeferirá desde logo o requerimento."},{"k":"h","t":"CAPÍTULO VII — DA REVISÃO"},{"k":"p","t":"Art. 621. A revisão dos processos findos será admitida:"},{"k":"p","t":"I - quando a sentença condenatória for contrária ao texto expresso da lei penal ou à evidência dos autos;"},{"k":"p","t":"II - quando a sentença condenatória se fundar em depoimentos, exames ou documentos comprovadamente falsos;"},{"k":"p","t":"III - quando, após a sentença, se descobrirem novas provas de inocência do condenado ou de circunstância que determine ou autorize diminuição especial da pena."},{"k":"p","t":"Art. 622. A revisão poderá ser requerida em qualquer tempo, antes da extinção da pena ou após."},{"k":"p","t":"Parágrafo único. Não será admissível a reiteração do pedido, salvo se fundado em novas provas."},{"k":"p","t":"Art. 623. A revisão poderá ser pedida pelo próprio réu ou por procurador legalmente habilitado ou, no caso de morte do réu, pelo cônjuge, ascendente, descendente ou irmão."},{"k":"p","t":"Art. 624. As revisões criminais serão processadas e julgadas: (Redação dada pelo Decreto-lei nº 504, de 18.3.1969)"},{"k":"p","t":"I - pelo Supremo Tribunal Federal, quanto às condenações por ele proferidas; (Redação dada pelo Decreto-lei nº 504, de 18.3.1969)"},{"k":"p","t":"II - pelo Tribunal Federal de Recursos, Tribunais de Justiça ou de Alçada, nos demais casos. (Redação dada pelo Decreto-lei nº 504, de 18.3.1969)"},{"k":"p","t":"§ 1o No Supremo Tribunal Federal e no Tribunal Federal de Recursos o processo e julgamento obedecerão ao que for estabelecido no respectivo regimento interno. (Incluído pelo Decreto-lei nº 504, de 18.3.1969)"},{"k":"p","t":"§ 2o Nos Tribunais de Justiça ou de Alçada, o julgamento será efetuado pelas câmaras ou turmas criminais, reunidas em sessão conjunta, quando houver mais de uma, e, no caso contrário, pelo tribunal pleno. (Incluído pelo Decreto-lei nº 504, de 18.3.1969)"},{"k":"p","t":"§ 3o Nos tribunais onde houver quatro ou mais câmaras ou turmas criminais, poderão ser constituídos dois ou mais grupos de câmaras ou turmas para o julgamento de revisão, obedecido o que for estabelecido no respectivo regimento interno. (Incluído pelo Decreto-lei nº 504, de 18.3.1969)"},{"k":"p","t":"Art. 625. O requerimento será distribuído a um relator e a um revisor, devendo funcionar como relator um desembargador que não tenha pronunciado decisão em qualquer fase do processo."},{"k":"p","t":"§ 1o O requerimento será instruído com a certidão de haver passado em julgado a sentença condenatória e com as peças necessárias à comprovação dos fatos argüidos."},{"k":"p","t":"§ 2o O relator poderá determinar que se apensem os autos originais, se daí não advier dificuldade à execução normal da sentença."},{"k":"p","t":"§ 3o Se o relator julgar insuficientemente instruído o pedido e inconveniente ao interesse da justiça que se apensem os autos originais, indeferi-lo-á in limine, dando recurso para as câmaras reunidas ou para o tribunal, conforme o caso (art. 624, parágrafo único)."},{"k":"p","t":"§ 4o Interposto o recurso por petição e independentemente de termo, o relator apresentará o processo em mesa para o julgamento e o relatará, sem tomar parte na discussão."},{"k":"p","t":"§ 5o Se o requerimento não for indeferido in limine, abrir-se-á vista dos autos ao procurador-geral, que dará parecer no prazo de dez dias. Em seguida, examinados os autos, sucessivamente, em igual prazo, pelo relator e revisor, julgar-se-á o pedido na sessão que o presidente designar."},{"k":"p","t":"Art. 626. Julgando procedente a revisão, o tribunal poderá alterar a classificação da infração, absolver o réu, modificar a pena ou anular o processo."},{"k":"p","t":"Parágrafo único. De qualquer maneira, não poderá ser agravada a pena imposta pela decisão revista."},{"k":"p","t":"Art. 627. A absolvição implicará o restabelecimento de todos os direitos perdidos em virtude da condenação, devendo o tribunal, se for caso, impor a medida de segurança cabível."},{"k":"p","t":"Art. 628. Os regimentos internos dos Tribunais de Apelação estabelecerão as normas complementares para o processo e julgamento das revisões criminais."},{"k":"p","t":"Art. 629. À vista da certidão do acórdão que cassar a sentença condenatória, o juiz mandará juntá-la imediatamente aos autos, para inteiro cumprimento da decisão."},{"k":"p","t":"Art. 630. O tribunal, se o interessado o requerer, poderá reconhecer o direito a uma justa indenização pelos prejuízos sofridos."},{"k":"p","t":"§ 1o Por essa indenização, que será liquidada no juízo cível, responderá a União, se a condenação tiver sido proferida pela justiça do Distrito Federal ou de Território, ou o Estado, se o tiver sido pela respectiva justiça."},{"k":"p","t":"§ 2o A indenização não será devida:"},{"k":"p","t":"a) se o erro ou a injustiça da condenação proceder de ato ou falta imputável ao próprio impetrante, como a confissão ou a ocultação de prova em seu poder;"},{"k":"p","t":"b) se a acusação houver sido meramente privada."},{"k":"p","t":"Art. 631. Quando, no curso da revisão, falecer a pessoa, cuja condenação tiver de ser revista, o presidente do tribunal nomeará curador para a defesa."},{"k":"h","t":"CAPÍTULO VIII — DO RECURSO EXTRAORDINÁRIO"},{"k":"p","t":"Art. 632. (Revogado pela Lei nº 3.396, de 2.6.1958):"},{"k":"p","t":"Art. 633. (Revogado pela Lei nº 3.396, de 2.6.1958):"},{"k":"p","t":"Art. 634. (Revogado pela Lei nº 3.396, de 2.6.1958):"},{"k":"p","t":"Art. 635. (Revogado pela Lei nº 3.396, de 2.6.1958):"},{"k":"p","t":"Art. 636. (Revogado pela Lei nº 3.396, de 2.6.1958):"},{"k":"p","t":"Art. 637. O recurso extraordinário não tem efeito suspensivo, e uma vez arrazoados pelo recorrido os autos do traslado, os originais baixarão à primeira instância, para a execução da sentença."},{"k":"p","t":"Art. 638. O recurso extraordinário e o recurso especial serão processados e julgados no Supremo Tribunal Federal e no Superior Tribunal de Justiça na forma estabelecida por leis especiais, pela lei processual civil e pelos respectivos regimentos internos. (Redação dada pela Lei nº 13.964, de 2019)"},{"k":"h","t":"CAPÍTULO IX — DA CARTA TESTEMUNHÁVEL"},{"k":"p","t":"Art. 639. Dar-se-á carta testemunhável:"},{"k":"p","t":"I - da decisão que denegar o recurso;"},{"k":"p","t":"II - da que, admitindo embora o recurso, obstar à sua expedição e seguimento para o juízo ad quem."},{"k":"p","t":"Art. 640. A carta testemunhável será requerida ao escrivão, ou ao secretário do tribunal, conforme o caso, nas quarenta e oito horas seguintes ao despacho que denegar o recurso, indicando o requerente as peças do processo que deverão ser trasladadas."},{"k":"p","t":"Art. 641. O escrivão, ou o secretário do tribunal, dará recibo da petição à parte e, no prazo máximo de cinco dias, no caso de recurso no sentido estrito, ou de sessenta dias, no caso de recurso extraordinário, fará entrega da carta, devidamente conferida e concertada."},{"k":"p","t":"Art. 642. O escrivão, ou o secretário do tribunal, que se negar a dar o recibo, ou deixar de entregar, sob qualquer pretexto, o instrumento, será suspenso por trinta dias. O juiz, ou o presidente do Tribunal de Apelação, em face de representação do testemunhante, imporá a pena e mandará que seja extraído o instrumento, sob a mesma sanção, pelo substituto do escrivão ou do secretário do tribunal. Se o testemunhante não for atendido, poderá reclamar ao presidente do tribunal ad quem, que avocará os autos, para o efeito do julgamento do recurso e imposição da pena."},{"k":"p","t":"Art. 643. Extraído e autuado o instrumento, observarse-á o disposto nos arts. 588 a 592, no caso de recurso em sentido estrito, ou o processo estabelecido para o recurso extraordinário, se deste se tratar."},{"k":"p","t":"Art. 644. O tribunal, câmara ou turma a que competir o julgamento da carta, se desta tomar conhecimento, mandará processar o recurso, ou, se estiver suficientemente instruída, decidirá logo, de meritis."},{"k":"p","t":"Art. 645. O processo da carta testemunhável na instância superior seguirá o processo do recurso denegado."},{"k":"p","t":"Art. 646. A carta testemunhável não terá efeito suspensivo."}]},{"id":"s9","title":"CAPÍTULO X — DO HABEAS CORPUS E SEU PROCESSO · arts. 647 a 667","tag":"","b":[{"k":"h","t":"CAPÍTULO X — DO HABEAS CORPUS E SEU PROCESSO"},{"k":"p","t":"Art. 647. Dar-se-á habeas corpus sempre que alguém sofrer ou se achar na iminência de sofrer violência ou coação ilegal na sua liberdade de ir e vir, salvo nos casos de punição disciplinar."},{"k":"p","t":"Art. 648. A coação considerar-se-á ilegal:"},{"k":"p","t":"I - quando não houver justa causa;"},{"k":"p","t":"II - quando alguém estiver preso por mais tempo do que determina a lei;"},{"k":"p","t":"III - quando quem ordenar a coação não tiver competência para fazê-lo;"},{"k":"p","t":"IV - quando houver cessado o motivo que autorizou a coação;"},{"k":"p","t":"V - quando não for alguém admitido a prestar fiança, nos casos em que a lei a autoriza;"},{"k":"p","t":"VI - quando o processo for manifestamente nulo;"},{"k":"p","t":"VII - quando extinta a punibilidade."},{"k":"p","t":"Art. 649. O juiz ou o tribunal, dentro dos limites da sua jurisdição, fará passar imediatamente a ordem impetrada, nos casos em que tenha cabimento, seja qual for a autoridade coatora."},{"k":"p","t":"Art. 650. Competirá conhecer, originariamente, do pedido de habeas corpus:"},{"k":"p","t":"I - ao Supremo Tribunal Federal, nos casos previstos no Art. 101, I, g, da Constituição;"},{"k":"p","t":"II - aos Tribunais de Apelação, sempre que os atos de violência ou coação forem atribuídos aos governadores ou interventores dos Estados ou Territórios e ao prefeito do Distrito Federal, ou a seus secretários, ou aos chefes de Polícia."},{"k":"p","t":"§ 1o A competência do juiz cessará sempre que a violência ou coação provier de autoridade judiciária de igual ou superior jurisdição."},{"k":"p","t":"§ 2o Não cabe o habeas corpus contra a prisão administrativa, atual ou iminente, dos responsáveis por dinheiro ou valor pertencente à Fazenda Pública, alcançados ou omissos em fazer o seu recolhimento nos prazos legais, salvo se o pedido for acompanhado de prova de quitação ou de depósito do alcance verificado, ou se a prisão exceder o prazo legal."},{"k":"p","t":"Art. 651. A concessão do habeas corpus não obstará, nem porá termo ao processo, desde que este não esteja em conflito com os fundamentos daquela."},{"k":"p","t":"Art. 652. Se o habeas corpus for concedido em virtude de nulidade do processo, este será renovado."},{"k":"p","t":"Art. 653. Ordenada a soltura do paciente em virtude de habeas corpus, será condenada nas custas a autoridade que, por má-fé ou evidente abuso de poder, tiver determinado a coação."},{"k":"p","t":"Parágrafo único. Neste caso, será remetida ao Ministério Público cópia das peças necessárias para ser promovida a responsabilidade da autoridade."},{"k":"p","t":"Art. 654. O habeas corpus poderá ser impetrado por qualquer pessoa, em seu favor ou de outrem, bem como pelo Ministério Público."},{"k":"p","t":"§ 1o A petição de habeas corpus conterá:"},{"k":"p","t":"a) o nome da pessoa que sofre ou está ameaçada de sofrer violência ou coação e o de quem exercer a violência, coação ou ameaça;"},{"k":"p","t":"b) a declaração da espécie de constrangimento ou, em caso de simples ameaça de coação, as razões em que funda o seu temor;"},{"k":"p","t":"c) a assinatura do impetrante, ou de alguém a seu rogo, quando não souber ou não puder escrever, e a designação das respectivas residências."},{"k":"p","t":"§ 2o Os juízes e os tribunais têm competência para expedir de ofício ordem de habeas corpus, quando no curso de processo verificarem que alguém sofre ou está na iminência de sofrer coação ilegal."},{"k":"p","t":"Art. 655. O carcereiro ou o diretor da prisão, o escrivão, o oficial de justiça ou a autoridade judiciária ou policial que embaraçar ou procrastinar a expedição de ordem de habeas corpus, as informações sobre a causa da prisão, a condução e apresentação do paciente, ou a sua soltura, será multado na quantia de duzentos mil-réis a um conto de réis, sem prejuízo das penas em que incorrer. As multas serão impostas pelo juiz do tribunal que julgar o habeas corpus, salvo quando se tratar de autoridade judiciária, caso em que caberá ao Supremo Tribunal Federal ou ao Tribunal de Apelação impor as multas."},{"k":"p","t":"Art. 656. Recebida a petição de habeas corpus, o juiz, se julgar necessário, e estiver preso o paciente, mandará que este Ihe seja imediatamente apresentado em dia e hora que designar."},{"k":"p","t":"Parágrafo único. Em caso de desobediência, será expedido mandado de prisão contra o detentor, que será processado na forma da lei, e o juiz providenciará para que o paciente seja tirado da prisão e apresentado em juízo."},{"k":"p","t":"Art. 657. Se o paciente estiver preso, nenhum motivo escusará a sua apresentação, salvo:"},{"k":"p","t":"I - grave enfermidade do paciente; Il - não estar ele sob a guarda da pessoa a quem se atribui a detenção;"},{"k":"p","t":"III - se o comparecimento não tiver sido determinado pelo juiz ou pelo tribunal."},{"k":"p","t":"Parágrafo único. O juiz poderá ir ao local em que o paciente se encontrar, se este não puder ser apresentado por motivo de doença."},{"k":"p","t":"Art. 658. O detentor declarará à ordem de quem o paciente estiver preso."},{"k":"p","t":"Art. 659. Se o juiz ou o tribunal verificar que já cessou a violência ou coação ilegal, julgará prejudicado o pedido."},{"k":"p","t":"Art. 660. Efetuadas as diligências, e interrogado o paciente, o juiz decidirá, fundamentadamente, dentro de 24 (vinte e quatro) horas."},{"k":"p","t":"§ 1o Se a decisão for favorável ao paciente, será logo posto em liberdade, salvo se por outro motivo dever ser mantido na prisão."},{"k":"p","t":"§ 2o Se os documentos que instruírem a petição evidenciarem a ilegalidade da coação, o juiz ou o tribunal ordenará que cesse imediatamente o constrangimento."},{"k":"p","t":"§ 3o Se a ilegalidade decorrer do fato de não ter sido o paciente admitido a prestar fiança, o juiz arbitrará o valor desta, que poderá ser prestada perante ele, remetendo, neste caso, à autoridade os respectivos autos, para serem anexados aos do inquérito policial ou aos do processo judicial."},{"k":"p","t":"§ 4o Se a ordem de habeas corpus for concedida para evitar ameaça de violência ou coação ilegal, dar-se-á ao paciente salvo-conduto assinado pelo juiz."},{"k":"p","t":"§ 5o Será incontinenti enviada cópia da decisão à autoridade que tiver ordenado a prisão ou tiver o paciente à sua disposição, a fim de juntar-se aos autos do processo."},{"k":"p","t":"§ 6o Quando o paciente estiver preso em lugar que não seja o da sede do juízo ou do tribunal que conceder a ordem, o alvará de soltura será expedido pelo telégrafo, se houver, observadas as formalidades estabelecidas no art. 289, parágrafo único, in fine, ou por via postal."},{"k":"p","t":"Art. 661. Em caso de competência originária do Tribunal de Apelação, a petição de habeas corpus será apresentada ao secretário, que a enviará imediatamente ao presidente do tribunal, ou da câmara criminal, ou da turma, que estiver reunida, ou primeiro tiver de reunir-se."},{"k":"p","t":"Art. 662. Se a petição contiver os requisitos do art. 654, § 1o, o presidente, se necessário, requisitará da autoridade indicada como coatora informações por escrito. Faltando, porém, qualquer daqueles requisitos, o presidente mandará preenchêlo, logo que Ihe for apresentada a petição."},{"k":"p","t":"Art. 663. As diligências do artigo anterior não serão ordenadas, se o presidente entender que o habeas corpus deva ser indeferido in limine. Nesse caso, levará a petição ao tribunal, câmara ou turma, para que delibere a respeito."},{"k":"p","t":"Art. 664. Recebidas as informações, ou dispensadas, o habeas corpus será julgado na primeira sessão, podendo, entretanto, adiar-se o julgamento para a sessão seguinte."},{"k":"p","t":"Parágrafo único. A decisão será tomada por maioria de votos. Havendo empate, se o presidente não tiver tomado parte na votação, proferirá voto de desempate; no caso contrário, prevalecerá a decisão mais favorável ao paciente."},{"k":"p","t":"Art. 665. O secretário do tribunal lavrará a ordem que, assinada pelo presidente do tribunal, câmara ou turma, será dirigida, por ofício ou telegrama, ao detentor, ao carcereiro ou autoridade que exercer ou ameaçar exercer o constrangimento."},{"k":"p","t":"Parágrafo único. A ordem transmitida por telegrama obedecerá ao disposto no art. 289, parágrafo único, in fine."},{"k":"p","t":"Art. 666. Os regimentos dos Tribunais de Apelação estabelecerão as normas complementares para o processo e julgamento do pedido de habeas corpus de sua competência originária."},{"k":"p","t":"Art. 667. No processo e julgamento do habeas corpus de competência originária do Supremo Tribunal Federal, bem como nos de recurso das decisões de última ou única instância, denegatórias de habeas corpus, observar-se-á, no que Ihes for aplicável, o disposto nos artigos anteriores, devendo o regimento interno do tribunal estabelecer as regras complementares."}]}],"jcr":[{"id":"s0","title":"Disposições iniciais · arts. 60 a 89","tag":"","b":[{"k":"p","t":"Lei nº 9.099/1995 Dispõe sobre os Juizados Especiais Cíveis e Criminais e dá outras providências."},{"k":"h","t":"CAPÍTULO III — DOS JUIZADOS ESPECIAIS CRIMINAIS DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 60. O Juizado Especial Criminal, provido por juízes togados ou togados e leigos, tem competência para a conciliação, o julgamento e a execução das infrações penais de menor potencial ofensivo, respeitadas as regras de conexão e continência. (Redação dada pela Lei nº 11.313, de 2006)"},{"k":"p","t":"Parágrafo único. Na reunião de processos, perante o juízo comum ou o tribunal do júri, decorrentes da aplicação das regras de conexão e continência, observar-se-ão os institutos da transação penal e da composição dos danos civis. (Incluído pela Lei nº 11.313, de 2006)"},{"k":"p","t":"Art. 61. Consideram-se infrações penais de menor potencial ofensivo, para os efeitos desta Lei, as contravenções penais e os crimes a que a lei comine pena máxima não superior a 2 (dois) anos, cumulada ou não com multa. (Redação dada pela Lei nº 11.313, de 2006)"},{"k":"p","t":"Art. 62. O processo perante o Juizado Especial orientar-se-á pelos critérios da oralidade, simplicidade, informalidade, economia processual e celeridade, objetivando, sempre que possível, a reparação dos danos sofridos pela vítima e a aplicação de pena não privativa de liberdade. (Redação dada pela Lei nº 13.603, de 2018)"},{"k":"h","t":"SEÇÃO I — DA COMPETÊNCIA E DOS ATOS PROCESSUAIS"},{"k":"p","t":"Art. 63. A competência do Juizado será determinada pelo lugar em que foi praticada a infração penal."},{"k":"p","t":"Art. 64. Os atos processuais serão públicos e poderão realizar-se em horário noturno e em qualquer dia da semana, conforme dispuserem as normas de organização judiciária."},{"k":"p","t":"Art. 65. Os atos processuais serão válidos sempre que preencherem as finalidades para as quais foram realizados, atendidos os critérios indicados no art. 62 desta Lei."},{"k":"p","t":"§ 1º Não se pronunciará qualquer nulidade sem que tenha havido prejuízo."},{"k":"p","t":"§ 2º A prática de atos processuais em outras comarcas poderá ser solicitada por qualquer meio hábil de comunicação."},{"k":"p","t":"§ 3º Serão objeto de registro escrito exclusivamente os atos havidos por essenciais. Os atos realizados em audiência de instrução e julgamento poderão ser gravados em fita magnética ou equivalente."},{"k":"p","t":"Art. 66. A citação será pessoal e far-se-á no próprio Juizado, sempre que possível, ou por mandado."},{"k":"p","t":"Parágrafo único. Não encontrado o acusado para ser citado, o Juiz encaminhará as peças existentes ao Juízo comum para adoção do procedimento previsto em lei."},{"k":"p","t":"Art. 67. A intimação far-se-á por correspondência, com aviso de recebimento pessoal ou, tratando-se de pessoa jurídica ou firma individual, mediante entrega ao encarregado da recepção, que será obrigatoriamente identificado, ou, sendo necessário, por oficial de justiça, independentemente de mandado ou carta precatória, ou ainda por qualquer meio idôneo de comunicação."},{"k":"p","t":"Parágrafo único. Dos atos praticados em audiência considerar-se-ão desde logo cientes as partes, os interessados e defensores."},{"k":"p","t":"Art. 68. Do ato de intimação do autor do fato e do mandado de citação do acusado, constará a necessidade de seu comparecimento acompanhado de advogado, com a advertência de que, na sua falta, ser-lhe-á designado defensor público."},{"k":"h","t":"SEÇÃO II — DA FASE PRELIMINAR"},{"k":"p","t":"Art. 69. A autoridade policial que tomar conhecimento da ocorrência lavrará termo circunstanciado e o encaminhará imediatamente ao Juizado, com o autor do fato e a vítima, providenciando-se as requisições dos exames periciais necessários."},{"k":"p","t":"Parágrafo único. Ao autor do fato que, após a lavratura do termo, for imediatamente encaminhado ao juizado ou assumir o compromisso de a ele comparecer, não se imporá prisão em flagrante, nem se exigirá fiança. Em caso de violência doméstica, o juiz poderá determinar, como medida de cautela, seu afastamento do lar, domicílio ou local de convivência com a vítima. (Redação dada pela Lei nº 10.455, de 13.5.2002))"},{"k":"p","t":"Art. 70. Comparecendo o autor do fato e a vítima, e não sendo possível a realização imediata da audiência preliminar, será designada data próxima, da qual ambos sairão cientes."},{"k":"p","t":"Art. 71. Na falta do comparecimento de qualquer dos envolvidos, a Secretaria providenciará sua intimação e, se for o caso, a do responsável civil, na forma dos arts. 67 e 68 desta Lei."},{"k":"p","t":"Art. 72. Na audiência preliminar, presente o representante do Ministério Público, o autor do fato e a vítima e, se possível, o responsável civil, acompanhados por seus advogados, o Juiz esclarecerá sobre a possibilidade da composição dos danos e da aceitação da proposta de aplicação imediata de pena não privativa de liberdade."},{"k":"p","t":"Art. 73. A conciliação será conduzida pelo Juiz ou por conciliador sob sua orientação."},{"k":"p","t":"Parágrafo único. Os conciliadores são auxiliares da Justiça, recrutados, na forma da lei local, preferentemente entre bacharéis em Direito, excluídos os que exerçam funções na administração da Justiça Criminal."},{"k":"p","t":"Art. 74. A composição dos danos civis será reduzida a escrito e, homologada pelo Juiz mediante sentença irrecorrível, terá eficácia de título a ser executado no juízo civil competente."},{"k":"p","t":"Parágrafo único. Tratando-se de ação penal de iniciativa privada ou de ação penal pública condicionada à representação, o acordo homologado acarreta a renúncia ao direito de queixa ou representação."},{"k":"p","t":"Art. 75. Não obtida a composição dos danos civis, será dada imediatamente ao ofendido a oportunidade de exercer o direito de representação verbal, que será reduzida a termo."},{"k":"p","t":"Parágrafo único. O não oferecimento da representação na audiência preliminar não implica decadência do direito, que poderá ser exercido no prazo previsto em lei."},{"k":"p","t":"Art. 76. Havendo representação ou tratando-se de crime de ação penal pública incondicionada, não sendo caso de arquivamento, o Ministério Público poderá propor a aplicação imediata de pena restritiva de direitos ou multas, a ser especificada na proposta."},{"k":"p","t":"§ 1º Nas hipóteses de ser a pena de multa a única aplicável, o Juiz poderá reduzi-la até a metade."},{"k":"p","t":"§ 2º Não se admitirá a proposta se ficar comprovado:"},{"k":"p","t":"I - ter sido o autor da infração condenado, pela prática de crime, à pena privativa de liberdade, por sentença definitiva;"},{"k":"p","t":"II - ter sido o agente beneficiado anteriormente, no prazo de cinco anos, pela aplicação de pena restritiva ou multa, nos termos deste artigo;"},{"k":"p","t":"III - não indicarem os antecedentes, a conduta social e a personalidade do agente, bem como os motivos e as ci
