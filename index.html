ão dada pela Lei Complementar nº 147, de 2014)"},{"k":"p","t":"III - as pessoas jurídicas qualificadas como Organização da Sociedade Civil de Interesse Público, nos termos da Lei no 9.790, de 23 de março de 1999; (Incluído pela Lei nº 12.126, de 2009)"},{"k":"p","t":"IV - as sociedades de crédito ao microempreendedor, nos termos do art. 1o da Lei no 10.194, de 14 de fevereiro de 2001. (Incluído pela Lei nº 12.126, de 2009)"},{"k":"p","t":"§ 2º O maior de dezoito anos poderá ser autor, independentemente de assistência, inclusive para fins de conciliação."},{"k":"p","t":"Art. 9º Nas causas de valor até vinte salários mínimos, as partes comparecerão pessoalmente, podendo ser assistidas por advogado; nas de valor superior, a assistência é obrigatória."},{"k":"p","t":"§ 1º Sendo facultativa a assistência, se uma das partes comparecer assistida por advogado, ou se o réu for pessoa jurídica ou firma individual, terá a outra parte, se quiser, assistência judiciária prestada por órgão instituído junto ao Juizado Especial, na forma da lei local."},{"k":"p","t":"§ 2º O Juiz alertará as partes da conveniência do patrocínio por advogado, quando a causa o recomendar."},{"k":"p","t":"§ 3º O mandato ao advogado poderá ser verbal, salvo quanto aos poderes especiais."},{"k":"p","t":"§ 4o O réu, sendo pessoa jurídica ou titular de firma individual, poderá ser representado por preposto credenciado, munido de carta de preposição com poderes para transigir, sem haver necessidade de vínculo empregatício.(Redação dada pela Lei nº 12.137, de 2009)"},{"k":"p","t":"Art. 10. Não se admitirá, no processo, qualquer forma de intervenção de terceiro nem de assistência. Admitirse-á o litisconsórcio."},{"k":"p","t":"Art. 11. O Ministério Público intervirá nos casos previstos em lei."},{"k":"h","t":"SEÇÃO IV — DOS ATOS PROCESSUAIS"},{"k":"p","t":"Art. 12. Os atos processuais serão públicos e poderão realizar-se em horário noturno, conforme dispuserem as normas de organização judiciária."},{"k":"p","t":"Art. 12-A. Na contagem de prazo em dias, estabelecido por lei ou pelo juiz, para a prática de qualquer ato processual, inclusive para a interposição de recursos, computar-se-ão somente os dias úteis. (Incluído pela Lei nº 13.728, de 2018)"},{"k":"p","t":"Art. 13. Os atos processuais serão válidos sempre que preencherem as finalidades para as quais forem realizados, atendidos os critérios indicados no art. 2º desta Lei."},{"k":"p","t":"§ 1º Não se pronunciará qualquer nulidade sem que tenha havido prejuízo."},{"k":"p","t":"§ 2º A prática de atos processuais em outras comarcas poderá ser solicitada por qualquer meio idôneo de comunicação."},{"k":"p","t":"§ 3º Apenas os atos considerados essenciais serão registrados resumidamente, em notas manuscritas, datilografadas, taquigrafadas ou estenotipadas. Os demais atos poderão ser gravados em fita magnética ou equivalente, que será inutilizada após o trânsito em julgado da decisão."},{"k":"p","t":"§ 4º As normas locais disporão sobre a conservação das peças do processo e demais documentos que o instruem."},{"k":"h","t":"SEÇÃO V — DO PEDIDO"},{"k":"p","t":"Art. 14. O processo instaurar-se-á com a apresentação do pedido, escrito ou oral, à Secretaria do Juizado."},{"k":"p","t":"§ 1º Do pedido constarão, de forma simples e em linguagem acessível:"},{"k":"p","t":"I - o nome, a qualificação e o endereço das partes;"},{"k":"p","t":"II - os fatos e os fundamentos, de forma sucinta;"},{"k":"p","t":"III - o objeto e seu valor."},{"k":"p","t":"§ 2º É lícito formular pedido genérico quando não for possível determinar, desde logo, a extensão da obrigação."},{"k":"p","t":"§ 3º O pedido oral será reduzido a escrito pela Secretaria do Juizado, podendo ser utilizado o sistema de fichas ou formulários impressos."},{"k":"p","t":"Art. 15. Os pedidos mencionados no art. 3º desta Lei poderão ser alternativos ou cumulados; nesta última hipótese, desde que conexos e a soma não ultrapasse o limite fixado naquele dispositivo."},{"k":"p","t":"Art. 16. Registrado o pedido, independentemente de distribuição e autuação, a Secretaria do Juizado designará a sessão de conciliação, a realizar-se no prazo de quinze dias."},{"k":"p","t":"Art. 17. Comparecendo inicialmente ambas as partes, instaurar-se-á, desde logo, a sessão de conciliação, dispensados o registro prévio de pedido e a citação."},{"k":"p","t":"Parágrafo único. Havendo pedidos contrapostos, poderá ser dispensada a contestação formal e ambos serão apreciados na mesma sentença."},{"k":"h","t":"SEÇÃO VI — DAS CITAÇÕES E INTIMAÇÕES"},{"k":"p","t":"Art. 18. A citação far-se-á:"},{"k":"p","t":"I - por correspondência, com aviso de recebimento em mão própria;"},{"k":"p","t":"II - tratando-se de pessoa jurídica ou firma individual, mediante entrega ao encarregado da recepção, que será obrigatoriamente identificado;"},{"k":"p","t":"III - sendo necessário, por oficial de justiça, independentemente de mandado ou carta precatória."},{"k":"p","t":"§ 1º A citação conterá cópia do pedido inicial, dia e hora para comparecimento do citando e advertência de que, não comparecendo este, considerar-se-ão verdadeiras as alegações iniciais, e será proferido julgamento, de plano."},{"k":"p","t":"§ 2º Não se fará citação por edital."},{"k":"p","t":"§ 3º O comparecimento espontâneo suprirá a falta ou nulidade da citação."},{"k":"p","t":"Art. 19. As intimações serão feitas na forma prevista para citação, ou por qualquer outro meio idôneo de comunicação."},{"k":"p","t":"§ 1º Dos atos praticados na audiência, considerar-seão desde logo cientes as partes."},{"k":"p","t":"§ 2º As partes comunicarão ao juízo as mudanças de endereço ocorridas no curso do processo, reputandose eficazes as intimações enviadas ao local anteriormente indicado, na ausência da comunicação."}]}],"fz":[{"id":"s0","title":"Disposições iniciais · arts. 1 a 28","tag":"","b":[{"k":"p","t":"Lei nº 12.153/2009 Dispõe sobre os Juizados Especiais da Fazenda Pública no âmbito dos Estados, do Distrito Federal, dos Territórios e dos Municípios. O PRESIDENTE DA REPÚBLICA Faço saber que o Congresso Nacional decreta e eu sanciono a seguinte Lei:"},{"k":"p","t":"Art. 1o Os Juizados Especiais da Fazenda Pública, órgãos da justiça comum e integrantes do Sistema dos Juizados Especiais, serão criados pela União, no Distrito Federal e nos Territórios, e pelos Estados, para conciliação, processo, julgamento e execução, nas causas de sua competência."},{"k":"p","t":"Parágrafo único. O sistema dos Juizados Especiais dos Estados e do Distrito Federal é formado pelos Juizados Especiais Cíveis, Juizados Especiais Criminais e Juizados Especiais da Fazenda Pública."},{"k":"p","t":"Art. 2o É de competência dos Juizados Especiais da Fazenda Pública processar, conciliar e julgar causas cíveis de interesse dos Estados, do Distrito Federal, dos Territórios e dos Municípios, até o valor de 60 (sessenta) salários mínimos."},{"k":"p","t":"§ 1o Não se incluem na competência do Juizado Especial da Fazenda Pública:"},{"k":"p","t":"I – as ações de mandado de segurança, de desapropriação, de divisão e demarcação, populares, por improbidade administrativa, execuções fiscais e as demandas sobre direitos ou interesses difusos e coletivos;"},{"k":"p","t":"II – as causas sobre bens imóveis dos Estados, Distrito Federal, Territórios e Municípios, autarquias e fundações públicas a eles vinculadas;"},{"k":"p","t":"III – as causas que tenham como objeto a impugnação da pena de demissão imposta a servidores públicos civis ou sanções disciplinares aplicadas a militares."},{"k":"p","t":"§ 2o Quando a pretensão versar sobre obrigações vincendas, para fins de competência do Juizado Especial, a soma de 12 (doze) parcelas vincendas e de eventuais parcelas vencidas não poderá exceder o valor referido no caput deste artigo."},{"k":"p","t":"§ 3o (VETADO)"},{"k":"p","t":"§ 4o No foro onde estiver instalado Juizado Especial da Fazenda Pública, a sua competência é absoluta."},{"k":"p","t":"Art. 3o O juiz poderá, de ofício ou a requerimento das partes, deferir quaisquer providências cautelares e antecipatórias no curso do processo, para evitar dano de difícil ou de incerta reparação."},{"k":"p","t":"Art. 4o Exceto nos casos do art. 3o, somente será admitido recurso contra a sentença."},{"k":"p","t":"Art. 5o Podem ser partes no Juizado Especial da Fazenda Pública:"},{"k":"p","t":"I – como autores, as pessoas físicas e as microempresas e empresas de pequeno porte, assim definidas na Lei Complementar no 123, de 14 de dezembro de 2006;"},{"k":"p","t":"II – como réus, os Estados, o Distrito Federal, os Territórios e os Municípios, bem como autarquias, fundações e empresas públicas a eles vinculadas."},{"k":"p","t":"Art. 6o Quanto às citações e intimações, aplicam-se as disposições contidas na Lei no 5.869, de 11 de janeiro de 1973 – Código de Processo Civil."},{"k":"p","t":"Art. 7o Não haverá prazo diferenciado para a prática de qualquer ato processual pelas pessoas jurídicas de direito público, inclusive a interposição de recursos, devendo a citação para a audiência de conciliação ser efetuada com antecedência mínima de 30 (trinta) dias."},{"k":"p","t":"Art. 8o Os representantes judiciais dos réus presentes à audiência poderão conciliar, transigir ou desistir nos processos da competência dos Juizados Especiais, nos termos e nas hipóteses previstas na lei do respectivo ente da Federação."},{"k":"p","t":"Art. 9o A entidade ré deverá fornecer ao Juizado a documentação de que disponha para o esclarecimento da causa, apresentando-a até a instalação da audiência de conciliação."},{"k":"p","t":"Art. 10. Para efetuar o exame técnico necessário à conciliação ou ao julgamento da causa, o juiz nomeará pessoa habilitada, que apresentará o laudo até 5 (cinco) dias antes da audiência."},{"k":"p","t":"Art. 11. Nas causas de que trata esta Lei, não haverá reexame necessário."},{"k":"p","t":"Art. 12. O cumprimento do acordo ou da sentença, com trânsito em julgado, que imponham obrigação de fazer, não fazer ou entrega de coisa certa, será efetuado mediante ofício do juiz à autoridade citada para a causa, com cópia da sentença ou do acordo."},{"k":"p","t":"Art. 13. Tratando-se de obrigação de pagar quantia certa, após o trânsito em julgado da decisão, o pagamento será efetuado:"},{"k":"p","t":"I – no prazo máximo de 60 (sessenta) dias, contado da entrega da requisição do juiz à autoridade citada para a causa, independentemente de precatório, na hipótese do § 3o do art. 100 da Constituição Federal; ou"},{"k":"p","t":"II – mediante precatório, caso o montante da condenação exceda o valor definido como obrigação de pequeno valor."},{"k":"p","t":"§ 1o Desatendida a requisição judicial, o juiz, imediatamente, determinará o sequestro do numerário suficiente ao cumprimento da decisão, dispensada a audiência da Fazenda Pública."},{"k":"p","t":"§ 2o As obrigações definidas como de pequeno valor a serem pagas independentemente de precatório terão como limite o que for estabelecido na lei do respectivo ente da Federação."},{"k":"p","t":"§ 3o Até que se dê a publicação das leis de que trata o § 2o, os valores serão:"},{"k":"p","t":"I – 40 (quarenta) salários mínimos, quanto aos Estados e ao Distrito Federal;"},{"k":"p","t":"II – 30 (trinta) salários mínimos, quanto aos Municípios."},{"k":"p","t":"§ 4o São vedados o fracionamento, a repartição ou a quebra do valor da execução, de modo que o pagamento se faça, em parte, na forma estabelecida no inciso I do caput e, em parte, mediante expedição de precatório, bem como a expedição de precatório complementar ou suplementar do valor pago."},{"k":"p","t":"§ 5o Se o valor da execução ultrapassar o estabelecido para pagamento independentemente do precatório, o pagamento far-se-á, sempre, por meio do precatório, sendo facultada à parte exequente a renúncia ao crédito do valor excedente, para que possa optar pelo pagamento do saldo sem o precatório."},{"k":"p","t":"§ 6o O saque do valor depositado poderá ser feito pela parte autora, pessoalmente, em qualquer agência do banco depositário, independentemente de alvará."},{"k":"p","t":"§ 7o O saque por meio de procurador somente poderá ser feito na agência destinatária do depósito, mediante procuração específica, com firma reconhecida, da qual constem o valor originalmente depositado e sua procedência."},{"k":"p","t":"Art. 14. Os Juizados Especiais da Fazenda Pública serão instalados pelos Tribunais de Justiça dos Estados e do Distrito Federal."},{"k":"p","t":"Parágrafo único. Poderão ser instalados Juizados Especiais Adjuntos, cabendo ao Tribunal designar a Vara onde funcionará."},{"k":"p","t":"Art. 15. Serão designados, na forma da legislação dos Estados e do Distrito Federal, conciliadores e juízes leigos dos Juizados Especiais da Fazenda Pública, observadas as atribuições previstas nos arts. 22, 37 e 40 da Lei no 9.099, de 26 de setembro de 1995."},{"k":"p","t":"§ 1o Os conciliadores e juízes leigos são auxiliares da Justiça, recrutados, os primeiros, preferentemente, entre os bacharéis em Direito, e os segundos, entre advogados com mais de 2 (dois) anos de experiência."},{"k":"p","t":"§ 2o Os juízes leigos ficarão impedidos de exercer a advocacia perante todos os Juizados Especiais da Fazenda Pública instalados em território nacional, enquanto no desempenho de suas funções."},{"k":"p","t":"Art. 16. Cabe ao conciliador, sob a supervisão do juiz, conduzir a audiência de conciliação."},{"k":"p","t":"§ 1o Poderá o conciliador, para fins de encaminhamento da composição amigável, ouvir as partes e testemunhas sobre os contornos fáticos da controvérsia."},{"k":"p","t":"§ 2o Não obtida a conciliação, caberá ao juiz presidir a instrução do processo, podendo dispensar novos depoimentos, se entender suficientes para o julgamento da causa os esclarecimentos já constantes dos autos, e não houver impugnação das partes."},{"k":"p","t":"Art. 17. As Turmas Recursais do Sistema dos Juizados Especiais são compostas por juízes em exercício no primeiro grau de jurisdição, na forma da legislação dos Estados e do Distrito Federal, com mandato de 2 (dois) anos, e integradas, preferencialmente, por juízes do Sistema dos Juizados Especiais."},{"k":"p","t":"§ 1o A designação dos juízes das Turmas Recursais obedecerá aos critérios de antiguidade e merecimento."},{"k":"p","t":"§ 2o Não será permitida a recondução, salvo quando não houver outro juiz na sede da Turma Recursal."},{"k":"p","t":"Art. 18. Caberá pedido de uniformização de interpretação de lei quando houver divergência entre decisões proferidas por Turmas Recursais sobre questões de direito material."},{"k":"p","t":"§ 1o O pedido fundado em divergência entre Turmas do mesmo Estado será julgado em reunião conjunta das Turmas em conflito, sob a presidência de desembargador indicado pelo Tribunal de Justiça."},{"k":"p","t":"§ 2o No caso do § 1o, a reunião de juízes domiciliados em cidades diversas poderá ser feita por meio eletrônico."},{"k":"p","t":"§ 3o Quando as Turmas de diferentes Estados derem a lei federal interpretações divergentes, ou quando a decisão proferida estiver em contrariedade com súmula do Superior Tribunal de Justiça, o pedido será por este julgado."},{"k":"p","t":"Art. 19. Quando a orientação acolhida pelas Turmas de Uniformização de que trata o § 1o do art. 18 contrariar súmula do Superior Tribunal de Justiça, a parte interessada poderá provocar a manifestação deste, que dirimirá a divergência."},{"k":"p","t":"§ 1o Eventuais pedidos de uniformização fundados em questões idênticas e recebidos subsequentemente em quaisquer das Turmas Recursais ficarão retidos nos autos, aguardando pronunciamento do Superior Tribunal de Justiça."},{"k":"p","t":"§ 2o Nos casos do caput deste artigo e do § 3o do art. 18, presente a plausibilidade do direito invocado e havendo fundado receio de dano de difícil reparação, poderá o relator conceder, de ofício ou a requerimento do interessado, medida liminar determinando a suspensão dos processos nos quais a controvérsia esteja estabelecida."},{"k":"p","t":"§ 3o Se necessário, o relator pedirá informações ao Presidente da Turma Recursal ou Presidente da Turma de Uniformização e, nos casos previstos em lei, ouvirá o Ministério Público, no prazo de 5 (cinco) dias."},{"k":"p","t":"§ 4o (VETADO)"},{"k":"p","t":"§ 5o Decorridos os prazos referidos nos §§ 3o e 4o, o relator incluirá o pedido em pauta na sessão, com preferência sobre todos os demais feitos, ressalvados os processos com réus presos, os habeas corpus e os mandados de segurança."},{"k":"p","t":"§ 6o Publicado o acórdão respectivo, os pedidos retidos referidos no § 1o serão apreciados pelas Turmas Recursais, que poderão exercer juízo de retratação ou os declararão prejudicados, se veicularem tese não acolhida pelo Superior Tribunal de Justiça."},{"k":"p","t":"Art. 20. Os Tribunais de Justiça, o Superior Tribunal de Justiça e o Supremo Tribunal Federal, no âmbito de suas competências, expedirão normas regulamentando os procedimentos a serem adotados para o processamento e o julgamento do pedido de uniformização e do recurso extraordinário."},{"k":"p","t":"Art. 21. O recurso extraordinário, para os efeitos desta Lei, será processado e julgado segundo o estabelecido no art. 19, além da observância das normas do Regimento."},{"k":"p","t":"Art. 22. Os Juizados Especiais da Fazenda Pública serão instalados no prazo de até 2 (dois) anos da vigência desta Lei, podendo haver o aproveitamento total ou parcial das estruturas das atuais Varas da Fazenda Pública."},{"k":"p","t":"Art. 23. Os Tribunais de Justiça poderão limitar, por até 5 (cinco) anos, a partir da entrada em vigor desta Lei, a competência dos Juizados Especiais da Fazenda Pública, atendendo à necessidade da organização dos serviços judiciários e administrativos."},{"k":"p","t":"Art. 24. Não serão remetidas aos Juizados Especiais da Fazenda Pública as demandas ajuizadas até a data de sua instalação, assim como as ajuizadas fora do Juizado Especial por força do disposto no art. 23."},{"k":"p","t":"Art. 25. Competirá aos Tribunais de Justiça prestar o suporte administrativo necessário ao funcionamento dos Juizados Especiais."},{"k":"p","t":"Art. 26. O disposto no art. 16 aplica-se aos Juizados Especiais Federais instituídos pela Lei no 10.259, de 12 de julho de 2001."},{"k":"p","t":"Art. 27. Aplica-se subsidiariamente o disposto nas Leis nos 5.869, de 11 de janeiro de 1973 – Código de Processo Civil, 9.099, de 26 de setembro de 1995, e 10.259, de 12 de julho de 2001."},{"k":"p","t":"Art. 28. Esta Lei entra em vigor após decorridos 6 (seis) meses de sua publicação oficial. Brasília, 22 de dezembro de 2009; 188o da Independência e 121o da República."},{"k":"h","t":"LUIZ INÁCIO LULA DA SILVA"},{"k":"p","t":"Tarso Genro Este texto não substitui o publicado no DOU de 23.12.2009"}]}],"cf":[{"id":"s0","title":"Disposições iniciais · arts. 5","tag":"","b":[{"k":"p","t":"Constituição Da República Federativa Do Brasil De 1988"},{"k":"h","t":"PREÂMBULO"},{"k":"p","t":"Nós, representantes do povo brasileiro, reunidos em Assembléia Nacional Constituinte para instituir um Estado Democrático, destinado a assegurar o exercício dos direitos sociais e individuais, a liberdade, a segurança, o bem-estar, o desenvolvimento, a igualdade e a justiça como valores supremos de uma sociedade fraterna, pluralista e sem preconceitos, fundada na harmonia social e comprometida, na ordem interna e internacional, com a solução pacífica das controvérsias, promulgamos, sob a proteção de Deus, a seguinte CONSTITUIÇÃO DA REPÚBLICA"},{"k":"h","t":"FEDERATIVA DO BRASIL."},{"k":"h","t":"TÍTULO II — DOS DIREITOS E GARANTIAS FUNDAMENTAIS"},{"k":"h","t":"CAPÍTULO I — DOS DIREITOS E DEVERES INDIVIDUAIS E COLETIVOS"},{"k":"p","t":"Art. 5º Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade, nos termos seguintes:"},{"k":"p","t":"I - homens e mulheres são iguais em direitos e obrigações, nos termos desta Constituição;"},{"k":"p","t":"II - ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei;"},{"k":"p","t":"III - ninguém será submetido a tortura nem a tratamento desumano ou degradante;"},{"k":"p","t":"IV - é livre a manifestação do pensamento, sendo vedado o anonimato;"},{"k":"p","t":"V - é assegurado o direito de resposta, proporcional ao agravo, além da indenização por dano material, moral ou à imagem;"},{"k":"p","t":"VI - é inviolável a liberdade de consciência e de crença, sendo assegurado o livre exercício dos cultos religiosos e garantida, na forma da lei, a proteção aos locais de culto e a suas liturgias;"},{"k":"p","t":"VII - é assegurada, nos termos da lei, a prestação de assistência religiosa nas entidades civis e militares de internação coletiva;"},{"k":"p","t":"VIII - ninguém será privado de direitos por motivo de crença religiosa ou de convicção filosófica ou política, salvo se as invocar para eximir-se de obrigação legal a todos imposta e recusar-se a cumprir prestação alternativa, fixada em lei;"},{"k":"p","t":"IX - é livre a expressão da atividade intelectual, artística, científica e de comunicação, independentemente de censura ou licença;"},{"k":"p","t":"X - são invioláveis a intimidade, a vida privada, a honra e a imagem das pessoas, assegurado o direito a indenização pelo dano material ou moral decorrente de sua violação;"},{"k":"p","t":"XI - a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial; (Vide Lei nº 13.105, de 2015) (Vigência)"},{"k":"p","t":"XII - é inviolável o sigilo da correspondência e das comunicações telegráficas, de dados e das comunicações telefônicas, salvo, no último caso, por ordem judicial, nas hipóteses e na forma que a lei estabelecer para fins de investigação criminal ou instrução processual penal; (Vide Lei nº 9.296, de 1996)"},{"k":"p","t":"XIII - é livre o exercício de qualquer trabalho, ofício ou profissão, atendidas as qualificações profissionais que a lei estabelecer;"},{"k":"p","t":"XIV - é assegurado a todos o acesso à informação e resguardado o sigilo da fonte, quando necessário ao exercício profissional;"},{"k":"p","t":"XV - é livre a locomoção no território nacional em tempo de paz, podendo qualquer pessoa, nos termos da lei, nele entrar, permanecer ou dele sair com seus bens;"},{"k":"p","t":"XVI - todos podem reunir-se pacificamente, sem armas, em locais abertos ao público, independentemente de autorização, desde que não frustrem outra reunião anteriormente convocada para o mesmo local, sendo apenas exigido prévio aviso à autoridade competente;"},{"k":"p","t":"XVII - é plena a liberdade de associação para fins lícitos, vedada a de caráter paramilitar;"},{"k":"p","t":"XVIII - a criação de associações e, na forma da lei, a de cooperativas independem de autorização, sendo vedada a interferência estatal em seu funcionamento;"},{"k":"p","t":"XIX - as associações só poderão ser compulsoriamente dissolvidas ou ter suas atividades suspensas por decisão judicial, exigindo-se, no primeiro caso, o trânsito em julgado;"},{"k":"p","t":"XX - ninguém poderá ser compelido a associar-se ou a permanecer associado;"},{"k":"p","t":"XXI - as entidades associativas, quando expressamente autorizadas, têm legitimidade para representar seus filiados judicial ou extrajudicialmente;"},{"k":"p","t":"XXII - é garantido o direito de propriedade;"},{"k":"p","t":"XXIII - a propriedade atenderá a sua função social;"},{"k":"p","t":"XXIV - a lei estabelecerá o procedimento para desapropriação por necessidade ou utilidade pública, ou por interesse social, mediante justa e prévia indenização em dinheiro, ressalvados os casos previstos nesta Constituição;"},{"k":"p","t":"XXV - no caso de iminente perigo público, a autoridade competente poderá usar de propriedade particular, assegurada ao proprietário indenização ulterior, se houver dano;"},{"k":"p","t":"XXVI - a pequena propriedade rural, assim definida em lei, desde que trabalhada pela família, não será objeto de penhora para pagamento de débitos decorrentes de sua atividade produtiva, dispondo a lei sobre os meios de financiar o seu desenvolvimento;"},{"k":"p","t":"XXVII - aos autores pertence o direito exclusivo de utilização, publicação ou reprodução de suas obras, transmissível aos herdeiros pelo tempo que a lei fixar;"},{"k":"p","t":"XXVIII - são assegurados, nos termos da lei:"},{"k":"p","t":"a) a proteção às participações individuais em obras coletivas e à reprodução da imagem e voz humanas, inclusive nas atividades desportivas;"},{"k":"p","t":"b) o direito de fiscalização do aproveitamento econômico das obras que criarem ou de que participarem aos criadores, aos intérpretes e às respectivas representações sindicais e associativas;"},{"k":"p","t":"XXIX - a lei assegurará aos autores de inventos industriais privilégio temporário para sua utilização, bem como proteção às criações industriais, à propriedade das marcas, aos nomes de empresas e a outros signos distintivos, tendo em vista o interesse social e o desenvolvimento tecnológico e econômico do País;"},{"k":"p","t":"XXX - é garantido o direito de herança;"},{"k":"p","t":"XXXI - a sucessão de bens de estrangeiros situados no País será regulada pela lei brasileira em benefício do cônjuge ou dos filhos brasileiros, sempre que não lhes seja mais favorável a lei pessoal do \"de cujus\";"},{"k":"p","t":"XXXII - o Estado promoverá, na forma da lei, a defesa do consumidor;"},{"k":"p","t":"XXXIII - todos têm direito a receber dos órgãos públicos informações de seu interesse particular, ou de interesse coletivo ou geral, que serão prestadas no prazo da lei, sob pena de responsabilidade, ressalvadas aquelas cujo sigilo seja imprescindível à segurança da sociedade e do Estado; (Regulamento) (Vide Lei nº 12.527, de 2011)"},{"k":"p","t":"XXXIV - são a todos assegurados, independentemente do pagamento de taxas:"},{"k":"p","t":"a) o direito de petição aos Poderes Públicos em defesa de direitos ou contra ilegalidade ou abuso de poder;"},{"k":"p","t":"b) a obtenção de certidões em repartições públicas, para defesa de direitos e esclarecimento de situações de interesse pessoal;"},{"k":"p","t":"XXXV - a lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito;"},{"k":"p","t":"XXXVI - a lei não prejudicará o direito adquirido, o ato jurídico perfeito e a coisa julgada;"},{"k":"p","t":"XXXVII - não haverá juízo ou tribunal de exceção;"},{"k":"p","t":"XXXVIII - é reconhecida a instituição do júri, com a organização que lhe der a lei, assegurados:"},{"k":"p","t":"a) a plenitude de defesa;"},{"k":"p","t":"b) o sigilo das votações;"},{"k":"p","t":"c) a soberania dos veredictos;"},{"k":"p","t":"d) a competência para o julgamento dos crimes dolosos contra a vida;"},{"k":"p","t":"XXXIX - não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal;"},{"k":"p","t":"XL - a lei penal não retroagirá, salvo para beneficiar o réu;"},{"k":"p","t":"XLI - a lei punirá qualquer discriminação atentatória dos direitos e liberdades fundamentais;"},{"k":"p","t":"XLII - a prática do racismo constitui crime inafiançável e imprescritível, sujeito à pena de reclusão, nos termos da lei;"},{"k":"p","t":"XLIII - a lei considerará crimes inafiançáveis e insuscetíveis de graça ou anistia a prática da tortura , o tráfico ilícito de entorpecentes e drogas afins, o terrorismo e os definidos como crimes hediondos, por eles respondendo os mandantes, os executores e os que, podendo evitá-los, se omitirem; (Regulamento)"},{"k":"p","t":"XLIV - constitui crime inafiançável e imprescritível a ação de grupos armados, civis ou militares, contra a ordem constitucional e o Estado Democrático;"},{"k":"p","t":"XLV - nenhuma pena passará da pessoa do condenado, podendo a obrigação de reparar o dano e a decretação do perdimento de bens ser, nos termos da lei, estendidas aos sucessores e contra eles executadas, até o limite do valor do patrimônio transferido;"},{"k":"p","t":"XLVI - a lei regulará a individualização da pena e adotará, entre outras, as seguintes:"},{"k":"p","t":"a) privação ou restrição da liberdade;"},{"k":"p","t":"b) perda de bens;"},{"k":"p","t":"c) multa;"},{"k":"p","t":"d) prestação social alternativa;"},{"k":"p","t":"e) suspensão ou interdição de direitos;"},{"k":"p","t":"XLVII - não haverá penas:"},{"k":"p","t":"a) de morte, salvo em caso de guerra declarada, nos termos do art. 84, XIX;"},{"k":"p","t":"b) de caráter perpétuo;"},{"k":"p","t":"c) de trabalhos forçados;"},{"k":"p","t":"d) de banimento;"},{"k":"p","t":"e) cruéis;"},{"k":"p","t":"XLVIII - a pena será cumprida em estabelecimentos distintos, de acordo com a natureza do delito, a idade e o sexo do apenado;"},{"k":"p","t":"XLIX - é assegurado aos presos o respeito à integridade física e moral;"},{"k":"p","t":"L - às presidiárias serão asseguradas condições para que possam permanecer com seus filhos durante o período de amamentação;"},{"k":"p","t":"LI - nenhum brasileiro será extraditado, salvo o naturalizado, em caso de crime comum, praticado antes da naturalização, ou de comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei;"},{"k":"p","t":"LII - não será concedida extradição de estrangeiro por crime político ou de opinião;"},{"k":"p","t":"LIII - ninguém será processado nem sentenciado senão pela autoridade competente;"},{"k":"p","t":"LIV - ninguém será privado da liberdade ou de seus bens sem o devido processo legal;"},{"k":"p","t":"LV - aos litigantes, em processo judicial ou administrativo, e aos acusados em geral são assegurados o contraditório e ampla defesa, com os meios e recursos a ela inerentes;"},{"k":"p","t":"LVI - são inadmissíveis, no processo, as provas obtidas por meios ilícitos;"},{"k":"p","t":"LVII - ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória;"},{"k":"p","t":"LVIII - o civilmente identificado não será submetido a identificação criminal, salvo nas hipóteses previstas em lei; (Regulamento)"},{"k":"p","t":"LIX - será admitida ação privada nos crimes de ação pública, se esta não for intentada no prazo legal;"},{"k":"p","t":"LX - a lei só poderá restringir a publicidade dos atos processuais quando a defesa da intimidade ou o interesse social o exigirem;"},{"k":"p","t":"LXI - ninguém será preso senão em flagrante delito ou por ordem escrita e fundamentada de autoridade judiciária competente, salvo nos casos de transgressão militar ou crime propriamente militar, definidos em lei;"},{"k":"p","t":"LXII - a prisão de qualquer pessoa e o local onde se encontre serão comunicados imediatamente ao juiz competente e à família do preso ou à pessoa por ele indicada;"},{"k":"p","t":"LXIII - o preso será informado de seus direitos, entre os quais o de permanecer calado, sendo-lhe assegurada a assistência da família e de advogado;"},{"k":"p","t":"LXIV - o preso tem direito à identificação dos responsáveis por sua prisão ou por seu interrogatório policial;"},{"k":"p","t":"LXV - a prisão ilegal será imediatamente relaxada pela autoridade judiciária;"},{"k":"p","t":"LXVI - ninguém será levado à prisão ou nela mantido, quando a lei admitir a liberdade provisória, com ou sem fiança;"},{"k":"p","t":"LXVII - não haverá prisão civil por dívida, salvo a do responsável pelo inadimplemento voluntário e inescusável de obrigação alimentícia e a do depositário infiel;"},{"k":"p","t":"LXVIII - conceder-se-á habeas corpus sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder;"},{"k":"p","t":"LXIX - conceder-se-á mandado de segurança para proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, quando o responsável pela ilegalidade ou abuso de poder for autoridade pública ou agente de pessoa jurídica no exercício de atribuições do Poder Público;"},{"k":"p","t":"LXX - o mandado de segurança coletivo pode ser impetrado por:"},{"k":"p","t":"a) partido político com representação no Congresso Nacional;"},{"k":"p","t":"b) organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa dos interesses de seus membros ou associados;"},{"k":"p","t":"LXXI - conceder-se-á mandado de injunção sempre que a falta de norma regulamentadora torne inviável o exercício dos direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania;"},{"k":"p","t":"LXXII - conceder-se-á habeas data:"},{"k":"p","t":"a) para assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público;"},{"k":"p","t":"b) para a retificação de dados, quando não se prefira fazê-lo por processo sigiloso, judicial ou administrativo;"},{"k":"p","t":"LXXIII - qualquer cidadão é parte legítima para propor ação popular que vise a anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural, ficando o autor, salvo comprovada má-fé, isento de custas judiciais e do ônus da sucumbência;"},{"k":"p","t":"LXXIV - o Estado prestará assistência jurídica integral e gratuita aos que comprovarem insuficiência de recursos;"},{"k":"p","t":"LXXV - o Estado indenizará o condenado por erro judiciário, assim como o que ficar preso além do tempo fixado na sentença;"},{"k":"p","t":"LXXVI - são gratuitos para os reconhecidamente pobres, na forma da lei: (Vide Lei nº 7.844, de 1989)"},{"k":"p","t":"a) o registro civil de nascimento;"},{"k":"p","t":"b) a certidão de óbito;"},{"k":"p","t":"LXXVII - são gratuitas as ações de habeas corpus e habeas data, e, na forma da lei, os atos necessários ao exercício da cidadania. (Regulamento)"},{"k":"p","t":"LXXVIII - a todos, no âmbito judicial e administrativo, são assegurados a razoável duração do processo e os meios que garantam a celeridade de sua tramitação. (Incluído pela Emenda Constitucional nº 45, de 2004) (Vide ADIN 3392)"},{"k":"p","t":"LXXIX - é assegurado, nos termos da lei, o direito à proteção dos dados pessoais, inclusive nos meios digitais. (Incluído pela Emenda Constitucional nº 115, de 2022)"},{"k":"p","t":"§ 1º As normas definidoras dos direitos e garantias fundamentais têm aplicação imediata."},{"k":"p","t":"§ 2º Os direitos e garantias expressos nesta Constituição não excluem outros decorrentes do regime e dos princípios por ela adotados, ou dos tratados internacionais em que a República Federativa do Brasil seja parte."},{"k":"p","t":"§ 3º Os tratados e convenções internacionais sobre direitos humanos que forem aprovados, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão equivalentes às emendas constitucionais. (Incluído pela Emenda Constitucional nº 45, de 2004) (Atos aprovados na forma deste parágrafo: DLG nº 186, de 2008, DEC 6.949, de 2009, DLG 261, de 2015, DEC 9.522, de 2018) (Vide ADIN 3392)"},{"k":"p","t":"§ 4º O Brasil se submete à jurisdição de Tribunal Penal Internacional a cuja criação tenha manifestado adesão. (Incluído pela Emenda Constitucional nº 45, de 2004)"}]},{"id":"s1","title":"CAPÍTULO II — DOS DIREITOS SOCIAIS · arts. 6 a 13","tag":"","b":[{"k":"h","t":"CAPÍTULO II — DOS DIREITOS SOCIAIS"},{"k":"p","t":"Art. 6º São direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, a assistência aos desamparados, na forma desta Constituição. (Redação dada pela Emenda Constitucional nº 90, de 2015)"},{"k":"p","t":"Parágrafo único. Todo brasileiro em situação de vulnerabilidade social terá direito a uma renda básica familiar, garantida pelo poder público em programa permanente de transferência de renda, cujas normas e requisitos de acesso serão determinados em lei, observada a legislação fiscal e orçamentária (Incluído pela Emenda Constitucional nº 114, de 2021)"},{"k":"p","t":"Art. 7º São direitos dos trabalhadores urbanos e rurais, além de outros que visem à melhoria de sua condição social:"},{"k":"p","t":"I - relação de emprego protegida contra despedida arbitrária ou sem justa causa, nos termos de lei complementar, que preverá indenização compensatória, dentre outros direitos;"},{"k":"p","t":"II - seguro-desemprego, em caso de desemprego involuntário;"},{"k":"p","t":"III - fundo de garantia do tempo de serviço;"},{"k":"p","t":"IV - salário mínimo , fixado em lei, nacionalmente unificado, capaz de atender a suas necessidades vitais básicas e às de sua família com moradia, alimentação, educação, saúde, lazer, vestuário, higiene, transporte e previdência social, com reajustes periódicos que lhe preservem o poder aquisitivo, sendo vedada sua vinculação para qualquer fim;"},{"k":"p","t":"V - piso salarial proporcional à extensão e à complexidade do trabalho;"},{"k":"p","t":"VI - irredutibilidade do salário, salvo o disposto em convenção ou acordo coletivo;"},{"k":"p","t":"VII - garantia de salário, nunca inferior ao mínimo, para os que percebem remuneração variável;"},{"k":"p","t":"VIII - décimo terceiro salário com base na remuneração integral ou no valor da aposentadoria;"},{"k":"p","t":"IX – remuneração do trabalho noturno superior à do diurno;"},{"k":"p","t":"X - proteção do salário na forma da lei, constituindo crime sua retenção dolosa;"},{"k":"p","t":"XI – participação nos lucros, ou resultados, desvinculada da remuneração, e, excepcionalmente, participação na gestão da empresa, conforme definido em lei;"},{"k":"p","t":"XII - salário-família pago em razão do dependente do trabalhador de baixa renda nos termos da lei; (Redação dada pela Emenda Constitucional nº 20, de 1998)"},{"k":"p","t":"XIII - duração do trabalho normal não superior a oito horas diárias e quarenta e quatro semanais, facultada a compensação de horários e a redução da jornada, mediante acordo ou convenção coletiva de trabalho; (vide Decreto-Lei nº 5.452, de 1943)"},{"k":"p","t":"XIV - jornada de seis horas para o trabalho realizado em turnos ininterruptos de revezamento, salvo negociação coletiva;"},{"k":"p","t":"XV - repouso semanal remunerado, preferencialmente aos domingos;"},{"k":"p","t":"XVI - remuneração do serviço extraordinário superior, no mínimo, em cinqüenta por cento à do normal; (Vide Del 5.452, art. 59 § 1º)"},{"k":"p","t":"XVII - gozo de férias anuais remuneradas com, pelo menos, um terço a mais do que o salário normal;"},{"k":"p","t":"XVIII - licença à gestante, sem prejuízo do emprego e do salário, com a duração de cento e vinte dias;"},{"k":"p","t":"XIX - licença-paternidade, nos termos fixados em lei;"},{"k":"p","t":"XX - proteção do mercado de trabalho da mulher, mediante incentivos específicos, nos termos da lei;"},{"k":"p","t":"XXI - aviso prévio proporcional ao tempo de serviço, sendo no mínimo de trinta dias, nos termos da lei;"},{"k":"p","t":"XXII - redução dos riscos inerentes ao trabalho, por meio de normas de saúde, higiene e segurança;"},{"k":"p","t":"XXIII - adicional de remuneração para as atividades penosas, insalubres ou perigosas, na forma da lei;"},{"k":"p","t":"XXIV - aposentadoria;"},{"k":"p","t":"XXV - assistência gratuita aos filhos e dependentes desde o nascimento até 5 (cinco) anos de idade em creches e pré-escolas; (Redação dada pela Emenda Constitucional nº 53, de 2006)"},{"k":"p","t":"XXVI - reconhecimento das convenções e acordos coletivos de trabalho;"},{"k":"p","t":"XXVII - proteção em face da automação, na forma da lei;"},{"k":"p","t":"XXVIII - seguro contra acidentes de trabalho, a cargo do empregador, sem excluir a indenização a que este está obrigado, quando incorrer em dolo ou culpa;"},{"k":"p","t":"XXIX - ação, quanto aos créditos resultantes das relações de trabalho, com prazo prescricional de cinco anos para os trabalhadores urbanos e rurais, até o limite de dois anos após a extinção do contrato de trabalho; (Redação dada pela Emenda Constitucional nº 28, de 2000)"},{"k":"p","t":"a) (Revogada). (Redação dada pela Emenda Constitucional nº 28, de 2000)"},{"k":"p","t":"b) (Revogada). (Redação dada pela Emenda Constitucional nº 28, de 2000)"},{"k":"p","t":"XXX - proibição de diferença de salários, de exercício de funções e de critério de admissão por motivo de sexo, idade, cor ou estado civil;"},{"k":"p","t":"XXXI - proibição de qualquer discriminação no tocante a salário e critérios de admissão do trabalhador portador de deficiência;"},{"k":"p","t":"XXXII - proibição de distinção entre trabalho manual, técnico e intelectual ou entre os profissionais respectivos;"},{"k":"p","t":"XXXIII - proibição de trabalho noturno, perigoso ou insalubre a menores de dezoito e de qualquer trabalho a menores de dezesseis anos, salvo na condição de aprendiz, a partir de quatorze anos; (Redação dada pela Emenda Constitucional nº 20, de 1998)"},{"k":"p","t":"XXXIV - igualdade de direitos entre o trabalhador com vínculo empregatício permanente e o trabalhador avulso."},{"k":"p","t":"Parágrafo único. São assegurados à categoria dos trabalhadores domésticos os direitos previstos nos incisos IV, VI, VII, VIII, X, XIII, XV, XVI, XVII, XVIII, XIX, XXI, XXII, XXIV, XXVI, XXX, XXXI e XXXIII e, atendidas as condições estabelecidas em lei e observada a simplificação do cumprimento das obrigações tributárias, principais e acessórias, decorrentes da relação de trabalho e suas peculiaridades, os previstos nos incisos I, II, III, IX, XII, XXV e XXVIII, bem como a sua integração à previdência social. (Redação dada pela Emenda Constitucional nº 72, de 2013)"},{"k":"p","t":"Art. 8º É livre a associação profissional ou sindical, observado o seguinte:"},{"k":"p","t":"I - a lei não poderá exigir autorização do Estado para a fundação de sindicato, ressalvado o registro no órgão competente, vedadas ao Poder Público a interferência e a intervenção na organização sindical;"},{"k":"p","t":"II - é vedada a criação de mais de uma organização sindical, em qualquer grau, representativa de categoria profissional ou econômica, na mesma base territorial, que será definida pelos trabalhadores ou empregadores interessados, não podendo ser inferior à área de um Município;"},{"k":"p","t":"III - ao sindicato cabe a defesa dos direitos e interesses coletivos ou individuais da categoria, inclusive em questões judiciais ou administrativas;"},{"k":"p","t":"IV - a assembléia geral fixará a contribuição que, em se tratando de categoria profissional, será descontada em folha, para custeio do sistema confederativo da representação sindical respectiva, independentemente da contribuição prevista em lei;"},{"k":"p","t":"V - ninguém será obrigado a filiar-se ou a manter-se filiado a sindicato;"},{"k":"p","t":"VI - é obrigatória a participação dos sindicatos nas negociações coletivas de trabalho;"},{"k":"p","t":"VII - o aposentado filiado tem direito a votar e ser votado nas organizações sindicais;"},{"k":"p","t":"VIII - é vedada a dispensa do empregado sindicalizado a partir do registro da candidatura a cargo de direção ou representação sindical e, se eleito, ainda que suplente, até um ano após o final do mandato, salvo se cometer falta grave nos termos da lei."},{"k":"p","t":"Parágrafo único. As disposições deste artigo aplicamse à organização de sindicatos rurais e de colônias de pescadores, atendidas as condições que a lei estabelecer."},{"k":"p","t":"Art. 9º É assegurado o direito de greve, competindo aos trabalhadores decidir sobre a oportunidade de exercê-lo e sobre os interesses que devam por meio dele defender."},{"k":"p","t":"§ 1º A lei definirá os serviços ou atividades essenciais e disporá sobre o atendimento das necessidades inadiáveis da comunidade."},{"k":"p","t":"§ 2º Os abusos cometidos sujeitam os responsáveis às penas da lei."},{"k":"p","t":"Art. 10. É assegurada a participação dos trabalhadores e empregadores nos colegiados dos órgãos públicos em que seus interesses profissionais ou previdenciários sejam objeto de discussão e deliberação."},{"k":"p","t":"Art. 11. Nas empresas de mais de duzentos empregados, é assegurada a eleição de um representante destes com a finalidade exclusiva de promover-lhes o entendimento direto com os empregadores."},{"k":"h","t":"CAPÍTULO III — DA NACIONALIDADE"},{"k":"p","t":"Art. 12. São brasileiros:"},{"k":"p","t":"I - natos:"},{"k":"p","t":"a) os nascidos na República Federativa do Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país;"},{"k":"p","t":"b) os nascidos no estrangeiro, de pai brasileiro ou mãe brasileira, desde que qualquer deles esteja a serviço da República Federativa do Brasil;"},{"k":"p","t":"c) os nascidos no estrangeiro de pai brasileiro ou de mãe brasileira, desde que sejam registrados em repartição brasileira competente ou venham a residir na República Federativa do Brasil e optem, em qualquer tempo, depois de atingida a maioridade, pela nacionalidade brasileira; (Redação dada pela Emenda Constitucional nº 54, de 2007)"},{"k":"p","t":"II - naturalizados:"},{"k":"p","t":"a) os que, na forma da lei, adquiram a nacionalidade brasileira, exigidas aos originários de países de língua portuguesa apenas residência por um ano ininterrupto e idoneidade moral;"},{"k":"p","t":"b) os estrangeiros de qualquer nacionalidade, residentes na República Federativa do Brasil há mais de quinze anos ininterruptos e sem condenação penal, desde que requeiram a nacionalidade brasileira. (Redação dada pela Emenda Constitucional de Revisão nº 3, de 1994)"},{"k":"p","t":"§ 1º Aos portugueses com residência permanente no País, se houver reciprocidade em favor de brasileiros, serão atribuídos os direitos inerentes ao brasileiro, salvo os casos previstos nesta Constituição. (Redação dada pela Emenda Constitucional de Revisão nº 3, de 1994)"},{"k":"p","t":"§ 2º A lei não poderá estabelecer distinção entre brasileiros natos e naturalizados, salvo nos casos previstos nesta Constituição."},{"k":"p","t":"§ 3º São privativos de brasileiro nato os cargos:"},{"k":"p","t":"I - de Presidente e Vice-Presidente da República;"},{"k":"p","t":"II - de Presidente da Câmara dos Deputados;"},{"k":"p","t":"III - de Presidente do Senado Federal;"},{"k":"p","t":"IV - de Ministro do Supremo Tribunal Federal;"},{"k":"p","t":"V - da carreira diplomática;"},{"k":"p","t":"VI - de oficial das Forças Armadas."},{"k":"p","t":"VII - de Ministro de Estado da Defesa (Incluído pela Emenda Constitucional nº 23, de 1999)"},{"k":"p","t":"§ 4º - Será declarada a perda da nacionalidade do brasileiro que:"},{"k":"p","t":"I - tiver cancelada sua naturalização, por sentença judicial, em virtude de atividade nociva ao interesse nacional;"},{"k":"p","t":"II - adquirir outra nacionalidade, salvo nos casos: (Redação dada pela Emenda Constitucional de Revisão nº 3, de 1994)"},{"k":"p","t":"a) de reconhecimento de nacionalidade originária pela lei estrangeira; (Incluído pela Emenda Constitucional de Revisão nº 3, de 1994)"},{"k":"p","t":"b) de imposição de naturalização, pela norma estrangeira, ao brasileiro residente em estado estrangeiro, como condição para permanência em seu território ou para o exercício de direitos civis; (Incluído pela Emenda Constitucional de Revisão nº 3, de 1994)"},{"k":"p","t":"Art. 13. A língua portuguesa é o idioma oficial da República Federativa do Brasil."},{"k":"p","t":"§ 1º São símbolos da República Federativa do Brasil a bandeira, o hino, as armas e o selo nacionais."},{"k":"p","t":"§ 2º Os Estados, o Distrito Federal e os Municípios poderão ter símbolos próprios."}]},{"id":"s2","title":"TÍTULO III — DA ORGANIZAÇÃO DO ESTADO · arts. 37 a 41","tag":"","b":[{"k":"h","t":"TÍTULO III — DA ORGANIZAÇÃO DO ESTADO"},{"k":"h","t":"CAPÍTULO VII — DA ADMINISTRAÇÃO PÚBLICA"},{"k":"h","t":"SEÇÃO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 37. A administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios de legalidade, impessoalidade, moralidade, publicidade e eficiência e, também, ao seguinte: (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"I - os cargos, empregos e funções públicas são acessíveis aos brasileiros que preencham os requisitos estabelecidos em lei, assim como aos estrangeiros, na forma da lei; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"II - a investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas ou de provas e títulos, de acordo com a natureza e a complexidade do cargo ou emprego, na forma prevista em lei, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"III - o prazo de validade do concurso público será de até dois anos, prorrogável uma vez, por igual período;"},{"k":"p","t":"IV - durante o prazo improrrogável previsto no edital de convocação, aquele aprovado em concurso público de provas ou de provas e títulos será convocado com prioridade sobre novos concursados para assumir cargo ou emprego, na carreira;"},{"k":"p","t":"V - as funções de confiança, exercidas exclusivamente por servidores ocupantes de cargo efetivo, e os cargos em comissão, a serem preenchidos por servidores de carreira nos casos, condições e percentuais mínimos previstos em lei, destinam-se apenas às atribuições de direção, chefia e assessoramento; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"VI - é garantido ao servidor público civil o direito à livre associação sindical;"},{"k":"p","t":"VII - o direito de greve será exercido nos termos e nos limites definidos em lei específica; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"VIII - a lei reservará percentual dos cargos e empregos públicos para as pessoas portadoras de deficiência e definirá os critérios de sua admissão;"},{"k":"p","t":"IX - a lei estabelecerá os casos de contratação por tempo determinado para atender a necessidade temporária de excepcional interesse público; (Vide Emenda constitucional nº 106, de 2020)"},{"k":"p","t":"X - a remuneração dos servidores públicos e o subsídio de que trata o § 4º do art. 39 somente poderão ser fixados ou alterados por lei específica, observada a iniciativa privativa em cada caso, assegurada revisão geral anual, sempre na mesma data e sem distinção de índices; (Redação dada pela Emenda Constitucional nº 19, de 1998) (Regulamento)"},{"k":"p","t":"XI - a remuneração e o subsídio dos ocupantes de cargos, funções e empregos públicos da administração direta, autárquica e fundacional, dos membros de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios, dos detentores de mandato eletivo e dos demais agentes políticos e os proventos, pensões ou outra espécie remuneratória, percebidos cumulativamente ou não, incluídas as vantagens pessoais ou de qualquer outra natureza, não poderão exceder o subsídio mensal, em espécie, dos Ministros do Supremo Tribunal Federal, aplicando-se como limite, nos Municípios, o subsídio do Prefeito, e nos Estados e no Distrito Federal, o subsídio mensal do Governador no âmbito do Poder Executivo, o subsídio dos Deputados Estaduais e Distritais no âmbito do Poder Legislativo e o subsidio dos Desembargadores do Tribunal de Justiça, limitado a noventa inteiros e vinte e cinco centésimos por cento do subsídio mensal, em espécie, dos Ministros do Supremo Tribunal Federal, no âmbito do Poder Judiciário, aplicável este limite aos membros do Ministério Público, aos Procuradores e aos Defensores Públicos; (Redação dada pela Emenda Constitucional nº 41, 19.12.2003)"},{"k":"p","t":"XII - os vencimentos dos cargos do Poder Legislativo e do Poder Judiciário não poderão ser superiores aos pagos pelo Poder Executivo;"},{"k":"p","t":"XIII - é vedada a vinculação ou equiparação de quaisquer espécies remuneratórias para o efeito de remuneração de pessoal do serviço público; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"XIV - os acréscimos pecuniários percebidos por servidor público não serão computados nem acumulados para fins de concessão de acréscimos ulteriores; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"XV - o subsídio e os vencimentos dos ocupantes de cargos e empregos públicos são irredutíveis, ressalvado o disposto nos incisos XI e XIV deste artigo e nos arts. 39, § 4º, 150, II, 153, III, e 153, § 2º, I; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"XVI - é vedada a acumulação remunerada de cargos públicos, exceto, quando houver compatibilidade de horários, observado em qualquer caso o disposto no inciso XI: (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"a) a de dois cargos de professor; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"b) a de um cargo de professor com outro técnico ou científico; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"c) a de dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas; (Redação dada pela Emenda Constitucional nº 34, de 2001)"},{"k":"p","t":"XVII - a proibição de acumular estende-se a empregos e funções e abrange autarquias, fundações, empresas públicas, sociedades de economia mista, suas subsidiárias, e sociedades controladas, direta ou indiretamente, pelo poder público; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"XVIII - a administração fazendária e seus servidores fiscais terão, dentro de suas áreas de competência e jurisdição, precedência sobre os demais setores administrativos, na forma da lei;"},{"k":"p","t":"XIX – somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação, cabendo à lei complementar, neste último caso, definir as áreas de sua atuação; (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"XX - depende de autorização legislativa, em cada caso, a criação de subsidiárias das entidades mencionadas no inciso anterior, assim como a participação de qualquer delas em empresa privada;"},{"k":"p","t":"XXI - ressalvados os casos especificados na legislação, as obras, serviços, compras e alienações serão contratados mediante processo de licitação pública que assegure igualdade de condições a todos os concorrentes, com cláusulas que estabeleçam obrigações de pagamento, mantidas as condições efetivas da proposta, nos termos da lei, o qual somente permitirá as exigências de qualificação técnica e econômica indispensáveis à garantia do cumprimento das obrigações. (Regulamento)"},{"k":"p","t":"XXII - as administrações tributárias da União, dos Estados, do Distrito Federal e dos Municípios, atividades essenciais ao funcionamento do Estado, exercidas por servidores de carreiras específicas, terão recursos prioritários para a realização de suas atividades e atuarão de forma integrada, inclusive com o compartilhamento de cadastros e de informações fiscais, na forma da lei ou convênio. (Incluído pela Emenda Constitucional nº 42, de 19.12.2003)"},{"k":"p","t":"§ 1º A publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deverá ter caráter educativo, informativo ou de orientação social, dela não podendo constar nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos."},{"k":"p","t":"§ 2º A não observância do disposto nos incisos II e III implicará a nulidade do ato e a punição da autoridade responsável, nos termos da lei."},{"k":"p","t":"§ 3º A lei disciplinará as formas de participação do usuário na administração pública direta e indireta, regulando especialmente: (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"I - as reclamações relativas à prestação dos serviços públicos em geral, asseguradas a manutenção de serviços de atendimento ao usuário e a avaliação periódica, externa e interna, da qualidade dos serviços; (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"II - o acesso dos usuários a registros administrativos e a informações sobre atos de governo, observado o disposto no art. 5º, X e XXXIII; (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"III - a disciplina da representação contra o exercício negligente ou abusivo de cargo, emprego ou função na administração pública. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 4º - Os atos de improbidade administrativa importarão a suspensão dos direitos políticos, a perda da função pública, a indisponibilidade dos bens e o ressarcimento ao erário, na forma e gradação previstas em lei, sem prejuízo da ação penal cabível."},{"k":"p","t":"§ 5º A lei estabelecerá os prazos de prescrição para ilícitos praticados por qualquer agente, servidor ou não, que causem prejuízos ao erário, ressalvadas as respectivas ações de ressarcimento."},{"k":"p","t":"§ 6º As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa."},{"k":"p","t":"§ 7º A lei disporá sobre os requisitos e as restrições ao ocupante de cargo ou emprego da administração direta e indireta que possibilite o acesso a informações privilegiadas. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 8º A autonomia gerencial, orçamentária e financeira dos órgãos e entidades da administração direta e indireta poderá ser ampliada mediante contrato, a ser firmado entre seus administradores e o poder público, que tenha por objeto a fixação de metas de desempenho para o órgão ou entidade, cabendo à lei dispor sobre: (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"I - o prazo de duração do contrato;"},{"k":"p","t":"II - os controles e critérios de avaliação de desempenho, direitos, obrigações e responsabilidade dos dirigentes;"},{"k":"p","t":"III - a remuneração do pessoal.\""},{"k":"p","t":"§ 9º O disposto no inciso XI aplica-se às empresas públicas e às sociedades de economia mista, e suas subsidiárias, que receberem recursos da União, dos Estados, do Distrito Federal ou dos Municípios para pagamento de despesas de pessoal ou de custeio em geral. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 10. É vedada a percepção simultânea de proventos de aposentadoria decorrentes do art. 40 ou dos arts. 42 e 142 com a remuneração de cargo, emprego ou função pública, ressalvados os cargos acumuláveis na forma desta Constituição, os cargos eletivos e os cargos em comissão declarados em lei de livre nomeação e exoneração. (Incluído pela Emenda Constitucional nº 20, de 1998)"},{"k":"p","t":"§ 11. Não serão computadas, para efeito dos limites remuneratórios de que trata o inciso XI do caput deste artigo, as parcelas de caráter indenizatório previstas em lei. (Incluído pela Emenda Constitucional nº 47, de 2005)"},{"k":"p","t":"§ 12. Para os fins do disposto no inciso XI do caput deste artigo, fica facultado aos Estados e ao Distrito Federal fixar, em seu âmbito, mediante emenda às respectivas Constituições e Lei Orgânica, como limite único, o subsídio mensal dos Desembargadores do respectivo Tribunal de Justiça, limitado a noventa inteiros e vinte e cinco centésimos por cento do subsídio mensal dos Ministros do Supremo Tribunal Federal, não se aplicando o disposto neste parágrafo aos subsídios dos Deputados Estaduais e Distritais e dos Vereadores. (Incluído pela Emenda Constitucional nº 47, de 2005)"},{"k":"p","t":"§ 13. O servidor público titular de cargo efetivo poderá ser readaptado para exercício de cargo cujas atribuições e responsabilidades sejam compatíveis com a limitação que tenha sofrido em sua capacidade física ou mental, enquanto permanecer nesta condição, desde que possua a habilitação e o nível de escolaridade exigidos para o cargo de destino, mantida a remuneração do cargo de origem. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 14. A aposentadoria concedida com a utilização de tempo de contribuição decorrente de cargo, emprego ou função pública, inclusive do Regime Geral de Previdência Social, acarretará o rompimento do vínculo que gerou o referido tempo de contribuição. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 15. É vedada a complementação de aposentadorias de servidores públicos e de pensões por morte a seus dependentes que não seja decorrente do disposto nos"},{"k":"p","t":"§§ 14 a 16 do art. 40 ou que não seja prevista em lei que extinga regime próprio de previdência social. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 16. Os órgãos e entidades da administração pública, individual ou conjuntamente, devem realizar avaliação das políticas públicas, inclusive com divulgação do objeto a ser avaliado e dos resultados alcançados, na forma da lei. (Incluído pela Emenda Constitucional nº 109, de 2021)"},{"k":"p","t":"Art. 38. Ao servidor público da administração direta, autárquica e fundacional, no exercício de mandato eletivo, aplicam-se as seguintes disposições: (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"I - tratando-se de mandato eletivo federal, estadual ou distrital, ficará afastado de seu cargo, emprego ou função;"},{"k":"p","t":"II - investido no mandato de Prefeito, será afastado do cargo, emprego ou função, sendo-lhe facultado optar pela sua remuneração;"},{"k":"p","t":"III - investido no mandato de Vereador, havendo compatibilidade de horários, perceberá as vantagens de seu cargo, emprego ou função, sem prejuízo da remuneração do cargo eletivo, e, não havendo compatibilidade, será aplicada a norma do inciso anterior;"},{"k":"p","t":"IV - em qualquer caso que exija o afastamento para o exercício de mandato eletivo, seu tempo de serviço será contado para todos os efeitos legais, exceto para promoção por merecimento;"},{"k":"p","t":"V - na hipótese de ser segurado de regime próprio de previdência social, permanecerá filiado a esse regime, no ente federativo de origem. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"h","t":"SEÇÃO II — DOS SERVIDORES PÚBLICOS"},{"k":"p","t":"(Redação dada pela Emenda Constitucional nº 18, de 1998)"},{"k":"p","t":"Art. 39. A União, os Estados, o Distrito Federal e os Municípios instituirão, no âmbito de sua competência, regime jurídico único e planos de carreira para os servidores da administração pública direta, das autarquias e das fundações públicas. (Vide ADIN nº 2.135-4)"},{"k":"p","t":"Art. 39. A União, os Estados, o Distrito Federal e os Municípios instituirão conselho de política de administração e remuneração de pessoal, integrado por servidores designados pelos respectivos Poderes (Redação dada pela Emenda Constitucional nº 19, de 1998) (Vide ADIN nº 2.135-4)"},{"k":"p","t":"§ 1º A fixação dos padrões de vencimento e dos demais componentes do sistema remuneratório observará: (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"I - a natureza, o grau de responsabilidade e a complexidade dos cargos componentes de cada carreira; (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"II - os requisitos para a investidura; (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"III - as peculiaridades dos cargos. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 2º A União, os Estados e o Distrito Federal manterão escolas de governo para a formação e o aperfeiçoamento dos servidores públicos, constituindo-se a participação nos cursos um dos requisitos para a promoção na carreira, facultada, para isso, a celebração de convênios ou contratos entre os entes federados. (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 3º Aplica-se aos servidores ocupantes de cargo público o disposto no art. 7º, IV, VII, VIII, IX, XII, XIII, XV, XVI, XVII, XVIII, XIX, XX, XXII e XXX, podendo a lei estabelecer requisitos diferenciados de admissão quando a natureza do cargo o exigir. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 4º O membro de Poder, o detentor de mandato eletivo, os Ministros de Estado e os Secretários Estaduais e Municipais serão remunerados exclusivamente por subsídio fixado em parcela única, vedado o acréscimo de qualquer gratificação, adicional, abono, prêmio, verba de representação ou outra espécie remuneratória, obedecido, em qualquer caso, o disposto no art. 37, X e XI. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 5º Lei da União, dos Estados, do Distrito Federal e dos Municípios poderá estabelecer a relação entre a maior e a menor remuneração dos servidores públicos, obedecido, em qualquer caso, o disposto no art. 37,"},{"k":"p","t":"XI. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 6º Os Poderes Executivo, Legislativo e Judiciário publicarão anualmente os valores do subsídio e da remuneração dos cargos e empregos públicos. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 7º Lei da União, dos Estados, do Distrito Federal e dos Municípios disciplinará a aplicação de recursos orçamentários provenientes da economia com despesas correntes em cada órgão, autarquia e fundação, para aplicação no desenvolvimento de programas de qualidade e produtividade, treinamento e desenvolvimento, modernização, reaparelhamento e racionalização do serviço público, inclusive sob a forma de adicional ou prêmio de produtividade. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 8º A remuneração dos servidores públicos organizados em carreira poderá ser fixada nos termos do § 4º. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 9º É vedada a incorporação de vantagens de caráter temporário ou vinculadas ao exercício de função de confiança ou de cargo em comissão à remuneração do cargo efetivo. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"Art. 40. O regime próprio de previdência social dos servidores titulares de cargos efetivos terá caráter contributivo e solidário, mediante contribuição do respectivo ente federativo, de servidores ativos, de aposentados e de pensionistas, observados critérios que preservem o equilíbrio financeiro e atuarial. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 1º O servidor abrangido por regime próprio de previdência social será aposentado: (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"I - por incapacidade permanente para o trabalho, no cargo em que estiver investido, quando insuscetível de readaptação, hipótese em que será obrigatória a realização de avaliações periódicas para verificação da continuidade das condições que ensejaram a concessão da aposentadoria, na forma de lei do respectivo ente federativo; (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"II - compulsoriamente, com proventos proporcionais ao tempo de contribuição, aos 70 (setenta) anos de idade, ou aos 75 (setenta e cinco) anos de idade, na forma de lei complementar; (Redação dada pela Emenda Constitucional nº 88, de 2015) (Vide Lei Complementar nº 152, de 2015)"},{"k":"p","t":"III - no âmbito da União, aos 62 (sessenta e dois) anos de idade, se mulher, e aos 65 (sessenta e cinco) anos de idade, se homem, e, no âmbito dos Estados, do Distrito Federal e dos Municípios, na idade mínima estabelecida mediante emenda às respectivas Constituições e Leis Orgânicas, observados o tempo de contribuição e os demais requisitos estabelecidos em lei complementar do respectivo ente federativo. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 2º Os proventos de aposentadoria não poderão ser inferiores ao valor mínimo a que se refere o § 2º do art. 201 ou superiores ao limite máximo estabelecido para o Regime Geral de Previdência Social, observado o disposto nos §§ 14 a 16. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 3º As regras para cálculo de proventos de aposentadoria serão disciplinadas em lei do respectivo ente federativo. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 4º É vedada a adoção de requisitos ou critérios diferenciados para concessão de benefícios em regime próprio de previdência social, ressalvado o disposto nos §§ 4º-A, 4º-B, 4º-C e 5º. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 4º-A. Poderão ser estabelecidos por lei complementar do respectivo ente federativo idade e tempo de contribuição diferenciados para aposentadoria de servidores com deficiência, previamente submetidos a avaliação biopsicossocial realizada por equipe multiprofissional e interdisciplinar. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 4º-B. Poderão ser estabelecidos por lei complementar do respectivo ente federativo idade e tempo de contribuição diferenciados para aposentadoria de ocupantes do cargo de agente penitenciário, de agente socioeducativo ou de policial dos órgãos de que tratam o inciso IV do caput do art. 51, o inciso XIII do caput do art. 52 e os incisos I a IV do caput do art. 144. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 4º-C. Poderão ser estabelecidos por lei complementar do respectivo ente federativo idade e tempo de contribuição diferenciados para aposentadoria de servidores cujas atividades sejam exercidas com efetiva exposição a agentes químicos, físicos e biológicos prejudiciais à saúde, ou associação desses agentes, vedada a caracterização por categoria profissional ou ocupação. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 5º Os ocupantes do cargo de professor terão idade mínima reduzida em 5 (cinco) anos em relação às idades decorrentes da aplicação do disposto no inciso III do § 1º, desde que comprovem tempo de efetivo exercício das funções de magistério na educação infantil e no ensino fundamental e médio fixado em lei complementar do respectivo ente federativo. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 6º Ressalvadas as aposentadorias decorrentes dos cargos acumuláveis na forma desta Constituição, é vedada a percepção de mais de uma aposentadoria à conta de regime próprio de previdência social, aplicando-se outras vedações, regras e condições para a acumulação de benefícios previdenciários estabelecidas no Regime Geral de Previdência Social. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 7º Observado o disposto no § 2º do art. 201, quando se tratar da única fonte de renda formal auferida pelo dependente, o benefício de pensão por morte será concedido nos termos de lei do respectivo ente federativo, a qual tratará de forma diferenciada a hipótese de morte dos servidores de que trata o § 4º- B decorrente de agressão sofrida no exercício ou em razão da função. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 8º É assegurado o reajustamento dos benefícios para preservar-lhes, em caráter permanente, o valor real, conforme critérios estabelecidos em lei. (Redação dada pela Emenda Constitucional nº 41, 19.12.2003)"},{"k":"p","t":"§ 9º O tempo de contribuição federal, estadual, distrital ou municipal será contado para fins de aposentadoria, observado o disposto nos §§ 9º e 9º-A do art. 201, e o tempo de serviço correspondente será contado para fins de disponibilidade. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 10 - A lei não poderá estabelecer qualquer forma de contagem de tempo de contribuição fictício. (Incluído pela Emenda Constitucional nº 20, de 15/12/98)"},{"k":"p","t":"§ 11 - Aplica-se o limite fixado no art. 37, XI, à soma total dos proventos de inatividade, inclusive quando decorrentes da acumulação de cargos ou empregos públicos, bem como de outras atividades sujeitas a contribuição para o regime geral de previdência social, e ao montante resultante da adição de proventos de inatividade com remuneração de cargo acumulável na forma desta Constituição, cargo em comissão declarado em lei de livre nomeação e exoneração, e de cargo eletivo. (Incluído pela Emenda Constitucional nº 20, de 15/12/98)"},{"k":"p","t":"§ 12. Além do disposto neste artigo, serão observados, em regime próprio de previdência social, no que couber, os requisitos e critérios fixados para o Regime Geral de Previdência Social. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 13. Aplica-se ao agente público ocupante, exclusivamente, de cargo em comissão declarado em lei de livre nomeação e exoneração, de outro cargo temporário, inclusive mandato eletivo, ou de emprego público, o Regime Geral de Previdência Social. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 14. A União, os Estados, o Distrito Federal e os Municípios instituirão, por lei de iniciativa do respectivo Poder Executivo, regime de previdência complementar para servidores públicos ocupantes de cargo efetivo, observado o limite máximo dos benefícios do Regime Geral de Previdência Social para o valor das aposentadorias e das pensões em regime próprio de previdência social, ressalvado o disposto no"},{"k":"p","t":"§ 16. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 15. O regime de previdência complementar de que trata o § 14 oferecerá plano de benefícios somente na modalidade contribuição definida, observará o disposto no art. 202 e será efetivado por intermédio de entidade fechada de previdência complementar ou de entidade aberta de previdência complementar. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 16 - Somente mediante sua prévia e expressa opção, o disposto nos §§ 14 e 15 poderá ser aplicado ao servidor que tiver ingressado no serviço público até a data da publicação do ato de instituição do correspondente regime de previdência complementar. (Incluído pela Emenda Constitucional nº 20, de 15/12/98)"},{"k":"p","t":"§ 17. Todos os valores de remuneração considerados para o cálculo do benefício previsto no § 3° serão devidamente atualizados, na forma da lei. (Incluído pela Emenda Constitucional nº 41, 19.12.2003)"},{"k":"p","t":"§ 18. Incidirá contribuição sobre os proventos de aposentadorias e pensões concedidas pelo regime de que trata este artigo que superem o limite máximo estabelecido para os benefícios do regime geral de previdência social de que trata o art. 201, com percentual igual ao estabelecido para os servidores titulares de cargos efetivos. (Incluído pela Emenda Constitucional nº 41, 19.12.2003) (Vide ADIN 3133) (Vide ADIN 3143) (Vide ADIN 3184)"},{"k":"p","t":"§ 19. Observados critérios a serem estabelecidos em lei do respectivo ente federativo, o servidor titular de cargo efetivo que tenha completado as exigências para a aposentadoria voluntária e que opte por permanecer em atividade poderá fazer jus a um abono de permanência equivalente, no máximo, ao valor da sua contribuição previdenciária, até completar a idade para aposentadoria compulsória. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 20. É vedada a existência de mais de um regime próprio de previdência social e de mais de um órgão ou entidade gestora desse regime em cada ente federativo, abrangidos todos os poderes, órgãos e entidades autárquicas e fundacionais, que serão responsáveis pelo seu financiamento, observados os critérios, os parâmetros e a natureza jurídica definidos na lei complementar de que trata o § 22. (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 21. (Revogado). (Redação dada pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"§ 22. Vedada a instituição de novos regimes próprios de previdência social, lei complementar federal estabelecerá, para os que já existam, normas gerais de organização, de funcionamento e de responsabilidade em sua gestão, dispondo, entre outros aspectos, sobre: (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"I - requisitos para sua extinção e consequente migração para o Regime Geral de Previdência Social; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"II - modelo de arrecadação, de aplicação e de utilização dos recursos; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"III - fiscalização pela União e controle externo e social; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"IV - definição de equilíbrio financeiro e atuarial; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"V - condições para instituição do fundo com finalidade previdenciária de que trata o art. 249 e para vinculação a ele dos recursos provenientes de contribuições e dos bens, direitos e ativos de qualquer natureza; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"VI - mecanismos de equacionamento do deficit atuarial; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"VII - estruturação do órgão ou entidade gestora do regime, observados os princípios relacionados com governança, controle interno e transparência; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"VIII - condições e hipóteses para responsabilização daqueles que desempenhem atribuições relacionadas, direta ou indiretamente, com a gestão do regime; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"IX - condições para adesão a consórcio público; (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"X - parâmetros para apuração da base de cálculo e definição de alíquota de contribuições ordinárias e extraordinárias. (Incluído pela Emenda Constitucional nº 103, de 2019)"},{"k":"p","t":"Art. 41. São estáveis após três anos de efetivo exercício os servidores nomeados para cargo de provimento efetivo em virtude de concurso público. (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 1º O servidor público estável só perderá o cargo: (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"I - em virtude de sentença judicial transitada em julgado; (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"II - mediante processo administrativo em que lhe seja assegurada ampla defesa; (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"III - mediante procedimento de avaliação periódica de desempenho, na forma de lei complementar, assegurada ampla defesa. (Incluído pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 2º Invalidada por sentença judicial a demissão do servidor estável, será ele reintegrado, e o eventual ocupante da vaga, se estável, reconduzido ao cargo de origem, sem direito a indenização, aproveitado em outro cargo ou posto em disponibilidade com remuneração proporcional ao tempo de serviço. (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 3º Extinto o cargo ou declarada a sua desnecessidade, o servidor estável ficará em disponibilidade, com remuneração proporcional ao tempo de serviço, até seu adequado aproveitamento em outro cargo. (Redação dada pela Emenda Constitucional nº 19, de 1998)"},{"k":"p","t":"§ 4º Como condição para a aquisição da estabilidade, é obrigatória a avaliação especial de desempenho por comissão instituída para essa finalidade. (Incluído pela Emenda Constitucional nº 19, de 1998)"}]},{"id":"s3","title":"CAPÍTULO III — DO PODER JUD
