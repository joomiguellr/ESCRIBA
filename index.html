"crime","t":"Art. 332 — Tráfico de influência","q":"Quais os verbos nucleares do crime de Tráfico de influência (art. 332)?","a":"solicitar, exigir, cobrar, obter"},{"id":"c332-p","deck":"crime","t":"Art. 332 — Tráfico de influência","q":"Qual a pena do crime de Tráfico de influência (art. 332)?","a":"Reclusão, 2 a 5 anos, e multa"},{"id":"c332-x0","deck":"crime","t":"Art. 332 — Tráfico de influência","q":"Qual o aumento do parágrafo único do art. 332?","a":"Aumenta-se da metade se o agente alega ou insinua que a vantagem é também destinada ao funcionário."},{"id":"c333-v","deck":"crime","t":"Art. 333 — Corrupção ativa","q":"Quais os verbos nucleares do crime de Corrupção ativa (art. 333)?","a":"oferecer, prometer"},{"id":"c333-p","deck":"crime","t":"Art. 333 — Corrupção ativa","q":"Qual a pena do crime de Corrupção ativa (art. 333)?","a":"Reclusão, 2 a 12 anos, e multa"},{"id":"c333-x0","deck":"crime","t":"Art. 333 — Corrupção ativa","q":"Qual o aumento do parágrafo único do art. 333?","a":"1/3, se em razão da vantagem ou promessa o funcionário retarda ou omite ato de ofício, ou o pratica infringindo dever funcional."},{"id":"c336-1","deck":"crime","t":"Art. 336 — Inutilização de edital ou de sinal","q":"Inutilização de edital ou de sinal (art. 336): qual o verbo nuclear e qual a pena?","a":"Verbo(s): rasgar, inutilizar, conspurcar, violar. Pena: Detenção, 1 mês a 1 ano, ou multa."},{"id":"c337-v","deck":"crime","t":"Art. 337 — Subtração ou inutilização de livro ou documento","q":"Quais os verbos nucleares do crime de Subtração ou inutilização de livro ou documento (art. 337)?","a":"subtrair, inutilizar"},{"id":"c337-p","deck":"crime","t":"Art. 337 — Subtração ou inutilização de livro ou documento","q":"Qual a pena do crime de Subtração ou inutilização de livro ou documento (art. 337)?","a":"Reclusão, 2 a 5 anos, se não constitui crime mais grave"},{"id":"c339-v","deck":"crime","t":"Art. 339 — Denunciação caluniosa","q":"Quais os verbos nucleares do crime de Denunciação caluniosa (art. 339)?","a":"dar causa"},{"id":"c339-p","deck":"crime","t":"Art. 339 — Denunciação caluniosa","q":"Qual a pena do crime de Denunciação caluniosa (art. 339)?","a":"Reclusão, 2 a 8 anos, e multa"},{"id":"c339-x0","deck":"crime","t":"Art. 339 — Denunciação caluniosa","q":"Quais os aumentos e diminuições do art. 339?","a":"Aumenta-se 1/6 se o agente se serve de anonimato ou nome suposto; diminui-se pela metade se a imputação é de contravenção."},{"id":"c340-1","deck":"crime","t":"Art. 340 — Comunicação falsa de crime ou de contravenção","q":"Comunicação falsa de crime ou de contravenção (art. 340): qual o verbo nuclear e qual a pena?","a":"Verbo(s): provocar. Pena: Detenção, 1 a 6 meses, ou multa."},{"id":"c341-1","deck":"crime","t":"Art. 341 — Autoacusação falsa","q":"Autoacusação falsa (art. 341): qual o verbo nuclear e qual a pena?","a":"Verbo(s): acusar-se. Pena: Detenção, 3 meses a 2 anos, ou multa."},{"id":"c342-v","deck":"crime","t":"Art. 342 — Falso testemunho ou falsa perícia","q":"Quais os verbos nucleares do crime de Falso testemunho ou falsa perícia (art. 342)?","a":"fazer afirmação falsa, negar, calar"},{"id":"c342-p","deck":"crime","t":"Art. 342 — Falso testemunho ou falsa perícia","q":"Qual a pena do crime de Falso testemunho ou falsa perícia (art. 342)?","a":"Reclusão, 2 a 4 anos, e multa"},{"id":"c342-x0","deck":"crime","t":"Art. 342 — Falso testemunho ou falsa perícia","q":"Qual a causa de extinção da punibilidade do falso testemunho (§2º)?","a":"Retratação ou declaração da verdade antes da sentença no processo em que ocorreu o ilícito."},{"id":"c342-x1","deck":"crime","t":"Art. 342 — Falso testemunho ou falsa perícia","q":"Quando a pena do falso testemunho aumenta (§1º)?","a":"De 1/6 a 1/3 se mediante suborno ou com o fim de obter prova para processo penal ou civil em que seja parte ente da administração pública."},{"id":"c343-v","deck":"crime","t":"Art. 343 — Corrupção ativa de testemunha, perito, contador, tradutor ou intérprete","q":"Quais os verbos nucleares do crime de Corrupção ativa de testemunha, perito, contador, tradutor ou intérprete (art. 343)?","a":"dar, oferecer, prometer"},{"id":"c343-p","deck":"crime","t":"Art. 343 — Corrupção ativa de testemunha, perito, contador, tradutor ou intérprete","q":"Qual a pena do crime de Corrupção ativa de testemunha, perito, contador, tradutor ou intérprete (art. 343)?","a":"Reclusão, 3 a 4 anos, e multa"},{"id":"c344-v","deck":"crime","t":"Art. 344 — Coação no curso do processo","q":"Quais os verbos nucleares do crime de Coação no curso do processo (art. 344)?","a":"usar"},{"id":"c344-p","deck":"crime","t":"Art. 344 — Coação no curso do processo","q":"Qual a pena do crime de Coação no curso do processo (art. 344)?","a":"Reclusão, 1 a 4 anos, e multa, além da pena da violência"},{"id":"c345-1","deck":"crime","t":"Art. 345 — Exercício arbitrário das próprias razões","q":"Exercício arbitrário das próprias razões (art. 345): qual o verbo nuclear e qual a pena?","a":"Verbo(s): fazer. Pena: Detenção, 15 dias a 1 mês, ou multa, além da pena da violência."},{"id":"c346-1","deck":"crime","t":"Art. 346 — Dano em coisa própria em poder de terceiro","q":"Dano em coisa própria em poder de terceiro (art. 346): qual o verbo nuclear e qual a pena?","a":"Verbo(s): tirar, suprimir, destruir, danificar. Pena: Detenção, 6 meses a 2 anos, e multa."},{"id":"c347-v","deck":"crime","t":"Art. 347 — Fraude processual","q":"Quais os verbos nucleares do crime de Fraude processual (art. 347)?","a":"inovar"},{"id":"c347-p","deck":"crime","t":"Art. 347 — Fraude processual","q":"Qual a pena do crime de Fraude processual (art. 347)?","a":"Detenção, 3 meses a 2 anos, e multa"},{"id":"c347-x0","deck":"crime","t":"Art. 347 — Fraude processual","q":"Qual a consequência da fraude processual em processo penal (p.ú.)?","a":"Se a inovação se destina a produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em dobro."},{"id":"c357-v","deck":"crime","t":"Art. 357 — Exploração de prestígio","q":"Quais os verbos nucleares do crime de Exploração de prestígio (art. 357)?","a":"solicitar, receber"},{"id":"c357-p","deck":"crime","t":"Art. 357 — Exploração de prestígio","q":"Qual a pena do crime de Exploração de prestígio (art. 357)?","a":"Reclusão, 1 a 5 anos, e multa"},{"id":"c357-x0","deck":"crime","t":"Art. 357 — Exploração de prestígio","q":"Qual o aumento do art. 357?","a":"1/3, se o agente alega ou insinua que o dinheiro ou utilidade também se destina às pessoas referidas (juiz, jurado, MP, funcionário de justiça, perito, tradutor, intérprete ou testemunha)."},{"id":"c358-v","deck":"crime","t":"Art. 358 — Violência ou fraude em arrematação judicial","q":"Quais os verbos nucleares do crime de Violência ou fraude em arrematação judicial (art. 358)?","a":"impedir, perturbar, fraudar, afastar"},{"id":"c358-p","deck":"crime","t":"Art. 358 — Violência ou fraude em arrematação judicial","q":"Qual a pena do crime de Violência ou fraude em arrematação judicial (art. 358)?","a":"Detenção, 2 meses a 1 ano, ou multa, além da pena da violência"},{"id":"c359-v","deck":"crime","t":"Art. 359 — Desobediência a decisão judicial sobre perda ou suspensão de direito","q":"Quais os verbos nucleares do crime de Desobediência a decisão judicial sobre perda ou suspensão de direito (art. 359)?","a":"exercer"},{"id":"c359-p","deck":"crime","t":"Art. 359 — Desobediência a decisão judicial sobre perda ou suspensão de direito","q":"Qual a pena do crime de Desobediência a decisão judicial sobre perda ou suspensão de direito (art. 359)?","a":"Detenção, 3 meses a 2 anos, ou multa"},{"id":"c327-x","deck":"crime","t":"Art. 327","q":"Quem é funcionário público para efeitos penais (art. 327) e qual o aumento do §2º?","a":"Quem exerce cargo, emprego ou função pública, ainda que transitoriamente ou sem remuneração. Equipara-se quem atua em paraestatal ou em empresa contratada para atividade típica da Administração. Aumento de 1/3 para ocupantes de cargo em comissão, direção ou assessoramento."},{"id":"b0","deck":"ben","t":"Lei 9.099 · Art. 61","q":"O que são infrações penais de menor potencial ofensivo (Lei 9.099, art. 61)?","a":"As contravenções penais e os crimes com pena máxima não superior a 2 anos, cumulada ou não com multa."},{"id":"b1","deck":"ben","t":"Lei 9.099 · Art. 74","q":"Qual o efeito da composição civil dos danos homologada (art. 74)?","a":"Sentença irrecorrível, com eficácia de título a ser executado no juízo civil. Acarreta renúncia ao direito de queixa ou representação."},{"id":"b2","deck":"ben","t":"Lei 9.099 · Art. 74","q":"Em que ações a composição civil homologada acarreta renúncia ao direito de queixa ou representação?","a":"Na ação penal de iniciativa privada e na pública condicionada à representação (art. 74, p.ú.). Na pública incondicionada, a composição não impede a ação."},{"id":"b3","deck":"ben","t":"Lei 9.099 · Art. 76","q":"Quando cabe a transação penal e o que o MP propõe (art. 76)?","a":"Havendo representação ou ação pública incondicionada, não sendo caso de arquivamento: aplicação imediata de pena restritiva de direitos ou multa."},{"id":"b4","deck":"ben","t":"Lei 9.099 · Art. 76","q":"Quando NÃO cabe a transação penal (art. 76, §2º)?","a":"Condenado por crime a pena privativa de liberdade por sentença definitiva; beneficiado nos 5 anos anteriores; antecedentes, conduta social, personalidade, motivos e circunstâncias que não indiquem a medida como suficiente."},{"id":"b5","deck":"ben","t":"Lei 9.099 · Art. 76","q":"Efeitos da transação penal aceita (art. 76, §§4º e 6º)?","a":"Não gera reincidência, não consta de certidão de antecedentes (salvo para impedir novo benefício em 5 anos) e não tem efeitos civis. Cabe apelação."},{"id":"b6","deck":"ben","t":"Lei 9.099 · Art. 77","q":"Como o MP inicia o procedimento sumaríssimo se não houve transação (art. 77)?","a":"Oferece ao Juiz, de imediato, denúncia oral, com base no termo de ocorrência e dispensado o inquérito policial. Se a complexidade ou as circunstâncias não permitirem a denúncia, requer o encaminhamento das peças ao juízo comum (§2º; art. 66, p.ú.)."},{"id":"b7","deck":"ben","t":"Lei 9.099 · Art. 88","q":"Quais crimes passam a depender de representação (art. 88)?","a":"Lesão corporal leve e lesão corporal culposa."},{"id":"b8","deck":"ben","t":"Lei 9.099 · Art. 89","q":"Requisito de pena para a suspensão condicional do processo (art. 89)?","a":"Crimes com pena mínima cominada igual ou inferior a 1 ano, abrangidas ou não por esta Lei, desde que o acusado não esteja sendo processado nem tenha sido condenado por outro crime."},{"id":"b9","deck":"ben","t":"Lei 9.099 · Art. 89","q":"Qual o prazo da suspensão condicional do processo?","a":"De 2 a 4 anos, sob condições."},{"id":"b10","deck":"ben","t":"Lei 9.099 · Art. 89","q":"Quais as condições legais da suspensão (art. 89, §1º)?","a":"Reparação do dano (salvo impossibilidade); proibição de frequentar determinados lugares; proibição de ausentar-se da comarca sem autorização do juiz; comparecimento pessoal e obrigatório a juízo, mensalmente."},{"id":"b11","deck":"ben","t":"Lei 9.099 · Art. 89","q":"Quando a suspensão é revogada (art. 89, §§3º e 4º)?","a":"Obrigatoriamente: se processado por outro crime ou se não repara o dano sem motivo justificado. Facultativamente: se processado por contravenção ou descumpre outra condição."},{"id":"b12","deck":"ben","t":"Lei 9.099 · Art. 89","q":"O que ocorre ao fim do prazo sem revogação, e como fica a prescrição?","a":"Extingue-se a punibilidade (§5º). A prescrição não corre durante o prazo de suspensão (§6º)."},{"id":"i0","deck":"imp","t":"Lei 8.429 · Art. 9º","q":"Enriquecimento ilícito (art. 9º): qual o núcleo do tipo?","a":"Auferir, mediante ato doloso, qualquer tipo de vantagem patrimonial indevida em razão do exercício de cargo, mandato, função, emprego ou atividade nas entidades do art. 1º."},{"id":"i1","deck":"imp","t":"Lei 8.429 · Art. 9º","q":"Quais as sanções do enriquecimento ilícito (art. 12, I)?","a":"Perda dos bens ou valores acrescidos ilicitamente, perda da função pública, suspensão dos direitos políticos até 14 anos, multa civil equivalente ao valor do acréscimo patrimonial e proibição de contratar com o poder público ou receber benefícios ou incentivos fiscais ou creditícios, por prazo não superior a 14 anos."},{"id":"i2","deck":"imp","t":"Lei 8.429 · Art. 10","q":"Lesão ao erário (art. 10): qual o núcleo do tipo?","a":"Ação ou omissão dolosa que enseje, efetiva e comprovadamente, perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação dos bens ou haveres das entidades do art. 1º."},{"id":"i3","deck":"imp","t":"Lei 8.429 · Art. 10","q":"Quais as sanções da lesão ao erário (art. 12, II)?","a":"Perda dos bens acrescidos ilicitamente (se concorrer essa circunstância), perda da função pública, suspensão dos direitos políticos até 12 anos, multa civil equivalente ao valor do dano e proibição de contratar com o poder público ou receber benefícios ou incentivos, por prazo não superior a 12 anos."},{"id":"i4","deck":"imp","t":"Lei 8.429 · Art. 11","q":"Violação dos princípios (art. 11): qual o núcleo do tipo?","a":"Ação ou omissão dolosa que viole os deveres de honestidade, imparcialidade e legalidade, caracterizada por uma das condutas listadas no artigo. Exige o fim de obter proveito ou benefício indevido (§1º) e lesividade relevante ao bem jurídico (§4º); independe de dano ao erário ou enriquecimento ilícito."},{"id":"i5","deck":"imp","t":"Lei 8.429 · Art. 11","q":"Quais as sanções da violação dos princípios (art. 12, III)?","a":"Multa civil de até 24 vezes a remuneração percebida pelo agente e proibição de contratar com o poder público ou receber benefícios ou incentivos, por prazo não superior a 4 anos. Não há perda da função pública nem suspensão dos direitos políticos."}],"crimes":[{"art":"293","nome":"Falsificação de papéis públicos","v":["falsificar"],"pena":"Reclusão, 2 a 8 anos, e multa","g":"F","obs":"Selos, papéis de crédito público, vale postal, guias de tributo etc."},{"art":"294","nome":"Petrechos de falsificação","v":["fabricar","adquirir","fornecer","possuir","guardar"],"pena":"Reclusão, 1 a 3 anos, e multa","g":"F","obs":"Objeto especialmente destinado à falsificação dos papéis do art. 293"},{"art":"296","nome":"Falsificação do selo ou sinal público","v":["falsificar"],"pena":"Reclusão, 2 a 6 anos, e multa","g":"F","obs":"Aumenta-se 1/6 se funcionário público prevalecendo-se do cargo"},{"art":"297","nome":"Falsificação de documento público","v":["falsificar","alterar"],"pena":"Reclusão, 2 a 6 anos, e multa","g":"F","obs":"Funcionário público: aumento de 1/6"},{"art":"298","nome":"Falsificação de documento particular","v":["falsificar","alterar"],"pena":"Reclusão, 1 a 5 anos, e multa","g":"F","obs":"Equipara-se a documento particular o cartão de crédito ou débito"},{"art":"299","nome":"Falsidade ideológica","v":["omitir","inserir","fazer inserir"],"pena":"Reclusão, 1 a 5 anos, e multa (público); reclusão, 1 a 3 anos, e multa (particular)","g":"F","obs":"Fim especial: prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante"},{"art":"300","nome":"Falso reconhecimento de firma ou letra","v":["reconhecer"],"pena":"Reclusão, 1 a 5 anos, e multa (público); 1 a 3 anos, e multa (particular)","g":"F","obs":"Crime próprio de quem exerce função pública"},{"art":"301","nome":"Certidão ou atestado ideologicamente falso","v":["atestar","certificar"],"pena":"Detenção, 2 meses a 1 ano","g":"F","obs":"§1º falsidade material de atestado ou certidão: detenção, 3 meses a 2 anos"},{"art":"302","nome":"Falsidade de atestado médico","v":["dar"],"pena":"Detenção, 1 mês a 1 ano","g":"F","obs":"Crime próprio do médico; com fim de lucro, também multa"},{"art":"303","nome":"Reprodução ou adulteração de selo ou peça filatélica","v":["reproduzir","alterar"],"pena":"Detenção, 1 a 3 anos, e multa","g":"F","obs":"Salvo se a reprodução ou alteração está visivelmente anotada"},{"art":"304","nome":"Uso de documento falso","v":["fazer uso"],"pena":"Pena do crime de falsificação ou alteração (arts. 297 a 302)","g":"F","obs":"Remete às penas dos arts. 297 a 302"},{"art":"305","nome":"Supressão de documento","v":["destruir","suprimir","ocultar"],"pena":"Reclusão, 2 a 6 anos, e multa (público); 1 a 5 anos, e multa (particular)","g":"F","obs":"Documento verdadeiro de que não podia dispor"},{"art":"307","nome":"Falsa identidade","v":["atribuir-se","atribuir"],"pena":"Detenção, 3 meses a 1 ano, ou multa","g":"F","obs":"Subsidiário: se não constitui elemento de crime mais grave"},{"art":"308","nome":"Uso de documento de identidade alheia","v":["usar","ceder"],"pena":"Detenção, 4 meses a 2 anos, e multa","g":"F","obs":"Subsidiário: se não constitui elemento de crime mais grave"},{"art":"311-A","nome":"Fraudes em certames de interesse público","v":["utilizar","divulgar"],"pena":"Reclusão, 1 a 4 anos, e multa","g":"F","obs":"Conteúdo sigiloso de concurso, exame público etc.; dano à administração: 2 a 6 anos; +1/3 se funcionário"},{"art":"312","nome":"Peculato","v":["apropriar-se","desviar"],"pena":"Reclusão, 2 a 12 anos, e multa","g":"A","obs":"§1º peculato-furto; §2º culposo (detenção, 3 meses a 1 ano)"},{"art":"313","nome":"Peculato mediante erro de outrem","v":["apropriar-se"],"pena":"Reclusão, 1 a 4 anos, e multa","g":"A","obs":"Recebeu por erro de outrem, no exercício do cargo"},{"art":"313-A","nome":"Inserção de dados falsos em sistema de informações","v":["inserir","facilitar","alterar","excluir"],"pena":"Reclusão, 2 a 12 anos, e multa","g":"A","obs":"Funcionário autorizado; fim de vantagem indevida ou dano"},{"art":"313-B","nome":"Modificação ou alteração não autorizada de sistema de informações","v":["modificar","alterar"],"pena":"Detenção, 3 meses a 2 anos, e multa","g":"A","obs":"Aumento de 1/3 até 1/2 se há dano"},{"art":"314","nome":"Extravio, sonegação ou inutilização de livro ou documento","v":["extraviar","sonegar","inutilizar"],"pena":"Reclusão, 1 a  (L.length?L.map(h=>{const x=idx[h.b];if(!x)return'';const bk=BOOKS[x.bk];return `<div class="card"><div class="mut" style="margin-bottom:6px">${bk} › ${esc(x.s.title)}${x.h?' › '+esc(x.h):''}</div>${x.b.row?`<div class="mut"><b>${esc(x.b.row)}</b></div>`:''}<div class="doc"><p>${seg(x.b.t,h.b,x.b.v,h.id)}</p></div><textarea rows="3" placeholder="Anotação…" oninput="setN('${h.id}',this.value)">${esc(h.n||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" onclick="readAt('${h.b}')">Ver no texto</button><button class="btn sm er" onclick="delHl('${h.id}')">Remover</button></div></div>`}).join(''):`<div class="card mut">Nada por aqui ainda. Na leitura, selecione um trecho e toque em <b>Anotar</b>.</div>`)+footer()}
// ---------- prazos
function prazoItems(){const o=[];PZB.forEach(bk=>books[bk].forEach(s=>s.b.forEach(b=>{if(b.k==='p'&&TIME.test(b.t))o.push({bk,s,b,id:b.id,l:idx[b.id].h,t:b.t});
 if(b.k==='tbl')b.rows.forEach((r,i)=>{const t=r.join(' — ');if(TIME.test(t))o.push({bk,s,id:b.id+'.'+i+'.1',l:r.length>1&&r[0].length<46?r[0]:'',t:r.length>1&&r[0].length<46?r.slice(1).join(' — '):t})})})));return o}
function vPrazos(){const q=(S.ui.pq||'').toLowerCase(),bf=S.ui.pb||'';let it=prazoItems().filter(x=>(!bf||x.bk===bf)&&(!q||(x.t+x.l).toLowerCase().includes(q)));
 const bks=['',...PZB],pn=S.ui.pn||60,tot=it.length;it=it.slice(0,pn);let cur='';
 $('#app').innerHTML=`<h2>Prazos</h2><div class="mut" style="margin-bottom:10px">Trechos de todas as normas (exceto penas do Código Penal) que mencionam prazos em dias, horas, meses ou anos.</div><div class="row" style="margin-bottom:8px">${bks.map(k=>`<button class="chip ${bf===k?'on':''}" onclick="S.ui.pb='${k}';S.ui.pn=60;render()">${k?BOOKS[k]:'Todos'}</button>`).join('')}</div><input type="search" placeholder="Buscar…" value="${esc(S.ui.pq||'')}" oninput="S.ui.pq=this.value;clearTimeout(vPrazos.t);vPrazos.t=setTimeout(()=>{render();const i=$('input[type=search]');i.focus();i.setSelectionRange(99,99)},300)" style="margin-bottom:12px"><div class="mut" style="margin-bottom:8px">${tot} trechos${tot>pn?` · mostrando ${pn}`:''}</div>`+
 it.map(x=>{let h='';const k=x.bk+x.s.id;if(k!==cur){cur=k;h=`<h3>${BOOKS[x.bk]} › ${esc(x.s.title)}</h3>`}
 return h+`<div class="card" style="padding:10px 14px">${x.l?`<div class="mut"><b>${esc(x.l)}</b></div>`:''}<div class="doc" style="font-size:16px">${seg(x.t,'_',null)}</div><button class="lnk" onclick="readAt('${x.id}')">abrir no texto →</button></div>`}).join('')+(tot>pn?`<button class="btn" onclick="S.ui.pn=${pn+120};render()">Mostrar mais</button>`:'')+footer()}
// ---------- tabelas
const TABS=[['imp','Improbidade'],['crimes','Crimes, verbos e penas'],['ben','Benefícios despenalizadores'],['pns','Prazos NSCGJ'],['pri','Prazos RI'],['qri','Quóruns RI'],['jul','Quem julga o quê'],['resp','Corregedoria: quem faz o quê']];
const gs=(bk,re)=>{const s=books[bk].find(x=>re.test(x.title));return s?`<h3>${esc(s.title)}</h3>`+s.b.map(b=>b.k==='tbl'?tblHtml(b,false):b.k==='h'?`<h4>${esc(b.t)}</h4>`:`<p class="mut">${esc(b.t)}</p>`).join(''):''};
function vTab(){const t=S.ui.tab||'imp';let h='';
 if(t==='imp'){const R=D.tabs.imp;h=`<div class="tw"><table><tr><th></th>${R[0].slice(1).map(c=>`<th>Art. ${['9º','10','11'][R[0].indexOf(c)-1]} — ${esc(c)}</th>`).join('')}</tr>${R.slice(1).map(r=>r[2]===''&&r[3]===''?`<tr><td>${esc(r[0])}</td><td colspan="3">${seg(r[1],'_')}</td></tr>`:`<tr><td>${esc(r[0])}</td>${r.slice(1).map(c=>`<td>${seg(c,'_')}</td>`).join('')}</tr>`).join('')}</table></div>`}
 else if(t==='crimes'){const g=S.ui.cg||'',q=(S.ui.cq||'').toLowerCase();const L=D.crimes.filter(c=>(!g||c.g===g)&&(!q||(c.nome+c.v.join(' ')+c.art).toLowerCase().includes(q)));
  h=`<div class="row" style="margin-bottom:8px"><button class="chip ${g?'':'on'}" onclick="S.ui.cg='';render()">Todos</button>${Object.keys(D.grp).map(k=>`<button class="chip ${g===k?'on':''}" onclick="S.ui.cg='${k}';render()">${D.grp[k].split(' (')[0].replace('Praticados por ','').replace('Crimes contra a ','')}</button>`).join('')}</div><input type="search" placeholder="Buscar crime, verbo ou artigo…" value="${esc(S.ui.cq||'')}" oninput="S.ui.cq=this.value;clearTimeout(vTab.t);vTab.t=setTimeout(()=>{render();const i=$('input[type=search]');i.focus();i.setSelectionRange(99,99)},300)" style="margin-bottom:10px"><div class="tw"><table><tr><th>Art.</th><th>Crime</th><th>Verbos nucleares</th><th>Pena</th><th>Observações</th></tr>${L.map(c=>`<tr><td>${c.art}</td><td>${esc(c.nome)}</td><td><span class="vb">${esc(c.v.join(' · '))}</span></td><td>${seg(c.pena,'_')}</td><td class="mut">${seg(c.obs,'_')}</td></tr>`).join('')}</table></div>`}
 else if(t==='ben')h=`<div class="tw"><table><tr><th>Instituto</th><th>Art.</th><th>Quando cabe</th><th>Efeito</th><th>Observações</th></tr>${D.tabs.ben.map(r=>`<tr>${r.map(c=>`<td>${seg(c,'_')}</td>`).join('')}</tr>`).join('')}</table></div>`;
 else if(t==='pns')h=gs('ns',/^18\./);else if(t==='pri')h=gs('ri',/^21\./);else if(t==='qri')h=gs('ri',/^22\./);else if(t==='jul')h=gs('ri',/^23\./);else h=gs('ns',/^19\./);
 $('#app').innerHTML=`<h2>Tabelas de memorização</h2><div class="row" style="margin-bottom:12px">${TABS.map(([k,n])=>`<button class="chip ${k===t?'on':''}" onclick="S.ui.tab='${k}';render()">${n}</button>`).join('')}</div>${h}${footer()}`}
// ---------- flashcards
let FQ=null;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cst=id=>S.cd[id]||(S.cd[id]={ok:0,er:0,wr:false});
function vFlash(){if(FQ)return fcCard();const dk=S.ui.deck||'all';const C=D.cards,tot=C.reduce((a,c)=>{const s=S.cd[c.id];return s?{ok:a.ok+s.ok,er:a.er+s.er}:a},{ok:0,er:0}),wr=C.filter(c=>S.cd[c.id]&&S.cd[c.id].wr);
 const pool=dk==='all'?C:dk==='wr'?wr:C.filter(c=>c.deck===dk),n=tot.ok+tot.er,td=S.hist[new Date().toISOString().slice(0,10)]||{ok:0,er:0};
 const dd=k=>{const L=C.filter(c=>c.deck===k),a=L.reduce((x,c)=>x+(S.cd[c.id]?S.cd[c.id].ok:0),0),e=L.reduce((x,c)=>x+(S.cd[c.id]?S.cd[c.id].er:0),0);return{n:L.length,a,e,p:a+e?Math.round(100*a/(a+e)):0}};
 const worst=C.filter(c=>S.cd[c.id]&&S.cd[c.id].er).sort((a,b)=>S.cd[b.id].er-S.cd[a.id].er).slice(0,6);
 $('#app').innerHTML=`<h2>Flashcards</h2><div class="card"><div class="row" style="margin-bottom:12px">${[['all','Todos ('+C.length+')'],['crime','Crimes ('+dd('crime').n+')'],['ben','Benefícios despenalizadores ('+dd('ben').n+')'],['imp','Improbidade ('+dd('imp').n+')'],['wr','Só errados ('+wr.length+')']].map(([k,l])=>`<button class="chip ${dk===k?'on':''}" onclick="S.ui.deck='${k}';save();render()">${l}</button>`).join('')}</div>
 <button class="btn pri" ${pool.length?'':'disabled'} onclick="fcStart()">Estudar ${pool.length} cards</button> <span class="mut">Os errados voltam em posição aleatória, misturados aos demais.</span></div>
 <div class="stat"><div><b>${n}</b><span>respostas</span></div><div><b style="color:var(--ok)">${tot.ok}</b><span>acertos</span></div><div><b style="color:var(--er)">${tot.er}</b><span>erros</span></div><div><b>${n?Math.round(100*tot.ok/n):0}%</b><span>aproveitamento</span></div><div><b>${td.ok+td.er}</b><span>hoje (${td.ok} ✓)</span></div><div><b>${wr.length}</b><span>pendentes de revisão</span></div></div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Por baralho</h3>${[['crime','Crimes'],['ben','Benefícios despenalizadores'],['imp','Improbidade administrativa']].map(([k,l])=>{const d=dd(k);return `<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${l}</span><span class="mut">${d.a} ✓ · ${d.e} ✗ · ${d.p}%</span></div><div class="bar"><i style="width:${d.p}%"></i></div></div>`}).join('')}
 ${worst.length?`<h3>Mais errados</h3>`+worst.map(c=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0"><span style="font-size:14px">${esc(c.q)}</span><span class="mut">${S.cd[c.id].er} ✗ / ${S.cd[c.id].ok} ✓</span></div>`).join(''):''}<button class="btn sm" style="margin-top:10px" onclick="if(confirm('Zerar estatísticas dos flashcards?')){S.cd={};S.hist={};save();render()}">Zerar estatísticas</button></div>${footer()}`}
function fcStart(){const dk=S.ui.deck||'all',C=D.cards,pool=dk==='all'?C:dk==='wr'?C.filter(c=>S.cd[c.id]&&S.cd[c.id].wr):C.filter(c=>c.deck===dk);FQ={q:shuf(pool.map(c=>c.id)),n:pool.length,ok:0,er:0,back:false};render()}
function fcCard(){const F=FQ;if(!F.q.length){$('#app').innerHTML=`<h2>Sessão concluída</h2><div class="card"><div class="stat"><div><b>${F.n}</b><span>cards</span></div><div><b style="color:var(--ok)">${F.ok}</b><span>acertos</span></div><div><b style="color:var(--er)">${F.er}</b><span>erros (reinseridos até acertar)</span></div></div><div class="row" style="margin-top:14px"><button class="btn pri" onclick="FQ=null;render()">Voltar</button><button class="btn" onclick="fcStart()">Nova sessão</button></div></div>`+footer();return}
 const c=D.cards.find(x=>x.id===F.q[0]),wr=S.cd[c.id]&&S.cd[c.id].wr;
 $('#app').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn sm" onclick="FQ=null;render()">← Sair</button><span class="mut">${F.q.length} restantes · ${F.ok} ✓ · ${F.er} ✗</span></div><div class="bar" style="margin-bottom:12px"><i style="width:${100*(F.n-new Set(F.q).size)/F.n}%"></i></div>
 <div class="card fc"><div class="t">${esc(c.t)}${wr?' · revisão':''}</div>${F.back?`<div class="mut" style="margin-bottom:8px">${esc(c.q)}</div><div class="a">${seg(c.a,'_')}</div>`:`<div class="q">${esc(c.q)}</div>`}</div>
 <div class="row" style="justify-content:center">${F.back?`<button class="btn" onclick="FQ.back=false;render()">Ver pergunta</button><button class="btn er" onclick="fcMark(0)">Errei</button><button class="btn ok" onclick="fcMark(1)">Acertei</button>`:`<button class="btn pri" onclick="FQ.back=true;render()">Ver resposta</button>`}</div>${footer()}`}
function fcMark(ok){const id=FQ.q.shift(),s=cst(id),d=new Date().toISOString().slice(0,10),h=S.hist[d]||(S.hist[d]={ok:0,er:0});
 if(ok){s.ok++;s.wr=false;h.ok++;FQ.ok++}else{s.er++;s.wr=true;h.er++;FQ.er++;const p=FQ.q.length?Math.min(FQ.q.length,1+(Math.random()*FQ.q.length|0)):0;FQ.q.splice(p,0,id)}
 FQ.back=false;save();render()}
// ---------- tipos penais
let TQ=null;
const allV=[...new Set(D.crimes.flatMap(c=>c.v))];
function vTipos(){if(TQ&&TQ.c)return tCard();const g=S.ui.tg||'',L=D.crimes.filter(c=>!g||c.g===g);let a=0,e=0;D.crimes.forEach(c=>{const t=S.ty[c.art];if(t){a+=t.ok;e+=t.er}});
 $('#app').innerHTML=`<h2>Gravar tipos penais</h2><div class="card"><div class="mut" style="margin-bottom:10px">Veja o crime e marque os verbos nucleares entre as opções.</div><div class="row" style="margin-bottom:12px"><button class="chip ${g?'':'on'}" onclick="S.ui.tg='';render()">Todos (${D.crimes.length})</button>${Object.keys(D.grp).map(k=>`<button class="chip ${g===k?'on':''}" onclick="S.ui.tg='${k}';render()">${D.grp[k].split(' (')[0].replace('Praticados por ','').replace('Crimes contra a ','')}</button>`).join('')}</div><button class="btn pri" onclick="tStart()">Começar (${L.length} crimes)</button> <button class="btn er" onclick="if(confirm('Excluir todos os dados (acertos e erros) dos tipos penais?')){S.ty={};save();render()}">Excluir dados</button></div>
 <div class="stat"><div><b>${a+e}</b><span>respostas</span></div><div><b style="color:var(--ok)">${a}</b><span>acertos</span></div><div><b style="color:var(--er)">${e}</b><span>erros</span></div><div><b>${a+e?Math.round(100*a/(a+e)):0}%</b><span>aproveitamento</span></div></div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Por crime</h3>${L.map(c=>{const t=S.ty[c.art]||{ok:0,er:0};return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:14.5px"><span>Art. ${c.art} — ${esc(c.nome)}</span><span class="mut">${t.ok} ✓ · ${t.er} ✗ ${t.ok+t.er?`<button class="lnk" title="Excluir dados deste crime" onclick="delTy('${c.art}')">✕</button>`:''}</span></div>`}).join('')}</div>${footer()}`}
function delTy(a){delete S.ty[a];save();render()}
function tStart(){const g=S.ui.tg||'';TQ={q:shuf(D.crimes.filter(c=>!g||c.g===g)),c:null};tNext()}
function tNext(){const c=TQ.q.shift();if(!c){TQ=null;render();return}const wrong=shuf(allV.filter(v=>!c.v.includes(v)&&!c.v.some(x=>x.split(' ')[0]===v.split(' ')[0]))).slice(0,Math.max(4,6-c.v.length));
 TQ.c=c;TQ.o=shuf([...c.v,...wrong]);TQ.sel=new Set();TQ.done=false;render()}
function tCard(){const c=TQ.c,d=TQ.done;
 $('#app').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn sm" onclick="TQ=null;render()">← Sair</button><span class="mut">${TQ.q.length} restantes</span></div><div class="card"><div class="mut">Art. ${c.art}</div><h2 style="margin:2px 0 6px">${esc(c.nome)}</h2><div class="mut" style="margin-bottom:14px">${c.v.length>1?'Selecione os verbos nucleares do tipo.':'Selecione o verbo nuclear do tipo.'} ${d?'':'(Pode haver mais de um.)'}</div>
 <div class="row">${TQ.o.map((v,i)=>{let k='';const on=TQ.sel.has(v),ok=c.v.includes(v);if(d)k=on&&ok?'good':on?'bad':ok?'miss':'';else k=on?'on':'';return `<button class="opt ${k}" ${d?'disabled':`onclick="tTog(${i})"`}>${esc(v)}</button>`}).join('')}</div>
 ${d?`<div class="doc" style="margin-top:14px"><p>${caput(c)}</p></div><div class="mut">${esc(c.pena)}</div>`:''}
 <div class="row" style="margin-top:16px">${d?`<button class="btn pri" onclick="tNext()">Próximo</button>`:`<button class="btn pri" onclick="tCheck()" ${TQ.sel.size?'':'disabled'}>Conferir</button>`}</div></div>${footer()}`}
function caput(c){const re=new RegExp('^Art\\.\\s*'+c.art.replace('-','\\-')+'(?![\\dA-Za-z-])');for(const s of books.cp)for(const b of s.b)if(b.k==='p'&&re.test(b.t))return seg(b.t,b.id,c.v);return esc(c.nome)}
const tTog=i=>{const v=TQ.o[i];TQ.sel.has(v)?TQ.sel.delete(v):TQ.sel.add(v);tCard()};
function tCheck(){const c=TQ.c,ok=c.v.length===TQ.sel.size&&c.v.every(v=>TQ.sel.has(v)),t=S.ty[c.art]||(S.ty[c.art]={ok:0,er:0});ok?t.ok++:t.er++;TQ.done=true;save();tCard()}
// ---------- PWA icon + manifest
(function(){try{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;c.getContext('2d').drawImage(im,0,0,512,512);const u=c.toDataURL('image/png');
 const l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);
 const m={name:'Escriba — estudo para Escrevente TJSP',short_name:'Escriba',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f6f8fa',theme_color:'#f4f7f9',icons:[{src:u,sizes:'512x512',type:'image/png',purpose:'any'}]};
 const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k)};
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" '))}catch(e){}})();
render();
</script></body></html>
