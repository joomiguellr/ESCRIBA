e lei."},{"k":"p","t":"Parágrafo único. O procedimento comum aplica-se subsidiariamente aos demais procedimentos especiais e ao processo de execução."},{"k":"h","t":"CAPÍTULO II — DA PETIÇÃO INICIAL"},{"k":"h","t":"SEÇÃO I — DOS REQUISITOS DA PETIÇÃO INICIAL"},{"k":"p","t":"Art. 319. A petição inicial indicará:"},{"k":"p","t":"I - o juízo a que é dirigida;"},{"k":"p","t":"II - os nomes, os prenomes, o estado civil, a existência de união estável, a profissão, o número de inscrição no Cadastro de Pessoas Físicas ou no Cadastro Nacional da Pessoa Jurídica, o endereço eletrônico, o domicílio e a residência do autor e do réu;"},{"k":"p","t":"III - o fato e os fundamentos jurídicos do pedido;"},{"k":"p","t":"IV - o pedido com as suas especificações;"},{"k":"p","t":"V - o valor da causa;"},{"k":"p","t":"VI - as provas com que o autor pretende demonstrar a verdade dos fatos alegados;"},{"k":"p","t":"VII - a opção do autor pela realização ou não de audiência de conciliação ou de mediação."},{"k":"p","t":"§ 1º Caso não disponha das informações previstas no inciso II, poderá o autor, na petição inicial, requerer ao juiz diligências necessárias a sua obtenção."},{"k":"p","t":"§ 2º A petição inicial não será indeferida se, a despeito da falta de informações a que se refere o inciso II, for possível a citação do réu."},{"k":"p","t":"§ 3º A petição inicial não será indeferida pelo não atendimento ao disposto no inciso II deste artigo se a obtenção de tais informações tornar impossível ou excessivamente oneroso o acesso à justiça."},{"k":"p","t":"Art. 320. A petição inicial será instruída com os documentos indispensáveis à propositura da ação."},{"k":"p","t":"Art. 321. O juiz, ao verificar que a petição inicial não preenche os requisitos dos arts. 319 e 320 ou que apresenta defeitos e irregularidades capazes de dificultar o julgamento de mérito, determinará que o autor, no prazo de 15 (quinze) dias, a emende ou a complete, indicando com precisão o que deve ser corrigido ou completado."},{"k":"p","t":"Parágrafo único. Se o autor não cumprir a diligência, o juiz indeferirá a petição inicial."},{"k":"h","t":"SEÇÃO II — DO PEDIDO"},{"k":"p","t":"Art. 322. O pedido deve ser certo."},{"k":"p","t":"§ 1º Compreendem-se no principal os juros legais, a correção monetária e as verbas de sucumbência, inclusive os honorários advocatícios."},{"k":"p","t":"§ 2º A interpretação do pedido considerará o conjunto da postulação e observará o princípio da boa-fé."},{"k":"p","t":"Art. 323. Na ação que tiver por objeto cumprimento de obrigação em prestações sucessivas, essas serão consideradas incluídas no pedido, independentemente de declaração expressa do autor, e serão incluídas na condenação, enquanto durar a obrigação, se o devedor, no curso do processo, deixar de pagá-las ou de consigná-las."},{"k":"p","t":"Art. 324. O pedido deve ser determinado."},{"k":"p","t":"§ 1º É lícito, porém, formular pedido genérico:"},{"k":"p","t":"I - nas ações universais, se o autor não puder individuar os bens demandados;"},{"k":"p","t":"II - quando não for possível determinar, desde logo, as consequências do ato ou do fato;"},{"k":"p","t":"III - quando a determinação do objeto ou do valor da condenação depender de ato que deva ser praticado pelo réu."},{"k":"p","t":"§ 2º O disposto neste artigo aplica-se à reconvenção."},{"k":"p","t":"Art. 325. O pedido será alternativo quando, pela natureza da obrigação, o devedor puder cumprir a prestação de mais de um modo."},{"k":"p","t":"Parágrafo único. Quando, pela lei ou pelo contrato, a escolha couber ao devedor, o juiz lhe assegurará o direito de cumprir a prestação de um ou de outro modo, ainda que o autor não tenha formulado pedido alternativo."},{"k":"p","t":"Art. 326. É lícito formular mais de um pedido em ordem subsidiária, a fim de que o juiz conheça do posterior, quando não acolher o anterior."},{"k":"p","t":"Parágrafo único. É lícito formular mais de um pedido, alternativamente, para que o juiz acolha um deles."},{"k":"p","t":"Art. 327. É lícita a cumulação, em um único processo, contra o mesmo réu, de vários pedidos, ainda que entre eles não haja conexão."},{"k":"p","t":"§ 1º São requisitos de admissibilidade da cumulação que:"},{"k":"p","t":"I - os pedidos sejam compatíveis entre si;"},{"k":"p","t":"II - seja competente para conhecer deles o mesmo juízo;"},{"k":"p","t":"III - seja adequado para todos os pedidos o tipo de procedimento."},{"k":"p","t":"§ 2º Quando, para cada pedido, corresponder tipo diverso de procedimento, será admitida a cumulação se o autor empregar o procedimento comum, sem prejuízo do emprego das técnicas processuais diferenciadas previstas nos procedimentos especiais a que se sujeitam um ou mais pedidos cumulados, que não forem incompatíveis com as disposições sobre o procedimento comum."},{"k":"p","t":"§ 3º O inciso I do § 1º não se aplica às cumulações de pedidos de que trata o art. 326 ."},{"k":"p","t":"Art. 328. Na obrigação indivisível com pluralidade de credores, aquele que não participou do processo receberá sua parte, deduzidas as despesas na proporção de seu crédito."},{"k":"p","t":"Art. 329. O autor poderá:"},{"k":"p","t":"I - até a citação, aditar ou alterar o pedido ou a causa de pedir, independentemente de consentimento do réu;"},{"k":"p","t":"II - até o saneamento do processo, aditar ou alterar o pedido e a causa de pedir, com consentimento do réu, assegurado o contraditório mediante a possibilidade de manifestação deste no prazo mínimo de 15 (quinze) dias, facultado o requerimento de prova suplementar."},{"k":"p","t":"Parágrafo único. Aplica-se o disposto neste artigo à reconvenção e à respectiva causa de pedir."},{"k":"h","t":"SEÇÃO III — DO INDEFERIMENTO DA PETIÇÃO INICIAL"},{"k":"p","t":"Art. 330. A petição inicial será indeferida quando:"},{"k":"p","t":"I - for inepta;"},{"k":"p","t":"II - a parte for manifestamente ilegítima;"},{"k":"p","t":"III - o autor carecer de interesse processual;"},{"k":"p","t":"IV - não atendidas as prescrições dos arts. 106 e 321 ."},{"k":"p","t":"§ 1º Considera-se inepta a petição inicial quando:"},{"k":"p","t":"I - lhe faltar pedido ou causa de pedir;"},{"k":"p","t":"II - o pedido for indeterminado, ressalvadas as hipóteses legais em que se permite o pedido genérico;"},{"k":"p","t":"III - da narração dos fatos não decorrer logicamente a conclusão;"},{"k":"p","t":"IV - contiver pedidos incompatíveis entre si."},{"k":"p","t":"§ 2º Nas ações que tenham por objeto a revisão de obrigação decorrente de empréstimo, de financiamento ou de alienação de bens, o autor terá de, sob pena de inépcia, discriminar na petição inicial, dentre as obrigações contratuais, aquelas que pretende controverter, além de quantificar o valor incontroverso do débito."},{"k":"p","t":"§ 3º Na hipótese do § 2º, o valor incontroverso deverá continuar a ser pago no tempo e modo contratados."},{"k":"p","t":"Art. 331. Indeferida a petição inicial, o autor poderá apelar, facultado ao juiz, no prazo de 5 (cinco) dias, retratar-se."},{"k":"p","t":"§ 1º Se não houver retratação, o juiz mandará citar o réu para responder ao recurso."},{"k":"p","t":"§ 2º Sendo a sentença reformada pelo tribunal, o prazo para a contestação começará a correr da intimação do retorno dos autos, observado o disposto no art. 334 ."},{"k":"p","t":"§ 3º Não interposta a apelação, o réu será intimado do trânsito em julgado da sentença."},{"k":"h","t":"CAPÍTULO III — DA IMPROCEDÊNCIA LIMINAR DO PEDIDO"},{"k":"p","t":"Art. 332. Nas causas que dispensem a fase instrutória, o juiz, independentemente da citação do réu, julgará liminarmente improcedente o pedido que contrariar:"},{"k":"p","t":"I - enunciado de súmula do Supremo Tribunal Federal ou do Superior Tribunal de Justiça;"},{"k":"p","t":"II - acórdão proferido pelo Supremo Tribunal Federal ou pelo Superior Tribunal de Justiça em julgamento de recursos repetitivos;"},{"k":"p","t":"III - entendimento firmado em incidente de resolução de demandas repetitivas ou de assunção de competência;"},{"k":"p","t":"IV - enunciado de súmula de tribunal de justiça sobre direito local."},{"k":"p","t":"§ 1º O juiz também poderá julgar liminarmente improcedente o pedido se verificar, desde logo, a ocorrência de decadência ou de prescrição."},{"k":"p","t":"§ 2º Não interposta a apelação, o réu será intimado do trânsito em julgado da sentença, nos termos do art. 241 ."},{"k":"p","t":"§ 3º Interposta a apelação, o juiz poderá retratar-se em 5 (cinco) dias."},{"k":"p","t":"§ 4º Se houver retratação, o juiz determinará o prosseguimento do processo, com a citação do réu, e, se não houver retratação, determinará a citação do réu para apresentar contrarrazões, no prazo de 15 (quinze) dias."},{"k":"h","t":"CAPÍTULO IV — DA CONVERSÃO DA AÇÃO INDIVIDUAL EM AÇÃO COLETIVA ART. 333. (VETADO)."},{"k":"h","t":"CAPÍTULO V — DA AUDIÊNCIA DE CONCILIAÇÃO OU DE MEDIAÇÃO"},{"k":"p","t":"Art. 334. Se a petição inicial preencher os requisitos essenciais e não for o caso de improcedência liminar do pedido, o juiz designará audiência de conciliação ou de mediação com antecedência mínima de 30 (trinta) dias, devendo ser citado o réu com pelo menos 20 (vinte) dias de antecedência."},{"k":"p","t":"§ 1º O conciliador ou mediador, onde houver, atuará necessariamente na audiência de conciliação ou de mediação, observando o disposto neste Código, bem como as disposições da lei de organização judiciária."},{"k":"p","t":"§ 2º Poderá haver mais de uma sessão destinada à conciliação e à mediação, não podendo exceder a 2 (dois) meses da data de realização da primeira sessão, desde que necessárias à composição das partes."},{"k":"p","t":"§ 3º A intimação do autor para a audiência será feita na pessoa de seu advogado."},{"k":"p","t":"§ 4º A audiência não será realizada:"},{"k":"p","t":"I - se ambas as partes manifestarem, expressamente, desinteresse na composição consensual;"},{"k":"p","t":"II - quando não se admitir a autocomposição."},{"k":"p","t":"§ 5º O autor deverá indicar, na petição inicial, seu desinteresse na autocomposição, e o réu deverá fazêlo, por petição, apresentada com 10 (dez) dias de antecedência, contados da data da audiência."},{"k":"p","t":"§ 6º Havendo litisconsórcio, o desinteresse na realização da audiência deve ser manifestado por todos os litisconsortes."},{"k":"p","t":"§ 7º A audiência de conciliação ou de mediação pode realizar-se por meio eletrônico, nos termos da lei."},{"k":"p","t":"§ 8º O não comparecimento injustificado do autor ou do réu à audiência de conciliação é considerado ato atentatório à dignidade da justiça e será sancionado com multa de até dois por cento da vantagem econômica pretendida ou do valor da causa, revertida em favor da União ou do Estado."},{"k":"p","t":"§ 9º As partes devem estar acompanhadas por seus advogados ou defensores públicos."},{"k":"p","t":"§ 10. A parte poderá constituir representante, por meio de procuração específica, com poderes para negociar e transigir."},{"k":"p","t":"§ 11. A autocomposição obtida será reduzida a termo e homologada por sentença."},{"k":"p","t":"§ 12. A pauta das audiências de conciliação ou de mediação será organizada de modo a respeitar o intervalo mínimo de 20 (vinte) minutos entre o início de uma e o início da seguinte."}]},{"id":"s9","title":"CAPÍTULO VI — DA CONTESTAÇÃO · arts. 335 a 354","tag":"","b":[{"k":"h","t":"CAPÍTULO VI — DA CONTESTAÇÃO"},{"k":"p","t":"Art. 335. O réu poderá oferecer contestação, por petição, no prazo de 15 (quinze) dias, cujo termo inicial será a data:"},{"k":"p","t":"I - da audiência de conciliação ou de mediação, ou da última sessão de conciliação, quando qualquer parte não comparecer ou, comparecendo, não houver autocomposição;"},{"k":"p","t":"II - do protocolo do pedido de cancelamento da audiência de conciliação ou de mediação apresentado pelo réu, quando ocorrer a hipótese do art. 334, § 4º, inciso I ;"},{"k":"p","t":"III - prevista no art. 231 , de acordo com o modo como foi feita a citação, nos demais casos."},{"k":"p","t":"§ 1º No caso de litisconsórcio passivo, ocorrendo a hipótese do art. 334, § 6º , o termo inicial previsto no inciso II será, para cada um dos réus, a data de apresentação de seu respectivo pedido de cancelamento da audiência."},{"k":"p","t":"§ 2º Quando ocorrer a hipótese do art. 334, § 4º, inciso II , havendo litisconsórcio passivo e o autor desistir da ação em relação a réu ainda não citado, o prazo para resposta correrá da data de intimação da decisão que homologar a desistência."},{"k":"p","t":"Art. 336. Incumbe ao réu alegar, na contestação, toda a matéria de defesa, expondo as razões de fato e de direito com que impugna o pedido do autor e especificando as provas que pretende produzir."},{"k":"p","t":"Art. 337. Incumbe ao réu, antes de discutir o mérito, alegar:"},{"k":"p","t":"I - inexistência ou nulidade da citação;"},{"k":"p","t":"II - incompetência absoluta e relativa;"},{"k":"p","t":"III - incorreção do valor da causa;"},{"k":"p","t":"IV - inépcia da petição inicial;"},{"k":"p","t":"V - perempção;"},{"k":"p","t":"VI - litispendência;"},{"k":"p","t":"VII - coisa julgada;"},{"k":"p","t":"VIII - conexão;"},{"k":"p","t":"IX - incapacidade da parte, defeito de representação ou falta de autorização;"},{"k":"p","t":"X - convenção de arbitragem;"},{"k":"p","t":"XI - ausência de legitimidade ou de interesse processual;"},{"k":"p","t":"XII - falta de caução ou de outra prestação que a lei exige como preliminar;"},{"k":"p","t":"XIII - indevida concessão do benefício de gratuidade de justiça."},{"k":"p","t":"§ 1º Verifica-se a litispendência ou a coisa julgada quando se reproduz ação anteriormente ajuizada."},{"k":"p","t":"§ 2º Uma ação é idêntica a outra quando possui as mesmas partes, a mesma causa de pedir e o mesmo pedido."},{"k":"p","t":"§ 3º Há litispendência quando se repete ação que está em curso."},{"k":"p","t":"§ 4º Há coisa julgada quando se repete ação que já foi decidida por decisão transitada em julgado."},{"k":"p","t":"§ 5º Excetuadas a convenção de arbitragem e a incompetência relativa, o juiz conhecerá de ofício das matérias enumeradas neste artigo."},{"k":"p","t":"§ 6º A ausência de alegação da existência de convenção de arbitragem, na forma prevista neste Capítulo, implica aceitação da jurisdição estatal e renúncia ao juízo arbitral."},{"k":"p","t":"Art. 338. Alegando o réu, na contestação, ser parte ilegítima ou não ser o responsável pelo prejuízo invocado, o juiz facultará ao autor, em 15 (quinze) dias, a alteração da petição inicial para substituição do réu."},{"k":"p","t":"Parágrafo único. Realizada a substituição, o autor reembolsará as despesas e pagará os honorários ao procurador do réu excluído, que serão fixados entre três e cinco por cento do valor da causa ou, sendo este irrisório, nos termos do art. 85, § 8º ."},{"k":"p","t":"Art. 339. Quando alegar sua ilegitimidade, incumbe ao réu indicar o sujeito passivo da relação jurídica discutida sempre que tiver conhecimento, sob pena de arcar com as despesas processuais e de indenizar o autor pelos prejuízos decorrentes da falta de indicação."},{"k":"p","t":"§ 1º O autor, ao aceitar a indicação, procederá, no prazo de 15 (quinze) dias, à alteração da petição inicial para a substituição do réu, observando-se, ainda, o parágrafo único do art. 338 ."},{"k":"p","t":"§ 2º No prazo de 15 (quinze) dias, o autor pode optar por alterar a petição inicial para incluir, como litisconsorte passivo, o sujeito indicado pelo réu."},{"k":"p","t":"Art. 340. Havendo alegação de incompetência relativa ou absoluta, a contestação poderá ser protocolada no foro de domicílio do réu, fato que será imediatamente comunicado ao juiz da causa, preferencialmente por meio eletrônico."},{"k":"p","t":"§ 1º A contestação será submetida a livre distribuição ou, se o réu houver sido citado por meio de carta precatória, juntada aos autos dessa carta, seguindo-se a sua imediata remessa para o juízo da causa."},{"k":"p","t":"§ 2º Reconhecida a competência do foro indicado pelo réu, o juízo para o qual for distribuída a contestação ou a carta precatória será considerado prevento."},{"k":"p","t":"§ 3º Alegada a incompetência nos termos do caput , será suspensa a realização da audiência de conciliação ou de mediação, se tiver sido designada."},{"k":"p","t":"§ 4º Definida a competência, o juízo competente designará nova data para a audiência de conciliação ou de mediação."},{"k":"p","t":"Art. 341. Incumbe também ao réu manifestar-se precisamente sobre as alegações de fato constantes da petição inicial, presumindo-se verdadeiras as não impugnadas, salvo se:"},{"k":"p","t":"I - não for admissível, a seu respeito, a confissão;"},{"k":"p","t":"II - a petição inicial não estiver acompanhada de instrumento que a lei considerar da substância do ato;"},{"k":"p","t":"III - estiverem em contradição com a defesa, considerada em seu conjunto."},{"k":"p","t":"Parágrafo único. O ônus da impugnação especificada dos fatos não se aplica ao defensor público, ao advogado dativo e ao curador especial."},{"k":"p","t":"Art. 342. Depois da contestação, só é lícito ao réu deduzir novas alegações quando:"},{"k":"p","t":"I - relativas a direito ou a fato superveniente;"},{"k":"p","t":"II - competir ao juiz conhecer delas de ofício;"},{"k":"p","t":"III - por expressa autorização legal, puderem ser formuladas em qualquer tempo e grau de jurisdição."},{"k":"h","t":"CAPÍTULO VII — DA RECONVENÇÃO"},{"k":"p","t":"Art. 343. Na contestação, é lícito ao réu propor reconvenção para manifestar pretensão própria, conexa com a ação principal ou com o fundamento da defesa."},{"k":"p","t":"§ 1º Proposta a reconvenção, o autor será intimado, na pessoa de seu advogado, para apresentar resposta no prazo de 15 (quinze) dias."},{"k":"p","t":"§ 2º A desistência da ação ou a ocorrência de causa extintiva que impeça o exame de seu mérito não obsta ao prosseguimento do processo quanto à reconvenção."},{"k":"p","t":"§ 3º A reconvenção pode ser proposta contra o autor e terceiro."},{"k":"p","t":"§ 4º A reconvenção pode ser proposta pelo réu em litisconsórcio com terceiro."},{"k":"p","t":"§ 5º Se o autor for substituto processual, o reconvinte deverá afirmar ser titular de direito em face do substituído, e a reconvenção deverá ser proposta em face do autor, também na qualidade de substituto processual."},{"k":"p","t":"§ 6º O réu pode propor reconvenção independentemente de oferecer contestação."},{"k":"h","t":"CAPÍTULO VIII — DA REVELIA"},{"k":"p","t":"Art. 344. Se o réu não contestar a ação, será considerado revel e presumir-se-ão verdadeiras as alegações de fato formuladas pelo autor."},{"k":"p","t":"Art. 345. A revelia não produz o efeito mencionado no art. 344 se:"},{"k":"p","t":"I - havendo pluralidade de réus, algum deles contestar a ação;"},{"k":"p","t":"II - o litígio versar sobre direitos indisponíveis;"},{"k":"p","t":"III - a petição inicial não estiver acompanhada de instrumento que a lei considere indispensável à prova do ato;"},{"k":"p","t":"IV - as alegações de fato formuladas pelo autor forem inverossímeis ou estiverem em contradição com prova constante dos autos."},{"k":"p","t":"Art. 346. Os prazos contra o revel que não tenha patrono nos autos fluirão da data de publicação do ato decisório no órgão oficial."},{"k":"p","t":"Parágrafo único. O revel poderá intervir no processo em qualquer fase, recebendo-o no estado em que se encontrar."},{"k":"h","t":"CAPÍTULO IX — DAS PROVIDÊNCIAS PRELIMINARES E DO SANEAMENTO"},{"k":"p","t":"Art. 347. Findo o prazo para a contestação, o juiz tomará, conforme o caso, as providências preliminares constantes das seções deste Capítulo."},{"k":"h","t":"SEÇÃO I — DA NÃO INCIDÊNCIA DOS EFEITOS DA REVELIA"},{"k":"p","t":"Art. 348. Se o réu não contestar a ação, o juiz, verificando a inocorrência do efeito da revelia previsto no art. 344 , ordenará que o autor especifique as provas que pretenda produzir, se ainda não as tiver indicado."},{"k":"p","t":"Art. 349. Ao réu revel será lícita a produção de provas, contrapostas às alegações do autor, desde que se faça representar nos autos a tempo de praticar os atos processuais indispensáveis a essa produção."},{"k":"h","t":"SEÇÃO II — DO FATO IMPEDITIVO, MODIFICATIVO OU EXTINTIVO DO DIREITO DO AUTOR"},{"k":"p","t":"Art. 350. Se o réu alegar fato impeditivo, modificativo ou extintivo do direito do autor, este será ouvido no prazo de 15 (quinze) dias, permitindo-lhe o juiz a produção de prova."},{"k":"h","t":"SEÇÃO III — DAS ALEGAÇÕES DO RÉU"},{"k":"p","t":"Art. 351. Se o réu alegar qualquer das matérias enumeradas no art. 337 , o juiz determinará a oitiva do autor no prazo de 15 (quinze) dias, permitindo-lhe a produção de prova."},{"k":"p","t":"Art. 352. Verificando a existência de irregularidades ou de vícios sanáveis, o juiz determinará sua correção em prazo nunca superior a 30 (trinta) dias."},{"k":"p","t":"Art. 353. Cumpridas as providências preliminares ou não havendo necessidade delas, o juiz proferirá julgamento conforme o estado do processo, observando o que dispõe o Capítulo X."},{"k":"h","t":"CAPÍTULO X — DO JULGAMENTO CONFORME O ESTADO DO PROCESSO"},{"k":"h","t":"SEÇÃO I — DA EXTINÇÃO DO PROCESSO"},{"k":"p","t":"Art. 354. Ocorrendo qualquer das hipóteses previstas nos arts. 485 e 487, incisos II e III , o juiz proferirá sentença."},{"k":"p","t":"Parágrafo único. A decisão a que se refere o caput pode dizer respeito a apenas parcela do processo, caso em que será impugnável por agravo de instrumento."}]},{"id":"s10","title":"SEÇÃO II — DO JULGAMENTO ANTECIPADO DO MÉRITO · arts. 355 a 380","tag":"","b":[{"k":"h","t":"SEÇÃO II — DO JULGAMENTO ANTECIPADO DO MÉRITO"},{"k":"p","t":"Art. 355. O juiz julgará antecipadamente o pedido, proferindo sentença com resolução de mérito, quando:"},{"k":"p","t":"I - não houver necessidade de produção de outras provas;"},{"k":"p","t":"II - o réu for revel, ocorrer o efeito previsto no art. 344 e não houver requerimento de prova, na forma do art. 349 ."},{"k":"h","t":"SEÇÃO III — DO JULGAMENTO ANTECIPADO PARCIAL DO MÉRITO"},{"k":"p","t":"Art. 356. O juiz decidirá parcialmente o mérito quando um ou mais dos pedidos formulados ou parcela deles:"},{"k":"p","t":"I - mostrar-se incontroverso;"},{"k":"p","t":"II - estiver em condições de imediato julgamento, nos termos do art. 355 ."},{"k":"p","t":"§ 1º A decisão que julgar parcialmente o mérito poderá reconhecer a existência de obrigação líquida ou ilíquida."},{"k":"p","t":"§ 2º A parte poderá liquidar ou executar, desde logo, a obrigação reconhecida na decisão que julgar parcialmente o mérito, independentemente de caução, ainda que haja recurso contra essa interposto."},{"k":"p","t":"§ 3º Na hipótese do § 2º, se houver trânsito em julgado da decisão, a execução será definitiva."},{"k":"p","t":"§ 4º A liquidação e o cumprimento da decisão que julgar parcialmente o mérito poderão ser processados em autos suplementares, a requerimento da parte ou a critério do juiz."},{"k":"p","t":"§ 5º A decisão proferida com base neste artigo é impugnável por agravo de instrumento."},{"k":"h","t":"SEÇÃO IV — DO SANEAMENTO E DA ORGANIZAÇÃO DO PROCESSO"},{"k":"p","t":"Art. 357. Não ocorrendo nenhuma das hipóteses deste Capítulo, deverá o juiz, em decisão de saneamento e de organização do processo:"},{"k":"p","t":"I - resolver as questões processuais pendentes, se houver;"},{"k":"p","t":"II - delimitar as questões de fato sobre as quais recairá a atividade probatória, especificando os meios de prova admitidos;"},{"k":"p","t":"III - definir a distribuição do ônus da prova, observado o art. 373 ;"},{"k":"p","t":"IV - delimitar as questões de direito relevantes para a decisão do mérito;"},{"k":"p","t":"V - designar, se necessário, audiência de instrução e julgamento."},{"k":"p","t":"§ 1º Realizado o saneamento, as partes têm o direito de pedir esclarecimentos ou solicitar ajustes, no prazo comum de 5 (cinco) dias, findo o qual a decisão se torna estável."},{"k":"p","t":"§ 2º As partes podem apresentar ao juiz, para homologação, delimitação consensual das questões de fato e de direito a que se referem os incisos II e IV, a qual, se homologada, vincula as partes e o juiz."},{"k":"p","t":"§ 3º Se a causa apresentar complexidade em matéria de fato ou de direito, deverá o juiz designar audiência para que o saneamento seja feito em cooperação com as partes, oportunidade em que o juiz, se for o caso, convidará as partes a integrar ou esclarecer suas alegações."},{"k":"p","t":"§ 4º Caso tenha sido determinada a produção de prova testemunhal, o juiz fixará prazo comum não superior a 15 (quinze) dias para que as partes apresentem rol de testemunhas."},{"k":"p","t":"§ 5º Na hipótese do § 3º, as partes devem levar, para a audiência prevista, o respectivo rol de testemunhas."},{"k":"p","t":"§ 6º O número de testemunhas arroladas não pode ser superior a 10 (dez), sendo 3 (três), no máximo, para a prova de cada fato."},{"k":"p","t":"§ 7º O juiz poderá limitar o número de testemunhas levando em conta a complexidade da causa e dos fatos individualmente considerados."},{"k":"p","t":"§ 8º Caso tenha sido determinada a produção de prova pericial, o juiz deve observar o disposto no art. 465 e, se possível, estabelecer, desde logo, calendário para sua realização."},{"k":"p","t":"§ 9º As pautas deverão ser preparadas com intervalo mínimo de 1 (uma) hora entre as audiências."},{"k":"h","t":"CAPÍTULO XI — DA AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO"},{"k":"p","t":"Art. 358. No dia e na hora designados, o juiz declarará aberta a audiência de instrução e julgamento e mandará apregoar as partes e os respectivos advogados, bem como outras pessoas que dela devam participar."},{"k":"p","t":"Art. 359. Instalada a audiência, o juiz tentará conciliar as partes, independentemente do emprego anterior de outros métodos de solução consensual de conflitos, como a mediação e a arbitragem."},{"k":"p","t":"Art. 360. O juiz exerce o poder de polícia, incumbindolhe:"},{"k":"p","t":"I - manter a ordem e o decoro na audiência;"},{"k":"p","t":"II - ordenar que se retirem da sala de audiência os que se comportarem inconvenientemente;"},{"k":"p","t":"III - requisitar, quando necessário, força policial;"},{"k":"p","t":"IV - tratar com urbanidade as partes, os advogados, os membros do Ministério Público e da Defensoria Pública e qualquer pessoa que participe do processo;"},{"k":"p","t":"V - registrar em ata, com exatidão, todos os requerimentos apresentados em audiência."},{"k":"p","t":"Art. 361. As provas orais serão produzidas em audiência, ouvindo-se nesta ordem, preferencialmente:"},{"k":"p","t":"I - o perito e os assistentes técnicos, que responderão aos quesitos de esclarecimentos requeridos no prazo e na forma do art. 477 , caso não respondidos anteriormente por escrito;"},{"k":"p","t":"II - o autor e, em seguida, o réu, que prestarão depoimentos pessoais;"},{"k":"p","t":"III - as testemunhas arroladas pelo autor e pelo réu, que serão inquiridas."},{"k":"p","t":"Parágrafo único. Enquanto depuserem o perito, os assistentes técnicos, as partes e as testemunhas, não poderão os advogados e o Ministério Público intervir ou apartear, sem licença do juiz."},{"k":"p","t":"Art. 362. A audiência poderá ser adiada:"},{"k":"p","t":"I - por convenção das partes;"},{"k":"p","t":"II - se não puder comparecer, por motivo justificado, qualquer pessoa que dela deva necessariamente participar;"},{"k":"p","t":"III - por atraso injustificado de seu início em tempo superior a 30 (trinta) minutos do horário marcado."},{"k":"p","t":"§ 1º O impedimento deverá ser comprovado até a abertura da audiência, e, não o sendo, o juiz procederá à instrução."},{"k":"p","t":"§ 2º O juiz poderá dispensar a produção das provas requeridas pela parte cujo advogado ou defensor público não tenha comparecido à audiência, aplicando-se a mesma regra ao Ministério Público."},{"k":"p","t":"§ 3º Quem der causa ao adiamento responderá pelas despesas acrescidas."},{"k":"p","t":"Art. 363. Havendo antecipação ou adiamento da audiência, o juiz, de ofício ou a requerimento da parte, determinará a intimação dos advogados ou da sociedade de advogados para ciência da nova designação."},{"k":"p","t":"Art. 364. Finda a instrução, o juiz dará a palavra ao advogado do autor e do réu, bem como ao membro do Ministério Público, se for o caso de sua intervenção, sucessivamente, pelo prazo de 20 (vinte) minutos para cada um, prorrogável por 10 (dez) minutos, a critério do juiz."},{"k":"p","t":"§ 1º Havendo litisconsorte ou terceiro interveniente, o prazo, que formará com o da prorrogação um só todo, dividir-se-á entre os do mesmo grupo, se não convencionarem de modo diverso."},{"k":"p","t":"§ 2º Quando a causa apresentar questões complexas de fato ou de direito, o debate oral poderá ser substituído por razões finais escritas, que serão apresentadas pelo autor e pelo réu, bem como pelo Ministério Público, se for o caso de sua intervenção, em prazos sucessivos de 15 (quinze) dias, assegurada vista dos autos."},{"k":"p","t":"Art. 365. A audiência é una e contínua, podendo ser excepcional e justificadamente cindida na ausência de perito ou de testemunha, desde que haja concordância das partes."},{"k":"p","t":"Parágrafo único. Diante da impossibilidade de realização da instrução, do debate e do julgamento no mesmo dia, o juiz marcará seu prosseguimento para a data mais próxima possível, em pauta preferencial."},{"k":"p","t":"Art. 366. Encerrado o debate ou oferecidas as razões finais, o juiz proferirá sentença em audiência ou no prazo de 30 (trinta) dias."},{"k":"p","t":"Art. 367. O servidor lavrará, sob ditado do juiz, termo que conterá, em resumo, o ocorrido na audiência, bem como, por extenso, os despachos, as decisões e a sentença, se proferida no ato."},{"k":"p","t":"§ 1º Quando o termo não for registrado em meio eletrônico, o juiz rubricar-lhe-á as folhas, que serão encadernadas em volume próprio."},{"k":"p","t":"§ 2º Subscreverão o termo o juiz, os advogados, o membro do Ministério Público e o escrivão ou chefe de secretaria, dispensadas as partes, exceto quando houver ato de disposição para cuja prática os advogados não tenham poderes."},{"k":"p","t":"§ 3º O escrivão ou chefe de secretaria trasladará para os autos cópia autêntica do termo de audiência."},{"k":"p","t":"§ 4º Tratando-se de autos eletrônicos, observar-se-á o disposto neste Código, em legislação específica e nas normas internas dos tribunais."},{"k":"p","t":"§ 5º A audiência poderá ser integralmente gravada em imagem e em áudio, em meio digital ou analógico, desde que assegure o rápido acesso das partes e dos órgãos julgadores, observada a legislação específica."},{"k":"p","t":"§ 6º A gravação a que se refere o § 5º também pode ser realizada diretamente por qualquer das partes, independentemente de autorização judicial."},{"k":"p","t":"Art. 368. A audiência será pública, ressalvadas as exceções legais."},{"k":"h","t":"CAPÍTULO XII — DAS PROVAS"},{"k":"h","t":"SEÇÃO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 369. As partes têm o direito de empregar todos os meios legais, bem como os moralmente legítimos, ainda que não especificados neste Código, para provar a verdade dos fatos em que se funda o pedido ou a defesa e influir eficazmente na convicção do juiz."},{"k":"p","t":"Art. 370. Caberá ao juiz, de ofício ou a requerimento da parte, determinar as provas necessárias ao julgamento do mérito."},{"k":"p","t":"Parágrafo único. O juiz indeferirá, em decisão fundamentada, as diligências inúteis ou meramente protelatórias."},{"k":"p","t":"Art. 371. O juiz apreciará a prova constante dos autos, independentemente do sujeito que a tiver promovido, e indicará na decisão as razões da formação de seu convencimento."},{"k":"p","t":"Art. 372. O juiz poderá admitir a utilização de prova produzida em outro processo, atribuindo-lhe o valor que considerar adequado, observado o contraditório."},{"k":"p","t":"Art. 373. O ônus da prova incumbe:"},{"k":"p","t":"I - ao autor, quanto ao fato constitutivo de seu direito;"},{"k":"p","t":"II - ao réu, quanto à existência de fato impeditivo, modificativo ou extintivo do direito do autor."},{"k":"p","t":"§ 1º Nos casos previstos em lei ou diante de peculiaridades da causa relacionadas à impossibilidade ou à excessiva dificuldade de cumprir o encargo nos termos do caput ou à maior facilidade de obtenção da prova do fato contrário, poderá o juiz atribuir o ônus da prova de modo diverso, desde que o faça por decisão fundamentada, caso em que deverá dar à parte a oportunidade de se desincumbir do ônus que lhe foi atribuído."},{"k":"p","t":"§ 2º A decisão prevista no § 1º deste artigo não pode gerar situação em que a desincumbência do encargo pela parte seja impossível ou excessivamente difícil."},{"k":"p","t":"§ 3º A distribuição diversa do ônus da prova também pode ocorrer por convenção das partes, salvo quando:"},{"k":"p","t":"I - recair sobre direito indisponível da parte;"},{"k":"p","t":"II - tornar excessivamente difícil a uma parte o exercício do direito."},{"k":"p","t":"§ 4º A convenção de que trata o § 3º pode ser celebrada antes ou durante o processo."},{"k":"p","t":"Art. 374. Não dependem de prova os fatos:"},{"k":"p","t":"I - notórios;"},{"k":"p","t":"II - afirmados por uma parte e confessados pela parte contrária;"},{"k":"p","t":"III - admitidos no processo como incontroversos;"},{"k":"p","t":"IV - em cujo favor milita presunção legal de existência ou de veracidade."},{"k":"p","t":"Art. 375. O juiz aplicará as regras de experiência comum subministradas pela observação do que ordinariamente acontece e, ainda, as regras de experiência técnica, ressalvado, quanto a estas, o exame pericial."},{"k":"p","t":"Art. 376. A parte que alegar direito municipal, estadual, estrangeiro ou consuetudinário provar-lhe-á o teor e a vigência, se assim o juiz determinar."},{"k":"p","t":"Art. 377. A carta precatória, a carta rogatória e o auxílio direto suspenderão o julgamento da causa no caso previsto no art. 313, inciso V, alínea “b”, quando, tendo sido requeridos antes da decisão de saneamento, a prova neles solicitada for imprescindível."},{"k":"p","t":"Parágrafo único. A carta precatória e a carta rogatória não devolvidas no prazo ou concedidas sem efeito suspensivo poderão ser juntadas aos autos a qualquer momento."},{"k":"p","t":"Art. 378. Ninguém se exime do dever de colaborar com o Poder Judiciário para o descobrimento da verdade."},{"k":"p","t":"Art. 379. Preservado o direito de não produzir prova contra si própria, incumbe à parte:"},{"k":"p","t":"I - comparecer em juízo, respondendo ao que lhe for interrogado;"},{"k":"p","t":"II - colaborar com o juízo na realização de inspeção judicial que for considerada necessária;"},{"k":"p","t":"III - praticar o ato que lhe for determinado."},{"k":"p","t":"Art. 380. Incumbe ao terceiro, em relação a qualquer causa:"},{"k":"p","t":"I - informar ao juiz os fatos e as circunstâncias de que tenha conhecimento;"},{"k":"p","t":"II - exibir coisa ou documento que esteja em seu poder."},{"k":"p","t":"Parágrafo único. Poderá o juiz, em caso de descumprimento, determinar, além da imposição de multa, outras medidas indutivas, coercitivas, mandamentais ou sub-rogatórias."}]},{"id":"s11","title":"SEÇÃO II — DA PRODUÇÃO ANTECIPADA DA PROVA · arts. 381 a 404","tag":"","b":[{"k":"h","t":"SEÇÃO II — DA PRODUÇÃO ANTECIPADA DA PROVA"},{"k":"p","t":"Art. 381. A produção antecipada da prova será admitida nos casos em que:"},{"k":"p","t":"I - haja fundado receio de que venha a tornar-se impossível ou muito difícil a verificação de certos fatos na pendência da ação;"},{"k":"p","t":"II - a prova a ser produzida seja suscetível de viabilizar a autocomposição ou outro meio adequado de solução de conflito;"},{"k":"p","t":"III - o prévio conhecimento dos fatos possa justificar ou evitar o ajuizamento de ação."},{"k":"p","t":"§ 1º O arrolamento de bens observará o disposto nesta Seção quando tiver por finalidade apenas a realização de documentação e não a prática de atos de apreensão."},{"k":"p","t":"§ 2º A produção antecipada da prova é da competência do juízo do foro onde esta deva ser produzida ou do foro de domicílio do réu."},{"k":"p","t":"§ 3º A produção antecipada da prova não previne a competência do juízo para a ação que venha a ser proposta."},{"k":"p","t":"§ 4º O juízo estadual tem competência para produção antecipada de prova requerida em face da União, de entidade autárquica ou de empresa pública federal se, na localidade, não houver vara federal."},{"k":"p","t":"§ 5º Aplica-se o disposto nesta Seção àquele que pretender justificar a existência de algum fato ou relação jurídica para simples documento e sem caráter contencioso, que exporá, em petição circunstanciada, a sua intenção."},{"k":"p","t":"Art. 382. Na petição, o requerente apresentará as razões que justificam a necessidade de antecipação da prova e mencionará com precisão os fatos sobre os quais a prova há de recair."},{"k":"p","t":"§ 1º O juiz determinará, de ofício ou a requerimento da parte, a citação de interessados na produção da prova ou no fato a ser provado, salvo se inexistente caráter contencioso."},{"k":"p","t":"§ 2º O juiz não se pronunciará sobre a ocorrência ou a inocorrência do fato, nem sobre as respectivas consequências jurídicas."},{"k":"p","t":"§ 3º Os interessados poderão requerer a produção de qualquer prova no mesmo procedimento, desde que relacionada ao mesmo fato, salvo se a sua produção conjunta acarretar excessiva demora."},{"k":"p","t":"§ 4º Neste procedimento, não se admitirá defesa ou recurso, salvo contra decisão que indeferir totalmente a produção da prova pleiteada pelo requerente originário."},{"k":"p","t":"Art. 383. Os autos permanecerão em cartório durante 1 (um) mês para extração de cópias e certidões pelos interessados."},{"k":"p","t":"Parágrafo único. Findo o prazo, os autos serão entregues ao promovente da medida."},{"k":"h","t":"SEÇÃO III — DA ATA NOTARIAL"},{"k":"p","t":"Art. 384. A existência e o modo de existir de algum fato podem ser atestados ou documentados, a requerimento do interessado, mediante ata lavrada por tabelião."},{"k":"p","t":"Parágrafo único. Dados representados por imagem ou som gravados em arquivos eletrônicos poderão constar da ata notarial."},{"k":"h","t":"SEÇÃO IV — DO DEPOIMENTO PESSOAL"},{"k":"p","t":"Art. 385. Cabe à parte requerer o depoimento pessoal da outra parte, a fim de que esta seja interrogada na audiência de instrução e julgamento, sem prejuízo do poder do juiz de ordená-lo de ofício."},{"k":"p","t":"§ 1º Se a parte, pessoalmente intimada para prestar depoimento pessoal e advertida da pena de confesso, não comparecer ou, comparecendo, se recusar a depor, o juiz aplicar-lhe-á a pena."},{"k":"p","t":"§ 2º É vedado a quem ainda não depôs assistir ao interrogatório da outra parte."},{"k":"p","t":"§ 3º O depoimento pessoal da parte que residir em comarca, seção ou subseção judiciária diversa daquela onde tramita o processo poderá ser colhido por meio de videoconferência ou outro recurso tecnológico de transmissão de sons e imagens em tempo real, o que poderá ocorrer, inclusive, durante a realização da audiência de instrução e julgamento."},{"k":"p","t":"Art. 386. Quando a parte, sem motivo justificado, deixar de responder ao que lhe for perguntado ou empregar evasivas, o juiz, apreciando as demais circunstâncias e os elementos de prova, declarará, na sentença, se houve recusa de depor."},{"k":"p","t":"Art. 387. A parte responderá pessoalmente sobre os fatos articulados, não podendo servir-se de escritos anteriormente preparados, permitindo-lhe o juiz, todavia, a consulta a notas breves, desde que objetivem completar esclarecimentos."},{"k":"p","t":"Art. 388. A parte não é obrigada a depor sobre fatos:"},{"k":"p","t":"I - criminosos ou torpes que lhe forem imputados;"},{"k":"p","t":"II - a cujo respeito, por estado ou profissão, deva guardar sigilo;"},{"k":"p","t":"III - acerca dos quais não possa responder sem desonra própria, de seu cônjuge, de seu companheiro ou de parente em grau sucessível;"},{"k":"p","t":"IV - que coloquem em perigo a vida do depoente ou das pessoas referidas no inciso III."},{"k":"p","t":"Parágrafo único. Esta disposição não se aplica às ações de estado e de família."},{"k":"h","t":"SEÇÃO V — DA CONFISSÃO"},{"k":"p","t":"Art. 389. Há confissão, judicial ou extrajudicial, quando a parte admite a verdade de fato contrário ao seu interesse e favorável ao do adversário."},{"k":"p","t":"Art. 390. A confissão judicial pode ser espontânea ou provocada."},{"k":"p","t":"§ 1º A confissão espontânea pode ser feita pela própria parte ou por representante com poder especial."},{"k":"p","t":"§ 2º A confissão provocada constará do termo de depoimento pessoal."},{"k":"p","t":"Art. 391. A confissão judicial faz prova contra o confitente, não prejudicando, todavia, os litisconsortes."},{"k":"p","t":"Parágrafo único. Nas ações que versarem sobre bens imóveis ou direitos reais sobre imóveis alheios, a confissão de um cônjuge ou companheiro não valerá sem a do outro, salvo se o regime de casamento for o de separação absoluta de bens."},{"k":"p","t":"Art. 392. Não vale como confissão a admissão, em juízo, de fatos relativos a direitos indisponíveis."},{"k":"p","t":"§ 1º A confissão será ineficaz se feita por quem não for capaz de dispor do direito a que se referem os fatos confessados."},{"k":"p","t":"§ 2º A confissão feita por um representante somente é eficaz nos limites em que este pode vincular o representado."},{"k":"p","t":"Art. 393. A confissão é irrevogável, mas pode ser anulada se decorreu de erro de fato ou de coação."},{"k":"p","t":"Parágrafo único. A legitimidade para a ação prevista no caput é exclusiva do confitente e pode ser transferida a seus herdeiros se ele falecer após a propositura."},{"k":"p","t":"Art. 394. A confissão extrajudicial, quando feita oralmente, só terá eficácia nos casos em que a lei não exija prova literal."},{"k":"p","t":"Art. 395. A confissão é, em regra, indivisível, não podendo a parte que a quiser invocar como prova aceitá-la no tópico que a beneficiar e rejeitá-la no que lhe for desfavorável, porém cindir-se-á quando o confitente a ela aduzir fatos novos, capazes de constituir fundamento de defesa de direito material ou de reconvenção."},{"k":"h","t":"SEÇÃO VI — DA EXIBIÇÃO DE DOCUMENTO OU COISA"},{"k":"p","t":"Art. 396. O juiz pode ordenar que a parte exiba documento ou coisa que se encontre em seu poder."},{"k":"p","t":"Art. 397. O pedido formulado pela parte conterá:"},{"k":"p","t":"I - a descrição, tão completa quanto possível, do documento ou da coisa, ou das categorias de documentos ou de coisas buscados; (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"II - a finalidade da prova, com indicação dos fatos que se relacionam com o documento ou com a coisa, ou com suas categorias; (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"III - as circunstâncias em que se funda o requerente para afirmar que o documento ou a coisa existe, ainda que a referência seja a categoria de documentos ou de coisas, e se acha em poder da parte contrária. (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"Art. 398. O requerido dará sua resposta nos 5 (cinco) dias subsequentes à sua intimação."},{"k":"p","t":"Parágrafo único. Se o requerido afirmar que não possui o documento ou a coisa, o juiz permitirá que o requerente prove, por qualquer meio, que a declaração não corresponde à verdade."},{"k":"p","t":"Art. 399. O juiz não admitirá a recusa se:"},{"k":"p","t":"I - o requerido tiver obrigação legal de exibir;"},{"k":"p","t":"II - o requerido tiver aludido ao documento ou à coisa, no processo, com o intuito de constituir prova;"},{"k":"p","t":"III - o documento, por seu conteúdo, for comum às partes."},{"k":"p","t":"Art. 400. Ao decidir o pedido, o juiz admitirá como verdadeiros os fatos que, por meio do documento ou da coisa, a parte pretendia provar se:"},{"k":"p","t":"I - o requerido não efetuar a exibição nem fizer nenhuma declaração no prazo do art. 398 ;"},{"k":"p","t":"II - a recusa for havida por ilegítima."},{"k":"p","t":"Parágrafo único. Sendo necessário, o juiz pode adotar medidas indutivas, coercitivas, mandamentais ou subrogatórias para que o documento seja exibido."},{"k":"p","t":"Art. 401. Quando o documento ou a coisa estiver em poder de terceiro, o juiz ordenará sua citação para responder no prazo de 15 (quinze) dias."},{"k":"p","t":"Art. 402. Se o terceiro negar a obrigação de exibir ou a posse do documento ou da coisa, o juiz designará audiência especial, tomando-lhe o depoimento, bem como o das partes e, se necessário, o de testemunhas, e em seguida proferirá decisão."},{"k":"p","t":"Art. 403. Se o terceiro, sem justo motivo, se recusar a efetuar a exibição, o juiz ordenar-lhe-á que proceda ao respectivo depósito em cartório ou em outro lugar designado, no prazo de 5 (cinco) dias, impondo ao requerente que o ressarça pelas despesas que tiver."},{"k":"p","t":"Parágrafo único. Se o terceiro descumprir a ordem, o juiz expedirá mandado de apreensão, requisitando, se necessário, força policial, sem prejuízo da responsabilidade por crime de desobediência, pagamento de multa e outras medidas indutivas, coercitivas, mandamentais ou sub-rogatórias necessárias para assegurar a efetivação da decisão."},{"k":"p","t":"Art. 404. A parte e o terceiro se escusam de exibir, em juízo, o documento ou a coisa se:"},{"k":"p","t":"I - concernente a negócios da própria vida da família;"},{"k":"p","t":"II - sua apresentação puder violar dever de honra;"},{"k":"p","t":"III - sua publicidade redundar em desonra à parte ou ao terceiro, bem como a seus parentes consanguíneos ou afins até o terceiro grau, ou lhes representar perigo de ação penal;"},{"k":"p","t":"IV - sua exibição acarretar a divulgação de fatos a cujo respeito, por estado ou profissão, devam guardar segredo;"},{"k":"p","t":"V - subsistirem outros motivos graves que, segundo o prudente arbítrio do juiz, justifiquem a recusa da exibição;"},{"k":"p","t":"VI - houver disposição legal que justifique a recusa da exibição."},{"k":"p","t":"Parágrafo único. Se os motivos de que tratam os incisos I a VI do caput disserem respeito a apenas uma parcela do documento, a parte ou o terceiro exibirá a outra em cartório, para dela ser extraída cópia reprográfica, de tudo sendo lavrado auto circunstanciado."}]},{"id":"s12","title":"SEÇÃO VII — DA PROVA DOCUMENTAL · arts. 405 a 433","tag":"","b":[{"k":"h","t":"SEÇÃO VII — DA PROVA DOCUMENTAL"},{"k":"h","t":"SUBSEÇÃO I — DA FORÇA PROBANTE DOS DOCUMENTOS"},{"k":"p","t":"Art. 405. O documento público faz prova não só da sua formação, mas também dos fatos que o escrivão, o chefe de secretaria, o tabelião ou o servidor declarar que ocorreram em sua presença."},{"k":"p","t":"Art. 406. Quando a lei exigir instrumento público como da substância do ato, nenhuma outra prova, por mais especial que seja, pode suprir-lhe a falta."},{"k":"p","t":"Art. 407. O documento feito por oficial público incompetente ou sem a observância das formalidades legais, sendo subscrito pelas partes, tem a mesma eficácia probatória do documento particular."},{"k":"p","t":"Art. 408. As declarações constantes do documento particular escrito e assinado ou somente assinado presumem-se verdadeiras em relação ao signatário."},{"k":"p","t":"Parágrafo único. Quando, todavia, contiver declaração de ciência de determinado fato, o documento particular prova a ciência, mas não o fato em si, incumbindo o ônus de prová-lo ao interessado em sua veracidade."},{"k":"p","t":"Art. 409. A data do documento particular, quando a seu respeito surgir dúvida ou impugnação entre os litigantes, provar-se-á por todos os meios de direito."},{"k":"p","t":"Parágrafo único. Em relação a terceiros, considerar-seá datado o documento particular:"},{"k":"p","t":"I - no dia em que foi registrado;"},{"k":"p","t":"II - desde a morte de algum dos signatários;"},{"k":"p","t":"III - a partir da impossibilidade física que sobreveio a qualquer dos signatários;"},{"k":"p","t":"IV - da sua apresentação em repartição pública ou em juízo;"},{"k":"p","t":"V - do ato ou do fato que estabeleça, de modo certo, a anterioridade da formação do documento."},{"k":"p","t":"Art. 410. Considera-se autor do documento particular:"},{"k":"p","t":"I - aquele que o fez e o assinou;"},{"k":"p","t":"II - aquele por conta de quem ele foi feito, estando assinado;"},{"k":"p","t":"III - aquele que, mandando compô-lo, não o firmou porque, conforme a experiência comum, não se costuma assinar, como livros empresariais e assentos domésticos."},{"k":"p","t":"Art. 411. Considera-se autêntico o documento quando:"},{"k":"p","t":"I - o tabelião reconhecer a firma do signatário;"},{"k":"p","t":"II - a autoria estiver identificada por qualquer outro meio legal de certificação, inclusive eletrônico, nos termos da lei;"},{"k":"p","t":"III - não houver impugnação da parte contra quem foi produzido o documento."},{"k":"p","t":"Art. 412. O documento particular de cuja autenticidade não se duvida prova que o seu autor fez a declaração que lhe é atribuída."},{"k":"p","t":"Parágrafo único. O documento particular admitido expressa ou tacitamente é indivisível, sendo vedado à parte que pretende utilizar-se dele aceitar os fatos que lhe são favoráveis e recusar os que são contrários ao seu interesse, salvo se provar que estes não ocorreram."},{"k":"p","t":"Art. 413. O telegrama, o radiograma ou qualquer outro meio de transmissão tem a mesma força probatória do documento particular se o original constante da estação expedidora tiver sido assinado pelo remetente."},{"k":"p","t":"Parágrafo único. A firma do remetente poderá ser reconhecida pelo tabelião, declarando-se essa circunstância no original depositado na estação expedidora."},{"k":"p","t":"Art. 414. O telegrama ou o radiograma presume-se conforme com o original, provando as datas de sua expedição e de seu recebimento pelo destinatário."},{"k":"p","t":"Art. 415. As cartas e os registros domésticos provam contra quem os escreveu quando:"},{"k":"p","t":"I - enunciam o recebimento de um crédito;"},{"k":"p","t":"II - contêm anotação que visa a suprir a falta de título em favor de quem é apontado como credor;"},{"k":"p","t":"III - expressam conhecimento de fatos para os quais não se exija determinada prova."},{"k":"p","t":"Art. 416. A nota escrita pelo credor em qualquer parte de documento representativo de obrigação, ainda que não assinada, faz prova em benefício do devedor."},{"k":"p","t":"Parágrafo único. Aplica-se essa regra tanto para o documento que o credor conservar em seu poder quanto para aquele que se achar em poder do devedor ou de terceiro."},{"k":"p","t":"Art. 417. Os livros empresariais provam contra seu autor, sendo lícito ao empresário, todavia, demonstrar, por todos os meios permitidos em direito, que os lançamentos não correspondem à verdade dos fatos."},{"k":"p","t":"Art. 418. Os livros empresariais que preencham os requisitos exigidos por lei provam a favor de seu autor no litígio entre empresários."},{"k":"p","t":"Art. 419. A escrituração contábil é indivisível, e, se dos fatos que resultam dos lançamentos, uns são favoráveis ao interesse de seu autor e outros lhe são contrários, ambos serão considerados em conjunto, como unidade."},{"k":"p","t":"Art. 420. O juiz pode ordenar, a requerimento da parte, a exibição integral dos livros empresariais e dos documentos do arquivo:"},{"k":"p","t":"I - na liquidação de sociedade;"},{"k":"p","t":"II - na sucessão por morte de sócio;"},{"k":"p","t":"III - quando e como determinar a lei."},{"k":"p","t":"Art. 421. O juiz pode, de ofício, ordenar à parte a exibição parcial dos livros e dos documentos, extraindo-se deles a suma que interessar ao litígio, bem como reproduções autenticadas."},{"k":"p","t":"Art. 422. Qualquer reprodução mecânica, como a fotográfica, a cinematográfica, a fonográfica ou de outra espécie, tem aptidão para fazer prova dos fatos ou das coisas representadas, se a sua conformidade com o documento original não for impugnada por aquele contra quem foi produzida."},{"k":"p","t":"§ 1º As fotografias digitais e as extraídas da rede mundial de computadores fazem prova das imagens que reproduzem, devendo, se impugnadas, ser apresentada a respectiva autenticação eletrônica ou, não sendo possível, realizada perícia."},{"k":"p","t":"§ 2º Se se tratar de fotografia publicada em jornal ou revista, será exigido um exemplar original do periódico, caso impugnada a veracidade pela outra parte."},{"k":"p","t":"§ 3º Aplica-se o disposto neste artigo à forma impressa de mensagem eletrônica."},{"k":"p","t":"Art. 423. As reproduções dos documentos particulares, fotográficas ou obtidas por outros processos de repetição, valem como certidões sempre que o escrivão ou o chefe de secretaria certificar sua conformidade com o original."},{"k":"p","t":"Art. 424. A cópia de documento particular tem o mesmo valor probante que o original, cabendo ao escrivão, intimadas as partes, proceder à conferência e certificar a conformidade entre a cópia e o original."},{"k":"p","t":"Art. 425. Fazem a mesma prova que os originais:"},{"k":"p","t":"I - as certidões textuais de qualquer peça dos autos, do protocolo das audiências ou de outro livro a cargo do escrivão ou do chefe de secretaria, se extraídas por ele ou sob sua vigilância e por ele subscritas;"},{"k":"p","t":"II - os traslados e as certidões extraídas por oficial público de instrumentos ou documentos lançados em suas notas;"},{"k":"p","t":"III - as reproduções dos documentos públicos, desde que autenticadas por oficial público ou conferidas em cartório com os respectivos originais;"},{"k":"p","t":"IV - as cópias reprográficas de peças do próprio processo judicial declaradas autênticas pelo advogado, sob sua responsabilidade pessoal, se não lhes for impugnada a autenticidade;"},{"k":"p","t":"V - os extratos digitais de bancos de dados públicos e privados, desde que atestado pelo seu emitente, sob as penas da lei, que as informações conferem com o que consta na origem;"},{"k":"p","t":"VI - as reproduções digitalizadas de qualquer documento público ou particular, quando juntadas aos autos pelos órgãos da justiça e seus auxiliares, pelo Ministério Público e seus auxiliares, pela Defensoria Pública e seus auxiliares, pelas procuradorias, pelas repartições públicas em geral e por advogados, ressalvada a alegação motivada e fundamentada de adulteração."},{"k":"p","t":"§ 1º Os originais dos documentos digitalizados mencionados no inciso VI deverão ser preservados pelo seu detentor até o final do prazo para propositura de ação rescisória."},{"k":"p","t":"§ 2º Tratando-se de cópia digital de título executivo extrajudicial ou de documento relevante à instrução do processo, o juiz poderá determinar seu depósito em cartório ou secretaria."},{"k":"p","t":"Art. 426. O juiz apreciará fundamentadamente a fé que deva merecer o documento, quando em ponto substancial e sem ressalva contiver entrelinha, emenda, borrão ou cancelamento."},{"k":"p","t":"Art. 427. Cessa a fé do documento público ou particular sendo-lhe declarada judicialmente a falsidade."},{"k":"p","t":"Parágrafo único. A falsidade consiste em:"},{"k":"p","t":"I - formar documento não verdadeiro;"},{"k":"p","t":"II - alterar documento verdadeiro."},{"k":"p","t":"Art. 428. Cessa a fé do documento particular quando:"},{"k":"p","t":"I - for impugnada sua autenticidade e enquanto não se comprovar sua veracidade;"},{"k":"p","t":"II - assinado em branco, for impugnado seu conteúdo, por preenchimento abusivo."},{"k":"p","t":"Parágrafo único. Dar-se-á abuso quando aquele que recebeu documento assinado com texto não escrito no todo ou em parte formá-lo ou completá-lo por si ou por meio de outrem, violando o pacto feito com o signatário."},{"k":"p","t":"Art. 429. Incumbe o ônus da prova quando:"},{"k":"p","t":"I - se tratar de falsidade de documento ou de preenchimento abusivo, à parte que a arguir;"},{"k":"p","t":"II - se tratar de impugnação da autenticidade, à parte que produziu o documento."},{"k":"h","t":"SUBSEÇÃO II — DA ARGUIÇÃO DE FALSIDADE"},{"k":"p","t":"Art. 430. A falsidade deve ser suscitada na contestação, na réplica ou no prazo de 15 (quinze) dias, contado a partir da intimação da juntada do documento aos autos."},{"k":"p","t":"Parágrafo único. Uma vez arguida, a falsidade será resolvida como questão incidental, salvo se a parte requerer que o juiz a decida como questão principal, nos termos do inciso II do art. 19 ."},{"k":"p","t":"Art. 431. A parte arguirá a falsidade expondo os motivos em que funda a sua pretensão e os meios com que provará o alegado."},{"k":"p","t":"Art. 432. Depois de ouvida a outra parte no prazo de 15 (quinze) dias, será realizado o exame pericial."},{"k":"p","t":"Parágrafo único. Não se procederá ao exame pericial se a parte que produziu o documento concordar em retirá-lo."},{"k":"p","t":"Art. 433. A declaração sobre a falsidade do documento, quando suscitada como questão principal, constará da parte dispositiva da sentença e sobre ela incidirá também a autoridade da coisa julgada."}]},{"id":"s13","title":"SUBSEÇÃO III — DA PRODUÇÃO DA PROVA DOCUMENTAL · arts. 434 a 463","tag":"","b":[{"k":"h","t":"SUBSEÇÃO III — DA PRODUÇÃO DA PROVA DOCUMENTAL"},{"k":"p","t":"Art. 434. Incumbe à parte instruir a petição inicial ou a contestação com os documentos destinados a provar suas alegações."},{"k":"p","t":"Parágrafo único. Quando o documento consistir em reprodução cinematográfica ou fonográfica, a parte deverá trazê-lo nos termos do caput , mas sua exposição será realizada em audiência, intimando-se previamente as partes."},{"k":"p","t":"Art. 435. É lícito às partes, em qualquer tempo, juntar aos autos documentos novos, quando destinados a fazer prova de fatos ocorridos depois dos articulados ou para contrapô-los aos que foram produzidos nos autos."},{"k":"p","t":"Parágrafo único. Admite-se também a juntada posterior de documentos formados após a petição inicial ou a contestação, bem como dos que se tornaram conhecidos, acessíveis ou disponíveis após esses atos, cabendo à parte que os produzir comprovar o motivo que a impediu de juntá-los anteriormente e incumbindo ao juiz, em qualquer caso, avaliar a conduta da parte de acordo com o art. 5º ."},{"k":"p","t":"Art. 436. A parte, intimada a falar sobre documento constante dos autos, poderá:"},{"k":"p","t":"I - impugnar a admissibilidade da prova documental;"},{"k":"p","t":"II - impugnar sua autenticidade;"},{"k":"p","t":"III - suscitar sua falsidade, com ou sem deflagração do incidente de arguição de falsidade;"},{"k":"p","t":"IV - manifestar-se sobre seu conteúdo."},{"k":"p","t":"Parágrafo único. Nas hipóteses dos incisos II e III, a impugnação deverá basear-se em argumentação específica, não se admitindo alegação genérica de falsidade."},{"k":"p","t":"Art. 437. O réu manifestar-se-á na contestação sobre os documentos anexados à inicial, e o autor manifestarse-á na réplica sobre os documentos anexados à contestação."},{"k":"p","t":"§ 1º Sempre que uma das partes requerer a juntada de documento aos autos, o juiz ouvirá, a seu respeito, a outra parte, que disporá do prazo de 15 (quinze) dias para adotar qualquer das posturas indicadas no art. 436 ."},{"k":"p","t":"§ 2º Poderá o juiz, a requerimento da parte, dilatar o prazo para manifestação sobre a prova documental produzida, levando em consideração a quantidade e a complexidade da documentação."},{"k":"p","t":"Art. 438. O juiz requisitará às repartições públicas, em qualquer tempo ou grau de jurisdição:"},{"k":"p","t":"I - as certidões necessárias à prova das alegações das partes;"},{"k":"p","t":"II - os procedimentos administrativos nas causas em que forem interessados a União, os Estados, o Distrito Federal, os Municípios ou entidades da administração indireta."},{"k":"p","t":"§ 1º Recebidos os autos, o juiz mandará extrair, no prazo máximo e improrrogável de 1 (um) mês, certidões ou reproduções fotográficas das peças que indicar e das que forem indicadas pelas partes, e, em seguida, devolverá os autos à repartição de origem."},{"k":"p","t":"§ 2º As repartições públicas poderão fornecer todos os documentos em meio eletrônico, conforme disposto em lei, certificando, pelo mesmo meio, que se trata de extrato fiel do que consta em seu banco de dados ou no documento digitalizado."},{"k":"h","t":"SEÇÃO VIII — DOS DOCUMENTOS ELETRÔNICOS"},{"k":"p","t":"Art. 439. A utilização de documentos eletrônicos no processo convencional dependerá de sua conversão à forma impressa e da verificação de sua autenticidade, na forma da lei."},{"k":"p","t":"Art. 440. O juiz apreciará o valor probante do documento eletrônico não convertido, assegurado às partes o acesso ao seu teor."},{"k":"p","t":"Art. 441. Serão admitidos documentos eletrônicos produzidos e conservados com a observância da legislação específica."},{"k":"h","t":"SEÇÃO IX — DA PROVA TESTEMUNHAL"},{"k":"h","t":"SUBSEÇÃO I — DA ADMISSIBILIDADE E DO VALOR DA PROVA TESTEMUNHAL"},{"k":"p","t":"Art. 442. A prova testemunhal é sempre admissível, não dispondo a lei de modo diverso."},{"k":"p","t":"Art. 443. O juiz indeferirá a inquirição de testemunhas sobre fatos:"},{"k":"p","t":"I - já provados por documento ou confissão da parte;"},{"k":"p","t":"II - que só por documento ou por exame pericial puderem ser provados."},{"k":"p","t":"Art. 444. Nos casos em que a lei exigir prova escrita da obrigação, é admissível a prova testemunhal quando houver começo de prova por escrito, emanado da parte contra a qual se pretende produzir a prova."},{"k":"p","t":"Art. 445. Também se admite a prova testemunhal quando o credor não pode ou não podia, moral ou materialmente, obter a prova escrita da obrigação, em casos como o de parentesco, de depósito necessário ou de hospedagem em hotel ou em razão das práticas comerciais do local onde contraída a obrigação."},{"k":"p","t":"Art. 446. É lícito à parte provar com testemunhas:"},{"k":"p","t":"I - nos contratos simulados, a divergência entre a vontade real e a vontade declarada;"},{"k":"p","t":"II - nos contratos em geral, os vícios de consentimento."},{"k":"p","t":"Art. 447. Podem depor como testemunhas todas as pessoas, exceto as incapazes, impedidas ou suspeitas."},{"k":"p","t":"§ 1º São incapazes:"},{"k":"p","t":"I - o interdito por enfermidade ou deficiência mental;"},{"k":"p","t":"II - o que, acometido por enfermidade ou retardamento mental, ao tempo em que ocorreram os fatos, não podia discerni-los, ou, ao tempo em que deve depor, não está habilitado a transmitir as percepções;"},{"k":"p","t":"III - o que tiver menos de 16 (dezesseis) anos;"},{"k":"p","t":"IV - o cego e o surdo, quando a ciência do fato depender dos sentidos que lhes faltam."},{"k":"p","t":"§ 2º São impedidos:"},{"k":"p","t":"I - o cônjuge, o companheiro, o ascendente e o descendente em qualquer grau e o colateral, até o terceiro grau, de alguma das partes, por consanguinidade ou afinidade, salvo se o exigir o interesse público ou, tratando-se de causa relativa ao estado da pessoa, não se puder obter de outro modo a prova que o juiz repute necessária ao julgamento do mérito;"},{"k":"p","t":"II - o que é parte na causa;"},{"k":"p","t":"III - o que intervém em nome de uma parte, como o tutor, o representante legal da pessoa jurídica, o juiz, o advogado e outros que assistam ou tenham assistido as partes."},{"k":"p","t":"§ 3º São suspeitos:"},{"k":"p","t":"I - o inimigo da parte ou o seu amigo íntimo;"},{"k":"p","t":"II - o que tiver interesse no litígio."},{"k":"p","t":"§ 4º Sendo necessário, pode o juiz admitir o depoimento das testemunhas menores, impedidas ou suspeitas."},{"k":"p","t":"§ 5º Os depoimentos referidos no § 4º serão prestados independentemente de compromisso, e o juiz lhes atribuirá o valor que possam merecer."},{"k":"p","t":"Art. 448. A testemunha não é obrigada a depor sobre fatos:"},{"k":"p","t":"I - que lhe acarretem grave dano, bem como ao seu cônjuge ou companheiro e aos seus parentes consanguíneos ou afins, em linha reta ou colateral, até o terceiro grau;"},{"k":"p","t":"II - a cujo respeito, por estado ou profissão, deva guardar sigilo."},{"k":"p","t":"Art. 449. Salvo disposição especial em contrário, as testemunhas devem ser ouvidas na sede do juízo."},{"k":"p","t":"Parágrafo único. Quando a parte ou a testemunha, por enfermidade ou por outro motivo relevante, estiver impossibilitada de comparecer, mas não de prestar depoimento, o juiz designará, conforme as circunstâncias, dia, hora e lugar para inquiri-la."},{"k":"h","t":"SUBSEÇÃO II — DA PRODUÇÃO DA PROVA TESTEMUNHAL"},{"k":"p","t":"Art. 450. O rol de testemunhas conterá, sempre que possível, o nome, a profissão, o estado civil, a idade, o número de inscrição no Cadastro de Pessoas Físicas, o número de registro de identidade e o endereço completo da residência e do local de trabalho."},{"k":"p","t":"Art. 451. Depois de apresentado o rol de que tratam os §§ 4º e 5º do art. 357 , a parte só pode substituir a testemunha:"},{"k":"p","t":"I - que falecer;"},{"k":"p","t":"II - que, por enfermidade, não estiver em condições de depor;"},{"k":"p","t":"III - que, tendo mudado de residência ou de local de trabalho, não for encontrada."},{"k":"p","t":"Art. 452. Quando for arrolado como testemunha, o juiz da causa:"},{"k":"p","t":"I - declarar-se-á impedido, se tiver conhecimento de fatos que possam influir na decisão, caso em que será vedado à parte que o incluiu no rol desistir de seu depoimento;"},{"k":"p","t":"II - se nada souber, mandará excluir o seu nome."},{"k":"p","t":"Art. 453. As testemunhas depõem, na audiência de instrução e julgamento, perante o juiz da causa, exceto:"},{"k":"p","t":"I - as que prestam depoimento antecipadamente;"},{"k":"p","t":"II - as que são inquiridas por carta."},{"k":"p","t":"§ 1º A oitiva de testemunha que residir em comarca, seção ou subseção judiciária diversa daquela onde tramita o processo poderá ser realizada por meio de videoconferência ou outro recurso tecnológico de transmissão e recepção de sons e imagens em tempo real, o que poderá ocorrer, inclusive, durante a audiência de instrução e julgamento."},{"k":"p","t":"§ 2º Os juízos deverão manter equipamento para a transmissão e recepção de sons e imagens a que se refere o § 1º."},{"k":"p","t":"Art. 454. São inquiridos em sua residência ou onde exercem sua função:"},{"k":"p","t":"I - o presidente e o vice-presidente da República;"},{"k":"p","t":"II - os ministros de Estado;"},{"k":"p","t":"III - os ministros do Supremo Tribunal Federal, os conselheiros do Conselho Nacional de Justiça e os ministros do Superior Tribunal de Justiça, do Superior Tribunal Militar, do Tribunal Superior Eleitoral, do Tribunal Superior do Trabalho e do Tribunal de Contas da União;"},{"k":"p","t":"IV - o procurador-geral da República e os conselheiros do Conselho Nacional do Ministério Público;"},{"k":"p","t":"V - o advogado-geral da União, o procurador-geral do Estado, o procurador-geral do Município, o defensor público-geral federal e o defensor público-geral do Estado;"},{"k":"p","t":"VI - os senadores e os deputados federais;"},{"k":"p","t":"VII - os governadores dos Estados e do Distrito Federal;"},{"k":"p","t":"VIII - o prefeito;"},{"k":"p","t":"IX - os deputados estaduais e distritais;"},{"k":"p","t":"X - os desembargadores dos Tribunais de Justiça, dos Tribunais Regionais Federais, dos Tribunais Regionais do Trabalho e dos Tribunais Regionais Eleitorais e os conselheiros dos Tribunais de Contas dos Estados e do Distrito Federal;"},{"k":"p","t":"XI - o procurador-geral de justiça;"},{"k":"p","t":"XII - o embaixador de país que, por lei ou tratado, concede idêntica prerrogativa a agente diplomático do Brasil."},{"k":"p","t":"§ 1º O juiz solicitará à autoridade que indique dia, hora e local a fim de ser inquirida, remetendo-lhe cópia da petição inicial ou da defesa oferecida pela parte que a arrolou como testemunha."},{"k":"p","t":"§ 2º Passado 1 (um) mês sem manifestação da autoridade, o juiz designará dia, hora e local para o depoimento, preferencialmente na sede do juízo."},{"k":"p","t":"§ 3º O juiz também designará dia, hora e local para o depoimento, quando a autoridade não comparecer, injustificadamente, à sessão agendada para a colheita de seu testemunho no dia, hora e local por ela mesma indicados."},{"k":"p","t":"Art. 455. Cabe ao advogado da parte informar ou intimar a testemunha por ele arrolada do dia, da hora e do local da audiência designada, dispensando-se a intimação do juízo."},{"k":"p","t":"§ 1º A intimação deverá ser realizada por carta com aviso de recebimento, cumprindo ao advogado juntar aos autos, com antecedência de pelo menos 3 (três) dias da data da audiência, cópia da correspondência de intimação e do comprovante de recebimento."},{"k":"p","t":"§ 2º A parte pode comprometer-se a levar a testemunha à audiência, independentemente da intimação de que trata o § 1º, presumindo-se, caso a testemunha não compareça, que a parte desistiu de sua inquirição."},{"k":"p","t":"§ 3º A inércia na realização da intimação a que se refere o § 1º importa desistência da inquirição da testemunha."},{"k":"p","t":"§ 4º A intimação será feita pela via judicial quando:"},{"k":"p","t":"I - for frustrada a intimação prevista no § 1º deste artigo;"},{"k":"p","t":"II - sua necessidade for devidamente demonstrada pela parte ao juiz;"},{"k":"p","t":"III - figurar no rol de testemunhas servidor público ou militar, hipótese em que o juiz o requisitará ao chefe da repartição ou ao comando do corpo em que servir;"},{"k":"p","t":"IV - a testemunha houver sido arrolada pelo Ministério Público ou pela Defensoria Pública;"},{"k":"p","t":"V - a testemunha for uma daquelas previstas no art. 454 ."},{"k":"p","t":"§ 5º A testemunha que, intimada na forma do § 1º ou do § 4º, deixar de comparecer sem motivo justificado será conduzida e responderá pelas despesas do adiamento."},{"k":"p","t":"Art. 456. O juiz inquirirá as testemunhas separada e sucessivamente, primeiro as do autor e depois as do réu, e providenciará para que uma não ouça o depoimento das outras."},{"k":"p","t":"Parágrafo único. O juiz poderá alterar a ordem estabelecida no caput se as partes concordarem."},{"k":"p","t":"Art. 457. Antes de depor, a testemunha será qualificada, declarará ou confirmará seus dados e informará se tem relações de parentesco com a parte ou interesse no objeto do processo."},{"k":"p","t":"§ 1º É lícito à parte contraditar a testemunha, arguindolhe a incapacidade, o impedimento ou a suspeição, bem como, caso a testemunha negue os fatos que lhe são imputados, provar a contradita com documentos ou com testemunhas, até 3 (três), apresentadas no ato e inquiridas em separado."},{"k":"p","t":"§ 2º Sendo provados ou confessados os fatos a que se refere o § 1º, o juiz dispensará a testemunha ou lhe tomará o depoimento como informante."},{"k":"p","t":"§ 3º A testemunha pode requerer ao juiz que a escuse de depor, alegando os motivos previstos neste Código, decidindo o juiz de plano após ouvidas as partes."},{"k":"p","t":"Art. 458. Ao início da inquirição, a testemunha prestará o compromisso de dizer a verdade do que souber e lhe for perguntado."},{"k":"p","t":"Parágrafo único. O juiz advertirá à testemunha que incorre em sanção penal quem faz afirmação falsa, cala ou oculta a verdade."},{"k":"p","t":"Art. 459. As perguntas serão formuladas pelas partes diretamente à testemunha, começando pela que a arrolou, não admitindo o juiz aquelas que puderem induzir a resposta, não tiverem relação com as questões de fato objeto da atividade probatória ou importarem repetição de outra já respondida."},{"k":"p","t":"§ 1º O juiz poderá inquirir a testemunha tanto antes quanto depois da inquirição feita pelas partes."},{"k":"p","t":"§ 2º As testemunhas devem ser tratadas com urbanidade, não se lhes fazendo perguntas ou considerações impertinentes, capciosas ou vexatórias."},{"k":"p","t":"§ 3º As perguntas que o juiz indeferir serão transcritas no termo, se a parte o requerer."},{"k":"p","t":"Art. 460. O depoimento poderá ser documentado por meio de gravação."},{"k":"p","t":"§ 1º Quando digitado ou registrado por taquigrafia, estenotipia ou outro método idôneo de documentação, o depoimento será assinado pelo juiz, pelo depoente e pelos procuradores."},{"k":"p","t":"§ 2º Se houver recurso em processo em autos não eletrônicos, o depoimento somente será digitado quando for impossível o envio de sua documentação eletrônica."},{"k":"p","t":"§ 3º Tratando-se de autos eletrônicos, observar-se-á o disposto neste Código e na legislação específica sobre a prática eletrônica de atos processuais."},{"k":"p","t":"Art. 461. O juiz pode ordenar, de ofício ou a requerimento da parte:"},{"k":"p","t":"I - a inquirição de testemunhas referidas nas declarações da parte ou das testemunhas;"},{"k":"p","t":"II - a acareação de 2 (duas) ou mais testemunhas ou de alguma delas com a parte, quando, sobre fato determinado que possa influir na decisão da causa, divergirem as suas declarações."},{"k":"p","t":"§ 1º Os acareados serão reperguntados para que expliquem os pontos de divergência, reduzindo-se a termo o ato de acareação."},{"k":"p","t":"§ 2º A acareação pode ser realizada por videoconferência ou por outro recurso tecnológico de transmissão de sons e imagens em tempo real."},{"k":"p","t":"Art. 462. A testemunha pode requerer ao juiz o pagamento da despesa que efetuou para comparecimento à audiência, devendo a parte pagá-la logo que arbitrada ou depositá-la em cartório dentro de 3 (três) dias."},{"k":"p","t":"Art. 463. O depoimento prestado em juízo é considerado serviço público."},{"k":"p","t":"Parágrafo único. A testemunha, quando sujeita ao regime da legislação trabalhista, não sofre, por comparecer à audiência, perda de salário nem desconto no tempo de serviço."}]},{"id":"s14","title":"SEÇÃO X — DA PROVA PERICIAL · arts. 464 a 480","tag":"","b":[{"k":"h","t":"SEÇÃO X — DA PROVA PERICIAL"},{"k":"p","t":"Art. 464. A prova pericial consiste em exame, vistoria ou avaliação."},{"k":"p","t":"§ 1º O juiz indeferirá a perícia quando:"},{"k":"p","t":"I - a prova do fato não depender de conhecimento especial de técnico;"},{"k":"p","t":"II - for desnecessária em vista de outras provas produzidas;"},{"k":"p","t":"III - a verificação for impraticável."},{"k":"p","t":"§ 2º De ofício ou a requerimento das partes, o juiz poderá, em substituição à perícia, determinar a produção de prova técnica simplificada, quando o ponto controvertido for de menor complexidade."},{"k":"p","t":"§ 3º A prova técnica simplificada consistirá apenas na inquirição de especialista, pelo juiz, sobre ponto controvertido da causa que demande especial conhecimento científico ou técnico."},{"k":"p","t":"§ 4 o Durante a arguição, o especialista, que deverá ter formação acadêmica específica na área objeto de seu depoimento, poderá valer-se de qualquer recurso tecnológico de transmissão de sons e imagens com o fim de esclarecer os pontos controvertidos da causa."},{"k":"p","t":"Art. 465. O juiz nomeará perito especializado no objeto da perícia e fixará de imediato o prazo para a entrega do laudo."},{"k":"p","t":"§ 1º Incumbe às partes, dentro de 15 (quinze) dias contados da intimação do despacho de nomeação do perito:"},{"k":"p","t":"I - arguir o impedimento ou a suspeição do perito, se for o caso;"},{"k":"p","t":"II - indicar assistente técnico;"},{"k":"p","t":"III - apresentar quesitos."},{"k":"p","t":"§ 2º Ciente da nomeação, o perito apresentará em 5 (cinco) dias:"},{"k":"p","t":"I - proposta de honorários;"},{"k":"p","t":"II - currículo, com comprovação de especialização;"},{"k":"p","t":"III - contatos profissionais, em especial o endereço eletrônico, para onde serão dirigidas as intimações pessoais."},{"k":"p","t":"§ 3º As partes serão intimadas da proposta de honorários para, querendo, manifestar-se no prazo comum de 5 (cinco) dias, após o que o juiz arbitrará o valor, intimando-se as partes para os fins do art. 95 ."},{"k":"p","t":"§ 4º O juiz poderá autorizar o pagamento de até cinquenta por cento dos honorários arbitrados a favor do perito no início dos trabalhos, devendo o remanescente ser pago apenas ao final, depois de entregue o laudo e prestados todos os esclarecimentos necessários."},{"k":"p","t":"§ 5º Quando a perícia for inconclusiva ou deficiente, o juiz poderá reduzir a remuneração inicialmente arbitrada para o trabalho."},{"k":"p","t":"§ 6º Quando tiver de realizar-se por carta, poder-se-á proceder à nomeação de perito e à indicação de assistentes técnicos no juízo ao qual se requisitar a perícia."},{"k":"p","t":"Art. 466. O perito cumprirá escrupulosamente o encargo que lhe foi cometido, independentemente de termo de compromisso."},{"k":"p","t":"§ 1º Os assistentes técnicos são de confiança da parte e não estão sujeitos a impedimento ou suspeição."},{"k":"p","t":"§ 2º O perito deve assegurar aos assistentes das partes o acesso e o acompanhamento das diligências e dos exames que realizar, com prévia comunicação, comprovada nos autos, com antecedência mínima de 5 (cinco) dias."},{"k":"p","t":"Art. 467. O perito pode escusar-se ou ser recusado por impedimento ou suspeição."},{"k":"p","t":"Parágrafo único. O juiz, ao aceitar a escusa ou ao julgar procedente a impugnação, nomeará novo perito."},{"k":"p","t":"Art. 468. O perito pode ser substituído quando:"},{"k":"p","t":"I - faltar-lhe conhecimento técnico ou científico;"},{"k":"p","t":"II - sem motivo legítimo, deixar de cumprir o encargo no prazo que lhe foi assinado."},{"k":"p","t":"§ 1º No caso previsto no inciso II, o juiz comunicará a ocorrência à corporação profissional respectiva, podendo, ainda, impor multa ao perito, fixada tendo em vista o valor da causa e o possível prejuízo decorrente do atraso no processo."},{"k":"p","t":"§ 2º O perito substituído restituirá, no prazo de 15 (quinze) dias, os valores recebidos pelo trabalho não realizado, sob pena de ficar impedido de atuar como perito judicial pelo prazo de 5 (cinco) anos."},{"k":"p","t":"§ 3º Não ocorrendo a restituição voluntária de que trata o § 2º, a parte que tiver realizado o adiantamento dos honorários poderá promover execução contra o perito, na forma dos arts. 513 e seguintes deste Código , com fundamento na decisão que determinar a devolução do numerário."},{"k":"p","t":"Art. 469. As partes poderão apresentar quesitos suplementares durante a diligência, que poderão ser respondidos pelo perito previamente ou na audiência de instrução e julgamento."},{"k":"p","t":"Parágrafo único. O escrivão dará à parte contrária ciência da juntada dos quesitos aos autos."},{"k":"p","t":"Art. 470. Incumbe ao juiz:"},{"k":"p","t":"I - indeferir quesitos impertinentes;"},{"k":"p","t":"II - formular os quesitos que entender necessários ao esclarecimento da causa."},{"k":"p","t":"Art. 471. As partes podem, de comum acordo, escolher o perito, indicando-o mediante requerimento, desde que:"},{"k":"p","t":"I - sejam plenamente capazes;"},{"k":"p","t":"II - a causa possa ser resolvida por autocomposição."},{"k":"p","t":"§ 1º As partes, ao escolher o perito, já devem indicar os respectivos assistentes técnicos para acompanhar a realização da perícia, que se realizará em data e local previamente anunciados."},{"k":"p","t":"§ 2º O perito e os assistentes técnicos devem entregar, respectivamente, laudo e pareceres em prazo fixado pelo juiz."},{"k":"p","t":"§ 3º A perícia consensual substitui, para todos os efeitos, a que seria realizada por perito nomeado pelo juiz."},{"k":"p","t":"Art. 472. O juiz poderá dispensar prova pericial quando as partes, na inicial e na contestação, apresentarem, sobre as questões de fato, pareceres técnicos ou documentos elucidativos que considerar suficientes."},{"k":"p","t":"Art. 473. O laudo pericial deverá conter:"},{"k":"p","t":"I - a exposição do objeto da perícia;"},{"k":"p","t":"II - a análise técnica ou científica realizada pelo perito;"},{"k":"p","t":"III - a indicação do método utilizado, esclarecendo-o e demonstrando ser predominantemente aceito pelos especialistas da área do conhecimento da qual se originou;"},{
