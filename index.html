rcunstâncias, ser necessária e suficiente a adoção da medida."},{"k":"p","t":"§ 3º Aceita a proposta pelo autor da infração e seu defensor, será submetida à apreciação do Juiz."},{"k":"p","t":"§ 4º Acolhendo a proposta do Ministério Público aceita pelo autor da infração, o Juiz aplicará a pena restritiva de direitos ou multa, que não importará em reincidência, sendo registrada apenas para impedir novamente o mesmo benefício no prazo de cinco anos."},{"k":"p","t":"§ 5º Da sentença prevista no parágrafo anterior caberá a apelação referida no art. 82 desta Lei."},{"k":"p","t":"§ 6º A imposição da sanção de que trata o § 4º deste artigo não constará de certidão de antecedentes criminais, salvo para os fins previstos no mesmo dispositivo, e não terá efeitos civis, cabendo aos interessados propor ação cabível no juízo cível."},{"k":"h","t":"SEÇÃO III — DO PROCEDIMENTO SUMARIÍSSIMO"},{"k":"p","t":"Art. 77. Na ação penal de iniciativa pública, quando não houver aplicação de pena, pela ausência do autor do fato, ou pela não ocorrência da hipótese prevista no art. 76 desta Lei, o Ministério Público oferecerá ao Juiz, de imediato, denúncia oral, se não houver necessidade de diligências imprescindíveis."},{"k":"p","t":"§ 1º Para o oferecimento da denúncia, que será elaborada com base no termo de ocorrência referido no art. 69 desta Lei, com dispensa do inquérito policial, prescindir-se-á do exame do corpo de delito quando a materialidade do crime estiver aferida por boletim médico ou prova equivalente."},{"k":"p","t":"§ 2º Se a complexidade ou circunstâncias do caso não permitirem a formulação da denúncia, o Ministério Público poderá requerer ao Juiz o encaminhamento das peças existentes, na forma do parágrafo único do art. 66 desta Lei."},{"k":"p","t":"§ 3º Na ação penal de iniciativa do ofendido poderá ser oferecida queixa oral, cabendo ao Juiz verificar se a complexidade e as circunstâncias do caso determinam a adoção das providências previstas no parágrafo único do art. 66 desta Lei."},{"k":"p","t":"Art. 78. Oferecida a denúncia ou queixa, será reduzida a termo, entregando-se cópia ao acusado, que com ela ficará citado e imediatamente cientificado da designação de dia e hora para a audiência de instrução e julgamento, da qual também tomarão ciência o Ministério Público, o ofendido, o responsável civil e seus advogados."},{"k":"p","t":"§ 1º Se o acusado não estiver presente, será citado na forma dos arts. 66 e 68 desta Lei e cientificado da data da audiência de instrução e julgamento, devendo a ela trazer suas testemunhas ou apresentar requerimento para intimação, no mínimo cinco dias antes de sua realização."},{"k":"p","t":"§ 2º Não estando presentes o ofendido e o responsável civil, serão intimados nos termos do art. 67 desta Lei para comparecerem à audiência de instrução e julgamento."},{"k":"p","t":"§ 3º As testemunhas arroladas serão intimadas na forma prevista no art. 67 desta Lei."},{"k":"p","t":"Art. 79. No dia e hora designados para a audiência de instrução e julgamento, se na fase preliminar não tiver havido possibilidade de tentativa de conciliação e de oferecimento de proposta pelo Ministério Público, proceder-se-á nos termos dos arts. 72, 73, 74 e 75 desta Lei."},{"k":"p","t":"Art. 80. Nenhum ato será adiado, determinando o Juiz, quando imprescindível, a condução coercitiva de quem deva comparecer."},{"k":"p","t":"Art. 81. Aberta a audiência, será dada a palavra ao defensor para responder à acusação, após o que o Juiz receberá, ou não, a denúncia ou queixa; havendo recebimento, serão ouvidas a vítima e as testemunhas de acusação e defesa, interrogando-se a seguir o acusado, se presente, passando-se imediatamente aos debates orais e à prolação da sentença."},{"k":"p","t":"§ 1º Todas as provas serão produzidas na audiência de instrução e julgamento, podendo o Juiz limitar ou excluir as que considerar excessivas, impertinentes ou protelatórias."},{"k":"p","t":"§ 1º-A. Durante a audiência, todas as partes e demais sujeitos processuais presentes no ato deverão respeitar a dignidade da vítima, sob pena de responsabilização civil, penal e administrativa, cabendo ao juiz garantir o cumprimento do disposto neste artigo, vedadas: (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"I - a manifestação sobre circunstâncias ou elementos alheios aos fatos objeto de apuração nos autos; (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"II - a utilização de linguagem, de informações ou de material que ofendam a dignidade da vítima ou de testemunhas. (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"§ 2º De todo o ocorrido na audiência será lavrado termo, assinado pelo Juiz e pelas partes, contendo breve resumo dos fatos relevantes ocorridos em audiência e a sentença."},{"k":"p","t":"§ 3º A sentença, dispensado o relatório, mencionará os elementos de convicção do Juiz."},{"k":"p","t":"Art. 82. Da decisão de rejeição da denúncia ou queixa e da sentença caberá apelação, que poderá ser julgada por turma composta de três Juízes em exercício no primeiro grau de jurisdição, reunidos na sede do Juizado."},{"k":"p","t":"§ 1º A apelação será interposta no prazo de dez dias, contados da ciência da sentença pelo Ministério Público, pelo réu e seu defensor, por petição escrita, da qual constarão as razões e o pedido do recorrente."},{"k":"p","t":"§ 2º O recorrido será intimado para oferecer resposta escrita no prazo de dez dias."},{"k":"p","t":"§ 3º As partes poderão requerer a transcrição da gravação da fita magnética a que alude o § 3º do art. 65 desta Lei."},{"k":"p","t":"§ 4º As partes serão intimadas da data da sessão de julgamento pela imprensa."},{"k":"p","t":"§ 5º Se a sentença for confirmada pelos próprios fundamentos, a súmula do julgamento servirá de acórdão."},{"k":"p","t":"Art. 83. Cabem embargos de declaração quando, em sentença ou acórdão, houver obscuridade, contradição ou omissão. (Redação dada pela Lei nº 13.105, de 2015) (Vigência)"},{"k":"p","t":"§ 1º Os embargos de declaração serão opostos por escrito ou oralmente, no prazo de cinco dias, contados da ciência da decisão."},{"k":"p","t":"§ 2o Os embargos de declaração interrompem o prazo para a interposição de recurso. (Redação dada pela Lei nº 13.105, de 2015) (Vigência)"},{"k":"p","t":"§ 3º Os erros materiais podem ser corrigidos de ofício."},{"k":"h","t":"SEÇÃO VI — DISPOSIÇÕES FINAIS"},{"k":"p","t":"Art. 88. Além das hipóteses do Código Penal e da legislação especial, dependerá de representação a ação penal relativa aos crimes de lesões corporais leves e lesões culposas."},{"k":"p","t":"Art. 89. Nos crimes em que a pena mínima cominada for igual ou inferior a um ano, abrangidas ou não por esta Lei, o Ministério Público, ao oferecer a denúncia, poderá propor a suspensão do processo, por dois a quatro anos, desde que o acusado não esteja sendo processado ou não tenha sido condenado por outro crime, presentes os demais requisitos que autorizariam a suspensão condicional da pena (art. 77 do Código Penal)."},{"k":"p","t":"§ 1º Aceita a proposta pelo acusado e seu defensor, na presença do Juiz, este, recebendo a denúncia, poderá suspender o processo, submetendo o acusado a período de prova, sob as seguintes condições:"},{"k":"p","t":"I - reparação do dano, salvo impossibilidade de fazê-lo;"},{"k":"p","t":"II - proibição de freqüentar determinados lugares;"},{"k":"p","t":"III - proibição de ausentar-se da comarca onde reside, sem autorização do Juiz;"},{"k":"p","t":"IV - comparecimento pessoal e obrigatório a juízo, mensalmente, para informar e justificar suas atividades."},{"k":"p","t":"§ 2º O Juiz poderá especificar outras condições a que fica subordinada a suspensão, desde que adequadas ao fato e à situação pessoal do acusado."},{"k":"p","t":"§ 3º A suspensão será revogada se, no curso do prazo, o beneficiário vier a ser processado por outro crime ou não efetuar, sem motivo justificado, a reparação do dano."},{"k":"p","t":"§ 4º A suspensão poderá ser revogada se o acusado vier a ser processado, no curso do prazo, por contravenção, ou descumprir qualquer outra condição imposta."},{"k":"p","t":"§ 5º Expirado o prazo sem revogação, o Juiz declarará extinta a punibilidade."},{"k":"p","t":"§ 6º Não correrá a prescrição durante o prazo de suspensão do processo."},{"k":"p","t":"§ 7º Se o acusado não aceitar a proposta prevista neste artigo, o processo prosseguirá em seus ulteriores termos."}]}],"cpc":[{"id":"s0","title":"Disposições iniciais · arts. 144 a 155","tag":"","b":[{"k":"p","t":"Lei nº 13.105/2015 Código de Processo Civil."},{"k":"h","t":"TÍTULO IV — DO JUIZ E DOS AUXILIARES DA JUSTIÇA"},{"k":"h","t":"CAPÍTULO II — DOS IMPEDIMENTOS E DA SUSPEIÇÃO"},{"k":"p","t":"Art. 144. Há impedimento do juiz, sendo-lhe vedado exercer suas funções no processo:"},{"k":"p","t":"I - em que interveio como mandatário da parte, oficiou como perito, funcionou como membro do Ministério Público ou prestou depoimento como testemunha;"},{"k":"p","t":"II - de que conheceu em outro grau de jurisdição, tendo proferido decisão;"},{"k":"p","t":"III - quando nele estiver postulando, como defensor público, advogado ou membro do Ministério Público, seu cônjuge ou companheiro, ou qualquer parente, consanguíneo ou afim, em linha reta ou colateral, até o terceiro grau, inclusive;"},{"k":"p","t":"IV - quando for parte no processo ele próprio, seu cônjuge ou companheiro, ou parente, consanguíneo ou afim, em linha reta ou colateral, até o terceiro grau, inclusive;"},{"k":"p","t":"V - quando for sócio ou membro de direção ou de administração de pessoa jurídica parte no processo;"},{"k":"p","t":"VI - quando for herdeiro presuntivo, donatário ou empregador de qualquer das partes;"},{"k":"p","t":"VII - em que figure como parte instituição de ensino com a qual tenha relação de emprego ou decorrente de contrato de prestação de serviços;"},{"k":"p","t":"VIII - em que figure como parte cliente do escritório de advocacia de seu cônjuge, companheiro ou parente, consanguíneo ou afim, em linha reta ou colateral, até o terceiro grau, inclusive, mesmo que patrocinado por advogado de outro escritório;"},{"k":"p","t":"IX - quando promover ação contra a parte ou seu advogado."},{"k":"p","t":"§ 1º Na hipótese do inciso III, o impedimento só se verifica quando o defensor público, o advogado ou o membro do Ministério Público já integrava o processo antes do início da atividade judicante do juiz."},{"k":"p","t":"§ 2º É vedada a criação de fato superveniente a fim de caracterizar impedimento do juiz."},{"k":"p","t":"§ 3º O impedimento previsto no inciso III também se verifica no caso de mandato conferido a membro de escritório de advocacia que tenha em seus quadros advogado que individualmente ostente a condição nele prevista, mesmo que não intervenha diretamente no processo."},{"k":"p","t":"Art. 145. Há suspeição do juiz:"},{"k":"p","t":"I - amigo íntimo ou inimigo de qualquer das partes ou de seus advogados;"},{"k":"p","t":"II - que receber presentes de pessoas que tiverem interesse na causa antes ou depois de iniciado o processo, que aconselhar alguma das partes acerca do objeto da causa ou que subministrar meios para atender às despesas do litígio;"},{"k":"p","t":"III - quando qualquer das partes for sua credora ou devedora, de seu cônjuge ou companheiro ou de parentes destes, em linha reta até o terceiro grau, inclusive;"},{"k":"p","t":"IV - interessado no julgamento do processo em favor de qualquer das partes."},{"k":"p","t":"§ 1º Poderá o juiz declarar-se suspeito por motivo de foro íntimo, sem necessidade de declarar suas razões."},{"k":"p","t":"§ 2º Será ilegítima a alegação de suspeição quando:"},{"k":"p","t":"I - houver sido provocada por quem a alega;"},{"k":"p","t":"II - a parte que a alega houver praticado ato que signifique manifesta aceitação do arguido."},{"k":"p","t":"Art. 146. No prazo de 15 (quinze) dias, a contar do conhecimento do fato, a parte alegará o impedimento ou a suspeição, em petição específica dirigida ao juiz do processo, na qual indicará o fundamento da recusa, podendo instruí-la com documentos em que se fundar a alegação e com rol de testemunhas."},{"k":"p","t":"§ 1º Se reconhecer o impedimento ou a suspeição ao receber a petição, o juiz ordenará imediatamente a remessa dos autos a seu substituto legal, caso contrário, determinará a autuação em apartado da petição e, no prazo de 15 (quinze) dias, apresentará suas razões, acompanhadas de documentos e de rol de testemunhas, se houver, ordenando a remessa do incidente ao tribunal."},{"k":"p","t":"§ 2º Distribuído o incidente, o relator deverá declarar os seus efeitos, sendo que, se o incidente for recebido:"},{"k":"p","t":"I - sem efeito suspensivo, o processo voltará a correr;"},{"k":"p","t":"II - com efeito suspensivo, o processo permanecerá suspenso até o julgamento do incidente."},{"k":"p","t":"§ 3º Enquanto não for declarado o efeito em que é recebido o incidente ou quando este for recebido com efeito suspensivo, a tutela de urgência será requerida ao substituto legal."},{"k":"p","t":"§ 4º Verificando que a alegação de impedimento ou de suspeição é improcedente, o tribunal rejeitá-la-á."},{"k":"p","t":"§ 5º Acolhida a alegação, tratando-se de impedimento ou de manifesta suspeição, o tribunal condenará o juiz nas custas e remeterá os autos ao seu substituto legal, podendo o juiz recorrer da decisão."},{"k":"p","t":"§ 6º Reconhecido o impedimento ou a suspeição, o tribunal fixará o momento a partir do qual o juiz não poderia ter atuado."},{"k":"p","t":"§ 7º O tribunal decretará a nulidade dos atos do juiz, se praticados quando já presente o motivo de impedimento ou de suspeição."},{"k":"p","t":"Art. 147. Quando 2 (dois) ou mais juízes forem parentes, consanguíneos ou afins, em linha reta ou colateral, até o terceiro grau, inclusive, o primeiro que conhecer do processo impede que o outro nele atue, caso em que o segundo se escusará, remetendo os autos ao seu substituto legal."},{"k":"p","t":"Art. 148. Aplicam-se os motivos de impedimento e de suspeição:"},{"k":"p","t":"I - ao membro do Ministério Público;"},{"k":"p","t":"II - aos auxiliares da justiça;"},{"k":"p","t":"III - aos demais sujeitos imparciais do processo."},{"k":"p","t":"§ 1º A parte interessada deverá arguir o impedimento ou a suspeição, em petição fundamentada e devidamente instruída, na primeira oportunidade em que lhe couber falar nos autos."},{"k":"p","t":"§ 2º O juiz mandará processar o incidente em separado e sem suspensão do processo, ouvindo o arguido no prazo de 15 (quinze) dias e facultando a produção de prova, quando necessária."},{"k":"p","t":"§ 3º Nos tribunais, a arguição a que se refere o § 1º será disciplinada pelo regimento interno."},{"k":"p","t":"§ 4º O disposto nos §§ 1º e 2º não se aplica à arguição de impedimento ou de suspeição de testemunha."},{"k":"h","t":"CAPÍTULO III — DOS AUXILIARES DA JUSTIÇA"},{"k":"p","t":"Art. 149. São auxiliares da Justiça, além de outros cujas atribuições sejam determinadas pelas normas de organização judiciária, o escrivão, o chefe de secretaria, o oficial de justiça, o perito, o depositário, o administrador, o intérprete, o tradutor, o mediador, o conciliador judicial, o partidor, o distribuidor, o contabilista e o regulador de avarias."},{"k":"h","t":"SEÇÃO I — DO ESCRIVÃO, DO CHEFE DE SECRETARIA E DO OFICIAL DE JUSTIÇA"},{"k":"p","t":"Art. 150. Em cada juízo haverá um ou mais ofícios de justiça, cujas atribuições serão determinadas pelas normas de organização judiciária."},{"k":"p","t":"Art. 151. Em cada comarca, seção ou subseção judiciária haverá, no mínimo, tantos oficiais de justiça quantos sejam os juízos."},{"k":"p","t":"Art. 152. Incumbe ao escrivão ou ao chefe de secretaria:"},{"k":"p","t":"I - redigir, na forma legal, os ofícios, os mandados, as cartas precatórias e os demais atos que pertençam ao seu ofício;"},{"k":"p","t":"II - efetivar as ordens judiciais, realizar citações e intimações, bem como praticar todos os demais atos que lhe forem atribuídos pelas normas de organização judiciária;"},{"k":"p","t":"III - comparecer às audiências ou, não podendo fazêlo, designar servidor para substituí-lo;"},{"k":"p","t":"IV - manter sob sua guarda e responsabilidade os autos, não permitindo que saiam do cartório, exceto:"},{"k":"p","t":"a) quando tenham de seguir à conclusão do juiz;"},{"k":"p","t":"b) com vista a procurador, à Defensoria Pública, ao Ministério Público ou à Fazenda Pública;"},{"k":"p","t":"c) quando devam ser remetidos ao contabilista ou ao partidor;"},{"k":"p","t":"d) quando forem remetidos a outro juízo em razão da modificação da competência;"},{"k":"p","t":"V - fornecer certidão de qualquer ato ou termo do processo, independentemente de despacho, observadas as disposições referentes ao segredo de justiça;"},{"k":"p","t":"VI - praticar, de ofício, os atos meramente ordinatórios."},{"k":"p","t":"§ 1º O juiz titular editará ato a fim de regulamentar a atribuição prevista no inciso VI."},{"k":"p","t":"§ 2º No impedimento do escrivão ou chefe de secretaria, o juiz convocará substituto e, não o havendo, nomeará pessoa idônea para o ato."},{"k":"p","t":"Art. 153. O escrivão ou o chefe de secretaria atenderá, preferencialmente, à ordem cronológica de recebimento para publicação e efetivação dos pronunciamentos judiciais. (Redação dada pela Lei nº 13.256, de 2016) (Vigência)"},{"k":"p","t":"§ 1º A lista de processos recebidos deverá ser disponibilizada, de forma permanente, para consulta pública."},{"k":"p","t":"§ 2º Estão excluídos da regra do caput :"},{"k":"p","t":"I - os atos urgentes, assim reconhecidos pelo juiz no pronunciamento judicial a ser efetivado;"},{"k":"p","t":"II - as preferências legais."},{"k":"p","t":"§ 3º Após elaboração de lista própria, respeitar-se-ão a ordem cronológica de recebimento entre os atos urgentes e as preferências legais."},{"k":"p","t":"§ 4º A parte que se considerar preterida na ordem cronológica poderá reclamar, nos próprios autos, ao juiz do processo, que requisitará informações ao servidor, a serem prestadas no prazo de 2 (dois) dias."},{"k":"p","t":"§ 5º Constatada a preterição, o juiz determinará o imediato cumprimento do ato e a instauração de processo administrativo disciplinar contra o servidor."},{"k":"p","t":"Art. 154. Incumbe ao oficial de justiça:"},{"k":"p","t":"I - fazer pessoalmente citações, prisões, penhoras, arrestos e demais diligências próprias do seu ofício, sempre que possível na presença de 2 (duas) testemunhas, certificando no mandado o ocorrido, com menção ao lugar, ao dia e à hora;"},{"k":"p","t":"II - executar as ordens do juiz a que estiver subordinado;"},{"k":"p","t":"III - entregar o mandado em cartório após seu cumprimento;"},{"k":"p","t":"IV - auxiliar o juiz na manutenção da ordem;"},{"k":"p","t":"V - efetuar avaliações, quando for o caso;"},{"k":"p","t":"VI - certificar, em mandado, proposta de autocomposição apresentada por qualquer das partes, na ocasião de realização de ato de comunicação que lhe couber."},{"k":"p","t":"Parágrafo único. Certificada a proposta de autocomposição prevista no inciso VI, o juiz ordenará a intimação da parte contrária para manifestar-se, no prazo de 5 (cinco) dias, sem prejuízo do andamento regular do processo, entendendo-se o silêncio como recusa."},{"k":"p","t":"Art. 155. O escrivão, o chefe de secretaria e o oficial de justiça são responsáveis, civil e regressivamente, quando:"},{"k":"p","t":"I - sem justo motivo, se recusarem a cumprir no prazo os atos impostos pela lei ou pelo juiz a que estão subordinados;"},{"k":"p","t":"II - praticarem ato nulo com dolo ou culpa."}]},{"id":"s1","title":"LIVRO IV — DOS ATOS PROCESSUAIS · arts. 188 a 232","tag":"","b":[{"k":"h","t":"LIVRO IV — DOS ATOS PROCESSUAIS"},{"k":"h","t":"TÍTULO I — DA FORMA, DO TEMPO E DO LUGAR DOS ATOS PROCESSUAIS"},{"k":"h","t":"CAPÍTULO I — DA FORMA DOS ATOS PROCESSUAIS"},{"k":"h","t":"SEÇÃO I — DOS ATOS EM GERAL"},{"k":"p","t":"Art. 188. Os atos e os termos processuais independem de forma determinada, salvo quando a lei expressamente a exigir, considerando-se válidos os que, realizados de outro modo, lhe preencham a finalidade essencial."},{"k":"p","t":"Art. 189. Os atos processuais são públicos, todavia tramitam em segredo de justiça os processos:"},{"k":"p","t":"I - em que o exija o interesse público ou social;"},{"k":"p","t":"II - que versem sobre casamento, separação de corpos, divórcio, separação, união estável, filiação, alimentos e guarda de crianças e adolescentes;"},{"k":"p","t":"III - em que constem dados protegidos pelo direito constitucional à intimidade;"},{"k":"p","t":"IV - que versem sobre arbitragem, inclusive sobre cumprimento de carta arbitral, desde que a confidencialidade estipulada na arbitragem seja comprovada perante o juízo."},{"k":"p","t":"§ 1º O direito de consultar os autos de processo que tramite em segredo de justiça e de pedir certidões de seus atos é restrito às partes e aos seus procuradores."},{"k":"p","t":"§ 2º O terceiro que demonstrar interesse jurídico pode requerer ao juiz certidão do dispositivo da sentença, bem como de inventário e de partilha resultantes de divórcio ou separação."},{"k":"p","t":"Art. 190. Versando o processo sobre direitos que admitam autocomposição, é lícito às partes plenamente capazes estipular mudanças no procedimento para ajustá-lo às especificidades da causa e convencionar sobre os seus ônus, poderes, faculdades e deveres processuais, antes ou durante o processo."},{"k":"p","t":"Parágrafo único. De ofício ou a requerimento, o juiz controlará a validade das convenções previstas neste artigo, recusando-lhes aplicação somente nos casos de nulidade ou de inserção abusiva em contrato de adesão ou em que alguma parte se encontre em manifesta situação de vulnerabilidade."},{"k":"p","t":"Art. 191. De comum acordo, o juiz e as partes podem fixar calendário para a prática dos atos processuais, quando for o caso."},{"k":"p","t":"§ 1º O calendário vincula as partes e o juiz, e os prazos nele previstos somente serão modificados em casos excepcionais, devidamente justificados."},{"k":"p","t":"§ 2º Dispensa-se a intimação das partes para a prática de ato processual ou a realização de audiência cujas datas tiverem sido designadas no calendário."},{"k":"p","t":"Art. 192. Em todos os atos e termos do processo é obrigatório o uso da língua portuguesa."},{"k":"p","t":"Parágrafo único. O documento redigido em língua estrangeira somente poderá ser juntado aos autos quando acompanhado de versão para a língua portuguesa tramitada por via diplomática ou pela autoridade central, ou firmada por tradutor juramentado."},{"k":"h","t":"SEÇÃO II — DA PRÁTICA ELETRÔNICA DE ATOS PROCESSUAIS"},{"k":"p","t":"Art. 193. Os atos processuais podem ser total ou parcialmente digitais, de forma a permitir que sejam produzidos, comunicados, armazenados e validados por meio eletrônico, na forma da lei."},{"k":"p","t":"Parágrafo único. O disposto nesta Seção aplica-se, no que for cabível, à prática de atos notariais e de registro."},{"k":"p","t":"Art. 194. Os sistemas de automação processual respeitarão a publicidade dos atos, o acesso e a participação das partes e de seus procuradores, inclusive nas audiências e sessões de julgamento, observadas as garantias da disponibilidade, independência da plataforma computacional, acessibilidade e interoperabilidade dos sistemas, serviços, dados e informações que o Poder Judiciário administre no exercício de suas funções."},{"k":"p","t":"Art. 195. O registro de ato processual eletrônico deverá ser feito em padrões abertos, que atenderão aos requisitos de autenticidade, integridade, temporalidade, não repúdio, conservação e, nos casos que tramitem em segredo de justiça, confidencialidade, observada a infraestrutura de chaves públicas unificada nacionalmente, nos termos da lei."},{"k":"p","t":"Art. 196. Compete ao Conselho Nacional de Justiça e, supletivamente, aos tribunais, regulamentar a prática e a comunicação oficial de atos processuais por meio eletrônico e velar pela compatibilidade dos sistemas, disciplinando a incorporação progressiva de novos avanços tecnológicos e editando, para esse fim, os atos que forem necessários, respeitadas as normas fundamentais deste Código."},{"k":"p","t":"Art. 197. Os tribunais divulgarão as informações constantes de seu sistema de automação em página própria na rede mundial de computadores, gozando a divulgação de presunção de veracidade e confiabilidade."},{"k":"p","t":"Parágrafo único. Nos casos de problema técnico do sistema e de erro ou omissão do auxiliar da justiça responsável pelo registro dos andamentos, poderá ser configurada a justa causa prevista no art. 223, caput e"},{"k":"p","t":"§ 1º ."},{"k":"p","t":"Art. 198. As unidades do Poder Judiciário deverão manter gratuitamente, à disposição dos interessados, equipamentos necessários à prática de atos processuais e à consulta e ao acesso ao sistema e aos documentos dele constantes."},{"k":"p","t":"Parágrafo único. Será admitida a prática de atos por meio não eletrônico no local onde não estiverem disponibilizados os equipamentos previstos no caput ."},{"k":"p","t":"Art. 199. As unidades do Poder Judiciário assegurarão às pessoas com deficiência acessibilidade aos seus sítios na rede mundial de computadores, ao meio eletrônico de prática de atos judiciais, à comunicação eletrônica dos atos processuais e à assinatura eletrônica."},{"k":"h","t":"SEÇÃO III — DOS ATOS DAS PARTES"},{"k":"p","t":"Art. 200. Os atos das partes consistentes em declarações unilaterais ou bilaterais de vontade produzem imediatamente a constituição, modificação ou extinção de direitos processuais."},{"k":"p","t":"Parágrafo único. A desistência da ação só produzirá efeitos após homologação judicial."},{"k":"p","t":"Art. 201. As partes poderão exigir recibo de petições, arrazoados, papéis e documentos que entregarem em cartório."},{"k":"p","t":"Art. 202. É vedado lançar nos autos cotas marginais ou interlineares, as quais o juiz mandará riscar, impondo a quem as escrever multa correspondente à metade do salário-mínimo."},{"k":"h","t":"SEÇÃO IV — DOS PRONUNCIAMENTOS DO JUIZ"},{"k":"p","t":"Art. 203. Os pronunciamentos do juiz consistirão em sentenças, decisões interlocutórias e despachos."},{"k":"p","t":"§ 1º Ressalvadas as disposições expressas dos procedimentos especiais, sentença é o pronunciamento por meio do qual o juiz, com fundamento nos arts. 485 e 487 , põe fim à fase cognitiva do procedimento comum, bem como extingue a execução."},{"k":"p","t":"§ 2º Decisão interlocutória é todo pronunciamento judicial de natureza decisória que não se enquadre no"},{"k":"p","t":"§ 1º."},{"k":"p","t":"§ 3º São despachos todos os demais pronunciamentos do juiz praticados no processo, de ofício ou a requerimento da parte."},{"k":"p","t":"§ 4º Os atos meramente ordinatórios, como a juntada e a vista obrigatória, independem de despacho, devendo ser praticados de ofício pelo servidor e revistos pelo juiz quando necessário."},{"k":"p","t":"Art. 204. Acórdão é o julgamento colegiado proferido pelos tribunais."},{"k":"p","t":"Art. 205. Os despachos, as decisões, as sentenças e os acórdãos serão redigidos, datados e assinados pelos juízes."},{"k":"p","t":"§ 1º Quando os pronunciamentos previstos no caput forem proferidos oralmente, o servidor os documentará, submetendo-os aos juízes para revisão e assinatura."},{"k":"p","t":"§ 2º A assinatura dos juízes, em todos os graus de jurisdição, pode ser feita eletronicamente, na forma da lei."},{"k":"p","t":"§ 3º Os despachos, as decisões interlocutórias, o dispositivo das sentenças e a ementa dos acórdãos serão publicados no Diário de Justiça Eletrônico."},{"k":"h","t":"SEÇÃO V — DOS ATOS DO ESCRIVÃO OU DO CHEFE DE SECRETARIA"},{"k":"p","t":"Art. 206. Ao receber a petição inicial de processo, o escrivão ou o chefe de secretaria a autuará, mencionando o juízo, a natureza do processo, o número de seu registro, os nomes das partes e a data de seu início, e procederá do mesmo modo em relação aos volumes em formação."},{"k":"p","t":"Art. 207. O escrivão ou o chefe de secretaria numerará e rubricará todas as folhas dos autos."},{"k":"p","t":"Parágrafo único. À parte, ao procurador, ao membro do Ministério Público, ao defensor público e aos auxiliares da justiça é facultado rubricar as folhas correspondentes aos atos em que intervierem."},{"k":"p","t":"Art. 208. Os termos de juntada, vista, conclusão e outros semelhantes constarão de notas datadas e rubricadas pelo escrivão ou pelo chefe de secretaria."},{"k":"p","t":"Art. 209. Os atos e os termos do processo serão assinados pelas pessoas que neles intervierem, todavia, quando essas não puderem ou não quiserem firmá-los, o escrivão ou o chefe de secretaria certificará a ocorrência."},{"k":"p","t":"§ 1º Quando se tratar de processo total ou parcialmente documentado em autos eletrônicos, os atos processuais praticados na presença do juiz poderão ser produzidos e armazenados de modo integralmente digital em arquivo eletrônico inviolável, na forma da lei, mediante registro em termo, que será assinado digitalmente pelo juiz e pelo escrivão ou chefe de secretaria, bem como pelos advogados das partes."},{"k":"p","t":"§ 2º Na hipótese do § 1º, eventuais contradições na transcrição deverão ser suscitadas oralmente no momento de realização do ato, sob pena de preclusão, devendo o juiz decidir de plano e ordenar o registro, no termo, da alegação e da decisão."},{"k":"p","t":"Art. 210. É lícito o uso da taquigrafia, da estenotipia ou de outro método idôneo em qualquer juízo ou tribunal."},{"k":"p","t":"Art. 211. Não se admitem nos atos e termos processuais espaços em branco, salvo os que forem inutilizados, assim como entrelinhas, emendas ou rasuras, exceto quando expressamente ressalvadas."},{"k":"h","t":"CAPÍTULO II — DO TEMPO E DO LUGAR DOS ATOS PROCESSUAIS"},{"k":"h","t":"SEÇÃO I — DO TEMPO"},{"k":"p","t":"Art. 212. Os atos processuais serão realizados em dias úteis, das 6 (seis) às 20 (vinte) horas."},{"k":"p","t":"§ 1º Serão concluídos após as 20 (vinte) horas os atos iniciados antes, quando o adiamento prejudicar a diligência ou causar grave dano."},{"k":"p","t":"§ 2º Independentemente de autorização judicial, as citações, intimações e penhoras poderão realizar-se no período de férias forenses, onde as houver, e nos feriados ou dias úteis fora do horário estabelecido neste artigo, observado o disposto no art. 5º, inciso XI, da Constituição Federal ."},{"k":"p","t":"§ 3º Quando o ato tiver de ser praticado por meio de petição em autos não eletrônicos, essa deverá ser protocolada no horário de funcionamento do fórum ou tribunal, conforme o disposto na lei de organização judiciária local."},{"k":"p","t":"Art. 213. A prática eletrônica de ato processual pode ocorrer em qualquer horário até as 24 (vinte e quatro) horas do último dia do prazo."},{"k":"p","t":"Parágrafo único. O horário vigente no juízo perante o qual o ato deve ser praticado será considerado para fins de atendimento do prazo."},{"k":"p","t":"Art. 214. Durante as férias forenses e nos feriados, não se praticarão atos processuais, excetuando-se:"},{"k":"p","t":"I - os atos previstos no art. 212, § 2º ;"},{"k":"p","t":"II - a tutela de urgência."},{"k":"p","t":"Art. 215. Processam-se durante as férias forenses, onde as houver, e não se suspendem pela superveniência delas:"},{"k":"p","t":"I - os procedimentos de jurisdição voluntária e os necessários à conservação de direitos, quando puderem ser prejudicados pelo adiamento;"},{"k":"p","t":"II - a ação de alimentos e os processos de nomeação ou remoção de tutor e curador;"},{"k":"p","t":"III - os processos que a lei determinar."},{"k":"p","t":"Art. 216. Além dos declarados em lei, são feriados, para efeito forense, os sábados, os domingos e os dias em que não haja expediente forense."},{"k":"h","t":"SEÇÃO II — DO LUGAR"},{"k":"p","t":"Art. 217. Os atos processuais realizar-se-ão ordinariamente na sede do juízo, ou, excepcionalmente, em outro lugar em razão de deferência, de interesse da justiça, da natureza do ato ou de obstáculo arguido pelo interessado e acolhido pelo juiz."},{"k":"h","t":"CAPÍTULO III — DOS PRAZOS"},{"k":"h","t":"SEÇÃO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 218. Os atos processuais serão realizados nos prazos prescritos em lei."},{"k":"p","t":"§ 1º Quando a lei for omissa, o juiz determinará os prazos em consideração à complexidade do ato."},{"k":"p","t":"§ 2º Quando a lei ou o juiz não determinar prazo, as intimações somente obrigarão a comparecimento após decorridas 48 (quarenta e oito) horas."},{"k":"p","t":"§ 3º Inexistindo preceito legal ou prazo determinado pelo juiz, será de 5 (cinco) dias o prazo para a prática de ato processual a cargo da parte."},{"k":"p","t":"§ 4º Será considerado tempestivo o ato praticado antes do termo inicial do prazo."},{"k":"p","t":"Art. 219. Na contagem de prazo em dias, estabelecido por lei ou pelo juiz, computar-se-ão somente os dias úteis."},{"k":"p","t":"Parágrafo único. O disposto neste artigo aplica-se somente aos prazos processuais."},{"k":"p","t":"Art. 220. Suspende-se o curso do prazo processual nos dias compreendidos entre 20 de dezembro e 20 de janeiro, inclusive."},{"k":"p","t":"§ 1º Ressalvadas as férias individuais e os feriados instituídos por lei, os juízes, os membros do Ministério Público, da Defensoria Pública e da Advocacia Pública e os auxiliares da Justiça exercerão suas atribuições durante o período previsto no caput ."},{"k":"p","t":"§ 2º Durante a suspensão do prazo, não se realizarão audiências nem sessões de julgamento."},{"k":"p","t":"Art. 221. Suspende-se o curso do prazo por obstáculo criado em detrimento da parte ou ocorrendo qualquer das hipóteses do art. 313 , devendo o prazo ser restituído por tempo igual ao que faltava para sua complementação."},{"k":"p","t":"Parágrafo único. Suspendem-se os prazos durante a execução de programa instituído pelo Poder Judiciário para promover a autocomposição, incumbindo aos tribunais especificar, com antecedência, a duração dos trabalhos."},{"k":"p","t":"Art. 222. Na comarca, seção ou subseção judiciária onde for difícil o transporte, o juiz poderá prorrogar os prazos por até 2 (dois) meses."},{"k":"p","t":"§ 1º Ao juiz é vedado reduzir prazos peremptórios sem anuência das partes."},{"k":"p","t":"§ 2º Havendo calamidade pública, o limite previsto no caput para prorrogação de prazos poderá ser excedido."},{"k":"p","t":"Art. 223. Decorrido o prazo, extingue-se o direito de praticar ou de emendar o ato processual, independentemente de declaração judicial, ficando assegurado, porém, à parte provar que não o realizou por justa causa."},{"k":"p","t":"§ 1º Considera-se justa causa o evento alheio à vontade da parte e que a impediu de praticar o ato por si ou por mandatário."},{"k":"p","t":"§ 2º Verificada a justa causa, o juiz permitirá à parte a prática do ato no prazo que lhe assinar."},{"k":"p","t":"Art. 224. Salvo disposição em contrário, os prazos serão contados excluindo o dia do começo e incluindo o dia do vencimento."},{"k":"p","t":"§ 1º Os dias do começo e do vencimento do prazo serão protraídos para o primeiro dia útil seguinte, se coincidirem com dia em que o expediente forense for encerrado antes ou iniciado depois da hora normal ou houver indisponibilidade da comunicação eletrônica."},{"k":"p","t":"§ 2º Considera-se como data de publicação o primeiro dia útil seguinte ao da disponibilização da informação no Diário da Justiça eletrônico."},{"k":"p","t":"§ 3º A contagem do prazo terá início no primeiro dia útil que seguir ao da publicação."},{"k":"p","t":"Art. 225. A parte poderá renunciar ao prazo estabelecido exclusivamente em seu favor, desde que o faça de maneira expressa."},{"k":"p","t":"Art. 226. O juiz proferirá:"},{"k":"p","t":"I - os despachos no prazo de 5 (cinco) dias;"},{"k":"p","t":"II - as decisões interlocutórias no prazo de 10 (dez) dias;"},{"k":"p","t":"III - as sentenças no prazo de 30 (trinta) dias."},{"k":"p","t":"Art. 227. Em qualquer grau de jurisdição, havendo motivo justificado, pode o juiz exceder, por igual tempo, os prazos a que está submetido."},{"k":"p","t":"Art. 228. Incumbirá ao serventuário remeter os autos conclusos no prazo de 1 (um) dia e executar os atos processuais no prazo de 5 (cinco) dias, contado da data em que:"},{"k":"p","t":"I - houver concluído o ato processual anterior, se lhe foi imposto pela lei;"},{"k":"p","t":"II - tiver ciência da ordem, quando determinada pelo juiz."},{"k":"p","t":"§ 1º Ao receber os autos, o serventuário certificará o dia e a hora em que teve ciência da ordem referida no inciso II."},{"k":"p","t":"§ 2º Nos processos em autos eletrônicos, a juntada de petições ou de manifestações em geral ocorrerá de forma automática, independentemente de ato de serventuário da justiça."},{"k":"p","t":"Art. 229. Os litisconsortes que tiverem diferentes procuradores, de escritórios de advocacia distintos, terão prazos contados em dobro para todas as suas manifestações, em qualquer juízo ou tribunal, independentemente de requerimento."},{"k":"p","t":"§ 1º Cessa a contagem do prazo em dobro se, havendo apenas 2 (dois) réus, é oferecida defesa por apenas um deles."},{"k":"p","t":"§ 2º Não se aplica o disposto no caput aos processos em autos eletrônicos."},{"k":"p","t":"Art. 230. O prazo para a parte, o procurador, a Advocacia Pública, a Defensoria Pública e o Ministério Público será contado da citação, da intimação ou da notificação."},{"k":"p","t":"Art. 231. Salvo disposição em sentido diverso, considera-se dia do começo do prazo:"},{"k":"p","t":"I - a data de juntada aos autos do aviso de recebimento, quando a citação ou a intimação for pelo correio;"},{"k":"p","t":"II - a data de juntada aos autos do mandado cumprido, quando a citação ou a intimação for por oficial de justiça;"},{"k":"p","t":"III - a data de ocorrência da citação ou da intimação, quando ela se der por ato do escrivão ou do chefe de secretaria;"},{"k":"p","t":"IV - o dia útil seguinte ao fim da dilação assinada pelo juiz, quando a citação ou a intimação for por edital;"},{"k":"p","t":"V - o dia útil seguinte à consulta ao teor da citação ou da intimação ou ao término do prazo para que a consulta se dê, quando a citação ou a intimação for eletrônica;"},{"k":"p","t":"VI - a data de juntada do comunicado de que trata o art. 232 ou, não havendo esse, a data de juntada da carta aos autos de origem devidamente cumprida, quando a citação ou a intimação se realizar em cumprimento de carta;"},{"k":"p","t":"VII - a data de publicação, quando a intimação se der pelo Diário da Justiça impresso ou eletrônico;"},{"k":"p","t":"VIII - o dia da carga, quando a intimação se der por meio da retirada dos autos, em carga, do cartório ou da secretaria."},{"k":"p","t":"IX - o quinto dia útil seguinte à confirmação, na forma prevista na mensagem de citação, do recebimento da citação realizada por meio eletrônico. (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 1º Quando houver mais de um réu, o dia do começo do prazo para contestar corresponderá à última das datas a que se referem os incisos I a VI do caput ."},{"k":"p","t":"§ 2º Havendo mais de um intimado, o prazo para cada um é contado individualmente."},{"k":"p","t":"§ 3º Quando o ato tiver de ser praticado diretamente pela parte ou por quem, de qualquer forma, participe do processo, sem a intermediação de representante judicial, o dia do começo do prazo para cumprimento da determinação judicial corresponderá à data em que se der a comunicação."},{"k":"p","t":"§ 4º Aplica-se o disposto no inciso II do caput à citação com hora certa."},{"k":"p","t":"Art. 232. Nos atos de comunicação por carta precatória, rogatória ou de ordem, a realização da citação ou da intimação será imediatamente informada, por meio eletrônico, pelo juiz deprecado ao juiz deprecante."}]},{"id":"s2","title":"SEÇÃO II — DA VERIFICAÇÃO DOS PRAZOS E DAS PENALIDADES · arts. 233 a 235","tag":"","b":[{"k":"h","t":"SEÇÃO II — DA VERIFICAÇÃO DOS PRAZOS E DAS PENALIDADES"},{"k":"p","t":"Art. 233. Incumbe ao juiz verificar se o serventuário excedeu, sem motivo legítimo, os prazos estabelecidos em lei."},{"k":"p","t":"§ 1º Constatada a falta, o juiz ordenará a instauração de processo administrativo, na forma da lei."},{"k":"p","t":"§ 2º Qualquer das partes, o Ministério Público ou a Defensoria Pública poderá representar ao juiz contra o serventuário que injustificadamente exceder os prazos previstos em lei."},{"k":"p","t":"Art. 234. Os advogados públicos ou privados, o defensor público e o membro do Ministério Público devem restituir os autos no prazo do ato a ser praticado."},{"k":"p","t":"§ 1º É lícito a qualquer interessado exigir os autos do advogado que exceder prazo legal."},{"k":"p","t":"§ 2º Se, intimado, o advogado não devolver os autos no prazo de 3 (três) dias, perderá o direito à vista fora de cartório e incorrerá em multa correspondente à metade do salário-mínimo."},{"k":"p","t":"§ 3º Verificada a falta, o juiz comunicará o fato à seção local da Ordem dos Advogados do Brasil para procedimento disciplinar e imposição de multa."},{"k":"p","t":"§ 4º Se a situação envolver membro do Ministério Público, da Defensoria Pública ou da Advocacia Pública, a multa, se for o caso, será aplicada ao agente público responsável pelo ato."},{"k":"p","t":"§ 5º Verificada a falta, o juiz comunicará o fato ao órgão competente responsável pela instauração de procedimento disciplinar contra o membro que atuou no feito."},{"k":"p","t":"Art. 235. Qualquer parte, o Ministério Público ou a Defensoria Pública poderá representar ao corregedor do tribunal ou ao Conselho Nacional de Justiça contra juiz ou relator que injustificadamente exceder os prazos previstos em lei, regulamento ou regimento interno."},{"k":"p","t":"§ 1º Distribuída a representação ao órgão competente e ouvido previamente o juiz, não sendo caso de arquivamento liminar, será instaurado procedimento para apuração da responsabilidade, com intimação do representado por meio eletrônico para, querendo, apresentar justificativa no prazo de 15 (quinze) dias."},{"k":"p","t":"§ 2º Sem prejuízo das sanções administrativas cabíveis, em até 48 (quarenta e oito) horas após a apresentação ou não da justificativa de que trata o § 1º, se for o caso, o corregedor do tribunal ou o relator no Conselho Nacional de Justiça determinará a intimação do representado por meio eletrônico para que, em 10 (dez) dias, pratique o ato."},{"k":"p","t":"§ 3º Mantida a inércia, os autos serão remetidos ao substituto legal do juiz ou do relator contra o qual se representou para decisão em 10 (dez) dias."}]},{"id":"s3","title":"TÍTULO II — DA COMUNICAÇÃO DOS ATOS PROCESSUAIS · arts. 236 a 259","tag":"","b":[{"k":"h","t":"TÍTULO II — DA COMUNICAÇÃO DOS ATOS PROCESSUAIS"},{"k":"h","t":"CAPÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 236. Os atos processuais serão cumpridos por ordem judicial."},{"k":"p","t":"§ 1º Será expedida carta para a prática de atos fora dos limites territoriais do tribunal, da comarca, da seção ou da subseção judiciárias, ressalvadas as hipóteses previstas em lei."},{"k":"p","t":"§ 2º O tribunal poderá expedir carta para juízo a ele vinculado, se o ato houver de se realizar fora dos limites territoriais do local de sua sede."},{"k":"p","t":"§ 3º Admite-se a prática de atos processuais por meio de videoconferência ou outro recurso tecnológico de transmissão de sons e imagens em tempo real."},{"k":"p","t":"Art. 237. Será expedida carta:"},{"k":"p","t":"I - de ordem, pelo tribunal, na hipótese do § 2º do art. 236 ;"},{"k":"p","t":"II - rogatória, para que órgão jurisdicional estrangeiro pratique ato de cooperação jurídica internacional, relativo a processo em curso perante órgão jurisdicional brasileiro;"},{"k":"p","t":"III - precatória, para que órgão jurisdicional brasileiro pratique ou determine o cumprimento, na área de sua competência territorial, de ato relativo a pedido de cooperação judiciária formulado por órgão jurisdicional de competência territorial diversa;"},{"k":"p","t":"IV - arbitral, para que órgão do Poder Judiciário pratique ou determine o cumprimento, na área de sua competência territorial, de ato objeto de pedido de cooperação judiciária formulado por juízo arbitral, inclusive os que importem efetivação de tutela provisória."},{"k":"p","t":"Parágrafo único. Se o ato relativo a processo em curso na justiça federal ou em tribunal superior houver de ser praticado em local onde não haja vara federal, a carta poderá ser dirigida ao juízo estadual da respectiva comarca."},{"k":"h","t":"CAPÍTULO II — DA CITAÇÃO"},{"k":"p","t":"Art. 238. Citação é o ato pelo qual são convocados o réu, o executado ou o interessado para integrar a relação processual."},{"k":"p","t":"Parágrafo único. A citação será efetivada em até 45 (quarenta e cinco) dias a partir da propositura da ação. (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"Art. 239. Para a validade do processo é indispensável a citação do réu ou do executado, ressalvadas as hipóteses de indeferimento da petição inicial ou de improcedência liminar do pedido."},{"k":"p","t":"§ 1º O comparecimento espontâneo do réu ou do executado supre a falta ou a nulidade da citação, fluindo a partir desta data o prazo para apresentação de contestação ou de embargos à execução."},{"k":"p","t":"§ 2º Rejeitada a alegação de nulidade, tratando-se de processo de:"},{"k":"p","t":"I - conhecimento, o réu será considerado revel;"},{"k":"p","t":"II - execução, o feito terá seguimento."},{"k":"p","t":"Art. 240. A citação válida, ainda quando ordenada por juízo incompetente, induz litispendência, torna litigiosa a coisa e constitui em mora o devedor, ressalvado o disposto nos arts. 397 e 398 da Lei nº 10.406, de 10 de janeiro de 2002 (Código Civil) ."},{"k":"p","t":"§ 1º A interrupção da prescrição, operada pelo despacho que ordena a citação, ainda que proferido por juízo incompetente, retroagirá à data de propositura da ação."},{"k":"p","t":"§ 2º Incumbe ao autor adotar, no prazo de 10 (dez) dias, as providências necessárias para viabilizar a citação, sob pena de não se aplicar o disposto no § 1º."},{"k":"p","t":"§ 3º A parte não será prejudicada pela demora imputável exclusivamente ao serviço judiciário."},{"k":"p","t":"§ 4º O efeito retroativo a que se refere o § 1º aplica-se à decadência e aos demais prazos extintivos previstos em lei."},{"k":"p","t":"Art. 241. Transitada em julgado a sentença de mérito proferida em favor do réu antes da citação, incumbe ao escrivão ou ao chefe de secretaria comunicar-lhe o resultado do julgamento."},{"k":"p","t":"Art. 242. A citação será pessoal, podendo, no entanto, ser feita na pessoa do representante legal ou do procurador do réu, do executado ou do interessado."},{"k":"p","t":"§ 1º Na ausência do citando, a citação será feita na pessoa de seu mandatário, administrador, preposto ou gerente, quando a ação se originar de atos por eles praticados."},{"k":"p","t":"§ 2º O locador que se ausentar do Brasil sem cientificar o locatário de que deixou, na localidade onde estiver situado o imóvel, procurador com poderes para receber citação será citado na pessoa do administrador do imóvel encarregado do recebimento dos aluguéis, que será considerado habilitado para representar o locador em juízo."},{"k":"p","t":"§ 3º A citação da União, dos Estados, do Distrito Federal, dos Municípios e de suas respectivas autarquias e fundações de direito público será realizada perante o órgão de Advocacia Pública responsável por sua representação judicial."},{"k":"p","t":"Art. 243. A citação poderá ser feita em qualquer lugar em que se encontre o réu, o executado ou o interessado."},{"k":"p","t":"Parágrafo único. O militar em serviço ativo será citado na unidade em que estiver servindo, se não for conhecida sua residência ou nela não for encontrado."},{"k":"p","t":"Art. 244. Não se fará a citação, salvo para evitar o perecimento do direito:"},{"k":"p","t":"I - de quem estiver participando de ato de culto religioso;"},{"k":"p","t":"II - de cônjuge, de companheiro ou de qualquer parente do morto, consanguíneo ou afim, em linha reta ou na linha colateral em segundo grau, no dia do falecimento e nos 7 (sete) dias seguintes;"},{"k":"p","t":"III - de noivos, nos 3 (três) primeiros dias seguintes ao casamento;"},{"k":"p","t":"IV - de doente, enquanto grave o seu estado."},{"k":"p","t":"Art. 245. Não se fará citação quando se verificar que o citando é mentalmente incapaz ou está impossibilitado de recebê-la."},{"k":"p","t":"§ 1º O oficial de justiça descreverá e certificará minuciosamente a ocorrência."},{"k":"p","t":"§ 2º Para examinar o citando, o juiz nomeará médico, que apresentará laudo no prazo de 5 (cinco) dias."},{"k":"p","t":"§ 3º Dispensa-se a nomeação de que trata o § 2º se pessoa da família apresentar declaração do médico do citando que ateste a incapacidade deste."},{"k":"p","t":"§ 4º Reconhecida a impossibilidade, o juiz nomeará curador ao citando, observando, quanto à sua escolha, a preferência estabelecida em lei e restringindo a nomeação à causa."},{"k":"p","t":"§ 5º A citação será feita na pessoa do curador, a quem incumbirá a defesa dos interesses do citando."},{"k":"p","t":"Art. 246. A citação será feita preferencialmente por meio eletrônico, no prazo de até 2 (dois) dias úteis, contado da decisão que a determinar, por meio dos endereços eletrônicos indicados pelo citando no banco de dados do Poder Judiciário, conforme regulamento do Conselho Nacional de Justiça. (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"I - (Revogado) (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"II - (Revogado) (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"III - (Revogado) (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"IV - (Revogado) (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"V - (Revogado) (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 1º As empresas públicas e privadas são obrigadas a manter cadastro nos sistemas de processo em autos eletrônicos, para efeito de recebimento de citações e intimações, as quais serão efetuadas preferencialmente por esse meio. (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 1º-A A ausência de confirmação, em até 3 (três) dias úteis, contados do recebimento da citação eletrônica, implicará a realização da citação: (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"I - pelo correio; (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"II - por oficial de justiça; (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"III - pelo escrivão ou chefe de secretaria, se o citando comparecer em cartório; (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"IV - por edital. (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 1º-B Na primeira oportunidade de falar nos autos, o réu citado nas formas previstas nos incisos I, II, III e IV do § 1º-A deste artigo deverá apresentar justa causa para a ausência de confirmação do recebimento da citação enviada eletronicamente. (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 1º-C Considera-se ato atentatório à dignidade da justiça, passível de multa de até 5% (cinco por cento) do valor da causa, deixar de confirmar no prazo legal, sem justa causa, o recebimento da citação recebida por meio eletrônico. (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 2º O disposto no § 1º aplica-se à União, aos Estados, ao Distrito Federal, aos Municípios e às entidades da administração indireta."},{"k":"p","t":"§ 3º Na ação de usucapião de imóvel, os confinantes serão citados pessoalmente, exceto quando tiver por objeto unidade autônoma de prédio em condomínio, caso em que tal citação é dispensada."},{"k":"p","t":"§ 4º As citações por correio eletrônico serão acompanhadas das orientações para realização da confirmação de recebimento e de código identificador que permitirá a sua identificação na página eletrônica do órgão judicial citante. (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 5º As microempresas e as pequenas empresas somente se sujeitam ao disposto no § 1º deste artigo quando não possuírem endereço eletrônico cadastrado no sistema integrado da Rede Nacional para a Simplificação do Registro e da Legalização de Empresas e Negócios (Redesim). (Incluído pela Lei nº 14.195, de 2021)"},{"k":"p","t":"§ 6º Para os fins do § 5º deste artigo, deverá haver compartilhamento de cadastro com o órgão do Poder Judiciário, incluído o endereço eletrônico constante do sistema integrado da Redesim, nos termos da legislação aplicável ao sigilo fiscal e ao tratamento de dados pessoais. (Incluído pela Lei nº 14.195, de 2021"},{"k":"p","t":"Art. 247. A citação será feita por meio eletrônico ou pelo correio para qualquer comarca do País, exceto: (Redação dada pela Lei nº 14.195, de 2021)"},{"k":"p","t":"I - nas ações de estado, observado o disposto no art. 695, § 3º ;"},{"k":"p","t":"II - quando o citando for incapaz;"},{"k":"p","t":"III - quando o citando for pessoa de direito público;"},{"k":"p","t":"IV - quando o citando residir em local não atendido pela entrega domiciliar de correspondência;"},{"k":"p","t":"V - quando o autor, justificadamente, a requerer de outra forma."},{"k":"p","t":"Art. 248. Deferida a citação pelo correio, o escrivão ou o chefe de secretaria remeterá ao citando cópias da petição inicial e do despacho do juiz e comunicará o prazo para resposta, o endereço do juízo e o respectivo cartório."},{"k":"p","t":"§ 1º A carta será registrada para entrega ao citando, exigindo-lhe o carteiro, ao fazer a entrega, que assine o recibo."},{"k":"p","t":"§ 2º Sendo o citando pessoa jurídica, será válida a entrega do mandado a pessoa com poderes de gerência geral ou de administração ou, ainda, a funcionário responsável pelo recebimento de correspondências."},{"k":"p","t":"§ 3º Da carta de citação no processo de conhecimento constarão os requisitos do art. 250 ."},{"k":"p","t":"§ 4º Nos condomínios edilícios ou nos loteamentos com controle de acesso, será válida a entrega do mandado a funcionário da portaria responsável pelo recebimento de correspondência, que, entretanto, poderá recusar o recebimento, se declarar, por escrito, sob as penas da lei, que o destinatário da correspondência está ausente."},{"k":"p","t":"Art. 249. A citação será feita por meio de oficial de justiça nas hipóteses previstas neste Código ou em lei, ou quando frustrada a citação pelo correio."},{"k":"p","t":"Art. 250. O mandado que o oficial de justiça tiver de cumprir conterá:"},{"k":"p","t":"I - os nomes do autor e do citando e seus respectivos domicílios ou residências;"},{"k":"p","t":"II - a finalidade da citação, com todas as especificações constantes da petição inicial, bem como a menção do prazo para contestar, sob pena de revelia, ou para embargar a execução;"},{"k":"p","t":"III - a aplicação de sanção para o caso de descumprimento da ordem, se houver;"},{"k":"p","t":"IV - se for o caso, a intimação do citando para comparecer, acompanhado de advogado ou de defensor público, à audiência de conciliação ou de mediação, com a menção do dia, da hora e do lugar do comparecimento;"},{"k":"p","t":"V - a cópia da petição inicial, do despacho ou da decisão que deferir tutela provisória;"},{"k":"p","t":"VI - a assinatura do escrivão ou do chefe de secretaria e a declaração de que o subscreve por ordem do juiz."},{"k":"p","t":"Art. 251. Incumbe ao oficial de justiça procurar o citando e, onde o encontrar, citá-lo:"},{"k":"p","t":"I - lendo-lhe o mandado e entregando-lhe a contrafé;"},{"k":"p","t":"II - portando por fé se recebeu ou recusou a contrafé;"},{"k":"p","t":"III - obtendo a nota de ciente ou certificando que o citando não a apôs no mandado."},{"k":"p","t":"Art. 252. Quando, por 2 (duas) vezes, o oficial de justiça houver procurado o citando em seu domicílio ou residência sem o encontrar, deverá, havendo suspeita de ocultação, intimar qualquer pessoa da família ou, em sua falta, qualquer vizinho de que, no dia útil imediato, voltará a fim de efetuar a citação, na hora que designar."},{"k":"p","t":"Parágrafo único. Nos condomínios edilícios ou nos loteamentos com controle de acesso, será válida a intimação a que se refere o caput feita a funcionário da portaria responsável pelo recebimento de correspondência."},{"k":"p","t":"Art. 253. No dia e na hora designados, o oficial de justiça, independentemente de novo despacho, comparecerá ao domicílio ou à residência do citando a fim de realizar a diligência."},{"k":"p","t":"§ 1º Se o citando não estiver presente, o oficial de justiça procurará informar-se das razões da ausência, dando por feita a citação, ainda que o citando se tenha ocultado em outra comarca, seção ou subseção judiciárias."},{"k":"p","t":"§ 2º A citação com hora certa será efetivada mesmo que a pessoa da família ou o vizinho que houver sido intimado esteja ausente, ou se, embora presente, a pessoa da família ou o vizinho se recusar a receber o mandado."},{"k":"p","t":"§ 3º Da certidão da ocorrência, o oficial de justiça deixará contrafé com qualquer pessoa da família ou vizinho, conforme o caso, declarando-lhe o nome."},{"k":"p","t":"§ 4º O oficial de justiça fará constar do mandado a advertência de que será nomeado curador especial se houver revelia."},{"k":"p","t":"Art. 254. Feita a citação com hora certa, o escrivão ou chefe de secretaria enviará ao réu, executado ou interessado, no prazo de 10 (dez) dias, contado da data da juntada do mandado aos autos, carta, telegrama ou correspondência eletrônica, dando-lhe de tudo ciência."},{"k":"p","t":"Art. 255. Nas comarcas contíguas de fácil comunicação e nas que se situem na mesma região metropolitana, o oficial de justiça poderá efetuar, em qualquer delas, citações, intimações, notificações, penhoras e quaisquer outros atos executivos."},{"k":"p","t":"Art. 256. A citação por edital será feita:"},{"k":"p","t":"I - quando desconhecido ou incerto o citando;"},{"k":"p","t":"II - quando ignorado, incerto ou inacessível o lugar em que se encontrar o citando;"},{"k":"p","t":"III - nos casos expressos em lei."},{"k":"p","t":"§ 1º Considera-se inacessível, para efeito de citação por edital, o país que recusar o cumprimento de carta rogatória."},{"k":"p","t":"§ 2º No caso de ser inacessível o lugar em que se encontrar o réu, a notícia de sua citação será divulgada também pelo rádio, se na comarca houver emissora de radiodifusão."},{"k":"p","t":"§ 3º O réu será considerado em local ignorado ou incerto se infrutíferas as tentativas de sua localização, inclusive mediante requisição pelo juízo de informações sobre seu endereço nos cadastros de órgãos públicos ou de concessionárias de serviços públicos."},{"k":"p","t":"Art. 257. São requisitos da citação por edital:"},{"k":"p","t":"I - a afirmação do autor ou a certidão do oficial informando a presença das circunstâncias autorizadoras;"},{"k":"p","t":"II - a publicação do edital na rede mundial de computadores, no sítio do respectivo tribunal e na plataforma de editais do Conselho Nacional de Justiça, que deve ser certificada nos autos;"},{"k":"p","t":"III - a determinação, pelo juiz, do prazo, que variará entre 20 (vinte) e 60 (sessenta) dias, fluindo da data da publicação única ou, havendo mais de uma, da primeira;"},{"k":"p","t":"IV - a advertência de que será nomeado curador especial em caso de revelia."},{"k":"p","t":"Parágrafo único. O juiz poderá determinar que a publicação do edital seja feita também em jornal local de ampla circulação ou por outros meios, considerando as peculiaridades da comarca, da seção ou da subseção judiciárias."},{"k":"p","t":"Art. 258. A parte que requerer a citação por edital, alegando dolosamente a ocorrência das circunstâncias autorizadoras para sua realização, incorrerá em multa de 5 (cinco) vezes o salário-mínimo."},{"k":"p","t":"Parágrafo único. A multa reverterá em benefício do citando."},{"k":"p","t":"Art. 259. Serão publicados editais:"},{"k":"p","t":"I - na ação de usucapião de imóvel;"},{"k":"p","t":"II - na ação de recuperação ou substituição de título ao portador;"},{"k":"p","t":"III - em qualquer ação em que seja necessária, por determinação legal, a provocação, para participação no processo, de interessados incertos ou desconhecidos."}]},{"id":"s4","title":"CAPÍTULO III — DAS CARTAS · arts. 260 a 275","tag":"","b":[{"k":"h","t":"CAPÍTULO III — DAS CARTAS"},{"k":"p","t":"Art. 260. São requisitos das cartas de ordem, precatória e rogatória:"},{"k":"p","t":"I - a indicação dos juízes de origem e de cumprimento do ato;"},{"k":"p","t":"II - o inteiro teor da petição, do despacho judicial e do instrumento do mandato conferido ao advogado;"},{"k":"p","t":"III - a menção do ato processual que lhe constitui o objeto;"},{"k":"p","t":"IV - o encerramento com a assinatura do juiz."},{"k":"p","t":"§ 1º O juiz mandará trasladar para a carta quaisquer outras peças, bem como instruí-la com mapa, desenho ou gráfico, sempre que esses documentos devam ser examinados, na diligência, pelas partes, pelos peritos ou pelas testemunhas."},{"k":"p","t":"§ 2º Quando o objeto da carta for exame pericial sobre documento, este será remetido em original, ficando nos autos reprodução fotográfica."},{"k":"p","t":"§ 3º A carta arbitral atenderá, no que couber, aos requisitos a que se refere o caput e será instruída com a convenção de arbitragem e com as provas da nomeação do árbitro e de sua aceitação da função."},{"k":"p","t":"Art. 261. Em todas as cartas o juiz fixará o prazo para cumprimento, atendendo à facilidade das comunicações e à natureza da diligência."},{"k":"p","t":"§ 1º As partes deverão ser intimadas pelo juiz do ato de expedição da carta."},{"k":"p","t":"§ 2º Expedida a carta, as partes acompanharão o cumprimento da diligência perante o juízo destinatário, ao qual compete a prática dos atos de comunicação."},{"k":"p","t":"§ 3º A parte a quem interessar o cumprimento da diligência cooperará para que o prazo a que se refere o caput seja cumprido."},{"k":"p","t":"Art. 262. A carta tem caráter itinerante, podendo, antes ou depois de lhe ser ordenado o cumprimento, ser encaminhada a juízo diverso do que dela consta, a fim de se praticar o ato."},{"k":"p","t":"Parágrafo único. O encaminhamento da carta a outro juízo será imediatamente comunicado ao órgão expedidor, que intimará as partes."},{"k":"p","t":"Art. 263. As cartas deverão, preferencialmente, ser expedidas por meio eletrônico, caso em que a assinatura do juiz deverá ser eletrônica, na forma da lei."},{"k":"p","t":"Art. 264. A carta de ordem e a carta precatória por meio eletrônico, por telefone ou por telegrama conterão, em resumo substancial, os requisitos mencionados no art. 250 , especialmente no que se refere à aferição da autenticidade."},{"k":"p","t":"Art. 265. O secretário do tribunal, o escrivão ou o chefe de secretaria do juízo deprecante transmitirá, por telefone, a carta de ordem ou a carta precatória ao juízo em que houver de se cumprir o ato, por intermédio do escrivão do primeiro ofício da primeira vara, se houver na comarca mais de um ofício ou de uma vara, observando-se, quanto aos requisitos, o disposto no art. 264 ."},{"k":"p","t":"§ 1º O escrivão ou o chefe de secretaria, no mesmo dia ou no dia útil imediato, telefonará ou enviará mensagem eletrônica ao secretário do tribunal, ao escrivão ou ao chefe de secretaria do juízo deprecante, lendo-lhe os termos da carta e solicitando-lhe que os confirme."},{"k":"p","t":"§ 2º Sendo confirmada, o escrivão ou o chefe de secretaria submeterá a carta a despacho."},{"k":"p","t":"Art. 266. Serão praticados de ofício os atos requisitados por meio eletrônico e de telegrama, devendo a parte depositar, contudo, na secretaria do tribunal ou no cartório do juízo deprecante, a importância correspondente às despesas que serão feitas no juízo em que houver de praticar-se o ato."},{"k":"p","t":"Art. 267. O juiz recusará cumprimento a carta precatória ou arbitral, devolvendo-a com decisão motivada quando:"},{"k":"p","t":"I - a carta não estiver revestida dos requisitos legais;"},{"k":"p","t":"II - faltar ao juiz competência em razão da matéria ou da hierarquia;"},{"k":"p","t":"III - o juiz tiver dúvida acerca de sua autenticidade."},{"k":"p","t":"Parágrafo único. No caso de incompetência em razão da matéria ou da hierarquia, o juiz deprecado, conforme o ato a ser praticado, poderá remeter a carta ao juiz ou ao tribunal competente."},{"k":"p","t":"Art. 268. Cumprida a carta, será devolvida ao juízo de origem no prazo de 10 (dez) dias, independentemente de traslado, pagas as custas pela parte."},{"k":"h","t":"CAPÍTULO IV — DAS INTIMAÇÕES"},{"k":"p","t":"Art. 269. Intimação é o ato pelo qual se dá ciência a alguém dos atos e dos termos do processo."},{"k":"p","t":"§ 1º É facultado aos advogados promover a intimação do advogado da outra parte por meio do correio, juntando aos autos, a seguir, cópia do ofício de intimação e do aviso de recebimento."},{"k":"p","t":"§ 2º O ofício de intimação deverá ser instruído com cópia do despacho, da decisão ou da sentença."},{"k":"p","t":"§ 3º A intimação da União, dos Estados, do Distrito Federal, dos Municípios e de suas respectivas autarquias e fundações de direito público será realizada perante o órgão de Advocacia Pública responsável por sua representação judicial."},{"k":"p","t":"Art. 270. As intimações realizam-se, sempre que possível, por meio eletrônico, na forma da lei."},{"k":"p","t":"Parágrafo único. Aplica-se ao Ministério Público, à Defensoria Pública e à Advocacia Pública o disposto no § 1º do art. 246 ."},{"k":"p","t":"Art. 271. O juiz determinará de ofício as intimações em processos pendentes, salvo disposição em contrário."},{"k":"p","t":"Art. 272. Quando não realizadas por meio eletrônico, consideram-se feitas as intimações pela publicação dos atos no órgão oficial."},{"k":"p","t":"§ 1º Os advogados poderão requerer que, na intimação a eles dirigida, figure apenas o nome da sociedade a que pertençam, desde que devidamente registrada na Ordem dos Advogados do Brasil."},{"k":"p","t":"§ 2º Sob pena de nulidade, é indispensável que da publicação constem os nomes das partes e de seus advogados, com o respectivo número de inscrição na Ordem dos Advogados do Brasil, ou, se assim requerido, da sociedade de advogados."},{"k":"p","t":"§ 3º A grafia dos nomes das partes não deve conter abreviaturas."},{"k":"p","t":"§ 4º A grafia dos nomes dos advogados deve corresponder ao nome completo e ser a mesma que constar da procuração ou que estiver registrada na Ordem dos Advogados do Brasil."},{"k":"p","t":"§ 5º Constando dos autos pedido expresso para que as comunicações dos atos processuais sejam feitas em nome dos advogados indicados, o seu desatendimento implicará nulidade."},{"k":"p","t":"§ 6º A retirada dos autos do cartório ou da secretaria em carga pelo advogado, por pessoa credenciada a pedido do advogado ou da sociedade de advogados, pela Advocacia Pública, pela Defensoria Pública ou pelo Ministério Público implicará intimação de qualquer decisão contida no processo retirado, ainda que pendente de publicação."},{"k":"p","t":"§ 7º O advogado e a sociedade de advogados deverão requerer o respectivo credenciamento para a retirada de autos por preposto."},{"k":"p","t":"§ 8º A parte arguirá a nulidade da intimação em capítulo preliminar do próprio ato que lhe caiba praticar, o qual será tido por tempestivo se o vício for reconhecido."},{"k":"p","t":"§ 9º Não sendo possível a prática imediata do ato diante da necessidade de acesso prévio aos autos, a parte limitar-se-á a arguir a nulidade da intimação, caso em que o prazo será contado da intimação da decisão que a reconheça."},{"k":"p","t":"Art. 273. Se inviável a intimação por meio eletrônico e não houver na localidade publicação em órgão oficial, incumbirá ao escrivão ou chefe de secretaria intimar de todos os atos do processo os advogados das partes:"},{"k":"p","t":"I - pessoalmente, se tiverem domicílio na sede do juízo;"},{"k":"p","t":"II - por carta registrada, com aviso de recebimento, quando forem domiciliados fora do juízo."},{"k":"p","t":"Art. 274. Não dispondo a lei de outro modo, as intimações serão feitas às partes, aos seus representantes legais, aos advogados e aos demais sujeitos do processo pelo correio ou, se presentes em cartório, diretamente pelo escrivão ou chefe de secretaria."},{"k":"p","t":"Parágrafo único. Presumem-se válidas as intimações dirigidas ao endereço constante dos autos, ainda que não recebidas pessoalmente pelo interessado, se a modificação temporária ou definitiva não tiver sido devidamente comunicada ao juízo, fluindo os prazos a partir da juntada aos autos do comprovante de entrega da correspondência no primitivo endereço."},{"k":"p","t":"Art. 275. A intimação será feita por oficial de justiça quando frustrada a realização por meio eletrônico ou pelo correio."},{"k":"p","t":"§ 1º A certidão de intimação deve conter:"},{"k":"p","t":"I - a indicação do lugar e a descrição da pessoa intimada, mencionando, quando possível, o número de seu documento de identidade e o órgão que o expediu;"},{"k":"p","t":"II - a declaração de entrega da contrafé;"},{"k":"p","t":"III - a nota de ciente ou a certidão de que o interessado não a apôs no mandado."},{"k":"p","t":"§ 2º Caso necessário, a intimação poderá ser efetuada com hora certa ou por edital."}]},{"id":"s5","title":"LIVRO V — DA TUTELA PROVISÓRIA · arts. 294 a 299","tag":"","b":[{"k":"h","t":"LIVRO V — DA TUTELA PROVISÓRIA"},{"k":"h","t":"TÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 294. A tutela provisória pode fundamentar-se em urgência ou evidência."},{"k":"p","t":"Parágrafo único. A tutela provisória de urgência, cautelar ou antecipada, pode ser concedida em caráter antecedente ou incidental."},{"k":"p","t":"Art. 295. A tutela provisória requerida em caráter incidental independe do pagamento de custas."},{"k":"p","t":"Art. 296. A tutela provisória conserva sua eficácia na pendência do processo, mas pode, a qualquer tempo, ser revogada ou modificada."},{"k":"p","t":"Parágrafo único. Salvo decisão judicial em contrário, a tutela provisória conservará a eficácia durante o período de suspensão do processo."},{"k":"p","t":"Art. 297. O juiz poderá determinar as medidas que considerar adequadas para efetivação da tutela provisória."},{"k":"p","t":"Parágrafo único. A efetivação da tutela provisória observará as normas referentes ao cumprimento provisório da sentença, no que couber."},{"k":"p","t":"Art. 298. Na decisão que conceder, negar, modificar ou revogar a tutela provisória, o juiz motivará seu convencimento de modo claro e preciso."},{"k":"p","t":"Art. 299. A tutela provisória será requerida ao juízo da causa e, quando antecedente, ao juízo competente para conhecer do pedido principal."},{"k":"p","t":"Parágrafo único. Ressalvada disposição especial, na ação de competência originária de tribunal e nos recursos a tutela provisória será requerida ao órgão jurisdicional competente para apreciar o mérito."}]},{"id":"s6","title":"TÍTULO II — DA TUTELA DE URGÊNCIA · arts. 300 a 310","tag":"","b":[{"k":"h","t":"TÍTULO II — DA TUTELA DE URGÊNCIA"},{"k":"h","t":"CAPÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 300. A tutela de urgência será concedida quando houver elementos que evidenciem a probabilidade do direito e o perigo de dano ou o risco ao resultado útil do processo."},{"k":"p","t":"§ 1 o Para a concessão da tutela de urgência, o juiz pode, conforme o caso, exigir caução real ou fidejussória idônea para ressarcir os danos que a outra parte possa vir a sofrer, podendo a caução ser dispensada se a parte economicamente hipossuficiente não puder oferecê-la."},{"k":"p","t":"§ 2º A tutela de urgência pode ser concedida liminarmente ou após justificação prévia."},{"k":"p","t":"§ 3º A tutela de urgência de natureza antecipada não será concedida quando houver perigo de irreversibilidade dos efeitos da decisão."},{"k":"p","t":"Art. 301. A tutela de urgência de natureza cautelar pode ser efetivada mediante arresto, sequestro, arrolamento de bens, registro de protesto contra alienação de bem e qualquer outra medida idônea para asseguração do direito."},{"k":"p","t":"Art. 302. Independentemente da reparação por dano processual, a parte responde pelo prejuízo que a efetivação da tutela de urgência causar à parte adversa, se:"},{"k":"p","t":"I - a sentença lhe for desfavorável;"},{"k":"p","t":"II - obtida liminarmente a tutela em caráter antecedente, não fornecer os meios necessários para a citação do requerido no prazo de 5 (cinco) dias;"},{"k":"p","t":"III - ocorrer a cessação da eficácia da medida em qualquer hipótese legal;"},{"k":"p","t":"IV - o juiz acolher a alegação de decadência ou prescrição da pretensão do autor."},{"k":"p","t":"Parágrafo único. A indenização será liquidada nos autos em que a medida tiver sido concedida, sempre que possível."},{"k":"h","t":"CAPÍTULO II — DO PROCEDIMENTO DA TUTELA ANTECIPADA REQUERIDA EM CARÁTER ANTECEDENTE"},{"k":"p","t":"Art. 303. Nos casos em que a urgência for contemporânea à propositura da ação, a petição inicial pode limitar-se ao requerimento da tutela antecipada e à indicação do pedido de tutela final, com a exposição da lide, do direito que se busca realizar e do perigo de dano ou do risco ao resultado útil do processo."},{"k":"p","t":"§ 1º Concedida a tutela antecipada a que se refere o caput deste artigo:"},{"k":"p","t":"I - o autor deverá aditar a petição inicial, com a complementação de sua argumentação, a juntada de novos documentos e a confirmação do pedido de tutela final, em 15 (quinze) dias ou em outro prazo maior que o juiz fixar;"},{"k":"p","t":"II - o réu será citado e intimado para a audiência de conciliação ou de mediação na forma do art. 334 ;"},{"k":"p","t":"III - não havendo autocomposição, o prazo para contestação será contado na forma do art. 335 ."},{"k":"p","t":"§ 2º Não realizado o aditamento a que se refere o inciso I do § 1º deste artigo, o processo será extinto sem resolução do mérito."},{"k":"p","t":"§ 3º O aditamento a que se refere o inciso I do § 1º deste artigo dar-se-á nos mesmos autos, sem incidência de novas custas processuais."},{"k":"p","t":"§ 4º Na petição inicial a que se refere o caput deste artigo, o autor terá de indicar o valor da causa, que deve levar em consideração o pedido de tutela final."},{"k":"p","t":"§ 5º O autor indicará na petição inicial, ainda, que pretende valer-se do benefício previsto no caput deste artigo."},{"k":"p","t":"§ 6º Caso entenda que não há elementos para a concessão de tutela antecipada, o órgão jurisdicional determinará a emenda da petição inicial em até 5 (cinco) dias, sob pena de ser indeferida e de o processo ser extinto sem resolução de mérito."},{"k":"p","t":"Art. 304. A tutela antecipada, concedida nos termos do art. 303 , torna-se estável se da decisão que a conceder não for interposto o respectivo recurso."},{"k":"p","t":"§ 1º No caso previsto no caput , o processo será extinto."},{"k":"p","t":"§ 2º Qualquer das partes poderá demandar a outra com o intuito de rever, reformar ou invalidar a tutela antecipada estabilizada nos termos do caput ."},{"k":"p","t":"§ 3º A tutela antecipada conservará seus efeitos enquanto não revista, reformada ou invalidada por decisão de mérito proferida na ação de que trata o § 2º."},{"k":"p","t":"§ 4º Qualquer das partes poderá requerer o desarquivamento dos autos em que foi concedida a medida, para instruir a petição inicial da ação a que se refere o § 2º, prevento o juízo em que a tutela antecipada foi concedida."},{"k":"p","t":"§ 5º O direito de rever, reformar ou invalidar a tutela antecipada, previsto no § 2º deste artigo, extingue-se após 2 (dois) anos, contados da ciência da decisão que extinguiu o processo, nos termos do § 1º."},{"k":"p","t":"§ 6º A decisão que concede a tutela não fará coisa julgada, mas a estabilidade dos respectivos efeitos só será afastada por decisão que a revir, reformar ou invalidar, proferida em ação ajuizada por uma das partes, nos termos do § 2º deste artigo."},{"k":"h","t":"CAPÍTULO III — DO PROCEDIMENTO DA TUTELA CAUTELAR REQUERIDA EM CARÁTER ANTECEDENTE"},{"k":"p","t":"Art. 305. A petição inicial da ação que visa à prestação de tutela cautelar em caráter antecedente indicará a lide e seu fundamento, a exposição sumária do direito que se objetiva assegurar e o perigo de dano ou o risco ao resultado útil do processo."},{"k":"p","t":"Parágrafo único. Caso entenda que o pedido a que se refere o caput tem natureza antecipada, o juiz observará o disposto no art. 303 ."},{"k":"p","t":"Art. 306. O réu será citado para, no prazo de 5 (cinco) dias, contestar o pedido e indicar as provas que pretende produzir."},{"k":"p","t":"Art. 307. Não sendo contestado o pedido, os fatos alegados pelo autor presumir-se-ão aceitos pelo réu como ocorridos, caso em que o juiz decidirá dentro de 5 (cinco) dias."},{"k":"p","t":"Parágrafo único. Contestado o pedido no prazo legal, observar-se-á o procedimento comum."},{"k":"p","t":"Art. 308. Efetivada a tutela cautelar, o pedido principal terá de ser formulado pelo autor no prazo de 30 (trinta) dias, caso em que será apresentado nos mesmos autos em que deduzido o pedido de tutela cautelar, não dependendo do adiantamento de novas custas processuais."},{"k":"p","t":"§ 1º O pedido principal pode ser formulado conjuntamente com o pedido de tutela cautelar."},{"k":"p","t":"§ 2º A causa de pedir poderá ser aditada no momento de formulação do pedido principal."},{"k":"p","t":"§ 3º Apresentado o pedido principal, as partes serão intimadas para a audiência de conciliação ou de mediação, na forma do art. 334 , por seus advogados ou pessoalmente, sem necessidade de nova citação do réu."},{"k":"p","t":"§ 4º Não havendo autocomposição, o prazo para contestação será contado na forma do art. 335 ."},{"k":"p","t":"Art. 309. Cessa a eficácia da tutela concedida em caráter antecedente, se:"},{"k":"p","t":"I - o autor não deduzir o pedido principal no prazo legal;"},{"k":"p","t":"II - não for efetivada dentro de 30 (trinta) dias;"},{"k":"p","t":"III - o juiz julgar improcedente o pedido principal formulado pelo autor ou extinguir o processo sem resolução de mérito."},{"k":"p","t":"Parágrafo único. Se por qualquer motivo cessar a eficácia da tutela cautelar, é vedado à parte renovar o pedido, salvo sob novo fundamento."},{"k":"p","t":"Art. 310. O indeferimento da tutela cautelar não obsta a que a parte formule o pedido principal, nem influi no julgamento desse, salvo se o motivo do indeferimento for o reconhecimento de decadência ou de prescrição."}]},{"id":"s7","title":"TÍTULO III — DA TUTELA DA EVIDÊNCIA · arts. 311","tag":"","b":[{"k":"h","t":"TÍTULO III — DA TUTELA DA EVIDÊNCIA"},{"k":"p","t":"Art. 311. A tutela da evidência será concedida, independentemente da demonstração de perigo de dano ou de risco ao resultado útil do processo, quando:"},{"k":"p","t":"I - ficar caracterizado o abuso do direito de defesa ou o manifesto propósito protelatório da parte;"},{"k":"p","t":"II - as alegações de fato puderem ser comprovadas apenas documentalmente e houver tese firmada em julgamento de casos repetitivos ou em súmula vinculante;"},{"k":"p","t":"III - se tratar de pedido reipersecutório fundado em prova documental adequada do contrato de depósito, caso em que será decretada a ordem de entrega do objeto custodiado, sob cominação de multa;"},{"k":"p","t":"IV - a petição inicial for instruída com prova documental suficiente dos fatos constitutivos do direito do autor, a que o réu não oponha prova capaz de gerar dúvida razoável."},{"k":"p","t":"Parágrafo único. Nas hipóteses dos incisos II e III, o juiz poderá decidir liminarmente."}]},{"id":"s8","title":"PARTE ESPECIAL · arts. 318 a 334","tag":"","b":[{"k":"h","t":"PARTE ESPECIAL"},{"k":"h","t":"LIVRO I — DO PROCESSO DE CONHECIMENTO E DO CUMPRIMENTO DE SENTENÇA"},{"k":"h","t":"TÍTULO I — DO PROCEDIMENTO COMUM"},{"k":"h","t":"CAPÍTULO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 318. Aplica-se a todas as causas o procedimento comum, salvo disposição em contrário deste Código ou d
