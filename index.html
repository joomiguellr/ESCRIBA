ICIÁRIO · arts. 92","tag":"","b":[{"k":"h","t":"CAPÍTULO III — DO PODER JUDICIÁRIO"},{"k":"h","t":"SEÇÃO I — DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 92. São órgãos do Poder Judiciário:"},{"k":"p","t":"I - o Supremo Tribunal Federal; I-A o Conselho Nacional de Justiça; (Incluído pela Emenda Constitucional nº 45, de 2004)"},{"k":"p","t":"II - o Superior Tribunal de Justiça; II-A - o Tribunal Superior do Trabalho; (Incluído pela Emenda Constitucional nº 92, de 2016)"},{"k":"p","t":"III - os Tribunais Regionais Federais e Juízes Federais;"},{"k":"p","t":"IV - os Tribunais e Juízes do Trabalho;"},{"k":"p","t":"V - os Tribunais e Juízes Eleitorais;"},{"k":"p","t":"VI - os Tribunais e Juízes Militares;"},{"k":"p","t":"VII - os Tribunais e Juízes dos Estados e do Distrito Federal e Territórios."},{"k":"p","t":"§ 1º O Supremo Tribunal Federal, o Conselho Nacional de Justiça e os Tribunais Superiores têm sede na Capital Federal. (Incluído pela Emenda Constitucional nº 45, de 2004) (Vide ADIN 3392)"},{"k":"p","t":"§ 2º O Supremo Tribunal Federal e os Tribunais Superiores têm jurisdição em todo o território nacional. (Incluído pela Emenda Constitucional nº 45, de 2004)"}]}],"est":[{"id":"s0","title":"Disposições iniciais · arts. 239 a 250","tag":"","b":[{"k":"p","t":"Lei Estadual nº 10.261/1968 Dispõe sobre o Estatuto dos Funcionários Públicos Civis do Estado"},{"k":"h","t":"CAPÍTULO VII — DO DIREITO DE PETIÇÃO"},{"k":"p","t":"Artigo 239 - É assegurado a qualquer pessoa, física ou jurídica, independentemente de pagamento, o direito de petição contra ilegalidade ou abuso de poder e para defesa de direitos. (NR)"},{"k":"p","t":"§ 1º - Qualquer pessoa poderá reclamar sobre abuso, erro, omissão ou conduta incompatível no serviço público.(NR)"},{"k":"p","t":"§ 2º - Em nenhuma hipótese, a Administração poderá recusar-se a protocolar, encaminhar ou apreciar a petição, sob pena de responsabilidade do agente. (NR) - Artigo 239 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 240 - Ao servidor é assegurado o direito de requerer ou representar, bem como, nos termos desta lei complementar, pedir reconsideração e recorrer de decisões, no prazo de 30 (trinta) dias, salvo previsão legal específica. (NR) - Artigo 240 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"h","t":"TÍTULO VI — DOS DEVERES, DAS PROIBIÇÕES E DAS RESPONSABILIDADES"},{"k":"h","t":"CAPÍTULO I — DOS DEVERES E DAS PROIBIÇÕES"},{"k":"h","t":"SEÇÃO I — DOS DEVERES"},{"k":"p","t":"Artigo 241 - São deveres do funcionário:"},{"k":"p","t":"I - ser assíduo e pontual;"},{"k":"p","t":"II - cumprir as ordens superiores, representando quando forem manifestamente ilegais;"},{"k":"p","t":"III - desempenhar com zelo e presteza os trabalhos de que for incumbido;"},{"k":"p","t":"IV - guardar sigilo sobre os assuntos da repartição e, especialmente, sobre despachos, decisões ou providências;"},{"k":"p","t":"V - representar aos superiores sobre todas as irregularidades de que tiver conhecimento no exercício de suas funções;"},{"k":"p","t":"VI - tratar com urbanidade as pessoas; (NR) - Inciso VI com redação dada pela Lei Complementar nº 1.096, de 24/09/2009."},{"k":"p","t":"VII - residir no local onde exerce o cargo ou, onde autorizado;"},{"k":"p","t":"VIII - providenciar para que esteja sempre em ordem, no assentamento individual, a sua declaração de família;"},{"k":"p","t":"IX - zelar pela economia do material do Estado e pela conservação do que for confiado à sua guarda ou utilização;"},{"k":"p","t":"X - apresentar -se convenientemente trajado em serviço ou com uniforme determinado, quando for o caso;"},{"k":"p","t":"XI - atender prontamente, com preferência sobre qualquer outro serviço, às requisições de papéis, documentos, informações ou providências que lhe forem feitas pelas autoridades judiciárias ou administrativas, para defesa do Estado, em Juízo;"},{"k":"p","t":"XII - cooperar e manter espírito de solidariedade com os companheiros de trabalho,"},{"k":"p","t":"XIII - estar em dia com as leis, regulamentos, regimentos, instruções e ordens de serviço que digam respeito às suas funções; e"},{"k":"p","t":"XIV - proceder na vida pública e privada na forma que dignifique a função pública."},{"k":"h","t":"SEÇÃO II — DAS PROIBIÇÕES"},{"k":"p","t":"Artigo 242 - Ao funcionário é proibido:"},{"k":"p","t":"I - Revogado. - Inciso I revogado pela Lei Complementar nº 1.096, de 24/09/2009."},{"k":"p","t":"II - retirar, sem prévia permissão da autoridade competente, qualquer documento ou objeto existente na repartição;"},{"k":"p","t":"III - entreter-se, durante as horas de trabalho, em palestras, leituras ou outras atividades estranhas ao serviço;"},{"k":"p","t":"IV - deixar de comparecer ao serviço sem causa justificada;"},{"k":"p","t":"V - tratar de interesses particulares na repartição;"},{"k":"p","t":"VI - promover manifestações de apreço ou desapreço dentro da repartição, ou tornar-se solidário com elas;"},{"k":"p","t":"VII - exercer comércio entre os companheiros de serviço, promover ou subscrever listas de donativos dentro da repartição; e"},{"k":"p","t":"VIII - empregar material do serviço público em serviço particular."},{"k":"p","t":"Artigo 243 - É proibido ainda, ao funcionário:"},{"k":"p","t":"I - fazer contratos de natureza comercial e industrial com o Governo, por si, ou como representante de outrem;"},{"k":"p","t":"II - participar da gerência ou administração de empresas bancárias ou industriais, ou de sociedades comerciais, que mantenham relações comerciais ou administrativas com o Governo do Estado, sejam por este subvencionadas ou estejam diretamente relacionadas com a finalidade da repartição ou serviço em que esteja lotado;"},{"k":"p","t":"III - requerer ou promover a concessão de privilégios, garantias de juros ou outros favores semelhantes, federais, estaduais ou municipais, exceto privilégio de invenção própria;"},{"k":"p","t":"IV - exercer, mesmo fora das horas de trabalho, emprego ou função em empresas, estabelecimentos ou instituições que tenham relações com o Governo, em matéria que se relacione com a finalidade da repartição ou serviço em que esteja lotado;"},{"k":"p","t":"V - aceitar representação de Estado estrangeiro, sem autorização do Presidente da República;"},{"k":"p","t":"VI - comerciar ou ter parte em sociedades comerciais nas condições mencionadas no item II deste artigo, podendo, em qualquer caso, ser acionista, quotista ou comanditário;"},{"k":"p","t":"VII - incitar greves ou a elas aderir, ou praticar atos de sabotagem contra o serviço público;"},{"k":"p","t":"VIII - praticar a usura;"},{"k":"p","t":"IX - constituir-se procurador de partes ou servir de intermediário perante qualquer repartição pública, exceto quando se tratar de interesse de cônjuge ou parente até segundo grau;"},{"k":"p","t":"X - receber estipêndios de firmas fornecedoras ou de entidades fiscalizadas, no País, ou no estrangeiro, mesmo quando estiver em missão referente à compra de material ou fiscalização de qualquer natureza;"},{"k":"p","t":"XI - valer-se de sua qualidade de funcionário para desempenhar atividade estranha às funções ou para lograr, direta ou indiretamente, qualquer proveito; e"},{"k":"p","t":"XII - fundar sindicato de funcionários ou deles fazer parte."},{"k":"p","t":"Parágrafo único - Não está compreendida na proibição dos itens II e VI deste artigo, a participação do funcionário em sociedades em que o Estado seja acionista, bem assim na direção ou gerência de cooperativas e associações de classe, ou como seu sócio."},{"k":"p","t":"Artigo 243-A - O disposto no artigo 243, inciso IV, desta lei, não se aplica ao funcionário de órgão ou entidade concedente de estágio que atuar como professor orientador."},{"k":"p","t":"Parágrafo único - O funcionário de que trata o ‘caput’ deste artigo deverá evitar qualquer conflito de interesses e estará sujeito, inclusive, aos deveres de:"},{"k":"p","t":"1 - comunicar, ao superior hierárquico, qualquer circunstância, suspeição ou fato impeditivo de sua participação em decisão a ser tomada no âmbito da unidade administrativa;"},{"k":"p","t":"2 - abster-se de atuar nos processos ou procedimentos em que houver interesse da instituição de ensino. (NR) - Artigo 243-A acrescentado pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 244 - É vedado ao funcionário trabalhar sob as ordens imediatas de parentes, até segundo grau, salvo quando se tratar de função de confiança e livre escolha, não podendo exceder a 2 (dois) o número de auxiliares nessas condições."},{"k":"h","t":"CAPÍTULO II — DAS RESPONSABILIDADES"},{"k":"p","t":"Artigo 245 - O funcionário é responsável por todos os prejuízos que, nessa qualidade, causar à Fazenda Estadual, por dolo ou culpa, devidamente apurados."},{"k":"p","t":"Parágrafo único - Caracteriza-se especialmente a responsabilidade:"},{"k":"p","t":"I - pela sonegação de valores e objetos confiados à sua guarda ou responsabilidade, ou por não prestar contas, ou por não as tomar, na forma e no prazo estabelecidos nas leis, regulamentos, regimentos, instruções e ordens de serviço;"},{"k":"p","t":"II - pelas faltas, danos, avarias e quaisquer outros prejuízos que sofrerem os bens e os materiais sob sua guarda, ou sujeitos a seu exame ou fiscalização;"},{"k":"p","t":"III - pela falta ou inexatidão das necessárias averbações nas notas de despacho, guias e outros documentos da receita, ou que tenham com eles relação; e"},{"k":"p","t":"IV - por qualquer erro de cálculo ou redução contra a Fazenda Estadual."},{"k":"p","t":"Artigo 246 - O funcionário que adquirir materiais em desacordo com disposições legais e regulamentares, será responsabilizado pelo respectivo custo, sem prejuízo das penalidades disciplinares cabíveis, podendo-se proceder ao desconto no seu vencimento ou remuneração."},{"k":"p","t":"Artigo 247 - Nos casos de indenização à Fazenda Estadual, o funcionário será obrigado a repor, de uma só vez, a importância do prejuízo causado em virtude de alcance, desfalque, remissão ou omissão em efetuar recolhimento ou entrada nos prazos legais."},{"k":"p","t":"Artigo 248 - Fora dos casos incluídos no artigo anterior, a importância da indenização poderá ser descontada do vencimento ou remuneração não excedendo o desconto à 10ª (décima) parte do valor destes."},{"k":"p","t":"Parágrafo único - No caso do item IV do parágrafo único do art. 245, não tendo havido má-fé, será aplicada a pena de repreensão e, na reincidência, a de suspensão."},{"k":"p","t":"Artigo 249 - Será igualmente responsabilizado o funcionário que, fora dos casos expressamente previstos nas leis, regulamentos ou regimentos, cometer a pessoas estranhas às repartições, o desempenho de encargos que lhe competirem ou aos seus subordinados."},{"k":"p","t":"Artigo 250 - A responsabilidade administrativa não exime o funcionário da responsabilidade civil ou criminal que no caso couber, nem o pagamento da indenização a que ficar obrigado, na forma dos arts. 247 e 248, o exame da pena disciplinar em que incorrer."},{"k":"p","t":"§ 1º - A responsabilidade administrativa é independente da civil e da criminal.(NR)"},{"k":"p","t":"§ 2º - Será reintegrado ao serviço público, no cargo que ocupava e com todos os direitos e vantagens devidas, o servidor absolvido pela Justiça, mediante simples comprovação do trânsito em julgado de decisão que negue a existência de sua autoria ou do fato que deu origem à sua demissão.(NR)"},{"k":"p","t":"§ 3º - O processo administrativo só poderá ser sobrestado para aguardar decisão judicial por despacho motivado da autoridade competente para aplicar a pena.(NR) - §§ 1º ao 3º acrescentados pela Lei Complementar n° 942, de 06/06/2003."}]},{"id":"s1","title":"TÍTULO VII — DAS PENALIDADES, DA EXTINÇÃO DA PUNIBILIDADE, DAS PROVIDÊNCIAS PREL · arts. 251 a 263","tag":"","b":[{"k":"h","t":"TÍTULO VII — DAS PENALIDADES, DA EXTINÇÃO DA PUNIBILIDADE, DAS PROVIDÊNCIAS PRELIMINARES, DAS PRÁTICAS AUTOCOMPOSITIVAS, DO TERMO DE AJUSTAMENTO DE CONDUTA E DA SUSPENSÃO CONDICIONAL DA SINDICÂNCIA. (NR)"},{"k":"p","t":"- Título VII com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"h","t":"CAPÍTULO I — DAS PENALIDADES E DE SUA APLICAÇÃO"},{"k":"p","t":"Artigo 251 - São penas disciplinares:"},{"k":"p","t":"I - repreensão;"},{"k":"p","t":"II - suspensão;"},{"k":"p","t":"III - multa;"},{"k":"p","t":"IV - demissão;"},{"k":"p","t":"V - demissão a bem do serviço público; e"},{"k":"p","t":"VI - cassação de aposentadoria ou disponibilidade"},{"k":"p","t":"Artigo 252 - Na aplicação das penas disciplinares serão consideradas a natureza e a gravidade da infração e os danos que dela provierem para o serviço público."},{"k":"p","t":"Artigo 253 - A pena de repreensão será aplicada por escrito, nos casos de indisciplina ou falta de cumprimento dos deveres."},{"k":"p","t":"Artigo 254 - A pena de suspensão, que não excederá de 90 (noventa) dias, será aplicada em caso de falta grave ou de reincidência."},{"k":"p","t":"§ 1º - O funcionário suspenso perderá todas as vantagens e direitos decorrentes do exercício do cargo."},{"k":"p","t":"§ 2º - A autoridade que aplicar a pena de suspensão poderá converter essa penalidade em multa, na base de 50% (cinqüenta por cento) por dia de vencimento ou remuneração, sendo o funcionário, nesse caso, obrigado a permanecer em serviço."},{"k":"p","t":"Artigo 255 - A pena de multa será aplicada na forma e nos casos expressamente previstos em lei ou regulamento."},{"k":"p","t":"Artigo 256 - Será aplicada a pena de demissão nos casos de:"},{"k":"p","t":"I - Revogado; - Inciso I revogado pela Lei Complementar 1.361, de 21/10/2021, com efeitos a partir de 01/11/2021."},{"k":"p","t":"II - procedimento irregular, de natureza grave;"},{"k":"p","t":"III - ineficiência no serviço;"},{"k":"p","t":"IV - aplicação indevida de dinheiros públicos, e"},{"k":"p","t":"V - inassiduidade. (NR) - Inciso V com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"§ 1º - Considerar-se-á inassiduidade a ausência ao serviço, sem causa justificável, por mais de 15 (quinze) dias consecutivos, ou por mais de 20 (vinte) dias úteis intercalados, durante 1 (um) ano. (NR) - § 1º com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"§ 2º - A pena de demissão por ineficiência no serviço, só será aplicada quando verificada a impossibilidade de readaptação."},{"k":"p","t":"§ 3º - Para configuração do ilícito administrativo de inassiduidade em razão da ausência ao serviço por mais de 15 (quinze) dias consecutivos, observar-se-á o seguinte:"},{"k":"p","t":"1 - serão computados os sábados, os domingos, os feriados e os pontos facultativos subsequentes à primeira falta;"},{"k":"p","t":"2 - se o funcionário cumprir a jornada de trabalho sob regime de plantão, além dos sábados, dos domingos, dos feriados e dos pontos facultativos, serão computados os dias de folga subsequentes aos plantões a que tenha faltado. (NR) - § 3º acrescentado pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 257 - Será aplicada a pena de demissão a bem do serviço público ao funcionário que:"},{"k":"p","t":"I - for convencido de incontinência pública e escandalosa e de vício de jogos proibidos;"},{"k":"p","t":"II - praticar ato definido como crime contra a administração pública, a fé pública e a Fazenda Estadual, ou previsto nas leis relativas à segurança e à defesa nacional; (NR) - Inciso II com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"III - revelar segredos de que tenha conhecimento em razão do cargo, desde que o faça dolosamente e com prejuízo para o Estado ou particulares;"},{"k":"p","t":"IV - praticar insubordinação grave;"},{"k":"p","t":"V - praticar, em serviço, ofensas físicas contra funcionários ou particulares, salvo se em legítima defesa;"},{"k":"p","t":"VI - lesar o patrimônio ou os cofres públicos;"},{"k":"p","t":"VII - receber ou solicitar propinas, comissões, presentes ou vantagens de qualquer espécie, diretamente ou por intermédio de outrem, ainda que fora de suas funções mas em razão delas;"},{"k":"p","t":"VIII - pedir, por empréstimo, dinheiro ou quaisquer valores a pessoas que tratem de interesses ou o tenham na repartição, ou estejam sujeitos à sua fiscalização;"},{"k":"p","t":"IX - exercer advocacia administrativa; e"},{"k":"p","t":"X - apresentar com dolo declaração falsa em matéria de salário-família, sem prejuízo da responsabilidade civil e de procedimento criminal, que no caso couber."},{"k":"p","t":"XI - praticar ato definido como crime hediondo, tortura, tráfico ilícito de entorpecentes e drogas afins e terrorismo; (NR)"},{"k":"p","t":"XII - praticar ato definido como crime contra o Sistema Financeiro, ou de lavagem ou ocultação de bens, direitos ou valores; (NR)"},{"k":"p","t":"XIII - praticar ato definido em lei como de improbidade.(NR) - Incisos XI ao XIII acrescentados pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 258 - O ato que demitir o funcionário mencionará sempre a disposição legal em que se fundamenta."},{"k":"p","t":"Artigo 259 - Será aplicada a pena de cassação de aposentadoria ou disponibilidade, se ficar provado que o inativo:"},{"k":"p","t":"I - praticou, quando em atividade, falta grave para a qual é cominada nesta lei a pena de demissão ou de demissão a bem do serviço público;"},{"k":"p","t":"II - aceitou ilegalmente cargo ou função pública;"},{"k":"p","t":"III - aceitou representação de Estado estrangeiro sem prévia autorização do Presidente da República; e"},{"k":"p","t":"IV - praticou a usura em qualquer de suas formas."},{"k":"p","t":"Artigo 260 - Para aplicação das penalidades previstas no artigo 251, são competentes: (NR)"},{"k":"p","t":"I - o Governador; (NR)"},{"k":"p","t":"II - os Secretários de Estado, o Procurador Geral do Estado e os Superintendentes de Autarquia; (NR)"},{"k":"p","t":"III - os Chefes de Gabinete, até a de suspensão; (NR)"},{"k":"p","t":"IV - os Coordenadores, até a de suspensão limitada a 60 (sessenta) dias; e (NR)"},{"k":"p","t":"V - os Diretores de Departamento e Divisão, até a de suspensão limitada a 30 (trinta) dias. (NR)"},{"k":"p","t":"Parágrafo único - Havendo mais de um infrator e diversidade de sanções, a competência será da autoridade responsável pela imposição da penalidade mais grave. (NR) - Artigo 260 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 261 - Extingue-se a punibilidade pela prescrição: (NR)"},{"k":"p","t":"I - da falta sujeita à pena de repreensão, suspensão ou multa, em 2 (dois) anos; (NR)"},{"k":"p","t":"II - da falta sujeita à pena de demissão, de demissão a bem do serviço público e de cassação da aposentadoria ou disponibilidade, em 5 (cinco) anos; (NR)"},{"k":"p","t":"III - da falta prevista em lei como infração penal, no prazo de prescrição em abstrato da pena criminal, se for superior a 5 (cinco) anos. (NR)"},{"k":"p","t":"§ 1º - A prescrição começa a correr: (NR)"},{"k":"p","t":"1 - do dia em que a falta for cometida; (NR)"},{"k":"p","t":"2 - do dia em que tenha cessado a continuação ou a permanência, nas faltas continuadas ou permanentes. (NR)"},{"k":"p","t":"§ 2º - Interrompem a prescrição a portaria que instaura sindicância e a que instaura processo administrativo.(NR)"},{"k":"p","t":"§ 3º - O lapso prescricional corresponde: (NR)"},{"k":"p","t":"1 - na hipótese de desclassificação da infração, ao da pena efetivamente aplicada; (NR)"},{"k":"p","t":"2 - na hipótese de mitigação ou atenuação, ao da pena em tese cabível. (NR)"},{"k":"p","t":"§ 4º - A prescrição não corre: (NR)"},{"k":"p","t":"1 - enquanto sobrestado o processo administrativo para aguardar decisão judicial, na forma do § 3º do artigo 250; (NR)"},{"k":"p","t":"2 - enquanto insubsistente o vínculo funcional que venha a ser restabelecido. (NR)"},{"k":"p","t":"3 - durante a suspensão da sindicância, nos termos do artigo 267-N desta lei;"},{"k":"p","t":"4 - no curso das práticas autocompositivas;"},{"k":"p","t":"5 - durante o prazo estabelecido para o cumprimento do Termo de Ajustamento de Conduta. (NR) - itens 3 a 5 acrescentados pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"§ 5º - Extinta a punibilidade pela prescrição, a autoridade julgadora determinará o registro do fato nos assentamentos individuais do servidor. (NR)"},{"k":"p","t":"§ 6º - A decisão que reconhecer a existência de prescrição deverá desde logo determinar, quando for o caso, as providências necessárias à apuração da responsabilidade pela sua ocorrência. (NR) - Artigo 261 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 262 - O funcionário que, sem justa causa, deixar de atender a qualquer exigência para cujo cumprimento seja marcado prazo certo, terá suspenso o pagamento de seu vencimento ou remuneração até que satisfaça essa exigência."},{"k":"p","t":"Parágrafo único - Aplica-se aos aposentados ou em disponibilidade o disposto neste artigo."},{"k":"p","t":"Artigo 263 - Deverão constar do assentamento individual do funcionário todas as penas que lhe forem impostas."}]},{"id":"s2","title":"CAPÍTULO II — DAS PROVIDÊNCIAS PRELIMINARES (NR) · arts. 264 a 267-P","tag":"","b":[{"k":"h","t":"CAPÍTULO II — DAS PROVIDÊNCIAS PRELIMINARES (NR)"},{"k":"p","t":"- Capítulo II com redação dada pela Lei Complementar n° 942, de 06/06/2003"},{"k":"p","t":"Artigo 264 - A autoridade que, por qualquer meio, tiver conhecimento de irregularidade praticada por funcionário adotará providências visando à sua imediata apuração, sem prejuízo das medidas urgentes que o interesse da Administração exigir, podendo submeter o caso às práticas autocompositivas ou propor celebração de termo de ajustamento de conduta. (NR) - Artigo 264 com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Parágrafo único - A autoridade poderá, desde logo, submeter o caso às práticas autocompositivas, especialmente nas situações em que evidenciada a ocorrência de conflitos interpessoais, objetivando sempre a melhor solução para resguardar o interesse público. (NR) - Parágrafo único acrescentado pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 265 - A autoridade realizará apuração preliminar, de natureza simplesmente investigativa, quando a infração não estiver suficientemente caracterizada ou definida autoria. (NR)"},{"k":"p","t":"§ 1º - A apuração preliminar deverá ser concluída no prazo de 30 (trinta) dias. (NR)"},{"k":"p","t":"§ 2º - Não concluída no prazo a apuração, a autoridade deverá imediatamente encaminhar ao Chefe de Gabinete relatório das diligências realizadas e definir o tempo necessário para o término dos trabalhos. (NR)"},{"k":"p","t":"§ 3º - Ao concluir a apuração preliminar, a autoridade deverá opinar fundamentadamente pelo arquivamento ou pela instauração de sindicância ou de processo administrativo. (NR) - Artigo 265 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 266 - Determinada a instauração de sindicância ou processo administrativo, ou no seu curso, havendo conveniência para a instrução ou para o serviço, poderá o Chefe de Gabinete, por despacho fundamentado, ordenar as seguintes providências: (NR)"},{"k":"p","t":"I - afastamento preventivo do servidor, quando o recomendar a moralidade administrativa ou a apuração do fato, sem prejuízo de vencimentos ou vantagens, até 180 (cento e oitenta) dias, prorrogáveis uma única vez por igual período; (NR)"},{"k":"p","t":"II - designação do servidor acusado para o exercício de atividades exclusivamente burocráticas até decisão final do procedimento; (NR)"},{"k":"p","t":"III - recolhimento de carteira funcional, distintivo, armas e algemas; (NR)"},{"k":"p","t":"IV - proibição do porte de armas; (NR)"},{"k":"p","t":"V - comparecimento obrigatório, em periodicidade a ser estabelecida, para tomar ciência dos atos do procedimento. (NR)"},{"k":"p","t":"§ 1º - A autoridade que determinar a instauração ou presidir sindicância ou processo administrativo poderá representar ao Chefe de Gabinete para propor a aplicação das medidas previstas neste artigo, bem como sua cessação ou alteração. (NR)"},{"k":"p","t":"§ 2º - O Chefe de Gabinete poderá, a qualquer momento, por despacho fundamentado, fazer cessar ou alterar as medidas previstas neste artigo. (NR) - Artigo 266 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 267 - O período de afastamento preventivo computa-se como de efetivo exercício, não sendo descontado da pena de suspensão eventualmente aplicada. (NR) - Artigo 267 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"h","t":"CAPÍTULO III — DAS PRÁTICAS AUTOCOMPOSITIVAS, DO TERMO DE AJUSTAMENTO DE CONDUTA E DA SUSPENSÃO CONDICIONAL DA SINDICÂNCIA"},{"k":"p","t":"- Capítulo III acrescentado pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 267-A - A autoridade competente para determinar a apuração de irregularidade e a instauração de sindicância ou processo administrativo e o Procurador do Estado responsável por sua condução ficam autorizados, mediante despacho fundamentado, a propor as práticas autocompositivas, a celebração de termo de ajustamento de conduta, bem como a suspensão condicional da sindicância, nos termos desta lei. (NR)"},{"k":"p","t":"Artigo 267-B - As práticas autocompositivas, a serem regulamentadas por decreto, serão orientadas pelos princípios da voluntariedade, corresponsabilidade, reparação do dano, confidencialidade, informalidade, consensualidade e celeridade, observado o seguinte:"},{"k":"p","t":"I - as sessões serão conduzidas por facilitador de justiça restaurativa ou mediador devidamente capacitado e realizadas em ambiente adequado que resguarde a privacidade dos participantes e a confidencialidade de suas manifestações;"},{"k":"p","t":"II - a participação do funcionário será voluntária e a eventual recusa não poderá ser considerada em seu desfavor."},{"k":"p","t":"§ 1 º - São práticas autocompositivas a mediação, a conciliação, os processos circulares e outras técnicas de justiça restaurativa."},{"k":"p","t":"§ 2º - Para aplicação das práticas autocompositivas, é necessário que as partes reconheçam os fatos essenciais, sem que isso implique admissão de culpa em eventual sindicância ou processo administrativo."},{"k":"p","t":"§ 3º - O conteúdo das sessões restaurativas é sigiloso, não podendo ser utilizado como prova em processo administrativo ou judicial. (NR)"},{"k":"p","t":"Artigo 267-C - A autoridade competente para determinar a apuração de irregularidade e a instauração de sindicância ou processo administrativo e o Procurador do Estado responsável por sua condução poderão, em qualquer fase, encaminhar o caso para as práticas autocompositivas, mediante despacho fundamentado."},{"k":"p","t":"§ 1º - O encaminhamento às práticas autocompositivas poderá ocorrer de forma alternativa ou concorrente à sindicância ou ao processo administrativo."},{"k":"p","t":"§ 2º - Se o encaminhamento às práticas autocompositivas se der de forma alternativa ao procedimento disciplinar, o despacho fundamentado a que se refere este artigo suspenderá o prazo prescricional, enquanto realizadas. (NR)"},{"k":"p","t":"Artigo 267-D - O acordo celebrado na sessão autocompositiva será homologado pela autoridade administrativa competente para determinar a instauração da sindicância ou pelo Procurador do Estado responsável por sua condução."},{"k":"p","t":"§ 1º - O cumprimento do acordo celebrado na sessão autocompositiva extingue a punibilidade nos casos em que, cumulativamente: 1. a conduta do funcionário não gerou prejuízo ao Erário ou este foi integralmente reparado; 2. forem cabíveis, em tese, as penas de repreensão, suspensão e multa."},{"k":"p","t":"§ 2º - Nos casos em que o cumprimento do acordo restaurativo não ensejar a extinção da punibilidade, tal acordo deverá ser considerado pela autoridade competente para mitigação da sanção, objetivando sempre a melhor solução para o serviço público."},{"k":"p","t":"§ 3º - A extinção da punibilidade, nos termos do § 1º deste artigo, será declarada pelo Chefe de Gabinete, que poderá delegar esta atribuição. (NR)"},{"k":"p","t":"Artigo 267-E - O Termo de Ajustamento de Conduta é o instrumento mediante o qual o funcionário assume a responsabilidade pela irregularidade a que deu causa e compromete-se a ajustar sua conduta, bem como a observar os deveres e proibições previstos nas leis e regulamentos que regem suas atividades e reparar o dano, se houver."},{"k":"p","t":"Parágrafo único - O Termo de Ajustamento de Conduta poderá ser adotado nos casos de extravio ou dano a bem público que não tenham decorrido de conduta dolosa praticada pelo funcionário, e terá como requisito obrigatório o integral ressarcimento do prejuízo. (NR)"},{"k":"p","t":"Artigo 267-F - A celebração do Termo de Ajustamento de Conduta poderá ser proposta pela autoridade competente para a instauração da apuração preliminar quando atendidos os seguintes requisitos relativos ao funcionário interessado:"},{"k":"p","t":"I - não ter agido com dolo ou má-fé;"},{"k":"p","t":"II - ter mais de 5 (cinco) anos de efetivo exercício no cargo ou função;"},{"k":"p","t":"III - não ter sofrido punição de natureza disciplinar nos últimos 5 (cinco) anos;"},{"k":"p","t":"IV - não ter sindicância ou processo disciplinar em curso;"},{"k":"p","t":"V - não ter celebrado Termo de Ajustamento de Conduta nos últimos 3 (três) anos."},{"k":"p","t":"Parágrafo único - Exclusivamente para os fins do disposto no ‘caput’ deste artigo, o Termo de Ajustamento de Conduta será registrado nos assentos funcionais do funcionário. (NR)"},{"k":"p","t":"Artigo 267-G - O Termo de Ajustamento de Conduta será homologado pelo Chefe de Gabinete, mediante prévia manifestação da Consultoria Jurídica da Procuradoria Geral do Estado acerca dos termos e condições estabelecidos."},{"k":"p","t":"Parágrafo único - O Chefe de Gabinete poderá delegar a atribuição prevista neste artigo. (NR)"},{"k":"p","t":"Artigo 267-H - A proposta de celebração do termo de ajustamento de conduta poderá ser feita de ofício ou a pedido do funcionário interessado."},{"k":"p","t":"Parágrafo único - O pedido de celebração de termo de ajustamento de conduta feito pelo funcionário interessado poderá ser indeferido com base em juízo de admissibilidade que conclua pelo não cabimento da medida em relação à irregularidade a ser apurada. (NR)"},{"k":"p","t":"Artigo 267-I - O Termo de Ajustamento de Conduta deverá conter:"},{"k":"p","t":"I - a qualificação do funcionário envolvido;"},{"k":"p","t":"II - a descrição precisa do fato a que se refere;"},{"k":"p","t":"III - as obrigações assumidas;"},{"k":"p","t":"IV - o prazo e a forma de cumprimento das obrigações;"},{"k":"p","t":"V - a forma de fiscalização das obrigações assumidas."},{"k":"p","t":"Parágrafo único - O prazo de cumprimento do Termo de Ajustamento de Conduta não poderá ser inferior a 1 (um), nem superior a 2 (dois) anos. (NR)"},{"k":"p","t":"Artigo 267-J - O cumprimento das condições do Termo de Ajustamento de Conduta implicará a extinção da punibilidade, que será declarada pelo Chefe de Gabinete."},{"k":"p","t":"Parágrafo único - O Chefe de Gabinete poderá delegar a atribuição prevista neste artigo. (NR)"},{"k":"p","t":"Artigo 267-L - No caso de descumprimento do termo de ajustamento de conduta, ou cometimento de nova falta funcional durante o prazo de cumprimento do ajuste, a autoridade encarregada da fiscalização providenciará, se necessário, a conclusão da apuração preliminar e a submeterá à autoridade competente para deliberação. (NR)"},{"k":"p","t":"Artigo 267-M - Não corre a prescrição durante o prazo fixado para o cumprimento do Termo de Ajustamento de Conduta. (NR)"},{"k":"p","t":"Artigo 267-N - Após a edição da portaria de instauração da sindicância, o Procurador do Estado que a presidir poderá propor sua suspensão pelo prazo de 1 (um) a 2 (dois) anos, desde que o funcionário tenha mais de 5 (cinco) anos de exercício no cargo ou função e não registre punição de natureza disciplinar nos últimos 5 (cinco) anos."},{"k":"p","t":"§ 1º - O Procurador do Estado especificará as condições da suspensão, em especial, a apresentação de relatórios trimestrais de atividades e a frequência regular sem faltas injustificadas."},{"k":"p","t":"§ 2º - A suspensão será revogada se o beneficiário vier a ser processado por outra falta disciplinar ou se descumprir as condições estabelecidas no § 1º deste artigo, prosseguindo, nestes casos, o procedimento disciplinar cabível."},{"k":"p","t":"§ 3º - Expirado o prazo da suspensão e tendo sido cumpridas suas condições, o Procurador do Estado encaminhará os autos à Secretaria de Estado ou Autarquia para a declaração da extinção da punibilidade."},{"k":"p","t":"§ 4º - Não será concedido novo benefício durante o dobro do prazo da anterior suspensão, contado da declaração de extinção da punibilidade, na forma do § 3º deste artigo."},{"k":"p","t":"§ 5º - Durante o período da suspensão não correrá prazo prescricional, ficando vedado ao beneficiário ocupar cargo em comissão ou exercer função de confiança. (NR)"},{"k":"p","t":"Artigo 267-O - Alternativamente à suspensão condicional da sindicância prevista no artigo 267-N desta lei, a sindicância também poderá ser suspensa caso os envolvidos, voluntariamente, concordem com o encaminhamento para as práticas autocompositivas."},{"k":"p","t":"Parágrafo único - A sindicância ficará suspensa até o cumprimento do acordo restaurativo, decorrente das práticas autocompositivas, respeitado o prazo máximo de 2 (dois) anos. (NR)"},{"k":"p","t":"Artigo 267-P - As Secretarias de Estado, a Procuradoria Geral do Estado, a Controladoria Geral do Estado e as Autarquias poderão estabelecer condições para a suspensão da sindicância, observadas as especificidades de sua estrutura ou de sua atividade. (NR)"}]},{"id":"s3","title":"TÍTULO VIII — DO PROCEDIMENTO DISCIPLINAR (NR) · arts. 268 a 307","tag":"","b":[{"k":"h","t":"TÍTULO VIII — DO PROCEDIMENTO DISCIPLINAR (NR)"},{"k":"h","t":"CAPÍTULO I — DAS DISPOSIÇÕES GERAIS (NR)"},{"k":"p","t":"- Título VIII e Capítulo I com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 268 - A apuração das infrações será feita mediante sindicância ou processo administrativo, assegurados o contraditório e a ampla defesa. (NR) - Artigo 268 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 269 - Será instaurada sindicância quando a falta disciplinar, por sua natureza, possa determinar as penas de repreensão, suspensão ou multa. (NR) - Artigo 269 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Parágrafo único - Não será instaurada sindicância em face de funcionário já exonerado, aposentado, anteriormente demitido ou que, por qualquer razão, tenha deixado de manter vínculo com a Administração Pública. (NR) - Parágrafo único acrescentado pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 270 - Será obrigatório o processo administrativo quando a falta disciplinar, por sua natureza, possa determinar as penas de demissão, de demissão a bem do serviço público e de cassação de aposentadoria ou disponibilidade. (NR) - Artigo 270 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 271 - Os procedimentos disciplinares punitivos serão realizados pela Procuradoria Geral do Estado e presididos por Procurador do Estado confirmado na carreira. (NR) - Artigo 271 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"h","t":"CAPÍTULO II — DA SINDICÂNCIA"},{"k":"p","t":"Artigo 272 - São competentes para determinar a instauração de sindicância as autoridades enumeradas no artigo 260. (NR)"},{"k":"p","t":"§1º - Instaurada a sindicância, o Procurador do Estado que a presidir comunicará o fato ao órgão setorial de pessoal. (NR) - Parágrafo único renumerado como §1º pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"§ 2º - As Secretarias de Estado, a Procuradoria Geral do Estado, a Controladoria Geral do Estado e as Autarquias disciplinarão as condições de suspensão da sindicância, observados os requisitos mínimos desta lei e as respectivas peculiaridades. (NR) - §2º acrescentado pela Lei Complementar nº 1.361, de 21/10/2021. - Artigo 272 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 273 - Aplicam-se à sindicância as regras previstas nesta lei complementar para o processo administrativo, com as seguintes modificações: (NR)"},{"k":"p","t":"I - a autoridade sindicante e cada acusado poderão arrolar até 3 (três) testemunhas; (NR)"},{"k":"p","t":"II - a sindicância deverá estar concluída no prazo de 60 (sessenta) dias; (NR)"},{"k":"p","t":"III - com o relatório, a sindicância será enviada à autoridade competente para a decisão. (NR) - Artigo 273 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"h","t":"CAPÍTULO III — DO PROCESSO ADMINISTRATIVO (NR)"},{"k":"p","t":"- Capítulo III com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 274 - São competentes para determinar a instauração de processo administrativo as autoridades enumeradas no artigo 260, até o inciso IV, inclusive. (NR) - Artigo 274 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 275 - Não poderá ser encarregado da apuração, nem atuar como secretário, amigo íntimo ou inimigo, parente consanguíneo ou afim, em linha reta ou colateral, até o terceiro grau inclusive, cônjuge, companheiro ou qualquer integrante do núcleo familiar do denunciante ou do acusado, bem assim o subordinado deste. (NR) - Artigo 275 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 276 - A autoridade ou o funcionário designado deverão comunicar, desde logo, à autoridade competente, o impedimento que houver. (NR) - Artigo 276 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 277 - O processo administrativo deverá ser instaurado por portaria, no prazo improrrogável de 8 (oito) dias do recebimento da determinação, e concluído no de 90 (noventa) dias da citação do acusado. (NR)"},{"k":"p","t":"§ 1º - Da portaria deverão constar o nome e a identificação do acusado, a infração que lhe é atribuída, com descrição sucinta dos fatos, a indicação das normas infringidas e a penalidade mais elevada em tese cabível. (NR)"},{"k":"p","t":"§ 2º - Vencido o prazo, caso não concluído o processo, o Procurador do Estado que o presidir deverá imediatamente encaminhar ao seu superior hierárquico relatório indicando as providências faltantes e o tempo necessário para término dos trabalhos. (NR)"},{"k":"p","t":"§ 3º - O superior hierárquico dará ciência dos fatos a que se refere o parágrafo anterior e das providências que houver adotado à autoridade que determinou a instauração do processo. (NR) - Artigo 277 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 278 - Autuada a portaria e demais peças preexistentes, designará o presidente dia e hora para audiência de interrogatório, determinando a citação do acusado e a notificação do denunciante, se houver. (NR)"},{"k":"p","t":"§ 1º - O mandado de citação deverá conter: (NR)"},{"k":"p","t":"1 - cópia da portaria; (NR)"},{"k":"p","t":"2 - data, hora e local do interrogatório, que poderá ser acompanhado pelo advogado do acusado; (NR)"},{"k":"p","t":"3 - data, hora e local da oitiva do denunciante, se houver, que deverá ser acompanhada pelo advogado do acusado; (NR)"},{"k":"p","t":"4 - esclarecimento de que o acusado será defendido por advogado dativo, caso não constitua advogado próprio; (NR)"},{"k":"p","t":"5 - informação de que o acusado poderá arrolar testemunhas e requerer provas, no prazo de 3 (três) dias após a data designada para seu interrogatório; (NR)"},{"k":"p","t":"6 - advertência de que o processo será extinto se o acusado pedir exoneração até o interrogatório, quando se tratar exclusivamente de inassiduidade. (NR) - Item 6 com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"§ 2º - A citação do acusado será feita pessoalmente, no mínimo 2 (dois) dias antes do interrogatório, por intermédio do respectivo superior hierárquico, ou diretamente, onde possa ser encontrado. (NR)"},{"k":"p","t":"§ 3º - Não sendo encontrado em seu local de trabalho ou no endereço constante de seu assentamento individual, furtando-se o acusado à citação ou ignorando-se seu paradeiro, a citação far-se-á por edital, publicado uma vez no Diário Oficial do Estado, no mínimo 10 (dez) dias antes do interrogatório. (NR) - Artigo 278 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 279 - Havendo denunciante, este deverá prestar declarações, no interregno entre a data da citação e a fixada para o interrogatório do acusado, sendo notificado para tal fim. (NR)"},{"k":"p","t":"§ 1º - A oitiva do denunciante deverá ser acompanhada pelo advogado do acusado, próprio ou dativo. (NR)"},{"k":"p","t":"§ 2º - O acusado não assistirá à inquirição do denunciante; antes porém de ser interrogado, poderá ter ciência das declarações que aquele houver prestado. (NR) - Artigo 279 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 280 - Não comparecendo o acusado, será, por despacho, decretada sua revelia, prosseguindo-se nos demais atos e termos do processo. (NR) - Artigo 280 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 281 - Ao acusado revel será nomeado advogado dativo. (NR) - Artigo 281 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 282 - O acusado poderá constituir advogado que o representará em todos os atos e termos do processo. (NR)"},{"k":"p","t":"§ 1º - É faculdade do acusado tomar ciência ou assistir aos atos e termos do processo, não sendo obrigatória qualquer notificação. (NR)"},{"k":"p","t":"§ 2º - O advogado será intimado por publicação no Diário Oficial do Estado, de que conste seu nome e número de inscrição na Ordem dos Advogados do Brasil, bem como os dados necessários à identificação do procedimento. (NR)"},{"k":"p","t":"§ 3º - Não tendo o acusado recursos financeiros ou negando-se a constituir advogado, o presidente nomeará advogado dativo. (NR)"},{"k":"p","t":"§ 4º — O acusado poderá, a qualquer tempo, constituir advogado para prosseguir na sua defesa. (NR) - Artigo 282 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 283 - Comparecendo ou não o acusado ao interrogatório, inicia-se o prazo de 3 (três) dias para requerer a produção de provas, ou apresentá-las. (NR)"},{"k":"p","t":"§ 1º - O presidente e cada acusado poderão arrolar até 5 (cinco) testemunhas. (NR)"},{"k":"p","t":"§ 2º - A prova de antecedentes do acusado será feita exclusivamente por documentos, até as alegações finais. (NR)"},{"k":"p","t":"§ 3º - Até a data do interrogatório,será designada a audiência de instrução. (NR) - Artigo 283 com redação dada pela Lei Complementar n° 942, de 06/06/2003"},{"k":"p","t":"Artigo 284 - Na audiência de instrução, serão ouvidas, pela ordem, as testemunhas arroladas pelo presidente e pelo acusado. (NR)"},{"k":"p","t":"Parágrafo único - Tratando-se de servidor público, seu comparecimento poderá ser solicitado ao respectivo superior imediato com as indicações necessárias. (NR) - Artigo 284 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 285 - A testemunha não poderá eximir-se de depor, salvo se for ascendente, descendente, cônjuge, ainda que legalmente separado, companheiro, irmão, sogro e cunhado, pai, mãe ou filho adotivo do acusado, exceto quando não for possível, por outro modo, obter-se ou integrar-se a prova do fato e de suas circunstâncias. (NR)"},{"k":"p","t":"§ 1º - Se o parentesco das pessoas referidas for com o denunciante, ficam elas proibidas de depor, observada a exceção deste artigo.(NR)"},{"k":"p","t":"§ 2º - Ao servidor que se recusar a depor, sem justa causa, será pela autoridade competente adotada a providência a que se refere o artigo 262, mediante comunicação do presidente. (NR)"},{"k":"p","t":"§ 3º - O servidor que tiver de depor como testemunha fora da sede de seu exercício, terá direito a transporte e diárias na forma da legislação em vigor, podendo ainda expedir-se precatória para esse efeito à autoridade do domicílio do depoente. (NR)"},{"k":"p","t":"§ 4º - São proibidas de depor as pessoas que, em razão de função, ministério, ofício ou profissão, devam guardar segredo, salvo se, desobrigadas pela parte interessada, quiserem dar o seu testemunho. (NR) - Artigo 285 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 286 - A testemunha que morar em comarca diversa poderá ser inquirida pela autoridade do lugar de sua residência, expedindo-se, para esse fim, carta precatória, com prazo razoável, intimada a defesa. (NR)"},{"k":"p","t":"§ 1º - Deverá constar da precatória a síntese da imputação e os esclarecimentos pretendidos, bem como a advertência sobre a necessidade da presença de advogado. (NR)"},{"k":"p","t":"§ 2º - A expedição da precatória não suspenderá a instrução do procedimento. (NR)"},{"k":"p","t":"§ 3º - Findo o prazo marcado, o procedimento poderá prosseguir até final decisão; a todo tempo, a precatória, uma vez devolvida, será juntada aos autos. (NR) - Artigo 286 com redação dada pela Lei Complementar n° 942, de 06/06/2003"},{"k":"p","t":"Artigo 287 - As testemunhas arroladas pelo acusado comparecerão à audiência designada independente de notificação. (NR)"},{"k":"p","t":"§ 1º - Deverá ser notificada a testemunha cujo depoimento for relevante e que não comparecer espontaneamente. (NR)"},{"k":"p","t":"§ 2º - Se a testemunha não for localizada, a defesa poderá substituí-la, se quiser, levando na mesma data designada para a audiência outra testemunha, independente de notificação. (NR) - Artigo 287 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 288 - Em qualquer fase do processo, poderá o presidente, de ofício ou a requerimento da defesa, ordenar diligências que entenda convenientes. (NR)"},{"k":"p","t":"§ 1º - As informações necessárias à instrução do processo serão solicitadas diretamente, sem observância de vinculação hierárquica, mediante ofício, do qual cópia será juntada aos autos. (NR)"},{"k":"p","t":"§ 2º - Sendo necessário o concurso de técnicos ou peritos oficiais, o presidente os requisitará, observados os impedimentos do artigo 275. (NR) - Artigo 288 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 289 - Durante a instrução, os autos do procedimento administrativo permanecerão na repartição competente. (NR)"},{"k":"p","t":"§ 1º - Será concedida vista dos autos ao acusado, mediante simples solicitação, sempre que não prejudicar o curso do procedimento. (NR)"},{"k":"p","t":"§ 2º - A concessão de vista será obrigatória, no prazo para manifestação do acusado ou para apresentação de recursos, mediante publicação no Diário Oficial do Estado. (NR)"},{"k":"p","t":"§ 3º - Não corre o prazo senão depois da publicação a que se refere o parágrafo anterior e desde que os autos estejam efetivamente disponíveis para vista. (NR)"},{"k":"p","t":"§ 4º - Ao advogado é assegurado o direito de retirar os autos da repartição, mediante recibo, durante o prazo para manifestação de seu representado, salvo na hipótese de prazo comum, de processo sob regime de segredo de justiça ou quando existirem nos autos documentos originais de difícil restauração ou ocorrer circunstância relevante que justifique a permanência dos autos na repartição, reconhecida pela autoridade em despacho motivado. (NR) - Artigo 289 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 290 - Somente poderão ser indeferidos pelo presidente, mediante decisão fundamentada, os requerimentos de nenhum interesse para o esclarecimento do fato, bem como as provas ilícitas, impertinentes, desnecessárias ou protelatórias. (NR) - Artigo 290 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 291 - Quando, no curso do procedimento, surgirem fatos novos imputáveis ao acusado, poderá ser promovida a instauração de novo procedimento para sua apuração, ou, caso conveniente, aditada a portaria, reabrindo-se oportunidade de defesa. (NR) - Artigo 291 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 292 - Encerrada a fase probatória, dar-se-á vista dos autos à defesa, que poderá apresentar alegações finais, no prazo de 7 (sete) dias. (NR)"},{"k":"p","t":"Parágrafo único - Não apresentadas no prazo as alegações finais, o presidente designará advogado dativo, assinando-lhe novo prazo. (NR) - Artigo 292 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 293 - O relatório deverá ser apresentado no prazo de 10 (dez) dias, contados da apresentação das alegações finais. (NR)"},{"k":"p","t":"§ 1º - O relatório deverá descrever, em relação a cada acusado, separadamente, as irregularidades imputadas, as provas colhidas e as razões de defesa, propondo a absolvição ou punição e indicando, nesse caso, a pena que entender cabível. (NR)"},{"k":"p","t":"§ 2º - O relatório deverá conter, também, a sugestão de quaisquer outras providências de interesse do serviço público. (NR) - Artigo 293 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 294 - Relatado, o processo será encaminhado à autoridade que determinou sua instauração. (NR) - Artigo 294 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 295 - Recebendo o processo relatado, a autoridade que houver determinado sua instauração deverá, no prazo de 20 (vinte) dias, proferir o julgamento ou determinar a realização de diligência, sempre que necessária ao esclarecimento de fatos. (NR) - Artigo 295 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 296 - Determinada a diligência, a autoridade encarregada do processo administrativo terá prazo de 15 (quinze) dias para seu cumprimento, abrindo vista à defesa para manifestar-se em 5 (cinco) dias. (NR) - Artigo 296 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 297 - Quando escaparem à sua alçada as penalidades e providências que lhe parecerem cabíveis, a autoridade que determinou a instauração do processo administrativo deverá propô-las, justificadamente, dentro do prazo para julgamento, à autoridade competente. (NR) - Artigo 297 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 298 - A autoridade que proferir decisão determinará os atos dela decorrentes e as providências necessárias a sua execução. (NR) - Artigo 298 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 299 - As decisões serão sempre publicadas no Diário Oficial do Estado, dentro do prazo de 8 (oito) dias, bem como averbadas no registro funcional do servidor. (NR) - Artigo 299 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 300 - Terão forma processual resumida, quando possível, todos os termos lavrados pelo secretário, quais sejam: autuação, juntada, conclusão, intimação, data de recebimento, bem como certidões e compromissos. (NR)"},{"k":"p","t":"§ 1º - Toda e qualquer juntada aos autos se fará na ordem cronológica da apresentação, rubricando o presidente as folhas acrescidas. (NR)"},{"k":"p","t":"§ 2º - Todos os atos ou decisões, cujo original não conste do processo, nele deverão figurar por cópia. (NR) - Artigo 300 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 301 - Constará sempre dos autos da sindicância ou do processo a folha de serviço do indiciado. (NR) - Artigo 301 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 302 - Quando ao funcionário se imputar crime, praticado na esfera administrativa, a autoridade que determinou a instauração do processo administrativo providenciará para que se instaure, simultaneamente, o inquérito policial. (NR)"},{"k":"p","t":"Parágrafo único - Quando se tratar de crime praticado fora da esfera administrativa, a autoridade policial dará ciência dele à autoridade administrativa. (NR) - Artigo 302 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 303 - As autoridades responsáveis pela condução do processo administrativo e do inquérito policial se auxiliarão para que os mesmos se concluam dentro dos prazos respectivos. (NR) - Artigo 303 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 304 - Quando o ato atribuído ao funcionário for considerado criminoso, serão remetidas à autoridade competente cópias autenticadas das peças essenciais do processo. (NR) - Artigo 304 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 305 - Não será declarada a nulidade de nenhum ato processual que não houver influído na apuração da verdade substancial ou diretamente na decisão do processo ou sindicância. (NR) - Artigo 305 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 306 - É defeso fornecer à imprensa ou a outros meios de divulgação notas sobre os atos processuais, salvo no interesse da Administração, a juízo do Secretário de Estado ou do Procurador Geral do Estado. (NR) - Artigo 306 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 307 - Decorridos 5 (cinco) anos de efetivo exercício, contados do cumprimento da sanção disciplinar, sem cometimento de nova infração, não mais poderá aquela ser considerada em prejuízo do infrator, inclusive para efeito de reincidência. (NR)"},{"k":"p","t":"Parágrafo único - A demissão e a demissão a bem do serviço público acarretam a incompatibilidade para nova investidura em cargo, função ou emprego público, pelo prazo de 5 (cinco) e 10 (dez) anos, respectivamente. (NR) - Artigo 307 com redação dada pela Lei Complementar n° 942, de 06/06/2003."}]},{"id":"s4","title":"CAPÍTULO IV — DO PROCESSO POR INASSIDUIDADE (NR) · arts. 308 a 323","tag":"","b":[{"k":"h","t":"CAPÍTULO IV — DO PROCESSO POR INASSIDUIDADE (NR)"},{"k":"p","t":"- Capítulo IV com redação dada pela Lei Complementar n° 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 308 - Verificada a ocorrência de faltas ao serviço que caracterizem inassiduidade, o superior imediato comunicará o fato à autoridade competente para determinar a instauração de processo disciplinar, instruindo a representação com cópia da ficha funcional do funcionário e atestados de frequência. (NR) - Artigo 308 com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 309 - Não será instaurado processo para apurar inassiduidade do funcionário que tiver pedido exoneração. (NR) - Artigo 309 com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 310 - Extingue-se o processo instaurado exclusivamente para apurar inassiduidade se o indiciado pedir exoneração até a data designada para o interrogatório, ou por ocasião deste. (NR) - Artigo 310 com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"p","t":"Artigo 311 - A defesa somente poderá versar sobre força maior, coação ilegal ou motivo legalmente justificável que impeça o comparecimento ao trabalho. (NR) - Artigo 311 com redação dada pela Lei Complementar nº 1.361, de 21/10/2021."},{"k":"h","t":"CAPÍTULO V — DOS RECURSOS (NR)"},{"k":"p","t":"- Capítulo V com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 312 - Caberá recurso, por uma única vez, da decisão que aplicar penalidade. (NR)"},{"k":"p","t":"§ 1º - O prazo para recorrer é de 30 (trinta) dias, contados da publicação da decisão impugnada no Diário Oficial do Estado ou da intimação pessoal do servidor, quando for o caso. (NR)"},{"k":"p","t":"§ 2º - Do recurso deverá constar, além do nome e qualificação do recorrente, a exposição das razões de inconformismo. (NR)"},{"k":"p","t":"§ 3º - O recurso será apresentado à autoridade que aplicou a pena, que terá o prazo de 10 (dez) dias para, motivadamente, manter sua decisão ou reformá-la. (NR)"},{"k":"p","t":"§ 4º - Mantida a decisão, ou reformada parcialmente, será imediatamente encaminhada a reexame pelo superior hierárquico. (NR)"},{"k":"p","t":"§ 5º - O recurso será apreciado pela autoridade competente ainda que incorretamente denominado ou endereçado. (NR) - Artigo 312 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 313 - Caberá pedido de reconsideração, que não poderá ser renovado, de decisão tomada pelo Governador do Estado em única instância, no prazo de 30 (trinta) dias. (NR) - Artigo 313 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 314 - Os recursos de que trata esta lei complementar não têm efeito suspensivo; os que forem providos darão lugar às retificações necessárias, retroagindo seus efeitos à data do ato punitivo. (NR) - Artigo 314 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"h","t":"CAPÍTULO VI — DA REVISÃO (NR)"},{"k":"p","t":"- Capítulo VI com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 315 - Admitir-se-á, a qualquer tempo, a revisão de punição disciplinar de que não caiba mais recurso, se surgirem fatos ou circunstâncias ainda não apreciados, ou vícios insanáveis de procedimento, que possam justificar redução ou anulação da pena aplicada. (NR)"},{"k":"p","t":"§ 1º - A simples alegação da injustiça da decisão não constitui fundamento do pedido. (NR)"},{"k":"p","t":"§ 2º - Não será admitida reiteração de pedido pelo mesmo fundamento. (NR)"},{"k":"p","t":"§ 3º - Os pedidos formulados em desacordo com este artigo serão indeferidos. (NR)"},{"k":"p","t":"§ 4º - O ônus da prova cabe ao requerente. (NR) - Artigo 315 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 316 - A pena imposta não poderá ser agravada pela revisão. (NR) - Artigo 316 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 317 - A instauração de processo revisional poderá ser requerida fundamentadamente pelo interessado ou, se falecido ou incapaz, por seu curador, cônjuge, companheiro, ascendente, descendente ou irmão, sempre por intermédio de advogado. (NR)"},{"k":"p","t":"Parágrafo único - O pedido será instruído com as provas que o requerente possuir ou com indicação daquelas que pretenda produzir. (NR) - Artigo 317 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 318 - A autoridade que aplicou a penalidade, ou que a tiver confirmado em grau de recurso, será competente para o exame da admissibilidade do pedido de revisão, bem como, caso deferido o processamento, para a sua decisão final. (NR) - Artigo 318 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 319 - Deferido o processamento da revisão, será este realizado por Procurador de Estado que não tenha funcionado no procedimento disciplinar de que resultou a punição do requerente. (NR) - Artigo 319 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 320 - Recebido o pedido, o presidente providenciará o apensamento dos autos originais e notificará o requerente para, no prazo de 8 (oito) dias, oferecer rol de testemunhas, ou requerer outras provas que pretenda produzir. (NR)"},{"k":"p","t":"Parágrafo único - No processamento da revisão serão observadas as normas previstas nesta lei complementar para o processo administrativo. (NR) - Artigo 320 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"p","t":"Artigo 321 - A decisão que julgar procedente a revisão poderá alterar a classificação da infração, absolver o punido, modificar a pena ou anular o processo, restabelecendo os direitos atingidos pela decisão reformada. (NR) - Artigo 321 com redação dada pela Lei Complementar n° 942, de 06/06/2003."},{"k":"h","t":"DISPOSIÇÕES FINAIS"},{"k":"p","t":"Artigo 322 - O dia 28 de outubro será consagrado ao \"Funcionário Público Estadual\"."},{"k":"p","t":"Artigo 323 - Os prazos previstos neste Estatuto serão todos contados por dias corridos."},{"k":"p","t":"Parágrafo único - Não se computará no prazo o dia inicial, prorrogando-se o vencimento, que incidir em sábado, domingo, feriado ou facultativo, para o primeiro dia útil seguinte."}]}],"imp":[{"id":"s0","title":"Disposições iniciais · arts. 1 a 11","tag":"","b":[{"k":"p","t":"Lei nº 8.429/1992 Dispõe sobre as sanções aplicáveis em virtude da prática de atos de improbidade administrativa, de que trata o § 4º do art. 37 da Constituição Federal; e dá outras providências. (Redação dada pela Lei nº 14.230, de 2021) O PRESIDENTE DA REPÚBLICA, Faço saber que o Congresso Nacional decreta e eu sanciono a seguinte lei:"},{"k":"h","t":"CAPÍTULO I — DAS DISPOSIÇÕES GERAIS"},{"k":"p","t":"Art. 1º O sistema de responsabilização por atos de improbidade administrativa tutelará a probidade na organização do Estado e no exercício de suas funções, como forma de assegurar a integridade do patrimônio público e social, nos termos desta Lei. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º Consideram-se atos de improbidade administrativa as condutas dolosas tipificadas nos arts. 9º, 10 e 11 desta Lei, ressalvados tipos previstos em leis especiais. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º Considera-se dolo a vontade livre e consciente de alcançar o resultado ilícito tipificado nos arts. 9º, 10 e 11 desta Lei, não bastando a voluntariedade do agente. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 3º O mero exercício da função ou desempenho de competências públicas, sem comprovação de ato doloso com fim ilícito, afasta a responsabilidade por ato de improbidade administrativa. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 4º Aplicam-se ao sistema da improbidade disciplinado nesta Lei os princípios constitucionais do direito administrativo sancionador. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 5º Os atos de improbidade violam a probidade na organização do Estado e no exercício de suas funções e a integridade do patrimônio público e social dos Poderes Executivo, Legislativo e Judiciário, bem como da administração direta e indireta, no âmbito da União, dos Estados, dos Municípios e do Distrito Federal. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 6º Estão sujeitos às sanções desta Lei os atos de improbidade praticados contra o patrimônio de entidade privada que receba subvenção, benefício ou incentivo, fiscal ou creditício, de entes públicos ou governamentais, previstos no § 5º deste artigo. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 7º Independentemente de integrar a administração indireta, estão sujeitos às sanções desta Lei os atos de improbidade praticados contra o patrimônio de entidade privada para cuja criação ou custeio o erário haja concorrido ou concorra no seu patrimônio ou receita atual, limitado o ressarcimento de prejuízos, nesse caso, à repercussão do ilícito sobre a contribuição dos cofres públicos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 8º Não configura improbidade a ação ou omissão decorrente de divergência interpretativa da lei, baseada em jurisprudência, ainda que não pacificada, mesmo que não venha a ser posteriormente prevalecente nas decisões dos órgãos de controle ou dos tribunais do Poder Judiciário. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 2º Para os efeitos desta Lei, consideram-se agente público o agente político, o servidor público e todo aquele que exerce, ainda que transitoriamente ou sem remuneração, por eleição, nomeação, designação, contratação ou qualquer outra forma de investidura ou vínculo, mandato, cargo, emprego ou função nas entidades referidas no art. 1º desta Lei. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. No que se refere a recursos de origem pública, sujeita-se às sanções previstas nesta Lei o particular, pessoa física ou jurídica, que celebra com a administração pública convênio, contrato de repasse, contrato de gestão, termo de parceria, termo de cooperação ou ajuste administrativo equivalente. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 3º As disposições desta Lei são aplicáveis, no que couber, àquele que, mesmo não sendo agente público, induza ou concorra dolosamente para a prática do ato de improbidade. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º Os sócios, os cotistas, os diretores e os colaboradores de pessoa jurídica de direito privado não respondem pelo ato de improbidade que venha a ser imputado à pessoa jurídica, salvo se, comprovadamente, houver participação e benefícios diretos, caso em que responderão nos limites da sua participação. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º As sanções desta Lei não se aplicarão à pessoa jurídica, caso o ato de improbidade administrativa seja também sancionado como ato lesivo à administração pública de que trata a Lei nº 12.846, de 1º de agosto de 2013. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 4° (Revogado pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 5° (Revogado pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 6°(Revogado pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 7º Se houver indícios de ato de improbidade, a autoridade que conhecer dos fatos representará ao Ministério Público competente, para as providências necessárias. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. (Revogado). (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 8º O sucessor ou o herdeiro daquele que causar dano ao erário ou que se enriquecer ilicitamente estão sujeitos apenas à obrigação de repará-lo até o limite do valor da herança ou do patrimônio transferido. (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Art. 8º-A A responsabilidade sucessória de que trata o art. 8º desta Lei aplica-se também na hipótese de alteração contratual, de transformação, de incorporação, de fusão ou de cisão societária. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"Parágrafo único. Nas hipóteses de fusão e de incorporação, a responsabilidade da sucessora será restrita à obrigação de reparação integral do dano causado, até o limite do patrimônio transferido, não lhe sendo aplicáveis as demais sanções previstas nesta Lei decorrentes de atos e de fatos ocorridos antes da data da fusão ou da incorporação, exceto no caso de simulação ou de evidente intuito de fraude, devidamente comprovados. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"h","t":"CAPÍTULO II — DOS ATOS DE IMPROBIDADE ADMINISTRATIVA"},{"k":"h","t":"SEÇÃO I — DOS ATOS DE IMPROBIDADE ADMINISTRATIVA QUE IMPORTAM ENRIQUECIMENTO ILÍCITO"},{"k":"p","t":"Art. 9º Constitui ato de improbidade administrativa importando em enriquecimento ilícito auferir, mediante a prática de ato doloso, qualquer tipo de vantagem patrimonial indevida em razão do exercício de cargo, de mandato, de função, de emprego ou de atividade nas entidades referidas no art. 1º desta Lei, e notadamente: (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - receber, para si ou para outrem, dinheiro, bem móvel ou imóvel, ou qualquer outra vantagem econômica, direta ou indireta, a título de comissão, percentagem, gratificação ou presente de quem tenha interesse, direto ou indireto, que possa ser atingido ou amparado por ação ou omissão decorrente das atribuições do agente público;"},{"k":"p","t":"II - perceber vantagem econômica, direta ou indireta, para facilitar a aquisição, permuta ou locação de bem móvel ou imóvel, ou a contratação de serviços pelas entidades referidas no art. 1° por preço superior ao valor de mercado;"},{"k":"p","t":"III - perceber vantagem econômica, direta ou indireta, para facilitar a alienação, permuta ou locação de bem público ou o fornecimento de serviço por ente estatal por preço inferior ao valor de mercado;"},{"k":"p","t":"IV - utilizar, em obra ou serviço particular, qualquer bem móvel, de propriedade ou à disposição de qualquer das entidades referidas no art. 1º desta Lei, bem como o trabalho de servidores, de empregados ou de terceiros contratados por essas entidades; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"V - receber vantagem econômica de qualquer natureza, direta ou indireta, para tolerar a exploração ou a prática de jogos de azar, de lenocínio, de narcotráfico, de contrabando, de usura ou de qualquer outra atividade ilícita, ou aceitar promessa de tal vantagem;"},{"k":"p","t":"VI - receber vantagem econômica de qualquer natureza, direta ou indireta, para fazer declaração falsa sobre qualquer dado técnico que envolva obras públicas ou qualquer outro serviço ou sobre quantidade, peso, medida, qualidade ou característica de mercadorias ou bens fornecidos a qualquer das entidades referidas no art. 1º desta Lei; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"VII - adquirir, para si ou para outrem, no exercício de mandato, de cargo, de emprego ou de função pública, e em razão deles, bens de qualquer natureza, decorrentes dos atos descritos no caput deste artigo, cujo valor seja desproporcional à evolução do patrimônio ou à renda do agente público, assegurada a demonstração pelo agente da licitude da origem dessa evolução; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"VIII - aceitar emprego, comissão ou exercer atividade de consultoria ou assessoramento para pessoa física ou jurídica que tenha interesse suscetível de ser atingido ou amparado por ação ou omissão decorrente das atribuições do agente público, durante a atividade;"},{"k":"p","t":"IX - perceber vantagem econômica para intermediar a liberação ou aplicação de verba pública de qualquer natureza;"},{"k":"p","t":"X - receber vantagem econômica de qualquer natureza, direta ou indiretamente, para omitir ato de ofício, providência ou declaração a que esteja obrigado;"},{"k":"p","t":"XI - incorporar, por qualquer forma, ao seu patrimônio bens, rendas, verbas ou valores integrantes do acervo patrimonial das entidades mencionadas no art. 1° desta lei;"},{"k":"p","t":"XII - usar, em proveito próprio, bens, rendas, verbas ou valores integrantes do acervo patrimonial das entidades mencionadas no art. 1° desta lei."},{"k":"h","t":"SEÇÃO II — DOS ATOS DE IMPROBIDADE ADMINISTRATIVA QUE CAUSAM PREJUÍZO AO ERÁRIO"},{"k":"p","t":"Art. 10. Constitui ato de improbidade administrativa que causa lesão ao erário qualquer ação ou omissão dolosa, que enseje, efetiva e comprovadamente, perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação dos bens ou haveres das entidades referidas no art. 1º desta Lei, e notadamente: (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - facilitar ou concorrer, por qualquer forma, para a indevida incorporação ao patrimônio particular, de pessoa física ou jurídica, de bens, de rendas, de verbas ou de valores integrantes do acervo patrimonial das entidades referidas no art. 1º desta Lei; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"II - permitir ou concorrer para que pessoa física ou jurídica privada utilize bens, rendas, verbas ou valores integrantes do acervo patrimonial das entidades mencionadas no art. 1º desta lei, sem a observância das formalidades legais ou regulamentares aplicáveis à espécie;"},{"k":"p","t":"III - doar à pessoa física ou jurídica bem como ao ente despersonalizado, ainda que de fins educativos ou assistências, bens, rendas, verbas ou valores do patrimônio de qualquer das entidades mencionadas no art. 1º desta lei, sem observância das formalidades legais e regulamentares aplicáveis à espécie;"},{"k":"p","t":"IV - permitir ou facilitar a alienação, permuta ou locação de bem integrante do patrimônio de qualquer das entidades referidas no art. 1º desta lei, ou ainda a prestação de serviço por parte delas, por preço inferior ao de mercado;"},{"k":"p","t":"V - permitir ou facilitar a aquisição, permuta ou locação de bem ou serviço por preço superior ao de mercado;"},{"k":"p","t":"VI - realizar operação financeira sem observância das normas legais e regulamentares ou aceitar garantia insuficiente ou inidônea;"},{"k":"p","t":"VII - conceder benefício administrativo ou fiscal sem a observância das formalidades legais ou regulamentares aplicáveis à espécie;"},{"k":"p","t":"VIII - frustrar a licitude de processo licitatório ou de processo seletivo para celebração de parcerias com entidades sem fins lucrativos, ou dispensá-los indevidamente, acarretando perda patrimonial efetiva; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"IX - ordenar ou permitir a realização de despesas não autorizadas em lei ou regulamento;"},{"k":"p","t":"X - agir ilicitamente na arrecadação de tributo ou de renda, bem como no que diz respeito à conservação do patrimônio público; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"XI - liberar verba pública sem a estrita observância das normas pertinentes ou influir de qualquer forma para a sua aplicação irregular;"},{"k":"p","t":"XII - permitir, facilitar ou concorrer para que terceiro se enriqueça ilicitamente;"},{"k":"p","t":"XIII - permitir que se utilize, em obra ou serviço particular, veículos, máquinas, equipamentos ou material de qualquer natureza, de propriedade ou à disposição de qualquer das entidades mencionadas no art. 1° desta lei, bem como o trabalho de servidor público, empregados ou terceiros contratados por essas entidades."},{"k":"p","t":"XIV – celebrar contrato ou outro instrumento que tenha por objeto a prestação de serviços públicos por meio da gestão associada sem observar as formalidades previstas na lei; (Incluído pela Lei nº 11.107, de 2005)"},{"k":"p","t":"XV – celebrar contrato de rateio de consórcio público sem suficiente e prévia dotação orçamentária, ou sem observar as formalidades previstas na lei. (Incluído pela Lei nº 11.107, de 2005)"},{"k":"p","t":"XVI - facilitar ou concorrer, por qualquer forma, para a incorporação, ao patrimônio particular de pessoa física ou jurídica, de bens, rendas, verbas ou valores públicos transferidos pela administração pública a entidades privadas mediante celebração de parcerias, sem a observância das formalidades legais ou regulamentares aplicáveis à espécie; (Incluído pela Lei nº 13.019, de 2014) (Vigência)"},{"k":"p","t":"XVII - permitir ou concorrer para que pessoa física ou jurídica privada utilize bens, rendas, verbas ou valores públicos transferidos pela administração pública a entidade privada mediante celebração de parcerias, sem a observância das formalidades legais ou regulamentares aplicáveis à espécie; (Incluído pela Lei nº 13.019, de 2014) (Vigência)"},{"k":"p","t":"XVIII - celebrar parcerias da administração pública com entidades privadas sem a observância das formalidades legais ou regulamentares aplicáveis à espécie; (Incluído pela Lei nº 13.019, de 2014) (Vigência)"},{"k":"p","t":"XIX - agir para a configuração de ilícito na celebração, na fiscalização e na análise das prestações de contas de parcerias firmadas pela administração pública com entidades privadas; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"XX - liberar recursos de parcerias firmadas pela administração pública com entidades privadas sem a estrita observância das normas pertinentes ou influir de qualquer forma para a sua aplicação irregular. (Incluído pela Lei nº 13.019, de 2014, com a redação dada pela Lei nº 13.204, de 2015)"},{"k":"p","t":"XXI - (Revogado)"},{"k":"p","t":"XXII - conceder, aplicar ou manter benefício financeiro ou tributário contrário ao que dispõem o caput e o § 1º do art. 8º-A da Lei Complementar nº 116, de 31 de julho de 2003. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º Nos casos em que a inobservância de formalidades legais ou regulamentares não implicar perda patrimonial efetiva, não ocorrerá imposição de ressarcimento, vedado o enriquecimento sem causa das entidades referidas no art. 1º desta Lei. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 2º A mera perda patrimonial decorrente da atividade econômica não acarretará improbidade administrativa, salvo se comprovado ato doloso praticado com essa finalidade. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"h","t":"SEÇÃO III — DOS ATOS DE IMPROBIDADE ADMINISTRATIVA QUE ATENTAM CONTRA OS PRINCÍPIOS DA ADMINISTRAÇÃO PÚBLICA"},{"k":"p","t":"Art. 11. Constitui ato de improbidade administrativa que atenta contra os princípios da administração pública a ação ou omissão dolosa que viole os deveres de honestidade, de imparcialidade e de legalidade, caracterizada por uma das seguintes condutas: (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"I - (Revogado)"},{"k":"p","t":"II - (Revogado)"},{"k":"p","t":"III - revelar fato ou circunstância de que tem ciência em razão das atribuições e que deva permanecer em segredo, propiciando beneficiamento por informação privilegiada ou colocando em risco a segurança da sociedade e do Estado; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"IV - negar publicidade aos atos oficiais, exceto em razão de sua imprescindibilidade para a segurança da sociedade e do Estado ou de outras hipóteses instituídas em lei; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"V - frustrar, em ofensa à imparcialidade, o caráter concorrencial de concurso público, de chamamento ou de procedimento licitatório, com vistas à obtenção de benefício próprio, direto ou indireto, ou de terceiros; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"VI - deixar de prestar contas quando esteja obrigado a fazê-lo, desde que disponha das condições para isso, com vistas a ocultar irregularidades; (Redação dada pela Lei nº 14.230, de 2021)"},{"k":"p","t":"VII - revelar ou permitir que chegue ao conhecimento de terceiro, antes da respectiva divulgação oficial, teor de medida política ou econômica capaz de afetar o preço de mercadoria, bem ou serviço."},{"k":"p","t":"VIII - descumprir as normas relativas à celebração, fiscalização e aprovação de contas de parcerias firmadas pela administração pública com entidades privadas (Redação dada pela Lei nº 13.019, de 2014) (Vigência)"},{"k":"p","t":"IX - (Revogado)"},{"k":"p","t":"X - (Revogado)"},{"k":"p","t":"XI - nomear cônjuge, companheiro ou parente em linha reta, colateral ou por afinidade, até o terceiro grau, inclusive, da autoridade nomeante ou de servidor da mesma pessoa jurídica investido em cargo de direção, chefia ou assessoramento, para o exercício de cargo em comissão ou de confiança ou, ainda, de função gratificada na administração pública direta e indireta em qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios, compreendido o ajuste mediante designações recíprocas; (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"XII - praticar, no âmbito da administração pública e com recursos do erário, ato de publicidade que contrarie o disposto no § 1º do art. 37 da Constituição Federal, de forma a promover inequívoco enaltecimento do agente público e personalização de atos, de programas, de obras, de serviços ou de campanhas dos órgãos públicos. (Incluído pela Lei nº 14.230, de 2021)"},{"k":"p","t":"§ 1º Nos termos da Convenção das Nações Unidas contra a Corrupção, promulgada pelo Decreto nº 5.687, de 31 de janeiro de 2006, somente haverá improbidade administrativa, na aplicação deste artigo, quando for comprovado na conduta funcional do agente público o
