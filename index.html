arte."},{"k":"h","t":"CAPÍTULO III — DA FALSIDADE DOCUMENTAL"},{"k":"h","t":"Falsificação do selo ou sinal público"},{"k":"p","t":"Art. 296 - Falsificar, fabricando-os ou alterando-os:","v":["falsificar"]},{"k":"p","t":"I - selo público destinado a autenticar atos oficiais da União, de Estado ou de Município;"},{"k":"p","t":"II - selo ou sinal atribuído por lei a entidade de direito público, ou a autoridade, ou sinal público de tabelião:"},{"k":"p","t":"Pena - reclusão, de dois a seis anos, e multa."},{"k":"p","t":"§ 1º - Incorre nas mesmas penas:"},{"k":"p","t":"I - quem faz uso do selo ou sinal falsificado;"},{"k":"p","t":"II - quem utiliza indevidamente o selo ou sinal verdadeiro em prejuízo de outrem ou em proveito próprio ou alheio."},{"k":"p","t":"III - quem altera, falsifica ou faz uso indevido de marcas, logotipos, siglas ou quaisquer outros símbolos utilizados ou identificadores de órgãos ou entidades da Administração Pública. (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"§ 2º - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte."},{"k":"h","t":"Falsificação de documento público"},{"k":"p","t":"Art. 297 - Falsificar, no todo ou em parte, documento público, ou alterar documento público verdadeiro:","v":["falsificar","alterar"]},{"k":"p","t":"Pena - reclusão, de dois a seis anos, e multa."},{"k":"p","t":"§ 1º - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte."},{"k":"p","t":"§ 2º - Para os efeitos penais, equiparam-se a documento público o emanado de entidade paraestatal, o título ao portador ou transmissível por endosso, as ações de sociedade comercial, os livros mercantis e o testamento particular."},{"k":"p","t":"§ 3o Nas mesmas penas incorre quem insere ou faz inserir: (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"I – na folha de pagamento ou em documento de informações que seja destinado a fazer prova perante a previdência social, pessoa que não possua a qualidade de segurado obrigatório;(Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"II – na Carteira de Trabalho e Previdência Social do empregado ou em documento que deva produzir efeito perante a previdência social, declaração falsa ou diversa da que deveria ter sido escrita; (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"III – em documento contábil ou em qualquer outro documento relacionado com as obrigações da empresa perante a previdência social, declaração falsa ou diversa da que deveria ter constado. (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"§ 4o Nas mesmas penas incorre quem omite, nos documentos mencionados no § 3o, nome do segurado e seus dados pessoais, a remuneração, a vigência do contrato de trabalho ou de prestação de serviços.(Incluído pela Lei nº 9.983, de 2000) Falsificação de documento particular (Redação dada pela Lei nº 12.737, de 2012) Vigência"},{"k":"p","t":"Art. 298 - Falsificar, no todo ou em parte, documento particular ou alterar documento particular verdadeiro:","v":["falsificar","alterar"]},{"k":"p","t":"Pena - reclusão, de um a cinco anos, e multa. Falsificação de cartão(Incluído pela Lei nº 12.737, de 2012) Vigência"},{"k":"p","t":"Parágrafo único. Para fins do disposto no caput, equipara-se a documento particular o cartão de crédito ou débito.(Incluído pela Lei nº 12.737, de 2012) Vigência"},{"k":"h","t":"Falsidade ideológica"},{"k":"p","t":"Art. 299 - Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante:","v":["omitir","inserir","fazer inserir"]},{"k":"p","t":"Pena - reclusão, de um a cinco anos, e multa, se o documento é público, e reclusão de um a três anos, e multa, de quinhentos mil réis a cinco contos de réis, se o documento é particular. (Vide Lei nº 7.209, de 1984)"},{"k":"p","t":"Parágrafo único - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, ou se a falsificação ou alteração é de assentamento de registro civil, aumenta-se a pena de sexta parte."},{"k":"h","t":"Falso reconhecimento de firma ou letra"},{"k":"p","t":"Art. 300 - Reconhecer, como verdadeira, no exercício de função pública, firma ou letra que o não seja:","v":["reconhecer"]},{"k":"p","t":"Pena - reclusão, de um a cinco anos, e multa, se o documento é público; e de um a três anos, e multa, se o documento é particular."},{"k":"h","t":"Certidão ou atestado ideologicamente falso"},{"k":"p","t":"Art. 301 - Atestar ou certificar falsamente, em razão de função pública, fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem:","v":["atestar","certificar"]},{"k":"p","t":"Pena - detenção, de dois meses a um ano. Falsidade material de atestado ou certidão"},{"k":"p","t":"§ 1º - Falsificar, no todo ou em parte, atestado ou certidão, ou alterar o teor de certidão ou de atestado verdadeiro, para prova de fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem:"},{"k":"p","t":"Pena - detenção, de três meses a dois anos."},{"k":"p","t":"§ 2º - Se o crime é praticado com o fim de lucro, aplicase, além da pena privativa de liberdade, a de multa."},{"k":"h","t":"Falsidade de atestado médico"},{"k":"p","t":"Art. 302 - Dar o médico, no exercício da sua profissão, atestado falso:","v":["dar"]},{"k":"p","t":"Pena - detenção, de um mês a um ano."},{"k":"p","t":"Parágrafo único - Se o crime é cometido com o fim de lucro, aplica-se também multa."},{"k":"h","t":"Reprodução ou adulteração de selo ou peça filatélica"},{"k":"p","t":"Art. 303 - Reproduzir ou alterar selo ou peça filatélica que tenha valor para coleção, salvo quando a reprodução ou a alteração está visivelmente anotada na face ou no verso do selo ou peça:","v":["reproduzir","alterar"]},{"k":"p","t":"Pena - detenção, de um a três anos, e multa."},{"k":"p","t":"Parágrafo único - Na mesma pena incorre quem, para fins de comércio, faz uso do selo ou peça filatélica."},{"k":"h","t":"Uso de documento falso"},{"k":"p","t":"Art. 304 - Fazer uso de qualquer dos papéis falsificados ou alterados, a que se referem os arts. 297 a 302:","v":["fazer uso"]},{"k":"p","t":"Pena - a cominada à falsificação ou à alteração."},{"k":"h","t":"Supressão de documento"},{"k":"p","t":"Art. 305 - Destruir, suprimir ou ocultar, em benefício próprio ou de outrem, ou em prejuízo alheio, documento público ou particular verdadeiro, de que não podia dispor:","v":["destruir","suprimir","ocultar"]},{"k":"p","t":"Pena - reclusão, de dois a seis anos, e multa, se o documento é público, e reclusão, de um a cinco anos, e multa, se o documento é particular."},{"k":"h","t":"CAPÍTULO IV — DE OUTRAS FALSIDADES"},{"k":"h","t":"Falsa identidade"},{"k":"p","t":"Art. 307 - Atribuir-se ou atribuir a terceiro falsa identidade para obter vantagem, em proveito próprio ou alheio, ou para causar dano a outrem:","v":["atribuir-se","atribuir"]},{"k":"p","t":"Pena - detenção, de três meses a um ano, ou multa, se o fato não constitui elemento de crime mais grave."},{"k":"p","t":"Art. 308 - Usar, como próprio, passaporte, título de eleitor, caderneta de reservista ou qualquer documento de identidade alheia ou ceder a outrem, para que dele se utilize, documento dessa natureza, próprio ou de terceiro:","v":["usar","ceder"]},{"k":"p","t":"Pena - detenção, de quatro meses a dois anos, e multa, se o fato não constitui elemento de crime mais grave."},{"k":"h","t":"CAPÍTULO V"},{"k":"p","t":"(Incluído pela Lei 12.550. de 2011)"},{"k":"h","t":"DAS FRAUDES EM CERTAMES DE INTERESSE"},{"k":"h","t":"PÚBLICO"},{"k":"p","t":"(Incluído pela Lei 12.550. de 2011) Fraudes em certames de interesse público (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"Art. 311-A. Utilizar ou divulgar, indevidamente, com o fim de beneficiar a si ou a outrem, ou de comprometer a credibilidade do certame, conteúdo sigiloso de: (Incluído pela Lei 12.550. de 2011)","v":["utilizar","divulgar"]},{"k":"p","t":"I - concurso público; (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"II - avaliação ou exame públicos; (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"III - processo seletivo para ingresso no ensino superior; ou (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"IV - exame ou processo seletivo previstos em lei: (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"Pena - reclusão, de 1 (um) a 4 (quatro) anos, e multa. (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"§ 1o Nas mesmas penas incorre quem permite ou facilita, por qualquer meio, o acesso de pessoas não autorizadas às informações mencionadas no caput. (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"§ 2o Se da ação ou omissão resulta dano à administração pública: (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"Pena - reclusão, de 2 (dois) a 6 (seis) anos, e multa. (Incluído pela Lei 12.550. de 2011)"},{"k":"p","t":"§ 3o Aumenta-se a pena de 1/3 (um terço) se o fato é cometido por funcionário público. (Incluído pela Lei 12.550. de 2011)"}]},{"id":"s1","title":"TÍTULO XI — DOS CRIMES CONTRA A ADMINISTRAÇÃO PÚBLICA · arts. 312 a 337","tag":"","b":[{"k":"h","t":"TÍTULO XI — DOS CRIMES CONTRA A ADMINISTRAÇÃO PÚBLICA"},{"k":"h","t":"CAPÍTULO I — DOS CRIMES PRATICADOS POR FUNCIONÁRIO PÚBLICO CONTRA A ADMINISTRAÇÃO EM GERAL"},{"k":"h","t":"Peculato"},{"k":"p","t":"Art. 312 - Apropriar-se o funcionário público de dinheiro, valor ou qualquer outro bem móvel, público ou particular, de que tem a posse em razão do cargo, ou desviá-lo, em proveito próprio ou alheio:","v":["apropriar-se","desviar"]},{"k":"p","t":"Pena - reclusão, de dois a doze anos, e multa."},{"k":"p","t":"§ 1º - Aplica-se a mesma pena, se o funcionário público, embora não tendo a posse do dinheiro, valor ou bem, o subtrai, ou concorre para que seja subtraído, em proveito próprio ou alheio, valendo-se de facilidade que lhe proporciona a qualidade de funcionário. Peculato culposo"},{"k":"p","t":"§ 2º - Se o funcionário concorre culposamente para o crime de outrem:"},{"k":"p","t":"Pena - detenção, de três meses a um ano."},{"k":"p","t":"§ 3º - No caso do parágrafo anterior, a reparação do dano, se precede à sentença irrecorrível, extingue a punibilidade; se lhe é posterior, reduz de metade a pena imposta."},{"k":"h","t":"Peculato mediante erro de outrem"},{"k":"p","t":"Art. 313 - Apropriar-se de dinheiro ou qualquer utilidade que, no exercício do cargo, recebeu por erro de outrem:","v":["apropriar-se"]},{"k":"p","t":"Pena - reclusão, de um a quatro anos, e multa. Inserção de dados falsos em sistema de informações (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"Art. 313-A. Inserir ou facilitar, o funcionário autorizado, a inserção de dados falsos, alterar ou excluir indevidamente dados corretos nos sistemas informatizados ou bancos de dados da Administração Pública com o fim de obter vantagem indevida para si ou para outrem ou para causar dano: (Incluído pela Lei nº 9.983, de 2000))","v":["inserir","facilitar","alterar","excluir"]},{"k":"p","t":"Pena – reclusão, de 2 (dois) a 12 (doze) anos, e multa. (Incluído pela Lei nº 9.983, de 2000) Modificação ou alteração não autorizada de sistema de informações (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"Art. 313-B. Modificar ou alterar, o funcionário, sistema de informações ou programa de informática sem autorização ou solicitação de autoridade competente: (Incluído pela Lei nº 9.983, de 2000)","v":["modificar","alterar"]},{"k":"p","t":"Pena – detenção, de 3 (três) meses a 2 (dois) anos, e multa. (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"Parágrafo único. As penas são aumentadas de um terço até a metade se da modificação ou alteração resulta dano para a Administração Pública ou para o administrado.(Incluído pela Lei nº 9.983, de 2000) Extravio, sonegação ou inutilização de livro ou documento"},{"k":"p","t":"Art. 314 - Extraviar livro oficial ou qualquer documento, de que tem a guarda em razão do cargo; sonegá-lo ou inutilizá-lo, total ou parcialmente:","v":["extraviar","sonegar","inutilizar"]},{"k":"p","t":"Pena - reclusão, de um a quatro anos, se o fato não constitui crime mais grave."},{"k":"h","t":"Emprego irregular de verbas ou rendas públicas"},{"k":"p","t":"Art. 315 - Dar às verbas ou rendas públicas aplicação diversa da estabelecida em lei:","v":["dar"]},{"k":"p","t":"Pena - detenção, de um a três meses, ou multa."},{"k":"h","t":"Concussão"},{"k":"p","t":"Art. 316 - Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida:","v":["exigir"]},{"k":"p","t":"Pena - reclusão, de 2 (dois) a 12 (doze) anos, e multa.(Redação dada pela Lei nº 13.964, de 2019) Excesso de exação"},{"k":"p","t":"§ 1º - Se o funcionário exige tributo ou contribuição social que sabe ou deveria saber indevido, ou, quando devido, emprega na cobrança meio vexatório ou gravoso, que a lei não autoriza: (Redação dada pela Lei nº 8.137, de 27.12.1990)"},{"k":"p","t":"Pena - reclusão, de 3 (três) a 8 (oito) anos, e multa. (Redação dada pela Lei nº 8.137, de 27.12.1990)"},{"k":"p","t":"§ 2º - Se o funcionário desvia, em proveito próprio ou de outrem, o que recebeu indevidamente para recolher aos cofres públicos:"},{"k":"p","t":"Pena - reclusão, de dois a doze anos, e multa."},{"k":"h","t":"Corrupção passiva"},{"k":"p","t":"Art. 317 - Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem:","v":["solicitar","receber","aceitar"]},{"k":"p","t":"Pena – reclusão, de 2 (dois) a 12 (doze) anos, e multa. (Redação dada pela Lei nº 10.763, de 12.11.2003)"},{"k":"p","t":"§ 1º - A pena é aumentada de um terço, se, em conseqüência da vantagem ou promessa, o funcionário retarda ou deixa de praticar qualquer ato de ofício ou o pratica infringindo dever funcional."},{"k":"p","t":"§ 2º - Se o funcionário pratica, deixa de praticar ou retarda ato de ofício, com infração de dever funcional, cedendo a pedido ou influência de outrem:"},{"k":"p","t":"Pena - detenção, de três meses a um ano, ou multa."},{"k":"h","t":"Prevaricação"},{"k":"p","t":"Art. 319 - Retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal:","v":["retardar","deixar de praticar","praticar"]},{"k":"p","t":"Pena - detenção, de três meses a um ano, e multa."},{"k":"p","t":"Art. 319-A. Deixar o Diretor de Penitenciária e/ou agente público, de cumprir seu dever de vedar ao preso o acesso a aparelho telefônico, de rádio ou similar, que permita a comunicação com outros presos ou com o ambiente externo: (Incluído pela Lei nº 11.466, de 2007).","v":["deixar"]},{"k":"p","t":"Pena: detenção, de 3 (três) meses a 1 (um) ano."},{"k":"h","t":"Condescendência criminosa"},{"k":"p","t":"Art. 320 - Deixar o funcionário, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não levar o fato ao conhecimento da autoridade competente:","v":["deixar"]},{"k":"p","t":"Pena - detenção, de quinze dias a um mês, ou multa."},{"k":"h","t":"Advocacia administrativa"},{"k":"p","t":"Art. 321 - Patrocinar, direta ou indiretamente, interesse privado perante a administração pública, valendo-se da qualidade de funcionário:","v":["patrocinar"]},{"k":"p","t":"Pena - detenção, de um a três meses, ou multa."},{"k":"p","t":"Parágrafo único - Se o interesse é ilegítimo:"},{"k":"p","t":"Pena - detenção, de três meses a um ano, além da multa."},{"k":"h","t":"Violência arbitrária"},{"k":"p","t":"Art. 322 - Praticar violência, no exercício de função ou a pretexto de exercê-la:","v":["praticar"]},{"k":"p","t":"Pena - detenção, de seis meses a três anos, além da pena correspondente à violência."},{"k":"h","t":"Abandono de função"},{"k":"p","t":"Art. 323 - Abandonar cargo público, fora dos casos permitidos em lei:","v":["abandonar"]},{"k":"p","t":"Pena - detenção, de quinze dias a um mês, ou multa."},{"k":"p","t":"§ 1º - Se do fato resulta prejuízo público:"},{"k":"p","t":"Pena - detenção, de três meses a um ano, e multa."},{"k":"p","t":"§ 2º - Se o fato ocorre em lugar compreendido na faixa de fronteira:"},{"k":"p","t":"Pena - detenção, de um a três anos, e multa. Exercício funcional ilegalmente antecipado ou prolongado"},{"k":"p","t":"Art. 324 - Entrar no exercício de função pública antes de satisfeitas as exigências legais, ou continuar a exercê-la, sem autorização, depois de saber oficialmente que foi exonerado, removido, substituído ou suspenso:","v":["entrar","continuar"]},{"k":"p","t":"Pena - detenção, de quinze dias a um mês, ou multa."},{"k":"h","t":"Violação de sigilo funcional"},{"k":"p","t":"Art. 325 - Revelar fato de que tem ciência em razão do cargo e que deva permanecer em segredo, ou facilitarlhe a revelação:","v":["revelar","facilitar"]},{"k":"p","t":"Pena - detenção, de seis meses a dois anos, ou multa, se o fato não constitui crime mais grave."},{"k":"p","t":"§ 1o Nas mesmas penas deste artigo incorre quem: (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"I – permite ou facilita, mediante atribuição, fornecimento e empréstimo de senha ou qualquer outra forma, o acesso de pessoas não autorizadas a sistemas de informações ou banco de dados da Administração Pública; (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"II – se utiliza, indevidamente, do acesso restrito. (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"§ 2o Se da ação ou omissão resulta dano à Administração Pública ou a outrem: (Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"Pena – reclusão, de 2 (dois) a 6 (seis) anos, e multa. (Incluído pela Lei nº 9.983, de 2000)"},{"k":"h","t":"Violação do sigilo de proposta de concorrência"},{"k":"p","t":"Art. 326 - Devassar o sigilo de proposta de concorrência pública, ou proporcionar a terceiro o ensejo de devassá-lo:","v":["devassar","proporcionar"]},{"k":"p","t":"Pena - Detenção, de três meses a um ano, e multa."},{"k":"h","t":"Funcionário público"},{"k":"p","t":"Art. 327 - Considera-se funcionário público, para os efeitos penais, quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública."},{"k":"p","t":"§ 1º - Equipara-se a funcionário público quem exerce cargo, emprego ou função em entidade paraestatal, e quem trabalha para empresa prestadora de serviço contratada ou conveniada para a execução de atividade típica da Administração Pública.(Incluído pela Lei nº 9.983, de 2000)"},{"k":"p","t":"§ 2º - A pena será aumentada da terça parte quando os autores dos crimes previstos neste Capítulo forem ocupantes de cargos em comissão ou de função de direção ou assessoramento de órgão da administração direta, sociedade de economia mista, empresa pública ou fundação instituída pelo poder público. (Incluído pela Lei nº 6.799, de 1980)"},{"k":"h","t":"CAPÍTULO II — DOS CRIMES PRATICADOS POR PARTICULAR CONTRA A ADMINISTRAÇÃO EM GERAL"},{"k":"h","t":"Usurpação de função pública"},{"k":"p","t":"Art. 328 - Usurpar o exercício de função pública:","v":["usurpar"]},{"k":"p","t":"Pena - detenção, de três meses a dois anos, e multa."},{"k":"p","t":"Parágrafo único - Se do fato o agente aufere vantagem:"},{"k":"p","t":"Pena - reclusão, de dois a cinco anos, e multa."},{"k":"h","t":"Resistência"},{"k":"p","t":"Art. 329 - Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio:","v":["opor-se"]},{"k":"p","t":"Pena - detenção, de dois meses a dois anos."},{"k":"p","t":"§ 1º - Se o ato, em razão da resistência, não se executa:"},{"k":"p","t":"Pena - reclusão, de um a três anos."},{"k":"p","t":"§ 2º - As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência."},{"k":"h","t":"Desobediência"},{"k":"p","t":"Art. 330 - Desobedecer a ordem legal de funcionário público:","v":["desobedecer"]},{"k":"p","t":"Pena - detenção, de quinze dias a seis meses, e multa."},{"k":"h","t":"Desacato"},{"k":"p","t":"Art. 331 - Desacatar funcionário público no exercício da função ou em razão dela:","v":["desacatar"]},{"k":"p","t":"Pena - detenção, de seis meses a dois anos, ou multa. Tráfico de Influência (Redação dada pela Lei nº 9.127, de 1995)"},{"k":"p","t":"Art. 332 - Solicitar, exigir, cobrar ou obter, para si ou para outrem, vantagem ou promessa de vantagem, a pretexto de influir em ato praticado por funcionário público no exercício da função: (Redação dada pela Lei nº 9.127, de 1995)","v":["solicitar","exigir","cobrar","obter"]},{"k":"p","t":"Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa. (Redação dada pela Lei nº 9.127, de 1995)"},{"k":"p","t":"Parágrafo único - A pena é aumentada da metade, se o agente alega ou insinua que a vantagem é também destinada ao funcionário. (Redação dada pela Lei nº 9.127, de 1995)"},{"k":"h","t":"Corrupção ativa"},{"k":"p","t":"Art. 333 - Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício:","v":["oferecer","prometer"]},{"k":"p","t":"Pena – reclusão, de 2 (dois) a 12 (doze) anos, e multa. (Redação dada pela Lei nº 10.763, de 12.11.2003)"},{"k":"p","t":"Parágrafo único - A pena é aumentada de um terço, se, em razão da vantagem ou promessa, o funcionário retarda ou omite ato de ofício, ou o pratica infringindo dever funcional."},{"k":"h","t":"Inutilização de edital ou de sinal"},{"k":"p","t":"Art. 336 - Rasgar ou, de qualquer forma, inutilizar ou conspurcar edital afixado por ordem de funcionário público; violar ou inutilizar selo ou sinal empregado, por determinação legal ou por ordem de funcionário público, para identificar ou cerrar qualquer objeto:","v":["rasgar","inutilizar","conspurcar","violar"]},{"k":"p","t":"Pena - detenção, de um mês a um ano, ou multa."},{"k":"h","t":"Subtração ou inutilização de livro ou documento"},{"k":"p","t":"Art. 337 - Subtrair, ou inutilizar, total ou parcialmente, livro oficial, processo ou documento confiado à custódia de funcionário, em razão de ofício, ou de particular em serviço público:","v":["subtrair","inutilizar"]},{"k":"p","t":"Pena - reclusão, de dois a cinco anos, se o fato não constitui crime mais grave."}]},{"id":"s2","title":"CAPÍTULO III — DOS CRIMES CONTRA A ADMINISTRAÇÃO DA JUSTIÇA · arts. 339 a 359","tag":"","b":[{"k":"h","t":"CAPÍTULO III — DOS CRIMES CONTRA A ADMINISTRAÇÃO DA JUSTIÇA"},{"k":"h","t":"Denunciação caluniosa"},{"k":"p","t":"Art. 339. Dar causa à instauração de inquérito policial, de procedimento investigatório criminal, de processo judicial, de processo administrativo disciplinar, de inquérito civil ou de ação de improbidade administrativa contra alguém, imputando-lhe crime, infração ético-disciplinar ou ato ímprobo de que o sabe inocente: (Redação dada pela Lei nº 14.110, de 2020)","v":["dar causa"]},{"k":"p","t":"Pena - reclusão, de dois a oito anos, e multa."},{"k":"p","t":"§ 1º - A pena é aumentada de sexta parte, se o agente se serve de anonimato ou de nome suposto."},{"k":"p","t":"§ 2º - A pena é diminuída de metade, se a imputação é de prática de contravenção."},{"k":"h","t":"Comunicação falsa de crime ou de contravenção"},{"k":"p","t":"Art. 340 - Provocar a ação de autoridade, comunicando-lhe a ocorrência de crime ou de contravenção que sabe não se ter verificado:","v":["provocar"]},{"k":"p","t":"Pena - detenção, de um a seis meses, ou multa."},{"k":"h","t":"Auto-acusação falsa"},{"k":"p","t":"Art. 341 - Acusar-se, perante a autoridade, de crime inexistente ou praticado por outrem:","v":["acusar-se"]},{"k":"p","t":"Pena - detenção, de três meses a dois anos, ou multa."},{"k":"h","t":"Falso testemunho ou falsa perícia"},{"k":"p","t":"Art. 342. Fazer afirmação falsa, ou negar ou calar a verdade como testemunha, perito, contador, tradutor ou intérprete em processo judicial, ou administrativo, inquérito policial, ou em juízo arbitral: (Redação dada pela Lei nº 10.268, de 28.8.2001)","v":["fazer afirmação falsa","negar","calar"]},{"k":"p","t":"Pena - reclusão, de 2 (dois) a 4 (quatro) anos, e multa. (Redação dada pela Lei nº 12.850, de 2013) (Vigência)"},{"k":"p","t":"§ 1o As penas aumentam-se de um sexto a um terço, se o crime é praticado mediante suborno ou se cometido com o fim de obter prova destinada a produzir efeito em processo penal, ou em processo civil em que for parte entidade da administração pública direta ou indireta.(Redação dada pela Lei nº 10.268, de 28.8.2001)"},{"k":"p","t":"§ 2o O fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o agente se retrata ou declara a verdade.(Redação dada pela Lei nº 10.268, de 28.8.2001)"},{"k":"p","t":"Art. 343. Dar, oferecer ou prometer dinheiro ou qualquer outra vantagem a testemunha, perito, contador, tradutor ou intérprete, para fazer afirmação falsa, negar ou calar a verdade em depoimento, perícia, cálculos, tradução ou interpretação: (Redação dada pela Lei nº 10.268, de 28.8.2001)","v":["dar","oferecer","prometer"]},{"k":"p","t":"Pena - reclusão, de três a quatro anos, e multa.(Redação dada pela Lei nº 10.268, de 28.8.2001)"},{"k":"p","t":"Parágrafo único. As penas aumentam-se de um sexto a um terço, se o crime é cometido com o fim de obter prova destinada a produzir efeito em processo penal ou em processo civil em que for parte entidade da administração pública direta ou indireta. (Redação dada pela Lei nº 10.268, de 28.8.2001)"},{"k":"h","t":"Coação no curso do processo"},{"k":"p","t":"Art. 344 - Usar de violência ou grave ameaça, com o fim de favorecer interesse próprio ou alheio, contra autoridade, parte, ou qualquer outra pessoa que funciona ou é chamada a intervir em processo judicial, policial ou administrativo, ou em juízo arbitral:","v":["usar"]},{"k":"p","t":"Pena - reclusão, de um a quatro anos, e multa, além da pena correspondente à violência."},{"k":"h","t":"Exercício arbitrário das próprias razões"},{"k":"p","t":"Art. 345 - Fazer justiça pelas próprias mãos, para satisfazer pretensão, embora legítima, salvo quando a lei o permite:","v":["fazer"]},{"k":"p","t":"Pena - detenção, de quinze dias a um mês, ou multa, além da pena correspondente à violência."},{"k":"p","t":"Parágrafo único - Se não há emprego de violência, somente se procede mediante queixa."},{"k":"p","t":"Art. 346 - Tirar, suprimir, destruir ou danificar coisa própria, que se acha em poder de terceiro por determinação judicial ou convenção:","v":["tirar","suprimir","destruir","danificar"]},{"k":"p","t":"Pena - detenção, de seis meses a dois anos, e multa."},{"k":"h","t":"Fraude processual"},{"k":"p","t":"Art. 347 - Inovar artificiosamente, na pendência de processo civil ou administrativo, o estado de lugar, de coisa ou de pessoa, com o fim de induzir a erro o juiz ou o perito:","v":["inovar"]},{"k":"p","t":"Pena - detenção, de três meses a dois anos, e multa."},{"k":"p","t":"Parágrafo único - Se a inovação se destina a produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em dobro."},{"k":"h","t":"Exploração de prestígio"},{"k":"p","t":"Art. 357 - Solicitar ou receber dinheiro ou qualquer outra utilidade, a pretexto de influir em juiz, jurado, órgão do Ministério Público, funcionário de justiça, perito, tradutor, intérprete ou testemunha:","v":["solicitar","receber"]},{"k":"p","t":"Pena - reclusão, de um a cinco anos, e multa."},{"k":"p","t":"Parágrafo único - As penas aumentam-se de um terço, se o agente alega ou insinua que o dinheiro ou utilidade também se destina a qualquer das pessoas referidas neste artigo."},{"k":"h","t":"Violência ou fraude em arrematação judicial"},{"k":"p","t":"Art. 358 - Impedir, perturbar ou fraudar arrematação judicial; afastar ou procurar afastar concorrente ou licitante, por meio de violência, grave ameaça, fraude ou oferecimento de vantagem:","v":["impedir","perturbar","fraudar","afastar"]},{"k":"p","t":"Pena - detenção, de dois meses a um ano, ou multa, além da pena correspondente à violência. Desobediência a decisão judicial sobre perda ou suspensão de direito"},{"k":"p","t":"Art. 359 - Exercer função, atividade, direito, autoridade ou múnus, de que foi suspenso ou privado por decisão judicial:","v":["exercer"]},{"k":"p","t":"Pena - detenção, de três meses a dois anos, ou multa."}]}],"cpp":[{"id":"s0","title":"Disposições iniciais · arts. 251 a 274","tag":"","b":[{"k":"p","t":"Decreto-Lei nº 3.689/1941 Código de Processo Penal."},{"k":"h","t":"TÍTULO VIII — DO JUIZ, DO MINISTÉRIO PÚBLICO, DO ACUSADO E DEFENSOR, DOS ASSISTENTES E AUXILIARES DA JUSTIÇA"},{"k":"h","t":"CAPÍTULO I — DO JUIZ"},{"k":"p","t":"Art. 251. Ao juiz incumbirá prover à regularidade do processo e manter a ordem no curso dos respectivos atos, podendo, para tal fim, requisitar a força pública."},{"k":"p","t":"Art. 252. O juiz não poderá exercer jurisdição no processo em que:"},{"k":"p","t":"I - tiver funcionado seu cônjuge ou parente, consangüíneo ou afim, em linha reta ou colateral até o terceiro grau, inclusive, como defensor ou advogado, órgão do Ministério Público, autoridade policial, auxiliar da justiça ou perito;"},{"k":"p","t":"II - ele próprio houver desempenhado qualquer dessas funções ou servido como testemunha;"},{"k":"p","t":"III - tiver funcionado como juiz de outra instância, pronunciando-se, de fato ou de direito, sobre a questão;"},{"k":"p","t":"IV - ele próprio ou seu cônjuge ou parente, consangüíneo ou afim em linha reta ou colateral até o terceiro grau, inclusive, for parte ou diretamente interessado no feito."},{"k":"p","t":"Art. 253. Nos juízos coletivos, não poderão servir no mesmo processo os juízes que forem entre si parentes, consangüíneos ou afins, em linha reta ou colateral até o terceiro grau, inclusive."},{"k":"p","t":"Art. 254. O juiz dar-se-á por suspeito, e, se não o fizer, poderá ser recusado por qualquer das partes:"},{"k":"p","t":"I - se for amigo íntimo ou inimigo capital de qualquer deles;"},{"k":"p","t":"II - se ele, seu cônjuge, ascendente ou descendente, estiver respondendo a processo por fato análogo, sobre cujo caráter criminoso haja controvérsia;"},{"k":"p","t":"III - se ele, seu cônjuge, ou parente, consangüíneo, ou afim, até o terceiro grau, inclusive, sustentar demanda ou responder a processo que tenha de ser julgado por qualquer das partes;"},{"k":"p","t":"IV - se tiver aconselhado qualquer das partes;"},{"k":"p","t":"V - se for credor ou devedor, tutor ou curador, de qualquer das partes; Vl - se for sócio, acionista ou administrador de sociedade interessada no processo."},{"k":"p","t":"Art. 255. O impedimento ou suspeição decorrente de parentesco por afinidade cessará pela dissolução do casamento que Ihe tiver dado causa, salvo sobrevindo descendentes; mas, ainda que dissolvido o casamento sem descendentes, não funcionará como juiz o sogro, o padrasto, o cunhado, o genro ou enteado de quem for parte no processo."},{"k":"p","t":"Art. 256. A suspeição não poderá ser declarada nem reconhecida, quando a parte injuriar o juiz ou de propósito der motivo para criá-la."},{"k":"h","t":"CAPÍTULO II — DO MINISTÉRIO PÚBLICO"},{"k":"p","t":"Art. 257. Ao Ministério Público cabe: (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"I - promover, privativamente, a ação penal pública, na forma estabelecida neste Código; e (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"II - fiscalizar a execução da lei. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 258. Os órgãos do Ministério Público não funcionarão nos processos em que o juiz ou qualquer das partes for seu cônjuge, ou parente, consangüíneo ou afim, em linha reta ou colateral, até o terceiro grau, inclusive, e a eles se estendem, no que Ihes for aplicável, as prescrições relativas à suspeição e aos impedimentos dos juízes."},{"k":"h","t":"CAPÍTULO III — DO ACUSADO E SEU DEFENSOR"},{"k":"p","t":"Art. 261. Nenhum acusado, ainda que ausente ou foragido, será processado ou julgado sem defensor."},{"k":"p","t":"Parágrafo único. A defesa técnica, quando realizada por defensor público ou dativo, será sempre exercida através de manifestação fundamentada. (Incluído pela Lei nº 10.792, de 1º.12.2003)"},{"k":"p","t":"Art. 262. Ao acusado menor dar-se-á curador."},{"k":"p","t":"Art. 263. Se o acusado não o tiver, ser-lhe-á nomeado defensor pelo juiz, ressalvado o seu direito de, a todo tempo, nomear outro de sua confiança, ou a si mesmo defender-se, caso tenha habilitação."},{"k":"p","t":"Parágrafo único. O acusado, que não for pobre, será obrigado a pagar os honorários do defensor dativo, arbitrados pelo juiz."},{"k":"p","t":"Art. 264. Salvo motivo relevante, os advogados e solicitadores serão obrigados, sob pena de multa de cem a quinhentos mil-réis, a prestar seu patrocínio aos acusados, quando nomeados pelo Juiz."},{"k":"p","t":"Art. 265. O defensor não poderá abandonar o processo senão por motivo imperioso, comunicado previamente o juiz, sob pena de multa de 10 (dez) a 100 (cem) salários mínimos, sem prejuízo das demais sanções cabíveis. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o A audiência poderá ser adiada se, por motivo justificado, o defensor não puder comparecer. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o Incumbe ao defensor provar o impedimento até a abertura da audiência. Não o fazendo, o juiz não determinará o adiamento de ato algum do processo, devendo nomear defensor substituto, ainda que provisoriamente ou só para o efeito do ato. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 266. A constituição de defensor independerá de instrumento de mandato, se o acusado o indicar por ocasião do interrogatório."},{"k":"p","t":"Art. 267. Nos termos do art. 252, não funcionarão como defensores os parentes do juiz."},{"k":"h","t":"CAPÍTULO V — DOS FUNCIONÁRIOS DA JUSTIÇA"},{"k":"p","t":"Art. 274. As prescrições sobre suspeição dos juízes estendem-se aos serventuários e funcionários da justiça, no que Ihes for aplicável."}]},{"id":"s1","title":"TÍTULO X — DAS CITAÇÕES E INTIMAÇÕES · arts. 351 a 372","tag":"","b":[{"k":"h","t":"TÍTULO X — DAS CITAÇÕES E INTIMAÇÕES"},{"k":"h","t":"CAPÍTULO I — DAS CITAÇÕES"},{"k":"p","t":"Art. 351. A citação inicial far-se-á por mandado, quando o réu estiver no território sujeito à jurisdição do juiz que a houver ordenado."},{"k":"p","t":"Art. 352. O mandado de citação indicará:"},{"k":"p","t":"I - o nome do juiz;"},{"k":"p","t":"II - o nome do querelante nas ações iniciadas por queixa;"},{"k":"p","t":"III - o nome do réu, ou, se for desconhecido, os seus sinais característicos;"},{"k":"p","t":"IV - a residência do réu, se for conhecida;"},{"k":"p","t":"V - o fim para que é feita a citação;"},{"k":"p","t":"VI - o juízo e o lugar, o dia e a hora em que o réu deverá comparecer;"},{"k":"p","t":"VII - a subscrição do escrivão e a rubrica do juiz."},{"k":"p","t":"Art. 353. Quando o réu estiver fora do território da jurisdição do juiz processante, será citado mediante precatória."},{"k":"p","t":"Art. 354. A precatória indicará:"},{"k":"p","t":"I - o juiz deprecado e o juiz deprecante;"},{"k":"p","t":"II - a sede da jurisdição de um e de outro; Ill - o fim para que é feita a citação, com todas as especificações;"},{"k":"p","t":"IV - o juízo do lugar, o dia e a hora em que o réu deverá comparecer."},{"k":"p","t":"Art. 355. A precatória será devolvida ao juiz deprecante, independentemente de traslado, depois de lançado o \"cumpra-se\" e de feita a citação por mandado do juiz deprecado."},{"k":"p","t":"§ 1o Verificado que o réu se encontra em território sujeito à jurisdição de outro juiz, a este remeterá o juiz deprecado os autos para efetivação da diligência, desde que haja tempo para fazer-se a citação."},{"k":"p","t":"§ 2o Certificado pelo oficial de justiça que o réu se oculta para não ser citado, a precatória será imediatamente devolvida, para o fim previsto no art. 362."},{"k":"p","t":"Art. 356. Se houver urgência, a precatória, que conterá em resumo os requisitos enumerados no art. 354, poderá ser expedida por via telegráfica, depois de reconhecida a firma do juiz, o que a estação expedidora mencionará."},{"k":"p","t":"Art. 357. São requisitos da citação por mandado:"},{"k":"p","t":"I - leitura do mandado ao citando pelo oficial e entrega da contrafé, na qual se mencionarão dia e hora da citação;"},{"k":"p","t":"II - declaração do oficial, na certidão, da entrega da contrafé, e sua aceitação ou recusa."},{"k":"p","t":"Art. 358. A citação do militar far-se-á por intermédio do chefe do respectivo serviço."},{"k":"p","t":"Art. 359. O dia designado para funcionário público comparecer em juízo, como acusado, será notificado assim a ele como ao chefe de sua repartição."},{"k":"p","t":"Art. 360. Se o réu estiver preso, será pessoalmente citado. (Redação dada pela Lei nº 10.792, de 1º.12.2003)"},{"k":"p","t":"Art. 361. Se o réu não for encontrado, será citado por edital, com o prazo de 15 (quinze) dias."},{"k":"p","t":"Art. 362. Verificando que o réu se oculta para não ser citado, o oficial de justiça certificará a ocorrência e procederá à citação com hora certa, na forma estabelecida nos arts. 227 a 229 da Lei no 5.869, de 11 de janeiro de 1973 - Código de Processo Civil. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Parágrafo único. Completada a citação com hora certa, se o acusado não comparecer, ser-lhe-á nomeado defensor dativo. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 363. O processo terá completada a sua formação quando realizada a citação do acusado. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"I - (revogado); (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"II - (revogado). (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o Não sendo encontrado o acusado, será procedida a citação por edital. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o (VETADO) (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 3o (VETADO) (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 4o Comparecendo o acusado citado por edital, em qualquer tempo, o processo observará o disposto nos arts. 394 e seguintes deste Código. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 364. No caso do artigo anterior, no I, o prazo será fixado pelo juiz entre 15 (quinze) e 90 (noventa) dias, de acordo com as circunstâncias, e, no caso de no II, o prazo será de trinta dias."},{"k":"p","t":"Art. 365. O edital de citação indicará:"},{"k":"p","t":"I - o nome do juiz que a determinar;"},{"k":"p","t":"II - o nome do réu, ou, se não for conhecido, os seus sinais característicos, bem como sua residência e profissão, se constarem do processo;"},{"k":"p","t":"III - o fim para que é feita a citação;"},{"k":"p","t":"IV - o juízo e o dia, a hora e o lugar em que o réu deverá comparecer;"},{"k":"p","t":"V - o prazo, que será contado do dia da publicação do edital na imprensa, se houver, ou da sua afixação."},{"k":"p","t":"Parágrafo único. O edital será afixado à porta do edifício onde funcionar o juízo e será publicado pela imprensa, onde houver, devendo a afixação ser certificada pelo oficial que a tiver feito e a publicação provada por exemplar do jornal ou certidão do escrivão, da qual conste a página do jornal com a data da publicação."},{"k":"p","t":"Art. 366. Se o acusado, citado por edital, não comparecer, nem constituir advogado, ficarão suspensos o processo e o curso do prazo prescricional, podendo o juiz determinar a produção antecipada das provas consideradas urgentes e, se for o caso, decretar prisão preventiva, nos termos do disposto no art. 312. (Redação dada pela Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"§ 1o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 367. O processo seguirá sem a presença do acusado que, citado ou intimado pessoalmente para qualquer ato, deixar de comparecer sem motivo justificado, ou, no caso de mudança de residência, não comunicar o novo endereço ao juízo. (Redação dada pela Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"Art. 368. Estando o acusado no estrangeiro, em lugar sabido, será citado mediante carta rogatória, suspendendo-se o curso do prazo de prescrição até o seu cumprimento. (Redação dada pela Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"Art. 369. As citações que houverem de ser feitas em legações estrangeiras serão efetuadas mediante carta rogatória. (Redação dada pela Lei nº 9.271, de 17.4.1996)"},{"k":"h","t":"CAPÍTULO II — DAS INTIMAÇÕES"},{"k":"p","t":"Art. 370. Nas intimações dos acusados, das testemunhas e demais pessoas que devam tomar conhecimento de qualquer ato, será observado, no que for aplicável, o disposto no Capítulo anterior. (Redação dada pela Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"§ 1o A intimação do defensor constituído, do advogado do querelante e do assistente far-se-á por publicação no órgão incumbido da publicidade dos atos judiciais da comarca, incluindo, sob pena de nulidade, o nome do acusado. (Incluído Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"§ 2o Caso não haja órgão de publicação dos atos judiciais na comarca, a intimação far-se-á diretamente pelo escrivão, por mandado, ou via postal com comprovante de recebimento, ou por qualquer outro meio idôneo. (Redação dada pela Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"§ 3o A intimação pessoal, feita pelo escrivão, dispensará a aplicação a que alude o"},{"k":"p","t":"§ 1o. (Incluído pela Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"§ 4o A intimação do Ministério Público e do defensor nomeado será pessoal. (Incluído pela Lei nº 9.271, de 17.4.1996)"},{"k":"p","t":"Art. 371. Será admissível a intimação por despacho na petição em que for requerida, observado o disposto no art. 357."},{"k":"p","t":"Art. 372. Adiada, por qualquer motivo, a instrução criminal, o juiz marcará desde logo, na presença das partes e testemunhas, dia e hora para seu prosseguimento, do que se lavrará termo nos autos."}]},{"id":"s2","title":"LIVRO II — DOS PROCESSOS EM ESPÉCIE · arts. 394 a 421","tag":"","b":[{"k":"h","t":"LIVRO II — DOS PROCESSOS EM ESPÉCIE"},{"k":"h","t":"TÍTULO I — DO PROCESSO COMUM"},{"k":"h","t":"CAPÍTULO I — DA INSTRUÇÃO CRIMINAL"},{"k":"p","t":"Art. 394. O procedimento será comum ou especial. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o O procedimento comum será ordinário, sumário ou sumaríssimo: (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"I - ordinário, quando tiver por objeto crime cuja sanção máxima cominada for igual ou superior a 4 (quatro) anos de pena privativa de liberdade; (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"II - sumário, quando tiver por objeto crime cuja sanção máxima cominada seja inferior a 4 (quatro) anos de pena privativa de liberdade; (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"III - sumaríssimo, para as infrações penais de menor potencial ofensivo, na forma da lei. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o Aplica-se a todos os processos o procedimento comum, salvo disposições em contrário deste Código ou de lei especial. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 3o Nos processos de competência do Tribunal do Júri, o procedimento observará as disposições estabelecidas nos arts. 406 a 497 deste Código. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 4o As disposições dos arts. 395 a 398 deste Código aplicam-se a todos os procedimentos penais de primeiro grau, ainda que não regulados neste Código. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 5o Aplicam-se subsidiariamente aos procedimentos especial, sumário e sumaríssimo as disposições do procedimento ordinário. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 394-A. Os processos que apurem a prática de crime hediondo terão prioridade de tramitação em todas as instâncias. (Incluído pela Lei nº 13.285, de 2016)."},{"k":"p","t":"Art. 395. A denúncia ou queixa será rejeitada quando: (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"I - for manifestamente inepta; (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"II - faltar pressuposto processual ou condição para o exercício da ação penal; ou (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"III - faltar justa causa para o exercício da ação penal. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Parágrafo único. (Revogado). (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 396. Nos procedimentos ordinário e sumário, oferecida a denúncia ou queixa, o juiz, se não a rejeitar liminarmente, recebê-la-á e ordenará a citação do acusado para responder à acusação, por escrito, no prazo de 10 (dez) dias. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Parágrafo único. No caso de citação por edital, o prazo para a defesa começará a fluir a partir do comparecimento pessoal do acusado ou do defensor constituído. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 396-A. Na resposta, o acusado poderá argüir preliminares e alegar tudo o que interesse à sua defesa, oferecer documentos e justificações, especificar as provas pretendidas e arrolar testemunhas, qualificando-as e requerendo sua intimação, quando necessário. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o A exceção será processada em apartado, nos termos dos arts. 95 a 112 deste Código. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o Não apresentada a resposta no prazo legal, ou se o acusado, citado, não constituir defensor, o juiz nomeará defensor para oferecê-la, concedendo-lhe vista dos autos por 10 (dez) dias. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 397. Após o cumprimento do disposto no art. 396-A, e parágrafos, deste Código, o juiz deverá absolver sumariamente o acusado quando verificar: (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"I - a existência manifesta de causa excludente da ilicitude do fato; (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"II - a existência manifesta de causa excludente da culpabilidade do agente, salvo inimputabilidade; (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"III - que o fato narrado evidentemente não constitui crime; ou (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"IV - extinta a punibilidade do agente. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 398. (Revogado pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 399. Recebida a denúncia ou queixa, o juiz designará dia e hora para a audiência, ordenando a intimação do acusado, de seu defensor, do Ministério Público e, se for o caso, do querelante e do assistente. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o O acusado preso será requisitado para comparecer ao interrogatório, devendo o poder público providenciar sua apresentação. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o O juiz que presidiu a instrução deverá proferir a sentença. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 400. Na audiência de instrução e julgamento, a ser realizada no prazo máximo de 60 (sessenta) dias, proceder-se-á à tomada de declarações do ofendido, à inquirição das testemunhas arroladas pela acusação e pela defesa, nesta ordem, ressalvado o disposto no art. 222 deste Código, bem como aos esclarecimentos dos peritos, às acareações e ao reconhecimento de pessoas e coisas, interrogando-se, em seguida, o acusado. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o As provas serão produzidas numa só audiência, podendo o juiz indeferir as consideradas irrelevantes, impertinentes ou protelatórias. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o Os esclarecimentos dos peritos dependerão de prévio requerimento das partes. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 400-A. Na audiência de instrução e julgamento, e, em especial, nas que apurem crimes contra a dignidade sexual, todas as partes e demais sujeitos processuais presentes no ato deverão zelar pela integridade física e psicológica da vítima, sob pena de responsabilização civil, penal e administrativa, cabendo ao juiz garantir o cumprimento do disposto neste artigo, vedadas: (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"I - a manifestação sobre circunstâncias ou elementos alheios aos fatos objeto de apuração nos autos; (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"II - a utilização de linguagem, de informações ou de material que ofendam a dignidade da vítima ou de testemunhas. (Incluído pela Lei nº 14.245, de 2021)"},{"k":"p","t":"Art. 401. Na instrução poderão ser inquiridas até 8 (oito) testemunhas arroladas pela acusação e 8 (oito) pela defesa. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o Nesse número não se compreendem as que não prestem compromisso e as referidas. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o A parte poderá desistir da inquirição de qualquer das testemunhas arroladas, ressalvado o disposto no art. 209 deste Código. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 402. Produzidas as provas, ao final da audiência, o Ministério Público, o querelante e o assistente e, a seguir, o acusado poderão requerer diligências cuja necessidade se origine de circunstâncias ou fatos apurados na instrução. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 403. Não havendo requerimento de diligências, ou sendo indeferido, serão oferecidas alegações finais orais por 20 (vinte) minutos, respectivamente, pela acusação e pela defesa, prorrogáveis por mais 10 (dez), proferindo o juiz, a seguir, sentença. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o Havendo mais de um acusado, o tempo previsto para a defesa de cada um será individual. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o Ao assistente do Ministério Público, após a manifestação desse, serão concedidos 10 (dez) minutos, prorrogando-se por igual período o tempo de manifestação da defesa. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 3o O juiz poderá, considerada a complexidade do caso ou o número de acusados, conceder às partes o prazo de 5 (cinco) dias sucessivamente para a apresentação de memoriais. Nesse caso, terá o prazo de 10 (dez) dias para proferir a sentença. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 404. Ordenado diligência considerada imprescindível, de ofício ou a requerimento da parte, a audiência será concluída sem as alegações finais. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Parágrafo único. Realizada, em seguida, a diligência determinada, as partes apresentarão, no prazo sucessivo de 5 (cinco) dias, suas alegações finais, por memorial, e, no prazo de 10 (dez) dias, o juiz proferirá a sentença. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"Art. 405. Do ocorrido em audiência será lavrado termo em livro próprio, assinado pelo juiz e pelas partes, contendo breve resumo dos fatos relevantes nela ocorridos. (Redação dada pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 1o Sempre que possível, o registro dos depoimentos do investigado, indiciado, ofendido e testemunhas será feito pelos meios ou recursos de gravação magnética, estenotipia, digital ou técnica similar, inclusive audiovisual, destinada a obter maior fidelidade das informações . (Incluído pela Lei nº 11.719, de 2008)."},{"k":"p","t":"§ 2o No caso de registro por meio audiovisual, será encaminhado às partes cópia do registro original, sem necessidade de transcrição. (Incluído pela Lei nº 11.719, de 2008)."},{"k":"h","t":"CAPÍTULO II"},{"k":"p","t":"(Redação Dada Pela Lei Nº 11.689, de 2008)"},{"k":"h","t":"DO PROCEDIMENTO RELATIVO AOS PROCESSOS"},{"k":"h","t":"DA COMPETÊNCIA DO TRIBUNAL DO JÚRI"},{"k":"h","t":"SEÇÃO I — DA ACUSAÇÃO E DA INSTRUÇÃO PRELIMINAR"},{"k":"p","t":"Art. 406. O juiz, ao receber a denúncia ou a queixa, ordenará a citação do acusado para responder a acusação, por escrito, no prazo de 10 (dez) dias. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O prazo previsto no caput deste artigo será contado a partir do efetivo cumprimento do mandado ou do comparecimento, em juízo, do acusado ou de defensor constituído, no caso de citação inválida ou por edital. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o A acusação deverá arrolar testemunhas, até o máximo de 8 (oito), na denúncia ou na queixa."},{"k":"p","t":"§ 3o Na resposta, o acusado poderá argüir preliminares e alegar tudo que interesse a sua defesa, oferecer documentos e justificações, especificar as provas pretendidas e arrolar testemunhas, até o máximo de 8 (oito), qualificando-as e requerendo sua intimação, quando necessário. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 407. As exceções serão processadas em apartado, nos termos dos arts. 95 a 112 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 408. Não apresentada a resposta no prazo legal, o juiz nomeará defensor para oferecê-la em até 10 (dez) dias, concedendo-lhe vista dos autos. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 409. Apresentada a defesa, o juiz ouvirá o Ministério Público ou o querelante sobre preliminares e documentos, em 5 (cinco) dias. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 410. O juiz determinará a inquirição das testemunhas e a realização das diligências requeridas pelas partes, no prazo máximo de 10 (dez) dias. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 411. Na audiência de instrução, proceder-se-á à tomada de declarações do ofendido, se possível, à inquirição das testemunhas arroladas pela acusação e pela defesa, nesta ordem, bem como aos esclarecimentos dos peritos, às acareações e ao reconhecimento de pessoas e coisas, interrogando-se, em seguida, o acusado e procedendo-se o debate. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Os esclarecimentos dos peritos dependerão de prévio requerimento e de deferimento pelo juiz. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o As provas serão produzidas em uma só audiência, podendo o juiz indeferir as consideradas irrelevantes, impertinentes ou protelatórias. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o Encerrada a instrução probatória, observar-se-á, se for o caso, o disposto no art. 384 deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 4o As alegações serão orais, concedendo-se a palavra, respectivamente, à acusação e à defesa, pelo prazo de 20 (vinte) minutos, prorrogáveis por mais 10 (dez). (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 5o Havendo mais de 1 (um) acusado, o tempo previsto para a acusação e a defesa de cada um deles será individual. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 6o Ao assistente do Ministério Público, após a manifestação deste, serão concedidos 10 (dez) minutos, prorrogando-se por igual período o tempo de manifestação da defesa. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 7o Nenhum ato será adiado, salvo quando imprescindível à prova faltante, determinando o juiz a condução coercitiva de quem deva comparecer. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 8o A testemunha que comparecer será inquirida, independentemente da suspensão da audiência, observada em qualquer caso a ordem estabelecida no caput deste artigo. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 9o Encerrados os debates, o juiz proferirá a sua decisão, ou o fará em 10 (dez) dias, ordenando que os autos para isso lhe sejam conclusos. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 412. O procedimento será concluído no prazo máximo de 90 (noventa) dias. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO II — DA PRONÚNCIA, DA IMPRONÚNCIA E DA ABSOLVIÇÃO SUMÁRIA"},{"k":"p","t":"(Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 413. O juiz, fundamentadamente, pronunciará o acusado, se convencido da materialidade do fato e da existência de indícios suficientes de autoria ou de participação. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o A fundamentação da pronúncia limitar-se-á à indicação da materialidade do fato e da existência de indícios suficientes de autoria ou de participação, devendo o juiz declarar o dispositivo legal em que julgar incurso o acusado e especificar as circunstâncias qualificadoras e as causas de aumento de pena. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Se o crime for afiançável, o juiz arbitrará o valor da fiança para a concessão ou manutenção da liberdade provisória. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o O juiz decidirá, motivadamente, no caso de manutenção, revogação ou substituição da prisão ou medida restritiva de liberdade anteriormente decretada e, tratando-se de acusado solto, sobre a necessidade da decretação da prisão ou imposição de quaisquer das medidas previstas no Título IX do Livro I deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 414. Não se convencendo da materialidade do fato ou da existência de indícios suficientes de autoria ou de participação, o juiz, fundamentadamente, impronunciará o acusado. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Enquanto não ocorrer a extinção da punibilidade, poderá ser formulada nova denúncia ou queixa se houver prova nova. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 415. O juiz, fundamentadamente, absolverá desde logo o acusado, quando: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – provada a inexistência do fato; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – provado não ser ele autor ou partícipe do fato; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – o fato não constituir infração penal; (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IV – demonstrada causa de isenção de pena ou de exclusão do crime. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Não se aplica o disposto no inciso IV do caput deste artigo ao caso de inimputabilidade prevista no caput do art. 26 do Decreto-Lei no 2.848, de 7 de dezembro de 1940 – Código Penal, salvo quando esta for a única tese defensiva. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 416. Contra a sentença de impronúncia ou de absolvição sumária caberá apelação. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 417. Se houver indícios de autoria ou de participação de outras pessoas não incluídas na acusação, o juiz, ao pronunciar ou impronunciar o acusado, determinará o retorno dos autos ao Ministério Público, por 15 (quinze) dias, aplicável, no que couber, o art. 80 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 418. O juiz poderá dar ao fato definição jurídica diversa da constante da acusação, embora o acusado fique sujeito a pena mais grave. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 419. Quando o juiz se convencer, em discordância com a acusação, da existência de crime diverso dos referidos no § 1o do art. 74 deste Código e não for competente para o julgamento, remeterá os autos ao juiz que o seja. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Remetidos os autos do processo a outro juiz, à disposição deste ficará o acusado preso. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 420. A intimação da decisão de pronúncia será feita: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – pessoalmente ao acusado, ao defensor nomeado e ao Ministério Público; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – ao defensor constituído, ao querelante e ao assistente do Ministério Público, na forma do disposto no § 1o do art. 370 deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Será intimado por edital o acusado solto que não for encontrado. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 421. Preclusa a decisão de pronúncia, os autos serão encaminhados ao juiz presidente do Tribunal do Júri. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Ainda que preclusa a decisão de pronúncia, havendo circunstância superveniente que altere a classificação do crime, o juiz ordenará a remessa dos autos ao Ministério Público. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Em seguida, os autos serão conclusos ao juiz para decisão. (Incluído pela Lei nº 11.689, de 2008)"}]},{"id":"s3","title":"SEÇÃO III — DA PREPARAÇÃO DO PROCESSO PARA JULGAMENTO EM PLENÁRIO · arts. 422 a 446","tag":"","b":[{"k":"h","t":"SEÇÃO III — DA PREPARAÇÃO DO PROCESSO PARA JULGAMENTO EM PLENÁRIO"},{"k":"p","t":"(Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 422. Ao receber os autos, o presidente do Tribunal do Júri determinará a intimação do órgão do Ministério Público ou do querelante, no caso de queixa, e do defensor, para, no prazo de 5 (cinco) dias, apresentarem rol de testemunhas que irão depor em plenário, até o máximo de 5 (cinco), oportunidade em que poderão juntar documentos e requerer diligência. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 423. Deliberando sobre os requerimentos de provas a serem produzidas ou exibidas no plenário do júri, e adotadas as providências devidas, o juiz presidente: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – ordenará as diligências necessárias para sanar qualquer nulidade ou esclarecer fato que interesse ao julgamento da causa; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – fará relatório sucinto do processo, determinando sua inclusão em pauta da reunião do Tribunal do Júri. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 424. Quando a lei local de organização judiciária não atribuir ao presidente do Tribunal do Júri o preparo para julgamento, o juiz competente remeterlhe-á os autos do processo preparado até 5 (cinco) dias antes do sorteio a que se refere o art. 433 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Deverão ser remetidos, também, os processos preparados até o encerramento da reunião, para a realização de julgamento. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO IV — DO ALISTAMENTO DOS JURADOS"},{"k":"p","t":"(Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 425. Anualmente, serão alistados pelo presidente do Tribunal do Júri de 800 (oitocentos) a 1.500 (um mil e quinhentos) jurados nas comarcas de mais de 1.000.000 (um milhão) de habitantes, de 300 (trezentos) a 700 (setecentos) nas comarcas de mais de 100.000 (cem mil) habitantes e de 80 (oitenta) a 400 (quatrocentos) nas comarcas de menor população. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Nas comarcas onde for necessário, poderá ser aumentado o número de jurados e, ainda, organizada lista de suplentes, depositadas as cédulas em urna especial, com as cautelas mencionadas na parte final do § 3o do art. 426 deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o O juiz presidente requisitará às autoridades locais, associações de classe e de bairro, entidades associativas e culturais, instituições de ensino em geral, universidades, sindicatos, repartições públicas e outros núcleos comunitários a indicação de pessoas que reúnam as condições para exercer a função de jurado. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 426. A lista geral dos jurados, com indicação das respectivas profissões, será publicada pela imprensa até o dia 10 de outubro de cada ano e divulgada em editais afixados à porta do Tribunal do Júri. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o A lista poderá ser alterada, de ofício ou mediante reclamação de qualquer do povo ao juiz presidente até o dia 10 de novembro, data de sua publicação definitiva. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Juntamente com a lista, serão transcritos os arts. 436 a 446 deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o Os nomes e endereços dos alistados, em cartões iguais, após serem verificados na presença do Ministério Público, de advogado indicado pela Seção local da Ordem dos Advogados do Brasil e de defensor indicado pelas Defensorias Públicas competentes, permanecerão guardados em urna fechada a chave, sob a responsabilidade do juiz presidente. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 4o O jurado que tiver integrado o Conselho de Sentença nos 12 (doze) meses que antecederem à publicação da lista geral fica dela excluído. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 5o Anualmente, a lista geral de jurados será, obrigatoriamente, completada. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO V — DO DESAFORAMENTO"},{"k":"p","t":"(Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 427. Se o interesse da ordem pública o reclamar ou houver dúvida sobre a imparcialidade do júri ou a segurança pessoal do acusado, o Tribunal, a requerimento do Ministério Público, do assistente, do querelante ou do acusado ou mediante representação do juiz competente, poderá determinar o desaforamento do julgamento para outra comarca da mesma região, onde não existam aqueles motivos, preferindo-se as mais próximas. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O pedido de desaforamento será distribuído imediatamente e terá preferência de julgamento na Câmara ou Turma competente. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Sendo relevantes os motivos alegados, o relator poderá determinar, fundamentadamente, a suspensão do julgamento pelo júri. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o Será ouvido o juiz presidente, quando a medida não tiver sido por ele solicitada. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 4o Na pendência de recurso contra a decisão de pronúncia ou quando efetivado o julgamento, não se admitirá o pedido de desaforamento, salvo, nesta última hipótese, quanto a fato ocorrido durante ou após a realização de julgamento anulado. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 428. O desaforamento também poderá ser determinado, em razão do comprovado excesso de serviço, ouvidos o juiz presidente e a parte contrária, se o julgamento não puder ser realizado no prazo de 6 (seis) meses, contado do trânsito em julgado da decisão de pronúncia. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Para a contagem do prazo referido neste artigo, não se computará o tempo de adiamentos, diligências ou incidentes de interesse da defesa. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Não havendo excesso de serviço ou existência de processos aguardando julgamento em quantidade que ultrapasse a possibilidade de apreciação pelo Tribunal do Júri, nas reuniões periódicas previstas para o exercício, o acusado poderá requerer ao Tribunal que determine a imediata realização do julgamento. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO VI — DA ORGANIZAÇÃO DA PAUTA"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 429. Salvo motivo relevante que autorize alteração na ordem dos julgamentos, terão preferência: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – os acusados presos; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – dentre os acusados presos, aqueles que estiverem há mais tempo na prisão; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – em igualdade de condições, os precedentemente pronunciados. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Antes do dia designado para o primeiro julgamento da reunião periódica, será afixada na porta do edifício do Tribunal do Júri a lista dos processos a serem julgados, obedecida a ordem prevista no caput deste artigo. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o O juiz presidente reservará datas na mesma reunião periódica para a inclusão de processo que tiver o julgamento adiado. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 430. O assistente somente será admitido se tiver requerido sua habilitação até 5 (cinco) dias antes da data da sessão na qual pretenda atuar. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 431. Estando o processo em ordem, o juiz presidente mandará intimar as partes, o ofendido, se for possível, as testemunhas e os peritos, quando houver requerimento, para a sessão de instrução e julgamento, observando, no que couber, o disposto no art. 420 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO VII — DO SORTEIO E DA CONVOCAÇÃO DOS JURADOS"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 432. Em seguida à organização da pauta, o juiz presidente determinará a intimação do Ministério Público, da Ordem dos Advogados do Brasil e da Defensoria Pública para acompanharem, em dia e hora designados, o sorteio dos jurados que atuarão na reunião periódica. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 433. O sorteio, presidido pelo juiz, far-se-á a portas abertas, cabendo-lhe retirar as cédulas até completar o número de 25 (vinte e cinco) jurados, para a reunião periódica ou extraordinária. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O sorteio será realizado entre o 15o (décimo quinto) e o 10o (décimo) dia útil antecedente à instalação da reunião. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o A audiência de sorteio não será adiada pelo não comparecimento das partes. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 3o O jurado não sorteado poderá ter o seu nome novamente incluído para as reuniões futuras. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 434. Os jurados sorteados serão convocados pelo correio ou por qualquer outro meio hábil para comparecer no dia e hora designados para a reunião, sob as penas da lei. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. No mesmo expediente de convocação serão transcritos os arts. 436 a 446 deste Código. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 435. Serão afixados na porta do edifício do Tribunal do Júri a relação dos jurados convocados, os nomes do acusado e dos procuradores das partes, além do dia, hora e local das sessões de instrução e julgamento. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO VIII — DA FUNÇÃO DO JURADO"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 436. O serviço do júri é obrigatório. O alistamento compreenderá os cidadãos maiores de 18 (dezoito) anos de notória idoneidade. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Nenhum cidadão poderá ser excluído dos trabalhos do júri ou deixar de ser alistado em razão de cor ou etnia, raça, credo, sexo, profissão, classe social ou econômica, origem ou grau de instrução. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o A recusa injustificada ao serviço do júri acarretará multa no valor de 1 (um) a 10 (dez) salários mínimos, a critério do juiz, de acordo com a condição econômica do jurado. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 437. Estão isentos do serviço do júri: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – o Presidente da República e os Ministros de Estado; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – os Governadores e seus respectivos Secretários; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – os membros do Congresso Nacional, das Assembléias Legislativas e das Câmaras Distrital e Municipais; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IV – os Prefeitos Municipais; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"V – os Magistrados e membros do Ministério Público e da Defensoria Pública; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VI – os servidores do Poder Judiciário, do Ministério Público e da Defensoria Pública; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VII – as autoridades e os servidores da polícia e da segurança pública; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VIII – os militares em serviço ativo; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IX – os cidadãos maiores de 70 (setenta) anos que requeiram sua dispensa; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"X – aqueles que o requererem, demonstrando justo impedimento. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 438. A recusa ao serviço do júri fundada em convicção religiosa, filosófica ou política importará no dever de prestar serviço alternativo, sob pena de suspensão dos direitos políticos, enquanto não prestar o serviço imposto. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Entende-se por serviço alternativo o exercício de atividades de caráter administrativo, assistencial, filantrópico ou mesmo produtivo, no Poder Judiciário, na Defensoria Pública, no Ministério Público ou em entidade conveniada para esses fins. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o O juiz fixará o serviço alternativo atendendo aos princípios da proporcionalidade e da razoabilidade. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 439. O exercício efetivo da função de jurado constituirá serviço público relevante e estabelecerá presunção de idoneidade moral. (Redação dada pela Lei nº 12.403, de 2011)."},{"k":"p","t":"Art. 440. Constitui também direito do jurado, na condição do art. 439 deste Código, preferência, em igualdade de condições, nas licitações públicas e no provimento, mediante concurso, de cargo ou função pública, bem como nos casos de promoção funcional ou remoção voluntária. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 441. Nenhum desconto será feito nos vencimentos ou salário do jurado sorteado que comparecer à sessão do júri. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 442. Ao jurado que, sem causa legítima, deixar de comparecer no dia marcado para a sessão ou retirar-se antes de ser dispensado pelo presidente será aplicada multa de 1 (um) a 10 (dez) salários mínimos, a critério do juiz, de acordo com a sua condição econômica. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 443. Somente será aceita escusa fundada em motivo relevante devidamente comprovado e apresentada, ressalvadas as hipóteses de força maior, até o momento da chamada dos jurados. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 444. O jurado somente será dispensado por decisão motivada do juiz presidente, consignada na ata dos trabalhos. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 445. O jurado, no exercício da função ou a pretexto de exercê-la, será responsável criminalmente nos mesmos termos em que o são os juízes togados. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 446. Aos suplentes, quando convocados, serão aplicáveis os dispositivos referentes às dispensas, faltas e escusas e à equiparação de responsabilidade penal prevista no art. 445 deste Código. (Redação dada pela Lei nº 11.689, de 2008)"}]},{"id":"s4","title":"SEÇÃO IX — DA COMPOSIÇÃO DO TRIBUNAL DO JÚRI E DA FORMAÇÃO DO CONSELHO DE SENTEN · arts. 447 a 481","tag":"","b":[{"k":"h","t":"SEÇÃO IX — DA COMPOSIÇÃO DO TRIBUNAL DO JÚRI E DA FORMAÇÃO DO CONSELHO DE SENTENÇA"},{"k":"p","t":"(Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 447. O Tribunal do Júri é composto por 1 (um) juiz togado, seu presidente e por 25 (vinte e cinco) jurados que serão sorteados dentre os alistados, 7 (sete) dos quais constituirão o Conselho de Sentença em cada sessão de julgamento. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 448. São impedidos de servir no mesmo Conselho: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – marido e mulher; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – ascendente e descendente; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – sogro e genro ou nora; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"IV – irmãos e cunhados, durante o cunhadio; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"V – tio e sobrinho; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"VI – padrasto, madrasta ou enteado. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o O mesmo impedimento ocorrerá em relação às pessoas que mantenham união estável reconhecida como entidade familiar. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 2o Aplicar-se-á aos jurados o disposto sobre os impedimentos, a suspeição e as incompatibilidades dos juízes togados. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 449. Não poderá servir o jurado que: (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"I – tiver funcionado em julgamento anterior do mesmo processo, independentemente da causa determinante do julgamento posterior; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"II – no caso do concurso de pessoas, houver integrado o Conselho de Sentença que julgou o outro acusado; (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"III – tiver manifestado prévia disposição para condenar ou absolver o acusado . (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 450. Dos impedidos entre si por parentesco ou relação de convivência, servirá o que houver sido sorteado em primeiro lugar. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 451. Os jurados excluídos por impedimento, suspeição ou incompatibilidade serão considerados para a constituição do número legal exigível para a realização da sessão. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 452. O mesmo Conselho de Sentença poderá conhecer de mais de um processo, no mesmo dia, se as partes o aceitarem, hipótese em que seus integrantes deverão prestar novo compromisso. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"h","t":"SEÇÃO X — DA REUNIÃO E DAS SESSÕES DO TRIBUNAL DO"},{"k":"p","t":"JÚRI (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 453. O Tribunal do Júri reunir-se-á para as sessões de instrução e julgamento nos períodos e na forma estabelecida pela lei local de organização judiciária. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 454. Até o momento de abertura dos trabalhos da sessão, o juiz presidente decidirá os casos de isenção e dispensa de jurados e o pedido de adiamento de julgamento, mandando consignar em ata as deliberações. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 455. Se o Ministério Público não comparecer, o juiz presidente adiará o julgamento para o primeiro dia desimpedido da mesma reunião, cientificadas as partes e as testemunhas. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Parágrafo único. Se a ausência não for justificada, o fato será imediatamente comunicado ao Procurador- Geral de Justiça com a data designada para a nova sessão. (Incluído pela Lei nº 11.689, de 2008)"},{"k":"p","t":"Art. 456. Se a falta, sem escusa legítima, for do advogado do acusado, e se outro não for por este constituído, o fato será imediatamente comunicado ao presidente da seccional da Ordem dos Advogados do Brasil, com a data designada para a nova sessão. (Redação dada pela Lei nº 11.689, de 2008)"},{"k":"p","t":"§ 1o Não havendo escusa legítima, o julgame
